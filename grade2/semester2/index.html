/* ==== world/blocks.js ==== */
/* ==== world/blocks.js — AUTHENTIC ScratchJr BLOCK SILHOUETTES + GLYPHS ====
 *
 * GRADE 2 SEMESTER 2.
 *
 * WHY THIS FILE EXISTS
 * --------------------
 * Until now a "block" in this platform was a rounded rectangle with a hand
 * drawn line icon. A pupil who learns on that picture does not recognise the
 * real application. Every visible block is therefore rebuilt here against the
 * Student Book plates and the supplied classroom screenshots:
 *
 *   · a real interlocking puzzle silhouette — a rounded NUB on the right edge
 *     and the exact negative NOTCH on the left edge, so two blocks visibly
 *     lock together and a block that cannot follow another (a trigger) simply
 *     has no notch to lock with;
 *   · the six official category colours sampled from the printed plates;
 *   · the official glyph of every block, drawn from primitives — no emoji,
 *     no generic substitute icon, no bitmap;
 *   · the number bubble hanging BELOW the block, centred, overlapping the
 *     bottom edge, exactly as printed;
 *   · Repeat as a real orange C shaped container that encloses its body;
 *   · Repeat Forever and Go to Page on the red END silhouette, whose right
 *     edge is a closed capsule cap and therefore carries no nub — that is how
 *     the book shows that nothing can follow them.
 *
 * VISUAL SOURCE OF TRUTH FOR EACH BLOCK is recorded in SRC below:
 *   'sb'   = seen in a rasterised Student Book page (page number given)
 *   'shot' = seen in one of the five supplied classroom screenshots
 *   'g1'   = taken from the approved Grade 1 simulator, no printed plate seen
 *   'conv' = ScratchJr convention only; no direct visual reference available
 * The delivery report prints this table verbatim, so no block is ever claimed
 * to match a page that was never actually seen.
 *
 * GEOMETRY (logical px, the whole app is scaled by ui.js, so px are stable)
 *   H     54  block height
 *   BODY  54  body width of a square block
 *   NUB   10 x 22, corner radius 5, vertically centred
 *   R      9  body corner radius
 * A standard block therefore occupies BODY + NUB = 64 px and overlaps its
 * neighbour by NUB px, which is what makes the row read as one locked script.
 */
(function (W) {
  'use strict';
  const { svg } = W.util;

  /* ---------------------------------------------------------------- metrics */
  const H = 54;          /* block height                         */
  const BODY = 54;       /* square body width                    */
  const NUB_W = 10;      /* nub depth (also the overlap)         */
  const NUB_H = 22;      /* nub height                           */
  const NUB_R = 5;       /* nub corner radius                    */
  const R = 9;           /* body corner radius                   */
  const SAY_BODY = 96;  /* the Say block carries a text field   */
  const REP_L = 26;      /* Repeat container: left post width    */
  const REP_R = 52;      /* Repeat container: right post width   */
  const REP_BAR = 16;    /* Repeat container: top bar height     */

  const M = { H, BODY, NUB_W, NUB_H, NUB_R, R, SAY_BODY, REP_L, REP_R, REP_BAR };

  /* ------------------------------------------------- official category colours
   * Sampled from the printed plates of the Grade 2 Semester 2 Student Book
   * (interface plate p.16, control palette p.24, trigger palette p.32,
   * looks palette p.40, end blocks p.66, script strip p.75).            */
  const COL = {
    trigger: '#F5EA12',
    motion: '#74D2F3',
    looks: '#CE5FB6',
    sound: '#88CD25',
    control: '#F9AF11',
    end: '#EA1C24',
  };
  /* the darker shade used for the "ghost" figure inside Grow / Shrink /
   * Reset Size / Hide — the book draws it as a darker wash of the body   */
  const GHOST = {
    trigger: '#D9CE00', motion: '#4FBCE4', looks: '#B44A9C',
    sound: '#6FB014', control: '#DE9500', end: '#C9101A',
  };

  /* ----------------------------------------------------------- shape paths */
  /* Every path is traced clockwise from the top-left. The nub and the notch
   * are exact negatives of one another, so a nub seats flush inside a notch. */

  function nubOut(bw, cy) {                 /* right edge: nub protrudes  */
    const y1 = cy - NUB_H / 2;
    return `V ${y1}` +
      ` h ${NUB_W - NUB_R} a ${NUB_R},${NUB_R} 0 0 1 ${NUB_R},${NUB_R}` +
      ` v ${NUB_H - 2 * NUB_R} a ${NUB_R},${NUB_R} 0 0 1 ${-NUB_R},${NUB_R}` +
      ` H ${bw}`;
  }
  function notchIn(cy) {                    /* left edge: notch bites in  */
    const y2 = cy + NUB_H / 2;
    return `V ${y2}` +
      ` h ${NUB_W - NUB_R} a ${NUB_R},${NUB_R} 0 0 0 ${NUB_R},${-NUB_R}` +
      ` v ${-(NUB_H - 2 * NUB_R)} a ${NUB_R},${NUB_R} 0 0 0 ${-NUB_R},${-NUB_R}` +
      ` H 0`;
  }

  /* standard block: notch on the left, nub on the right */
  function pathStd(bw) {
    const cy = H / 2;
    return `M ${R},0 H ${bw - R} A ${R},${R} 0 0 1 ${bw},${R} ` +
      nubOut(bw, cy) +
      ` V ${H - R} A ${R},${R} 0 0 1 ${bw - R},${H} H ${R} A ${R},${R} 0 0 1 0,${H - R} ` +
      notchIn(cy) +
      ` V ${R} A ${R},${R} 0 0 1 ${R},0 Z`;
  }

  /* trigger / head block: the left edge is a full semicircular cap, so nothing
   * can ever lock in FRONT of it — the book's way of saying "a script starts
   * here" (SB p.32 trigger palette). */
  function pathHead(bw) {
    const cy = H / 2;
    return `M ${cy},0 H ${bw - R} A ${R},${R} 0 0 1 ${bw},${R} ` +
      nubOut(bw, cy) +
      ` V ${H - R} A ${R},${R} 0 0 1 ${bw - R},${H} H ${cy}` +
      ` A ${cy},${cy} 0 0 1 ${cy},0 Z`;
  }

  /* end block: notch on the left, closed capsule cap on the right — no nub,
   * so nothing can follow it (SB p.66 Repeat Forever, p.56 Go to Page). */
  function pathEnd(bw) {
    const cy = H / 2;
    return `M ${R},0 H ${bw - cy} A ${cy},${cy} 0 0 1 ${bw - cy},${H}` +
      ` H ${R} A ${R},${R} 0 0 1 0,${H - R} ` +
      notchIn(cy) +
      ` V ${R} A ${R},${R} 0 0 1 ${R},0 Z`;
  }

  /* Repeat container, left post: notch on the left, flat on the right */
  function pathRepLeft(bw) {
    const cy = H / 2;
    return `M ${R},0 H ${bw} V ${H} H ${R} A ${R},${R} 0 0 1 0,${H - R} ` +
      notchIn(cy) +
      ` V ${R} A ${R},${R} 0 0 1 ${R},0 Z`;
  }
  /* Repeat container, right post: flat on the left, nub on the right */
  function pathRepRight(bw) {
    const cy = H / 2;
    return `M 0,0 H ${bw - R} A ${R},${R} 0 0 1 ${bw},${R} ` +
      nubOut(bw, cy) +
      ` V ${H - R} A ${R},${R} 0 0 1 ${bw - R},${H} H 0 Z`;
  }

  const SHAPES = {
    std: { path: pathStd, w: b => b + NUB_W },
    head: { path: pathHead, w: b => b + NUB_W },
    end: { path: pathEnd, w: b => b },
    repL: { path: pathRepLeft, w: b => b },
    repR: { path: pathRepRight, w: b => b + NUB_W },
  };

  /* Build the silhouette as its OWN svg sitting behind the glyph. It is not a
   * clip-path: a clip would also cut the number bubble, and it is not a
   * background-image: the shape must scale with the app's transform and stay
   * crisp on a Windows 10 school screen. */
  function shape(kind, bodyW, col) {
    const S = SHAPES[kind] || SHAPES.std;
    const w = S.w(bodyW);
    const g = svg('svg', {
      viewBox: `0 0 ${w} ${H}`, width: String(w), height: String(H),
      class: 'sj-shape', 'aria-hidden': 'true', 'data-shape': kind,
    });
    /* body */
    g.appendChild(svg('path', {
      d: S.path(bodyW), fill: col,
      stroke: 'rgba(0,0,0,.30)', 'stroke-width': '1.4', 'stroke-linejoin': 'round',
    }));
    /* the printed blocks carry a soft light band across the top and a darker
     * seat at the bottom; reproduced with two clipped overlays */
    const cid = 'sjclip' + (shape._n = (shape._n || 0) + 1);
    const cp = svg('clipPath', { id: cid });
    cp.appendChild(svg('path', { d: S.path(bodyW) }));
    g.appendChild(cp);
    g.appendChild(svg('rect', {
      x: '0', y: '0', width: String(w), height: String(H * 0.42),
      fill: '#FFFFFF', opacity: '.16', 'clip-path': `url(#${cid})`,
    }));
    g.appendChild(svg('rect', {
      x: '0', y: String(H - 6), width: String(w), height: '6',
      fill: '#000000', opacity: '.13', 'clip-path': `url(#${cid})`,
    }));
    return g;
  }

  /* ------------------------------------------------------------- glyph kit */
  /* Every glyph is drawn in a 40 x 40 box and centred on the block. */
  function G() {
    return svg('svg', { viewBox: '0 0 40 40', class: 'sj-glyph', 'aria-hidden': 'true' });
  }
  const add = (g, t, a) => { const n = svg(t, a); g.appendChild(n); return n; };
  const fill = (g, d, c, o) => add(g, 'path', { d, fill: c || '#FFFFFF', opacity: o == null ? '1' : String(o) });
  const line = (g, d, c, w, o) => add(g, 'path', {
    d, fill: 'none', stroke: c || '#FFFFFF', 'stroke-width': String(w || 3.6),
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    opacity: o == null ? '1' : String(o),
  });

  /* a standing person, the figure ScratchJr uses inside every Looks block:
   * round head, shoulders, straight body, two legs. cx/cy = centre, s = scale */
  function person(g, cx, cy, s, col, op) {
    const h = 30 * s;
    const top = cy - h / 2;
    add(g, 'circle', { cx: String(cx), cy: String(top + 4 * s), r: String(4.1 * s), fill: col, opacity: String(op) });
    fill(g, `M ${cx - 5.4 * s} ${top + 10 * s}
             h ${10.8 * s} v ${11 * s} h ${-3.1 * s} v ${9 * s} h ${-4.6 * s}
             v ${-9 * s} h ${-3.1 * s} z`.replace(/\s+/g, ' '), col, op);
    fill(g, `M ${cx - 2.4 * s} ${top + 21 * s} h ${4.8 * s} v ${9 * s} h ${-4.8 * s} z`, col, op);
  }

  /* The three motion dashes that trail a movement arrow (SB p.16 plate,
   * SB p.75 script strip):
   *   left / right movement -> three NARROW UPRIGHT bars side by side
   *   up   / down  movement -> three WIDE FLAT bars stacked               */
  function dashesV(g, x, cy) {              /* for the left/right arrows */
    [0, 6.2, 12.4].forEach(dx => add(g, 'rect', {
      x: String(x + dx), y: String(cy - 6.6), width: '4.2', height: '13.2',
      rx: '2.1', fill: '#FFFFFF',
    }));
  }
  function dashesH(g, cx, y) {              /* for the up/down arrows     */
    [0, 6.2, 12.4].forEach(dy => add(g, 'rect', {
      x: String(cx - 6.6), y: String(y + dy), width: '13.2', height: '4.2',
      rx: '2.1', fill: '#FFFFFF',
    }));
  }

  /* an open circular arrow; dir = +1 clockwise, -1 anticlockwise */
  function loopArrow(g, cx, cy, r, dir, col, wdt) {
    const c = col || '#FFFFFF';
    const sweep = dir > 0 ? 1 : 0;
    const a0 = dir > 0 ? -60 : 240;
    const a1 = dir > 0 ? 240 : -60;
    const P = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
    const s0 = P(a0), s1 = P(a1);
    add(g, 'path', {
      d: `M ${s0[0].toFixed(2)},${s0[1].toFixed(2)} A ${r},${r} 0 1 ${sweep} ${s1[0].toFixed(2)},${s1[1].toFixed(2)}`,
      fill: 'none', stroke: c, 'stroke-width': String(wdt || 4.4), 'stroke-linecap': 'round',
    });
    /* solid arrow head at the open end */
    const tip = P(a0);
    const t = (a0 + (dir > 0 ? 90 : -90)) * Math.PI / 180;
    const ux = Math.cos(t), uy = Math.sin(t);
    const px = -uy, py = ux;
    const L = 7.4, Wd = 5.6;
    fill(g, `M ${(tip[0] + ux * L).toFixed(2)},${(tip[1] + uy * L).toFixed(2)}
             L ${(tip[0] + px * Wd).toFixed(2)},${(tip[1] + py * Wd).toFixed(2)}
             L ${(tip[0] - px * Wd).toFixed(2)},${(tip[1] - py * Wd).toFixed(2)} Z`.replace(/\s+/g, ' '), c);
  }

  /* ------------------------------------------------------------ the glyphs */
  const GLYPH = {
    /* ---- التشغيل · trigger (yellow) ---- */
    START(g) {                                   /* green flag on a pole  */
      add(g, 'rect', { x: '8.6', y: '7', width: '3.4', height: '27', rx: '1.7', fill: '#2E7D46' });
      fill(g, 'M 12 8.4 h 19.4 v 13.6 q -4.9 2.4 -9.7 0 q -4.9 -2.4 -9.7 0 z', '#5AB773');
    },
    ON_TAP(g) {                                  /* a hand tapping        */
      person(g, 9.6, 14, 0.66, '#FFFFFF', 1);
      /* palm */
      fill(g, 'M 18.6 24.6 h 15.4 a 4.4 4.4 0 0 1 4.4 4.4 v 3.4 q 0 7.4 -9.6 7.4 h -3.6 q -5.4 0 -8 -4.2 l -4.4 -7 q -1.6 -2.6 1.4 -4.4 q 2.8 -1.6 4.4 1.1 z', '#FFFFFF');
      /* raised index finger */
      add(g, 'rect', { x: '18.2', y: '11.6', width: '4.6', height: '15', rx: '2.3', fill: '#FFFFFF' });
      /* the tap mark above the fingertip */
      line(g, 'M 20.4 8 v -3.6 M 15.6 9.4 l -2.4 -2.6 M 25.2 9.4 l 2.4 -2.6', '#FFFFFF', 2.4);
    },
    ON_BUMP(g) {                                 /* two figures colliding */
      const runner = (cx, dir, col) => {
        add(g, 'circle', { cx: String(cx + dir * 1.4), cy: '9.6', r: '3.9', fill: col });
        line(g, `M ${cx + dir * 1.2} 13.8 L ${cx - dir * 0.6} 23`, col, 4);
        line(g, `M ${cx - dir * 0.6} 23 L ${cx - dir * 5.6} 32.4`, col, 4);
        line(g, `M ${cx - dir * 0.6} 23 L ${cx + dir * 5.6} 29.6 L ${cx + dir * 6.4} 35`, col, 4);
        line(g, `M ${cx + dir * 0.6} 17.6 L ${cx - dir * 7.6} 15.4`, col, 4);
        line(g, `M ${cx + dir * 0.6} 17.6 L ${cx + dir * 7.4} 21.6`, col, 4);
      };
      runner(8.6, 1, '#FFFFFF');
      runner(31.4, -1, '#A38F00');
      /* the impact mark the book prints between them */
      line(g, 'M 20 12 v 4 M 16.4 14 l 2.6 2.6 M 23.6 14 l -2.6 2.6', '#FFFFFF', 2.4, .95);
    },
    ON_MSG(g) {                                  /* an OPEN envelope      */
      fill(g, 'M 5 14 h 30 v 19 a 2 2 0 0 1 -2 2 h -26 a 2 2 0 0 1 -2 -2 z', '#E8632A');
      fill(g, 'M 9.5 6 h 21 v 15 h -21 z', '#FFF8EC');
      line(g, 'M 13 10 h 14 M 13 14.5 h 10', '#C9541F', 2.2);
      fill(g, 'M 5 14 l 15 12 l 15 -12 v 3.4 l -15 12 l -15 -12 z', '#C9541F');
    },
    SEND_MSG(g) {                                /* a CLOSED envelope     */
      fill(g, 'M 12 11 h 24 a 2 2 0 0 1 2 2 v 16 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -16 a 2 2 0 0 1 2 -2 z', '#E8632A');
      line(g, 'M 11 12.4 L 24 22 L 37 12.4', '#FFF3E2', 2.4);
      line(g, 'M 1.5 15 h 6 M 0 21 h 7.5 M 1.5 27 h 6', '#FFFFFF', 2.6);
    },

    /* ---- الحركة · motion (blue) ---- */
    FWD(g) { dashesV(g, 2.6, 20); fill(g, 'M 21 8.6 L 38 20 L 21 31.4 v -6.6 h -3.4 v -9.6 h 3.4 z', '#FFFFFF'); },
    BACK(g) { dashesV(g, 21.2, 20); fill(g, 'M 19 8.6 L 2 20 L 19 31.4 v -6.6 h 3.4 v -9.6 h -3.4 z', '#FFFFFF'); },
    UP(g) { dashesH(g, 20, 21.2); fill(g, 'M 8.6 19 L 20 2 L 31.4 19 h -6.6 v 3.4 h -9.6 v -3.4 z', '#FFFFFF'); },
    DOWN(g) { dashesH(g, 20, 2.6); fill(g, 'M 8.6 21 L 20 38 L 31.4 21 h -6.6 v -3.4 h -9.6 v 3.4 z', '#FFFFFF'); },
    ROT_R(g) { loopArrow(g, 20, 21, 12, 1); },
    ROT_L(g) { loopArrow(g, 20, 21, 12, -1); },
    HOP(g) {                                     /* rise, then land again */
      line(g, 'M 6.5 32 q 7 -24 13.5 -24 q 6.5 0 13.5 24', '#FFFFFF', 4);
      fill(g, 'M 33.5 34.6 L 27.6 25.4 L 39.4 25.4 z', '#FFFFFF');
      add(g, 'rect', { x: '3', y: '31.2', width: '7', height: '4', rx: '2', fill: '#FFFFFF' });
    },
    GO_HOME(g) {                                 /* back to the start     */
      loopArrow(g, 20, 20, 12, -1);
      line(g, 'M 16 16 L 24 24 M 24 16 L 16 24', '#FFFFFF', 3.4);
    },

    /* ---- المظاهر · looks (purple) ---- */
    SAY(g) {
      fill(g, `M 5.5 6 h 29 a 4.5 4.5 0 0 1 4.5 4.5 v 12 a 4.5 4.5 0 0 1 -4.5 4.5
               h -17 l -8.5 7 v -7 h -3.5 a 4.5 4.5 0 0 1 -4.5 -4.5 v -12
               a 4.5 4.5 0 0 1 4.5 -4.5 z`.replace(/\s+/g, ' '), '#FFFFFF');
    },
    GROW(g, cat) {                               /* small ghost -> big    */
      person(g, 9.5, 26, 0.55, GHOST[cat] || '#B44A9C', 1);
      person(g, 25, 20, 1.22, '#FFFFFF', 1);
    },
    SHRINK(g, cat) {                             /* big ghost -> small    */
      person(g, 13, 20, 1.22, GHOST[cat] || '#B44A9C', 1);
      person(g, 29.5, 26, 0.55, '#FFFFFF', 1);
    },
    RESET_SZ(g, cat) {                           /* back to normal size   */
      person(g, 11, 21, 0.9, GHOST[cat] || '#B44A9C', 1);
      person(g, 27.5, 21, 0.9, '#FFFFFF', 1);
      line(g, 'M 3.6 34.6 h 32.8', '#FFFFFF', 2.4, .9);
    },
    HIDE(g, cat) {                               /* the object goes away  */
      person(g, 20, 20, 1.16, GHOST[cat] || '#B44A9C', 1);
      /* a dashed outline so Hide can never be read as Show at palette size */
      add(g, 'rect', {
        x: '7', y: '3.4', width: '26', height: '33.2', rx: '4',
        fill: 'none', stroke: '#FFFFFF', 'stroke-width': '2',
        'stroke-dasharray': '4 3.6', opacity: '.85',
      });
    },
    SHOW(g) { person(g, 20, 20, 1.16, '#FFFFFF', 1); },

    /* ---- الصوت · sound (green) ---- */
    POP(g) {
      fill(g, 'M 6 15 h 5.5 L 19 8 v 24 l -7.5 -7 H 6 z', '#FFFFFF');
      line(g, 'M 23 13.5 q 5 6.5 0 13 M 28 10 q 8 10 0 20 M 33 7 q 11 13 0 26', '#FFFFFF', 2.6);
    },
    PLAY_REC(g) {                                /* a microphone          */
      add(g, 'rect', { x: '15.4', y: '4', width: '9.2', height: '17', rx: '4.6', fill: '#FFFFFF' });
      line(g, 'M 10 19 a 10 10 0 0 0 20 0', '#FFFFFF', 3.4);
      line(g, 'M 20 29 v 6 M 14 35 h 12', '#FFFFFF', 3.4);
    },

    /* ---- التحكم · control (orange) ---- */
    WAIT(g) {                                    /* the printed clock     */
      add(g, 'rect', { x: '17.6', y: '3.4', width: '4.8', height: '3.4', rx: '1.6', fill: '#FFF3D6' });
      add(g, 'circle', { cx: '20', cy: '21.5', r: '14.4', fill: '#FFF8EC', stroke: '#C98A16', 'stroke-width': '2.2' });
      add(g, 'circle', { cx: '20', cy: '21.5', r: '11.4', fill: 'none', stroke: '#E3B45A', 'stroke-width': '1.2' });
      for (let i = 0; i < 12; i++) {
        const a = i * 30 * Math.PI / 180;
        add(g, 'rect', {
          x: '19.4', y: '9.2', width: '1.2', height: String(i % 3 === 0 ? 3.4 : 2),
          fill: '#C98A16', transform: `rotate(${i * 30} 20 21.5)`,
        });
      }
      line(g, 'M 20 21.5 L 20 13.6 M 20 21.5 L 26.4 24.4', '#8A5A08', 2.2);
      add(g, 'circle', { cx: '20', cy: '21.5', r: '1.7', fill: '#8A5A08' });
    },
    STOP(g) {                                    /* an open palm          */
      add(g, 'circle', { cx: '20', cy: '20', r: '15.4', fill: 'none', stroke: '#FFFFFF', 'stroke-width': '3' });
      /* four fingers of decreasing length plus a thumb, on one palm */
      [[15.2, 15.6], [18.4, 12.6], [21.6, 13.4], [24.8, 16.2]].forEach(f => {
        add(g, 'rect', { x: String(f[0]), y: String(f[1]), width: '3', height: String(27.4 - f[1]), rx: '1.5', fill: '#FFFFFF' });
      });
      fill(g, 'M 15.2 22.6 q -3.4 -2.6 -5 .4 q -1.2 2.2 1.4 4.2 l 3.6 2.8 z', '#FFFFFF');
      fill(g, 'M 14.6 22 h 13.2 v 4 q 0 5 -6.6 5 q -6.6 0 -6.6 -5 z', '#FFFFFF');
    },
    SET_SPEED(g) {                               /* a running figure      */
      add(g, 'circle', { cx: '24.4', cy: '8.6', r: '4', fill: '#FFFFFF' });
      line(g, 'M 24 13.4 L 21 23 M 21 23 L 15.4 32.6 M 21 23 L 27.6 30.4 L 28.4 36', '#FFFFFF', 3.8);
      line(g, 'M 22.6 17.4 L 13.6 15.4 M 22.6 17.4 L 30.6 21.6', '#FFFFFF', 3.8);
    },
    REPEAT(g) { loopArrow(g, 20, 20, 12, -1); },

    /* ---- النهاية · end (red) ----
     * END carries NO glyph: the book draws it as a bare red cap. */
    END() { },
    FOREVER(g) {                                 /* the endless loop      */
      /* two arrowheads on one ring — the book's «كَرِّرْ باسْتِمْرارٍ» mark */
      add(g, 'path', {
        d: 'M 8.6 16.4 A 12.4 12.4 0 0 1 31 13.2', fill: 'none',
        stroke: '#FFFFFF', 'stroke-width': '4.6', 'stroke-linecap': 'round',
      });
      add(g, 'path', {
        d: 'M 31.4 23.6 A 12.4 12.4 0 0 1 9 26.8', fill: 'none',

       * it then retires on its own, since it is a transient teaching aid. */

      const t0 = Date.now();
      const watch = () => {
        if (!chip.isConnected) return;
        verify();                       /* hides or removes if unsafe */
        if (!chip.isConnected) return;
        if (Date.now() - t0 > LIFE) { chip.remove(); W.scd.release(chip); return; }

     * is therefore permitted ONLY in calm, non-interactive scenes:

      if (!present.allowHoopoe) { present.hideHoopoe(); return null; }

        const nb = node.getBoundingClientRect();
        const rr = {
          x: (nb.left - hb.left) / k, y: (nb.top - hb.top) / k,
          w: nb.width / k, h: nb.height / k,
        };

        const hostW = hb.width / k, hostH = hb.height / k;

          { x: rr.x + rr.w + 24, y: rr.cy - BH / 2, dir: 'left' },
          { x: rr.x - BW - 24, y: rr.cy - BH / 2, dir: 'right' },
          { x: rr.cx - BW / 2, y: rr.y - BH - 24, dir: 'down' },
        ];

          && c.x + BW <= hostW - 4 && c.y + BH <= hostH - 4);

      document.querySelectorAll('.hoopoe').forEach(n => { n.remove(); W.scd.release(n); });

     * appended to the target and sized to it, it cannot float over unrelated

    clearFocus() {
      document.querySelectorAll('.focus-ring').forEach(n => { n.remove(); W.scd.release(n); });

    const apply = () => {
      const root = document.documentElement;
      if (!bar || !bar.isConnected) { root.style.setProperty('--instr-h', '0px'); return; }
      const txt = (bar.querySelector('.instr-ar') || {}).textContent || '';
      if (!txt.trim()) { root.style.setProperty('--instr-h', '0px'); return; }
      const h = Math.ceil(bar.getBoundingClientRect().height / (W.scale || 1));

    W.scd.raf(apply);
    W.scd.after(apply, 120);

/* ==== engine/ui.js ==== */
/* ==== engine/ui.js — responsive scaling + lesson frame ====
 * Design space is 1280x760, uniformly scaled by min(w/1280, h/760).
 * Typography minimums are chosen so that at 1366x768 (scale ~0.99) pupil-facing
 * Arabic body is >= 20px and action instructions are >= 26px AFTER scaling.

(function (W) {
  const { el } = W.util;
  const DW = 1280, DH = 760;

  function fit() {
    const inner = document.getElementById('stageInner');
    if (!inner) return;

    W.scale = k;
    /* Explicit pixel centring from a 0,0 origin. Direction-independent, so it
       behaves identically in the RTL document and never yields a negative
       origin that would push overlays outside the viewport.
       ORDER MATTERS: with transform-origin 0 0 the functions apply
       right-to-left, so scale() must be written FIRST for the translate to
       stay in real screen pixels. Writing translate() first multiplied the
       offset by k and pushed the surface off-screen at 1920x1080. */
    const x = Math.round((window.innerWidth - DW * k) / 2);
    const y = Math.round((window.innerHeight - DH * k) / 2);
    inner.style.transform = `scale(${k}) translate(${x / k}px,${y / k}px)`;
  }

      (stages || []).forEach((s, i) => rail.appendChild(
        el('div', { class: 'dot', 'data-i': i, title: s.rail || s.id }, [
          el('div', { class: 'bulb' }),
          el('div', { class: 'lbl', text: s.rail || '' }),

      const top = el('div', { class: 'lf-top' }, [
        el('button', {
          class: 'corner-btn no-cover', title: 'العودة إلى فهرس الدروس', 'aria-label': 'العودة',
          text: '⟵', onclick: () => { W.audio.click(); ctx.go('index', { unit: lesson.unit }); },

    /* FIELD FIX (defect 5) — EVERY ACTIVITY OF THE LESSON CAN BE OPENED.

    buildRail(rail, n, onJump) {

     * off and the pupil never saw the question or the answers underneath it.
     * Two things fix that together: the work area now scrolls (styles), and
     * every instructional figure carries a zoom control that opens it in a
     * large window with its own close button and its own scrolling.

     * on every figure in all fourteen lessons without touching lesson code.

      const scope = root || document;
      const figs = scope.querySelectorAll('figure[data-thart], .concept-fig, .thfig');
      figs.forEach(fig => {

      });

    },

    openArtZoom(fig) {

      if (!src) return;
      const clone = src.cloneNode(true);
      clone.removeAttribute('width'); clone.removeAttribute('height');
      clone.setAttribute('class', 'artzoom-svg');
      const capNode = fig.querySelector('figcaption');
      const cap = capNode ? capNode.textContent : (fig.getAttribute('aria-label') || '');

            close,
          ]),
          el('div', { class: 'artzoom-body' }, [clone]),
        ]),

      ov.addEventListener('click', e => { if (e.target === ov) W.ui.closeArtZoom(); });

      ov._esc = esc;
      document.addEventListener('keydown', esc);
      (document.getElementById('stageInner') || document.body).appendChild(ov);
      close.focus();
    },

    closeArtZoom() {
      const ov = document.querySelector('[data-artzoom]');
      if (!ov) return;
      if (ov._esc) document.removeEventListener('keydown', ov._esc);
      if (ov.parentNode) ov.parentNode.removeChild(ov);
    },

    /* large primary action button */
    bigBtn(label, onClick, kind) {
      return el('button', {
        class: 'bigbtn no-cover' + (kind ? ' ' + kind : ''),
        text: label,
        onclick: () => { W.audio.click(); onClick(); },
      });
    },
  };
})(window.WADI);

/* ==== engine/sjr.js ==== */
/* ==== engine/sjr.js — ScratchJr project model + deterministic executor ====
 *
 * GRADE 2 SEMESTER 2. The computational core of the whole platform.
 *
 * PURE MODEL: no DOM, no timers, no randomness. Given a project (pages,
 * objects, scripts) it computes exactly what every object does, step by step,
 * and produces a TIMELINE that the UI layer (studio.js) animates.
 *
 * Nothing in a lesson may succeed because a block is merely PRESENT. Lessons
 * ask this engine for computed results: positions, sizes, visibility, spoken
 * text and the elapsed time at which each event happened.
 *
 * ---------------------------------------------------------------------------
 * GRID MODEL
 *   Stage is cols x rows. x grows RIGHT, y grows DOWN, exactly as the squared
 *   backdrop printed in the Student Book (SB p.32, p.47).
 *
 * HEADING MODEL
 *   Rotation is in TWELFTHS of a turn (the 12-position clock the curriculum
 *   uses). heading 0 = facing right. Turn right adds, turn left subtracts.
 *   The book's default turn parameter is 3 twelfths = a quarter turn.
 *   Rotation changes FACING only; movement blocks always move along fixed
 *   screen axes. This matches the ScratchJr semantics the lessons teach.
 *
 * TIME MODEL  (Teacher's Guide p.32 — verified)
 *   The Wait block's value is in TENTHS of a second:
 *       value 10 = 1 second · 20 = 2 seconds · 30 = 3 seconds
 *   TG p.32 asks the pupil exactly this. WAIT_UNIT_MS below is therefore 100.
 *
 * CONCURRENCY
 *   ScratchJr runs every script of every object AT THE SAME TIME. Lesson 1.2
 *   depends on this: Tic speaks immediately while Toc is still waiting. The
 *   executor therefore advances all scripts on one shared clock rather than
 *   running one object to completion before starting the next.
 *
 * REPEAT / FOREVER
 *   REPEAT n runs the blocks nested inside it n times. FOREVER repeats the
 *   whole script endlessly; because a pure model cannot run forever, the
 *   executor unrolls it up to FOREVER_CYCLES and marks the timeline
 *   `looping:true` so the UI can loop the animation and offer a real Stop.
 * ---------------------------------------------------------------------------
 */

  const STEP_MS = 420;      /* one grid step of movement at NORMAL speed */
  const TURN_MS = 380;      /* legacy constant, kept for compatibility   */
  const TURN_STEP_MS = 180; /* ONE clock position                        */
  const HOP_BASE_MS = 520;  /* base duration of ONE jump; scales with height */
  const LOOK_MS = 320;      /* grow / shrink / hide ...                  */
  const SAY_MS = 1400;      /* how long a bubble stays                   */
  /* Repeat Forever is NOT faked by unrolling N cycles: the model emits ONE
   * cycle and marks the timeline looping, and the player repeats that cycle
   * until Stop / Reset / lesson exit / page change. */
  const FOREVER_CYCLES = 1;
  /* Set Speed multiplies every timed action in the script that set it. */
  const SPEED_FACTOR = { slow: 1.8, normal: 1, fast: 0.5 };

  const clampHeading = h => ((h % 12) + 12) % 12;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  let uid = 0;
  const nextId = p => p + '_' + (++uid);

  /* ================= PROJECT ================= */
  function create(spec) {
    spec = spec || {};
    const cols = spec.cols || 12, rows = spec.rows || 8;

    const project = {
      cols, rows,
      title: spec.title || '',
      titleColour: spec.titleColour || '#F2C230',
      titleSize: spec.titleSize || 2,
      titlePos: spec.titlePos || { x: 50, y: 8 },
      pages: [],
      currentPage: 0,
      running: false,
    };

    function addPage(p) {
      p = p || {};
      const page = {
        id: p.id || nextId('pg'),
        background: p.background || null,
        objects: [],
        selectedId: null,
      };
      project.pages.push(page);
      return page;
    }
    const page = i => project.pages[i == null ? project.currentPage : i];
    function setPage(i) {
      if (i < 0 || i >= project.pages.length) return false;
      project.currentPage = i; return true;
    }
    function removePage(i) {
      if (project.pages.length <= 1) return false;
      project.pages.splice(i, 1);
      if (project.currentPage >= project.pages.length) project.currentPage = project.pages.length - 1;
      return true;
    }

    /* ---------- objects ---------- */
    function addObject(o, pageIdx) {
      o = o || {};
      const pg = page(pageIdx);
      if (!pg) return null;
      const obj = {
        id: o.id || nextId('obj'),
        kind: o.kind || 'tic',
        name: o.name || '',
        x: o.x || 0, y: o.y || 0,
        heading: clampHeading(o.heading || 0),
        size: o.size == null ? 3 : o.size,   /* 1..6, 3 = natural size */
        visible: o.visible !== false,
        scripts: [],           /* [[{type,val,text}, ...], ...] */
        say: null,
        home: {
          x: o.x || 0, y: o.y || 0, heading: clampHeading(o.heading || 0),
          size: o.size == null ? 3 : o.size, visible: o.visible !== false,
        },
      };
      pg.objects.push(obj);
      if (!pg.selectedId) pg.selectedId = obj.id;
      return obj;
    }
    function removeObject(id, pageIdx) {
      const pg = page(pageIdx); if (!pg) return false;
      const i = pg.objects.findIndex(o => o.id === id);
      if (i < 0) return false;
      pg.objects.splice(i, 1);
      if (pg.selectedId === id) pg.selectedId = pg.objects.length ? pg.objects[0].id : null;
      return true;
    }
    function obj(id, pageIdx) {
      const pg = page(pageIdx); if (!pg) return null;
      return pg.objects.find(o => o.id === id) || null;
    }
    function selected(pageIdx) {
      const pg = page(pageIdx); if (!pg) return null;
      return obj(pg.selectedId, pageIdx);
    }
    function select(id, pageIdx) {
      const pg = page(pageIdx); if (!pg) return false;
      if (!pg.objects.some(o => o.id === id)) return false;
      pg.selectedId = id; return true;
    }

    /* ---------- scripts ---------- */
    function newBlock(type, val, text, msg, speed) {
      const B = BLOCKS[type]; if (!B) return null;
      const b = { id: nextId('b'), type };
      if (B.val) b.val = val == null ? B.def : val;
      if (B.textParam) b.text = text == null ? B.defText : text;
      if (B.msgParam) b.msg = msg == null ? B.defMsg : msg;
      if (B.speedParam) b.speed = speed == null ? B.defSpeed : speed;
      if (B.recParam) b.rec = null;      /* filled by a real recording */
      if (B.wrap) b.body = [];
      return b;
    }
    /* add a block to script #si of an object; creates the script if needed */
    /* ---------------------------------------------------------------------
     * SCRIPT-INSERTION CONTRACT (deterministic, single rule set)
     *
     * A. TRIGGER BLOCK (START / ON_TAP / ON_BUMP)
     *      -> always OPENS A NEW script on the selected object
     *      -> becomes that script's first block
     *      -> that script becomes the object's ACTIVE script immediately
     *
     * B. NON-TRIGGER BLOCK (motion / looks / sound / control / end)
     *      -> APPENDS to the object's currently active script
     *      -> never silently opens an unrelated second script
     *
     * C. EXPLICIT TARGETING
     *      addBlock(objId, type, { script: <index>, into: <repeatBlockId> })
     *      -> `script` appends to exactly that script of THIS object
     *      -> an out-of-range index is rejected (returns null)
     *      -> `into` appends inside that Repeat container
     *      -> a block is never appended to another object's script
     *
     * D. NO ACTIVE SCRIPT YET
     *      Inserting a non-trigger block first creates ONE triggerless script
     *      and makes it active. The pupil is never blocked; the script simply
     *      will not run until a trigger heads it, which is what the book
     *      teaches (SB p.30: a script needs a التشغيل block to start).
     *
     * Returns the inserted block, with `block.scriptIndex` set so callers and
     * tests can assert exactly which script received it.
     * ------------------------------------------------------------------- */
    function activeScriptIndex(o) {
      if (o._active == null || !o.scripts[o._active]) {
        o._active = o.scripts.length ? o.scripts.length - 1 : null;
      }
      return o._active;
    }
    function setActiveScript(objId, i, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      if (i == null) { o._active = null; return true; }
      if (!o.scripts[i]) return false;
      o._active = i; return true;
    }

    function addBlock(objId, type, opts) {
      opts = opts || {};
      const o = obj(objId, opts.page); if (!o) return null;
      const B = BLOCKS[type]; if (!B) return null;
      const b = newBlock(type, opts.val, opts.text, opts.msg, opts.speed); if (!b) return null;

      /* C — insert inside a Repeat container of THIS object */
      if (opts.into) {
        const w = findBlock(o, opts.into);
        if (!w || !BLOCKS[w.type].wrap) return null;
        if (B.head) return null;              /* a trigger cannot nest */
        w.body.push(b);
        b.scriptIndex = activeScriptIndex(o);
        return b;
      }

      /* C — explicitly targeted script index */
      if (opts.script != null) {
        if (!o.scripts[opts.script]) return null;   /* reject invalid id */
        const s = o.scripts[opts.script];
        if (B.head && s.length) return null;        /* trigger must lead */
        s.push(b); o._active = opts.script;
        b.scriptIndex = opts.script;
        return b;
      }

      /* A — a trigger always opens a new script and becomes active */
      if (B.head) {
        o.scripts.push([b]);
        o._active = o.scripts.length - 1;
        b.scriptIndex = o._active;
        return b;
      }

      /* B / D — append to the active script, opening one if none exists */
      let si = activeScriptIndex(o);
      if (si == null) { o.scripts.push([]); si = o.scripts.length - 1; o._active = si; }
      o.scripts[si].push(b);
      b.scriptIndex = si;
      return b;
    }
    function findBlock(o, blockId) {
      let found = null;
      const walk = arr => arr.forEach(b => {
        if (found) return;
        if (b.id === blockId) { found = b; return; }
        if (b.body) walk(b.body);
      });
      o.scripts.forEach(walk);
      return found;
    }
    function setBlockVal(objId, blockId, val, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      const b = findBlock(o, blockId); if (!b) return false;
      if (!BLOCKS[b.type].val) return false;
      b.val = clamp(Math.round(val), 0, 99); return true;
    }
    function setBlockText(objId, blockId, text, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      const b = findBlock(o, blockId); if (!b) return false;
      if (!BLOCKS[b.type].textParam) return false;
      b.text = String(text); return true;
    }
    function setBlockMsg(objId, blockId, colour, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      const b = findBlock(o, blockId); if (!b) return false;
      if (!BLOCKS[b.type].msgParam) return false;
      if (MSG_COLOURS.indexOf(colour) < 0) return false;
      b.msg = colour; return true;
    }
    function setBlockSpeed(objId, blockId, speed, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      const b = findBlock(o, blockId); if (!b) return false;
      if (!BLOCKS[b.type].speedParam) return false;
      if (SPEEDS.indexOf(speed) < 0) return false;
      b.speed = speed; return true;
    }
    function setBlockRec(objId, blockId, recId, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      const b = findBlock(o, blockId); if (!b) return false;
      if (!BLOCKS[b.type].recParam) return false;
      b.rec = recId; return true;
    }
    function removeBlock(objId, blockId, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      let hit = false;
      const strip = arr => {
        for (let i = arr.length - 1; i >= 0; i--) {
          if (arr[i].id === blockId) { arr.splice(i, 1); hit = true; return; }
          if (arr[i].body) strip(arr[i].body);
        }
      };
      o.scripts.forEach(strip);
      o.scripts = o.scripts.filter(s => s.length);
      if (o._active != null && !o.scripts[o._active]) {
        o._active = o.scripts.length ? o.scripts.length - 1 : null;
      }
      return hit;
    }
    function clearScripts(objId, pageIdx) {
      const o = obj(objId, pageIdx); if (!o) return false;
      o.scripts = []; o._active = null; return true;
    }

    /* ---------- reset ---------- */
    function resetObject(o) {
      o.x = o.home.x; o.y = o.home.y; o.heading = o.home.heading;
      o.size = o.home.size; o.visible = o.home.visible; o.say = null;
    }
    function resetPage(pageIdx) {
      const pg = page(pageIdx); if (!pg) return;
      pg.objects.forEach(resetObject);
    }
    function resetAll() { project.pages.forEach((p, i) => resetPage(i)); }

    /* ---------- serialisation (for persistence) ---------- */
    function serialise() {
      return JSON.parse(JSON.stringify({
        cols: project.cols, rows: project.rows,
        title: project.title, titleColour: project.titleColour,
        titleSize: project.titleSize, titlePos: project.titlePos,
        currentPage: project.currentPage,
        pages: project.pages.map(p => ({
          id: p.id, background: p.background, selectedId: p.selectedId,
          objects: p.objects.map(o => ({
            id: o.id, kind: o.kind, name: o.name, x: o.x, y: o.y,
            heading: o.heading, size: o.size, visible: o.visible,
            scripts: o.scripts, home: o.home, active: o._active == null ? null : o._active,
          })),
        })),
      }));
    }
    function restore(data) {
      if (!data || !data.pages) return false;
      project.title = data.title || '';
      project.titleColour = data.titleColour || '#F2C230';
      project.titleSize = data.titleSize || 2;
      project.titlePos = data.titlePos || { x: 50, y: 8 };
      project.pages = data.pages.map(p => ({
        id: p.id, background: p.background, selectedId: p.selectedId,
        objects: (p.objects || []).map(o => {
          const c = Object.assign({ say: null }, o);
          c._active = (o.active == null ? null : o.active); delete c.active; return c;
        }),
      }));
      project.currentPage = clamp(data.currentPage || 0, 0, project.pages.length - 1);
      return true;
    }

    /* ================= EXECUTOR ================= */
    /* Flatten one script into a list of atomic ACTIONS. Repeat is expanded
     * here so the timeline is a plain sequence the UI can simply play.      */
    function flatten(script) {
      const out = [];
      const walk = (arr, depth) => {
        if (depth > 8) return;                    /* guard runaway nesting */
        arr.forEach(b => {
          if (b.type === 'REPEAT') {
            const n = clamp(b.val == null ? 2 : b.val, 0, 20);
            for (let i = 0; i < n; i++) walk(b.body || [], depth + 1);
          } else {
            out.push(b);
          }
        });
      };
      walk(script, 0);
      return out;
    }

    /* Does this script have a FOREVER anywhere at top level? */
    const hasForever = script => script.some(b => b.type === 'FOREVER');

    /* Run ONE script for one object against a live state object, appending
     * events to `events`. Returns the time at which the script finished.    */
    function runScript(o, script, st, events, tStart, cols, rows) {
      let t = tStart;
      let actions = flatten(script);
      const looping = hasForever(script);
      /* FOREVER repeats the whole script; unroll a bounded number of cycles */
      if (looping) {
        const body = actions.filter(b => b.type !== 'FOREVER');
        actions = [];
        for (let c = 0; c < FOREVER_CYCLES; c++) actions = actions.concat(body);
      }

      /* Set Speed applies to every timed action AFTER it, in this script. */
      let sf = 1;

      for (let i = 0; i < actions.length; i++) {
        const b = actions[i];
        const B = BLOCKS[b.type]; if (!B) continue;
        const v = b.val == null ? (B.def || 0) : b.val;

        switch (b.type) {
          case 'START': case 'ON_TAP': case 'ON_BUMP': case 'ON_MSG':
            break;                                   /* head marker only */

          case 'FWD': case 'BACK': case 'UP': case 'DOWN': {
            const dx = b.type === 'FWD' ? 1 : b.type === 'BACK' ? -1 : 0;
            const dy = b.type === 'DOWN' ? 1 : b.type === 'UP' ? -1 : 0;
            const ms = Math.round(STEP_MS * sf);
            for (let s = 0; s < v; s++) {
              st.x = clamp(st.x + dx, 0, cols - 1);
              st.y = clamp(st.y + dy, 0, rows - 1);
              t += ms;
              events.push({ t, obj: o.id, kind: 'move', x: st.x, y: st.y, ms });
            }
            break;
          }
          case 'HOP': {
            /* GRADE 1 TRANSPLANT — corrected jump execution.
             * ScratchJr's Hop moves the object a given number of steps UP and
             * then the same number of steps back DOWN. ONE Hop block is
             * therefore ONE jump carrying its real HEIGHT; it is never a count
             * of repeated little hops, and the object lands on the square it
             * started from (x and y unchanged). The old loop emitted `v`
             * identical in-place hops, so «اقْفِزْ 4» looked like four small
             * jumps instead of one tall one. */
            const h = clamp(v, 1, 12);
            const ms = Math.round(HOP_BASE_MS * (0.55 + 0.15 * h) * sf);
            t += ms;
            events.push({ t, obj: o.id, kind: 'hop', x: st.x, y: st.y, height: h, ms });
            break;
          }
          case 'ROT_R': case 'ROT_L': {
            const d = b.type === 'ROT_R' ? 1 : -1;
            const prevHeading = st.heading;                 /* read BEFORE the turn */
            st.heading = clampHeading(st.heading + d * v);
            /* GRADE 1 TRANSPLANT — synchronized rotation.
             * SINGLE SOURCE OF TRUTH: one clock position per TURN_STEP_MS, so
             * the actor and every rotation indicator move together and the next
             * block cannot start before the turn has finished. The signed
             * twelfths actually rotated travel on the event, so a lesson can
             * assert the REAL rotation total and not just the final heading. */
            const steps = Math.abs(v);
            const ms = Math.max(TURN_STEP_MS, Math.round(TURN_STEP_MS * steps * sf));
            const from = ((prevHeading % 12) + 12) % 12;
            const at = t;            /* the turn ANIMATES during its own slot */
            t += ms;
            events.push({
              t: at, obj: o.id, kind: 'turn',
              heading: st.heading,                 /* toHeading, 0..11          */
              fromHeading: from,
              toHeading: st.heading,
              amount: d * v,                       /* signed twelfths           */
              direction: d > 0 ? 'right' : 'left',
              steps: steps,
              stepMs: Math.round(ms / Math.max(1, steps)),
              ms,
            });
            break;
          }
          case 'GO_HOME': {
            st.x = o.home.x; st.y = o.home.y; st.heading = o.home.heading;
            const ms = Math.round(STEP_MS * sf);
            t += ms;
            events.push({ t, obj: o.id, kind: 'move', x: st.x, y: st.y, ms });
            break;
          }
          case 'SAY': {
            st.say = b.text == null ? '' : b.text;
            const ms = Math.round(SAY_MS * sf);
            events.push({ t, obj: o.id, kind: 'say', text: st.say, ms });
            t += ms;
            events.push({ t, obj: o.id, kind: 'unsay' });
            break;
          }
          case 'GROW': case 'SHRINK': {
            const d = b.type === 'GROW' ? 1 : -1;
            st.size = clamp(st.size + d * (v / 2), 1, 8);
            const ms = Math.round(LOOK_MS * sf);
            t += ms;
            events.push({ t, obj: o.id, kind: 'size', size: st.size, ms });
            break;
          }
          case 'RESET_SZ': {
            st.size = o.home.size;
            const ms = Math.round(LOOK_MS * sf);
            t += ms;
            events.push({ t, obj: o.id, kind: 'size', size: st.size, ms });
            break;
          }
          case 'HIDE': case 'SHOW': {
            st.visible = b.type === 'SHOW';
            const ms = Math.round(LOOK_MS * sf);
            t += ms;
            events.push({ t, obj: o.id, kind: 'vis', visible: st.visible, ms });
            break;
          }
          case 'POP': {
            events.push({ t, obj: o.id, kind: 'sound', sound: 'pop' });
            t += Math.round(220 * sf);
            break;
          }
          case 'PLAY_REC': {
            events.push({ t, obj: o.id, kind: 'sound', sound: 'rec', rec: b.rec || null });
            t += Math.round(600 * sf);
            break;
          }
          case 'SEND_MSG': {
            /* broadcast: collected by run() and dispatched to ON_MSG scripts */
            events.push({ t, obj: o.id, kind: 'message', msg: b.msg || 'orange' });
            t += 60;
            break;
          }
          case 'WAIT': {
            /* FIELD FIX (defect 2) — A WAIT IS REAL TEACHING TIME.
             * «القيمَةُ 10 تُعادِلُ ثانِيَةً واحِدَةً» (دليل المعلم ص32) is a fact the
             * pupil is asked to state out loud, so it must hold no matter what
             * Set Speed is doing to the MOVEMENT blocks. Multiplying a Wait by
             * the speed factor turned «انْتَظِرْ 30» into something other than
             * three seconds and destroyed the whole point of the lesson.
             * The speed factor is therefore NOT applied to a Wait. */
            const ms = Math.round(v * WAIT_UNIT_MS);        /* TG p.32: 10 => 1s */
            events.push({ t, obj: o.id, kind: 'wait', ms });
            t += ms;
            break;
          }
          case 'SET_SPEED': {
            sf = SPEED_FACTOR[b.speed || 'normal'] || 1;
            events.push({ t, obj: o.id, kind: 'speed', speed: b.speed || 'normal' });
            break;
          }
          case 'STOP': {
            /* stops every running script of the whole page */
            events.push({ t, obj: o.id, kind: 'stopall' });
            return { t, looping, stopped: true };
          }
          case 'GO_PAGE': {
            events.push({ t, obj: o.id, kind: 'page', page: clamp(v - 1, 0, project.pages.length - 1) });
            return { t, looping };                  /* execution leaves the page */
          }
          case 'END':
            return { t, looping };
          case 'FOREVER':
            break;                                   /* handled by unrolling */
        }
      }
      return { t, looping };
    }

    /* Run every script whose head matches `trigger`.
     * trigger: 'START' | 'ON_TAP' | 'ON_BUMP'
     * only  : optional object id (tap targets exactly one object)          */
    function run(opts) {
      opts = opts || {};
      const trigger = opts.trigger || 'START';
      const pg = page(opts.page);
      if (!pg) return { events: [], duration: 0, looping: false, states: {} };

      const events = [];
      const states = {};
      let looping = false;

      pg.objects.forEach(o => {
        /* VERIFICATION CORRECTNESS — `fromHome`.
         * A real run starts wherever the object currently stands, exactly as
         * ScratchJr does: pressing the green flag twice moves twice. But a
         * LESSON PREDICATE asks a different question — «does this script bring
         * the crab to the target?» — and that answer must not depend on how
         * many times the pupil pressed Run. A predicate therefore simulates
         * `fromHome`, i.e. from the authored starting state, which is a pure
         * property of the script the pupil built. Animation never uses it. */
        const h = o.home || {};
        const st = (opts.fromHome && o.home)
          ? { x: h.x, y: h.y, heading: h.heading, size: h.size, visible: h.visible !== false, say: null }
          : { x: o.x, y: o.y, heading: o.heading, size: o.size, visible: o.visible, say: null };
        states[o.id] = st;
        if (opts.only && o.id !== opts.only) return;
        o.scripts.forEach(script => {
          if (!script.length) return;
          const head = script[0];
          if (!BLOCKS[head.type] || !BLOCKS[head.type].head) return;
          if (head.type !== trigger) return;
          /* every script starts at t = 0: ScratchJr runs them concurrently */
          const r = runScript(o, script, st, events, 0, cols, rows);
          if (r.looping) looping = true;
        });
      });

      /* ---- MESSAGE DISPATCH ----------------------------------------------
       * A Send Message block broadcasts a COLOUR. Every Start-on-Message
       * script whose colour MATCHES starts at the moment of the broadcast;
       * a non-matching colour never triggers. Dispatch is iterated so a
       * message may itself send another, bounded to keep the model finite. */
      const handled = new Set();
      for (let depth = 0; depth < 4; depth++) {
        const msgs = events.filter(e => e.kind === 'message' && !handled.has(e));
        if (!msgs.length) break;
        msgs.forEach(m => {
          handled.add(m);
          pg.objects.forEach(o => {
            const st = states[o.id];
            o.scripts.forEach(script => {
              if (!script.length) return;
              const head = script[0];
              if (head.type !== 'ON_MSG') return;
              if ((head.msg || 'orange') !== m.msg) return;   /* colour must match */
              const r = runScript(o, script, st, events, m.t, cols, rows);
              if (r.looping) looping = true;
            });
          });
        });
      }

      events.sort((a, b) => a.t - b.t);
      /* A Stop block cancels everything scheduled after it. */
      const stopAt = events.filter(e => e.kind === 'stopall').reduce((m, e) => Math.min(m, e.t), Infinity);
      const kept = stopAt === Infinity ? events : events.filter(e => e.t <= stopAt);
      const duration = kept.reduce((m, e) => Math.max(m, e.t + (e.ms || 0)), 0);
      return { events: kept, duration, looping: (stopAt === Infinity) && looping, states, stopAt };
    }

    /* Compute the FINAL state without animating — used by lesson checks. */
    function simulate(opts) {
      const r = run(opts);
      const pg = page((opts || {}).page);
      const out = {};
      if (pg) pg.objects.forEach(o => {
        const s = r.states[o.id];
        out[o.id] = { x: s.x, y: s.y, heading: s.heading, size: s.size, visible: s.visible };
      });
      return { final: out, duration: r.duration, looping: r.looping, events: r.events };
    }

    /* Apply a run's final state to the real objects (after an animation). */
    function commit(states, pageIdx) {
      const pg = page(pageIdx); if (!pg) return;
      pg.objects.forEach(o => {
