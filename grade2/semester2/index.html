            const card = el('button', { class: 'ord-card', type: 'button', 'data-card': c.id, 'aria-label': c.full || c.ar, title: c.full || c.ar, onclick: () => clickPlace(c.id) }, cardBody(c));
            card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clickPlace(c.id); } });
            attachDrag(card, c.id); bank.appendChild(card);
          });
          slotBox.innerHTML = '';
          for (let i = 0; i < opts.slots; i++) {
            const id = state[i];
            const slot = el('div', { class: 'ord-slot' + (id ? ' is-full' : ' is-empty'), 'data-slot': String(i + 1), 'data-has': id || '' }, [el('span', { class: 'ord-num', text: String(i + 1) })]);
            if (id) {
              const c = opts.cards.find(x => x.id === id);
              const filled = el('button', { class: 'ord-filled', type: 'button', 'data-card': id, 'aria-label': c.full || c.ar, title: c.full || c.ar, onclick: () => removeFrom(i) }, cardBody(c).concat([el('span', { class: 'ord-x', text: '×', 'aria-hidden': 'true' })]));
              filled.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); removeFrom(i); } });
              attachDrag(filled, id); slot.appendChild(filled);
            } else slot.appendChild(el('span', { class: 'ord-hint', text: '…' }));
            slotBox.appendChild(slot);
          }
        }
        const host = el('div', { class: 'ord-widget' });
        host.appendChild(slotBox);
        host.appendChild(el('div', { class: 'ord-banklabel', text: opts.bankLabel || 'البِطاقاتُ المُتاحَةُ' }));
        host.appendChild(bank);
        repaint();
        return {
          host, order: () => state.slice(), filled: () => state.every(x => x),
          mark(correct) { const nodes = slotBox.querySelectorAll('.ord-slot'); state.forEach((id, i) => { const ok = id && id === correct[i]; nodes[i].classList.toggle('is-right', !!ok); nodes[i].classList.toggle('is-wrong', !!(id && !ok)); }); },
          clearMarks() { slotBox.querySelectorAll('.ord-slot').forEach(n => n.classList.remove('is-right', 'is-wrong')); },
          lock() { slotBox.querySelectorAll('.ord-filled').forEach(n => { n.disabled = true; n.classList.add('is-locked'); }); },
        };
      }

      return [
        /* ============ STAGE 1 — order the bicycle instructions ============ */
        {
          id: 'idea', step: 'seq',
          enter() {
            api.clearWork();
            api.say('الحاسوبُ لا يَفْهَمُ إلّا تَعْليماتٍ واضِحَةً مُرَتَّبَةً. رَتِّبْ خُطُواتِ رُكوبِ الدَّرَّاجَةِ في المَواضِعِ 1 و2 و3، ثُمَّ اضْغَطْ زِرَّ «تَحَقَّقْ».');

            const p = api.panel('p-idea');
            const TH = K.theory(p, {
              art: 'bicycleSteps',
              artLabel: 'ثلاث صور مرقّمة لخطوات ركوب الدراجة',
              caption: 'انْظُرْ إلى الصُّوَرِ: ماذا نَفْعَلُ أَوَّلًا؟',
              title: 'خُطُواتُ رُكوبِ الدَّرَّاجَةِ',
              terms: [
                ['بَرْنامَج', 'Program', 'قائِمَةٌ بِالأوامِرِ تُخْبِرُ الحاسوبَ بِما يَجِبُ القِيامُ بِهِ.'],
                ['مَقْطَعٌ بَرْمَجِيٌّ', 'Script', 'مَجْموعَةُ لَبِناتٍ مُتَسَلْسِلَةٍ يَفْهَمُها الحاسوبُ.'],
              ],
              note: 'التَّرْتيبُ مُهِمٌّ: الحاسوبُ يُنَفِّذُ الأوامِرَ واحِدًا بَعْدَ الآخَرِ.',
            });
            const holder = el('div', { class: 'bike-order' });
            TH.bottom.appendChild(holder);
            const w = orderWidget({
              cards: W.util.shuffleNotIdentity(BIKE.slice(), c => c.id), slots: 3, host: holder,
              bankLabel: 'البِطاقاتُ — اسْحَبْها أو انْقُرْها لِتَضَعَها في المَوْضِعِ',
              onChange: () => { w.clearMarks(); api.clearFb(); },
            });
            holder.appendChild(w.host);
            const PR_seq = K.progress(api, { step: 'seq', mode: 'theory',
              sub: 'رَتَّبْتَ التَّعْليماتِ بِالتَّسَلْسُلِ الصَّحيحِ.' });

            const verifyBtn = el('button', {
              class: 'verifybtn', type: 'button', 'data-act': 'verify-bike', text: 'تَحَقَّقْ',
              onclick: () => {
                if (PR_seq.fired) return;                  /* already correct */
                if (!w.filled()) { api.hint('ضَعْ بِطاقَةً في كُلِّ مَوْضِعٍ أَوَّلًا.'); return; }
                w.mark(BIKE_ANSWER.split(','));
                if (w.order().join(',') === BIKE_ANSWER) {
                  api.good('إِجابَتُكَ صَحيحَةٌ! رَتَّبْتَ التَّعْليماتِ بِالتَّسَلْسُلِ الصَّحيحِ.');
                  w.lock();                                 /* answer stays visible */
                  verifyBtn.disabled = true;
                  PR_seq.succeed();                         /* hold, then «التّالي» */
                } else {
                  /* keep the answer, mark only the misplaced steps, hold >=3s */
                  api.hint('راجِعْ مَوْضِعَ الخُطْوَةِ، ثُمَّ حاوِلْ مَرَّةً أُخْرى.');
                }
              },
            });
            TH.bottom.appendChild(el('div', { class: 'route-btns' }, [verifyBtn]));
            this._ok = () => PR_seq.advanced;
          },
          completionPredicate() { return this._ok ? this._ok() : false; },
        },

        /* ============ STAGE 2 — program the robot (fully explained) ============ */
        {
          id: 'route', step: 'route',
          enter() {
            api.clearWork();
            api.say('بَرْمِجِ الرُّوبوتَ لِيَصِلَ إلى الزَّهْرَةِ: اخْتَرِ الأمْرَ المُناسِبَ لِكُلِّ مَوْضِعٍ مِنَ المَواضِعِ الأرْبَعَةِ، ثُمَّ اضْغَطْ «تَشْغيل» أو «تَحَقَّقْ».');
            const PR_route = K.progress(api, { step: 'route', mode: 'practical',
              sub: 'وَصَلَ الرُّوبوتُ إلى الزَّهْرَةِ بِالمَقْطَعِ الصَّحيحِ.' });

            const p = api.panel('p-route');

            /* ---------- TOP: compact goal strip ---------- */
            p.appendChild(el('div', { class: 'goalbar', 'data-goalbar': '1' }, [
              el('span', { class: 'goalflower' }, [W.art.actor('flower')]),
              el('span', { class: 'goaltext', text: 'بَرْمِجِ الرُّوبوتَ لِيَصِلَ إلى الزَّهْرَةِ.' }),
            ]));

            /* ---------- MIDDLE: large board (physical LEFT) + guidance (RIGHT) ---- */
            const mid = el('div', { class: 'actmid', 'data-actmid': '1' });
            p.appendChild(mid);
            const left = el('div', { class: 'actvis', 'data-actvis': '1' });    /* physical left */
            const right = el('div', { class: 'actside', 'data-actside': '1' }); /* physical right */
            mid.appendChild(left); mid.appendChild(right);
            /* ---------- BOTTOM: full-width program area ---------- */
            const bottom = el('div', { class: 'actbottom', 'data-actbottom': '1' });
            p.appendChild(bottom);

            /* ---------- the board ---------- */
            const board = el('div', { class: 'gridboard', 'data-board': '1' });
            for (let r = 0; r < GRID.rows; r++) for (let c = 0; c < GRID.cols; c++) {
              const isGrass = (r === 1 && c < 3) || (r === 3 && c > 0);
              board.appendChild(el('div', { class: 'gb-cell' + (isGrass ? ' is-grass' : ''), 'data-cell': c + ',' + r, style: { left: (c * 25) + '%', top: (r * 25) + '%' } }));
            }
            const trail = el('div', { class: 'gb-trail' });
            board.appendChild(trail);
            board.appendChild(el('div', { class: 'gb-goal', 'data-goal': '1', style: { left: (GRID.goal.x * 25) + '%', top: (GRID.goal.y * 25) + '%' } }, [W.art.actor('flower')]));
            const robot = el('div', { class: 'gb-robot', 'data-robot': '1', 'data-x': String(GRID.start.x), 'data-y': String(GRID.start.y), style: { left: (GRID.start.x * 25) + '%', top: (GRID.start.y * 25) + '%' } }, [W.art.actor('robot')]);
            board.appendChild(robot);
            left.appendChild(board);

            /* ---------- B. the direction legend ---------- */
            const legend = el('div', { class: 'dirlegend', 'data-legend': '1' });
            [['up', 'إلى أَعْلى'], ['down', 'إلى أَسْفَلَ'], ['right', 'إلى اليَمينِ'], ['left', 'إلى اليَسارِ']]
              .forEach(([d, lab]) => legend.appendChild(el('div', { class: 'diritem', 'data-dir': d }, [
                el('span', { class: 'dirico' }, [arrow(d)]),
                el('span', { class: 'dirlab', text: lab }),
              ])));
            right.appendChild(el('h4', { class: 'p-sub', text: 'دَليلُ الاتِّجاهاتِ' }));
            right.appendChild(legend);

            /* ---------- C. the required ordered instructions ---------- */
            const req = el('ol', { class: 'reqlist', 'data-reqlist': '1' });
            ROUTE.forEach(sp => req.appendChild(el('li', { class: 'reqitem', 'data-req': sp.id }, [
              el('span', { class: 'dirico' }, [arrow(sp.dir)]),
              el('span', { text: sp.ar }),
            ])));
            right.appendChild(el('h4', { class: 'p-sub', text: 'التَّعْليماتُ المَطْلوبَةُ بِالتَّرْتيبِ' }));
            right.appendChild(req);

            /* ---------- D. how it works ---------- */
            right.appendChild(el('figure', { class: 'thfig thfig-inline', 'data-thart': 'commandParts',
              role: 'img', 'aria-label': 'كل أمر فيه اتجاه وعدد خطوات' }, [W.edu.scene('commandParts')]));
            right.appendChild(el('div', { class: 'p-note', 'data-howto': '1',
              text: 'اخْتَرِ اتِّجاهَ الحَرَكَةِ، ثُمَّ حَدِّدْ عَدَدَ الخُطُواتِ، وَضَعِ الأوامِرَ في المَقْطَعِ بِالتَّرْتيبِ.' }));

            /* ---------- E + F. four numbered positions + command cards ---------- */
            const holder = el('div', { class: 'progwrap' });
            bottom.appendChild(holder);
            const cards = ROUTE.concat(DISTRACT).map(sp => ({ id: sp.id, ar: sp.short || sp.ar, full: sp.ar, dir: sp.dir, n: sp.n }));
            const w = orderWidget({
              cards: W.util.shuffleNotIdentity(cards, c => c.id), slots: 4, host: holder,
              slotClass: 'ord-slots prog-slots',
              bankLabel: 'أوامِرُ الحَرَكَةِ — اتِّجاهٌ وَعَدَدُ خُطُواتٍ',
              onChange: () => { w.clearMarks(); api.clearFb(); resetRobot(); },
            });
            holder.appendChild(w.host);

            function resetRobot() {
              robot.style.left = (GRID.start.x * 25) + '%';
              robot.style.top = (GRID.start.y * 25) + '%';
              robot.setAttribute('data-x', String(GRID.start.x));
              robot.setAttribute('data-y', String(GRID.start.y));
              robot.classList.remove('is-arrived');
              trail.innerHTML = '';
              clearExec();
            }
            function markExec(i) {
              [...holder.querySelectorAll('.ord-slot')].forEach((n, k) => n.classList.toggle('is-exec', k === i));
            }
            function clearExec() { [...holder.querySelectorAll('.ord-slot')].forEach(n => n.classList.remove('is-exec')); }

            function animate(ids, done2) {
              resetRobot();
              const steps = [];
              ids.forEach((id, ci) => {
                const sp = byId(id); if (!sp) return;
                for (let k = 0; k < sp.n; k++) steps.push(ci);
              });
              const r = runRoute(ids);
              let i = 0;
              const tick = () => {
                if (i >= r.path.length - 1) { clearExec(); done2 && done2(r); return; }
                i++;
                markExec(steps[i - 1]);
                const pnt = r.path[i];
                trail.appendChild(el('div', { class: 'gb-dot', style: { left: (pnt.x * 25 + 8.5) + '%', top: (pnt.y * 25 + 8.5) + '%' } }));
                robot.style.left = (pnt.x * 25) + '%';
                robot.style.top = (pnt.y * 25) + '%';
                robot.setAttribute('data-x', String(pnt.x));
                robot.setAttribute('data-y', String(pnt.y));
                W.scd.after(tick, W.store.settings.reducedMotion ? 150 : 340);
              };
              W.scd.after(tick, 220);
            }

            /* diagnose the FIRST real problem, without clearing the program */
            function diagnose(ids) {
              const want = ROUTE_ANSWER.split(',');
              for (let i = 0; i < 4; i++) {
                if (!ids[i]) return 'المَوْضِعُ ' + (i + 1) + ' فارِغٌ: أَمْرٌ ناقِصٌ.';
                if (ids[i] === want[i]) continue;
                const got = byId(ids[i]), exp = byId(want[i]);
                if (got.dir !== exp.dir) return 'المَوْضِعُ ' + (i + 1) + ': الاتِّجاهُ غَيْرُ صَحيحٍ.';
                if (got.n !== exp.n) return 'المَوْضِعُ ' + (i + 1) + ': عَدَدُ الخُطُواتِ غَيْرُ صَحيحٍ.';
                if (want.indexOf(ids[i]) >= 0) return 'المَوْضِعُ ' + (i + 1) + ': التَّرْتيبُ غَيْرُ صَحيحٍ.';
                return 'المَوْضِعُ ' + (i + 1) + ': هذا الأمْرُ لا يَلْزَمُ هُنا.';
              }
              return null;
            }

            function evaluate() {
              if (PR_route.fired) return;
              const ids = w.order();
              if (!w.filled()) { api.hint('ضَعْ أَمْرًا في كُلِّ مَوْضِعٍ مِنَ المَواضِعِ الأرْبَعَةِ.'); w.mark(ROUTE_ANSWER.split(',')); return; }
              animate(ids, r => {
                const exact = ids.join(',') === ROUTE_ANSWER;
                w.mark(ROUTE_ANSWER.split(','));
                if (exact && r.arrived) {
                  robot.classList.add('is-arrived');
                  api.good('مُمْتاز! وَصَلَ الرُّوبوتُ إلى الزَّهْرَةِ بِالمَقْطَعِ الصَّحيحِ.');
                  w.lock(); runBtn.disabled = true; verBtn.disabled = true;
                  PR_route.succeed();
                } else {
                  api.hint(diagnose(ids) || 'راجِعِ التَّرْتيبَ وَعَدَدَ الخُطُواتِ.');
                }
              });
            }

            /* ---------- G. controls ---------- */
            const runBtn = el('button', { class: 'runbtn', type: 'button', 'data-act': 'run-route', text: '▶ تَشْغيل', onclick: evaluate });
            const verBtn = el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-route', text: 'تَحَقَّقْ', onclick: evaluate });
            const resBtn = el('button', { class: 'minibtn', type: 'button', 'data-act': 'reset-route', text: 'إعادَة',
              onclick: () => { [...holder.querySelectorAll('.ord-slot.is-full .ord-filled')].forEach(n => n.click()); w.clearMarks(); resetRobot(); api.clearFb(); } });
            bottom.appendChild(el('div', { class: 'route-btns' }, [runBtn, verBtn, resBtn]));

            this._ok = () => PR_route.advanced;
          },
          completionPredicate() { return this._ok ? this._ok() : false; },
        },

        /* ============ STAGE 3 — the lab route (TG p.21, group task) ============ */
        {
          id: 'lab', step: 'lab',
          enter() {
            api.clearWork();
            api.say('صِفْ لِزَميلِكَ الطَّريقَ مِنْ مَدْخَلِ المَدْرَسَةِ إلى مُخْتَبَرِ الحاسوبِ: نُقْطَةُ بِدايَةٍ، ثُمَّ تَعْليماتٌ، ثُمَّ نُقْطَةُ نِهايَةٍ. رَتِّبْ ثُمَّ تَحَقَّقْ.');
            const PR_lab = K.progress(api, { step: 'lab', mode: 'theory' });

            const p = api.panel('p-lab');
            const TH3 = K.theory(p, {
              art: 'scriptParts',
              artLabel: 'المقطع يبدأ بلبنة تشغيل ثم أوامر مرتّبة',
              title: 'الطَّريقُ تَعْليماتٌ مُرَتَّبَةٌ',
              points: ['نَبْدَأُ مِنْ نُقْطَةِ بِدايَةٍ.', 'ثُمَّ خُطُواتٌ واضِحَةٌ بِالتَّرْتيبِ.', 'ثُمَّ نُقْطَةُ نِهايَةٍ.'],
            });
            const plan = el('div', { class: 'lab-plan', 'data-labplan': '1' });
            const PICKS = [
              { id: 'p1', ar: 'ابْدَأْ مِنْ مَدْخَلِ المَدْرَسَةِ', slot: 'start', ok: true },
              { id: 'p2', ar: 'ابْدَأْ مِنْ ساحَةِ اللَّعِبِ', slot: 'start', ok: false },
              { id: 'p3', ar: 'سِرْ إلى الأمامِ حَتّى نِهايَةِ المَمَرِّ', slot: 'mid', ok: true },
              { id: 'p4', ar: 'اسْتَدِرْ يَمينًا ثُمَّ اصْعَدِ الدَّرَجَ', slot: 'mid', ok: true },
              { id: 'p5', ar: 'تَوَقَّفْ عِنْدَ مُخْتَبَرِ الحاسوبِ', slot: 'end', ok: true },
              { id: 'p6', ar: 'تَوَقَّفْ عِنْدَ المَقْصَفِ', slot: 'end', ok: false },
            ];
            const state = { start: null, mid: [], end: null };

            const slotBox = (key, label) => el('div', { class: 'lab-slot', 'data-labslot': key }, [
              el('div', { class: 'lab-slabel', text: label }),
              el('div', { class: 'lab-scontent' }),
            ]);
            const sStart = slotBox('start', 'نُقْطَةُ البِدايَةِ');
            const sMid = slotBox('mid', 'التَّعْليماتُ');
            const sEnd = slotBox('end', 'نُقْطَةُ النِّهايَةِ');
            plan.appendChild(sStart); plan.appendChild(sMid); plan.appendChild(sEnd);

            const bank = el('div', { class: 'lab-bank' });
            const repaint = () => {
              [['start', sStart], ['mid', sMid], ['end', sEnd]].forEach(([k, node]) => {
                const c = node.querySelector('.lab-scontent'); c.innerHTML = '';
                const items = k === 'mid' ? state.mid : (state[k] ? [state[k]] : []);
                items.forEach((it, i) => c.appendChild(el('div', {
                  class: 'lab-piece', 'data-piece': it.id, text: it.ar,
                  onclick: () => { if (k === 'mid') state.mid.splice(i, 1); else state[k] = null; repaint(); api.clearFb(); },
                })));
              });
              bank.innerHTML = '';
              PICKS.filter(x => x !== state.start && x !== state.end && !state.mid.includes(x))
                .forEach(x => bank.appendChild(el('button', {
                  class: 'lab-chip', type: 'button', 'data-labchip': x.id, text: x.ar,
                  onclick: () => { if (x.slot === 'mid') { if (state.mid.length < 2) state.mid.push(x); } else state[x.slot] = x; repaint(); api.clearFb(); },
                })));
            };
            const verify = () => {
              if (PR_lab.fired) return;
              if (!state.start || !state.end || state.mid.length < 2) { api.hint('اخْتَرْ بِدايَةً، وَخُطْوَتَيْنِ، وَنِهايَةً.'); return; }
              const good = state.start.ok && state.end.ok && state.mid.every(m => m.ok);
              if (good) {
                api.good('تَعْليماتٌ كامِلَةٌ: بِدايَةٌ، وَخُطُواتٌ، وَنِهايَةٌ.');
                PR_lab.succeed();
              } else {
                api.hint('راجِعْ: هَلِ البِدايَةُ وَالنِّهايَةُ صَحيحَتانِ؟');
              }
            };
            TH3.bottom.appendChild(plan);
            TH3.bottom.appendChild(el('h4', { class: 'p-sub', text: 'اخْتَرْ مِنْ هُنا' }));
            TH3.bottom.appendChild(bank);
            TH3.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-lab', text: 'تَحَقَّقْ', onclick: verify }),
            ]));
            repaint();
            this._ok = () => PR_lab.advanced;
          },
          completionPredicate() { return this._ok ? this._ok() : false; },
        },
      ];

      function term(ar, en, desc) {
        return el('div', { class: 'term', 'data-term': en }, [
          el('div', { class: 'term-ar', text: ar }),
          el('div', { class: 'term-en', text: en }),
          el('div', { class: 'term-d', text: desc }),
        ]);
      }
    },
  });
})(window.WADI);

/* ==== lessons/l2.js — الدرس 1.2: التَّحَكُّمُ في الوَقْتِ ====
 * Student Book p.22 · Teacher's Guide p.29 · 1 session
 *
 * THE GOLDEN LESSON. This is the first fully functional ScratchJr lesson and
 * the template every later lesson follows.
 *
 * OBJECTIVES (TG p.29, verbatim)
 *   1 استخدام لبنة تحدث (Say) لإنشاء محادثة
 *   2 استخدام لبنة الانتظار (Wait) لإيقاف المقطع البرمجي لفترة محددة
 *
 * BOOK SEQUENCE (SB pp.22-25)
 *   - prepare the stage: Tic is present, ADD Toc, move both with the mouse
 *   - build   العلم الأخضر + تحرك يمينا 4      for Tic
 *   - build   العلم الأخضر + تحرك يسارا 4      for Toc
 *   - Looks   -> تحدث, type «السلام عليكم» for Tic
 *   - Control -> انتظر, value 30, then تحدث «وعليكم السلام» for Toc
 *   - run the GREEN FLAG: both scripts run at the same time; Toc waits three
 *     seconds and then answers.
 *
 * VERIFIED TIMING (TG p.32)
 *   «إذا كانت القيمة 10 تعادل ثانية، ثم أصبحت القيمة 20، فكم عدد الثوان؟»
 *   => 10 = 1s, 20 = 2s, 30 = 3s. sjr.js sets WAIT_UNIT_MS = 100 accordingly,
 *   and stage 4 below checks the pupil can state the relationship.
 *
 * NOTHING PASSES BY PRESENCE. Each stage interrogates the ENGINE:
 *   - stage 2 requires a real say event carrying the pupil's own text
 *   - stage 3 requires Toc's speech to occur AFTER Tic's, by computed time
 *   - stage 5 requires the pupil's edited Wait value to change that gap
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  /* the two model sentences printed in the book */
  const HELLO = 'السلام عليكم';
  const REPLY = 'وعليكم السلام';

  /* helper: first say-event of an object in a computed run */
  const sayOf = (sim, objId) => sim.events.find(e => e.kind === 'say' && e.obj === objId) || null;

  W.lessons.register('l2', {
    stages(api) {
      let st = null, ticId = null, tocId = null;

      /* Build the studio ONCE; every stage reuses the same persistent app. */
      function ensureStudio(spec) {
        /* FIELD FIX (defect 3): a reused simulator must still be RE-ACTIVATED
         * for the new stage, otherwise the stage counts as theory-only and the
         * application is hidden. */
        if (st) { api.useStudio(); st.repaint(); return st; }
        st = api.studio(Object.assign({
          cols: 12, rows: 8, background: 'park',
          blocks: ['START', 'FWD', 'BACK', 'UP', 'DOWN', 'SAY', 'GROW', 'SHRINK', 'WAIT'],
          allowAdd: true, allowPages: false, showPages: false, grid: false,
        }, spec || {}));
        const tic = st.proj.addObject({ kind: 'tic', x: 2, y: 5 });
        ticId = tic.id;
        st.repaint();
        return st;
      }
      const findToc = () => {
        const o = st.proj.page().objects.find(x => x.kind === 'toc');
        tocId = o ? o.id : null; return o;
      };

      return [
        /* ================= STAGE 1 — prepare the stage ================= */
        {
          id: 'stage', step: 'toc',
          enter() {
            const PR_toc = K.progress(api, { step: 'toc', mode: 'theory' });
            api.clearWork();
            api.say('هَذا تَطْبيقُ ScratchJr. أَضِفِ الكائِنَ Toc مِنْ قائِمَةِ الكائِناتِ (+)، ثُمَّ ضَعْهُ في الجِهَةِ اليُمْنى مِنَ المِنَصَّةِ.',
              'الكائِنُ Tic مَوْجودٌ بِالفِعْلِ.');
            ensureStudio();
            st.highlight(null, null);
            let ok = false;
            st.onChange = what => {
              const toc = findToc();
              if (toc && !ok) {
                ok = true;
                api.good('أُضيفَ الكائِنُ Toc.');
                PR_toc.succeed();
              }
            };
            this._ok = () => !!findToc();
          },
          completionPredicate() { return this._ok(); },
        },

        /* ================= STAGE 2 — Tic speaks (Say + editing) ================= */
        {
          id: 'say', step: 'say',
          enter() {
            api.clearWork();
            api.say('اجْعَلْ Tic يَتَحَدَّثُ: اخْتَرْ Tic، ثُمَّ فِئَةَ المَظاهِرِ (Looks)، وَأَضِفْ لَبِنَةَ تَحَدَّثْ، وَاكْتُبْ فيها: ' + HELLO,
              'ابْدَأْ مَقْطَعَكَ بِالعَلَمِ الأخْضَرِ.');
            ensureStudio(); findToc();
            st.select(ticId);
            st.setCat('looks');
            st.highlight('looks', 'SAY');
            let ranOnce = false;
            const test = () => {
              const o = st.proj.obj(ticId); if (!o) return false;
              const sc = o.scripts.find(x => x[0] && x[0].type === 'START' && x.some(b => b.type === 'SAY'));
              if (!sc || sc.findIndex(b => b.type === 'SAY') < 1) return false;
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              const s = sayOf(sim, ticId);
              return !!(s && String(s.text).trim().length >= 2);
            };
            /* FIELD FIX (defect 4) — the gate names the OBJECT, the SCRIPT and
             * the ORDER. A Say on Toc, a Say without a green flag, a green flag
             * without a Say, or an empty text all fail; only «العلم الأخضر ثم
             * تحدث» on TIC passes. */
            const check = () => {
              const o = st.proj.obj(ticId);
              if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              const heads = o.scripts.filter(s => s[0] && s[0].type === 'START');
              const anySay = o.scripts.some(s => s.some(x => x.type === 'SAY'));
              if (!heads.length) {
                return anySay
                  ? { ok: false, fix: 'ضَعِ العَلَمَ الأخْضَرَ قَبْلَ لَبِنَةِ «تَحَدَّثْ» في مَقْطَعِ Tic.' }
                  : { ok: false, fix: 'ابْدَأْ مَقْطَعَ Tic بِالعَلَمِ الأخْضَرِ.' };
              }
              const sc = heads.find(s => s.some(x => x.type === 'SAY'));
              if (!sc) {
                const toc = tocId ? st.proj.obj(tocId) : null;
                if (toc && toc.scripts.some(s => s.some(x => x.type === 'SAY')))
                  return { ok: false, fix: 'لَبِنَةُ «تَحَدَّثْ» يَجِبُ أَنْ تَكونَ على الكائِنِ Tic، لا على Toc.' };
                return { ok: false, fix: 'أَضِفْ لَبِنَةَ «تَحَدَّثْ» مِنْ فِئَةِ المَظاهِرِ إلى مَقْطَعِ Tic.' };
              }
              const iSay = sc.findIndex(x => x.type === 'SAY');
              if (iSay < 1) return { ok: false, fix: 'رَتِّبِ المَقْطَعَ: العَلَمُ الأخْضَرُ أَوَّلًا ثُمَّ «تَحَدَّثْ».' };
              const sayB = sc[iSay];
              if (String(sayB.text || '').trim().length < 2)
                return { ok: false, fix: 'اكْتُبْ داخِلَ لَبِنَةِ «تَحَدَّثْ» جُمْلَةً مِثْلَ: ' + HELLO + '.' };
              if (!test()) return { ok: false, fix: 'شَغِّلِ العَلَمَ الأخْضَرَ لِتَرى Tic يَتَحَدَّثُ، ثُمَّ تَحَقَّقْ.' };
              return { ok: true, reason: 'يَتَحَدَّثُ Tic بِالجُمْلَةِ التي كَتَبْتَها عِنْدَ العَلَمِ الأخْضَرِ.' };
            };
            const PRAC = K.practical(api, { step: 'say', trigger: 'START', check });
            st.onChange = () => { PRAC.onEdit(); };
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ================= STAGE 3 — Toc waits, then replies ================= */
        {
          id: 'wait', step: 'wait',
          enter() {
            api.clearWork();
            api.say('اخْتَرْ Toc. أَضِفْ لَهُ: العَلَمَ الأخْضَرَ، ثُمَّ لَبِنَةَ الانْتِظارِ (Wait) مِنْ فِئَةِ التَّحَكُّمِ، ثُمَّ لَبِنَةَ تَحَدَّثْ يَرُدُّ فيها: ' + REPLY,
              'يَنْتَظِرُ Toc حَتّى يَنْتَهِيَ Tic مِنَ الكَلامِ ثُمَّ يَرُدُّ.');
            ensureStudio(); findToc();
            if (tocId) st.select(tocId);
            st.setCat('control');
            st.highlight('control', 'WAIT');
            const test = () => {
              if (!tocId) findToc();
              if (!tocId || !ticId) return false;
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              const a = sayOf(sim, ticId), b = sayOf(sim, tocId);
              if (!a || !b) return false;
              if (String(b.text).trim().length < 2) return false;
              return b.t > a.t;
            };
            const check = () => {
              if (!tocId) findToc();
              const o = tocId ? st.proj.obj(tocId) : null;
              if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Toc أَوَّلًا.' };
              /* FEEDBACK CORRECTNESS: several stages may leave their own
               * green-flag scripts on the same object, so the message must
               * describe the script the pupil is building HERE, not simply
               * the first one found. */
              const B = K.bestScript(o, 'START', [b => b.type === 'WAIT', b => b.type === 'SAY']);
              const s = B.script;
              if (!s) return { ok: false, fix: 'أَعْطِ Toc العَلَمَ الأخْضَرَ في البِدايَةِ.' };
              /* FIELD FIX (defect 4) — order and value are both required:
               * العلم الأخضر ← انتظر (30) ← تحدث. A Wait placed AFTER the Say,
               * or a Wait whose value is not 30, must not pass. */
              const iWait = s.findIndex(b => b.type === 'WAIT');
              const iSay = s.findIndex(b => b.type === 'SAY');
              if (iWait < 0) return { ok: false, fix: 'أَضِفْ لَبِنَةَ «انْتَظِرْ» مِنْ فِئَةِ التَّحَكُّمِ إلى مَقْطَعِ Toc.' };
              if (iSay < 0 || String(s[iSay].text || '').trim().length < 2)
                return { ok: false, fix: 'أَضِفْ لَبِنَةَ «تَحَدَّثْ» يَرُدُّ فيها Toc: ' + REPLY + '.' };
              if (iWait < 1) return { ok: false, fix: 'ضَعِ العَلَمَ الأخْضَرَ أَوَّلًا ثُمَّ لَبِنَةَ «انْتَظِرْ».' };
              if (iSay < iWait) return { ok: false, fix: 'ضَعْ لَبِنَةَ «انْتَظِرْ» قَبْلَ لَبِنَةِ «تَحَدَّثْ» لِيَتَأَخَّرَ رَدُّ Toc.' };
              const wv = s[iWait].val == null ? W.sjr.BLOCKS.WAIT.def : s[iWait].val;
              if (Number(wv) !== 30)
                return { ok: false, fix: 'اجْعَلْ قيمَةَ لَبِنَةِ الانْتِظارِ 30، لِأنَّ 10 تُعادِلُ ثانِيَةً وَ30 تُعادِلُ ثَلاثَ ثَوانٍ.' };
              if (!test()) return { ok: false, fix: 'رَتِّبِ المَقْطَعَ: العَلَمُ ثُمَّ «انْتَظِرْ» ثُمَّ «تَحَدَّثْ»، لِيَرُدَّ Toc بَعْدَ Tic.' };
              return { ok: true, reason: 'يَنْتَظِرُ Toc ثُمَّ يَرُدُّ بَعْدَ Tic — لِأنَّ لَبِنَةَ الانْتِظارِ أَخَّرَتْ مَقْطَعَهُ فِعْلًا.' };
            };
            const PRAC = K.practical(api, { step: 'wait', trigger: 'START', check });
            st.onChange = () => { PRAC.onEdit(); };
            st.onRun = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ================= STAGE 4 — run it, and read the clock ================= */
        {
          id: 'run', step: 'run',
          enter() {
            const PR_run = K.progress(api, { step: 'run', mode: 'theory' });
            api.clearWork();
            api.say('شَغِّلِ العَلَمَ الأخْضَرَ وَشاهِدِ المُحادَثَةَ. المَقْطَعانِ يَعْمَلانِ في الوَقْتِ نَفْسِهِ.',
              'ثُمَّ أَجِبْ: إذا كانَتِ القيمَةُ 10 تُعادِلُ ثانِيَةً، فَكَمْ ثانِيَةً تُعادِلُ 30؟');
            ensureStudio(); findToc();
            st.highlight(null, null);

            let ran = false, answered = false;
            const p = api.panel('p-clock');
            const TH = W.kit.theory(p, {
              art: 'dialogueWait',
              artLabel: 'Tic يتحدث ثم ينتظر Toc ثلاث ثوان ثم يرد',
              title: 'مَنْ يَتَحَدَّثُ أَوَّلًا؟',
              points: ['يَتَحَدَّثُ Tic أَوَّلًا.', 'يَنْتَظِرُ Toc ثَلاثَ ثَوانٍ.', 'ثُمَّ يَرُدُّ Toc.'],
              note: 'القيمَةُ 10 تُعادِلُ ثانِيَةً واحِدَةً.',
            });
            TH.bottom.appendChild(el('h4', { class: 'p-sub', text: 'قيمَةُ لَبِنَةِ الانْتِظارِ' }));
            const qs = el('div', { class: 'clockq', 'data-clockq': '1' });
            [['1', false], ['2', false], ['3', true], ['30', false]].forEach(([lab, right]) => {
              qs.appendChild(el('button', {
                class: 'clockopt', type: 'button', 'data-opt': lab, text: lab + ' ثَوانٍ',
                onclick: () => {
                  if (right) {
                    answered = true;
                    api.good('صَحيحٌ: 10 = ثانِيَةٌ، 20 = ثانِيَتانِ، 30 = ثَلاثُ ثَوانٍ.');
                    fin();
                  } else {
                    api.hint('لَيْسَ بَعْدُ. القيمَةُ 10 تُعادِلُ ثانِيَةً واحِدَةً.');
                  }
                },
              }));
            });
            TH.bottom.appendChild(qs);

            st.onRun = () => { ran = true; if (answered) fin(); };
            const fin = () => {
              if (!(ran && answered)) {
                if (!ran) api.hint('شَغِّلِ العَلَمَ الأخْضَرَ أَوَّلًا.');
                return;
              }
              PR_run.succeed();
            };
            this._ok = () => ran && answered;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ================= STAGE 5 — change the value, see the change ======= */
        {
          id: 'edit', step: 'edit',
          enter() {
            api.clearWork();
            api.say('غَيِّرْ قيمَةَ لَبِنَةِ الانْتِظارِ عِنْدَ Toc، ثُمَّ شَغِّلْ مَرَّةً أُخْرى وَلاحِظِ الفَرْقَ في وَقْتِ الرَّدِّ.',
              'ثُمَّ اكْتُبْ حِوارَكَ الخاصَّ إنْ أَحْبَبْتَ.');
            ensureStudio(); findToc();
            if (tocId) st.select(tocId);
            st.highlight('control', 'WAIT');

            /* record the gap the pupil arrives with, then require a real change */
            const gap = () => {
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              const a = sayOf(sim, ticId), b = sayOf(sim, tocId);
              return (a && b) ? (b.t - a.t) : null;
            };
            const base = gap();
            let ranOnce = false;
            const test = () => {
              const g = gap();
              if (g == null || base == null) return false;
              return g > 0 && Math.abs(g - base) >= 90;
            };
            const check = () => {
              const g = gap();
              if (g == null) return { ok: false, fix: 'تَأَكَّدْ أَنَّ Tic وَToc يَتَحَدَّثانِ (مِنَ المَرْحَلَةِ السَّابِقَةِ).' };
              if (!ranOnce) return { ok: false, fix: 'غَيِّرْ قيمَةَ لَبِنَةِ الانْتِظارِ ثُمَّ اضْغَطْ زِرَّ التَّشْغيلِ.' };
              if (base != null && Math.abs(g - base) < 90) return { ok: false, fix: 'غَيِّرْ قيمَةَ لَبِنَةِ الانْتِظارِ عِنْدَ Toc بِمِقْدارٍ واضِحٍ (مِثْلُ 10 ← 30) ثُمَّ شَغِّلْ.' };
              return { ok: true, reason: 'تَغَيَّرَ وَقْتُ رَدِّ Toc لِأنَّكَ غَيَّرْتَ قيمَةَ لَبِنَةِ الانْتِظارِ، وَظَهَرَ الأثَرُ عِنْدَ التَّشْغيلِ.' };
            };
            const PRAC = K.practical(api, { step: 'edit', trigger: 'START', check });
            st.onChange = () => { PRAC.onEdit(); };
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

/* ==== lessons/l3.js ==== */
/* ==== lessons/l3.js — الدرس 1.3: حَلُّ الْمُشْكِلاتِ ====
 * Student Book p.26 · Teacher's Guide p.34 · 1 session
 * OBJECTIVES: التعرف إلى مفهوم المشكلة · اتباع خطوات دورة حل المشكلات.
 * criteria: cycle · room · fix
 *
 * Stage 1 (cycle): order the FIVE steps of the problem-solving cycle
 *   1 فهم المشكلة · 2 عصف ذهني · 3 إيجاد الحل · 4 تنفيذ الحل · 5 التحقق من النتائج
 *   framed by the football-preparation example from SB p.26.
 * Stage 2 (room): apply the cycle to organising a messy room (SB p.28).
 * Stage 3 (fix): a REAL ScratchJr timing bug — Toc replies BEFORE Tic because
 *   its Wait is missing; the pupil detects it, adds/edits the Wait, runs, and
 *   the engine confirms Toc now speaks AFTER Tic (implement + verify).
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  const CYCLE = [
    { id: 'c1', ar: 'فَهْمُ المُشْكِلَةِ' },
    { id: 'c2', ar: 'عَصْفٌ ذِهْنِيٌّ' },
    { id: 'c3', ar: 'إيجادُ الحَلِّ' },
    { id: 'c4', ar: 'تَنْفيذُ الحَلِّ' },
    { id: 'c5', ar: 'التَّحَقُّقُ مِنَ النَّتائِجِ' },
  ];
  const CYCLE_ANSWER = 'c1,c2,c3,c4,c5';

  const sayOf = (sim, id) => sim.events.find(e => e.kind === 'say' && e.obj === id) || null;

  W.lessons.register('l3', {
    stages(api) {
      let st = null, ticId = null, tocId = null;

      return [
        /* ===== STAGE 1 — order the problem-solving cycle ===== */
        {
          id: 'cycle', step: 'cycle',
          enter() {
            const PR_cycle = K.progress(api, { step: 'cycle', mode: 'theory' });
            api.clearWork();
            api.say('المُشْكِلَةُ مَوْقِفٌ صَعْبٌ يَحْتاجُ إلى حَلٍّ. رَتِّبْ خُطُواتِ دَوْرَةِ حَلِّ المُشْكِلاتِ الخَمْسِ، ثُمَّ تَحَقَّقْ.',
              'مِثالٌ: تَجْهيزُ مَلابِسِ كُرَةِ القَدَمِ.');
            const p = api.panel('p-flow');
            const TH = K.theory(p, {
              art: 'problemCycle',
              artLabel: 'دورة حل المشكلات: خمس خطوات متصلة',
              caption: 'دَوْرَةُ حَلِّ المُشْكِلاتِ — خَمْسُ خُطُواتٍ تَتَكَرَّرُ',
              title: 'مِثالٌ: تَجْهيزُ مَلابِسِ كُرَةِ القَدَمِ',
              points: ['ما المُشْكِلَةُ؟', 'ما الحُلولُ المُمْكِنَةُ؟', 'أَخْتارُ الحَلَّ.', 'أُنَفِّذُ الحَلَّ.', 'أَتَحَقَّقُ مِنَ النَّتيجَةِ.'],
            });
            const w = K.orderWidget({
              cards: W.util.shuffleNotIdentity(CYCLE.slice(), c => c.id), slots: 5,
              bankLabel: 'خُطُواتُ الدَّوْرَةِ — رَتِّبْها',
              onChange: () => { w.clearMarks(); api.clearFb(); },
            });
            TH.bottom.appendChild(w.host);
            let ok = false;
            TH.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-cycle', text: 'تَحَقَّقْ',
                onclick: () => {
                  if (ok) return;
                  if (!w.filled()) { api.hint('ضَعْ خُطْوَةً في كُلِّ مَوْضِعٍ.'); return; }
                  w.mark(CYCLE_ANSWER.split(','));
                  if (w.order().join(',') === CYCLE_ANSWER) { ok = true; api.good('أَحْسَنْتَ! هذِهِ خُطُواتُ دَوْرَةِ حَلِّ المُشْكِلاتِ.'); PR_cycle.succeed(); }
                  else api.hint('راجِعْ تَرْتيبَ الخُطُواتِ: نَبْدَأُ بِفَهْمِ المُشْكِلَةِ.');
                } }),
            ]));
            this._ok = () => ok;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — apply the cycle to organising a room ===== */
        {
          id: 'room', step: 'room',
          enter() {
            const PR_room = K.progress(api, { step: 'room', mode: 'theory' });
            api.clearWork();
            api.say('غُرْفَةٌ غَيْرُ مُرَتَّبَةٍ! طَبِّقْ دَوْرَةَ حَلِّ المُشْكِلاتِ: اخْتَرِ الحَلَّ المُناسِبَ لِكُلِّ خُطْوَةٍ ثُمَّ تَحَقَّقْ.');
            const p = api.panel('p-flow');
            const TH2 = K.theory(p, {
              art: 'beforeAfter',
              artLabel: 'الغرفة قبل الترتيب وبعده',
              caption: 'قَبْلَ الحَلِّ… وَبَعْدَ الحَلِّ',
              title: 'طَبِّقِ الدَّوْرَةَ على الغُرْفَةِ',
              note: 'وَزِّعْ كُلَّ بِطاقَةٍ على الخُطْوَةِ المُناسِبَةِ لَها.',
            });
            const w = K.matchWidget({
              targets: [
                { id: 'understand', label: '١ فَهْمُ المُشْكِلَةِ' },
                { id: 'solve', label: '٣ إيجادُ الحَلِّ' },
                { id: 'check', label: '٥ التَّحَقُّقُ' },
              ],
              items: [
                { id: 'i1', label: 'الغُرْفَةُ فيها ألعابٌ وَمَلابِسُ مُبَعْثَرَةٌ', target: 'understand' },
                { id: 'i2', label: 'أَضَعُ الألعابَ في الصُّنْدوقِ والمَلابِسَ في الخِزانَةِ', target: 'solve' },
                { id: 'i3', label: 'أَنْظُرُ: هَلْ أَصْبَحَتِ الغُرْفَةُ مُرَتَّبَةً؟', target: 'check' },
              ],
              onChange: () => api.clearFb(),
            });
            TH2.bottom.appendChild(w.host);
            let ok = false;
            TH2.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-room', text: 'تَحَقَّقْ',
                onclick: () => {
                  if (ok) return;
                  if (!w.allPlaced()) { api.hint('وَزِّعِ البِطاقاتِ الثَّلاثَ على الخُطُواتِ.'); return; }
                  if (w.verify()) { ok = true; api.good('مُمْتاز! طَبَّقْتَ الدَّوْرَةَ على مُشْكِلَةٍ يَوْمِيَّةٍ.'); PR_room.succeed(); }
                  else api.hint('راجِعْ: أَيُّ بِطاقَةٍ تُناسِبُ كُلَّ خُطْوَةٍ؟');
                } }),
            ]));
            this._ok = () => ok;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — detect & fix a real ScratchJr timing bug ===== */
        {
          id: 'fix', step: 'fix',
          enter() {
            const PR_fix = K.progress(api, { step: 'fix', mode: 'practical' });
            api.clearWork();
            api.say('مُشْكِلَةٌ بَرْمَجِيَّةٌ: Toc يَرُدُّ قَبْلَ أَنْ يَتَحَدَّثَ Tic! أَصْلِحِ المَقْطَعَ بِإضافَةِ لَبِنَةِ الانْتِظارِ (Wait) لِـ Toc ثُمَّ شَغِّلْ.',
              'اتَّبِعْ دَوْرَةَ حَلِّ المُشْكِلاتِ: افْهَمْ ← نَفِّذِ الحَلَّ ← تَحَقَّقْ.');
            st = api.studio({
              cols: 12, rows: 8, background: 'park',
              blocks: ['START', 'FWD', 'BACK', 'SAY', 'WAIT'],
              allowAdd: false, allowPages: false, showPages: false, grid: false,
            });
            if (!st._seeded) {
              const tic = st.proj.addObject({ kind: 'tic', x: 2, y: 5 });
              const toc = st.proj.addObject({ kind: 'toc', x: 8, y: 5 });
              ticId = tic.id; tocId = toc.id;
              /* seed the BUGGY project: Tic says hello; Toc replies with NO wait */
              st.proj.addBlock(tic.id, 'START');
              st.proj.addBlock(tic.id, 'SAY', { text: 'السلام عليكم' });
              st.proj.addBlock(toc.id, 'START');
              st.proj.addBlock(toc.id, 'SAY', { text: 'وعليكم السلام' });
              st._seeded = true;
              st.repaint();
            } else { ticId = st.proj.page().objects[0].id; tocId = st.proj.page().objects[1].id; }
            st.select(tocId);
            st.setCat('control');
            st.highlight('control', 'WAIT');

            let ok = false;
            const test = () => {
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              const a = sayOf(sim, ticId), b = sayOf(sim, tocId);
              return !!(a && b && b.t > a.t);   // Toc must now speak AFTER Tic
            };
            st.onChange = () => { if (!ok && test()) { ok = true; api.good('تَمَّ الإصْلاحُ! صارَ Toc يَنْتَظِرُ ثُمَّ يَرُدُّ. شَغِّلْ لِتَتَأَكَّدَ.'); PR_fix.succeed(); } };
            st.onRun = () => { if (!ok && test()) st.onChange(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

/* ==== lessons/l4.js ==== */
/* ==== lessons/l4.js — الدرس 1.4: طُرُقُ تَشْغيلِ البَرْنامَجِ ====
 * Student Book p.30 · Teacher's Guide p.40 · 1 session
 * OBJECTIVES: التعامل مع لبنات التشغيل · التمييز بين ابدأ عند النقر وابدأ عند الاصطدام.
 * criteria: tap · bump · ball
 *
 * The completion condition uses the EXECUTION RESULT passed to the callback
 * (sim.final), captured at run time — never a later re-simulation from an
 * already-mutated state. Each stage sets its own studio callbacks after any
 * setAllowed/repaint so the lesson handler is never overwritten.
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;
  const MOTION = ['FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L', 'HOP', 'GO_HOME'];

  W.lessons.register('l4', {
    stages(api) {
      let st = null;
      const idOf = kind => { const o = st.proj.page().objects.find(x => x.kind === kind); return o ? o.id : null; };

      return [
        /* ===== STAGE 1 — Start on Tap ===== */
        {
          id: 'tap', step: 'tap',
          enter() {
            api.clearWork();
            api.say('لَبِنَةُ «ابْدَأْ عِنْدَ النَّقْرِ» تُشَغِّلُ المَقْطَعَ عِنْدَ النَّقْرِ على الكائِنِ. اجْعَلْ Tic يَتَحَرَّكُ عِنْدَ النَّقْرِ عَلَيْهِ، ثُمَّ انْقُرْ عَلَيْهِ في المِنَصَّةِ.',
              'ابْدَأْ بِلَبِنَةِ ابْدَأْ عِنْدَ النَّقْرِ مِنْ فِئَةِ التَّشْغيلِ، ثُمَّ لَبِنَةَ حَرَكَةٍ.');
            const cs = api.panel('p-concept');
            cs.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'tapVsBump',
              role: 'img', 'aria-label': 'الفرق بين النقر والاصطدام' }, [W.edu.scene('tapVsBump')]));
            cs.appendChild(el('div', { class: 'concept-txt' }, [
              el('div', { class: 'concept-h', text: 'النَّقْرُ وَالاصْطِدامُ' }),
              el('div', { class: 'concept-p', text: 'النَّقْرُ: نَلْمِسُ الكائِنَ بِأَنْفُسِنا. الاصْطِدامُ: يَلْمِسُ كائِنٌ كائِنًا آخَرَ.' }),
            ]));
            st = api.studio({
              cols: 12, rows: 8, background: 'park',
              blocks: ['START', 'ON_TAP', 'FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L'],
              allowAdd: false, allowPages: false, showPages: false, grid: true,
            });
            st.setAllowed(['START', 'ON_TAP', 'FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L']);
            if (!st._seeded) { st.proj.addObject({ kind: 'tic', x: 2, y: 5 }); st._seeded = true; }
            st.select(idOf('tic'));
            st.setCat('trigger'); st.highlight('trigger', 'ON_TAP');
            st.repaint();

            const ticObj = () => st.proj.obj(idOf('tic'));
            const hasTapHead = () => { const o = ticObj(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP'); };
            const hasTapScript = () => { const o = ticObj(); return o && o.scripts.some(s => s.length >= 2 && s[0].type === 'ON_TAP' && s.some(b => MOTION.includes(b.type))); };
            let tapped = false;
            /* the pupil TAPS Tic to run it; we remember whether that tap moved it */
            st.onRun = (sim) => {
              const o = ticObj(); if (!o) return;
              const s = sim && sim.final ? sim.final[o.id] : null;
              if (s && (s.x !== o.home.x || s.y !== o.home.y || s.heading !== o.home.heading)) tapped = true;
              PRAC.onEdit();
            };
            st.onChange = () => { PRAC.onEdit(); };
            const check = () => {
              const o = ticObj();
              if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              if (!hasTapHead()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ «ابْدَأْ عِنْدَ النَّقْرِ» في بِدايَةِ المَقْطَعِ (فِئَةُ التَّشْغيلِ).' };
              if (!hasTapScript()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ حَرَكَةٍ بَعْدَ «ابْدَأْ عِنْدَ النَّقْرِ».' };
              if (!tapped) return { ok: false, fix: 'انْقُرْ على Tic في المِنَصَّةِ لِتُشَغِّلَ المَقْطَعَ.' };
              return { ok: true, reason: 'بَدَأَ المَقْطَعُ عِنْدَ النَّقْرِ على Tic فَتَحَرَّكَ.' };
            };
            const PRAC = K.practical(api, { step: 'tap', trigger: 'ON_TAP', only: idOf('tic'), check });
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — Start on Bump ===== */
        {
          id: 'bump', step: 'bump',
          enter() {
            api.clearWork();
            api.say('أُضيفَ الطَّائِرُ (Bird). أَعْطِ الطَّائِرَ لَبِنَةَ «ابْدَأْ عِنْدَ الاصْطِدامِ» وَحَرَكَةً، ثُمَّ شَغِّلِ العَلَمَ الأخْضَرَ لِيَتَحَرَّكَ Tic نَحْوَ الطَّائِرِ حَتّى يَصْطَدِمَ بِهِ.',
              'الاصْطِدامُ يُشَغِّلُ المَقْطَعَ عِنْدَما يَلْمِسُ كائِنٌ كائِنًا آخَرَ — وَلا يَعْمَلُ قَبْلَ ذلِكَ.');
            st = api.studio({});
            st.setAllowed(['START', 'ON_TAP', 'ON_BUMP', 'FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L']);
            if (!idOf('bird')) st.proj.addObject({ kind: 'bird', x: 7, y: 5 });
            const tic = st.proj.obj(idOf('tic'));
            if (tic) {
              st.proj.resetObject(tic);   // return Tic to home so its run starts at x=2
              tic.x = tic.home.x; tic.y = tic.home.y;
              st.proj.clearScripts(tic.id);
              st.proj.addBlock(tic.id, 'START');
              st.proj.addBlock(tic.id, 'FWD', { val: 5 });   // 2 -> 7, lands on the bird
            }
            // make sure the bird sits exactly where Tic's 5 steps arrive
            const bd0 = st.proj.obj(idOf('bird'));
            if (bd0) { bd0.x = 7; bd0.y = 5; bd0.home.x = 7; bd0.home.y = 5; }
            st.select(idOf('bird'));
            st.setCat('trigger'); st.highlight('trigger', 'ON_BUMP');
            st.repaint();

            const birdObj = () => st.proj.obj(idOf('bird'));
            const ticObj = () => st.proj.obj(idOf('tic'));
            const birdHasBumpHead = () => { const o = birdObj(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_BUMP'); };
            const birdHasBump = () => { const o = birdObj(); return o && o.scripts.some(s => s.length >= 2 && s[0].type === 'ON_BUMP' && s.some(b => MOTION.includes(b.type))); };
            let collided = false;
            st.onRun = (sim) => {
              const t = ticObj(), bd = birdObj();
              if (t && bd) {
                const ft = sim && sim.final ? sim.final[t.id] : null;
                if (ft && Math.abs(ft.x - bd.x) <= 1 && Math.abs(ft.y - bd.y) <= 1) {
                  if (birdHasBump()) st.checkBump();     // fire the real ON_BUMP
                  collided = true;
                }
              }
              PRAC.onEdit();
            };
            const check = () => {
              const bd = birdObj();
              if (!bd) return { ok: false, fix: 'أُضيفَ الطَّائِرُ — اخْتَرْهُ أَوَّلًا.' };
              if (!birdHasBumpHead()) return { ok: false, fix: 'أَعْطِ الطَّائِرَ لَبِنَةَ «ابْدَأْ عِنْدَ الاصْطِدامِ» (فِئَةُ التَّشْغيلِ).' };
              if (!birdHasBump()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ حَرَكَةٍ لِلطَّائِرِ بَعْدَ «ابْدَأْ عِنْدَ الاصْطِدامِ».' };
              if (!collided) return { ok: false, fix: 'شَغِّلِ العَلَمَ الأخْضَرَ لِيَتَحَرَّكَ Tic حَتّى يَصْطَدِمَ بِالطَّائِرِ.' };
              return { ok: true, reason: 'اصْطَدَمَ Tic بِالطَّائِرِ فَبَدَأَ مَقْطَعُ الاصْطِدامِ — وَلَمْ يَعْمَلْ قَبْلَ الاصْطِدامِ.' };
            };
            const PRAC = K.practical(api, { step: 'bump', trigger: 'START', check });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — boy, ball & goal (SB p.33) ===== */
        {
          id: 'ball', step: 'ball',
          enter() {
            api.clearWork();
            api.say('مَلْعَبٌ! عِنْدَ النَّقْرِ على الوَلَدِ يَتَحَرَّكُ نَحْوَ الكُرَةِ، وَعِنْدَ اصْطِدامِهِ بِها تَتَحَرَّكُ الكُرَةُ نَحْوَ المَرْمى. ابْنِ المَقْطَعَيْنِ ثُمَّ انْقُرْ على الوَلَدِ.',
              'الوَلَدُ: ابْدَأْ عِنْدَ النَّقْرِ + حَرَكَة. الكُرَةُ: ابْدَأْ عِنْدَ الاصْطِدامِ + حَرَكَة.');
            st = api.studio({});
            st.setAllowed(['START', 'ON_TAP', 'ON_BUMP', 'FWD', 'UP', 'ROT_R']);
            if (!st._ballSeeded) {
              const pg = st.proj.page();
              pg.objects.slice().forEach(o => st.proj.removeObject(o.id));
              st.proj.addObject({ kind: 'child', x: 1, y: 5 });
              st.proj.addObject({ kind: 'ball', x: 5, y: 5 });
              st.proj.addObject({ kind: 'goal', x: 10, y: 5 });
              st._ballSeeded = true;
            }
            st.setBackground('field');
            st.select(idOf('child'));
            st.setCat('trigger');
            st.repaint();

            const boy = () => st.proj.obj(idOf('child'));
            const ball = () => st.proj.obj(idOf('ball'));
            const boyHead = () => { const o = boy(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP'); };
            const boyReady = () => { const o = boy(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP' && s.some(b => b.type === 'FWD')); };
            const ballHead = () => { const o = ball(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_BUMP'); };
            const ballReady = () => { const o = ball(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_BUMP' && s.some(b => ['FWD', 'UP'].includes(b.type))); };
            let scored = false;
            st.onRun = (sim) => {
              const bo = boy(), ba = ball();
              if (bo && ba && boyReady() && ballReady()) {
                const fb = sim && sim.final ? sim.final[bo.id] : null;
                if (fb && Math.abs(fb.x - ba.x) <= 1 && Math.abs(fb.y - ba.y) <= 1) { st.checkBump(); scored = true; }
              }
              PRAC.onEdit();
            };
            const check = () => {
              if (!boyHead()) return { ok: false, fix: 'أَعْطِ الوَلَدَ لَبِنَةَ «ابْدَأْ عِنْدَ النَّقْرِ» (فِئَةُ التَّشْغيلِ).' };
              if (!boyReady()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ حَرَكَةٍ (تَحَرَّكْ يَمينًا) لِلْوَلَدِ.' };
              if (!ballHead()) return { ok: false, fix: 'أَعْطِ الكُرَةَ لَبِنَةَ «ابْدَأْ عِنْدَ الاصْطِدامِ».' };
              if (!ballReady()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ حَرَكَةٍ لِلْكُرَةِ بَعْدَ «ابْدَأْ عِنْدَ الاصْطِدامِ».' };
              if (!scored) return { ok: false, fix: 'انْقُرْ على الوَلَدِ لِيَصِلَ إلى الكُرَةِ فَتَنْطَلِقَ نَحْوَ المَرْمى.' };
              return { ok: true, reason: 'نَقْرُ الوَلَدِ حَرَّكَهُ نَحْوَ الكُرَةِ، وَالاصْطِدامُ حَرَّكَ الكُرَةَ نَحْوَ المَرْمى.' };
            };
            const PRAC = K.practical(api, { step: 'ball', trigger: 'ON_TAP', only: idOf('child'), check });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

/* ==== lessons/l5.js ==== */
/* ==== lessons/l5.js — الدرس 1.5: لِنَتَدَرَّبْ على طُرُقِ التَّشْغيلِ ====
 * Student Book p.34 · Teacher's Guide p.45 · 1 session
 * OBJECTIVES: مطابقة اللبنات بالفئات · اختيار المقطع البرمجي الصحيح · بناء مقاطع لكائنين.
 * criteria: match · choose · build
 *
 * Stage 1 (match): SB p.34 ex.1 — match trigger blocks and Wait to categories.
 * Stage 2 (choose): choose the script that produces the shown motion; the
 *   choice is validated by RUNNING the chosen script in the engine.
 * Stage 3 (build): build a script for Tic AND a script for the butterfly;
 *   verified by computed final positions of BOTH objects.
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  W.lessons.register('l5', {
    stages(api) {
      let st = null;
      const idOf = kind => { const o = st.proj.page().objects.find(x => x.kind === kind); return o ? o.id : null; };

      return [
        /* ===== STAGE 1 — match blocks to categories ===== */
        {
          id: 'match', step: 'match',
          enter() {
            const PR_match = K.progress(api, { step: 'match', mode: 'theory' });
            api.clearWork();

          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

              'القِيمَةُ الافْتِراضِيَّةُ لِلتَّكْبيرِ والتَّصْغيرِ هِيَ 2.');

            const check = () => {

        /* ===== STAGE 2 — the apple drops (real motion) ===== */

          id: 'apple', step: 'apple',
          enter() {
            api.clearWork();
            api.say('اجْعَلِ التُّفَّاحَةَ تَسْقُطُ مِنَ الشَّجَرَةِ ثُمَّ تَتَغَيَّرُ ثُمَّ تَعودُ إلى حَجْمِها: العَلَمُ الأخْضَرُ، «تَحَرَّكْ لأسْفَلَ»، ثُمَّ «كَبِّرْ» أَوْ «صَغِّرْ»، ثُمَّ «أَعِدِ الحَجْمَ»، ثُمَّ شَغِّلْ.',

              blocks: ['START', 'ON_TAP', 'FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L', 'GROW', 'SHRINK', 'RESET_SZ'],

            st.setAllowed(['START', 'ON_TAP', 'FWD', 'BACK', 'UP', 'DOWN', 'ROT_R', 'ROT_L', 'GROW', 'SHRINK', 'RESET_SZ']);
            if (!st._appleSeeded) {

            st.repaint();
            const O = () => st.proj.obj(idOf('apple'));
            let ranOnce = false;
            /* CURRICULUM CORRECTNESS — the official objective of lesson 1.7 is
             * «التدرب على استخدام لبنات تكبير، وتصغير، واستعادة حجم كائن»,
             * but this stage used to gate on a single «تحرك لأسفل». The

            const SIZE_B = ['GROW', 'SHRINK'];

              if (!ranOnce) return { ok: false, fix: 'اضْغَطْ زِرَّ التَّشْغيلِ لِتَسْقُطَ التُّفَّاحَةُ.' };
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });

              if (!(s && s.y > o.home.y))
                return { ok: false, fix: 'اجْعَلِ التُّفَّاحَةَ تَنْزِلُ فِعْلًا (تَحَرَّكْ لأسْفَلَ) ثُمَّ شَغِّلْ.' };
              if (!sizeEvents().some(e => e.size !== o.home.size))
                return { ok: false, fix: 'اجْعَلِ الحَجْمَ يَتَغَيَّرُ فِعْلًا: ضَعْ قيمَةً لِـ«كَبِّرْ» أَوْ «صَغِّرْ».' };
              if (s.size !== o.home.size)
                return { ok: false, fix: 'ضَعْ لَبِنَةَ «أَعِدِ الحَجْمَ» بَعْدَ التَّكْبيرِ أَوِ التَّصْغيرِ لِيَعودَ الحَجْمُ كَما بَدَأَ.' };
              return { ok: true, reason: 'سَقَطَتِ التُّفَّاحَةُ، وَتَغَيَّرَ حَجْمُها، ثُمَّ عادَ إلى حَجْمِهِ الأصْلِيِّ — تَكْبيرٌ وَتَصْغيرٌ وَاسْتِعادَةُ حَجْمٍ.' };
            };
            const PRAC = K.practical(api, { step: 'apple', trigger: 'START', check });
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — debug a wrong-direction script ===== */
        {
          id: 'debug', step: 'debug',
          enter() {
            api.clearWork();
            api.say('مَقْطَعُ السَّرَطانِ خاطِئٌ: يَجِبُ أَنْ يَتَحَرَّكَ إلى اليَمينِ ثُمَّ لأعْلى لِيَصِلَ إلى الهَدَفِ، لكِنَّهُ يَتَحَرَّكُ في الاتِّجاهِ الخَطَأِ. احْذِفِ اللَّبِنَةَ الخاطِئَةَ وَأَصْلِحْها، ثُمَّ شَغِّلْ.',

            const pC_fix = api.panel('p-concept');
            pC_fix.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'fixAnimation',
              role: 'img', 'aria-label': 'مقطع خاطئ بجانب المقطع المصحح' }, [W.edu.scene('fixAnimation')]));
            st = api.studio({});
            st.setAllowed(['START', 'FWD', 'BACK', 'UP', 'DOWN']);
            if (!st._debugSeeded) {
              const pg = st.proj.page();
              pg.objects.slice().forEach(o => st.proj.removeObject(o.id));
              const crab = st.proj.addObject({ kind: 'crab', x: 2, y: 6 });
              /* BUGGY: moves LEFT then DOWN instead of RIGHT then UP */
              st.proj.addBlock(crab.id, 'START');
              st.proj.addBlock(crab.id, 'BACK', { val: 3 });
              st.proj.addBlock(crab.id, 'DOWN', { val: 3 });
              st._debugSeeded = true;
            }
            st.select(idOf('crab')); st.setCat('motion');
            st.repaint();
            const TARGET = { x: 5, y: 3 };   // right 3 from x2, up 3 from y6
            const O = () => st.proj.obj(idOf('crab'));
            let ranOnce = false;
            const test = () => { const o = O(); if (!o) return false; const s = st.proj.simulate({ trigger: 'START', fromHome: true }).final[o.id]; return s && s.x === TARGET.x && s.y === TARGET.y; };
            const check = () => {
              const o = O(); if (!o) return { ok: false, fix: 'اخْتَرِ السَّرَطانَ أَوَّلًا.' };
              const s = st.proj.simulate({ trigger: 'START', fromHome: true }).final[o.id];
              if (!ranOnce) return { ok: false, fix: 'أَصْلِحِ اللَّبِناتِ ثُمَّ اضْغَطْ زِرَّ التَّشْغيلِ.' };
              if (!s) return { ok: false, fix: 'أَعْطِ السَّرَطانَ العَلَمَ الأخْضَرَ وَلَبِناتِ الحَرَكَةِ.' };
              if (s.x < TARGET.x) return { ok: false, fix: 'اسْتَبْدِلْ «تَحَرَّكْ يَسارًا» بِـ«تَحَرَّكْ يَمينًا 3» لِيَتَّجِهَ نَحْوَ الهَدَفِ.' };
              if (s.y > TARGET.y) return { ok: false, fix: 'اسْتَبْدِلْ «تَحَرَّكْ لأسْفَلَ» بِـ«تَحَرَّكْ لأعْلى 3».' };
              if (!test()) return { ok: false, fix: 'اجْعَلْهُ يَتَحَرَّكُ يَمينًا 3 ثُمَّ لأعْلى 3 لِيَصِلَ إلى المَوْضِعِ الأعْلى يَمينًا.' };
              return { ok: true, reason: 'أَصْلَحْتَ المَقْطَعَ فَوَصَلَ السَّرَطانُ إلى الهَدَفِ (يَمينًا ثُمَّ لأعْلى).' };
            };
            const PRAC = K.practical(api, { step: 'debug', trigger: 'START', check });
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },

/* ==== lessons/l8.js — الدرس 1.8: التَّعامُلُ مَعَ الصَّفَحاتِ ====
 * Student Book p.52 · Teacher's Guide p.68 · 1 session
 * OBJECTIVES: إضافة صفحات · برمجة كائنات في صفحات مختلفة · التنقل بين الصفحات.
 * criteria: addpage · perpage · goto
 *
 * The four-seasons project (SB pp.52-56). Real ScratchJr pages: each page has
 * its OWN background, objects and scripts, and a new page starts EMPTY.
 * Stage 1 (addpage): add a second page — page count really increases.
 * Stage 2 (perpage): give the second page its own background + object, proving
 *   independent per-page state.
 * Stage 3 (goto): add a «اذهب إلى الصفحة» block on page 1 and run it; the
 *   engine navigates to page 2 (computed page event / current page changes).
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  W.lessons.register('l8', {
    stages(api) {
      let st = null;
      function ensure() {
            const cs = api.panel('p-concept');
            cs.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'pagesDiagram',
              role: 'img', 'aria-label': 'ثلاث صفحات لكل منها خلفيتها وكائناتها' }, [W.edu.scene('pagesDiagram')]));
            cs.appendChild(el('div', { class: 'concept-txt' }, [
              el('div', { class: 'concept-h', text: 'الصَّفَحاتُ' }),
              el('div', { class: 'concept-p', text: 'لِكُلِّ صَفْحَةٍ خَلْفِيَّتُها وَكائِناتُها وَمَقاطِعُها الخاصَّةُ.' }),
            ]));
        st = api.studio({
          cols: 12, rows: 8, background: 'park',
          blocks: ['START', 'FWD', 'UP', 'DOWN', 'ROT_R', 'GO_PAGE', 'END'],
          allowAdd: true, allowPages: true, showPages: true, grid: false,
        });
        st.setAllowed(['START', 'FWD', 'UP', 'DOWN', 'ROT_R', 'GO_PAGE', 'END']);
        if (!st._seeded) {
          // page 1 already exists from studio.build; seed a horse-like actor
          if (!st.proj.page().objects.length) st.proj.addObject({ kind: 'tic', x: 3, y: 5 });
          st._seeded = true; st.repaint();
        }
        return st;
      }

      return [
        /* ===== STAGE 1 — add a page ===== */
        {
          id: 'addpage', step: 'addpage',
          enter() {
            const PR_addpage = K.progress(api, { step: 'addpage', mode: 'theory' });
            api.clearWork();
            api.say('مَشْروعُ الفُصولِ الأرْبَعَةِ يَحْتاجُ عِدَّةَ صَفَحاتٍ. أَضِفْ صَفْحَةً جَديدَةً بِالنَّقْرِ على (+) في عَمودِ الصَّفَحاتِ على اليَمينِ.',
              'كُلُّ صَفْحَةٍ جَديدَةٍ تَبْدَأُ فارِغَةً.');
            const pC_pagesTwo = api.panel('p-concept');
            pC_pagesTwo.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'pagesTwo',
              role: 'img', 'aria-label': 'صفحتان لكل منهما خلفية وكائن ومقطع' }, [W.edu.scene('pagesTwo')]));
            ensure();
            const base = st.proj.pageCount;
            const test = () => st.proj.pageCount > base;
            const check = () => {
              if (!test()) return { ok: false, fix: 'انْقُرْ على زِرِّ (+) في عَمودِ الصَّفَحاتِ على اليَمينِ لِإضافَةِ صَفْحَةٍ جَديدَةٍ.' };
              return { ok: true, reason: 'أُضيفَتْ صَفْحَةٌ جَديدَةٌ؛ عَدَدُ الصَّفَحاتِ الآنَ ' + st.proj.pageCount + '، وَبَدَأَتْ فارِغَةً.' };
            };
            const PRAC = K.practical(api, { step: 'addpage', trigger: 'START', check, noRun: true });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — independent per-page state ===== */
        {
          id: 'perpage', step: 'perpage',
          enter() {
            api.clearWork();
            api.say('اذْهَبْ إلى الصَّفْحَةِ الثَّانِيَةِ، ثُمَّ غَيِّرْ خَلْفِيَّتَها (مِنْ زِرِّ الخَلْفِيَّةِ) وَأَضِفْ إلَيْها كائِنًا. لِكُلِّ صَفْحَةٍ خَلْفِيَّتُها وَكائِناتُها الخاصَّةُ، ثُمَّ تَحَقَّقْ.');
            ensure();
            // make sure there is a page 2 to work on
            if (st.proj.pageCount < 2) { st.proj.addPage({ background: null }); }
            st.proj.setPage(1); st.repaint();
            /* REAL per-page independence (release closure, item 8).
             * Page 2 genuinely owns its state ONLY when every clause holds:
             *   - a second page exists;
             *   - page 2 has selected a background of its own;
             *   - page 2 carries at least one object of its own;
             *   - page 2 differs from page 1 in a way the pupil authored
             *     (a different background OR a different object set), proving
             *     the pages are not a shared surface;
             *   - page 1 still has its own object (it was not emptied).
             * The previous `|| true` short-circuit is gone: the difference
             * clause is now decisive, so a page 2 that merely mirrors page 1
             * no longer passes. `diagnose()` names the first missing clause. */
            const p1p2 = () => ({ p1: st.proj.project.pages[0], p2: st.proj.project.pages[1] });
            const objSig = pg => pg.objects.map(o => o.kind).sort().join('|');
            const test = () => {
              if (st.proj.pageCount < 2) return false;
              const { p1, p2 } = p1p2();
              if (!p2.background) return false;
              if (p2.objects.length < 1) return false;
              if (p1.objects.length < 1) return false;
              const differs = (p2.background !== p1.background) || (objSig(p2) !== objSig(p1));
              return differs;
            };
            const diagnose = () => {
              if (st.proj.pageCount < 2) return 'أَضِفْ صَفْحَةً ثانِيَةً أَوَّلًا مِنْ زِرِّ (+).';
              const { p1, p2 } = p1p2();
              if (!p2.background) return 'اذْهَبْ إلى الصَّفْحَةِ الثَّانِيَةِ وَاخْتَرْ لَها خَلْفِيَّةً مِنْ زِرِّ الخَلْفِيَّةِ.';
              if (p2.objects.length < 1) return 'أَضِفْ كائِنًا إلى الصَّفْحَةِ الثَّانِيَةِ مِنْ زِرِّ (+) في قائِمَةِ الكائِناتِ.';
              if (p1.objects.length < 1) return 'أَبْقِ كائِنًا في الصَّفْحَةِ الأولى أَيْضًا.';
              if ((p2.background === p1.background) && (objSig(p2) === objSig(p1)))
                return 'اجْعَلِ الصَّفْحَةَ الثَّانِيَةَ مُخْتَلِفَةً: غَيِّرْ خَلْفِيَّتَها أَوْ كائِنَها لِتُثْبِتَ أَنَّ لِكُلِّ صَفْحَةٍ حالَتَها الخاصَّةَ.';
              return 'تابِعْ إعْدادَ الصَّفْحَةِ الثَّانِيَةِ.';
            };
            const check = () => test()
              ? { ok: true, reason: 'الصَّفْحَةُ الثَّانِيَةُ لَها خَلْفِيَّةٌ وَكائِنٌ مُسْتَقِلَّانِ، وَتَخْتَلِفُ عَنِ الصَّفْحَةِ الأولى.' }
              : { ok: false, fix: diagnose() };
            const PRAC = K.practical(api, { step: 'perpage', trigger: 'START', check, noRun: true });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — Go to Page navigation ===== */
        {
          id: 'goto', step: 'goto',
          enter() {
            api.clearWork();

            });
            // pattern: square(red), star(orange), square(red), star(orange), [?]
            const seq = [['square', '#D94A4A'], ['star', '#EF8A24'], ['square', '#D94A4A'], ['star', '#EF8A24']];

            TH2.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-complete', text: 'تَحَقَّقْ',

            api.say('النَّمَطُ في البَرْمَجَةِ: اجْعَلْ Tic يُكَرِّرُ «تَحَرَّكْ ثُمَّ كَبِّرْ» مَرَّتَيْنِ على الأقَلِّ (تَحَرَّكْ، كَبِّرْ، تَحَرَّكْ، كَبِّرْ)، ثُمَّ شَغِّلْ.',
              'يُمْكِنُكَ بِناؤُها بِاللَّبِناتِ مُباشَرَةً.');
            st = api.studio({
              cols: 12, rows: 8, background: 'park',
              blocks: ['START', 'FWD', 'GROW', 'SHRINK'],
              allowAdd: false, allowPages: false, showPages: false, grid: true,
            });
            st.setAllowed(['START', 'FWD', 'GROW', 'SHRINK']);
            if (!st._seeded) { const pg = st.proj.page(); pg.objects.slice().forEach(o => st.proj.removeObject(o.id)); st.proj.addObject({ kind: 'tic', x: 1, y: 5 }); st._seeded = true; }
            st.select(idOf('tic')); st.setCat('motion');
            st.repaint();
            const O = () => st.proj.obj(idOf('tic'));
            let ranOnce = false;
            const seqOf = () => {
              const o = O(); if (!o) return '';
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              const evs = sim.events.filter(e => e.obj === o.id && (e.kind === 'move' || e.kind === 'size'));
              let seq = '';
              evs.forEach(e => { const c = e.kind === 'move' ? 'M' : 'S'; if (seq[seq.length - 1] !== c) seq += c; });

            const test = () => { const seq = seqOf(); return seq.indexOf('MSMS') >= 0 || (seq.match(/MS/g) || []).length >= 2; };
            const check = () => {
              const o = O(); if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              const hasStart = o.scripts.some(s => s[0] && s[0].type === 'START');
              if (!hasStart) return { ok: false, fix: 'أَضِفِ العَلَمَ الأخْضَرَ في بِدايَةِ المَقْطَعِ.' };
              const hasMove = o.scripts.some(s => s.some(b => b.type === 'FWD'));
              const hasGrow = o.scripts.some(s => s.some(b => b.type === 'GROW'));
              if (!hasMove || !hasGrow) return { ok: false, fix: 'اسْتَخْدِمْ لَبِنَتَيِ الحَرَكَةِ (تَحَرَّكْ) وَالتَّكْبيرِ (كَبِّرْ) لِتَصْنَعَ النَّمَطَ.' };

/* ==== lessons/l10.js ==== */
/* ==== lessons/l10.js — الدرس 1.10: التَّكْرارُ ====
 * Student Book p.64 · Teacher's Guide p.80 · 1 session
 * OBJECTIVES: مفهوم التكرار · التعامل مع لبنات التكرار.
 * criteria: repeat · forever · stop
 *
 * Stage 1 (repeat): rebuild a long script with a Repeat block — verified by
 *   computing that the nested body ran the chosen number of times.
 * Stage 2 (forever): use Repeat Forever so the run genuinely loops (the
 *   computed timeline is marked looping:true).
 * Stage 3 (stop): press Stop to safely cancel Repeat Forever; the object
 *   returns to a stopped, reset state and the app is no longer running.
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  W.lessons.register('l10', {
    stages(api) {
      let st = null;
      const idOf = kind => { const o = st.proj.page().objects.find(x => x.kind === kind); return o ? o.id : null; };
      function ensure(blocks) {
            const cs = api.panel('p-concept');
            cs.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'repeatCompare',
              role: 'img', 'aria-label': 'مقطع طويل مقابل مقطع بلبنة تكرار' }, [W.edu.scene('repeatCompare')]));
            cs.appendChild(el('div', { class: 'concept-txt' }, [
              el('div', { class: 'concept-h', text: 'التَّكْرارُ' }),
              el('div', { class: 'concept-p', text: 'لَبِنَةُ التَّكْرارِ تُغْني عَنْ تِكْرارِ اللَّبِناتِ يَدَوِيًّا.' }),
            ]));
        st = api.studio({
          cols: 12, rows: 8, background: 'city',
          blocks: blocks, allowAdd: false, allowPages: false, showPages: false, grid: true,
        });
        st.setAllowed(blocks);
        if (!st._seeded) { const pg = st.proj.page(); pg.objects.slice().forEach(o => st.proj.removeObject(o.id)); st.proj.addObject({ kind: 'tic', x: 1, y: 6 }); st._seeded = true; }
        st.select(idOf('tic')); st.repaint();
        return st;
      }

      return [
        /* ===== STAGE 1 — Repeat a nested body ===== */
        {
          id: 'repeat', step: 'repeat',
          enter() {
            api.clearWork();
            api.say('بَدَلًا مِنْ تَكْرارِ اللَّبِناتِ يَدَوِيًّا، اسْتَخْدِمْ لَبِنَةَ التَّكْرارِ (Repeat). أَعْطِ Tic: العَلَمَ الأخْضَرَ ثُمَّ لَبِنَةَ تَكْرارٍ بِداخِلِها حَرَكَةٌ، فَيَصْعَدُ عِدَّةَ خُطُواتٍ. اجْعَلِ التَّكْرارَ 3 على الأقَلِّ ثُمَّ شَغِّلْ ثُمَّ تَحَقَّقْ.',
              'لَبِنَةُ التَّكْرارِ في فِئَةِ التَّحَكُّمِ.');
            ensure(['START', 'FWD', 'UP', 'DOWN', 'REPEAT']);
            st.setCat('control'); st.highlight('control', 'REPEAT');
            const O = () => st.proj.obj(idOf('tic'));
            const hasStart = o => o.scripts.some(s => s[0] && s[0].type === 'START');
            const repBlock = o => { let r = null; o.scripts.forEach(s => s.forEach(b => { if (b.type === 'REPEAT') r = b; })); return r; };
            const test = () => {
              const o = O(); if (!o) return false;
              const hasRepeat = o.scripts.some(s => s.some(b => b.type === 'REPEAT' && (b.val >= 3) && (b.body || []).some(ib => ['FWD', 'UP', 'DOWN', 'BACK'].includes(ib.type))));
              if (!hasRepeat) return false;
              const sim = st.proj.simulate({ trigger: 'START', fromHome: true });
              return sim.events.filter(e => e.obj === o.id && e.kind === 'move').length >= 3;
            };
            /* specific corrective diagnosis — names the exact missing step */
            const check = () => {
              const o = O();
              if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              if (!hasStart(o)) return { ok: false, fix: 'أَضِفْ لَبِنَةَ العَلَمِ الأخْضَرِ في بِدايَةِ المَقْطَعِ.' };
              const rep = repBlock(o);
              if (!rep) return { ok: false, fix: 'أَضِفْ لَبِنَةَ التَّكْرارِ مِنْ فِئَةِ التَّحَكُّمِ.' };
              if (!(rep.body || []).some(ib => ['FWD', 'UP', 'DOWN', 'BACK'].includes(ib.type)))
                return { ok: false, fix: 'ضَعْ لَبِنَةَ حَرَكَةٍ (مِثْلُ لأعْلى) داخِلَ لَبِنَةِ التَّكْرارِ.' };
              if (!(rep.val >= 3)) return { ok: false, fix: 'لَبِنَةُ التَّكْرارِ مَوْجودَةٌ، لكِنِ اجْعَلِ القيمَةَ 3 على الأقَلِّ.' };
              if (!test()) return { ok: false, fix: 'شَغِّلِ العَلَمَ الأخْضَرَ لِتُنَفِّذَ المَقْطَعَ ثُمَّ تَحَقَّقْ.' };
              return { ok: true, reason: 'اسْتَخْدَمْتَ لَبِنَةَ التَّكْرارِ بِقيمَةٍ صَحيحَةٍ، فَتَكَرَّرَتِ الحَرَكَةُ ' + rep.val + ' مَرّاتٍ بِلَبِناتٍ أَقَلَّ.' };
            };
            const PRAC = K.practical(api, { step: 'repeat', trigger: 'START', check });
            st.onRun = () => { PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — Repeat Forever genuinely loops ===== */
        {
          id: 'forever', step: 'forever',
          enter() {
            api.clearWork();
            api.say('لَبِنَةُ «كَرِّرْ باسْتِمْرارٍ» (فِئَةُ النِّهايَةِ) تُكَرِّرُ المَقْطَعَ دونَ تَوَقُّفٍ. أَعْطِ Tic: العَلَمَ الأخْضَرَ، لَبِنَةَ حَرَكَةٍ، ثُمَّ كَرِّرْ باسْتِمْرارٍ، وَشَغِّلْ ثُمَّ تَحَقَّقْ.');
            ensure(['START', 'FWD', 'BACK', 'UP', 'DOWN', 'REPEAT', 'FOREVER']);
            st.setCat('end'); st.highlight('end', 'FOREVER');
            const O = () => st.proj.obj(idOf('tic'));
            const hasStart = o => o.scripts.some(s => s[0] && s[0].type === 'START');
            const test = () => {
              const o = O(); if (!o) return false;
              const hasForever = o.scripts.some(s => s[0] && s[0].type === 'START' && s.some(b => b.type === 'FOREVER') && s.some(b => ['FWD', 'BACK', 'UP', 'DOWN'].includes(b.type)));
              if (!hasForever) return false;
              return st.proj.simulate({ trigger: 'START', fromHome: true }).looping === true;
            };
            const check = () => {
              const o = O();
              if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              if (!hasStart(o)) return { ok: false, fix: 'أَضِفْ لَبِنَةَ العَلَمِ الأخْضَرِ في بِدايَةِ المَقْطَعِ.' };
              /* FEEDBACK CORRECTNESS: earlier stages leave their own scripts on
               * Tic, so the message must describe the script the pupil is
               * actually building here — the one closest to «حركة + كرر
               * باستمرار» — not simply the first green-flag script found. */
              const isMove = b => ['FWD', 'BACK', 'UP', 'DOWN'].includes(b.type);
              const B = K.bestScript(o, 'START', [isMove, b => b.type === 'FOREVER']);
              const f = B.flat || [];
              if (!f.some(isMove))
                return { ok: false, fix: 'أَضِفْ لَبِنَةَ حَرَكَةٍ (مِثْلُ لأعْلى) قَبْلَ لَبِنَةِ التَّكْرارِ المُسْتَمِرِّ.' };
              if (!f.some(b => b.type === 'FOREVER'))
                return { ok: false, fix: 'أَضِفْ لَبِنَةَ «كَرِّرْ باسْتِمْرارٍ» مِنْ فِئَةِ النِّهايَةِ.' };
              if (!test()) return { ok: false, fix: 'شَغِّلِ العَلَمَ الأخْضَرَ لِتَبْدَأَ الحَلْقَةُ ثُمَّ تَحَقَّقْ.' };
              return { ok: true, reason: 'يُكَرِّرُ Tic حَرَكَتَهُ باسْتِمْرارٍ دونَ تَوَقُّفٍ؛ نُوقِفُهُ بِزِرِّ الإيقافِ.' };
            };
            const PRAC = K.practical(api, { step: 'forever', trigger: 'START', check });
            st.onRun = () => { PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — Stop safely cancels the loop ===== */
        {
          id: 'stop', step: 'stop',
          enter() {
            api.clearWork();
            api.say('شَغِّلِ المَقْطَعَ المُكَرِّرَ باسْتِمْرارٍ بِزِرِّ التَّشْغيلِ، ثُمَّ اضْغَطْ زِرَّ الإيقافِ (المُرَبَّعَ الأحْمَرَ) لِإيقافِهِ بِأمانٍ، ثُمَّ تَحَقَّقْ.');
            ensure(['START', 'FWD', 'BACK', 'UP', 'DOWN', 'FOREVER']);
            // make sure Tic already has a forever loop to run/stop
            const o = st.proj.obj(idOf('tic'));
            if (o && !o.scripts.some(s => s.some(b => b.type === 'FOREVER'))) {
              st.proj.clearScripts(o.id);
              st.proj.addBlock(o.id, 'START');
              st.proj.addBlock(o.id, 'UP', { val: 1 });
              st.proj.addBlock(o.id, 'DOWN', { val: 1 });
              st.proj.addBlock(o.id, 'FOREVER');
            }
            st.setCat('end'); st.highlight(null, null);
            st.repaint();
            /* stopped becomes true after the pupil runs then presses Stop */
            let ranOnce = false, stopped = false;
            const check = () => {
              if (!stopped) {
                if (!ranOnce) return { ok: false, fix: 'اضْغَطْ زِرَّ التَّشْغيلِ أَوَّلًا لِتَبْدَأَ الحَلْقَةُ.' };
                return { ok: false, fix: 'اضْغَطْ زِرَّ الإيقافِ (المُرَبَّعَ الأحْمَرَ) لِتُوقِفَ التَّكْرارَ.' };
              }
              return { ok: true, reason: 'أَوْقَفْتَ التَّكْرارَ المُسْتَمِرَّ بِأمانٍ، فَعادَ الكائِنُ إلى حالَةِ التَّوَقُّفِ.' };
            };
            /* this stage's task is to RUN then STOP a seeded loop, not to build, so it
             * legitimately opts out of the "must have edited" guard */
            const PRAC = K.practical(api, { step: 'stop', trigger: 'START', check, allowNoEdit: true });
            /* A Repeat-Forever run never completes, so onRun never fires for it.
             * «هل ضغط التلميذ زر التشغيل؟» is answered by the run-start signal. */
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            st.onChange = (what) => {
              if (what === 'run-start') ranOnce = true;
              if (what === 'stop' && !st.running && ranOnce) { stopped = true; }
              PRAC.onEdit();
            };
            this._ok = () => stopped;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);
