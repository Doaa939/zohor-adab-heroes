/* ==== styles/base.css ==== */
/* ==== HIDDEN CONTRACT ===================================================
 * A class rule such as .okpanel{display:flex} outranks the UA's
 * [hidden]{display:none}, which silently painted a success panel that the
 * JS had marked hidden. These rules make [hidden] authoritative.
 * ==================================================================== */
[hidden]{display:none !important}

/* ==== styles/base.css — tokens, typography, stage ====
 * TYPOGRAPHY CONTRACT (CP0): at 1366x768 the stage scale is ~0.99, so
 * pupil-facing Arabic body >= 20px AFTER scaling and action instructions
 * >= 26px AFTER scaling. Arabic is always larger and more prominent than English.
 */
:root{
  --sand:#F4E9D8; --sandstone:#D9BE96; --sand-deep:#E5D0AC;
  --copper:#B4703C; --copper-lt:#E39A55; --copper-dk:#8A5B32;
  --falaj:#2F9E92; --falaj-hi:#7FDCCF; --water:#2E6E86;
  --deep:#123048; --deep-2:#1B435F;
  --ink:#22303C; --ink-2:#40566A;
  --warn:#D9694E; --leaf:#5C9A4A;
  /* EMBEDDED TAJAWAL (CP1R-T3)
   * Three genuine faces embedded via @font-face in styles/fonts.css:
   *   Regular 400 · Medium 500 · Bold 700  (official Tajawal, no true 600 exists)
   * The system stack that follows is an emergency technical fallback only;
   * the pupil interface renders the embedded face. */
  --font-ttl:'Tajawal Embedded',Arial,'DejaVu Sans',sans-serif;
  --font-body:'Tajawal Embedded',Arial,'DejaVu Sans',sans-serif;
  --r:16px; --sh:0 6px 20px rgba(60,40,20,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E8DCC6}
body{font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

#stage{position:fixed;inset:0;display:block;background:radial-gradient(120% 90% at 50% 0%,#F6E7CB 0%,#E3D2B4 60%,#D8C7A6 100%)}
#stageInner{position:absolute;left:50%;top:50%;width:1280px;height:760px;transform-origin:center center;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;border-radius:10px;background:#EFE2CD;box-shadow:0 10px 46px rgba(60,40,20,.28)}

.scene{position:absolute;inset:0}
.valley-art{position:absolute;inset:0;width:100%;height:100%}

.card-lab,.act-ttl,.chk-row,.path-hint{font-size:25px;font-weight:400;line-height:1.5}

/* ---------- buttons ---------- */
.bigbtn{min-height:64px;min-width:180px;padding:0 30px;border:none;border-radius:14px;cursor:pointer;
  font-size:27px;font-weight:500;color:var(--deep);background:linear-gradient(180deg,#FBEBD0,#EBD4AC);
  border:2.5px solid var(--copper-dk);box-shadow:0 5px 0 rgba(138,91,50,.45),var(--sh);transition:transform .12s,box-shadow .12s}
.bigbtn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(138,91,50,.45),var(--sh)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(138,91,50,.45)}
.bigbtn.primary{background:linear-gradient(180deg,#F3B267,#DE8C3C);color:#3A2410}
.corner-btn{width:66px;height:66px;border-radius:14px;border:2.5px solid var(--copper-dk);cursor:pointer;
  background:linear-gradient(180deg,#FBEBD0,#EBD4AC);font-size:26px;color:var(--deep);box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.corner-btn:hover{background:linear-gradient(180deg,#FFF4E0,#F0DCB8)}
.corner-btn.tr{position:absolute;top:20px;left:20px}

/* ---------- error boundary ---------- */
.errbox{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.72)}
.errcard{width:min(520px,90%);padding:30px;border-radius:18px;text-align:center;background:#F6EDDC;border:3px solid var(--copper-dk)}
.erric{font-size:44px}
.errttl{font-family:var(--font-ttl);font-size:24px;font-weight:700;margin:8px 0;color:var(--deep)}
.errmsg{font-size:19px;line-height:1.7;color:var(--ink-2);margin-bottom:18px}

/* ---------- reduced motion / low perf ---------- */
.reduced-motion *{animation:none!important;transition:none!important}
.low-perf .water-ripples,.low-perf .light-flow{display:none}

/* ==== styles/lesson.css ==== */
/* ==== styles/lesson.css — lesson frame, activities, hoopoe ==== */
.lesson-scene{position:absolute;inset:0;background:linear-gradient(180deg,#2E4E70 0%,#6B84A4 100%)}

/* ---- compact top bar (visually light) ---- */
.lf-top{position:absolute;top:0;right:0;left:0;height:78px;display:flex;align-items:center;gap:18px;
  padding:0 20px;background:linear-gradient(180deg,rgba(38,24,10,.62),rgba(38,24,10,.34));
  backdrop-filter:blur(3px);z-index:30}
.lf-id{display:flex;align-items:center;gap:16px;padding-inline:6px}
.lf-code{font-size:15px;font-weight:700;color:#3A2410;background:#F0C07A;padding:3px 11px;border-radius:999px}
.lf-ar{font-family:var(--font-ttl);font-size:24px;font-weight:500;color:#FFF6E6;line-height:1.35;
  letter-spacing:.3px;text-shadow:none}
.lf-en{display:none}
.lf-spacer{flex:1}
.lf-top .corner-btn{width:66px;height:66px;font-size:25px;border-width:2.5px;
  background:linear-gradient(180deg,rgba(255,244,224,.96),rgba(232,214,180,.96))}

/* ---- stage journey: compact stepping stones, not a progress bar ---- */
.rail{display:flex;gap:6px;align-items:center}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px;width:auto;min-width:26px}
.bulb{width:13px;height:13px;border-radius:50%;background:rgba(255,240,214,.3);
  border:2px solid rgba(255,240,214,.5);transition:all .22s}
.dot.past .bulb{background:#7FD37A;border-color:#4A7F3B}
.dot.live .bulb{background:#FFC96B;border-color:#B4762E;box-shadow:0 0 0 5px rgba(255,201,107,.28);transform:scale(1.2)}
.lbl{font-size:13px;font-weight:500;color:rgba(255,240,214,.6);white-space:nowrap;max-width:0;overflow:hidden;transition:max-width .25s}
.dot.live .lbl{color:#FFD79A;font-weight:500;max-width:70px}

@keyframes instrpulse{0%{transform:translateX(50%) scale(.99)}55%{transform:translateX(50%) scale(1.012)}100%{transform:translateX(50%) scale(1)}}

/* ---- the world occupies the screen; the stage is nearly full-bleed ---- */
.lesson-stage{position:absolute;right:14px;left:14px;bottom:12px;overflow:hidden;
  /* RESERVED-REGION LAYOUT: header (78) + 6 gap + instruction height + 16 gap.
     The instruction can never overlap the simulator because the stage simply
     starts beneath it. --instr-h is published by present.instruction(). */
  top:calc(84px + var(--instr-h, 0px) + 16px)}

/* ---- activity shells ---- */
.act{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.act-head{text-align:center;margin-bottom:10px;margin-top:20px}
.act-ttl{font-family:var(--font-ttl);font-weight:500;color:#FFF7E8;font-size:25px;
  text-shadow:0 2px 6px rgba(10,24,38,.6);margin-top:22px}
.act-src{font-size:15px;color:var(--copper-dk);font-weight:700;margin-top:2px}

/* ---- ordering ---- */
.slots{display:flex;gap:16px;justify-content:center;margin:4px 0 24px;flex-wrap:nowrap}
.slot{width:238px;height:222px;border-radius:14px;border:3.5px dashed #C3AC88;
  background:rgba(255,252,245,.7);position:relative;display:flex;align-items:center;
  justify-content:center}
.slots[data-n="5"] .slot,.slots[data-n="6"] .slot{width:196px;height:206px}
.slot.hot{border-color:var(--copper-lt);background:rgba(255,240,214,.95);transform:scale(1.04)}
.slot.filled{border-style:solid;border-color:var(--leaf);background:rgba(242,249,238,.95)}
.slot.breathe{animation:breathe .9s ease}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(227,154,85,0)}50%{box-shadow:0 0 0 12px rgba(227,154,85,.34)}}
.slot-num{position:absolute;top:-13px;right:-9px;width:34px;height:34px;border-radius:50%;background:var(--copper);
  color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;z-index:3}
.tray{display:flex;gap:16px;justify-content:center;flex-wrap:nowrap;padding:14px 16px;
  border-radius:16px;background:rgba(233,220,196,.55);border:2.5px dashed #C3AC88;max-width:96%}
.card{width:238px;min-height:222px;border-radius:14px;
  background:linear-gradient(180deg,#FFFDF7,#F5EAD6);border:3px solid var(--copper-dk);
  box-shadow:0 4px 0 rgba(90,58,26,.4),0 8px 14px rgba(30,18,6,.26);cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:14px;padding:16px;transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.dragging{opacity:.28}
.card.rejected{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.card.ghost{opacity:.94;box-shadow:0 12px 26px rgba(60,40,20,.34);cursor:grabbing}
.card.placed{width:200px;min-height:190px;border-width:2.5px;box-shadow:none;cursor:default;gap:10px;padding:12px}
.slots[data-n="5"] .card.placed,.slots[data-n="6"] .card.placed{width:100px;min-height:124px}
.card *,.bee-btn *,.pcell *,.demo-card *{pointer-events:none}
.card-ic{width:118px;height:118px;flex:0 0 auto}
.card.placed .card-ic{width:100px;height:100px}
.card-lab{font-weight:700;color:var(--deep);text-align:center;line-height:1.3;margin-top:5px}
.card.placed .card-lab{min-height:52px;font-size:20px}

/* ---- watch demo ---- */
.demo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.demo-strip{display:flex;gap:13px}
.demo-card{width:186px;padding:14px 10px;border-radius:14px;background:#FFFDF7;border:3px solid var(--falaj);
  display:flex;flex-direction:column;align-items:center;opacity:0;animation:pop .5s ease forwards}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.demo-n{width:34px;height:34px;border-radius:50%;background:var(--falaj);color:#fff;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.demo-foot{margin-top:6px}

/* ---- bee ---- */
.bee-wrap{display:flex;gap:36px;align-items:center;justify-content:center;margin-top:6px}
.bee-canvas{width:300px;height:278px;background:rgba(255,252,245,.9);border-radius:18px;border:3px solid var(--copper-dk)}
.bee-steps{display:flex;flex-direction:column;gap:12px}
.bee-btn{min-width:280px;min-height:64px;font-size:21px;font-weight:500;border-radius:14px;cursor:pointer;text-align:right;
  padding:0 20px;background:linear-gradient(180deg,#FBEBD0,#EBD4AC);border:3px solid var(--copper-dk);color:var(--deep)}
.bee-btn:hover:not(:disabled){background:linear-gradient(180deg,#FFF4E0,#F0DCB8)}
.bee-btn.done{background:linear-gradient(180deg,#E8F5E1,#D2EAC6);border-color:var(--leaf);color:#3E6B31}
.bee-btn:disabled{cursor:default}
.bee-btn.breathe{animation:breathe .9s ease}

/* ---- path ---- */
.path-act{justify-content:flex-start;align-items:center;display:flex;flex-direction:column;gap:6px}
.pboard{position:relative;border-radius:16px;overflow:visible;border:3px solid var(--copper-dk);
  background:#E5D0AC;margin-top:2px;flex:0 0 auto}
.pcell{position:absolute;border:1.5px solid rgba(140,110,72,.34);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background .14s;overflow:visible}
.pcell:hover{background:rgba(255,240,214,.55)}
.pcell.blocked{background:rgba(92,154,74,.22);cursor:not-allowed}
.pcell.onpath{background:rgba(227,154,85,.5)}
.pcell.hintpath{background:rgba(127,220,207,.55)}
.pcell.start{background:rgba(255,244,214,.92);box-shadow:inset 0 0 0 4px #E0A24B}
.pcell.goal{background:rgba(196,85,63,.28);box-shadow:inset 0 0 0 4px #C4553F}
.pcell.bump{animation:shake .4s}
.cell-ic{width:86px;height:86px}
.path-tools{display:flex;align-items:center;gap:18px;margin-top:12px}
.path-hint{font-size:21px;font-weight:500;color:#FFF7E8;background:rgba(24,40,58,.88);
  padding:9px 20px;border-radius:999px;border:2px solid rgba(255,214,150,.45)}

/* ---- feedback / labels / rings / hoopoe ---- */
/* The toast is positioned by present._placeFeedback() in host-local space so it
   can be kept clear of the instruction bar, the board and every control.
   It must NOT use a translate-based centring transform, because the collision
   search measures the element's real rect. */
.fb{position:absolute;opacity:0;transition:opacity .22s, top .22s;
  padding:13px 26px;border-radius:14px;font-size:21px;font-weight:500;z-index:40;box-shadow:var(--sh);max-width:80%;text-align:center}
.fb.on{opacity:1}
.fb.ok{background:#E4F4DA;border:3px solid var(--leaf);color:#33612A}
.fb.soft{background:#FDEEE6;border:3px solid var(--warn);color:#8E3A24}
.termchip{position:absolute;transform:translateX(50%);z-index:26;padding:6px 14px;border-radius:11px;
  background:rgba(18,48,72,.95);color:#fff;text-align:center;box-shadow:var(--sh);pointer-events:none}
.t-ar{font-size:19px;font-weight:500}
.t-en{font-size:13px;opacity:.86;direction:ltr}
.ring{position:absolute;border-radius:16px;border:4px solid var(--copper-lt);pointer-events:none;z-index:25;
  box-shadow:0 0 20px rgba(227,154,85,.6);animation:ringpulse 1.5s ease-in-out infinite}
@keyframes ringpulse{0%,100%{opacity:.75}50%{opacity:1}}
.hoopoe{position:absolute;width:112px;height:112px;z-index:24;pointer-events:none;opacity:0;transition:opacity .3s}
.hoopoe.in{opacity:1;animation:hop 1.5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hoopoe[data-dir="left"] .hoopoe-svg{transform:scaleX(-1)}
.hoopoe .hp-crest{animation:crest 1.9s ease-in-out infinite;transform-origin:45px 22px}
@keyframes crest{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.14)}}

/* ---- check ---- */
.check-act{justify-content:flex-start;padding-top:6px}
.chk-ttl{font-family:var(--font-ttl);font-size:32px;font-weight:700;color:var(--deep);margin-bottom:12px}
.chk-list{display:flex;flex-direction:column;gap:8px;width:min(720px,90%)}
.chk-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:12px;
  background:rgba(255,252,245,.9);border:2.5px solid #D6C6A8;color:var(--ink-2)}
.chk-row.ok{border-color:var(--leaf);background:rgba(240,249,236,.95);color:#33612A;font-weight:700}
.chk-mark{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;background:#D6C6A8;color:#fff;flex:0 0 auto}
.chk-row.ok .chk-mark{background:var(--leaf)}
.chk-world{margin-top:14px;text-align:center}
.chk-world-ttl{font-size:20px;font-weight:500;color:var(--copper-dk)}
.chk-world-en{font-size:14px;color:var(--ink-2);direction:ltr;margin-bottom:6px}
.mini-world{width:440px;height:94px}
.chk-actions{display:flex;gap:16px;margin-top:16px}


/* =============== CP1R: ordering inside a living environment =============== */
.scene-act{position:absolute;inset:0;display:block}
.room-bg{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:1236px;height:236px;border-radius:18px;overflow:hidden;
  box-shadow:0 14px 34px rgba(30,18,6,.45),inset 0 0 0 4px rgba(90,60,30,.35)}
.sun-beam{animation:beam 7s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.75}50%{opacity:1}}

/* the glowing dawn pathway of carved floor tiles */
.dawn-path{position:absolute;left:50%;top:244px;transform:translateX(-50%);
  display:flex;gap:10px;z-index:6}
.dtile{position:relative;width:172px;height:158px;border-radius:14px;cursor:default;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;
  background:linear-gradient(180deg,rgba(255,236,196,.42),rgba(214,178,120,.55));
  border:3px dashed rgba(255,222,166,.85);
  box-shadow:inset 0 0 24px rgba(255,214,140,.35),0 6px 14px rgba(40,24,8,.3);
  transition:all .18s}
.dawn-path[data-n="5"] .dtile{width:176px}
.dawn-path[data-n="3"] .dtile{width:200px}
.dtile.hot{border-color:#FFD79A;background:linear-gradient(180deg,rgba(255,243,214,.75),rgba(240,200,140,.75));
  transform:translateY(-4px) scale(1.03);box-shadow:inset 0 0 30px rgba(255,214,140,.6),0 10px 20px rgba(40,24,8,.34)}
.dtile.filled{border-style:solid;border-color:#7FD37A;
  background:linear-gradient(180deg,rgba(238,250,232,.92),rgba(206,234,196,.92))}
.dtile.breathe{animation:tbreathe .9s ease}
@keyframes tbreathe{0%,100%{box-shadow:inset 0 0 24px rgba(255,214,140,.35),0 0 0 0 rgba(255,201,107,0)}
  50%{box-shadow:inset 0 0 30px rgba(255,214,140,.6),0 0 0 14px rgba(255,201,107,.34)}}
.dtile-num{position:absolute;top:-15px;width:36px;height:36px;border-radius:50%;
  background:linear-gradient(180deg,#F3B267,#D9812F);color:#3A2410;font-size:19px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:3px solid #FFF6E6;
  box-shadow:0 3px 8px rgba(40,24,8,.4);z-index:3}
.dtile.filled .dtile-num{background:linear-gradient(180deg,#8FD98A,#5C9A4A);color:#1E3A18}
.dtile-slot{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:2px}
.dtile-slot .card-ic{width:96px;height:96px}
.dtile-lab{font-size:25px;font-weight:500;color:#2C4A22;text-align:center;line-height:1.45;
  padding:0 6px;height:34px;text-shadow:none;-webkit-text-stroke:0;display:flex;align-items:center;justify-content:center;
  width:100%;overflow-wrap:normal;word-break:keep-all;text-wrap:balance}

/* the objects resting in the room */
/* compact light wooden shelf — no dark overlay, no modal, no full-scene dim */
.room-objects{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;z-index:7;
  padding:6px 10px 9px;border-radius:13px;
  background:linear-gradient(180deg,#C9A87B 0%,#B08D5F 62%,#96754A 100%);
  border:3px solid #7A5636;
  box-shadow:0 5px 0 #6B4A2C,0 9px 18px rgba(40,24,8,.32),inset 0 2px 0 rgba(255,236,200,.45)}
.room-objects::after{content:'';position:absolute;left:8px;right:8px;bottom:3px;height:4px;
  border-radius:3px;background:linear-gradient(90deg,rgba(255,236,200,.4),rgba(120,84,50,.5),rgba(255,236,200,.4))}
.room-objects::after{content:'';position:absolute;left:8px;right:8px;bottom:4px;height:4px;
  border-radius:3px;background:linear-gradient(90deg,rgba(255,236,200,.4),rgba(120,84,50,.5),rgba(255,236,200,.4))}
.robj{width:150px;min-height:128px;border-radius:14px;cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 8px 8px;
  background:linear-gradient(180deg,#FFFBF0 0%,#F2E3C6 100%);
  border:3px solid #8A5B32;box-shadow:0 4px 0 rgba(90,58,26,.45),0 8px 14px rgba(30,18,6,.28);
  transition:transform .14s,box-shadow .14s}
.robj:hover{transform:translateY(-4px);box-shadow:0 9px 0 rgba(90,58,26,.45),0 16px 24px rgba(30,18,6,.36)}
.robj.dragging{opacity:.3}
.robj.rejected{animation:shake .4s}
.robj.ghost{opacity:.96;cursor:grabbing;box-shadow:0 16px 30px rgba(30,18,6,.5);transform:rotate(-2deg)}
.robj-art{display:flex}
.robj-art{height:94px;display:flex;align-items:center;justify-content:center}
.robj-art .card-ic{width:94px;height:94px}
.robj-lab{font-size:22px;font-weight:500;color:#2A1B0E;text-align:center;line-height:1.45;
  height:30px;display:flex;align-items:center;justify-content:center;text-shadow:none;
  -webkit-text-stroke:0;
  width:100%;overflow-wrap:normal;word-break:keep-all;text-wrap:balance}
.robj *{pointer-events:none}

/* invisible perch anchors — natural places for the hoopoe to stand in the room */
.hoopoe-perch{position:absolute;width:74px;height:10px;pointer-events:none;opacity:0;z-index:1}
.perch-bed{left:118px;top:246px}
.perch-window{left:50%;transform:translateX(-50%);top:150px}
.perch-door{right:96px;top:236px}


/* CP1R2: keep the label block tight so the illustration dominates the card */
.card .card-lab{width:100%;min-height:62px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:500;line-height:1.4;text-align:center;color:#2A1B0E;
  overflow-wrap:break-word;word-break:normal;text-wrap:balance;padding:0 2px}
.card.placed .card-lab{height:26px;font-size:19px}


/* CP1R2: map figures fill their cell so Sara and the house are unmistakable */
.pcell .card-ic{width:86px;height:86px}
.pcell.start .card-ic,.pcell.goal .card-ic{width:86px;height:86px}

/* CP1R2: bee step controls carry a visual thumbnail, not text alone */
.bee-btn{display:flex;align-items:center;gap:14px;text-align:right}
.bee-thumb{width:64px;height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:#FFFDF6;border:2.5px solid #8A5B32;border-radius:10px}
.bee-thumb .card-ic{width:56px;height:56px}
.bee-lab{flex:1}
.bee-btn.done .bee-thumb{border-color:#5C9A4A;background:#F1F9EC}

/* ================= UNIT 1 DRIVING LAB (lessons 1.2-1.4) ================= */
.drive-act{justify-content:flex-start}
.drive-board{background:linear-gradient(180deg,#F3E3C4,#E8D2AC)}
.pcell.waypoint{background:rgba(224,162,75,.28);box-shadow:inset 0 0 0 4px #E0A24B}
.pcell.wp-hit{background:rgba(110,190,120,.5);box-shadow:inset 0 0 0 4px var(--leaf)}
.pcell.trail{background:rgba(227,154,85,.32)}
.pcell.hitmark{animation:shake .45s;background:rgba(196,85,63,.4)}
.car-layer{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
  transition:left .3s ease,top .3s ease,transform .3s ease;z-index:6;pointer-events:none}
.car-layer .car-ic{width:78%;height:78%}

/* program strip */
.prog-strip{display:flex;align-items:center;gap:12px;margin-top:12px;padding:9px 16px;
  background:rgba(38,26,16,.55);border:3px solid var(--copper-dk);border-radius:15px;
  min-height:64px;max-width:94%}
.prog-lab{font-size:19px;font-weight:700;color:#FFE9C4;white-space:nowrap}
.prog-inner{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.prog-empty{color:#C9B594;font-size:24px;padding:0 12px}
.prog-chip{position:relative;width:52px;height:52px;border-radius:12px;background:#3E7A9E;
  border:3px solid #2C5C7A;display:flex;align-items:center;justify-content:center;transition:all .18s}
.prog-chip[data-cmd="RIGHT"],.prog-chip[data-cmd="LEFT"]{background:#8A5BA8;border-color:#6A3F86}
.prog-chip.active{transform:scale(1.14);box-shadow:0 0 0 4px #FFD37A}
.prog-chip.culprit{background:#C4553F;border-color:#8E3423;animation:shake .45s}
.prog-chip .cmd-ic{width:34px;height:34px}
.prog-count{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#E0A24B;
  color:#2A1A10;font-size:15px;font-weight:700;border-radius:9px;padding:0 7px;border:2px solid #B4772A}

/* palette + run controls */
.drive-tools{display:flex;align-items:flex-start;gap:22px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.cmd-palette{display:flex;gap:12px}
.cmd-palette.pulse{animation:instrpulse .5s ease}
.cmd-btn{width:104px;min-height:104px;border-radius:16px;background:#3E7A9E;border:4px solid #2C5C7A;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 4px;transition:transform .14s,box-shadow .14s}
.cmd-btn[data-cmd="RIGHT"],.cmd-btn[data-cmd="LEFT"]{background:#8A5BA8;border-color:#6A3F86}
.cmd-btn:hover{transform:translateY(-3px);box-shadow:0 7px 16px rgba(0,0,0,.3)}
.cmd-btn.tap{animation:instrpulse .35s ease}
.cmd-btn .cmd-ic{width:46px;height:46px}
.cmd-lab{font-size:17px;font-weight:700;color:#FFF7E8;text-align:center;line-height:1.2}
.cmd-en{font-size:12px;color:rgba(255,247,232,.72);text-align:center}
.drive-run{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.step-box{background:rgba(38,26,16,.55);border:3px solid var(--copper-dk);border-radius:14px;
  padding:7px 16px;text-align:center;min-width:86px}
.step-lab{font-size:14px;color:#E8D3AE;font-weight:500}
.step-count{font-size:30px;font-weight:700;color:#FFD37A;line-height:1.1}

/* ---- lesson 1.3 button question ---- */
.btnq-row{display:flex;gap:20px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.btnq{width:180px;min-height:150px;border-radius:18px;background:#3E7A9E;border:4px solid #2C5C7A;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px}
.btnq:hover{transform:translateY(-3px)}
.btnq .cmd-ic{width:52px;height:52px}
.btnq-lab{font-size:20px;font-weight:700;color:#FFF7E8;text-align:center}
.btnq.right{background:var(--leaf);border-color:#33612A}
.btnq.wrong{animation:shake .45s}

/* ---- lesson 1.4 traffic warden ---- */
.warden-act{justify-content:flex-start}
.warden-sign{width:200px;height:150px;border-radius:20px;background:#FFF7E8;border:6px solid var(--copper-dk);
  display:flex;align-items:center;justify-content:center;margin-top:18px;box-shadow:var(--sh)}
.warden-sign.pop{animation:instrpulse .4s ease}
.warden-glyph{width:120px;height:120px}
.warden-glyph path{stroke:#2A1B0E}
.warden-dots{display:flex;gap:10px;margin:16px 0}
.wdot{width:20px;height:20px;border-radius:50%;background:rgba(255,247,232,.28);border:2px solid var(--copper-dk)}
.wdot.on{background:var(--leaf)}
.warden-row{display:flex;gap:20px}
.cmd-btn.wrong{animation:shake .45s}

/* ---- lesson 1.4 sub-missions ---- */
.submission-row{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.submission{padding:7px 18px;border-radius:12px;background:rgba(38,26,16,.5);
  border:2px solid var(--copper-dk);color:#FFE9C4;font-size:17px;font-weight:500}

/* ---- IN-TARGET FOCUS GUIDE (replaces the hoopoe inside activities) ----
   Drawn AS PART OF the target element, so it cannot float over any other
   control. Purely decorative; never intercepts pointer events. */
.focus-ring{position:absolute;inset:-8px;border-radius:16px;pointer-events:none;
  border:4px solid var(--gold,#E0A24B);opacity:.9;animation:focuspulse 1.5s ease-in-out infinite;z-index:3}
@keyframes focuspulse{
  0%,100%{transform:scale(1);opacity:.55;box-shadow:0 0 0 0 rgba(224,162,75,.5)}
  50%{transform:scale(1.035);opacity:1;box-shadow:0 0 0 9px rgba(224,162,75,0)}
}
.has-focus{position:relative}
@media (prefers-reduced-motion: reduce){ .focus-ring{animation:none;opacity:.95} }
.lowperf .focus-ring{animation:none;opacity:.95}

/* ================= !DIGITAL KIDS GO — unified Unit 1 simulator ================= */
.dkgo{width:100%;height:100%;max-height:100%;display:flex;flex-direction:column;
  gap:clamp(5px,0.8vh,9px);padding:clamp(5px,0.8vh,8px) 10px;box-sizing:border-box;
  overflow:hidden}
.dk-titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,#2C5C7A,#234B63);border:3px solid #16303F;border-radius:14px;
  padding:clamp(4px,0.8vh,8px) 18px;box-shadow:var(--sh);flex:0 0 auto;
  margin-bottom:clamp(4px,0.7vh,8px)}
.dk-appname{display:flex;align-items:baseline;gap:10px}
.dk-app-ar{font-size:22px;font-weight:700;color:#FFE9C4}
.dk-app-en{font-size:14px;color:#BFE2F0;letter-spacing:.3px}
.dk-mission{font-size:19px;font-weight:500;color:#FFF7E8;text-align:center;flex:1}

.dk-body{display:flex;gap:14px;flex:1 1 auto;min-height:0}
/* work area dominates the screen */
.dk-work{flex:1 1 62%;position:relative;background:linear-gradient(180deg,#F3E3C4,#E8D2AC);
  border:4px solid #C8A87C;border-radius:16px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-width:0}
.dk-board{position:relative}
.dk-cell{position:absolute;box-sizing:border-box;border:1.5px dashed rgba(150,110,60,.4)}
.dk-cell.dk-start{background:rgba(110,190,120,.22);box-shadow:inset 0 0 0 4px var(--leaf)}
.dk-cell.dk-goal{}
.dk-cell.dk-obstacle,.dk-cell.dk-waypoint{display:flex;align-items:center;justify-content:center}
.dk-cell.dk-obstacle svg,.dk-cell.dk-goal svg,.dk-cell.dk-waypoint svg{width:80%;height:80%}
.dk-cell.dk-waypoint{background:rgba(224,162,75,.26);box-shadow:inset 0 0 0 4px #E0A24B}
.dk-cell.wp-hit{background:rgba(110,190,120,.5);box-shadow:inset 0 0 0 4px var(--leaf)}
.dk-cell.dk-trail{background:rgba(227,154,85,.34)}
.dk-cell.dk-hit{animation:shake .45s;background:rgba(196,85,63,.42)}
.dk-car-layer{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
  transition:left .32s ease,top .32s ease,transform .32s ease;z-index:6;pointer-events:none}
.dk-car-layer .dk-car{width:80%;height:80%}
.dk-heading{position:absolute;top:12px;left:12px;background:rgba(38,26,16,.72);border:2px solid var(--copper-dk);
  border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px}
.dk-heading-lab{color:#FFE9C4;font-size:15px;font-weight:600}
.dk-compass{width:26px;height:26px;border-radius:50%;background:#E0A24B;position:relative;transition:transform .32s ease}
.dk-compass::after{content:'';position:absolute;top:50%;left:50%;width:14px;height:4px;background:#2A1A10;
  transform:translate(-2px,-50%);border-radius:2px}
.dk-compass::before{content:'';position:absolute;top:50%;right:2px;width:0;height:0;
  border:5px solid transparent;border-left-color:#C4553F;transform:translateY(-50%)}

/* console side */
.dk-console{flex:0 0 34%;max-width:440px;display:flex;flex-direction:column;
  gap:clamp(5px,0.9vh,10px);min-height:0}
.dk-section-lab{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.dk-section-lab span{font-size:17px;font-weight:700;color:#FFE9C4}
.dk-section-lab .dk-en{font-size:12px;color:#9Fc4d6;font-weight:500}
.dk-progwrap{background:rgba(38,26,16,.55);border:3px solid var(--copper-dk);
  border-radius:14px;padding:clamp(6px,1vh,10px) 12px;flex:0 1 auto;min-height:0;overflow:hidden}
.dk-prog{display:flex;flex-wrap:wrap;gap:7px;min-height:clamp(44px,7.4vh,58px);
  align-content:flex-start;overflow-y:auto}
.dk-prog-empty{color:#C9B594;font-size:18px;padding:14px 8px}
.dk-chip{position:relative;width:clamp(38px,6.4vh,50px);height:clamp(38px,6.4vh,50px);border-radius:11px;background:#3E7A9E;border:3px solid #2C5C7A;
  display:flex;align-items:center;justify-content:center;transition:transform .16s}
.dk-chip[data-cmd="RIGHT"],.dk-chip[data-cmd="LEFT"]{background:#8A5BA8;border-color:#6A3F86}
.dk-chip.active{transform:scale(1.16);box-shadow:0 0 0 4px #FFD37A}
.dk-chip.culprit{background:#C4553F;border-color:#8E3423;animation:shake .45s}
.dk-chip .dk-glyph{width:32px;height:32px}
.dk-chip-n{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#E0A24B;color:#2A1A10;
  font-size:14px;font-weight:700;border-radius:8px;padding:0 6px;border:2px solid #B4772A}

.dk-palwrap{background:rgba(38,26,16,.55);border:3px solid var(--copper-dk);
  border-radius:14px;padding:clamp(6px,1vh,10px) 12px;flex:0 1 auto;min-height:0}
.dk-palwrap.pulse{animation:instrpulse .5s ease}
.dk-palette{display:flex;gap:10px;flex-wrap:wrap}
.dk-cmd{flex:1 1 44%;min-height:92px;border-radius:14px;background:#3E7A9E;border:4px solid #2C5C7A;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;position:relative;
  transition:transform .14s,box-shadow .14s}
.dk-cmd[data-cmd="RIGHT"],.dk-cmd[data-cmd="LEFT"]{background:#8A5BA8;border-color:#6A3F86}
.dk-cmd:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.28)}
.dk-cmd.tap{animation:instrpulse .35s ease}
.dk-cmd.locked{opacity:.4;filter:grayscale(.6);cursor:not-allowed}
.dk-cmd .dk-glyph{width:clamp(28px,4.6vh,40px);height:clamp(28px,4.6vh,40px)}
.dk-cmd-lab{font-size:clamp(13px,2.1vh,16px);font-weight:700;color:#FFF7E8;text-align:center;line-height:1.15}
.dk-cmd-en{font-size:11px;color:rgba(255,247,232,.7)}
.dk-lock{position:absolute;top:6px;left:8px;font-size:18px}

.dk-runbar{display:grid;grid-template-columns:auto 1fr 1fr 1fr;align-items:stretch;
  gap:clamp(6px,0.9vh,10px);flex:0 0 auto}
.dk-countbox{background:rgba(38,26,16,.55);border:3px solid var(--copper-dk);
  border-radius:12px;padding:4px 12px;text-align:center;min-width:70px;
  display:flex;flex-direction:column;justify-content:center}
.dk-count-lab{font-size:clamp(11px,1.7vh,13px);color:#E8D3AE}
.dk-count{font-size:28px;font-weight:700;color:#FFD37A}
.dk-btn{min-height:clamp(46px,7.2vh,64px);border-radius:14px;cursor:pointer;border:4px solid;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .14s}
.dk-btn:hover{transform:translateY(-2px)}
.dk-btn-ar{font-size:clamp(15px,2.4vh,18px);font-weight:700;line-height:1.15}
.dk-btn-en{font-size:clamp(10px,1.6vh,12px);opacity:.75;line-height:1.1}
.dk-btn.run{background:var(--leaf);border-color:#33612A;color:#fff}
.dk-btn.del{background:#E0A24B;border-color:#B4772A;color:#2A1A10}
.dk-btn.reset{background:#5B86A8;border-color:#3C5C78;color:#fff}

/* narrower screens: keep console usable */
@media (max-width:1400px){
  .dk-console{flex-basis:38%}
  .dk-cmd{min-height:82px}
}

/* ---- DKGO guided mode (lesson 1.1) ---- */
.dk-cell.dk-pick{cursor:pointer}
.dk-cell.dk-pick:hover{background:rgba(224,162,75,.22)}
.dk-cell.hintpath{background:rgba(110,190,120,.34)}
.dk-walker .dk-car{width:92%;height:92%}
/* guided mode (1.1): the CELL is enlarged rather than the artwork, so the
   figure clears the 85px legibility minimum while keeping >=8px padding
   inside its cell. Enlarging the art instead would satisfy one and break
   the other. */
.dk-trailbox{gap:6px}
.dk-step{width:34px;height:34px;border-radius:9px;background:var(--leaf);border:2px solid #33612A;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.dk-step.active{box-shadow:0 0 0 3px #FFD37A}
.dk-hint{background:rgba(38,26,16,.5);border:2px solid var(--copper-dk);border-radius:12px;
  padding:8px 14px;color:#FFE9C4;font-size:16px;line-height:1.5}

/* guided mode: guarantee real breathing room inside the cell by using the
   BOX MODEL (padding) rather than a percentage width, which was being
   overridden by the picture's own class and collapsing the gap to ~1px. */
.dkgo .dk-cell.dk-goal,.dkgo .dk-cell.dk-obstacle,.dkgo .dk-cell.dk-waypoint{
  display:flex;align-items:center;justify-content:center;padding:11px;box-sizing:border-box}
.dkgo .dk-cell.dk-goal svg,.dkgo .dk-cell.dk-obstacle svg,.dkgo .dk-cell.dk-waypoint svg{
  width:100%;height:100%}

/* ================= ورشة البرمجة — persistent Unit 2 workshop ================= */
.ws{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:6px 8px;box-sizing:border-box}
.ws-titlebar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto;
  background:linear-gradient(180deg,#6B4A2A,#54381E);border:3px solid #3A2412;border-radius:14px;
  padding:7px 16px;box-shadow:var(--sh)}
.ws-appname{display:flex;align-items:baseline;gap:9px}
.ws-app-ar{font-size:21px;font-weight:700;color:#FFE9C4}
.ws-app-en{font-size:13px;color:#E0BE8E}
.ws-mission{font-size:18px;color:#FFF7E8;flex:1;text-align:center}
.ws-body{display:flex;gap:10px;flex:1 1 auto;min-height:0}
.ws-left{flex:1 1 56%;display:flex;flex-direction:column;gap:8px;min-width:0}
.ws-right{flex:1 1 44%;max-width:520px;display:flex;flex-direction:column;gap:8px;min-height:0}
.ws-lab{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.ws-lab span{font-size:15px;font-weight:700;color:#FFE9C4}
.ws-lab .ws-en{font-size:11px;color:#C9A87C;font-weight:500}

/* panels share the carved-wood identity */
.ws-stagewrap,.ws-objwrap,.ws-bgwrap,.ws-catwrap,.ws-palwrap,.ws-scrwrap{
  background:rgba(48,32,18,.6);border:3px solid #7A5630;border-radius:13px;padding:7px 10px}
.ws-stagewrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

/* stage */
.ws-stage{position:relative;flex:1 1 auto;border-radius:10px;overflow:hidden;
  border:3px solid #3A2412;min-height:190px}
.ws-grid,.ws-targets,.ws-actors{position:absolute;inset:0}
.ws-cell{position:absolute;box-sizing:border-box;border:1px dashed rgba(255,255,255,.18)}
.ws-target{position:absolute;display:flex;align-items:center;justify-content:center}
.ws-target-in{width:74%;height:74%;border-radius:50%;background:rgba(255,247,232,.28);
  border:3px dashed #FFE9C4;display:flex;align-items:center;justify-content:center;
  color:#FFF7E8;font-size:22px}
.ws-target.hit .ws-target-in{background:rgba(110,190,120,.6);border-style:solid;border-color:#6EBE78}
.ws-target-in svg{width:88%;height:88%;opacity:.55}
.ws-actor{position:absolute;display:flex;align-items:center;justify-content:center;
  transition:left .18s linear,top .18s linear;cursor:pointer;z-index:4}
.ws-actor.sel{filter:drop-shadow(0 0 0 3px #FFD37A)}
.ws-actor.sel::after{content:'';position:absolute;inset:6%;border:3px solid #FFD37A;border-radius:12px}
.ws-actor-rot{width:88%;height:88%;transition:transform .2s ease;display:flex;align-items:center;justify-content:center}
.ws-actor-art{width:100%;height:100%}
.ws-actor.jumping{animation:wsjump var(--jump-ms,.5s) cubic-bezier(.33,0,.4,1)}
@keyframes wsjump{0%,100%{transform:translateY(0)}45%{transform:translateY(calc(-1 * var(--jump-h,26%)))}}

/* objects */
.ws-objlist{display:flex;gap:7px;flex-wrap:wrap;min-height:52px}
.ws-thumb{width:52px;height:52px;border-radius:11px;background:rgba(255,247,232,.14);
  border:3px solid #7A5630;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px}
.ws-thumb.sel{border-color:#FFD37A;background:rgba(255,211,122,.24)}
.ws-thumb svg{width:100%;height:100%}
.ws-objbar{display:flex;gap:7px;margin-top:6px}
.ws-mini{flex:1;min-height:40px;border-radius:10px;border:3px solid;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700}
.ws-mini.add{background:var(--leaf);border-color:#33612A;color:#fff}
.ws-mini.del{background:#C4553F;border-color:#8E3423;color:#fff}
.ws-mini-lab{font-size:13px}

/* background library */
.ws-bgbtn{width:100%;min-height:40px;border-radius:10px;background:#3E7A9E;border:3px solid #2C5C7A;
  color:#FFF7E8;font-size:15px;font-weight:700;cursor:pointer}
.ws-bgpanel{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px;
  max-height:126px;overflow-y:auto}
.ws-bgpanel.open{display:grid}
.ws-bg{height:54px;border-radius:9px;border:3px solid #7A5630;cursor:pointer;position:relative}
.ws-bg.on{border-color:#FFD37A;box-shadow:0 0 0 3px rgba(255,211,122,.4)}
.ws-bg-lab{position:absolute;inset:auto 0 0 0;background:rgba(38,26,16,.66);color:#FFF7E8;
  font-size:12px;padding:2px 0;border-radius:0 0 6px 6px}

/* categories */
.ws-cats{display:flex;gap:7px}
.ws-cat{flex:1;min-height:44px;border-radius:10px;border:3px solid;background:rgba(255,247,232,.1);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFE9C4}
.ws-cat.on{background:rgba(255,211,122,.24);box-shadow:0 0 0 2px #FFD37A inset}
.ws-cat.locked{opacity:.38;cursor:not-allowed}
.ws-cat-ar{font-size:14px;font-weight:700}
.ws-cat-en{font-size:10px;opacity:.75}

/* blocks */
.ws-palwrap{flex:0 0 auto}
.ws-palette{display:flex;gap:7px;flex-wrap:wrap}
.ws-block{position:relative;border-radius:11px;border:3px solid rgba(0,0,0,.32);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:5px 4px;min-width:78px;min-height:70px;touch-action:none}
.ws-block.locked{opacity:.36;cursor:not-allowed}
.ws-block .ws-glyph{width:30px;height:30px}
.ws-block-lab{font-size:12px;font-weight:700;color:#FFF7E8;text-align:center;line-height:1.1}
.ws-block-val{position:absolute;top:3px;left:5px;background:#FFF7E8;color:#2A1A10;font-size:11px;
  font-weight:700;border-radius:6px;padding:0 5px}
.ws-lock{position:absolute;top:3px;right:5px;font-size:13px}
.ws-block.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:999;opacity:.85}

/* script area */
.ws-scrwrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.ws-script{flex:1 1 auto;display:flex;gap:7px;flex-wrap:wrap;align-content:flex-start;
  min-height:88px;background:rgba(20,12,6,.4);border:3px dashed #7A5630;border-radius:11px;padding:7px;
  overflow-y:auto}
.ws-script.dropok{border-color:#6EBE78;background:rgba(110,190,120,.16)}
.ws-script.dropdel{border-color:#C4553F;background:rgba(196,85,63,.16)}
.ws-script.needstart{animation:shake .45s}
.ws-empty{color:#C9A87C;font-size:15px;padding:22px 10px;width:100%;text-align:center}
.ws-block.scr{min-width:74px;min-height:66px}
.ws-block.scr.active{box-shadow:0 0 0 4px #FFD37A;transform:scale(1.06)}
.ws-val{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:42px;
  border-radius:7px;border:2px solid #B4772A;background:#FFF7E8;color:#2A1A10;
  font-size:13px;font-weight:700;text-align:center;font-family:inherit}

/* run bar */
.ws-runbar{display:flex;gap:8px;flex:0 0 auto}
.ws-btn{flex:1;min-height:52px;border-radius:12px;border:3px solid;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px}
.ws-btn-ar{font-size:16px;font-weight:700}
.ws-btn.run{background:var(--leaf);border-color:#33612A;color:#fff}
.ws-btn.reset{background:#5B86A8;border-color:#3C5C78;color:#fff}
.ws-btn.resetall{background:#8A5BA8;border-color:#6A3F86;color:#fff}
.ws-flag{width:17px;height:17px;background:#FFF7E8;clip-path:polygon(0 0,100% 22%,0 44%);
  align-self:center;margin-top:-6px}
@media (max-width:1400px){ .ws-block{min-width:70px;min-height:64px} .ws-thumb{width:46px;height:46px} }

/* sundial (2.6 / 2.7) and prediction row (2.9) */
.ws-dial{position:absolute;top:34px;right:12px;background:rgba(38,26,16,.76);
  border:2px solid #7A5630;border-radius:12px;padding:6px 8px;text-align:center;z-index:8}
.ws-dial-lab{font-size:12px;color:#FFE9C4;margin-bottom:4px}
.ws-dial-face{position:relative;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle,#F0DCA8,#C89A55);border:3px solid #7A5630}
.ws-dial-tick{position:absolute;left:50%;top:3px;width:2px;height:8px;background:#5A3E20;
  transform-origin:1px 28px;margin-left:-1px}
.ws-dial-hand{position:absolute;left:50%;top:50%;width:24px;height:4px;background:#C4553F;
  border-radius:2px;transform-origin:0 50%;margin-top:-2px;transition:transform .25s ease}
.ws-dial-hand::after{content:'';position:absolute;right:-6px;top:-3px;border:5px solid transparent;
  border-left-color:#C4553F}
.ws-predict{display:flex;align-items:center;gap:9px;margin-top:7px;background:rgba(48,32,18,.6);
  border:3px solid #7A5630;border-radius:12px;padding:7px 12px}
.ws-predict-lab{font-size:15px;font-weight:700;color:#FFE9C4}
.ws-predict-btn{min-height:38px;padding:0 16px;border-radius:10px;background:#3E7A9E;
  border:3px solid #2C5C7A;color:#FFF7E8;font-size:15px;font-weight:700;cursor:pointer}
.ws-predict-btn.on{background:var(--leaf);border-color:#33612A}

/* ---- تقويم ذاتي — unit self-check ---- */
.sc{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sc-head{text-align:center}
.sc-ttl{font-size:26px;font-weight:700;color:#FFE9C4}
.sc-sub{font-size:16px;color:#D8C4A2;margin-top:3px}
.sc-list{display:flex;flex-direction:column;gap:10px}
.sc-row{display:flex;align-items:center;gap:14px;background:rgba(38,26,16,.55);
  border:3px solid var(--copper-dk);border-radius:14px;padding:10px 16px;flex-wrap:wrap}
.sc-item{flex:1 1 240px;font-size:18px;color:#FFF7E8;line-height:1.5}
.sc-opts{display:flex;gap:10px}
.sc-opt{min-width:104px;min-height:96px;border-radius:13px;background:rgba(255,247,232,.1);
  border:3px solid #7A5630;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:6px}
.sc-opt.on{background:rgba(255,211,122,.24);border-color:#FFD37A}
.sc-face{width:46px;height:46px}
.sc-opt-lab{font-size:13px;font-weight:700;color:#FFF7E8;text-align:center;line-height:1.15}
.sc-note{text-align:center;font-size:15px;color:#C9B594}

/* ================= RELEASE FIX: keep every core control on screen =========
   The console previously wrapped its run bar onto a second row, pushing
   «إعادة الكائن» under the Windows taskbar. It is now compact, and the run bar
   is a fixed grid that cannot wrap. All sizes are DESIGN-SPACE px: the app
   root is already scaled, so vh units here would double-apply the scale.
   Arabic label sizes are preserved at Grade 1 readable size. */
.dkgo{gap:7px;padding:6px 10px}
.dk-titlebar{padding:5px 16px}
.dk-app-ar{font-size:19px}
.dk-mission{font-size:17px}
.dk-progwrap,.dk-palwrap{padding:6px 11px}
.dk-section-lab{margin-bottom:3px}
.dk-section-lab span{font-size:14px}
.dk-prog{min-height:46px}
.dk-chip{width:44px;height:44px}
.dk-chip .dk-glyph{width:28px;height:28px}
.dk-console{gap:7px}
.dk-cmd{min-height:70px;padding:5px 4px}
.dk-cmd .dk-glyph{width:32px;height:32px}
.dk-cmd-lab{font-size:15px}
.dk-cmd-en{font-size:10px}
/* run bar: ONE row - count + Run + Delete + Reset Object. A wrapped second
   row is exactly what pushed «إعادة الكائن» under the Windows taskbar. */
.dk-runbar{display:grid;grid-template-columns:auto 1fr 1fr 1.15fr;gap:6px;flex:0 0 auto}
.dk-countbox{padding:4px 12px;min-width:70px}
.dk-count-lab{font-size:12px}
.dk-count{font-size:22px}
.dk-btn{min-height:46px}
/* never span a second row */
.dk-btn.reset{grid-column:auto}
.dk-btn-ar{font-size:16px}
.dk-btn-en{font-size:10px}
/* the work area absorbs any shrink so the console is never pushed off screen */
.dk-body{min-height:0}
.dk-work{min-height:0}
.dk-console{min-height:0;flex:0 0 auto}
.dkgo,.ws{max-height:100%;overflow:hidden}


/* tooltip must never sit under anything or leave the screen */
.termchip{z-index:60}

/* CONTROL-POSITION CONSISTENCY: the application header and the reserved
   instruction region are fixed-height, so every lesson in the unit places its
   controls at identical coordinates regardless of how long its title or
   instruction text happens to be. */
.dk-titlebar{height:46px;flex:0 0 46px;box-sizing:border-box}
.dk-mission{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-appname{flex:0 0 auto}

.lesson-stage{top:192px}

/* ANCHORED CONTROLS: the program area is the only flexible part of the
   console, so the palette, Run, Delete, step count and Reset Object sit at
   identical coordinates in every lesson no matter how many commands the
   program currently holds. */
.dk-progwrap{flex:1 1 auto;min-height:62px;display:flex;flex-direction:column}
.dk-prog{flex:1 1 auto;min-height:46px;overflow-y:auto}
.dk-palwrap{flex:0 0 auto}
.dk-runbar{flex:0 0 auto}

/* taskbar-safe bottom margin: guarantees >=20px of clear space below the
   lowest control at every tested viewport height */
.lesson-stage{bottom:30px}

.lesson-stage{top:176px;bottom:22px}

/* lesson 1.4 rotation-target progress dots */
.dk-goaldots{display:flex;gap:5px;margin-right:4px}
.dk-goaldot{width:11px;height:11px;border-radius:50%;background:rgba(255,247,232,.28);
  border:2px solid #7A4E22}
.dk-goaldot.on{background:var(--leaf);border-color:#33612A}

/* the source shelf stays a MINOR part of the scene: the target row is the
   focus, and no tile may sit under the shelf. */
.room-objects{max-height:20vh;padding:6px 10px}
.room-objects .robj{transform:scale(.94);transform-origin:center}

/* the target row must clear the source shelf on the shorter stage: the row
   sat 2px into the shelf after the instruction region grew. */
.dawn-path{top:226px}
.room-objects{max-height:17.5vh;bottom:6px}
/* at 1920 the shelf is proportionally taller; cap it so the target row stays
   the dominant part of the scene */
/* NOTE: the shelf measures ~22.3% of the scene at 1920x1080, marginally over
   the 22% guideline. Shrinking the cards to force it under the line pushed the
   card illustration below the 40% minimum and made the pictures harder to read,
   which is the more important Grade 1 requirement. The guideline is therefore
   held at 1366x768 (18.3%) and accepted at 22.3% on the larger screen. */

@media (max-width:1400px){ .ws-cat{min-height:52px} .ws-cat-ar{font-size:13px} }

/* ================= ScratchJr six-category strip (book match) ================= */
.ws-cats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ws-cat{min-height:clamp(46px,6.6vh,58px);min-width:48px;border-radius:10px;
  border:3px solid rgba(0,0,0,.28);background:rgba(255,247,232,.09);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#FFE9C4;position:relative;padding:3px 2px;transition:transform .13s,box-shadow .13s}
.ws-cat:hover{transform:translateY(-2px)}
.ws-cat:focus-visible{outline:3px solid #FFD37A;outline-offset:2px}
.ws-cat-chip{width:clamp(20px,3vh,26px);height:clamp(20px,3vh,26px);border-radius:6px;
  display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.3)}
.ws-cat-chip .ws-glyph{width:74%;height:74%}
/* selected state uses border + glow + underline + aria, never colour alone */
.ws-cat.on{background:rgba(255,211,122,.24);box-shadow:0 0 0 3px #FFD37A inset;transform:translateY(-2px)}
.ws-cat.on .ws-cat-chip{box-shadow:0 0 0 3px #FFF7E8}
.ws-cat.on::after{content:'';position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
  width:22px;height:4px;border-radius:2px;background:#FFD37A}
.ws-cat.guided{opacity:.85}
.ws-cat-ar{font-size:clamp(11px,1.7vh,13px);font-weight:700;line-height:1.05}
.ws-cat-en{font-size:clamp(8px,1.2vh,10px);opacity:.72;line-height:1}

/* ---- object library (مكتبة الكائنات) ---- */
.ws-lib{position:absolute;inset:6% 5% 6% 5%;display:none;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#3A2716,#2A1B0E);border:4px solid #8A6234;
  border-radius:16px;padding:14px 16px;box-shadow:0 18px 46px rgba(0,0,0,.5);z-index:40}
.ws-lib.open{display:flex}
.ws-lib-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ws-lib-ttl{display:flex;align-items:baseline;gap:9px}
.ws-lib-ttl span{font-size:20px;font-weight:700;color:#FFE9C4}
.ws-lib-ttl .ws-en{font-size:12px;color:#C9A87C;font-weight:500}
.ws-lib-x{width:46px;height:46px;border-radius:11px;background:#C4553F;border:3px solid #8E3423;
  color:#fff;font-size:24px;font-weight:700;cursor:pointer;line-height:1}
.ws-lib-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
  overflow-y:auto;align-content:start;flex:1 1 auto;min-height:0}
.ws-libcard{min-width:126px;min-height:150px;border-radius:13px;background:rgba(255,247,232,.12);
  border:3px solid #8A6234;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:8px 5px;transition:transform .13s}
.ws-libcard:hover{transform:translateY(-3px);border-color:#FFD37A}
.ws-libcard:focus-visible{outline:3px solid #FFD37A;outline-offset:2px}
.ws-libcard-art{width:66px;height:66px}
.ws-libcard-art svg{width:100%;height:100%}
.ws-libcard-ar{font-size:15px;font-weight:700;color:#FFF7E8}
.ws-libcard-en{font-size:11px;color:#C9A87C}
@media (max-width:1400px){
  .ws-cat-ar{font-size:11px} .ws-libcard{min-height:146px} .ws-libcard-art{width:58px;height:58px}
}

/* ============ ScratchJr — BOOK LAYOUT ============
   stage on top (objects rail left, project card right), then ONE horizontal
   band of [six categories | palette | undo], then the script area across the
   bottom. Mirrors the Student Book screenshot. */
.ws-toolbar{display:flex;align-items:center;gap:6px;flex:0 0 auto;
  background:linear-gradient(180deg,#F4EFE4,#DED6C6);border:3px solid #8A6234;
  border-radius:11px;padding:4px 8px;margin-bottom:6px}
.ws-tb{width:clamp(34px,4.6vh,42px);height:clamp(34px,4.6vh,42px);border-radius:9px;
  border:2px solid #9A7A4E;background:#FFF7E8;color:#4A3316;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.ws-tb:hover{background:#FFE9C4}
.ws-tb:focus-visible{outline:3px solid #FFD37A;outline-offset:2px}
.ws-tb.flag{margin-inline-start:auto;background:#3FA45B;border-color:#2A6E3C}
.ws-flag-ic{width:16px;height:16px;background:#FFF7E8;clip-path:polygon(0 0,100% 24%,0 48%)}

.ws-mid{display:flex;gap:8px;flex:1 1 auto;min-height:0}
.ws-objwrap{flex:0 0 clamp(84px,9vw,116px);display:flex;flex-direction:column;min-height:0}
.ws-objlist{flex:1 1 auto;overflow-y:auto;flex-direction:column;display:flex;gap:6px;min-height:0}
.ws-stagewrap{flex:1 1 auto;min-width:0}
.ws-proj{flex:0 0 clamp(78px,8vw,104px);display:flex;flex-direction:column;gap:5px;
  background:rgba(48,32,18,.6);border:3px solid #7A5630;border-radius:11px;padding:6px}
.ws-proj-lab{font-size:11px;color:#E8D3AE;text-align:center;line-height:1.2}
.ws-proj-card{flex:1 1 auto;min-height:56px;border-radius:8px;background:#FFF7E8;
  border:3px solid #C89A55;position:relative}
.ws-proj-n{position:absolute;top:3px;right:5px;font-size:12px;font-weight:700;color:#8A6234}

/* ONE horizontal band: categories then palette, exactly as the book */
.ws-band{display:flex;align-items:stretch;gap:7px;flex:0 0 auto;margin-top:7px}
.ws-catwrap{flex:0 0 auto;padding:5px 7px}
.ws-cats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ws-cat{min-height:clamp(40px,5.4vh,50px);min-width:clamp(40px,4.4vw,52px)}
.ws-palwrap{flex:1 1 auto;min-width:0;padding:5px 7px}
.ws-palette{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center}
.ws-band-undo{display:flex;align-items:center}
.ws-scrwrap{flex:0 0 auto;margin-top:7px}
.ws-script{flex-wrap:nowrap;overflow-x:auto;min-height:clamp(74px,11vh,96px);align-items:center}
.ws-runbar{margin-top:7px}
/* the book stacks the app vertically: toolbar / stage row / band / script.
   The original .ws-body was a two-COLUMN flex; force the column direction and
   drop the legacy right column. */
.ws-body{flex-direction:column}
.ws-left,.ws-right{display:contents}
/* the Stage is the dominant region in the book: give the stage row the bulk of
   the vertical space and keep the band + script compact. */
.ws-mid{flex:1 1 auto;min-height:clamp(150px,30vh,300px)}
.ws-band{flex:0 0 auto}
.ws-scrwrap{flex:0 0 auto}
.ws-stage{min-height:clamp(140px,28vh,290px)}
.ws-objwrap,.ws-proj{min-height:0}
/* the whole application must fit the viewport: the script area and run bar were
   falling below the fold. Give the stage row a share that leaves room, and keep
   the lower bands compact. */
.ws{gap:clamp(4px,0.7vh,7px);padding:clamp(4px,0.7vh,7px) 8px}
.ws-mid{flex:1 1 auto;min-height:0}
.ws-stage{min-height:clamp(110px,20vh,240px)}
.ws-band{margin-top:5px}
.ws-scrwrap{margin-top:5px;padding:5px 8px}
.ws-script{min-height:clamp(58px,8.4vh,84px)}
.ws-runbar{margin-top:5px}
.ws-btn{min-height:clamp(38px,5.4vh,50px)}
.ws-toolbar{margin-bottom:4px}
.ws-bgwrap{display:none}   /* backgrounds open from the toolbar tool, as in the book */

/* ============ ScratchJr REALISTIC BOOK INTERFACE ============
   The application is a PHYSICAL layout: it must not mirror under Arabic RTL.
   The structural grid is LTR; Arabic text inside each control stays RTL. */
.ws{direction:ltr}
.ws-app-ar,.ws-mission,.ws-lab,.ws-cat-ar,.ws-cat-en,.ws-block-lab,.ws-mini-lab,
.ws-libcard-ar,.ws-libcard-en,.ws-proj-lab,.ws-empty,.ws-btn-ar,.ws-lib-ttl,
.ws-bg-lab{direction:rtl}
.ws-titlebar{direction:rtl}

/* the application scrolls INTERNALLY; the toolbar stays pinned */
.ws-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;scrollbar-width:auto;scrollbar-color:#C89A55 #2A1B0E}
.ws-scroll::-webkit-scrollbar{width:14px}
.ws-scroll::-webkit-scrollbar-track{background:#2A1B0E;border-radius:7px}
.ws-scroll::-webkit-scrollbar-thumb{background:#C89A55;border-radius:7px;border:2px solid #2A1B0E}
.ws-scroll::-webkit-scrollbar-thumb:hover{background:#E0A24B}
.ws-toolbar{position:sticky;top:0;z-index:12}
.ws-body{flex:1 1 auto;min-height:0}

/* STAGE DOMINANCE: the stage is the main workspace, not a strip */
.ws-mid{flex:0 0 auto;min-height:clamp(230px,42vh,430px)}
.ws-stage{min-height:clamp(220px,40vh,420px)}
.ws-actor{min-width:0}
.ws-actor-rot{width:96%;height:96%}

/* objects rail readable, project card meaningful */
.ws-objwrap{flex:0 0 clamp(116px,11vw,150px)}
.ws-objlist{overflow-y:auto;scrollbar-width:thin}
.ws-thumb{width:100%;height:clamp(50px,7vh,64px)}
.ws-proj{flex:0 0 clamp(96px,9vw,124px)}

/* script area must not dominate the stage when empty */
.ws-scrwrap{flex:0 0 auto}
.ws-script{min-height:clamp(64px,9vh,88px);max-height:clamp(96px,14vh,132px)}

/* a disabled application control must LOOK disabled */
.ws-mini.off,.ws-mini:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.55)}

/* the object library floats above everything inside the application */
.ws{position:relative}
.ws-lib{z-index:60}
.ws-bgpanel{z-index:55}

/* the instruction/header gap fell to 15px on the tallest Unit 2 lesson */
.ws-titlebar{margin-top:2px}
.lesson-stage{top:178px}

/* At 1920 the stage grew until the category strip and script area fell below
   the viewport. The stage stays dominant but is capped so the whole
   application remains reachable without scrolling on tall screens. */
/* the lesson stage is a SCALED design surface, so vh units do not describe the
   space actually available inside it. Size the stage as a share of the
   application box instead, which scales with it. */
.ws-mid{flex:1 1 auto;min-height:180px;max-height:none}
.ws-stage{min-height:170px;height:100%}
.ws-scroll{overflow-y:auto}

/* Reclaim vertical budget for the Stage: the band, script area and run bar were
   taking 403px of a 796px application, leaving the Stage at 30%. The Stage is
   the main workspace and must dominate, so the lower bands are made compact
   and the Stage takes the remaining space. */
.ws-catwrap,.ws-palwrap{padding:4px 6px}
.ws-lab{margin-bottom:2px}
.ws-lab span{font-size:13px}
.ws-lab .ws-en{font-size:10px}
.ws-cat{min-height:44px}
.ws-block{min-height:56px;min-width:66px;padding:3px}
.ws-block .ws-glyph{width:24px;height:24px}
.ws-block-lab{font-size:11px}
.ws-scrwrap{padding:4px 7px}
.ws-script{min-height:62px;max-height:78px}
.ws-block.scr{min-width:62px;min-height:56px}
.ws-runbar{margin-top:4px}
.ws-btn{min-height:40px}
.ws-btn-ar{font-size:14px}
.ws-toolbar{padding:3px 7px}
.ws-tb{width:34px;height:34px}
.ws-mid{flex:1 1 auto;min-height:240px}
.ws-stage{min-height:230px}

/* ===== UNIT 1 COMMAND TILES: readable icons, badge BELOW the tile =====
   The count badge («4×») sat on top of the command icon and clipped the
   Arabic label. The tile is now larger, the icon bigger, and the value sits
   centred beneath the tile with real clearance. */
.dk-cmd{width:auto;min-width:96px;min-height:96px;padding:9px 6px}
.dk-cmd .dk-glyph{width:46px;height:46px}
.dk-cmd-lab{font-size:16px}
.dk-prog{padding-bottom:30px}          /* room for the value badges */
.dk-chip{width:74px;height:74px;border-radius:13px;overflow:visible}
.dk-chip .dk-glyph{width:46px;height:46px}
.dk-chip-n{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
  background:#E0A24B;color:#2A1A10;font-size:15px;font-weight:700;border-radius:9px;
  padding:1px 9px;border:2px solid #B4772A;white-space:nowrap;line-height:1.25}
.dk-chip.active{box-shadow:0 0 0 4px #FFD37A}
.dk-chip.active .dk-chip-n{box-shadow:none}

/* ===== ScratchJr: highlighted (not locked) blocks ===== */
.ws-block.glow{box-shadow:0 0 0 3px #FFD37A, 0 0 12px rgba(255,211,122,.55)}

@media (max-width:1400px){ .credit{font-size:13px} }

/* ===== PUZZLE-SHAPED BLOCKS (book reference) =====
   The reference shows interlocking puzzle blocks with a notch on one side and
   a tab on the other, the value bubble beneath, connected left-to-right. */
.ws-block{position:relative;border-radius:9px;
  clip-path:polygon(0 0, calc(100% - 9px) 0, calc(100% - 9px) 34%, 100% 34%,
                    100% 66%, calc(100% - 9px) 66%, calc(100% - 9px) 100%,
                    0 100%, 0 66%, 9px 66%, 9px 34%, 0 34%);
  padding-left:12px;padding-right:14px}
.ws-block .ws-block-val{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  background:#FFF7E8;color:#2A1A10;border:2px solid rgba(0,0,0,.28);border-radius:7px;
  font-size:11px;font-weight:700;padding:0 6px;top:auto;z-index:2}
.ws-palette,.ws-script{padding-bottom:14px}
.ws-block.scr{margin-right:-4px}          /* blocks visually interlock */
.ws-script{gap:2px}

@media (max-width:1400px){ .credit{font-size:16px} }

/* pages panel, sound recorder, stage text */
.ws-pages,.ws-rec{position:absolute;inset:14% 18% auto 18%;display:none;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#3A2716,#2A1B0E);border:4px solid #8A6234;border-radius:16px;
  padding:14px 16px;box-shadow:0 18px 46px rgba(0,0,0,.5);z-index:70}
.ws-pages.open,.ws-rec.open{display:flex}
.ws-pages-ttl,.ws-rec-ttl{font-size:19px;font-weight:700;color:#FFE9C4;text-align:center}
.ws-pages-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ws-page{width:62px;height:78px;border-radius:9px;background:#FFF7E8;border:3px solid #C89A55;
  color:#5A4200;font-size:19px;font-weight:700;cursor:pointer}
.ws-page.on{border-color:#FFD37A;box-shadow:0 0 0 3px rgba(255,211,122,.5)}
.ws-page.add{background:rgba(255,247,232,.16);color:#FFE9C4}
.ws-pages-x,.ws-rec-x{align-self:center;padding:7px 22px;border-radius:10px;background:#C4553F;
  border:3px solid #8E3423;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.ws-rec-msg{color:#FFF7E8;font-size:16px;text-align:center;line-height:1.6}
.ws-rec-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ws-rec-b{padding:9px 18px;border-radius:10px;border:3px solid;cursor:pointer;font-size:15px;
  font-weight:700;font-family:inherit}
.ws-rec-b.go{background:#3E7A9E;border-color:#2C5C7A;color:#fff}
.ws-rec-b.stop{background:#C4553F;border-color:#8E3423;color:#fff}
.ws-rec-b.ok{background:var(--leaf);border-color:#33612A;color:#fff}
.ws-rec-b.again,.ws-rec-b.demo{background:#E0A24B;border-color:#B4772A;color:#2A1A10}
.ws-stagetext{position:absolute;left:12%;top:12%;background:rgba(255,247,232,.92);color:#2A1A10;
  border:2px solid #C89A55;border-radius:8px;padding:4px 10px;font-size:18px;font-weight:700;z-index:7}

/* ================= RC2 CORRECTIONS ================= */

/* --- 1. OBJECT BASELINE: actors stand on the lower Stage band --- */
.ws-actor{align-items:flex-end}
.ws-actor-rot{width:88%;height:88%;transform-origin:50% 100%}

/* the lesson stage reserves room so the credit sits BELOW the application */
.lesson-stage{bottom:40px}
.ws,.dkgo{padding-bottom:4px}

/* --- 3. PUZZLE BLOCKS: dedicated connector zones, nothing drawn inside --- */
.ws-block{min-width:96px;padding-left:16px;padding-right:18px;
  clip-path:polygon(0 0, calc(100% - 8px) 0, calc(100% - 8px) 36%, 100% 36%,
                    100% 64%, calc(100% - 8px) 64%, calc(100% - 8px) 100%,
                    0 100%, 0 64%, 8px 64%, 8px 36%, 0 36%)}
.ws-block .ws-glyph{width:28px;height:28px}
.ws-block-lab{font-size:15px;line-height:1.15;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-block .ws-block-val{min-width:32px;min-height:26px;display:flex;align-items:center;
  justify-content:center;bottom:-13px;font-size:13px}
.ws-block.scr{min-width:92px;margin-right:0}
/* --- 4. OVERFLOW: palette and script scroll horizontally, values stay visible --- */
.ws-palette{overflow-x:auto;overflow-y:visible;padding-bottom:20px;flex-wrap:nowrap}
.ws-script{overflow-x:auto;overflow-y:visible;padding-bottom:20px;flex-wrap:nowrap}
.ws-palwrap,.ws-scrwrap{overflow:visible}
.ws-palette::-webkit-scrollbar,.ws-script::-webkit-scrollbar{height:10px}
.ws-palette::-webkit-scrollbar-thumb,.ws-script::-webkit-scrollbar-thumb{
  background:#C89A55;border-radius:5px}

/* --- 5. TOP-RIGHT: flag clear of the project panel and scrollbar --- */
.ws-toolbar{position:sticky;top:0;z-index:30;padding-right:10px}
.ws-tb.flag{margin-inline-start:auto;margin-right:4px;position:relative;z-index:32}
.ws-proj{margin-top:2px}
.ws-scroll{scrollbar-gutter:stable}

/* Unit 1: the command being taught is highlighted, others stay usable */
.dk-cmd.taught{box-shadow:0 0 0 3px #FFD37A, 0 0 12px rgba(255,211,122,.5)}

/* the application box must fit ABOVE the reserved credit footer */
.ws,.dkgo{max-height:100%;overflow:hidden}
.ws-scroll{max-height:100%}
/* the reserved credit footer shortened the stage, so the 1.1 card shelf grew
   proportionally and the target row met it again. Trim the shelf and lift the
   row so the figures stay >=85px and no tile is covered. */
@media (min-width:1600px){ .room-objects{max-height:14.5vh} }
.dawn-path{top:220px}
.room-objects{bottom:4px}
/* at short heights the blocks compressed until icons entered the connector
   zones. Blocks never shrink below a readable floor; the palette scrolls. */
.ws-block{flex:0 0 auto;min-width:100px}
.ws-block.scr{min-width:96px}
/* the lesson stage is a SCALED surface, so px minimums shrink with it. Size the
   block icon and value bubble generously in design units so the RENDERED size
   still clears 24px / 30x26px at the smallest supported scale (~0.78). */
.ws-block .ws-glyph{width:32px;height:32px}
.ws-block .ws-block-val{min-width:40px;min-height:33px;font-size:15px;bottom:-16px}
.ws-block{min-width:112px;min-height:64px}
.ws-block.scr{min-width:108px}
.ws-palette,.ws-script{padding-bottom:26px}

/* ---- Say text parameter, message colour, speech bubbles ---- */
.ws-textparam{position:relative;margin-top:3px;
  min-width:62px;max-width:120px;background:#FFF7E8;color:#2A1A10;border:2px solid #7A4E86;
  border-radius:8px;font-size:13px;font-weight:700;padding:1px 8px;cursor:text;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.ws-textparam.empty{color:#8A7A66;font-weight:500;font-style:italic}
.ws-textparam:focus-visible{outline:3px solid #FFD37A;outline-offset:1px}
.ws-colparam{position:absolute;top:4px;left:5px;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,247,232,.85);cursor:pointer;z-index:3}
.ws-colparam:focus-visible{outline:3px solid #FFD37A;outline-offset:2px}
.ws-txtpop{position:absolute;display:none;flex-direction:column;gap:8px;width:280px;
  background:linear-gradient(180deg,#3A2716,#2A1B0E);border:4px solid #8A6234;border-radius:14px;
  padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:200}
.ws-txtpop.open{display:flex}
.ws-txtttl{font-size:16px;font-weight:700;color:#FFE9C4;text-align:center}
.ws-txtinput{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:9px;
  border:3px solid #C89A55;background:#FFF7E8;color:#2A1A10;font-size:17px;
  font-family:'Tajawal',sans-serif;font-weight:700}
.ws-txtrow{display:flex;gap:8px;justify-content:center}
.ws-txtb{padding:8px 20px;border-radius:9px;border:3px solid;cursor:pointer;
  font-size:15px;font-weight:700;font-family:inherit}
.ws-txtb.ok{background:var(--leaf);border-color:#33612A;color:#fff}
.ws-txtb.no{background:#C4553F;border-color:#8E3423;color:#fff}
.ws-bubble{position:absolute;max-width:38%;background:#FFF7E8;color:#2A1A10;
  border:3px solid #7A5630;border-radius:12px;padding:5px 11px;font-size:16px;font-weight:700;
  z-index:9;margin-bottom:6px;box-shadow:0 4px 12px rgba(0,0,0,.28);line-height:1.4}
.ws-bubble::after{content:'';position:absolute;bottom:-10px;left:18px;border:6px solid transparent;
  border-top-color:#7A5630}
.ws-bubble.below{margin-top:6px;margin-bottom:0}
.ws-bubble.below::after{bottom:auto;top:-10px;border-top-color:transparent;border-bottom-color:#7A5630}
.ws-actor-rot{transform-origin:50% 100%}
.ws-actor-art{transform:scale(var(--obj-scale,1));transform-origin:50% 100%;transition:transform .25s}
.ws-actor{transition:opacity .25s}

/* Say blocks are taller so the text field sits inside the block body */
.ws-block[data-block="SAY"]{min-height:82px;min-width:124px;padding-bottom:6px}
.ws-block[data-block="SAY"] .ws-textparam{pointer-events:auto;z-index:6}

.tm-ans{margin-top:8px;padding:10px 14px;border-radius:10px;background:rgba(92,154,74,.14);border:2px solid rgba(92,154,74,.45)}
.tm-actions-wrap{margin-top:14px}
.tm-actions{display:flex;flex-wrap:wrap;gap:8px}
.tm-btn{padding:11px 15px;border-radius:11px;border:2px solid var(--copper-dk);background:#F0E2C8;font-size:14.5px;

.tm-btn.warn{border-color:var(--warn);color:#8E3A24;background:rgba(217,105,78,.12)}
.tm-jump{display:flex;flex-wrap:wrap;gap:6px}
.tm-jbtn{padding:8px 12px;border-radius:9px;border:2px solid var(--falaj);background:rgba(127,220,207,.2);
