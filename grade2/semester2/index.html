/* ==== lessons/l11.js — الدرس 1.11: لِنَتَدَرَّبْ على التَّكْرارِ ====
 * Student Book p.69 · Teacher's Guide p.85 · 1 session
 * OBJECTIVES: إعادة بناء مقطع باستخدام التكرار · اختيار عدد التكرارات · مطابقة المقطع بالنتيجة.
 * criteria: rebuild · count · match
 *
 * Stage 1 (rebuild): rebuild a long repeated script using ONE Repeat block —
 *   verified by computing the same motion with fewer authored blocks.
 * Stage 2 (count): choose the correct repeat COUNT for a given long script
 *   (SB p.70) — validated by comparing computed runs.
 * Stage 3 (match): match a repeat script to its computed result; alternative
 *   valid programs that reach the same result are accepted.
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  W.lessons.register('l11', {
    stages(api) {
      let st = null;
      const idOf = kind => { const o = st.proj.page().objects.find(x => x.kind === kind); return o ? o.id : null; };

      return [
        /* ===== STAGE 1 — rebuild with Repeat (alternative programs accepted) ===== */
        {
          id: 'rebuild', step: 'rebuild',
          enter() {
            api.clearWork();
            api.say('هذا المَقْطَعُ الطَّويلُ يُحَرِّكُ Tic 3 يَمينًا وَيُكَبِّرُهُ، ثَلاثَ مَرَّاتٍ. أَعِدْ بِناءَهُ بِاسْتِخْدامِ لَبِنَةِ التَّكْرارِ لِيُعْطِيَ النَّتيجَةَ نَفْسَها، ثُمَّ شَغِّلْ.',
              'يُقْبَلُ أَيُّ حَلٍّ يُعْطي النَّتيجَةَ نَفْسَها.');
            const pC_rep = api.panel('p-concept');
            pC_rep.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'repeatCompare',
              role: 'img', 'aria-label': 'مقارنة بين مقطع طويل ولبنة التكرار' }, [W.edu.scene('repeatCompare')]));
            st = api.studio({
              cols: 12, rows: 8, background: 'city',
              blocks: ['START', 'FWD', 'GROW', 'REPEAT'],
              allowAdd: false, allowPages: false, showPages: false, grid: true,
            });
            st.setAllowed(['START', 'FWD', 'GROW', 'REPEAT']);
            if (!st._seeded) { const pg = st.proj.page(); pg.objects.slice().forEach(o => st.proj.removeObject(o.id)); st.proj.addObject({ kind: 'tic', x: 1, y: 5 }); st._seeded = true; }
            st.select(idOf('tic')); st.setCat('control'); st.highlight('control', 'REPEAT');
            st.repaint();

            /* target: (FWD3, GROW) repeated 3 times, computed once cleanly */
            const probe = W.sjr.create({ cols: 12, rows: 8 }); probe.addPage({});
            const target = (() => {
              const o = probe.addObject({ kind: 'tic', x: 1, y: 5 });
              probe.addBlock(o.id, 'START');
              for (let i = 0; i < 3; i++) { probe.addBlock(o.id, 'FWD', { val: 3 }); probe.addBlock(o.id, 'GROW'); }
              return probe.simulate({ trigger: 'START', fromHome: true }).final[o.id];
            })();

            let ranOnce = false;
            const O = () => st.proj.obj(idOf('tic'));
            const test = () => {
              const o = O(); if (!o) return false;
              const usesRepeat = o.scripts.some(s => s.some(b => b.type === 'REPEAT'));
              if (!usesRepeat) return false;
              const f = st.proj.simulate({ trigger: 'START', fromHome: true }).final[o.id];
              return f && f.x === target.x && f.size === target.size;
            };
            const check = () => {
              const o = O(); if (!o) return { ok: false, fix: 'اخْتَرِ الكائِنَ Tic أَوَّلًا.' };
              const hasStart = o.scripts.some(s => s[0] && s[0].type === 'START');
              const usesRepeat = o.scripts.some(s => s.some(b => b.type === 'REPEAT'));
              if (!hasStart) return { ok: false, fix: 'أَضِفِ العَلَمَ الأخْضَرَ في البِدايَةِ.' };
              if (!usesRepeat) return { ok: false, fix: 'اسْتَخْدِمْ لَبِنَةَ التَّكْرارِ بَدَلًا مِنْ تَكْرارِ اللَّبِناتِ يَدَوِيًّا.' };
              if (!ranOnce) return { ok: false, fix: 'اضْغَطْ زِرَّ التَّشْغيلِ ثُمَّ تَحَقَّقْ.' };
              if (!test()) return { ok: false, fix: 'ضَعْ (تَحَرَّكْ يَمينًا 3 ثُمَّ كَبِّرْ) داخِلَ تَكْرارٍ عَدَدُهُ 3 لِتُطابِقَ النَّتيجَةَ.' };
              return { ok: true, reason: 'أَعَدْتَ البِناءَ بِلَبِنَةِ التَّكْرارِ وَحَصَلْتَ على النَّتيجَةِ نَفْسِها بِلَبِناتٍ أَقَلَّ.' };
            };
            const PRAC = K.practical(api, { step: 'rebuild', trigger: 'START', check });
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — choose the correct repeat count ===== */
        {
          id: 'count', step: 'count',
          enter() {
            const PR_count = K.progress(api, { step: 'count', mode: 'theory' });
            api.clearWork();
            api.say('المَقْطَعُ الطَّويلُ يُكَرِّرُ (لأسْفَلَ ثُمَّ لأعْلى) ثَمانِ لَبِناتٍ = أَرْبَعُ مَرَّاتٍ. كَمْ عَدَدُ التَّكْراراتِ الصَّحيحُ؟ اخْتَرْ ثُمَّ تَحَقَّقْ.');
            const p = api.panel('p-flow');
            const TH = K.theory(p, {
              art: 'repeatCompare',
              artLabel: 'مقطع طويل مقابل مقطع فيه لبنة تكرار واحدة',
              caption: 'مَقْطَعٌ طَويلٌ… وَمَقْطَعٌ بِتَكْرارٍ',
              title: 'كَمْ مَرَّةً تَتَكَرَّرُ الوَحْدَةُ؟',
              points: ['عُدَّ لَبِناتِ الوَحْدَةِ المُتَكَرِّرَةِ.', 'اقْسِمْ عَدَدَ اللَّبِناتِ عَلَيْها.'],
            });
            // long script preview: (DOWN,UP) x4
            const long = [{ type: 'START' }];
            for (let i = 0; i < 4; i++) { long.push({ type: 'DOWN', val: 1 }); long.push({ type: 'UP', val: 1 }); }
            TH.bottom.appendChild(el('div', { class: 'p-note', text: 'المَقْطَعُ الطَّويلُ:' }));
            TH.bottom.appendChild(K.scriptPreview(long));
            const w = K.choiceWidget({
              options: [
                { id: 'a', correct: false, label: '2' },
                { id: 'b', correct: true, label: '4' },
                { id: 'c', correct: false, label: '9' },
              ],
              onChange: () => api.clearFb(),
            });
            TH.bottom.appendChild(el('div', { class: 'p-note', text: 'عَدَدُ التَّكْراراتِ:' }));
            TH.bottom.appendChild(w.host);
            let ok = false;
            TH.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-count', text: 'تَحَقَّقْ',
                onclick: () => { if (ok) return; if (w.chosen() == null) { api.hint('اخْتَرْ عَدَدًا.'); return; } if (w.verify()) { ok = true; api.good('صَحيحٌ! ثَمانِ لَبِناتٍ = أَرْبَعُ تَكْراراتٍ لِوَحْدَةٍ مِنْ لَبِنَتَيْنِ.'); PR_count.succeed(); } else api.hint('عُدَّ الوَحْدَةَ المُتَكَرِّرَةَ: لَبِنَتانِ في كُلِّ مَرَّةٍ.'); } }),
            ]));
            this._ok = () => ok;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — match a repeat script to its result ===== */
        {
          id: 'match', step: 'match',
          enter() {
            const PR_match = K.progress(api, { step: 'match', mode: 'theory' });
            api.clearWork();
            api.say('أَيُّ مَقْطَعٍ يَجْعَلُ Tic يُنَطِّطُ (لأسْفَلَ ثُمَّ لأعْلى) 3 مَرَّاتٍ؟ اخْتَرْ ثُمَّ تَحَقَّقْ.');
            const p = api.panel('p-flow');
            const TH2 = K.theory(p, {
              art: 'repeatCompare',
              artLabel: 'التكرار يختصر المقطع',
              title: 'طابِقِ المَقْطَعَ بِالنَّتيجَةِ',
              points: ['ما الوَحْدَةُ داخِلَ التَّكْرارِ؟', 'كَمْ مَرَّةً تَتَكَرَّرُ؟'],
            });
            const mk = body => { const b = [{ type: 'START' }, { type: 'REPEAT', val: body.rep }]; return b; };
            const opt = (rep, inner, label) => ({ rep, inner, label });
            const scriptOpt = (blocks) => () => el('div', {}, [K.scriptPreview(blocks)]);
            const w = K.choiceWidget({
              options: [
                { id: 'a', correct: true, render: scriptOpt([{ type: 'START' }, { type: 'DOWN', val: 1 }, { type: 'UP', val: 1 }, { type: 'REPEAT', val: 3 }]) },
                { id: 'b', correct: false, render: scriptOpt([{ type: 'START' }, { type: 'FWD', val: 5 }, { type: 'REPEAT', val: 3 }]) },
                { id: 'c', correct: false, render: scriptOpt([{ type: 'START' }, { type: 'DOWN', val: 1 }, { type: 'UP', val: 1 }, { type: 'REPEAT', val: 2 }]) },

            TH2.bottom.appendChild(el('div', { class: 'route-btns' }, [
              el('button', { class: 'verifybtn', type: 'button', 'data-act': 'verify-match', text: 'تَحَقَّقْ',
                onclick: () => { if (ok) return; if (w.chosen() == null) { api.hint('اخْتَرْ مَقْطَعًا.'); return; } if (w.verify()) { ok = true; api.good('صَحيحٌ! تَكْرارُ (لأسْفَلَ، لأعْلى) 3 مَرَّاتٍ.'); PR_match.succeed(); } else api.hint('يَجِبُ أَنْ تَتَكَرَّرَ الوَحْدَةُ (لأسْفَلَ، لأعْلى) ثَلاثَ مَرَّاتٍ.'); } }),
            ]));
            this._ok = () => ok;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

/* ==== lessons/l12.js ==== */
/* ==== lessons/l12.js — الدرس 1.12: التَّحَكُّمُ في ظُهورِ كائِنٍ ====
 * Student Book p.73 · Teacher's Guide p.92 · 1 session
 * OBJECTIVES: التعامل مع لبنة الصوت · إخفاء وإظهار كائن.
 * criteria: sound · hide · show
 *
 * The balls game (SB pp.73-76). Real Sound, Hide, Show and Wait.
 * Stage 1 (sound): tapping the ball emits a real local sound event (POP).
 * Stage 2 (hide): the ball HIDES on tap — computed visibility becomes false.
 * Stage 3 (show): the ball hides then SHOWS again after a Wait — computed
 *   visibility returns to true, later in time than the hide.
 */
(function (W) {
  const { el } = W.util;
  const K = W.kit;

  W.lessons.register('l12', {
    stages(api) {
      let st = null;
      const idOf = kind => { const o = st.proj.page().objects.find(x => x.kind === kind); return o ? o.id : null; };
      function ensure() {
            const cs = api.panel('p-concept');
            cs.appendChild(el('figure', { class: 'concept-fig', 'data-thart': 'hideShow',
              role: 'img', 'aria-label': 'كائن ظاهر ثم مختفٍ ثم ظاهر' }, [W.edu.scene('hideShow')]));
            cs.appendChild(el('div', { class: 'concept-txt' }, [
              el('div', { class: 'concept-h', text: 'الظُّهورُ وَالاخْتِفاءُ' }),
              el('div', { class: 'concept-p', text: 'الاخْتِفاءُ لَيْسَ حَذْفًا: الكائِنُ يَبْقى وَيُمْكِنُ إظْهارُهُ.' }),
            ]));
        st = api.studio({
          cols: 12, rows: 8, background: 'sea',
          blocks: ['START', 'ON_TAP', 'DOWN', 'UP', 'FOREVER', 'POP', 'HIDE', 'SHOW', 'WAIT'],
          allowAdd: false, allowPages: false, showPages: false, grid: false,
        });
        st.setAllowed(['START', 'ON_TAP', 'DOWN', 'UP', 'FOREVER', 'POP', 'HIDE', 'SHOW', 'WAIT']);
        if (!st._seeded) { const pg = st.proj.page(); pg.objects.slice().forEach(o => st.proj.removeObject(o.id)); st.proj.addObject({ kind: 'ball', x: 5, y: 3 }); st._seeded = true; }
        st.select(idOf('ball')); st.repaint();
        return st;
      }

      return [
        /* ===== STAGE 1 — Sound on tap ===== */
        {
          id: 'sound', step: 'sound',
          enter() {
            api.clearWork();
            api.say('لَبِنَةُ الصَّوْتِ (Sound) تُصْدِرُ صَوْتًا حَقيقِيًّا. اجْعَلِ الكُرَةَ تُصْدِرُ صَوْتًا عِنْدَ النَّقْرِ عَلَيْها: ابْدَأْ عِنْدَ النَّقْرِ + لَبِنَةَ الصَّوْتِ، ثُمَّ انْقُرْ على الكُرَةِ.',
              'لَبِنَةُ الصَّوْتِ في الفِئَةِ الخَضْراءِ.');
            ensure(); st.setCat('sound'); st.highlight('sound', 'POP');
            const O = () => st.proj.obj(idOf('ball'));
            const hasTapHead = () => { const o = O(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP'); };
            const hasSound = () => { const o = O(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP' && s.some(b => b.type === 'POP')); };
            let emitted = false;
            st.onRun = (sim) => {
              const o = O();
              if (o && sim && sim.events && sim.events.some(e => e.kind === 'sound' && e.obj === o.id)) emitted = true;
              PRAC.onEdit();
            };
            const check = () => {
              const o = O(); if (!o) return { ok: false, fix: 'اخْتَرِ الكُرَةَ أَوَّلًا.' };
              if (!hasTapHead()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ «ابْدَأْ عِنْدَ النَّقْرِ» في البِدايَةِ.' };
              if (!hasSound()) return { ok: false, fix: 'أَضِفْ لَبِنَةَ الصَّوْتِ (الفِئَةُ الخَضْراءُ) بَعْدَ «ابْدَأْ عِنْدَ النَّقْرِ».' };
              if (!emitted) return { ok: false, fix: 'انْقُرْ على الكُرَةِ في المِنَصَّةِ لِتُصْدِرَ صَوْتًا.' };
              return { ok: true, reason: 'أَصْدَرَتِ الكُرَةُ صَوْتًا حَقيقِيًّا عِنْدَ النَّقْرِ عَلَيْها.' };
            };
            const PRAC = K.practical(api, { step: 'sound', trigger: 'ON_TAP', only: idOf('ball'), check });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — Hide ===== */
        {
          id: 'hide', step: 'hide',
          enter() {
            api.clearWork();
            api.say('اجْعَلِ الكُرَةَ تَخْتَفي عِنْدَ النَّقْرِ عَلَيْها: ابْدَأْ عِنْدَ النَّقْرِ + لَبِنَةَ اخْتَفِ (فِئَةُ المَظاهِرِ)، ثُمَّ انْقُرْ على الكُرَةِ.',
              'الاخْتِفاءُ لَيْسَ حَذْفًا: الكائِنُ يَبْقى وَيُمْكِنُ إظْهارُهُ.');
            ensure(); st.setCat('looks'); st.highlight('looks', 'HIDE');
            const O = () => st.proj.obj(idOf('ball'));
            const hasTapHead = () => { const o = O(); return o && o.scripts.some(s => s[0] && s[0].type === 'ON_TAP'); };

            api.say('اجْعَلِ الكُرَةَ تَخْتَفي ثُمَّ تَظْهَرُ مِنْ جَديدٍ بَعْدَ انْتِظارٍ: ابْدَأْ عِنْدَ النَّقْرِ + اخْتَفِ + انْتَظِرْ + اظْهَرْ، ثُمَّ انْقُرْ على الكُرَةِ.');

            const check = () => {
              const o = O(); if (!o) return { ok: false, fix: 'اخْتَرِ الكُرَةَ أَوَّلًا.' };

              if (!f.some(b => b.type === 'WAIT')) return { ok: false, fix: 'أَضِفْ لَبِنَةَ «انْتَظِرْ» بَعْدَ «اخْتَفِ».' };
              if (!f.some(b => b.type === 'SHOW')) return { ok: false, fix: 'أَضِفْ لَبِنَةَ «اظْهَرْ» بَعْدَ لَبِنَةِ الانْتِظارِ.' };

              return { ok: true, reason: 'اخْتَفَتِ الكُرَةُ ثُمَّ ظَهَرَتْ بَعْدَ الانْتِظارِ، وَانْتَهَتْ ظاهِرَةً.' };
            };
            const PRAC = K.practical(api, { step: 'show', trigger: 'ON_TAP', only: idOf('ball'), check });
            st.onRun = () => { ranOnce = true; PRAC.onEdit(); };
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 2 — build four pages ===== */
        {
          id: 'pages4', step: 'pages4',
          enter() {
            api.clearWork();
            api.say('أَنْشِئْ مَشْروعًا مِنْ أَرْبَعِ صَفَحاتٍ تَحْكي قِصَّةَ اسْتِعْدادِ Tic لِلمَدْرَسَةِ (لَها بِدايَةٌ وَوَسَطٌ وَنِهايَةٌ). أَضِفِ الصَّفَحاتِ مِنْ عَمودِ الصَّفَحاتِ على اليَمينِ حَتّى تُصْبِحَ أَرْبَعًا.');
            ensure();
            const test = () => st.proj.pageCount >= 4;
            const check = () => {
              const n = st.proj.pageCount;
              if (n < 4) return { ok: false, fix: 'أَضِفْ صَفَحاتٍ مِنْ عَمودِ الصَّفَحاتِ (+) حَتّى تُصْبِحَ أَرْبَعًا (لَدَيْكَ الآنَ ' + n + ').' };
              return { ok: true, reason: 'لَدَيْكَ الآنَ أَرْبَعُ صَفَحاتٍ لِلْقِصَّةِ (بِدايَةٌ وَوَسَطٌ وَنِهايَةٌ).' };
            };
            const PRAC = K.practical(api, { step: 'pages4', trigger: 'START', check, noRun: true });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 3 — each page has its own object + script ===== */
        {
          id: 'scripts', step: 'scripts',
          enter() {
            api.clearWork();
            api.say('اجْعَلْ لِكُلِّ صَفْحَةٍ كائِنًا وَمَقْطَعًا بَرْمَجِيًّا خاصًّا بِها (العَلَمُ الأخْضَرُ مَعَ حَرَكَةٍ أو كَلامٍ أو صَوْتٍ). تَنَقَّلْ بَيْنَ الصَّفَحاتِ وَبَرْمِجْ كُلَّ صَفْحَةٍ.',
              'وَظِّفْ ما تَعَلَّمْتَهُ: تَحَدَّثْ، انْتَظِرْ، حَرَكَة، تَكْرار، صَوْت...');
            ensure();
            const pageHasScript = pg => pg.objects.some(o => o.scripts.some(s => s.length >= 2 && W.sjr.BLOCKS[s[0].type] && W.sjr.BLOCKS[s[0].type].head));
            const test = () => {
              const pages = st.proj.project.pages;
              if (pages.length < 4) return false;
              return pages.slice(0, 4).filter(pageHasScript).length >= 4;
            };
            const check = () => {
              const pages = st.proj.project.pages;
              if (pages.length < 4) return { ok: false, fix: 'أَنْشِئْ أَرْبَعَ صَفَحاتٍ أَوَّلًا.' };
              const missing = [];
              pages.slice(0, 4).forEach((pg, i) => { if (!pageHasScript(pg)) missing.push(i + 1); });
              if (missing.length) return { ok: false, fix: 'الصَّفْحَةُ رَقْمُ ' + missing[0] + ' تَحْتاجُ كائِنًا وَمَقْطَعًا (العَلَمُ الأخْضَرُ مَعَ حَرَكَةٍ أو كَلامٍ أو صَوْتٍ). تَنَقَّلْ إلَيْها وَبَرْمِجْها.' };
              return { ok: true, reason: 'كُلُّ صَفْحَةٍ مِنَ الأرْبَعِ لَها كائِنُها وَمَقْطَعُها الخاصُّ.' };
            };
            const PRAC = K.practical(api, { step: 'scripts', trigger: 'START', check, noRun: true });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = test;
          },
          completionPredicate() { return this._ok(); },
        },

        /* ===== STAGE 4 — run the project ===== */
        {
          id: 'run', step: 'run',
          enter() {
            api.clearWork();
            api.say('انْتَقِلْ إلى الصَّفْحَةِ الأولى وَشَغِّلِ العَلَمَ الأخْضَرَ لِتُشاهِدَ مَشْروعَكَ يَعْمَلُ. أَحْسَنْتَ صُنْعًا!',
              'يُقْبَلُ أَيُّ مَشْروعٍ صَحيحٍ يُحَقِّقُ الهَدَفَ.');
            ensure();
            let ranOnce = false;
            const projectReady = () => {
              const pages = st.proj.project.pages;
              return pages.length >= 4 && pages.slice(0, 4).every(pg => pg.objects.some(o => o.scripts.some(s => s.length >= 2 && W.sjr.BLOCKS[s[0].type] && W.sjr.BLOCKS[s[0].type].head)));
            };
            let produced = false;
            st.onRun = (sim) => {
              ranOnce = true;
              if (sim && sim.events && sim.events.length > 0) produced = true;
              PRAC.onEdit();
            };
            const check = () => {
              if (!projectReady()) return { ok: false, fix: 'تَأَكَّدْ أَنَّ لِكُلِّ صَفْحَةٍ مِنَ الأرْبَعِ مَقْطَعًا يَعْمَلُ.' };
              if (!ranOnce) return { ok: false, fix: 'انْتَقِلْ إلى الصَّفْحَةِ الأولى وَاضْغَطْ زِرَّ التَّشْغيلِ.' };
              if (!produced) return { ok: false, fix: 'شَغِّلْ صَفْحَةً فيها مَقْطَعٌ يُنْتِجُ حَرَكَةً أو كَلامًا أو صَوْتًا.' };
              return { ok: true, reason: 'يَعْمَلُ مَشْروعُكَ! طَبَّقْتَ دَوْرَةَ حَلِّ المُشْكِلاتِ وَأَتْمَمْتَ مَشْروعَ الوَحْدَةِ.' };
            };
            /* the task of this last activity is to RUN the project the pupil
             * has already built, so no further edit is required — but the
             * independent «not the seeded scaffold» gate still applies, and the
             * run must really happen and really produce something. */
            const PRAC = K.practical(api, { step: 'run', trigger: 'START', check, allowNoEdit: true });
            st.onChange = () => { PRAC.onEdit(); };
            this._ok = () => PRAC.gated;
          },
          completionPredicate() { return this._ok(); },
        },
      ];
    },
  });
})(window.WADI);

/* ==== engine/boot.js ==== */
/* ==== engine/boot.js — startup, self-check scene, automated-test surface ==== */
(function (W) {
  const { el } = W.util;
  const CREDIT = 'إعداد وتنفيذ الأستاذة دعاء الجرواني';

  /* ---------------- unit self-check ---------------- */
  W.scene.register('selfcheck', {
    mount(ctx) {
      const root = ctx.root;
      root.appendChild(W.world.backdrop());
      const u = W.curriculum.units[0];
      const box = el('div', { class: 'scwrap' }, [
        el('div', { class: 'idx-head' }, [
          el('button', { class: 'backbtn', type: 'button', text: '⟵ الرَّئيسَة', onclick: () => ctx.go('hub') }),
          el('h1', { class: 'idx-title', text: 'قَيِّمْ نَفْسَكَ · ' + u.ar }),
        ]),
      ]);
      root.appendChild(box);
      W.selfcheck.render(box, u.id, u.outcomes);
      box.appendChild(W.ui.creditOnce());
    },
  });

  /* ---------------- boot ---------------- */
  function boot() {
    const stage = document.getElementById('stageInner');
    if (!stage) { console.error('[boot] no stage'); return; }
    W.ui.fit();
    W.settings.applyAll();

    window.addEventListener('keydown', e => {
      const typing = /input|textarea/i.test((document.activeElement || {}).tagName || '');
      if ((e.key === 't' || e.key === 'T') && !typing) W.teacher.toggle();
      if (e.key === 'Escape' && W.teacher.isOpen) W.teacher.close();
    });
    window.addEventListener('pointerdown', () => W.audio.resume(), { once: true });

    /* ---------------------------------------------------------------
     * HEADLESS TEST SURFACE
     * Assertions run on STATE and on COMPUTED ENGINE RESULTS, never on
     * pixels and never on the mere presence of a block in the DOM.
     * ------------------------------------------------------------- */
    W.test = {
      go: (id, p) => W.scene.go(id, p),
      scene: () => W.scene.currentId,
      store: W.store,
      curriculum: () => W.curriculum,
      lessonIds: () => W.lessons.ids,
      builtCount: () => W.lessons.builtCount,
      artifacts: () => W.scd.artifactCount(),
      nodeArtifacts: () => W.scd.nodeCount(),
      activeLesson: () => W.activeLesson,
      openTeacher: id => W.teacher.open(id),
      closeTeacher: () => W.teacher.close(),
      teacherOpen: () => W.teacher.isOpen,
      scale: () => W.scale,
      reset: () => W.store.reset(),

      /* --- ScratchJr engine probes --- */
      sjr: W.sjr,
      studio: () => W.activeStudio,
      machine: () => W.activeMachine,
      stage: () => (W.activeMachine ? W.activeMachine.stageId : null),
      stageIndex: () => (W.activeMachine ? W.activeMachine.index : -1),
      nextStage: () => W.activeMachine && W.activeMachine.next(),

      /* build a throwaway project to exercise the pure model */
      newProject: (c, r) => W.sjr.create({ cols: c || 12, rows: r || 8 }),

      /* simulate the CURRENT studio project under a trigger */
      simulate: (trigger, only) => {
        const s = W.activeStudio; if (!s) return null;
        return s.proj.simulate({ trigger: trigger || 'START', only });
      },
      objects: () => {
        const s = W.activeStudio; if (!s) return [];
        return s.proj.page().objects.map(o => ({
          id: o.id, kind: o.kind, x: o.x, y: o.y, size: o.size,
          visible: o.visible, heading: o.heading,
          scripts: o.scripts.map(sc => sc.map(b => ({ type: b.type, val: b.val, text: b.text }))),
        }));
      },
      pages: () => {
        const s = W.activeStudio; if (!s) return [];
        return s.proj.project.pages.map(p => ({
          id: p.id, background: p.background, objects: p.objects.length,
        }));
      },
      currentPage: () => (W.activeStudio ? W.activeStudio.proj.project.currentPage : -1),
      title: () => (W.activeStudio ? W.activeStudio.proj.project.title : null),

      version: 'wadi-g2s2-cp1',
    };

    W.scene.go(W.store.settings.seenIntro ? 'hub' : 'opening');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.WADI);

</script>
