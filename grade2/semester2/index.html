.tm-clear{margin-top:12px}
.tm-unit-head{margin:14px 0 8px;padding-right:10px;border-right:4px solid}
.tm-unit-sub{font-size:13px;color:var(--ink-2)}
.tm-lesson{margin-bottom:6px;border:2px solid #DCC9A6;border-radius:11px;background:#FCF6EA;overflow:hidden}
.tm-lesson summary{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;list-style:none}
.tm-lesson summary::-webkit-details-marker{display:none}
.tm-c{font-size:12.5px;font-weight:900;color:#fff;background:var(--copper);padding:2px 9px;border-radius:999px}
.tm-n{font-size:15px;font-weight:700;color:var(--ink);flex:1}
.tm-st{font-size:12.5px;font-weight:800;color:var(--copper-dk)}
.tm-in{padding:6px 15px 14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 13px;margin-bottom:6px;
  border-radius:10px;background:#F0E7D4;border:1.5px solid #DCC9A6;font-size:14.5px;color:var(--ink)}
.set-ar{font-size:15px;font-weight:700}
.set-en{font-size:11.5px;color:var(--ink-2);direction:ltr}
.sw{min-width:96px;padding:8px 14px;border-radius:9px;border:2px solid var(--copper-dk);background:#E3D2B4;
  font-size:13.5px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.sw.on{background:var(--leaf);border-color:#4A7F3B;color:#fff}
.tm-val{font-weight:800;color:var(--deep)}

/* ---- model reference solution (teacher-only, item 4) ---- */
/* ACCESSIBILITY FIX: 3.32:1 brown on the dark teacher surface. */
.tm-model .tm-model-note{font-size:13px;color:#E6C98A;font-style:italic;margin:2px 0 10px}
.tm-mcard{border:2px solid #D8B98E;border-radius:12px;background:#FCF6EA;padding:11px 13px;margin-bottom:12px}
.tm-mhead{font-size:16px;font-weight:800;color:var(--copper-dk,#7A4A16);margin-bottom:8px;
  padding-bottom:6px;border-bottom:1.5px dashed #D8B98E}
.tm-mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.tm-mcell{display:flex;flex-direction:column;gap:2px;padding:6px 9px;border-radius:8px;
  background:#F0E7D4;border:1px solid #DCC9A6}
/* ACCESSIBILITY FIX: 4.06:1 brown on the cream legend surface. */
.tm-mcell b{font-size:11.5px;color:#6A4A18;font-weight:800}
.tm-mcell span{font-size:14px;color:var(--ink,#2A2018);font-weight:600}
.tm-mlabel{font-size:13px;font-weight:800;color:var(--ink-2,#5A4A32);margin:8px 0 5px}
.tm-mscript{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:9px;
  background:#EFE7D6;border:1.5px solid #D8B98E;margin-bottom:6px}
/* ACCESSIBILITY FIX (found by certify.py, present in the previous package):
 * the model-answer chip printed a cream label straight onto the raw category
 * colour — 1.56:1 on yellow, 2.39:1 on orange. The category colour is kept as
 * a strong swatch and border so the chip is still identifiable at a glance,
 * but the WORD now sits on a dark surface, which clears 4.5:1 for all six. */
.tm-mblk{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:8px;
  background:#22303C;color:#FFF8EC;font-size:13px;font-weight:700;
  border:2px solid var(--bc,#888)}
.tm-mblk svg{width:20px;height:20px;display:block;padding:2px;border-radius:5px;
  background:var(--bc,#888);box-sizing:content-box}
.tm-mblk-ar{font-size:13px}
.tm-mblk-val{min-width:20px;height:18px;padding:0 4px;border-radius:5px;background:#FFF;color:#22303C;
  font-size:12.5px;font-weight:800;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.tm-mwrap{display:inline-flex;align-items:center;gap:5px;padding:4px;border-radius:9px;
  background:rgba(232,134,43,.18);border:2px solid #E8862B}
.tm-mnest{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:7px;
  background:rgba(255,255,255,.55)}
.tm-mnote{font-size:14px;color:var(--ink,#2A2018);background:#F0E7D4;border:1px dashed #D8B98E;
  border-radius:8px;padding:7px 10px;margin-bottom:6px}
.tm-mrow{font-size:14px;color:var(--ink,#2A2018);line-height:1.5;margin-top:4px}
.tm-mrow b{color:#7A4A16}
.tm-mrow.is-wrong b{color:#B4301E}
.tm-mrow.is-how b{color:#2C6A96}

/* ==== styles/world.css ==== */
/* ==== styles/world.css — مَرْسَمُ الحَرَكَة · Grade 2 identity ====
 * A DIFFERENT place from the approved Grade 1 platform: Grade 1 was an
 * outdoor valley in sand and teal; Grade 2 is an indoor animation studio in
 * indigo and lamp gold. Same family, clearly more advanced.
 */
:root{
  --g2-ink:#0E142A; --g2-deep:#1A2447; --g2-mid:#2C3A6B; --g2-line:#3B4A82;
  --g2-lamp:#F2C230; --g2-warm:#E8853A; --g2-rose:#E4586F;
  --g2-mint:#3FBF9E; --g2-cream:#FFF4E2; --g2-paper:#F7EFE0;
  --g2-ok:#4FBF7A;
}
html,body{background:var(--g2-ink)}
#stage{background:radial-gradient(120% 90% at 50% 0%,#22305C 0%,#141C39 60%,#0B1024 100%)}
/* CENTRING FIX: Grade 1 relied on left/top:50% + percentage translate with a
   centre transform-origin. Under dir="rtl" that combination resolved against
   the scaled box and pushed the surface to negative x, putting overlays
   outside the viewport. Grade 2 pins the surface to the top-left and lets
   ui.fit() supply the exact pixel offset, which is direction-independent. */
#stageInner{background:var(--g2-ink);box-shadow:0 12px 52px rgba(0,0,0,.55);
  left:0;right:auto;top:0;bottom:auto;margin:0;transform-origin:0 0}
/* The surface is a fixed 1280x760 design space. Under dir="rtl" an unset
   `right` let the box resolve from the right edge, so the scaled surface
   started at x=691 and ran past the viewport at 1920x1080. Pinning left AND
   right removes the direction dependency entirely. */

.world-bg{position:absolute;inset:0;width:100%;height:100%}


/* ---------------- opening ---------------- */
.opening{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;text-align:center;padding:20px}
.op-badge{padding:6px 18px;border-radius:999px;background:rgba(242,194,48,.14);
  border:1.5px solid rgba(242,194,48,.5);color:var(--g2-lamp);font-size:18px}
.op-title{margin:2px 0 0;font-size:66px;font-weight:700;color:var(--g2-cream);letter-spacing:.5px;
  text-shadow:0 4px 26px rgba(242,194,48,.35)}
.op-sub{font-size:34px;font-weight:500;color:var(--g2-lamp)}
.op-strip{width:min(520px,80%);opacity:.9;margin:4px 0}
.filmstrip{width:100%;height:auto;display:block}
.op-line{max-width:640px;font-size:21px;color:#CBD4F0;line-height:1.7;margin:2px 0 10px}

/* ---------------- hub ---------------- */
.hub{position:absolute;inset:0;padding:22px 26px 44px;display:flex;flex-direction:column;gap:14px}
.hub-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hub-title{margin:0;font-size:42px;font-weight:700;color:var(--g2-cream)}
.hub-sub{font-size:19px;color:#A9B4D6;margin-top:2px}
.hub-lit{display:flex;align-items:baseline;gap:8px;padding:8px 18px;border-radius:14px;
  background:rgba(242,194,48,.12);border:1.5px solid rgba(242,194,48,.4)}
.hub-litn{font-size:34px;font-weight:700;color:var(--g2-lamp)}
.hub-litl{font-size:16px;color:#D8C9A4}

.hub-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hub-tile{display:flex;flex-direction:column;gap:5px;padding:16px 18px;min-height:92px;cursor:pointer;
  border-radius:16px;text-align:right;color:var(--g2-cream);
  background:linear-gradient(180deg,#26325E,#1C2748);border:2px solid var(--g2-line);
  transition:transform .12s,border-color .12s,box-shadow .12s}
.hub-tile:hover{transform:translateY(-3px);border-color:var(--g2-lamp);
  box-shadow:0 10px 28px rgba(0,0,0,.45)}
.tile-t{font-size:25px;font-weight:700}
.tile-s{font-size:15px;color:#A9B4D6}
.hub-tile[data-tile="studio"]{background:linear-gradient(180deg,#2F5B4E,#1E3C36)}
.hub-tile[data-tile="teacher"]{background:linear-gradient(180deg,#5A3A5E,#3A2440)}
.hub-tile[data-tile="check"]{background:linear-gradient(180deg,#5A4A2A,#3A301C)}

.hub-wallhead{margin-top:2px;font-size:19px;color:var(--g2-lamp);letter-spacing:.4px}

/* ---------------- frame wall ---------------- */
.framewall{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
.frame{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 5px 7px;cursor:pointer;
  border-radius:11px;background:#18213F;border:2px solid #2B3763;color:#8E9AC4;
  transition:transform .12s,border-color .12s,background .2s}
.frame:hover{transform:translateY(-2px);border-color:var(--g2-lamp)}
.frame.is-lit{background:linear-gradient(180deg,#3A3220,#241E12);border-color:var(--g2-lamp);
  color:var(--g2-lamp);box-shadow:0 0 20px rgba(242,194,48,.22) inset}
.frame-no{font-size:13px;font-weight:700;opacity:.85}
.frame-art{width:100%;display:block}
.frame-svg{width:100%;height:auto;display:block}
.frame-ar{font-size:12px;line-height:1.25;text-align:center;color:inherit;
  overflow-wrap:break-word}

/* ---------------- lesson index ---------------- */
.idx{position:absolute;inset:0;padding:18px 26px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.idx-head{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.idx-title{margin:0;font-size:34px;font-weight:700;color:var(--g2-cream);flex:1}
.idx-count{font-size:16px;color:#A9B4D6}
.backbtn{padding:9px 18px;border-radius:11px;cursor:pointer;font-size:18px;
  background:#24305A;color:var(--g2-cream);border:2px solid var(--g2-line)}
.backbtn:hover{border-color:var(--g2-lamp)}
/* ONE bounded, focusable scroll container for the four paths. It ends above
   the author credit, never letting the credit cover the fourth path. The
   scrollbar is a clearly visible bar on the physical right (LTR box so the
   native scrollbar sits right; inner content stays RTL). */
.unitgroup{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  direction:ltr;padding:2px 10px 8px 2px;border-radius:12px;
  scrollbar-width:auto;scrollbar-color:#C89A55 #222C50;outline:none}
.unitgroup>*{direction:rtl}
.unitgroup:focus-visible{box-shadow:inset 0 0 0 2px rgba(242,194,48,.5)}
.unitgroup::-webkit-scrollbar{width:16px}
.unitgroup::-webkit-scrollbar-track{background:#222C50;border-radius:8px}
.unitgroup::-webkit-scrollbar-thumb{background:#C89A55;border-radius:8px;border:3px solid #222C50}
.unitgroup::-webkit-scrollbar-thumb:hover{background:#E0A24B}
.idx-scrollhint{flex:0 0 auto;text-align:center;font-size:14px;font-weight:700;
  color:#22190A;background:var(--g2-lamp);border-radius:999px;padding:4px 16px;
  align-self:center;margin:0;box-shadow:0 3px 12px rgba(0,0,0,.3);animation:idxhintpulse 1.8s ease-in-out infinite}
.idx-scrollhint[hidden]{display:none}
@keyframes idxhintpulse{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.idx-row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;text-align:right;
  border-radius:12px;background:#1A2340;border:2px solid #2B3763;color:var(--g2-cream);
  transition:border-color .12s,transform .1s}
.idx-row:hover{border-color:var(--g2-lamp);transform:translateX(-3px)}
.idx-row.is-soon{opacity:.55;cursor:default}
.idx-row.is-soon:hover{border-color:#2B3763;transform:none}
.idx-row.is-lit{border-color:rgba(242,194,48,.6);background:linear-gradient(90deg,#241E12,#1A2340)}
.idx-no{min-width:44px;font-size:19px;font-weight:700;color:var(--g2-lamp)}
.idx-body{flex:1;display:flex;flex-direction:column}
.idx-ar{font-size:21px;font-weight:500}
.idx-en{font-size:13px;color:#98A3CC;direction:ltr}
.idx-pages{font-size:13px;color:#8E9AC4;white-space:nowrap}
.idx-mark{font-size:18px;color:var(--g2-lamp);min-width:18px;text-align:center}

/* ---------------- lesson frame ---------------- */
/* FIELD FIX (defect 6) — NOTHING IS CUT OFF ANY MORE.
 * The lesson surface used to clip whatever did not fit, so a theory panel
 * taller than the screen lost its question, its answers and its buttons behind
 * a black area. The lesson scene now scrolls vertically instead of clipping. */
.scene-lesson,.scene-app{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:8px 14px 6px;gap:6px;background:var(--g2-ink);
  overflow:hidden}
.lesbar,.appbar{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.lesbar-mid{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.lesbar-no{font-size:15px;color:var(--g2-lamp);font-weight:700}
.lesbar-ar{font-size:23px;color:var(--g2-cream);font-weight:500}
.lesbar-right{margin-inline-start:auto;display:flex;gap:8px}
.appbar-t{font-size:23px;color:var(--g2-cream);font-weight:500}
.minibtn{padding:8px 15px;border-radius:10px;cursor:pointer;font-size:16px;
  background:#24305A;color:var(--g2-cream);border:2px solid var(--g2-line)}
.minibtn:hover{border-color:var(--g2-lamp)}

/* step rail */
.steprail{display:flex;gap:6px;align-items:center;margin-inline-start:14px}
/* FIELD FIX (defect 5): the rail is navigation, not decoration */
.steprail>.railstep{width:34px;height:16px;border-radius:8px;background:#2B3763;
  border:2px solid #3B4A82;cursor:pointer;padding:0;transition:background .2s,transform .12s}
.steprail>.railstep:hover{transform:translateY(-2px)}
.steprail>.railstep:focus-visible{outline:3px solid var(--g2-lamp);outline-offset:2px}
.steprail>.railstep.past{background:rgba(242,194,48,.55);border-color:rgba(242,194,48,.8)}
.steprail>.railstep.todo{background:#232E56;border-style:dashed}
.steprail>.railstep.live{background:var(--g2-lamp);border-color:#FFF3D0;
  box-shadow:0 0 10px rgba(242,194,48,.7)}
/* compact navigation beside the rail — costs no vertical space */
.stagenav{display:flex;align-items:center;gap:6px;margin-inline-start:10px}
.stagenav-btn{width:44px;height:44px;border-radius:10px;cursor:pointer;
  font-size:20px;font-weight:800;font-family:inherit;
  background:#2A3765;color:var(--g2-cream);border:2px solid #3B4A82}
.stagenav-btn:hover{filter:brightness(1.2)}
.stagenav-btn:disabled{opacity:.35;cursor:not-allowed}
.stagenav-btn:focus-visible{outline:3px solid var(--g2-lamp);outline-offset:2px}
.stagenav-note{flex:0 0 auto;font-size:14px;line-height:1.35;color:#FFD98A;
  padding:2px 10px;border-radius:8px;background:rgba(242,194,48,.10);
  border:1px solid rgba(242,194,48,.32);margin-top:2px}
.stagenav-note[hidden]{display:none}


.work{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}
/* the panel itself scrolls, so the pupil always reaches the drawing, the
   question, every answer and the buttons below it */
.apphost{flex:1 1 auto;min-height:0;display:flex}

/* explanation collapse control (item 6) — compact bar directly above the app */
.explain-toggle{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:4px 10px;border-radius:10px;background:#1A2445;border:1.5px solid #2B3763}
.explain-btn{flex:0 0 auto;padding:6px 16px;border-radius:9px;cursor:pointer;
  font-size:15px;font-weight:700;font-family:inherit;
  background:#2A3765;color:var(--g2-cream);border:2px solid var(--g2-lamp)}
.explain-btn:hover{filter:brightness(1.12)}
.explain-btn:focus-visible{outline:3px solid var(--g2-lamp);outline-offset:2px}
.explain-summary{flex:1 1 auto;min-width:0;font-size:14px;color:#B8C2E4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* when collapsed: the theory concept panels fold away and the app expands so
   the full Script Area is visible at 1366×768 without whole-page scrolling.
   The application is NOT unmounted; the pupil's project is untouched. */
.work.is-explain-collapsed .p-concept,
.work.is-explain-collapsed .p-flow,
.work.is-explain-collapsed .concept-fig{display:none !important}
.work.is-explain-collapsed .apphost{flex:1 1 auto}
/* a stage that does not use the simulator parks it: the pupil's project is
   NOT destroyed, the host is only hidden, so the explanation gets the height */
.work.is-theory-only .apphost{display:none}
.work.is-theory-only .explain-toggle{display:none}
/* the application always keeps enough height for a usable Script Area */
.apphost .sj-app{min-height:0}
.panel{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px;border-radius:14px;
  background:#151D38;border:2px solid #2B3763;color:var(--g2-cream)}
.p-h{margin:2px 0 8px;font-size:23px;color:var(--g2-lamp);font-weight:700}
.p-sub{margin:10px 0 6px;font-size:18px;color:#B8C2E4}

/* ---------------- finish card ---------------- */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.finish-frame{width:150px;padding:12px;border-radius:14px;background:#241E12;border:2px solid var(--g2-lamp)}
.finish-t{margin:6px 0 0;font-size:31px;color:var(--g2-cream)}
.finish-s{margin:0;font-size:19px;color:#A9B4D6;max-width:560px}
.finish-btns{display:flex;gap:12px;align-items:center;margin-top:8px}

/* ---------------- lesson 1.1 widgets ---------------- */
.termrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.term{padding:10px 14px;border-radius:11px;background:#1D2748;border:1.5px solid var(--g2-line)}
.term-ar{font-size:21px;font-weight:700;color:var(--g2-lamp)}
.term-en{font-size:13px;color:#98A3CC;direction:ltr}
.term-d{font-size:16px;color:#C6CEE8;margin-top:4px;line-height:1.5}

.bike-slots{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bike-slot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
  background:#202C52;border:2px solid var(--g2-line);font-size:19px}
.bike-slot.is-empty{opacity:.5;border-style:dashed}
.bike-pool{display:flex;flex-wrap:wrap;gap:8px}
.bike-chip{padding:11px 16px;border-radius:10px;cursor:pointer;font-size:19px;
  background:#2C3A6B;color:var(--g2-cream);border:2px solid #46579A}
.bike-chip:hover{border-color:var(--g2-lamp)}

/* ---- ordering widget (drag / click / keyboard into numbered slots) ---- */
.bike-order{margin-bottom:8px}
.ord-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ord-slot{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;
  padding:8px 12px 8px 46px;border-radius:12px;background:#141C38;border:2px dashed var(--g2-line);
  transition:box-shadow .12s,border-color .12s,background .12s}
.ord-slot.is-full{border-style:solid;background:#1E2A50}
.ord-slot.is-drophot{border-color:var(--g2-lamp);box-shadow:inset 0 0 0 3px rgba(244,196,48,.5);background:#25325C}
.ord-slot.is-right{border-color:#4FBF7A;box-shadow:inset 0 0 0 3px rgba(79,191,122,.55)}
.ord-slot.is-wrong{border-color:#E0655A;box-shadow:inset 0 0 0 3px rgba(224,101,90,.55)}
.ord-num{position:absolute;right:auto;left:12px;top:50%;transform:translateY(-50%);
  min-width:26px;height:26px;border-radius:50%;background:var(--g2-lamp);color:#2A1E00;
  font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ord-hint{color:#7C87B0;font-size:17px}
.ord-filled,.ord-card{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;
  cursor:pointer;font-size:18px;background:#2C3A6B;color:var(--g2-cream);border:2px solid #46579A;
  font-family:inherit;text-align:right}
.ord-filled{width:100%;justify-content:flex-start;background:#33447E}
.ord-card:hover,.ord-filled:hover{border-color:var(--g2-lamp)}
.ord-card:focus-visible,.ord-filled:focus-visible{outline:3px solid var(--g2-lamp);outline-offset:2px}
.ord-ic{width:24px;height:24px;color:var(--g2-cream);flex:0 0 auto}
.ord-txt{flex:1}
.ord-x{margin-inline-start:auto;width:22px;height:22px;border-radius:6px;background:#3E2030;

.lab-plan{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:9px;margin-bottom:10px}

/* ---------------- Teacher Mode panel (Grade 2) ----------------
 * Rendered as class .teacher by engine/teacher.js. It MUST sit above the
 * scene and own its pointer events, otherwise the scene behind it intercepts
 * clicks and every tab becomes unusable — a real defect found by the suite. */
.teacher{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:rgba(8,12,26,.93);color:var(--g2-cream);padding:14px 18px 34px;overflow:hidden}
.tm-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;border-radius:11px;background:#1C2748;border:2px solid var(--g2-line)}

.tm-close{width:34px;height:34px;border-radius:9px;cursor:pointer;background:#2C3A6B;
  color:var(--g2-cream);border:2px solid var(--g2-line);font-size:19px;line-height:1}
.tm-close:hover{border-color:var(--g2-lamp)}
.tm-body{flex:1 1 auto;min-height:0;overflow-y:auto;margin-top:10px;padding-inline-end:6px}
.tm-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tm-tab{min-width:48px;padding:6px 11px;border-radius:9px;cursor:pointer;font-size:15px;
  background:#22305C;color:#C6CEE8;border:2px solid #35447A}
.tm-tab:hover{border-color:var(--g2-lamp)}
.tm-tab.is-on{background:var(--g2-lamp);color:#2A1E00;border-color:var(--g2-lamp);font-weight:700}
.tm-head{margin-bottom:12px}
.tm-title{margin:0 0 6px;font-size:29px;color:var(--g2-cream)}
.tm-meta{display:flex;flex-wrap:wrap;gap:6px}
.tm-chip{padding:4px 11px;border-radius:999px;font-size:13px;background:#22305C;
  color:#C6CEE8;border:1px solid #35447A}
.tm-chip.is-ok{background:rgba(79,191,122,.2);color:#8FE0AC;border-color:#3E8B5A}
.tm-chip.is-soon{background:rgba(232,133,58,.16);color:#F0B860;border-color:#8A5A2A}

.tm-block .sj-glyph{width:20px;height:20px}
.tm-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}

/* ================================================================
 * THE ONE INSTRUCTION COMPONENT — single authoritative definition.
 * Normal flow inside the design surface; RTL; right-aligned; padded on
 * BOTH sides; border-box; never translated outside the surface; no
 * line-clamp and no ellipsis; wraps naturally up to three readable lines
 * and only then scrolls internally. Identical safe region in every lesson.
 * ============================================================== */
.instr{
  flex:0 0 auto;
  position:static;
  transform:none;
  inset:auto;
  width:100%;
  max-width:100%;
  margin:0 0 8px 0;
  padding:9px 22px;
  box-sizing:border-box;
  direction:rtl;
  text-align:right;
  border-radius:12px;
  background:#1D2748;
  border:2px solid var(--g2-line);
  overflow:hidden;
}
.instr-ar{
  font-size:clamp(17px,1.55vw,21px);
  font-weight:500;
  line-height:1.45;
  color:var(--g2-cream);
  direction:rtl;
  text-align:right;
  overflow-wrap:break-word;
  word-break:normal;
  white-space:normal;
  max-height:calc(1.45em * 3);
  overflow-y:auto;
}
.instr-fb{
  font-size:14px;
  line-height:1.35;
  color:#A9B4D6;
  min-height:17px;
  margin-top:2px;
  direction:rtl;
  text-align:right;
  overflow-wrap:break-word;
  white-space:normal;
}
.instr-fb.is-good{color:#8BE0A6;font-weight:700}
.instr-fb.is-hint{color:#F3C46A;font-weight:700}
.instr-en{display:none}

/* ================================================================
 * THE ONE AUTHOR CREDIT — normal flow, exactly once per screen,
 * never fixed, never absolute, never inside the ScratchJr application.
 * ============================================================== */
.credit-once{
  flex:0 0 auto;
  margin:4px auto 0;
  padding:1px 10px;
  line-height:1.25;
  text-align:center;
  font-size:13px;
  color:#8F9AC2;
  pointer-events:none;
  direction:rtl;
}
.sj-app .credit-once{display:none}

/* short viewports: keep the instruction readable, never clipped */
@media (max-height:700px){
  .instr{padding:7px 18px;margin-bottom:6px}
  .instr-ar{font-size:clamp(15px,1.4vw,18px);max-height:calc(1.4em * 3)}
  .credit-once{font-size:12px;margin:5px auto 1px}
}

/* ================= success gate (5-second hold + Next) ================= */
.okpanel[hidden]{display:none !important}
.okpanel{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 18px;
  border-radius:14px;background:#123524;border:3px solid #2E9E5B;box-shadow:0 6px 22px rgba(0,0,0,.35)}

/* ================================================================
 * TEACHER MODE — ONE authoritative dark surface.
 * The old teacher.css was authored for a LIGHT theme, so its
 * var(--ink) text rendered near-black on this dark panel. Every
 * colour below is fixed and opaque; nothing inherits --ink here.

.teacher{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:#0B1226;color:#F5F7FF;overflow:hidden}
.tm-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 20px;background:#0A1330;border-bottom:2px solid #2B3763}
.tm-brand{font-size:20px;font-weight:700;color:#FFD33D}
.tm-close{width:48px;height:48px;border-radius:10px;cursor:pointer;font-size:24px;line-height:1;
  background:#1B2547;color:#F5F7FF;border:2px solid #3B4A82;font-family:inherit}
.tm-close:hover{border-color:#FFD33D}
.tm-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 20px 24px;
  background:#111A38;color:#F5F7FF}

/* 2. unit heading — always visible while switching lessons */
.tm-unit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:9px 14px;border-radius:12px;background:#16224A;border:2px solid #FFD33D;margin-bottom:10px}
.tm-unit-k{font-size:13px;font-weight:700;color:#FFD33D}
.tm-unit-t{font-size:20px;font-weight:700;color:#F5F7FF}
.tm-unit-n{font-size:13px;color:#C4CEE9;margin-inline-start:auto}

/* 3. lesson navigation — its OWN row, scrolls horizontally, never overlaps */
.tm-navrow{position:relative;z-index:1;margin-bottom:12px;padding-bottom:4px;
  border-bottom:1px solid #2B3763}
.tm-tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.tm-tabs .tm-tab{flex:0 0 auto;min-width:56px;min-height:44px;padding:9px 12px;border-radius:10px;
  background:#1B2547;color:#D6DDF5;border:2px solid #3B4A82;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit}
.tm-tabs .tm-tab:hover{border-color:#FFD33D;color:#F5F7FF}
.tm-tabs .tm-tab.is-on{background:#FFD33D;color:#2A1E00;border-color:#FFD33D}
.tm-tabs .tm-tab:focus-visible{outline:3px solid #9DDBFF;outline-offset:2px}

/* 4. selected lesson */
.tm-head{position:relative;z-index:0;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tm-title{font-size:24px;font-weight:700;color:#F5F7FF;line-height:1.35;margin:0}
.tm-meta{display:flex;gap:7px;flex-wrap:wrap}
.tm-chip{padding:4px 11px;border-radius:8px;background:#1B2547;border:1.5px solid #3B4A82;
  font-size:13px;color:#D6DDF5}
.tm-chip.is-ok{border-color:#3FBF7A;color:#B6F0CB}
.tm-chip.is-soon{border-color:#E0A25A;color:#F3D6A8}

/* 5. content sections */
.tm-sect{margin-bottom:14px}
.tm-h{font-size:17px;font-weight:700;color:#FFD33D;margin:0 0 6px}
.tm-ul{margin:0;padding-inline-start:22px;list-style:disc}
.tm-ul li{font-size:16px;line-height:1.7;color:#F5F7FF;margin-bottom:4px}
.tm-p{font-size:16px;line-height:1.7;color:#F5F7FF;margin:0}
.tm-terms{display:flex;flex-wrap:wrap;gap:7px}
.tm-term{display:inline-flex;flex-direction:column;padding:6px 12px;border-radius:9px;
  background:#1B2547;border:1.5px solid #3B4A82}
.tm-term b{font-size:16px;font-weight:700;color:#F5F7FF}
.tm-term i{font-style:normal;font-size:12.5px;color:#C4CEE9;direction:ltr;opacity:1}
.tm-blocks{display:flex;flex-wrap:wrap;gap:7px}
 /* the block chip keeps its CATEGORY COLOUR as a strong border and swatch,
   * but the label always sits on the dark surface so contrast is guaranteed
   * (cream on yellow was only 1.56:1). */
.tm-block{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:9px;
  background:#1B2547;color:#F5F7FF;font-size:14px;border:2px solid var(--bc,#3B4A82)}
.tm-block svg{width:22px;height:22px;flex:0 0 auto;padding:2px;border-radius:6px;
  background:var(--bc,#3B4A82);box-sizing:content-box}
.tm-refs{display:flex;flex-wrap:wrap;gap:8px}
.tm-ref{padding:5px 12px;border-radius:8px;background:#12294A;border:1.5px solid #2E6E96;
  font-size:15px;color:#9DDBFF}
.tm-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.tm-actions .minibtn{min-height:48px}
/* nothing inside Teacher Mode may inherit the light theme's dark ink */
.teacher .tm-body *{opacity:1}


/* ================================================================
 * ACTIVITY LAYOUT STANDARD  (robot route, and every visual-choice
 * stage that opts in with .p-act)
 *
 *   TOP     compact goal strip
 *   MIDDLE  large primary visual on the PHYSICAL LEFT  (56–60%)
 *           guidance / legend / required list on the RIGHT (40–44%)
 *   BOTTOM  full-width answers: numbered slots, then the command
 *           bank, then Run / Verify / Reset, then feedback
 *
 * The document is RTL, so the middle band is laid out with an
 * explicit LTR grid and each child restores its own RTL text flow.
 * ============================================================== */
.p-route,.p-act{display:flex;flex-direction:column;min-height:0;gap:8px;overflow:hidden}

.goalbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:5px 14px;border-radius:11px;
  background:#1D2748;border:2px solid var(--g2-lamp);margin:0}
.goalflower{width:26px;height:26px;flex:0 0 auto}
.goaltext{font-size:17px;font-weight:700;color:var(--g2-lamp)}

.actmid{flex:1 1 auto;min-height:210px;display:grid;grid-template-columns:58% 1fr;gap:14px;
  direction:ltr;align-items:stretch}
.actvis{grid-column:1;direction:rtl;min-width:0;min-height:0;display:flex;
  align-items:stretch;justify-content:center}
.actside{grid-column:2;direction:rtl;min-width:0;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.actside::-webkit-scrollbar{width:9px}
.actside::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:6px}

/* the primary visual fills its column and stays square for a 4x4 grid */
.actvis .gridboard{position:relative;width:auto;height:100%;aspect-ratio:1/1;
  max-width:100%;padding-top:0;margin:0 auto;
  border-radius:12px;background:#22305C;border:3px solid var(--g2-line);overflow:hidden}

.actbottom{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
/* four numbered slots side by side keeps the answers next to the question */
.actbottom .prog-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.actbottom .prog-slots .ord-slot{min-height:60px;padding:6px 8px 6px 40px}
.actbottom .ord-banklabel{margin:1px 0 2px;font-size:12px}
.actbottom .ord-bank{gap:7px}
.actbottom .ord-card{min-height:58px}
.actbottom .route-btns{margin-top:2px}

/* guidance column: compact but readable */
.actside .p-sub{margin:2px 0 3px;font-size:14px}
.actside .dirlegend{grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.actside .diritem{padding:4px 7px;font-size:13px}
.actside .reqlist{gap:2px;margin-bottom:5px;padding-inline-start:18px}
.actside .reqitem{font-size:13.5px}
.actside .p-note{padding:6px 9px;font-size:13px;line-height:1.4;margin:0}

@media (max-height:720px){
  .actmid{grid-template-columns:55% 1fr;gap:10px}
  .actbottom .prog-slots .ord-slot{min-height:52px}
  .actbottom .ord-card{min-height:50px}
  .goaltext{font-size:15px}
}
/* 1366x640: ONE compact internal scroll for the lower command bank only */
@media (max-height:660px){
  .actbottom .ord-bank{max-height:104px;overflow-y:auto;scrollbar-width:thin;
    padding-inline-end:4px}
  .actbottom .ord-bank::-webkit-scrollbar{width:9px}
  .actbottom .ord-bank::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:6px}
  .actbottom .prog-slots .ord-slot{min-height:48px}
  .actside .diritem{font-size:12px;padding:3px 6px}
  .actside .reqitem{font-size:12.5px}
}
@media (max-width:1100px){
  .actmid{grid-template-columns:1fr;gap:8px}
  .actvis{max-height:300px}
  .actside{max-height:200px}
}
/* on the robot stage the instruction is short: cap it at two lines so the
   primary visual gets the height it needs */
[data-stage="route"] .instr-ar{max-height:calc(1.45em * 2)}

/* --- give the primary visual the height it needs -----------------------
 * The command bank becomes a SINGLE horizontal row (it scrolls sideways
 * only if a card would be pushed out), the slots and buttons are tightened,
 * and the goal strip is slim. Everything in the bottom band stays visible;
 * the reclaimed height goes to the robot board. */
.actbottom .ord-bank{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  padding-bottom:3px;scrollbar-width:thin}
.actbottom .ord-bank::-webkit-scrollbar{height:8px}
.actbottom .ord-bank::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:5px}
.actbottom .ord-bank .ord-card{flex:0 0 auto;min-height:56px;padding:6px 10px;font-size:14px}
.actbottom .ord-bank .ord-txt{white-space:nowrap}
.actbottom .prog-slots .ord-slot{min-height:56px}
.actbottom .route-btns{gap:8px}
.actbottom .runbtn,.actbottom .verifybtn,.actbottom .minibtn{min-height:48px;padding:10px 20px}
.goalbar{padding:4px 12px}
.goaltext{font-size:16px}
.goalflower{width:23px;height:23px}
[data-stage="route"] .instr{padding:6px 20px}

/* ================= four visual learning paths (one official unit) ======= */
.idx-list{display:flex;flex-direction:column;gap:12px}
.pathband{position:relative;border-radius:14px;padding:10px 12px 12px;
  background:#141C38;border:2px solid var(--g2-line);border-inline-start:6px solid var(--acc)}
.pathband::before{content:'';position:absolute;inset-inline-start:-6px;top:100%;width:6px;height:12px;
  background:linear-gradient(180deg,var(--acc),transparent)}
.pathband:last-child::before{display:none}
.pathhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pathico-w{width:30px;height:30px;flex:0 0 auto}
.pathico{width:100%;height:100%;display:block}
.pathname{font-size:19px;font-weight:700;color:var(--acc)}
.pathcount{margin-inline-start:auto;font-size:13px;color:#9DA8C8}
.pathrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:8px}
.pathrow .idx-row{min-height:58px;border-color:var(--acc)}
.pathrow .idx-row.is-final{border-width:3px;background:#1E2A50}
.pathrow .idx-row.is-final .idx-ar{color:var(--acc)}
.pathrow .idx-row.is-final::after{content:'المَشْروع';position:absolute;top:-9px;inset-inline-end:10px;
  padding:1px 8px;border-radius:7px;background:var(--acc);color:#22190A;font-size:11px;font-weight:800}
.idx-row{position:relative}
.idx-row.is-soon{opacity:1}
.idx-row.is-soon .idx-mark{opacity:.6}

/* ---- final robot sizing: reclaim padding so the board hits 340–360 @768 -- */
.p-route{gap:5px}
.p-route .goalbar{padding:3px 12px}
.p-route .goaltext{font-size:15px}
.p-route .goalflower{width:21px;height:21px}
.actmid{gap:10px}
.actbottom{gap:3px}
.actbottom .prog-slots{gap:6px}
.actbottom .prog-slots .ord-slot{min-height:52px;padding:5px 8px 5px 38px}
.actbottom .ord-banklabel{margin:0 0 1px;font-size:11.5px}
.actbottom .ord-bank{flex-wrap:wrap;overflow-x:visible;gap:6px}
.actbottom .ord-bank .ord-card{min-height:50px;padding:5px 9px;font-size:13.5px}
.actbottom .route-btns{margin-top:1px;gap:7px}
.actbottom .runbtn,.actbottom .verifybtn,.actbottom .minibtn{min-height:48px;padding:9px 18px;font-size:16px}
[data-stage="route"] .instr{padding:5px 18px;margin-bottom:4px}
[data-stage="route"] .instr-ar{font-size:clamp(15px,1.35vw,18px);max-height:calc(1.4em * 2)}
[data-stage="route"] .instr-fb{font-size:13px;min-height:15px}
[data-stage="route"] .credit-once{margin:2px auto 0;font-size:12px}
.actside .p-sub{font-size:13px;margin:1px 0 2px}
.actside .dirlegend{gap:4px;margin-bottom:4px}
.actside .diritem{padding:3px 6px;font-size:12.5px}
.actside .dirico{width:17px;height:17px}
.actside .reqitem{font-size:12.5px}
.actside .p-note{padding:5px 8px;font-size:12.5px;line-height:1.35}
@media (min-height:1000px){
  .actmid{grid-template-columns:56% 1fr}
  .p-route .goaltext{font-size:18px}
  .actside .diritem,.actside .reqitem{font-size:14px}
}
/* keep the board in its intended band on very tall viewports */
/* On tall viewports the board is sized by WIDTH (aspect-ratio then sets the
   height); height:100% on a stretched flex item ignores max-height. */
@media (min-height:1000px){
  .actvis{align-items:center}
  .actvis .gridboard{height:auto !important;width:min(100%,450px) !important;max-width:450px !important}
}

/* ================================================================
 * THEORETICAL STAGE — one shared layout + one typography scale.
 * TOP instruction (lessonrun) · MIDDLE illustration LEFT + explanation
 * RIGHT · BOTTOM answers. The middle band is an explicit LTR grid so the
 * illustration lands on the PHYSICAL left in this RTL document.
 * ============================================================== */
.p-theory{display:flex;flex-direction:column;min-height:0;gap:8px;overflow:hidden}
.thmid{flex:0 0 auto;min-height:150px;display:grid;grid-template-columns:56% 1fr;gap:14px;
  direction:ltr;align-items:start}
.thvis{grid-column:1;direction:rtl;min-width:0;min-height:0;display:flex;
  align-items:center;justify-content:center}
.thside{grid-column:2;direction:rtl;min-width:0;max-height:100%;overflow-y:auto;
  display:flex;flex-direction:column;gap:7px;scrollbar-width:thin;padding-inline-end:3px}
.thside::-webkit-scrollbar{width:9px}
.thside::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:6px}
.thfig{margin:0;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px}
/* the scene keeps its 5:2 aspect so it can never collapse when the bottom
   band is tall; the guidance column scrolls instead of the picture shrinking */
.edu-svg{width:100%;height:auto;aspect-ratio:5/2;min-height:132px;display:block;
  background:#141C38;border:2px solid var(--g2-line);border-radius:14px}
.thcap{font-size:17px;color:#C4CEE9;text-align:center}
.thbottom{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;
  overflow-y:auto;scrollbar-width:thin;padding-inline-end:3px}
.thbottom::-webkit-scrollbar{width:9px}
.thbottom::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:6px}

/* ---- typography scale for theoretical stages ---- */
.p-theory .th-h{font-size:clamp(22px,2.1vw,30px);font-weight:700;color:var(--g2-lamp);
  margin:0 0 2px;line-height:1.3}
.p-theory .th-point{display:flex;align-items:flex-start;gap:9px;padding:7px 11px;border-radius:11px;
  background:#1D2748;border:1.5px solid var(--g2-line)}
.p-theory .th-n{flex:0 0 auto;min-width:28px;height:28px;border-radius:50%;background:var(--g2-lamp);
  color:#2A1E00;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.p-theory .th-t{font-size:clamp(18px,1.55vw,23px);line-height:1.5;color:#F5F7FF}
.p-theory .th-term{padding:7px 12px;border-radius:11px;background:#16224A;border:1.5px solid var(--g2-line)}
.p-theory .th-term-ar{font-size:clamp(20px,1.75vw,26px);font-weight:700;color:var(--g2-lamp);line-height:1.3}
.p-theory .th-term-en{font-size:clamp(15px,1.25vw,19px);color:#C4CEE9;direction:ltr;text-align:right}
.p-theory .th-term-d{font-size:clamp(17px,1.45vw,22px);line-height:1.5;color:#F5F7FF;margin-top:3px}
.p-theory .th-note{font-size:clamp(17px,1.45vw,22px);line-height:1.55;color:#F5F7FF;margin:0;
  padding:8px 12px;border-radius:11px;background:#141C38;border:1.5px solid var(--g2-line)}
/* answers stay large and close to the question */
.p-theory .ord-card,.p-theory .ord-filled,.p-theory .choice-opt,
.p-theory .match-item,.p-theory .lab-chip{min-height:58px;font-size:clamp(17px,1.4vw,21px)}
.p-theory .ord-slot{min-height:58px}
.p-theory .verifybtn,.p-theory .runbtn,.p-theory .minibtn,.p-theory .nextbtn{
  min-height:48px;font-size:clamp(18px,1.5vw,23px)}
.p-theory .ord-banklabel,.p-theory .p-sub{font-size:clamp(15px,1.25vw,19px);color:var(--g2-lamp)}

/* the lesson instruction itself, on every stage */
.instr-ar{font-size:clamp(19px,1.85vw,27px);line-height:1.45}
.instr-fb{font-size:clamp(15px,1.3vw,19px)}

@media (max-height:720px){
  .thmid{grid-template-columns:54% 1fr;gap:10px}
  .p-theory .ord-card,.p-theory .ord-filled,.p-theory .choice-opt,
  .p-theory .match-item,.p-theory .lab-chip,.p-theory .ord-slot{min-height:52px}
  .thcap{font-size:15px}
}
@media (max-width:1100px){
  .thmid{grid-template-columns:1fr;gap:8px}
  .thvis{max-height:260px}
  .thside{max-height:180px}
}

/* concept strip above a practical simulation: explains the idea visually
   without touching the simulation itself */
.p-concept{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:7px 12px;
  border-radius:12px;background:#141C38;border:2px solid var(--g2-line);margin-bottom:6px;
  direction:rtl;overflow:hidden}
.concept-fig{margin:0;flex:0 0 clamp(200px,26%,330px);display:block}
.concept-fig .edu-svg{border-width:0;background:transparent;max-height:104px}
.concept-txt{flex:1 1 auto;min-width:0}
.concept-h{font-size:clamp(19px,1.6vw,24px);font-weight:700;color:var(--g2-lamp);line-height:1.3}
.concept-p{font-size:clamp(16px,1.35vw,21px);line-height:1.5;color:#F5F7FF;margin-top:2px}
@media (max-height:700px){
  .p-concept{padding:5px 10px;gap:9px}
  .concept-fig .edu-svg{max-height:80px}
  .concept-h{font-size:17px}.concept-p{font-size:15px}
}

/* ================= THE one bottom action area per stage ================= */
.stage-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.stage-actions .okpanel{margin-top:0}
.stage-actions .okpanel[hidden]{display:none !important}

/* theory stages: child-readable type scale */
.p-theory .instr-ar,[data-stage] .instr-ar{font-size:clamp(21px,1.9vw,27px)}
.th-title{font-size:clamp(24px,2.2vw,32px);font-weight:700;color:var(--g2-lamp);line-height:1.3}
.th-points li,.th-point{font-size:clamp(18px,1.6vw,23px);line-height:1.6;color:var(--g2-cream)}
.choice-opt,.ord-card,.ord-filled,.match-item{font-size:clamp(17px,1.5vw,22px)}
.verifybtn,.runbtn,.nextbtn,.minibtn{font-size:clamp(18px,1.6vw,23px)}
.term-en,.idx-en,.sj-caten{font-size:clamp(14px,1.2vw,18px)}

/* educational SVGs are never cropped */
.edu-svg,.th-art svg{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
.th-art{overflow:visible;padding:6px}

/* --- route stage: give the board back the height the new action area took --- */
[data-stage="route"] .instr{padding:4px 16px;margin-bottom:3px}
[data-stage="route"] .instr-ar{font-size:clamp(15px,1.3vw,18px);max-height:calc(1.35em * 2)}
[data-stage="route"] .instr-fb{font-size:12.5px;min-height:14px}
[data-stage="route"] .p-route{gap:4px}
[data-stage="route"] .goalbar{padding:2px 10px}
[data-stage="route"] .goaltext{font-size:14px}
[data-stage="route"] .goalflower{width:19px;height:19px}
[data-stage="route"] .actbottom{gap:2px}
[data-stage="route"] .actbottom .prog-slots{gap:5px}
[data-stage="route"] .actbottom .prog-slots .ord-slot{min-height:48px;padding:4px 7px 4px 34px}
[data-stage="route"] .actbottom .ord-banklabel{margin:0;font-size:11px;line-height:1.2}
[data-stage="route"] .actbottom .ord-bank .ord-card{min-height:46px;padding:4px 8px;font-size:13px}
[data-stage="route"] .actbottom .route-btns{margin-top:0}
[data-stage="route"] .actbottom .runbtn,[data-stage="route"] .actbottom .verifybtn,
[data-stage="route"] .actbottom .minibtn{min-height:48px;padding:8px 16px;font-size:15px}
[data-stage="route"] .credit-once{margin:1px auto 0;font-size:11px;line-height:1.15}

/* ================= REDESIGNED educational illustrations =================
 * The primary teaching picture is a first-class element: large, on the
 * physical LEFT, never a thumbnail and never cropped. The explanation sits
 * on the physical RIGHT and the answers go directly beneath both.
 * ====================================================================== */
.thmid{display:grid;grid-template-columns:56% 1fr;gap:14px;direction:ltr;align-items:start}
.thvis{grid-column:1;direction:rtl;min-width:0}
.thside{grid-column:2;direction:rtl;min-width:0;display:flex;flex-direction:column;gap:5px}
.thfig{margin:0;padding:6px;background:#111A34;border:2px solid var(--g2-line);
  border-radius:14px;overflow:visible}
.thfig>svg,.edu-svg{width:100%;height:auto;display:block;overflow:visible;
  min-height:280px;max-height:400px}
.thcap{margin-top:5px;text-align:center;font-size:15px;color:#C6CEE8}
.concept-fig{margin:0 0 8px;padding:6px;background:#111A34;border:2px solid var(--g2-line);
  border-radius:14px;overflow:visible}
.concept-fig>svg{width:100%;height:auto;display:block;overflow:visible;
  min-height:250px;max-height:360px}
.p-concept{flex:0 0 auto;overflow:visible}

figure[data-thart],.concept-fig,.thfig{position:relative}

/* ==== styles/app.css ==== */
/* ==== styles/app.css — the ScratchJr application ====
 *
 * PHYSICAL LAYOUT CONTRACT (Student Book p.16 interface plate):
 *   toolbar across the top
 *   Objects column on the physical LEFT · Stage centre · Pages on the RIGHT
 *   category strip + horizontal blocks palette
 *   actor chip + horizontal script area
 *
 * The application is structurally LTR (the .sj-app carries dir="ltr") so the
 * pupil meets the same physical arrangement as the real product. Arabic text
 * inside labels still renders RTL because the text itself is Arabic.
 *
 * Nothing is drawn on top of the application: the lesson instruction strip and
 * the author credit occupy their own reserved bands outside it.
 */
.sj-app{
  --sjh:54;--sjhbase:54;
  flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px;
  padding:8px;border-radius:14px;background:#EDE4D4;border:3px solid #6B5A44;
  box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden;
  font-family:var(--font-body);
}

/* ---------------- toolbar ---------------- */
.sj-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:5px 8px;border-radius:10px;background:#FBF5E9;border:2px solid #C9B896}
.sj-tb-left,.sj-tb-right{display:flex;align-items:center;gap:6px}
.sj-tb-mid{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.sj-projtitle{font-size:16px;color:#5A4A32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sj-tb{width:48px;height:48px;border-radius:9px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;background:#FFF;border:2px solid #C9B896;color:#5A4A32;flex:0 0 auto}
.sj-tb:hover{border-color:#E8853A;color:#B4541E}
.sj-tbi{width:22px;height:22px;display:block}
.sj-flag{width:56px;height:48px;border-radius:9px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;background:#E8F6EA;border:2px solid #4FBF7A;flex:0 0 auto}
.sj-flag:hover{background:#CFEFD8}
.sj-flag .sj-glyph{width:26px;height:26px;color:#2E8B52}
.sj-stop{width:48px;height:48px;border-radius:9px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;background:#FBE6E2;border:2px solid #D0443A;flex:0 0 auto}
.sj-stopsq{width:14px;height:14px;border-radius:3px;background:#D0443A;display:block}

/* ---------------- middle row: objects | stage | pages ---------------- */
.sj-mid{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.sj-objcol,.sj-pagecol{flex:0 0 96px;min-height:0;display:flex;flex-direction:column;gap:4px;
  padding:5px;border-radius:10px;background:#FBF5E9;border:2px solid #C9B896}
.sj-colhead{flex:0 0 auto;font-size:12px;color:#8A7358;text-align:center}
.sj-objlist,.sj-pagelist{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:4px}
.sj-add{flex:0 0 auto;height:32px;border-radius:8px;cursor:pointer;font-size:21px;line-height:1;
  background:#E8F0FA;border:2px dashed #7FA8C0;color:#2C6A96}
.sj-add:hover{background:#D2E4F4;border-style:solid}

.sj-objitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 2px;border-radius:8px;cursor:pointer;background:#FFF;border:2px solid #DCCBAA;flex:0 0 auto}
.sj-objitem:hover{border-color:#E8853A}
.sj-objitem.is-sel{border-color:#E8853A;background:#FDF0DF;box-shadow:0 0 0 2px rgba(232,133,58,.28)}
.sj-objthumb{width:46px;height:46px;display:block}
.sj-objthumb svg{width:100%;height:100%;display:block}
.sj-objname{font-size:11px;color:#6B5A44;text-align:center;line-height:1.15;
  max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sj-objdel{position:absolute;top:1px;right:2px;width:17px;height:17px;border-radius:50%;
  background:#FBE6E2;color:#B4301E;border:1px solid #E0A79E;font-size:12px;line-height:15px;
  text-align:center;cursor:pointer}
.sj-objdel:hover{background:#F5C8C0}

.sj-pageitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px;border-radius:8px;cursor:pointer;background:#FFF;border:2px solid #DCCBAA;flex:0 0 auto}
.sj-pageitem.is-sel{border-color:#E8853A;box-shadow:0 0 0 2px rgba(232,133,58,.28)}
.sj-pagenum{font-size:11px;font-weight:700;color:#8A7358}
.sj-pagemini{width:100%;height:40px;border-radius:4px;overflow:hidden;display:block}
.sj-pagemini svg{width:100%;height:100%;display:block}

/* ---------------- stage ---------------- */
.sj-stagewrap{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.sj-stage{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;
  background:#DDE7EC;border:3px solid #C9B896}
.sj-bd,.sj-grid,.sj-actors,.sj-titlelayer{position:absolute;inset:0}
/* The bubble layer must map 1:1 onto the Stage box: placeBubble() writes
   absolute pixel offsets measured from the Stage's own rectangle. */
.sj-bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sj-backdrop{position:absolute;inset:0;width:100%;height:100%;display:block}
.sj-cell{position:absolute;border:1px solid rgba(255,255,255,.16)}
.sj-actors,.sj-bubbles{pointer-events:none}
/* The actor occupies its grid CELL for logical positioning, but the drawing
   is rendered larger than the cell (ACTOR_ZOOM) so Tic/Toc read clearly on the
   Stage (~78-96px tall at 1366x768). Logical movement distance is unchanged:
   only the drawing overflows its cell; left/top still step whole cells. The
   whole cell remains the hit area (>=48px), so tapping stays reliable. */
.sj-actor{position:absolute;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:auto;cursor:pointer;transition:left .3s ease,top .3s ease;overflow:visible;
  min-width:48px;min-height:48px}
.sj-actorin{width:158%;height:158%;margin:0 auto;display:flex;align-items:flex-end;justify-content:center;
  transform-origin:center bottom;transition:transform .3s ease;pointer-events:none}
.sj-actor svg{width:100%;height:100%;display:block;overflow:visible}
.sj-actor.is-hidden{opacity:.16;filter:grayscale(1)}
.sj-actor.is-sel .sj-actorin{filter:drop-shadow(0 0 6px rgba(232,133,58,.9))}
.sj-actor.is-jump{animation:sjjump var(--sj-jump-ms,.52s) cubic-bezier(.3,0,.35,1)}
.sj-actor.is-pop .sj-actorin{animation:sjpop .26s ease}
@keyframes sjjump{0%,100%{transform:translateY(0)}45%{transform:translateY(calc(-1 * var(--sj-jump-h,26px)))}}
/* ACTOR DRAGGING — the whole visible character is grabbable. Making the SVG
   pointer-transparent left the pixels that overflow the cell dead, exactly
   where a child aims. Native image drag is suppressed instead.            */
.sj-actor{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;overflow:visible}
.sj-actor.is-dragging{cursor:grabbing;z-index:20;transition:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.sj-actor .sj-actorin,.sj-actor .sj-actorin svg,.sj-actor svg *{pointer-events:auto}
.sj-actor img,.sj-actor svg{-webkit-user-drag:none;user-drag:none}
.sj-bubbles,.sj-grid,.sj-bd,.sj-titlelayer{pointer-events:none}
@keyframes sjpop{0%,100%{filter:none}50%{filter:brightness(1.6)}}

.sj-bubble{position:absolute;padding:6px 11px;
  border-radius:12px;background:#FFF;border:2.5px solid #2C86C6;color:#12303F;font-size:16px;
  line-height:1.35;white-space:normal;word-break:break-word;z-index:8;pointer-events:none;
  box-shadow:0 3px 10px rgba(0,0,0,.22)}
.sj-bubble::after{content:'';position:absolute;left:var(--tail,50%);bottom:-10px;
  transform:translateX(-50%);border:7px solid transparent;border-top-color:#2C86C6}
/* flipped below the object (used when the object sits near the Stage top) */
.sj-bubble.is-below::after{bottom:auto;top:-10px;border-top-color:transparent;border-bottom-color:#2C86C6}
.sj-bubble.is-beside::after{display:none}
.sj-title{position:absolute;transform:translate(-50%,0);font-weight:700;white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}

/* ---------------- categories + palette ---------------- */
.sj-paletterow{flex:0 0 auto;display:flex;gap:7px;align-items:stretch}
.sj-cats{flex:0 0 auto;display:flex;gap:5px;align-items:stretch;padding:5px;
  border-radius:12px;background:#FBF5E9;border:2px solid #C9B896}
/* Each category control: permanent colour, unique icon, Arabic + English name,
   >=48px hit area, ~86-104px wide / 54px high when the bilingual label shows.
   Selection = strong outline + tick marker + palette title (never colour only). */
.sj-cat{min-width:88px;min-height:54px;padding:5px 8px 5px 7px;border-radius:10px;cursor:pointer;
  background:var(--cc);color:var(--ci,#fff);border:2px solid rgba(0,0,0,.28);
  display:flex;align-items:center;gap:6px;flex:0 0 auto;position:relative;
  transition:box-shadow .12s,filter .1s}
.sj-cat:hover{filter:brightness(1.08)}
.sj-cat:focus-visible{outline:3px solid #22323A;outline-offset:2px}
.sj-cat.is-on{box-shadow:0 0 0 3px #FFF,0 0 0 6px #22323A}
.sj-caticon{width:24px;height:24px;flex:0 0 auto;display:block}
.sj-catlab{display:flex;flex-direction:column;line-height:1.05;text-align:right;min-width:0}
.sj-catar{font-size:14px;font-weight:700;white-space:nowrap}
.sj-caten{font-size:10px;font-weight:600;opacity:.9;white-space:nowrap;letter-spacing:.2px}
.sj-cattick{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;
  background:#22323A;color:#FFF;font-size:12px;line-height:19px;text-align:center;
  border:2px solid #FFF;display:none}
.sj-cat.is-on .sj-cattick{display:block}
/* HIGHLIGHT CONTRACT: a highlight may NEVER move or scale a click target.
   Transform-based pulses make the element permanently "unstable" for a mouse
   and for automation alike — a defect proven in the Grade 1 platform. Only
   box-shadow animates here, so geometry is constant and clicks always land. */
.sj-cat.is-hi{animation:sjhi 1.6s ease-in-out infinite}
@keyframes sjhi{0%,100%{box-shadow:0 0 0 2px rgba(34,50,58,.35)}50%{box-shadow:0 0 0 6px rgba(34,50,58,.7)}}

.sj-palstack{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
/* selected-category title above the palette */
.sj-paltitle{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;
  border-radius:8px;background:var(--cc,#888);color:#FFF8EC;font-weight:700}
.sj-paltic{width:17px;height:17px;flex:0 0 auto;display:block}
.sj-paltar{font-size:14px}
.sj-palten{font-size:11px;opacity:.9;font-weight:600}
.sj-palette{flex:1 1 auto;min-width:0;display:flex;gap:6px;align-items:center;
  padding:5px 7px 12px;border-radius:10px;background:var(--ct,#333);
  border:2px solid var(--cc,#999);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:auto;scrollbar-color:#6B5A44 #EFE7D6}
/* clearly visible horizontal scrollbars (item 7) — not a faint hairline */
.sj-palette::-webkit-scrollbar,.sj-scripts::-webkit-scrollbar{height:13px}
.sj-palette::-webkit-scrollbar-track,.sj-scripts::-webkit-scrollbar-track{
  background:#EFE7D6;border-radius:7px}
.sj-palette::-webkit-scrollbar-thumb,.sj-scripts::-webkit-scrollbar-thumb{
  background:#B79A6E;border-radius:7px;border:2px solid #EFE7D6}
.sj-palette::-webkit-scrollbar-thumb:hover,.sj-scripts::-webkit-scrollbar-thumb:hover{
  background:#9A7F55}

/* block description tip — compact bilingual, own band, never covers the app */
.sj-blocktip{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:9px;
  background:#22323A;color:#FFF8EC;border:2px solid var(--bc,#888);
  box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:6;pointer-events:none;
  font-weight:700;max-width:520px;margin:0 auto}
.sj-tipar{font-size:15px}
.sj-tipen{font-size:12px;opacity:.85;font-weight:600}

/* ---------------- blocks ----------------
 * A block is NOT a rectangle. world/blocks.js draws the real interlocking
 * ScratchJr silhouette as an SVG that sits behind the glyph; the chip itself
 * is transparent and only positions things. Consequences:
 *   · no background / border / border-radius here — the SVG owns the shape;
 *   · blocks in a script overlap by exactly one nub, so the nub of one seats
 *     inside the notch of the next and the row reads as ONE locked script;
 *   · the number bubble is a sibling of the shape, not inside it, so it hangs
 *     BELOW the block and is never clipped.
 * Scripts are laid out LEFT to RIGHT even on this RTL page, because that is
 * the direction the application and the Student Book use.               */
/* ONE scale knob: --sjh is the block height. Everything else — the chip width,
 * the silhouette, the glyph, the bubble and the interlock overlap — is derived
 * from it, so a block scales UNIFORMLY on a short screen instead of being
 * squashed vertically (which turned the nub into a smear at 1366x640). */
.sj-block{--sjk:calc(var(--sjh,54) / 54);position:relative;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  height:calc(var(--sjh,54) * 1px);width:calc(var(--bw,64) * var(--sjk) * 1px);
  cursor:pointer;background:none;border:0;color:#FFF8EC;
  padding:0;box-sizing:border-box;touch-action:none;
  -webkit-user-select:none;user-select:none}
.sj-shape{position:absolute;inset-inline-start:0;top:0;height:calc(var(--sjh,54) * 1px);width:auto;
  display:block;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.sj-block:hover .sj-shape{filter:drop-shadow(0 2px 2px rgba(0,0,0,.22)) brightness(1.07)}
.sj-block:focus-visible{outline:3px solid #22323A;outline-offset:2px;border-radius:12px}
/* The glyph is centred on the BODY of the block, not on the box: a standard
 * and a head block are one nub wider than their body, an end block is not. */
/* Sizing is scoped to a real block chip. The same glyph artwork is reused by
 * lesson widgets (matching cards, counting strips, the teacher panel), which
 * set their own size — a global fixed size here collapsed those to nothing. */
.sj-glyph{display:block;flex:0 0 auto}
.sj-block>.sj-glyph,.sj-reppost>.sj-glyph{position:relative;z-index:2;
  width:39px;height:39px;pointer-events:none}
.sj-block>.sj-block.sh-std>.sj-glyph,.sj-block.sh-head>.sj-glyph{margin-inline-end:calc(10px * var(--sjk,1))}
.sj-block.sh-end>.sj-glyph{margin-inline-end:0}
.sj-pagethumb{width:46px;height:38px}

/* the white number bubble hangs BELOW the block, centred and overlapping the
   bottom edge — exactly as printed (SB p.24 «10», SB p.16 «1») */
.sj-val{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:-9px;
  min-width:30px;height:21px;padding:0 4px;border-radius:11px;background:#FFF;color:#22303C;
  font-size:14px;font-weight:700;text-align:center;border:1.6px solid #B9CBD6;
  box-shadow:0 1px 2px rgba(0,0,0,.18);font-family:inherit}
.sj-block.sh-std .sj-val,.sj-block.sh-head .sj-val{left:calc(50% - 5px)}
/* Go to Page prints its destination INSIDE the thumbnail badge, exactly as the
   book does, so it never carries a second number bubble underneath. */
.sj-block[data-block="GO_PAGE"] .sj-val{display:none}
/* Say carries a wide white text field in the bubble position */
.sj-block[data-block="SAY"] .sj-txt{position:absolute;z-index:3;left:50%;bottom:-11px;
  transform:translateX(-50%);width:86px;text-align:center}
.sj-block[data-block="SAY"] .sj-txtin{width:86px}
.sj-valin{width:34px}
.sj-txt{position:relative;z-index:2;max-width:104px;padding:3px 6px;border-radius:7px;
  background:#FFF;color:#22303C;font-size:14px;border:1.6px solid #B9CBD6;font-family:inherit}
.sj-txtin{width:104px}
.sj-block.sh-std.is-say{}
.sj-block.is-hi .sj-shape{animation:sjhi 1.6s ease-in-out infinite}
.sj-bdel{position:absolute;z-index:4;top:-7px;inset-inline-end:-4px;width:19px;height:19px;
  border-radius:50%;background:#FBE6E2;color:#B4301E;border:1.5px solid #E0A79E;font-size:12px;
  line-height:16px;text-align:center;cursor:pointer;display:none}
.sj-block.in-scr:hover .sj-bdel,.sj-reppost:hover .sj-bdel{display:block}
.sj-ghost{opacity:.9;transform:scale(1.04)}
body.is-dragging-block{cursor:grabbing}

/* the two rotation blocks carry a short word in the palette so they are
   separable by TEXT as well as by shape, never by colour alone */
.sj-block.in-pal.is-rot{flex-direction:column;gap:0}
.sj-rotword{position:relative;z-index:3;font-size:12px;font-weight:800;color:#0C3B52;
  background:rgba(255,255,255,.92);border-radius:7px;padding:0 6px;margin-top:-4px}
/* three separate, clearly labelled speed cards */
.sj-block.is-spd{flex-direction:column;gap:1px}
.sj-spdlab{position:relative;z-index:3;font-size:13px;font-weight:800;color:#4A3208;
  background:rgba(255,255,255,.94);border-radius:8px;padding:0 7px;white-space:nowrap;margin-top:-3px}

/* deleting a block by dragging it OUT of the script area */
.sj-block[data-drag-out]{touch-action:none}
.sj-block.is-lifting{z-index:60;opacity:.94;cursor:grabbing}
.sj-block.is-lifting .sj-shape{filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.sj-block.will-delete{opacity:.55;filter:grayscale(.55)}
.sj-scripts.is-discarding{outline:3px dashed #E4694F;outline-offset:-5px;
  background:rgba(228,105,79,.10)}

/* ---------------- script area ---------------- */
.sj-scriptrow{flex:0 0 auto;display:flex;gap:6px;align-items:stretch;height:88px}
.sj-actorchip{flex:0 0 66px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:#FBF5E9;border:2px solid #C9B896;padding:4px}
.sj-chipart{width:48px;height:48px}
.sj-chipart svg{width:100%;height:100%;display:block}
.sj-scripts{flex:1 1 auto;min-width:0;display:flex;gap:10px;align-items:center;
  padding:6px 8px 12px;border-radius:10px;background:#FFF;border:2px solid #C9B896;

/* ======================================================================
 * FIELD FIX (defects 6 + 8) — FINAL WORD ON SCROLLING AND SIZING.
 * app.css is the last stylesheet, so these rules settle the argument:
 * the lesson scene scrolls, the panels grow to their content, and the
 * simulator keeps a real working height instead of collapsing to a sliver.
 * ====================================================================== */
/* ROOT CAUSE OF THE CLIPPING: `.panel` already scrolled, but the panel VARIANT
 * classes (`.p-theory`, `.p-flow`, `.p-route`, ...) each declared
 * `overflow:hidden`, which beat it. A theory panel taller than the surface was
 * therefore cut off with no scrollbar at all. The variants now scroll. */
/* Only the panels that CAN outgrow the surface become scrollers. `.p-route`
 * and `.p-act` are laid out to fit exactly, and turning them into scroll
 * containers stopped their board from stretching (it fell from ~340 to ~300
 * design pixels), so they keep their original layout. */
.p-theory,.p-flow,.p-concept,.p-clock,.p-lab,.panel{
  overflow-x:hidden !important;overflow-y:auto !important;
  scrollbar-width:thin;scrollbar-color:#3B4A82 #141C39}
.p-route,.p-act{overflow:hidden !important}
.p-theory::-webkit-scrollbar,.p-flow::-webkit-scrollbar,.panel::-webkit-scrollbar{width:12px}
.p-theory::-webkit-scrollbar-thumb,.p-flow::-webkit-scrollbar-thumb,
.panel::-webkit-scrollbar-thumb{background:#3B4A82;border-radius:6px}
.work{overflow:hidden}
/* SHARING THE SURFACE between an explanation and the simulator.
 * Two failures had to be solved together: a hard min-height on the simulator
 * pushed the panel's last answer off the surface, while no floor at all let
 * the simulator collapse to a 22-pixel sliver behind a tall explanation.
 * The rule is therefore: when a stage shows BOTH, the panel is capped and
 * scrolls inside its cap, and the simulator keeps a guaranteed working height.
 * When a stage shows only one of them, that one takes the whole surface. */
.apphost{flex:1 1 auto;min-height:0}
.apphost .sj-app{min-height:0}
.work.is-theory-only .apphost{display:none}
.work:has(.apphost):has(.panel) .panel{flex:0 1 auto;max-height:44%}
.work:has(.apphost):has(.panel) .apphost{flex:1 1 auto;min-height:340px}
.work:not(:has(.panel)) .apphost{min-height:430px}
.work:not(:has(.apphost)) .panel{max-height:none}
@media (max-height:720px){
  .work:has(.apphost):has(.panel) .panel{max-height:38%}
  .work:has(.apphost):has(.panel) .apphost{min-height:300px}
  .work:not(:has(.panel)) .apphost{min-height:376px}
}

/* ONE scroller per panel. Inner wrappers must not become scrollers of their
   own: scrolling `.thbottom` moved the answers inside a box that was itself
   clipped, so the last option still could not be reached. */
.thbottom,.thmid,.thvis,.thside,.p-note,.route-btns,.clockq{overflow:visible !important}
.thbottom{max-height:none !important}

 * UI UNIFICATION — the platform no longer prints lesson counts, session

 * created at all (see scenes/hub.js and engine/teacher.js), so these rules

 * ====================================================================== */
.unithead{justify-content:flex-start}

/* ==== engine/scd.js — Scene-Cleanup Controller ====
 * Every transient artifact (arrow, guide bird, connection line, drag trail,
 * highlight, tooltip, previous-step instruction) and every temporary timer,
 * interval or listener is REGISTERED here. On stage change or scene unmount we
 * remove them from the DOM and clear timers and listeners. Nothing may leak.
 * artifactCount() is exposed so acceptance tests can assert ZERO leftovers.
 */

    after(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; },
    every(fn, ms) { const id = setInterval(fn, ms); intervals.add(id); return id; },
    raf(fn) { const id = requestAnimationFrame((t) => { rafs.delete(id); fn(t); }); rafs.add(id); return id; },
    listen(target, ev, fn, opts) {
      target.addEventListener(ev, fn, opts);

      unbinders.add(off); return off;

    nodeCount() { return nodes.size; },

      nodes.clear();
      timers.forEach(clearTimeout); timers.clear();
      intervals.forEach(clearInterval); intervals.clear();

      unbinders.forEach(off => { try { off(); } catch (e) {} }); unbinders.clear();
    },
  };
})(window.WADI);

  }

/* ==== engine/fsm.js — deterministic lesson state machine ====
 * A lesson is a sequence of STAGES:
 *   { id, rail, enter(api), completionPredicate(), onCorrect, cleanup, autoProgress, step }
 * The machine advances ONLY when completionPredicate() returns true — checked
 * again inside complete() as a guard, so no stray event can force a false pass.
 * Every transition runs scd.clear(), so no artifact leaks between stages.
 */

      get finished() { return finished; },
      get total() { return stages.length; },
      get stages() { return stages; },

      start() { i = -1; finished = false; this.next(); return this; },

      next() {
        if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.present && W.present.clearFeedback && W.present.clearFeedback(); W.scd.clear();
        i++;
        if (i >= stages.length) { finished = true; spec.onFinish && spec.onFinish(); return; }
        spec.onStage && spec.onStage(i, stages[i], false);
        try { stages[i].enter(m.api); } catch (e) { W.errorBoundary && W.errorBoundary.catch(e, 'stage:' + stages[i].id); }
      },

      retry() {
        if (i < 0) return;
        if (stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.present && W.present.clearFeedback && W.present.clearFeedback(); W.scd.clear();
        spec.onStage && spec.onStage(i, stages[i], true);
        try { stages[i].enter(m.api); } catch (e) { W.errorBoundary && W.errorBoundary.catch(e, 'retry:' + stages[i].id); }
      },

      reset() {
        if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.present && W.present.clearFeedback && W.present.clearFeedback(); W.scd.clear(); spec.onReset && spec.onReset(); this.start();
      },

      jump(target) {
        if (target < 0 || target >= stages.length) return;
        if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.present && W.present.clearFeedback && W.present.clearFeedback(); W.scd.clear(); i = target - 1; this.next();
      },
