    }

    const MSG_HEX = { orange: '#EF8A24', red: '#D94A4A', green: '#35A45A',
      blue: '#278CCB', purple: '#8B5BB5', cyan: '#2BB3C0' };
    const SPEED_AR = { slow: 'بَطيء', normal: 'عادِيّ', fast: 'سَريع' };

    /* Real local recording. If the device cannot record we say so honestly and
     * never fabricate a recording or substitute a tone. */
    let recording = false;
    function recordInto(b, btn) {
      if (!b) return;
      if (b.rec && W.audio.hasRecording(b.rec)) { W.audio.playRecording(b.rec); return; }
      if (!W.audio.canRecord()) {
        setRecMsg(W.audio.UNSUPPORTED_MSG);
        return;
      }
      if (recording) return;
      recording = true; btn.textContent = '■'; btn.classList.add('is-recording');
      setRecMsg('جارٍ التَّسْجيل… اضْغَطْ لِلإيقافِ.');
      W.audio.startRecording().then(() => {
        const stop = () => {
          W.audio.stopRecording().then(id => {
            recording = false;
            proj.setBlockRec(curObjId(), b.id, id);
            setRecMsg('تَمَّ حِفْظُ التَّسْجيلِ.');
            paintScripts(); change('rec');
          }).catch(() => { recording = false; setRecMsg(W.audio.UNSUPPORTED_MSG); paintScripts(); });
        };
        btn.onclick = e => { e.stopPropagation(); stop(); };
      }).catch(() => {
        recording = false; btn.classList.remove('is-recording'); btn.textContent = '●';
        setRecMsg(W.audio.UNSUPPORTED_MSG);
      });
    }
    function setRecMsg(t) {
      let n = root.querySelector('.sj-recmsg');
      if (!n) { n = el('div', { class: 'sj-recmsg', role: 'status' }); root.appendChild(n); }
      n.textContent = t; n.hidden = false;
    }

    /* GRADE 1 TRANSPLANT — the Control category used to show ONE speed chip
     * whose word had to be TAPPED to cycle. A seven-year-old cannot discover
     * that. The palette offers three separate, clearly labelled cards; all
     * three insert the same engine block SET_SPEED with their own value, so
     * the execution model is unchanged. */
    const SPEED_CARDS = [
      { key: 'SPD_LO', speed: 'slow', ar: 'بَطيء' },
      { key: 'SPD_MD', speed: 'normal', ar: 'عادِيّ' },
      { key: 'SPD_HI', speed: 'fast', ar: 'سَريع' },
    ];
    /* GRADE 1 TRANSPLANT — the two rotation blocks differed only by the
     * direction of a small curved arrow, indistinguishable at palette size.
     * A short word is added in the palette so the two are separable by TEXT as
     * well as by shape. The official ScratchJr artwork is untouched. */
    const ROT_MARK = {
      ROT_R: { word: 'يَمين', aria: 'اسْتَدِرْ يَمينًا — مع عقارب الساعة' },
      ROT_L: { word: 'يَسار', aria: 'اسْتَدِرْ يَسارًا — عكس عقارب الساعة' },
    };
    /* ONE definition of heading for the whole platform: 0 = clock 12 = the
     * object's original artwork. The number 0 is never shown to a pupil. */
    const normHeading = h => ((h % 12) + 12) % 12;

    /* ==================================================================
     * FIELD FIX (defect 1) — THE BUBBLE FOLLOWS ITS SPEAKER WHILE IT MOVES
     * ------------------------------------------------------------------
     * placeBubble measures the character's live rectangle, but a single call
     * only captures ONE instant. A character crossing the Stage under a CSS
     * transition keeps moving for hundreds of milliseconds afterwards, so the
     * bubble has to be re-measured every frame while anything is on screen.
     *
     * The loop is self-limiting: it starts only when a bubble is actually
     * visible and stops by itself the moment none is, so an idle Stage costs
     * nothing. Every visible bubble is re-placed, which is what keeps each
     * bubble on ITS OWN speaker when two characters talk at the same time.
     * ================================================================== */
    let bubRaf = null;
    function repositionBubbles() {
      const list = bubbleLayer.querySelectorAll('.sj-bubble:not([hidden])');
      list.forEach(b => placeBubble(b.getAttribute('data-bubble')));
      return list.length;
    }
    function followBubbles() {
      if (bubRaf != null) return;
      const tick = () => {
        bubRaf = null;
        if (!root.isConnected) return;
        if (repositionBubbles() > 0) { bubRaf = requestAnimationFrame(tick); }
      };
      bubRaf = requestAnimationFrame(tick);
    }
    function stopFollowingBubbles() {
      if (bubRaf != null) { cancelAnimationFrame(bubRaf); bubRaf = null; }
    }
    /* a resized window, a different resolution or a re-scaled application all
     * change the mapping from grid cells to pixels, so every bubble is placed
     * again — never left behind at its old pixel offset */
    W.scd.listen(window, 'resize', () => repositionBubbles());
    if (typeof ResizeObserver === 'function') {
      try {
        const ro = new ResizeObserver(() => repositionBubbles());
        ro.observe(stage);
      } catch (e) {}
    }

    /* one block chip, used both in the palette and inside a script.
     * The chip is NOT a rectangle: world/blocks.js draws the real interlocking
     * ScratchJr silhouette behind the glyph, and the chip's width is taken
     * from that silhouette so neighbouring blocks overlap by exactly one nub
     * and visibly lock together. */
    function blockNode(type, b, inPalette, card) {
      const B = W.sjr.BLOCKS[type];
      const BK = W.blocks;
      const rot = ROT_MARK[type];
      const label = card ? ('حَدِّدِ السُّرْعَةَ — ' + card.ar)
        : (rot ? rot.aria : (B.ar + ' — ' + B.en));
      const shapeKind = BK.shapeOf(type, B);
      const bodyW = BK.bodyWidthOf(type);
      const node = el('div', {
        class: 'sj-block' + (B.head ? ' is-head' : '') + (B.wrap ? ' is-wrap' : '') +
          (rot ? ' is-rot' : '') + (card ? ' is-spd' : '') +
          ' sh-' + shapeKind +
          (inPalette ? ' in-pal' : ' in-scr') +
          (spec.highlightBlock === type ? ' is-hi' : ''),
        'data-block': type,
        'data-bid': b ? b.id : '',
        'data-shape': shapeKind,
        'data-spd': card ? card.key : '',
        'data-speed-card': card ? card.speed : '',
        role: 'listitem',
        tabindex: '0',
        title: label,
        'aria-label': label,
        style: { '--bc': BK.COL[B.cat] },
      });
      if (shapeKind !== 'repeat') {
        node.appendChild(BK.shape(shapeKind, bodyW, BK.COL[B.cat]));
        /* The chip's width is published as a UNITLESS design-space number and
         * the stylesheet turns it into pixels against the current block height.
         * Writing a fixed px width here is what squashed the silhouette on a
         * 1366x640 screen: the height shrank, the width did not, and the nub
         * stopped being a nub. CSS custom properties cannot be set through
         * Object.assign(style, ...), so setProperty is used deliberately. */
        node.style.setProperty('--bw', String(
          shapeKind === 'end' ? bodyW : bodyW + BK.M.NUB_W));
      }
      node.appendChild(art.glyph(type, {
        cat: B.cat,
        val: b ? (b.val == null ? B.def : b.val) : B.def,
      }));
      if (rot && inPalette) node.appendChild(el('span', { class: 'sj-rotword', text: rot.word }));
      if (card) {
        node.appendChild(el('span', { class: 'sj-spdlab', text: card.ar }));
        node.addEventListener('click', () => insert(type, { speed: card.speed }));
        node.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); insert(type, { speed: card.speed }); }
        });
        W.dnd && W.dnd.draggable && W.dnd.draggable(node, { type, speed: card.speed });
        return node;
      }

      /* bilingual description on hover / keyboard focus, cleared on leave */
      node.addEventListener('mouseenter', () => showTip(type));
      node.addEventListener('mouseleave', hideTip);
      node.addEventListener('focus', () => showTip(type));
      node.addEventListener('blur', hideTip);

      if (B.val) {
        const v = b ? (b.val == null ? B.def : b.val) : B.def;
        const val = el(inPalette ? 'span' : 'input', inPalette
          ? { class: 'sj-val', text: String(v), 'data-val': String(v) }
          : {
            class: 'sj-val sj-valin', type: 'text', inputmode: 'numeric',
            value: String(v), 'data-val': String(v),
            'aria-label': 'قيمة ' + B.ar,
            maxlength: '2',
          });
        if (!inPalette) {
          val.addEventListener('click', e => e.stopPropagation());
          val.addEventListener('input', () => {
            const n = parseInt(val.value.replace(/[^0-9]/g, ''), 10);
            if (!isNaN(n)) {
              proj.setBlockVal(curObjId(), b.id, n);
              val.setAttribute('data-val', String(Math.max(0, Math.min(99, n))));
              /* Go to Page prints the DESTINATION page inside its thumbnail,
               * so the artwork has to be redrawn when the number changes. */
              if (type === 'GO_PAGE') {
                const oldg = node.querySelector('.sj-glyph');
                if (oldg) node.replaceChild(art.glyph('GO_PAGE', { cat: B.cat, val: n }), oldg);
              }
              change('val');
            }
          });
          val.addEventListener('blur', () => {
            const bb = proj.findBlock(proj.selected(), b.id);
            if (bb) { val.value = String(bb.val); val.setAttribute('data-val', String(bb.val)); }
          });
        }
        node.appendChild(val);
      }

      if (B.textParam) {
        const txt = b ? (b.text == null ? B.defText : b.text) : B.defText;
        if (inPalette) {
          node.appendChild(el('span', { class: 'sj-txt', text: txt || 'قل' }));
        } else {
          const inp = el('input', {
            class: 'sj-txt sj-txtin', type: 'text', value: txt,
            'data-text': txt, 'aria-label': 'نص لبنة تحدث',
            maxlength: '40', dir: 'auto',
          });
          inp.addEventListener('click', e => e.stopPropagation());
          inp.addEventListener('input', () => {
            proj.setBlockText(curObjId(), b.id, inp.value);
            inp.setAttribute('data-text', inp.value);
            change('text');
          });
          node.appendChild(inp);
        }
      }

      /* ---- MESSAGE COLOUR parameter (Send Message / Start on Message) ---- */
      if (B.msgParam) {
        const cur = b ? (b.msg || B.defMsg) : B.defMsg;
        const sw = el(inPalette ? 'span' : 'button', {
          class: 'sj-msg' + (inPalette ? '' : ' sj-msgbtn'),
          type: inPalette ? null : 'button',
          'data-msg': cur, title: 'لون الرسالة',
          'aria-label': 'لون الرسالة ' + cur,
          style: { '--mc': MSG_HEX[cur] || '#E8862B' },
        });
        if (!inPalette) {
          sw.addEventListener('click', e => {
            e.stopPropagation();
            const list = W.sjr.MSG_COLOURS;
            const nx = list[(list.indexOf(b.msg || B.defMsg) + 1) % list.length];
            proj.setBlockMsg(curObjId(), b.id, nx);
            paintScripts(); change('msg');
          });
        }
        node.appendChild(sw);
      }

      /* ---- SPEED parameter (Set Speed) ---- */
      if (B.speedParam) {
        const cur = b ? (b.speed || B.defSpeed) : B.defSpeed;
        const sp = el(inPalette ? 'span' : 'button', {
          class: 'sj-speed' + (inPalette ? '' : ' sj-speedbtn'),
          type: inPalette ? null : 'button',
          'data-speed': cur, title: 'السرعة',
          'aria-label': 'السرعة ' + cur,
          text: SPEED_AR[cur] || cur,
        });
        if (!inPalette) {
          sp.addEventListener('click', e => {
            e.stopPropagation();
            const list = W.sjr.SPEEDS;
            const nx = list[(list.indexOf(b.speed || B.defSpeed) + 1) % list.length];
            proj.setBlockSpeed(curObjId(), b.id, nx);
            paintScripts(); change('speed');
          });
        }
        node.appendChild(sp);
      }

      /* ---- RECORDING slot (Play Recorded Sound) ---- */
      if (B.recParam && !inPalette) {
        const has = b && b.rec && W.audio.hasRecording(b.rec);
        const rb = el('button', {
          class: 'sj-rec' + (has ? ' has-rec' : ''), type: 'button',
          'data-rec': has ? b.rec : '', title: has ? 'تشغيل التسجيل' : 'سجّل صوتًا',
          'aria-label': has ? 'تشغيل التسجيل' : 'تسجيل صوت',
          text: has ? '▶' : '●',
        });
        rb.addEventListener('click', e => { e.stopPropagation(); recordInto(b, rb); });
        node.appendChild(rb);
      }

      if (inPalette) {
        node.addEventListener('click', () => insert(type));
        node.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); insert(type); }
        });
        W.dnd && W.dnd.draggable && W.dnd.draggable(node, { type });
      } else {
        node.appendChild(el('span', {
          class: 'sj-bdel', text: '×', title: 'حذف اللبنة',
          onclick: e => { e.stopPropagation(); proj.removeBlock(curObjId(), b.id); paintScripts(); change('remove'); },
        }));
        attachBlockDragOut(node, b);
      }
      return node;
    }

    /* ==================================================================
     * GRADE 1 TRANSPLANT — DELETING BY DRAGGING OUT
     * A block dragged and released OUTSIDE the script area is removed from the
     * real project model, not merely from the DOM. Dropping a head block
     * (a trigger) discards the whole script. Releasing inside the script area
     * changes nothing, so an accidental nudge is always safe.
     * ================================================================== */
    let blockDrag = null;
    function attachBlockDragOut(node, b) {
      node.setAttribute('data-drag-out', '1');
      node.addEventListener('pointerdown', e => {
        if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
        if (e.target.closest && e.target.closest('.sj-bdel, .sj-val, .sj-rec, .sj-txt, .sj-msgbtn, .sj-speedbtn')) return;
        if (running || root.getAttribute('data-running') === '1') return;
        blockDrag = { id: b.id, node, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
        try { node.setPointerCapture(e.pointerId); } catch (err) {}
      });
      node.addEventListener('pointermove', e => {
        const d = blockDrag;
        if (!d || d.id !== b.id || d.pid !== e.pointerId) return;
        if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8) return;
        if (!d.moved) { d.moved = true; node.classList.add('is-lifting'); }
        node.style.transform = 'translate(' + (e.clientX - d.sx) + 'px,' + (e.clientY - d.sy) + 'px)';
        const out = !insideScriptArea(e.clientX, e.clientY);
        node.classList.toggle('will-delete', out);
        scriptArea.classList.toggle('is-discarding', out);
        e.preventDefault();
      });
      const release = (e, cancelled) => {
        const d = blockDrag;
        if (!d || d.id !== b.id || (e && d.pid !== e.pointerId)) return;
        blockDrag = null;
        try { node.releasePointerCapture(d.pid); } catch (err) {}
        node.classList.remove('is-lifting', 'will-delete');
        scriptArea.classList.remove('is-discarding');
        node.style.transform = '';
        if (!d.moved || cancelled || !e) return;
        if (insideScriptArea(e.clientX, e.clientY)) { paintScripts(); return; }
        const oid = curObjId();
        const head = W.sjr.BLOCKS[b.type] && W.sjr.BLOCKS[b.type].head;
        if (head) removeWholeScript(oid, b.id);
        else proj.removeBlock(oid, b.id);
        paintScripts(); change('remove');
      };
      node.addEventListener('pointerup', e => release(e, false));
      node.addEventListener('pointercancel', e => release(e, true));
    }

    function insideScriptArea(x, y) {
      const r = scriptArea.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    /* remove every block of the script that owns `blockId` */
    function removeWholeScript(oid, blockId) {
      const o = proj.obj(oid); if (!o) return;
      const sc = o.scripts.find(s => s.some(x => x.id === blockId));
      if (!sc) { proj.removeBlock(oid, blockId); return; }
      sc.slice().forEach(x => proj.removeBlock(oid, x.id));
    }

    function curObjId() { const s = proj.selected(); return s ? s.id : null; }

    function paintScripts() {
      syncActive();
      clear(scriptArea); clear(actorChip);
      const o = proj.selected();
      if (!o) return;
      actorChip.appendChild(el('div', { class: 'sj-chipart' }, [art.actor(o.kind)]));

      o.scripts.forEach((script, si) => {
        const strip = el('div', { class: 'sj-script', 'data-script': String(si), role: 'listitem' });
        script.forEach(b => {
          if (b.type === 'REPEAT') {
            /* THE REAL C-SHAPED CONTAINER (SB p.24, supplied screenshot 5).
             * A left post that locks into the previous block, an orange bar
             * that ARCHES OVER the nested blocks, and a right post carrying
             * the loop arrow and the repeat count. The body sits UNDER the
             * arch and is open at the bottom, exactly as printed — so a pupil
             * can see which blocks the repeat is holding. */
            const BK = W.blocks;
            const wrap = el('div', {
              class: 'sj-repeat', 'data-repeat': b.id,
              style: { '--bc': BK.COL.control },
            });
            const post = (kind, w, kids) => {
              const n = el('div', { class: 'sj-reppost sj-rep-' + kind });
              n.appendChild(BK.shape(kind === 'l' ? 'repL' : 'repR', w, BK.COL.control));
              (kids || []).forEach(k => n.appendChild(k));
              n.style.setProperty('--bw', String(kind === 'r' ? w + BK.M.NUB_W : w));
              return n;
            };
            const left = post('l', BK.M.REP_L);
            const body = el('div', { class: 'sj-repbody', 'data-repbody': b.id });
            (b.body || []).forEach(ib => body.appendChild(blockNode(ib.type, ib, false)));
            body.appendChild(el('button', {
              class: 'sj-into', type: 'button', text: '+', title: 'أضف داخل التكرار',
              'data-into': b.id,
              onclick: () => { intoTarget = (intoTarget === b.id ? null : b.id); paintScripts(); },
            }));
            if (intoTarget === b.id) body.classList.add('is-target');
            const right = post('r', BK.M.REP_R, [art.glyph('REPEAT', { cat: 'control' })]);
            /* the repeat COUNT lives on the right post, in the same white
             * bubble every numeric block uses */
            const rv = b.val == null ? W.sjr.BLOCKS.REPEAT.def : b.val;
            const cnt = el('input', {
              class: 'sj-val sj-valin sj-repval', type: 'text', inputmode: 'numeric',
              value: String(rv), 'data-val': String(rv), 'data-bid': b.id,
              'aria-label': 'عدد مرات التكرار', maxlength: '2',
            });
            cnt.addEventListener('click', e => e.stopPropagation());
            cnt.addEventListener('input', () => {
              const n = parseInt(cnt.value.replace(/[^0-9]/g, ''), 10);
              if (!isNaN(n)) {
                proj.setBlockVal(curObjId(), b.id, n);
                cnt.setAttribute('data-val', String(Math.max(0, Math.min(99, n))));
                change('val');
              }
            });
            right.appendChild(cnt);
            right.appendChild(el('span', {
              class: 'sj-bdel', text: '×', title: 'حذف لبنة التكرار',
              onclick: e => { e.stopPropagation(); proj.removeBlock(curObjId(), b.id); paintScripts(); change('remove'); },
            }));
            right.setAttribute('data-block', 'REPEAT');
            right.setAttribute('data-bid', b.id);
            right.setAttribute('tabindex', '0');
            right.setAttribute('title', 'كَرِّرْ — Repeat');
            right.setAttribute('aria-label', 'كَرِّرْ — Repeat');
            wrap.appendChild(left); wrap.appendChild(body); wrap.appendChild(right);
            strip.appendChild(wrap);
          } else {
            strip.appendChild(blockNode(b.type, b, false));
          }
        });
        strip.appendChild(el('button', {
          class: 'sj-endcap', type: 'button', title: 'اختر هذا المقطع',
          'data-pick': String(si), text: si === activeScript ? '●' : '○',
          onclick: () => { proj.setActiveScript(o.id, si); syncActive(); intoTarget = null; paintScripts(); },
        }));
        if (si === activeScript) strip.classList.add('is-active');
        W.dnd && W.dnd.dropzone && W.dnd.dropzone(strip, d => {
          if (d && d.type) { proj.setActiveScript(o.id, si); syncActive(); insert(d.type, d); }
        });
        scriptArea.appendChild(strip);
      });

      const nu = el('button', {
        class: 'sj-newscript', type: 'button', 'data-act': 'new-script',
        title: 'مَقْطَعٌ جَديدٌ', 'aria-label': 'مقطع جديد', text: '+',
        onclick: () => { o.scripts.push([]); proj.setActiveScript(o.id, o.scripts.length - 1); syncActive(); paintScripts(); },
      });
      scriptArea.appendChild(nu);
      W.dnd && W.dnd.dropzone && W.dnd.dropzone(scriptArea, d => {
        if (d && d.type) insert(d.type, d);
      });
    }

    /* mirrors the ENGINE's active script for the currently selected object */
    let activeScript = null, intoTarget = null;
    function syncActive() {
      const o = proj.selected();
      activeScript = o ? proj.activeScriptIndex(o) : null;
    }

    /* INSERTION — the engine owns the contract; the UI only reports intent.
     * A trigger opens a new script and becomes active; any other block appends
     * to the active script. The studio no longer keeps a competing index of
     * its own, which is what previously split a Green Flag and the action
     * blocks that followed it into two unrelated scripts. */
    function insert(type, extra) {
      const o = proj.selected(); if (!o) return null;
      const opts = {};
      if (extra && extra.speed) opts.speed = extra.speed;   /* speed cards */
      if (intoTarget) opts.into = intoTarget;
      else if (!W.sjr.BLOCKS[type].head && activeScript != null &&
               o.scripts[activeScript]) opts.script = activeScript;
      const b = proj.addBlock(o.id, type, opts);
      if (b) { activeScript = proj.activeScriptIndex(o); intoTarget = null; }
      paintScripts(); change('insert');
      /* AUTO-SCROLL (item 7): reveal the block just inserted and the active
       * script, so no newly added block or its value chip hides off-edge. */
      scrollToActiveScript();
      return b;
    }

    /* bring the active script (and the newest block) fully into view */
    function scrollToActiveScript() {
      requestAnimationFrame(() => {
        const active = scriptArea.querySelector('.sj-script.is-active') ||
          scriptArea.querySelector('.sj-script:last-of-type');
        if (active && active.scrollIntoView) {
          try { active.scrollIntoView({ inline: 'end', block: 'nearest' }); } catch (e) { active.scrollIntoView(); }
        } else {
          scriptArea.scrollLeft = scriptArea.scrollWidth;
        }
      });
    }

    /* wheel over a horizontal strip scrolls it horizontally (item 7): plain
     * wheel and Shift+wheel both move the palette / script area sideways. */
    function enableHWheel(node) {
      node.addEventListener('wheel', e => {
        const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (!dx) return;
        const before = node.scrollLeft;
        node.scrollLeft += dx;
        if (node.scrollLeft !== before) e.preventDefault();
      }, { passive: false });
    }
    enableHWheel(palette);
    enableHWheel(scriptArea);

    function paintAll() {
      intoTarget = null;
      paintBackdrop(); paintGrid(); paintActors(); paintTitle();
      paintObjects(); paintPages(); paintCats(); paintPalette(); paintScripts();
    }

    function change(what) { try { onChange(what, api); } catch (e) {} }

    /* ============================================================ */
    /*                        EXECUTION                             */
    /* ============================================================ */
    function clearTimers() { timers.forEach(clearTimeout); timers = []; if (loopHandle) { clearTimeout(loopHandle); loopHandle = null; } }
    const reduced = () => W.store && W.store.settings && W.store.settings.reducedMotion;

    function play(res, done) {
      const { w, h } = cellPct();
      /* FIELD FIX (defect 2) — REDUCED MOTION MUST NOT COMPRESS TEACHING TIME.
       * The whole event schedule used to be multiplied by 0.35 in reduced
       * motion, so a «انْتَظِرْ 30» that must last three real seconds collapsed
       * to about one, and Toc replied before Tic had finished. Reduced motion
       * now only softens the MOVEMENT easing; the schedule itself always runs
       * in real time, so 10 = one second and 30 = three seconds always. */
      const speed = 1;                       /* event schedule: real time   */
      const anim = reduced() ? 0.5 : 1;      /* movement easing only        */
      /* GRADE 1 TRANSPLANT: a one-shot guard so the run callback fires exactly
       * once whether the run ends naturally or is halted by a Stop block. */
      let finished = false;
      res.events.forEach(ev => {
        const at = ev.t * speed;
        timers.push(setTimeout(() => {
          const node = actorEls[ev.obj];
          if (!node) return;
          const inner = node.firstChild;
          if (ev.kind === 'move') {
            node.style.transitionDuration = ((ev.ms || 300) * anim) + 'ms';
            node.style.left = (ev.x * w) + '%'; node.style.top = (ev.y * h) + '%';
            placeBubble(ev.obj, ev.x, ev.y);
            followBubbles();      /* keep it glued while the slide plays out */
          } else if (ev.kind === 'hop') {
            /* GRADE 1 TRANSPLANT — ONE jump, arc height driven by the block's
             * real value. The curriculum meaning of the value is «عدد الخطوات
             * لأعلى», so the arc is measured in REAL Stage cells, not in a
             * fraction of the actor's own box. A soft ceiling keeps the rise
             * strictly increasing in the value yet always inside the Stage. */
            followBubbles();      /* a jump moves the speaker too */
            const jh = Math.max(1, Math.min(12, ev.height || 1));
            const dur = Math.round((ev.ms || 520) * speed);
            const sr = stage.getBoundingClientRect();
            const cellPx = sr.height / proj.rows;
            const nr = node.getBoundingClientRect();
            const room = Math.max(cellPx * 0.5, nr.top - sr.top - 4);
            const want = jh * cellPx;
            const rise = room * (1 - Math.exp(-want / room));
            node.style.setProperty('--sj-jump-h', rise.toFixed(1) + 'px');
            node.style.setProperty('--sj-jump-ms', dur + 'ms');
            node.classList.remove('is-jump');
            void node.offsetWidth;                 /* restart the animation */
            node.classList.add('is-jump');
            timers.push(setTimeout(() => node.classList.remove('is-jump'), dur + 40));
          } else if (ev.kind === 'turn') {
            /* GRADE 1 TRANSPLANT — ONE clock position at a time. The actor and
             * every listener receive the SAME heading in the SAME frame, so no
             * two indicators can disagree and the next block cannot start
             * before the turn has finished. */
            const o = proj.obj(ev.obj);
            const sc = ((o ? o.size : 3) / 3).toFixed(3);
            const steps = Math.max(1, ev.steps || Math.abs(ev.amount) || 1);
            const dir = (ev.amount || 0) >= 0 ? 1 : -1;
            const from = ev.fromHeading == null ? normHeading(ev.heading - (ev.amount || 0)) : ev.fromHeading;
            const stepMs = ev.stepMs || Math.round((ev.ms || 540) / steps);
            for (let k = 1; k <= steps; k++) {
              const hh = normHeading(from + dir * k);
              timers.push(setTimeout(() => {
                inner.style.transformOrigin = '50% 50%';
                inner.style.transform = `rotate(${hh * 30}deg) scale(${sc})`;
                inner.setAttribute('data-heading', String(hh));
                if (spec.onHeading) {
                  try {
                    spec.onHeading(ev.obj, hh, {
                      from, to: normHeading(ev.toHeading == null ? ev.heading : ev.toHeading),
                      steps, step: k, direction: dir > 0 ? 'right' : 'left',
                    });
                  } catch (e) {}
                }
              }, Math.round(stepMs * k * speed)));
            }
          } else if (ev.kind === 'size') {
            const o = proj.obj(ev.obj);
            const hd = normHeading(o ? o.heading : 0);
            inner.style.transform = `rotate(${hd * 30}deg) scale(${(ev.size / 3).toFixed(3)})`;
            inner.setAttribute('data-size', String(ev.size));
          } else if (ev.kind === 'vis') {
            node.classList.toggle('is-hidden', !ev.visible);
            node.setAttribute('data-visible', ev.visible ? '1' : '0');
            if (!ev.visible) {   /* Hide suppresses any bubble it is showing */
              const hb = bubbleLayer.querySelector(`[data-bubble="${ev.obj}"]`);
              if (hb) { hb.hidden = true; hb.removeAttribute('data-said'); }
            }
          } else if (ev.kind === 'say') {
            const bub = bubbleLayer.querySelector(`[data-bubble="${ev.obj}"]`);
            if (bub) {
              bub.hidden = false;
              bub.querySelector('.sj-bubtext').textContent = ev.text;
              bub.setAttribute('data-said', ev.text);
              /* measured from the live character, not from the model, so a
               * bubble that appears mid-slide is already in the right place */
              placeBubble(ev.obj);
              followBubbles();
            }
          } else if (ev.kind === 'unsay') {
            const bub = bubbleLayer.querySelector(`[data-bubble="${ev.obj}"]`);
            if (bub) { bub.hidden = true; bub.removeAttribute('data-said'); }
          } else if (ev.kind === 'sound') {
            if (ev.sound === 'rec' && ev.rec) W.audio.playRecording(ev.rec);
            else W.audio.pop();
            node.classList.add('is-pop');
            timers.push(setTimeout(() => node.classList.remove('is-pop'), 260));
          } else if (ev.kind === 'message') {
            node.classList.add('is-msg');
            node.setAttribute('data-sent-msg', ev.msg);
            timers.push(setTimeout(() => node.classList.remove('is-msg'), 300));
          } else if (ev.kind === 'speed') {
            root.setAttribute('data-speed', ev.speed);
          } else if (ev.kind === 'stopall') {
            /* GRADE 1 TRANSPLANT (defect found by the STOP functional test):
             * a Stop block cleared every timer, INCLUDING the one that commits
             * the computed final state. The pupil saw the object move and stop
             * but the project still held the pre-run position, so any lesson
             * check after a Stop read stale state. The computed states up to
             * the Stop are now committed, the halt itself is unchanged, and
             * the run callback still fires exactly once. */
            proj.commit(res.states);
            stopAll(true);
            paintActors();
            if (!finished) { finished = true; if (done) done(res); }
          } else if (ev.kind === 'page') {
            proj.setPage(ev.page); paintAll();
          }
        }, at));
      });
      const total = res.duration * speed + 80;
      timers.push(setTimeout(() => {
        proj.commit(res.states);
        if (res.looping && running) { loopHandle = setTimeout(() => { if (running) play(res, done); }, 120); }
        else {
          running = false; root.setAttribute('data-running', '0');
          if (!finished) { finished = true; if (done) done(res); }
        }
      }, total));
    }

    function runAll(trigger, only) {
      stopAll(true);
      cancelDrag();
      /* Assessed activities restore the authored starting position here, so the
       * result of a run is always produced by the PROGRAM, never by a hand
       * placement made before pressing the green flag. */
      if (onBeforeRun) { try { onBeforeRun(); } catch (e) {} }
      running = true; root.setAttribute('data-running', '1');
      /* A run that LOOPS (Repeat Forever) never reaches its completion
       * callback, so a lesson that needs to know «did the pupil press play?»
       * could never find out — lesson 1.10's Stop stage kept asking the pupil
       * to press play after they already had. The start of a run is therefore
       * announced as its own change, whether or not the run ever ends. */
      change('run-start');
      const res = proj.run({ trigger, only });
      const sim = proj.simulate({ trigger, only });
      play(res, () => { try { onRun(sim, api); } catch (e) {} });
      if (!res.events.length) {
        running = false; root.setAttribute('data-running', '0');
        try { onRun(sim, api); } catch (e) {}
      }
      return sim;
    }

    function stopAll(silent) {
      cancelDrag();
      clearTimers(); running = false; root.setAttribute('data-running', '0');
      if (!silent) { proj.resetPage(); paintActors(); change('stop'); }
    }

    function resetAll() {
      cancelDrag();
      clearTimers(); running = false; root.setAttribute('data-running', '0');
      proj.resetAll(); paintAll(); change('reset');
    }

    /* ==================================================================
     * GRADE 1 TRANSPLANT — ACTOR DRAGGING ON THE STAGE
     * ------------------------------------------------------------------
     * A pupil presses on an actor, drags it anywhere inside the Stage and
     * releases it; the actor stays there and any program then RUNS FROM THAT
     * PLACE. This is not decorative: the drop writes the real x / y of the
     * object in the ScratchJr project model the execution engine reads, and it
     * updates that object's home so Run, Go Home and Reset Object all agree
     * with what the child sees.
     *
     * Coordinates. The whole application sits inside a CSS transform:scale()
     * wrapper, so raw screen pixels are meaningless. Every drag converts
     * viewport -> Stage rectangle -> Stage logical cells using the Stage's own
     * live bounding rectangle, which already includes the scale. Nothing raw is
     * ever stored, so a drop lands on the same logical cell at 1366x768 and at
     * 1920x1080.
     *
     * Tap versus Drag. Pointer travel below DRAG_PX (scale corrected) is a TAP
     * and fires «ابْدَأْ عِنْدَ النَّقْرِ». Travel beyond it becomes a DRAG and must NOT
     * fire that script. Releasing after a drag never produces a stray tap.
     * ================================================================== */
    const DRAG_PX = 8;
    let dragState = null, dragRefused = 0, lastPointerTap = 0;
    /* a guided target activity may temporarily forbid repositioning by hand,
     * so a pupil cannot satisfy «صِلْ إلى النَّجْمَةِ» by dragging */
    let actorDragLocked = false;
    let onBeforeRun = null;

    function stageGeom() {
      const r = stage.getBoundingClientRect();
      return {
        r, cw: r.width / proj.cols, ch: r.height / proj.rows,
        scale: r.width > 0 && stage.offsetWidth > 0 ? r.width / stage.offsetWidth : 1,
      };
    }

    /* viewport point -> logical cell, clamped so the actor can never be lost */
    function pointToCell(cx, cy, g) {
      const col = Math.round((cx - g.r.left) / g.cw - 0.5);
      const row = Math.round((cy - g.r.top) / g.ch - 0.5);
      return {
        x: Math.max(0, Math.min(proj.cols - 1, col)),
        y: Math.max(0, Math.min(proj.rows - 1, row)),
      };
    }

    function attachActorDrag(node, id) {
      node.addEventListener('pointerdown', e => {
        if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
        /* Dragging is an EDITING action and must never happen while a script
         * is running: a mid-run reposition would fight the animation and
         * corrupt the committed result. The DOM flag is checked as well as the
         * closure flag so the guard holds even if a repaint recreated the node
         * during the run. */
        if (running || root.getAttribute('data-running') === '1') { dragRefused++; return; }
        if (actorDragLocked) { dragRefused++; return; }
        const o = proj.obj(id); if (!o) return;
        const g = stageGeom();
        dragState = {
          id, node, g, moved: false, pid: e.pointerId,
          sx: e.clientX, sy: e.clientY, ox: o.x, oy: o.y,
          thresh: DRAG_PX * (g.scale || 1),
        };
        if (proj.page().selectedId !== id) {
          proj.select(id); paintObjects(); paintScripts(); change('select');
        }
        try { node.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });

      node.addEventListener('pointermove', e => {
        const d = dragState;
        if (!d || d.id !== id || d.pid !== e.pointerId) return;
        const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
        if (!d.moved && Math.hypot(dx, dy) < d.thresh) return;   /* still a tap */
        if (!d.moved) { d.moved = true; d.node.classList.add('is-dragging'); }
        const c = pointToCell(e.clientX, e.clientY, d.g);
        const { w, h } = cellPct();
        d.node.style.left = (c.x * w) + '%';
        d.node.style.top = (c.y * h) + '%';
        d.cell = c;
        e.preventDefault();
      });

      const finish = (e, cancelled) => {
        const d = dragState;
        if (!d || d.id !== id || (e && d.pid !== e.pointerId)) return;
        dragState = null;
        try { d.node.releasePointerCapture(d.pid); } catch (err) {}
        d.node.classList.remove('is-dragging');
        if (!d.moved) {
          if (!cancelled) { lastPointerTap = Date.now(); tapObject(id); }
          return;                                                  /* a real tap */
        }
        lastPointerTap = Date.now();       /* a drag must not become a tap */
        const c = (cancelled || !d.cell) ? { x: d.ox, y: d.oy } : d.cell;
        /* the drop writes the REAL model position AND the object's home, so a
         * program starts here, Go Home comes back here and Reset Object
         * restores here — each object on its own page, independently. */
        const o = proj.obj(id);
        if (o) {
          o.x = c.x; o.y = c.y;
          o.home.x = c.x; o.home.y = c.y;
          proj.touch && proj.touch();
        }
        paintActors(); paintObjects();
        change('move');
      };
      node.addEventListener('pointerup', e => finish(e, false));
      node.addEventListener('pointercancel', e => finish(e, true));
      node.addEventListener('lostpointercapture', () => {
        if (dragState && dragState.id === id && dragState.moved) finish(null, false);
      });
      /* A plain `click` must still tap. Pointer events cover a mouse and a
       * finger, but not assistive technology, not a scripted activation and
       * not every Windows 10 input stack. The pointer path already tapped, so
       * a click that follows within one interaction window is swallowed. */
      node.addEventListener('click', () => {
        if (Date.now() - lastPointerTap < 500) return;
        if (dragState) return;
        tapObject(id);
      });
    }

    /* any state change that ends editing also ends an in-flight drag */
    function cancelDrag() {
      if (!dragState) return;
      const d = dragState; dragState = null;
      try { d.node.releasePointerCapture(d.pid); } catch (err) {}
      d.node.classList.remove('is-dragging');
      paintActors();
    }

    function tapObject(id) {
      proj.select(id); paintObjects(); paintActors(); paintScripts();
      const o = proj.obj(id);
      if (!o) return;
      const hasTap = o.scripts.some(s => s.length && s[0].type === 'ON_TAP');
      if (hasTap) runAll('ON_TAP', id);
      else {
        /* bump check: tapping is also how a pupil pushes two objects together */
        change('tap');
      }
    }

    /* Start on Bump: fired when two objects are adjacent after a run. */
    function checkBump() {
      const hits = proj.collisions();
      if (!hits.length) return false;
      const ids = {};
      hits.forEach(pr => { ids[pr[0]] = 1; ids[pr[1]] = 1; });
      let fired = false;
      Object.keys(ids).forEach(id => {
        const o = proj.obj(id); if (!o) return;
        if (o.scripts.some(s => s.length && s[0].type === 'ON_BUMP')) {
          runAll('ON_BUMP', id); fired = true;
        }
      });
      return fired;
    }

    /* ============================================================ */
    /*                        OVERLAYS                              */
    /* ============================================================ */
    function showOverlay(title, body) {
      clear(overlay); overlay.hidden = false;
      overlay.appendChild(el('div', { class: 'sj-sheet' }, [
        el('div', { class: 'sj-sheethead' }, [
          el('span', { text: title }),
          el('button', { class: 'sj-close', type: 'button', text: '×', 'aria-label': 'إغلاق', onclick: hideOverlay }),
        ]),
        body,
      ]));
    }
    function hideOverlay() { overlay.hidden = true; clear(overlay); }

    function openLibrary() {
      const gridBox = el('div', { class: 'sj-lib' });
      art.LIBRARY.forEach(it => {
        gridBox.appendChild(el('button', {
          class: 'sj-libitem', type: 'button', 'data-lib': it.kind,
          'aria-label': it.ar,
          onclick: () => {
            const pg = proj.page();
            const o = proj.addObject({ kind: it.kind, x: Math.min(2 + pg.objects.length * 2, proj.cols - 1), y: proj.rows - 2 });
            proj.select(o.id); hideOverlay(); paintAll(); change('add');
          },
        }, [
          el('span', { class: 'sj-libart' }, [art.actor(it.kind)]),
          el('span', { class: 'sj-libname', text: it.ar }),
        ]));
      });
      showOverlay('إضافَةُ كائِنٍ', gridBox);
    }

    function openBackgrounds() {
      const gridBox = el('div', { class: 'sj-lib' });
      art.BACKGROUNDS.forEach(b => {
        gridBox.appendChild(el('button', {
          class: 'sj-libitem', type: 'button', 'data-bg': b.id, 'aria-label': b.ar,
          onclick: () => { proj.page().background = b.id; hideOverlay(); paintBackdrop(); paintPages(); change('bg'); },
        }, [
          el('span', { class: 'sj-libart sj-libbg' }, [art.backdrop(b.id)]),
          el('span', { class: 'sj-libname', text: b.ar }),
        ]));
      });
      showOverlay('الخَلْفِيَّة', gridBox);
    }

    const TITLE_COLOURS = ['#F2C230', '#E2542F', '#3E9E56', '#2C86C6', '#9B58B5', '#FFF8EC', '#22323A'];
    function openTitleEditor() {
      const inp = el('input', {
        class: 'sj-titleinput', type: 'text', value: proj.project.title,
        'data-titleinput': '1', maxlength: '40', dir: 'auto',
        placeholder: 'اكتب عنوان المشروع', 'aria-label': 'عنوان المشروع',
      });
      inp.addEventListener('input', () => { proj.project.title = inp.value; paintTitle(); change('title'); });

      const cols = el('div', { class: 'sj-swatches' });
      TITLE_COLOURS.forEach(c => cols.appendChild(el('button', {
        class: 'sj-swatch', type: 'button', 'data-colour': c,
        style: { background: c }, 'aria-label': 'لون',
        onclick: () => { proj.project.titleColour = c; paintTitle(); change('title-colour'); },
      })));

      const sizes = el('div', { class: 'sj-sizes' });
      [1, 2, 3, 4].forEach(s => sizes.appendChild(el('button', {
        class: 'sj-sizebtn', type: 'button', 'data-size': String(s),
        text: 'A', style: { fontSize: (11 + s * 5) + 'px' }, 'aria-label': 'حجم ' + s,
        onclick: () => { proj.project.titleSize = s; paintTitle(); change('title-size'); },
      })));

      const moves = el('div', { class: 'sj-moves' });
      [['▲', 0, -6], ['▼', 0, 6], ['◀', -8, 0], ['▶', 8, 0]].forEach(m => moves.appendChild(el('button', {
        class: 'sj-movebtn', type: 'button', text: m[0], 'aria-label': 'تحريك العنوان',
        onclick: () => {
          const p = proj.project.titlePos;
          p.x = Math.max(4, Math.min(96, p.x + m[1]));
          p.y = Math.max(2, Math.min(90, p.y + m[2]));
          paintTitle(); change('title-move');
        },
      })));

      showOverlay('العُنْوان', el('div', { class: 'sj-titleed' }, [
        inp,
        el('div', { class: 'sj-tlabel', text: 'اللَّوْن' }), cols,
        el('div', { class: 'sj-tlabel', text: 'الحَجْم' }), sizes,
        el('div', { class: 'sj-tlabel', text: 'المَوْضِع' }), moves,
      ]));
    }

    function togglePages() { pageCol.hidden = !pageCol.hidden; }

    /* ============================================================ */
    paintAll();

    const api = {
      root, proj, stage,
      /* painting */
      repaint: paintAll, paintScripts, paintActors, paintObjects, paintPages,
      /* execution */
      run: runAll, stop: stopAll, reset: resetAll, checkBump,
      get running() { return running; },
      get dragging() { return !!(dragState && dragState.moved); },
      get dragRefused() { return dragRefused; },
      setActorDrag(on) { actorDragLocked = !on; },
      get actorDragLocked() { return actorDragLocked; },
      set onBeforeRun(fn) { onBeforeRun = fn; },
      /* authoring helpers used by lessons and tests */
      insert, select(id) { proj.select(id); paintObjects(); paintActors(); paintScripts(); },
      setScript(i) { const o = proj.selected(); if (o) proj.setActiveScript(o.id, i); paintScripts(); },
      activeScript() { const o = proj.selected(); return o ? proj.activeScriptIndex(o) : null; },
      addObject(o) { const x = proj.addObject(o); paintAll(); return x; },
      setBackground(id) { proj.page().background = id; paintBackdrop(); paintPages(); },
      setCat(c) { activeCat = c; paintCats(); paintPalette(); },
      highlight(cat, block) { spec.highlightCat = cat; spec.highlightBlock = block; paintCats(); paintPalette(); paintScripts(); },
      /* A lesson marks which blocks it teaches. It NEVER removes a category
       * or a previously learned block. */
      setAllowed(list) {
        focus.length = 0; (list || []).forEach(t => focus.push(t));
        paintCats(); paintPalette();
      },
      setFocus(list) { this.setAllowed(list); },
      get focusList() { return focus.slice(); },
      /* persistence */
      save(id) { W.store.saveProject(id, proj.serialise()); },
      load(id) { const d = W.store.loadProject(id); if (d && proj.restore(d)) { paintAll(); return true; } return false; },
      destroy() { cancelDrag(); stopFollowingBubbles(); clearTimers(); if (root.parentNode) root.parentNode.removeChild(root); },
      set onRun(fn) { onRun = fn; },
      set onChange(fn) { onChange = fn; },
      /* re-fire the change hook after a programmatic edit (title, seeded fix,
       * etc.) so a lesson's completion predicate is re-evaluated. Real UI
       * edits already call change(); this is the equivalent for code paths. */
      poke(what) { change(what || 'poke'); },
      placeBubbles() { return repositionBubbles(); },
    };
    return api;
  }

  W.studio = { build };
})(window.WADI);

/* ==== engine/selfcheck.js ==== */
/* ==== engine/selfcheck.js — تقويم ذاتي — unit self-check ====
 * Calm pupil self-reflection, exactly as the curriculum frames it:
 *   واثق · ما زلت أتدرّب · أحتاج إلى مساعدة
 * No score, no percentage, no ranking, no blocked progression. The choice is
 * changeable at any time and is stored locally. Teacher Mode may read it, but
 * it is never converted into a number.
 */
(function (W) {
  const { el, svg } = W.util;

  const FACES = [
    { id: 'confident', ar: 'واثق',             col: '#6EBE78' },
    { id: 'practising', ar: 'ما زلت أتدرّب',    col: '#E0A24B' },
    { id: 'help',      ar: 'أحتاج إلى مساعدة', col: '#7FB6D6' },
  ];

  function faceSvg(kind, col) {
    const g = svg('svg', { viewBox: '0 0 100 100', class: 'sc-face' });
    g.appendChild(svg('circle', { cx: 50, cy: 50, r: 40, fill: col, stroke: 'rgba(0,0,0,.25)', 'stroke-width': 3 }));
    g.appendChild(svg('circle', { cx: 37, cy: 42, r: 5, fill: '#2A1A10' }));
    g.appendChild(svg('circle', { cx: 63, cy: 42, r: 5, fill: '#2A1A10' }));
    let mouth = 'M34 62 q16 12 32 0';                 /* smile */
    if (kind === 'practising') mouth = 'M34 64 l32 0'; /* level */
    if (kind === 'help') mouth = 'M34 68 q16 -12 32 0';/* thoughtful */
    g.appendChild(svg('path', { d: mouth, stroke: '#2A1A10', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }));
    return g;
  }

  /* renders the self-check for a unit into `host` */
  function render(host, unitId, items) {
    const wrap = el('div', { class: 'sc' });
    wrap.appendChild(el('div', { class: 'sc-head' }, [
      el('div', { class: 'sc-ttl', text: 'تقويم ذاتي' }),
      el('div', { class: 'sc-sub', text: 'اختر ما يصفك. لا توجد درجات.' }),
    ]));

 function lessonById(id) { return W.curriculum.lessons.find(l => l.id === id); }

 /* draw ONE block chip (coloured, with glyph + optional value) for a diagram */
 function modelBlock(type, val, nested) {
 const B = W.sjr.BLOCKS[type];
 if (!B) return el('span', { class: 'tm-mblk', text: type });
 const col = (W.sjr.CATS.find(c => c.id === B.cat) || {}).col || '#888';
 const kids = [W.art.glyph(type), el('span', { class: 'tm-mblk-ar', text: B.ar })];
 if (val != null && val !== '') kids.push(el('span', { class: 'tm-mblk-val', text: String(val) }));
 const chip = el('span', { class: 'tm-mblk' + (B.wrap ? ' is-wrap': ''), style: { '--bc': col } }, kids);
 if (B.wrap && nested && nested.length) {
 const body = el('span', { class: 'tm-mnest' }, nested.map(nb => modelBlock(nb[0], nb[1], nb[2])));
 return el('span', { class: 'tm-mwrap' }, [chip, body]);
 }
 return chip;
 }
 function modelScriptRow(blocks) {
 return el('div', { class: 'tm-mscript' }, blocks.map(b => modelBlock(b[0], b[1], b[2])));
 }
 function modelCard(card) {
 const rows = [];
 rows.push(el('div', { class: 'tm-mgrid' }, [
 el('div', { class: 'tm-mcell' }, [el('b', { text: 'الكائِن' }), el('span', { text: card.obj })]),
 el('div', { class: 'tm-mcell' }, [el('b', { text: 'الصَّفْحَة' }), el('span', { text: card.page })]),
 el('div', { class: 'tm-mcell' }, [el('b', { text: 'المُشَغِّل' }), el('span', { text: card.trigger })]),
 ]));
 if (card.blocks && card.blocks.length) {
 rows.push(el('div', { class: 'tm-mlabel', text: 'المَقْطَعُ النَّموذَجِيُّ (بالتَّرْتيبِ):' }));
 rows.push(modelScriptRow(card.blocks));
 }
 if (card.blocks2 && card.blocks2.length) {
 rows.push(el('div', { class: 'tm-mlabel', text: 'مَقْطَعُ الكائِنِ الثَّاني:' }));
 rows.push(modelScriptRow(card.blocks2));
 }
 if (card.titleNote) rows.push(el('div', { class: 'tm-mnote', text: card.titleNote }));
 rows.push(el('div', { class: 'tm-mrow' }, [el('b', { text: 'النَّتيجَةُ المُتَوَقَّعَةُ: ' }), el('span', { text: card.result })]));
 if (card.alts) rows.push(el('div', { class: 'tm-mrow' }, [el('b', { text: 'حُلولٌ بَديلَةٌ مَقْبولَةٌ: ' }), el('span', { text: card.alts.join(' · ') })]));
 if (card.wrong) rows.push(el('div', { class: 'tm-mrow is-wrong' }, [el('b', { text: 'خَطَأٌ شائِعٌ: ' }), el('span', { text: card.wrong })]));
 if (card.how) rows.push(el('div', { class: 'tm-mrow is-how' }, [el('b', { text: 'كَيْفَ تَتَحَقَّقُ المُحاكاةُ: ' }), el('span', { text: card.how })]));
 return el('div', { class: 'tm-mcard' }, [
 el('div', { class: 'tm-mhead', text: card.stage }),
 ...rows,
 ]);
 }

 function render(id) {
 const L = lessonById(id) || W.curriculum.lessons[0];
 curId = L.id;
 const N = NOTES[L.id] || {};
 const built = W.lessons.has(L.id);

 const tabs = el('div', { class: 'tm-tabs', role: 'tablist' });
 W.curriculum.lessons.forEach(l => {
 tabs.appendChild(el('button', {
 class: 'tm-tab' + (l.id === L.id ? ' is-on': ''),
 type: 'button', role: 'tab', 'data-tmtab': l.id,
 'aria-selected': l.id === L.id ? 'true': 'false',
 text: l.no,
 onclick: () => { body.replaceWith(render(l.id)); },
 }));
 });

 const sect = (t, kids) => el('section', { class: 'tm-sect' }, [
 el('h3', { class: 'tm-h', text: t }), ...(Array.isArray(kids) ? kids: [kids]),
 ]);
 const ul = items => el('ul', { class: 'tm-ul' }, items.map(x => el('li', { text: x })));

 const body = el('div', { class: 'tm-body', 'data-tmlesson': L.id }, [
 /* 2. UNIT — stays visible while switching lessons */
 el('div', { class: 'tm-unit', 'data-tmunit': '1' }, [
 el('span', { class: 'tm-unit-k', text: 'الوَحْدَةُ الأولى' }),
 el('span', { class: 'tm-unit-t', text: (W.curriculum.units[0] || {}).ar || '' }),
 ]),
 /* 3. LESSON NAVIGATION — its own row, scrolls horizontally, never overlaps */
 el('div', { class: 'tm-navrow' }, [tabs]),
 /* 4. SELECTED LESSON */
 el('div', { class: 'tm-head' }, [
 el('h2', { class: 'tm-title', 'data-tmtitle': '1', text: 'الدَّرْسُ ' + L.no + ' · ' + L.ar }),
 el('div', { class: 'tm-meta' }, [
 el('span', { class: 'tm-chip' + (built ? ' is-ok': ' is-soon'), text: built ? 'مُنَفَّذٌ': 'قَيْدُ الإعْدادِ' }),
 ]),
 ]),
 /* 5. CONTENT SECTIONS */
 /* OFFICIAL objectives — copied verbatim from دليل المعلم, nothing else. */
 sect('أهْدافُ الدَّرْسِ / المُخْرَجاتُ (دَليلُ المُعَلِّمِ)', ul(L.objectives)),
 /* PLATFORM criteria — the practical requirements this simulator asserts.
 * They are shown under their OWN heading so they can never be mistaken
 * for the official guide objectives above. */
 L.platformCriteria && L.platformCriteria.length
 ? sect('مَعاييرُ الإتْمامِ في المِنَصَّةِ', ul(L.platformCriteria)): null,
 sect('المُصْطَلَحاتُ', el('div', { class: 'tm-terms' },
 L.terms.map(t => el('span', { class: 'tm-term' }, [
 el('b', { text: t[0] }), el('i', { text: t[1] }),
 ])))),
 L.blocks && L.blocks.length ? sect('اللَّبِناتُ المُسْتَخْدَمَةُ', el('div', { class: 'tm-blocks' },
 L.blocks.map(b => {
 const B = W.sjr.BLOCKS[b];
 if (!B) return null;
 return el('span', { class: 'tm-block', 'data-tmb': b, style: { '--bc': (W.sjr.CATS.find(c => c.id === B.cat) || {}).col } }, [
 W.art.glyph(b), el('span', { text: B.ar }),
 ]);
 }).filter(Boolean))): null,
 N.run ? sect('آلِيَّةُ التَّنْفيذِ', el('p', { class: 'tm-p', text: N.run })): null,
 N.answers ? sect('الإجاباتُ النَّموذَجِيَّةُ', ul(N.answers)): null,
 MODEL[L.id] ? el('section', { class: 'tm-sect tm-model', 'data-tmmodel': L.id }, [
 el('h3', { class: 'tm-h', text: 'الحَلُّ المَرْجِعِيُّ لِلْمُحاكاةِ' }),
 el('p', { class: 'tm-p tm-model-note', text: 'مرجعٌ للمُعَلِّمَةِ فقط — لا يُعرَض المقطعُ النموذجيُّ كاملًا للتلميذِ تلقائيًّا.' }),
 ...MODEL[L.id].map(modelCard),
 ]): null,
 N.trouble ? sect('التَّحَدِّياتُ المُتَوَقَّعَةُ', el('p', { class: 'tm-p', text: N.trouble })): null,
 N.close ? sect('التَّقْويمُ وَالغَلْقُ', el('p', { class: 'tm-p', text: N.close })): null,
 el('div', { class: 'tm-actions' }, [
 built ? el('button', {
 class: 'minibtn', type: 'button', 'data-act': 'tm-preview', text: 'مُعايَنَةُ الدَّرْسِ',
 onclick: () => { close(); W.scene.go('lesson', { id: L.id }); },
 }): null,
 el('button', {
 class: 'minibtn', type: 'button', 'data-act': 'tm-clear', text: 'مَسْحُ تَقَدُّمِ هذا الدَّرْسِ',
 onclick: () => { W.store.clearLesson(L.id); render(L.id); },
 }),
 ]),
 ]);
 if (panel) {
 const old = panel.querySelector('.tm-body');
 if (old) old.replaceWith(body); else panel.appendChild(body);
 }
 return body;
 }

 function openPanel(id) {
 if (open) { render(id || curId || 'l1'); return; }
 open = true;
 W.store.beginPreview();
 panel = el('div', {
 class: 'teacher', id: 'teacherPanel', role: 'dialog',
 'aria-label': 'شاشة المعلمة', 'data-teacher': 'open',
 }, [
 el('div', { class: 'tm-bar' }, [
 el('span', { class: 'tm-brand', text: 'دَليلُ المُعَلِّمَةِ — الصَّفُّ الثَّاني' }),
 el('button', { class: 'tm-close', type: 'button', text: '×', 'aria-label': 'إغلاق', onclick: close }),
 ]),
 ]);
 document.body.appendChild(panel);
 render(id || 'l1');
 }

 function close() {
 if (!open) return;
 open = false;
 W.store.endPreview();
 if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
 panel = null;
 }

 W.teacher = {
 open: openPanel, close,
 toggle() { open ? close(): openPanel(W.activeLesson || 'l1'); },
 get isOpen() { return open; },
 notes: NOTES,
 };
})(window.WADI);

        el('div', { class: 'idx-head' }, [

            class: 'backbtn', type: 'button', text: '⟵ الرَّئيسَة', onclick: () => ctx.go('hub'),
          }),

        ]),
        el('div', { class: 'unithead', 'data-unithead': '1' }, [
          el('span', { class: 'unithead-k', text: 'الوَحْدَةُ الأولى' }),
          el('span', { class: 'unithead-t', text: unit().ar }),
        ]),
        scrollHost,
        scrollHint,

      ]));

      /* SCROLL CONTRACT (release closure, item 2)
       * The four learning paths live in ONE bounded scroll container with a

/* ==== lessons/kit.js ==== */
/* ==== lessons/kit.js — shared authoring kit for lessons 1.3–1.14 ====
 *
 * Small, reusable, DATA-DRIVEN activity builders that every remaining lesson
 * composes. They are paper-style widgets for the parts of the Student Book
 * that are not ScratchJr coding (ordering a cycle, matching blocks to
 * categories, choosing the correct script, continuing a pattern), plus tiny
 * helpers for driving the ONE persistent ScratchJr studio.
 *
 * Nothing here validates by presence. Studio stages read COMPUTED engine
 * results; paper widgets validate the pupil's explicit choice on an explicit
 * «تحقّق». No widget auto-resets a wrong answer — it marks the mistake and
 * keeps the answer visible so it can be corrected, exactly like Lesson 1.1.
 */
(function (W) {
  const { el, svg } = W.util;

  /* small arrow glyph reused across lessons */
  function arrow(dir) {
    const g = svg('svg', { viewBox: '0 0 40 40', class: 'stepglyph', 'aria-hidden': 'true' });
    const P = d => g.appendChild(svg('path', { d, stroke: 'currentColor', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    if (dir === 'up') { P('M20 32 V10'); P('M11 19 L20 10 L29 19'); }
    if (dir === 'down') { P('M20 8 V30'); P('M11 21 L20 30 L29 21'); }
    if (dir === 'right') { P('M8 20 H30'); P('M21 11 L30 20 L21 29'); }
    if (dir === 'left') { P('M32 20 H10'); P('M19 11 L10 20 L19 29'); }
    return g;
  }

  /* ---------------------------------------------------------------------
   * ORDER — numbered slots the pupil fills by click / drag / keyboard.
   * Returns { host, order(), filled(), mark(correctIds), clearMarks() }.
   * Identical contract to Lesson 1.1 stage 1 so the experience is uniform.
   * ------------------------------------------------------------------- */
  function orderWidget(opts) {
    const state = new Array(opts.slots).fill(null);
    const bank = el('div', { class: 'ord-bank' });
    const slotBox = el('div', { class: 'ord-slots' });
    const host = el('div', { class: 'ord-widget' });

    const inBank = id => !state.includes(id);
    const firstEmpty = () => state.indexOf(null);
    const place = (id, slot) => {
      const from = state.indexOf(id), occ = state[slot];
      if (from >= 0) state[from] = null;
      state[slot] = id;
      if (occ && occ !== id && from >= 0) state[from] = occ;
      repaint(); opts.onChange && opts.onChange();
    };
    const clickPlace = id => { const s = firstEmpty(); if (s >= 0) place(id, s); };
    const removeFrom = s => { state[s] = null; repaint(); opts.onChange && opts.onChange(); };

    function cardBody(c) {
      const kids = [];
      if (c.dir) kids.push(el('span', { class: 'ord-ic' }, [arrow(c.dir)]));
      kids.push(el('span', { class: 'ord-txt', text: c.ar }));
      return kids;
    }
    function attachDrag(node, id) {
      let down = false, moved = false, sx = 0, sy = 0, ghost = null;
      node.classList.add('ord-drag');
      W.scd.listen(node, 'pointerdown', e => { if (e.button != null && e.button !== 0) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; });
      W.scd.listen(node, 'pointermove', e => {
        if (!down) return;
        if (!moved && Math.abs(e.clientX - sx) < 6 && Math.abs(e.clientY - sy) < 6) return;
        moved = true;
        if (!ghost) { ghost = node.cloneNode(true); ghost.className = node.className + ' ord-ghost'; Object.assign(ghost.style, { position: 'fixed', pointerEvents: 'none', zIndex: 9999, opacity: 0.92, margin: 0 }); document.body.appendChild(ghost); document.body.classList.add('is-dragging-block'); }
        const r = ghost.getBoundingClientRect();
        ghost.style.left = (e.clientX - r.width / 2) + 'px'; ghost.style.top = (e.clientY - r.height / 2) + 'px';
        hi(e.clientX, e.clientY);
      });
      const fin = e => {
        if (!down) return; down = false;
        if (ghost) { ghost.remove(); ghost = null; }
        document.body.classList.remove('is-dragging-block'); clearHi();
        if (moved) { const s = slotAt(e.clientX, e.clientY); if (s >= 0) place(id, s); }
      };
      W.scd.listen(node, 'pointerup', fin);
      W.scd.listen(window, 'pointercancel', () => { down = false; if (ghost) { ghost.remove(); ghost = null; } document.body.classList.remove('is-dragging-block'); clearHi(); });
    }
    function slotAt(cx, cy) {
      const nodes = [...slotBox.querySelectorAll('.ord-slot')];
      for (let i = 0; i < nodes.length; i++) { const r = nodes[i].getBoundingClientRect(); if (cx >= r.left - 24 && cx <= r.right + 24 && cy >= r.top - 24 && cy <= r.bottom + 24) return i; }
      return -1;
    }
    function hi(cx, cy) { clearHi(); const i = slotAt(cx, cy); if (i >= 0) { const n = slotBox.querySelectorAll('.ord-slot')[i]; if (n) n.classList.add('is-drophot'); } }
    function clearHi() { slotBox.querySelectorAll('.ord-slot').forEach(n => n.classList.remove('is-drophot')); }

    function repaint() {
      bank.innerHTML = '';
      opts.cards.forEach(c => {
        if (!inBank(c.id)) return;
        const card = el('button', { class: 'ord-card', type: 'button', 'data-card': c.id, 'aria-label': c.ar, onclick: () => clickPlace(c.id) }, cardBody(c));
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clickPlace(c.id); } });
        attachDrag(card, c.id); bank.appendChild(card);
      });
      slotBox.innerHTML = '';
      for (let i = 0; i < opts.slots; i++) {
        const id = state[i];
        const slot = el('div', { class: 'ord-slot' + (id ? ' is-full' : ' is-empty'), 'data-slot': String(i + 1), 'data-has': id || '' }, [el('span', { class: 'ord-num', text: String(i + 1) })]);
        if (id) {
          const c = opts.cards.find(x => x.id === id);
          const filled = el('button', { class: 'ord-filled', type: 'button', 'data-card': id, 'aria-label': c.ar, onclick: () => removeFrom(i) }, cardBody(c).concat([el('span', { class: 'ord-x', text: '×', 'aria-hidden': 'true' })]));
          filled.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); removeFrom(i); } });
          attachDrag(filled, id); slot.appendChild(filled);
        } else slot.appendChild(el('span', { class: 'ord-hint', text: '…' }));
        slotBox.appendChild(slot);
      }
    }
    host.appendChild(slotBox);
    host.appendChild(el('div', { class: 'ord-banklabel', text: opts.bankLabel || 'البِطاقاتُ المُتاحَةُ' }));
    host.appendChild(bank);
    repaint();
    return {
      host, order: () => state.slice(), filled: () => state.every(x => x),
      mark(correct) { const nodes = slotBox.querySelectorAll('.ord-slot'); state.forEach((id, i) => { const ok = id && id === correct[i]; nodes[i].classList.toggle('is-right', !!ok); nodes[i].classList.toggle('is-wrong', !!(id && !ok)); }); },
      clearMarks() { slotBox.querySelectorAll('.ord-slot').forEach(n => n.classList.remove('is-right', 'is-wrong')); },
    };
  }

  /* ---------------------------------------------------------------------
   * MATCH — connect each item on the right to a target bucket on the left.
   * Data: { items:[{id,label,target}], targets:[{id,label}] }. The pupil
   * clicks an item then a target; wrong pairs are marked on «تحقّق».
   * Returns { host, allPlaced(), verify() -> bool }.
   * ------------------------------------------------------------------- */
  function matchWidget(opts) {
    const assign = {};                 // itemId -> targetId
    let pick = null;
    const host = el('div', { class: 'match' });
    const targetsRow = el('div', { class: 'match-targets' });
    const itemsRow = el('div', { class: 'match-items' });

    function repaint() {
      targetsRow.innerHTML = '';
      opts.targets.forEach(t => {
        const chips = Object.keys(assign).filter(i => assign[i] === t.id)
          .map(i => { const it = opts.items.find(x => x.id === i); return el('span', { class: 'match-chip', 'data-mchip': i, text: it.label, onclick: () => { delete assign[i]; repaint(); opts.onChange && opts.onChange(); } }); });
        targetsRow.appendChild(el('div', { class: 'match-target', 'data-target': t.id, onclick: () => { if (pick) { assign[pick] = t.id; pick = null; repaint(); opts.onChange && opts.onChange(); } } }, [
          el('div', { class: 'match-tlabel', text: t.label }),
          el('div', { class: 'match-tbin' }, chips),
        ]));
      });
      itemsRow.innerHTML = '';
      opts.items.forEach(it => {
        if (assign[it.id]) return;
        itemsRow.appendChild(el('button', { class: 'match-item' + (pick === it.id ? ' is-pick' : ''), type: 'button', 'data-item': it.id, onclick: () => { pick = pick === it.id ? null : it.id; repaint(); } }, [
          it.glyph ? el('span', { class: 'match-ic' }, [it.glyph()]) : null,
          el('span', { text: it.label }),
        ]));
      });
    }
    host.appendChild(targetsRow);
    host.appendChild(el('div', { class: 'match-hint', text: 'انْقُرْ بِطاقَةً ثُمَّ الفِئَةَ المُناسِبَةَ.' }));
    host.appendChild(itemsRow);
    repaint();
    return {
      host,
      allPlaced: () => opts.items.every(it => assign[it.id]),
      verify() {
        let allok = true;
        targetsRow.querySelectorAll('.match-chip').forEach(ch => {
          const i = ch.getAttribute('data-mchip'); const it = opts.items.find(x => x.id === i);
          const ok = it.target === assign[i];
          ch.classList.toggle('is-right', ok); ch.classList.toggle('is-wrong', !ok);
          if (!ok) allok = false;
        });
        return allok;
      },
    };
  }

  /* ---------------------------------------------------------------------
   * CHOICE — pick the one correct option among cards; marks the wrong pick
   * without hiding the reason. Options may render an arbitrary preview node.
   * Returns { host, verify() -> bool, chosen() }.
   * ------------------------------------------------------------------- */
  function choiceWidget(opts) {
    let chosen = null;
    const host = el('div', { class: 'choice' });
    const row = el('div', { class: 'choice-row' });
    opts.options.forEach(o => {
      const c = el('button', { class: 'choice-opt', type: 'button', 'data-opt': o.id, onclick: () => { chosen = o.id; [...row.children].forEach(n => n.classList.toggle('is-pick', n.getAttribute('data-opt') === o.id)); opts.onChange && opts.onChange(); } });
      if (o.render) c.appendChild(o.render()); else c.appendChild(el('span', { text: o.label }));
      row.appendChild(c);
    });
    host.appendChild(row);
    return {
      host, chosen: () => chosen,
      verify() {
        if (chosen == null) return false;
        [...row.children].forEach(n => { const id = n.getAttribute('data-opt'); const o = opts.options.find(x => x.id === id); n.classList.toggle('is-right', id === chosen && o.correct); n.classList.toggle('is-wrong', id === chosen && !o.correct); });
        const o = opts.options.find(x => x.id === chosen);
        return !!(o && o.correct);
      },
    };
  }

  /* ---------------------------------------------------------------------
   * PATTERN — show a repeating sequence with the last cell(s) blank; the
   * pupil picks the tile that continues the pattern. cells render coloured
   * shapes so the repeating unit is visible without reading a label.
   * ------------------------------------------------------------------- */
  function shapeTile(shape, colour) {
    const g = svg('svg', { viewBox: '0 0 48 48', class: 'ptile', 'aria-hidden': 'true' });
    if (shape === 'circle') g.appendChild(svg('circle', { cx: 24, cy: 24, r: 16, fill: colour }));
    if (shape === 'square') g.appendChild(svg('rect', { x: 8, y: 8, width: 32, height: 32, rx: 4, fill: colour }));
    if (shape === 'triangle') g.appendChild(svg('path', { d: 'M24 7 L41 39 H7 Z', fill: colour }));
    if (shape === 'star') g.appendChild(svg('path', { d: 'M24 6 l5 12 13 1 -10 8 4 13 -12 -7 -12 7 4 -13 -10 -8 13 -1 z', fill: colour }));
    if (shape === 'diamond') g.appendChild(svg('path', { d: 'M24 6 L42 24 L24 42 L6 24 Z', fill: colour }));
    return g;
  }

  /* Render a small non-interactive preview of a script (list of {type,val})
   * using the real block glyphs and category colours, for choice widgets. */
  function scriptPreview(blocks) {
    const wrap = el('div', { class: 'choice-script' });
    (blocks || []).forEach(b => {
      const B = W.sjr.BLOCKS[b.type]; if (!B) return;
      const col = (W.sjr.CATS.find(c => c.id === B.cat) || {}).col || '#888';
      const chip = el('div', { class: 'choice-blk', style: { background: col, position: 'relative' } }, [W.art.glyph(b.type)]);
      if (B.val && b.val != null) chip.appendChild(el('span', { class: 'cb-v', style: { background: '#fff', color: '#223', borderRadius: '4px', padding: '0 3px', bottom: '-4px', right: '2px' }, text: String(b.val) }));
      wrap.appendChild(chip);
    });
    return wrap;
  }

  /* ---------------------------------------------------------------------
   * THEORY PANEL — the ONE layout for a theoretical stage.
   *   TOP     the lesson instruction (owned by lessonrun)
   *   MIDDLE  a large educational illustration on the PHYSICAL LEFT,
   *           the explanation / key terms / numbered steps on the RIGHT
   *   BOTTOM  answer choices, ordering cards, Verify, Reset, Next
   * Returns { host, mid, side, bottom } — put the activity in `bottom`.
   * ------------------------------------------------------------------- */
  function theory(panel, opts) {
    opts = opts || {};
    panel.classList.add('p-theory');
    const mid = el('div', { class: 'thmid', 'data-thmid': '1' });
    const vis = el('div', { class: 'thvis', 'data-thvis': '1' });
    const side = el('div', { class: 'thside', 'data-thside': '1' });
    mid.appendChild(vis); mid.appendChild(side);
    panel.appendChild(mid);

    const art = opts.art && W.edu ? W.edu.scene(opts.art) : null;
    if (art) {
      const fig = el('figure', { class: 'thfig', 'data-thart': opts.art, role: 'img',
        'aria-label': opts.artLabel || opts.title || 'رسم توضيحي' }, [art]);
      if (opts.caption) fig.appendChild(el('figcaption', { class: 'thcap', text: opts.caption }));
      vis.appendChild(fig);
    }
    if (opts.title) side.appendChild(el('h3', { class: 'th-h', text: opts.title }));
    (opts.points || []).forEach((t, i) => side.appendChild(el('div', { class: 'th-point' }, [
      el('span', { class: 'th-n', text: String(i + 1) }),
      el('span', { class: 'th-t', text: t }),
    ])));
    (opts.terms || []).forEach(t => side.appendChild(el('div', { class: 'th-term', 'data-term': t[1] }, [
      el('div', { class: 'th-term-ar', text: t[0] }),
      el('div', { class: 'th-term-en', text: t[1] }),
      t[2] ? el('div', { class: 'th-term-d', text: t[2] }) : null,
    ])));
    if (opts.note) side.appendChild(el('p', { class: 'th-note', text: opts.note }));

    const bottom = el('div', { class: 'thbottom', 'data-thbottom': '1' });
    panel.appendChild(bottom);
    return { host: panel, mid, vis, side, bottom };
  }

  /* ---------------------------------------------------------------------
   * SUCCESS GATE — a large, unmistakable success panel with a green check.
   * The pupil's completed work is NOT cleared and the stage does NOT advance
   * on a timer. The panel stays for at least HOLD_MS, after which a separate
   * «التّالي» button appears; only pressing it advances. Guarded so repeated
   * clicks on Verify or Next can never advance twice.
   * ------------------------------------------------------------------- */
  const HOLD_MS = 5000;

  function successGate(host, opts) {
    opts = opts || {};
    let advanced = false, shownAt = 0, nextBtn = null, timer = null;
    const panel = el('div', {
      class: 'okpanel', 'data-success': '1', role: 'status', 'aria-live': 'polite', hidden: 'hidden',
      style: { display: 'none' },          /* neutral even before CSS applies */
    }, [
      el('div', { class: 'okcheck', 'aria-hidden': 'true' }, [tick()]),
      el('div', { class: 'oktext' }, [
        el('div', { class: 'oktitle', 'data-oktitle': '1', text: opts.title || 'إِجابَتُكَ صَحيحَةٌ!' }),
        el('div', { class: 'oksub', 'data-oksub': '1', text: opts.sub || '' }),
      ]),
      el('div', { class: 'okwait', 'data-okwait': '1', text: '' }),
    ]);
    host.appendChild(panel);

    function tick() {
      const g = svg('svg', { viewBox: '0 0 48 48', class: 'okmark', 'aria-hidden': 'true' });
      g.appendChild(svg('circle', { cx: 24, cy: 24, r: 21, fill: '#2E9E5B' }));
      g.appendChild(svg('path', {
        d: 'M14 25 L21 32 L34 17', stroke: '#FFFFFF', 'stroke-width': 5, fill: 'none',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      }));
      return g;
    }

    return {
      panel,
      get advanced() { return advanced; },
      get shown() { return !panel.hidden; },
      /* elapsed ms since the success panel appeared (for tests) */
      get heldMs() { return shownAt ? Date.now() - shownAt : 0; },
      show(title, sub) {
        if (!panel.hidden) return;              /* already showing: no re-trigger */
        panel.hidden = false;
        panel.style.display = '';               /* hand control back to the CSS */
        shownAt = Date.now();
        if (title) panel.querySelector('[data-oktitle]').textContent = title;
        if (sub != null) panel.querySelector('[data-oksub]').textContent = sub;
        const wait = panel.querySelector('[data-okwait]');
        wait.textContent = '…';
        panel.setAttribute('data-holding', '1');
        W.audio && W.audio.ok && W.audio.ok();
        /* a plain timer: it must survive stage-local cleanup, and it only
         * REVEALS the button — it never advances by itself. */
        timer = setTimeout(() => {
          if (!panel.isConnected) return;
          panel.setAttribute('data-holding', '0');
          wait.textContent = '';
          nextBtn = el('button', {
            class: 'nextbtn', type: 'button', 'data-act': 'next-stage', text: 'التّالي',
            onclick: () => {
              if (advanced) return;             /* no double advancement */
              advanced = true;
              nextBtn.disabled = true;
              opts.onNext && opts.onNext();
            },
          });
          wait.appendChild(nextBtn);
        }, opts.hold == null ? HOLD_MS : opts.hold);
      },
      hide() { panel.hidden = true; panel.style.display = 'none'; shownAt = 0; },
      /* full teardown: used on Reset / stage exit so no stale panel, button or
       * timer can survive into the next stage. */
      destroy() {
        advanced = true;                        /* neutralise any pending timer */
        if (timer) { clearTimeout(timer); timer = null; }
        if (nextBtn && nextBtn.parentNode) nextBtn.remove();
        nextBtn = null; shownAt = 0;
        if (panel.parentNode) panel.remove();
      },
    };
  }

  /* ---------------------------------------------------------------------
   * THE stage-progression component — used by EVERY stage in all fourteen
   * lessons. There is no automatic transition anywhere: on success the stage
   * keeps the pupil's answer (or the finished simulator state) on screen,

   * button. The stage advances only when that button is pressed, once.

        'stroke-linecap': 'round', 'stroke-linejoin': 'round',

      return g;

    /* built LAZILY, at the moment of success: a stage may call clearWork()
     * after constructing this component, and a panel created up front would be
     * silently detached. Building on demand makes ordering irrelevant. */
    function build() {
      const host = api.actions();
      panel = el('div', {
        class: 'okpanel', 'data-success': '1', role: 'status', 'aria-live': 'polite',
      }, [
        el('div', { class: 'okcheck', 'aria-hidden': 'true' }, [okTick()]),
        el('div', { class: 'oktext' }, [

          el('div', { class: 'oksub', 'data-oksub': '1', text: '' }),

   * script was perfectly correct to «add a motion block», because the first
   * script's motion sat nested inside a Repeat. The gate said pass, the
   * message said fail.

   * requirement, so the message the pupil reads always refers to the script

      class: 'runbtn', type: 'button', 'data-act': 'run', text: 'تَشْغيل',

      tryAuto() { if (!gated && opts.check) { const r = opts.check(); if (r && r.ok) doVerify(); } },
