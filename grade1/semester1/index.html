/* Location — inside a destination. The Computer Citadel courtyard hosts Unit 1's
 * six lesson stations as physical illustrated objects. Unbuilt lessons stay in
 * the world, dimmed, with a small "قريبًا" tag — never a placeholder page. */
W.scene.register('location', {
  mount(ctx) {
    const { el } = W.util;
    const unitId = (ctx.params && ctx.params.unit) || 'u1';
    const C = window.WAHAT_CURRICULUM;
    const unit = C.units.find(u => u.id === unitId) || C.units[0];

    ctx.root.classList.add('fade-scene');

    const wrap = el('div.world-wrap');
    const w3 = el('div.world3d');
    wrap.appendChild(w3);
    wrap.appendChild(el('div.grade'));
    wrap.appendChild(el('div.grain'));
    ctx.root.appendChild(wrap);
    W.art.parallax(ctx, wrap);

    ctx.root.appendChild(el('div.loc-title', { text: unit.place, dataset: { locTitle: '1' } }));
    const back = el('div.back-sign');
    back.appendChild(W.ui.iconBtn('العودة إلى الخريطة', '🗺️', () => { W.audio.click(); W.scene.go('journey'); }, { dataset: { action: 'home' } }));
    ctx.root.appendChild(back);
    const chrome = el('div.chrome', { style: 'inset-inline-start:auto' });
    chrome.appendChild(W.ui.muteBtn(ctx));
    ctx.root.appendChild(chrome);
    ctx.root.appendChild(W.ui.credit());

    const GROUNDS = {
      u1: { art: W.interiors.citadelCourtyard, stations: W.interiors.CITADEL_STATIONS, prompt: 'اختر درسًا من وحدة حاسوبي' },
      u2: { art: W.interiors.studioGrounds, stations: W.interiors.STUDIO_STATIONS, prompt: 'اختر درسًا من وحدة هيا نرسم' },
      u3: W.interiors.SKY_STATIONS ? { art: W.interiors.skyGrounds, stations: W.interiors.SKY_STATIONS, prompt: 'اختر درسًا من وحدة لنتصفح' } : null,
    };
    const gr = GROUNDS[unitId];
    if (gr) {
      w3.appendChild(gr.art());
      ctx.root.appendChild(el('div.speak', { text: gr.prompt, dataset: { speak: '1' } }));
      const layer = el('div', { style: 'position:absolute;inset:0;z-index:20' });
      ctx.root.appendChild(layer);

      /* ---- Lesson Station Layout Manager (v2 final) ----
       * Replaces scattered per-station coordinates with an evenly-spaced grid of
       * safe cells inside reserved margins, so station artwork AND its full name
       * plate always stay on-screen and never overlap. Balanced rows per unit:
       *   6 lessons -> 3 columns × 2 rows;  4 lessons -> 4 columns × 1 row. */
      function gridLayout(n) {
        // reserved safe margins (percent of scene): keeps plates off every edge
        /* FINAL POLISH (1): a taller bottom reserve lifts the whole station
         * group — artwork AND its name plate together — clear of the browser
         * edge and of the fixed controls (attribution / Back / Teacher Mode).
         * Same rule for all three units, applied in the shared manager. */
        const M = { top: 12, bottom: 28, left: 8, right: 8 };
        const cols = n <= 4 ? n : 3;
        const rows = Math.ceil(n / cols);
        const cellW = (100 - M.left - M.right) / cols;
        const bandTop = M.top, bandH = (100 - M.top - M.bottom);
        const rowH = bandH / rows;
        const cells = [];
        for (let i = 0; i < n; i++) {
          const r = Math.floor(i / cols), c = i % cols;
          const inRow = Math.min(cols, n - r * cols);
          const rowLeft = M.left + (cols - inRow) * cellW / 2;
          const cx = rowLeft + (c % inRow) * cellW + cellW / 2;
          // bias each row toward its upper portion so the plate below the art
          // stays within the row band (art centred a little above cell centre)
          const cy = bandTop + r * rowH + rowH * (rows > 1 ? 0.30 : 0.44);
          cells.push({ cx, cy, cellW });
        }
        return cells;
      }
      const cells = gridLayout(gr.stations.length);
      const stationW = Math.min(12.5, cells[0].cellW * 0.5); // art width ≤ cell

      gr.stations.forEach((stn, i) => {
        const lesson = C.lessons.find(l => l.id === stn.id);
        const built = W.lessons.has(stn.id);
        const st = W.store.lessonState(stn.id);
        const cell = cells[i];
        const hs = W.ui.hotspot({
          id: stn.id, dataset: { lesson: stn.id },
          x: cell.cx, y: cell.cy, w: stationW,
          cellW: cell.cellW,
          name: lesson.num + ' · ' + lesson.ar,
          art: W.interiors.station(stn.kind),
          locked: !built,
          done: st.completed,
          aria: built ? ('افتح الدرس ' + lesson.num + ': ' + lesson.ar) : ('الدرس ' + lesson.num + ' يُفتح قريبًا'),
        });
        if (built && !st.completed) hs.classList.add('beckon');
        layer.appendChild(hs);
        ctx.listen(hs, 'click', () => {
          if (!built) {
            hs.classList.remove('wiggle'); void hs.offsetWidth; hs.classList.add('wiggle');
            W.audio.hint();
            return;
          }
          W.audio.open();
          W.scene.go('lesson', { id: stn.id });
        });
      });
    } else {
      /* short visual preview for units whose lessons are not yet rebuilt */
      const pano = W.art.panorama({ time: 'dawn', progress: .5 });
      w3.appendChild(pano.svg);
      w3.style.transformOrigin = unitId === 'u2' ? '38% 58%' : '15% 42%';
      w3.style.transform = 'scale(2.2)';
      const veil = el('div', {
        style: 'position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 55%, rgba(10,6,20,.0), rgba(10,6,20,.55))',
      });
      const card = el('div', { style: 'text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--su)*10)' });
      const emblem = el('div', { style: 'width:calc(var(--su)*180);filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))' });
      emblem.appendChild(W.interiors.station(unitId === 'u2' ? 'workshop-gate' : 'final-gate'));
      card.appendChild(emblem);
      card.appendChild(el('div', { text: unit.place, style: 'font-size:calc(var(--su)*40);font-weight:700;color:#ffe9b8;text-shadow:0 3px 14px rgba(0,0,0,.8)' }));
      card.appendChild(el('div', { text: 'تُفتح أبوابها قريبًا', dataset: { soonPreview: '1' }, style: 'font-size:calc(var(--su)*22);color:#e8cf9b;text-shadow:0 2px 8px rgba(0,0,0,.7)' }));
      veil.appendChild(card);
      ctx.root.appendChild(veil);
    }
  },
});

/* ==== lessons/registry.js ==== */
/* Lesson registry + the shared 'lesson' scene.
 * Lesson implementations register here; missing ones get the honest notice. */
W.lessons = (function () {
  const defs = {};
  return {
    register(id, def) { defs[id] = def; },
    get(id) { return defs[id]; },
    get builtCount() { return Object.keys(defs).length; },
    has(id) { return !!defs[id]; },
  };
})();

W.scene.register('lesson', {
  mount(ctx) {
    const id = ctx.params.id;
    const lesson = window.WAHAT_CURRICULUM.lessons.find(l => l.id === id);
    if (!lesson) { W.scene.go('journey'); return; }
    if (!W.lessons.has(id)) { W.scene.go('location', { unit: lesson.unit }); return; }
    W.store.lessonOpened(id);
    const frame = W.ui.lessonFrame(ctx, lesson);
    const impl = W.lessons.get(id);
    if (!impl) { W.scene.go('location', { unit: lesson.unit }); return; }
    // v2: wrap every lesson in the four-mode hub (Learn/Practice/Challenge/Review).
    // The hub delegates "Learn With Me" to the lesson's own mount, and generates
    // the other three modes from shared curriculum data. One shared implementation.
    if (W.modeHub && W.modeHub.mount) { W.modeHub.mount(ctx, frame, lesson); }
    else { impl.mount(ctx, frame, lesson); }
  },
});

      { id: 'phone', ar: 'الهاتف الذكي', en: 'Smartphone', pc: true, touch: true },
      { id: 'desktopc', ar: 'الحاسوب', en: 'Computer', pc: true },
      { id: 'lamp', ar: 'المصباح', en: 'Lamp', pc: false },
      { id: 'fan', ar: 'المروحة', en: 'Fan', pc: false },
      { id: 'kettle', ar: 'الإبريق الكهربائي', en: 'Kettle', pc: false },
    ];

    const layer = el('div', { style: 'position:absolute;inset:0;z-index:16' });
    stage.appendChild(layer);
    const nodes = {};
    DEV.forEach(d => {
      const s = R.spots[d.id];
      const b = el('button.hdev', {
        dataset: { dev: d.id, pc: d.pc ? '1' : '0' }, 'aria-label': d.ar,
        style: `left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%`,
      });
      b.appendChild(W.interiors.homeDeviceArt(d.id));
      layer.appendChild(b);
      nodes[d.id] = b;
    });

    /* ---------- the lantern and its beam ---------- */
    const lant = el('div.hand-lantern', { dataset: { lantern: '1' }, style: 'left:50%;top:72%' });
    const grip = el('button.lgrip', { dataset: { lgrip: '1' }, 'aria-label': 'أمسك الفانوس وحرّكه' });
    const ls = sv('svg', { viewBox: '0 0 60 90', style: 'width:100%;height:auto;display:block' });
    ls.appendChild(sv('path', { d: 'M22 8 q 8 -8 16 0', fill: 'none', stroke: '#5d4126', 'stroke-width': 4 }));
    ls.appendChild(sv('rect', { x: 16, y: 12, width: 28, height: 8, rx: 3, fill: '#5d4126' }));
    ls.appendChild(sv('path', { d: 'M14 20 L46 20 L42 70 L18 70 Z', fill: 'rgba(255,225,160,.35)', stroke: '#5d4126', 'stroke-width': 4, 'stroke-linejoin': 'round' }));
    ls.appendChild(sv('circle', { cx: 30, cy: 46, r: 20, fill: 'url(#lampGlow)' }));
    ls.appendChild(sv('circle', { cx: 30, cy: 46, r: 11, fill: '#ffd166' }));
    ls.appendChild(sv('rect', { x: 12, y: 70, width: 36, height: 8, rx: 3, fill: '#5d4126' }));
    lant.appendChild(ls);
    lant.appendChild(grip);
    stage.appendChild(lant);

    let lx = 50, ly = 72, beamOn = true;
    function paintBeam() {
      lant.style.left = lx + '%'; lant.style.top = ly + '%';
      if (!beamOn) { veil.style.maskImage = 'none'; veil.style.webkitMaskImage = 'none'; return; }
      const m = `radial-gradient(circle at ${lx}% ${ly}%, rgba(0,0,0,0) 0 10%, rgba(0,0,0,.35) 17%, rgba(0,0,0,.85) 25%, #000 33%)`;
      veil.style.webkitMaskImage = m; veil.style.maskImage = m;
      relight();
    }
    function centerOf(node) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      return { x: (r.left + r.width / 2 - s.left) / s.width * 100, y: (r.top + r.height / 2 - s.top) / s.height * 100 };
    }
    const litTimers = {}, rings = {};
    function relight() {
      DEV.forEach(d => {
        const n = nodes[d.id];
        if (!n.isConnected || n.dataset.parked === '1') return;
        const c = centerOf(n);
        const dx = (c.x - lx) * 1.78, dy = c.y - ly;   // 16:9 stage — keep the beam round
        const near = Math.sqrt(dx * dx + dy * dy) < 18;
        n.classList.toggle('lit', near || n.dataset.found === '1');
        n.classList.toggle(d.pc ? 'thinking' : 'warm', near);
        if (near && !litTimers[d.id]) litTimers[d.id] = ctx.after(420, () => { if (d.pc) ring(n, d); });
        if (!near && litTimers[d.id]) { clearTimeout(litTimers[d.id]); litTimers[d.id] = null; }
      });
    }
    function ring(n, d) {
      if (rings[d.id] || phase !== 'find' || n.dataset.found === '1') return;
      const c = centerOf(n), r = n.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const w = r.width / s.width * 100;
      const g = el('div.think-ring', { style: `left:${c.x}%;top:${c.y}%;width:${(w * 1.3).toFixed(1)}%;aspect-ratio:1` });
      stage.appendChild(g);
      rings[d.id] = g;
      W.audio.note(660, .1);
    }
    let drag = null;
    ctx.listen(grip, 'pointerdown', ev => {
      ev.preventDefault(); grip.setPointerCapture(ev.pointerId);
      drag = { x: ev.clientX, y: ev.clientY };
    });
    ctx.listen(grip, 'pointermove', ev => {
      if (!drag) return;
      const s = stage.getBoundingClientRect();
      lx = W.util.clamp(lx + (ev.clientX - drag.x) / s.width * 100, 4, 96);
      ly = W.util.clamp(ly + (ev.clientY - drag.y) / s.height * 100, 6, 92);
      drag.x = ev.clientX; drag.y = ev.clientY;
      paintBeam();
    });
    ctx.listen(grip, 'pointerup', () => { drag = null; });
    ctx.after(60, paintBeam);
    ctx.listen(window, 'resize', paintBeam);
    ctx.after(140, () => {
      guide.step({
        sayAr: ['اسحب الفانوس فوق الجهاز.', 'اضغط الجهاز ليظهر اسمه.'],
        simplerAr: 'أمسك الفانوس، اسحبه فوق جهاز، ثم اضغط الجهاز',
        src: grip,
        demo: () => { const t = nodes.laptop; if (t) guide.handDrag(grip, t, { ms: 1600 }); },
      });
    });
    ctx.listen(grip, 'pointerdown', () => guide.bump());

    function chipOn(node, ar, en) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const chip = el('div.term-reveal', {
        style: `left:${(r.left + r.width / 2 - s.left) / s.width * 100}%;top:${(r.top - s.top) / s.height * 100}%`,
      });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }

    /* ---------- phases ---------- */
    let phase = 'find';
    const found = new Set(), shelved = new Set(), binned = new Set();
    let quizApi = null;
    /* item 2: the lantern must actually be OVER the device (same radius the
     * beam uses) — a bare click without dragging the lantern is not accepted. */
    function underLantern(node) {
      const c = centerOf(node);
      const dx = (c.x - lx) * 1.78, dy = c.y - ly;
      return Math.sqrt(dx * dx + dy * dy) < 18;
    }

    ctx.delegate('click', '.hdev', (ev, b) => {
      const d = DEV.find(x => x.id === b.dataset.dev);
      if (!d) return;
      if (phase === 'find') {
        if (!b.classList.contains('lit')) return;
        if (!d.pc) { W.fx.softHint(b); say('هذا لا يفكّر… أضئ غيره'); return; }
        if (found.has(d.id)) return;
        found.add(d.id); b.dataset.found = '1';
        if (rings[d.id]) { rings[d.id].remove(); rings[d.id] = null; }
        W.audio.open(); W.fx.sparkleAt(ctx.root, b, 6);
        chipOn(b, d.ar, d.en);
        lbl.reveal(b, d.ar, d.en, { id: d.id }); // the name rides the device to the shelf
        guide.clearSource();
        guide.confirm('وجدتَ ' + d.ar, b);
        const rem = 5 - found.size;
        if (rem > 0) ctx.after(800, () => { if (phase === 'find') say(['اسحب الفانوس فوق حاسوبٍ آخر. بقي ' + '٠١٢٣٤٥'[rem] + '.', 'اضغط الجهاز ليظهر اسمه.']); });
        if (found.size === 5) {
          check.done('find');
          phase = 'shelf';
          guide.done();
          R.shelf.forEach(s => stage.appendChild(el('div.smart-slot', { style: `left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%` })));
          ctx.after(500, () => say('اضغط كل حاسوب ليصعد إلى الرفّ'));
        }
      } else if (phase === 'shelf') {
        if (!d.pc) { W.fx.softHint(b); say('الحواسيب فقط تصعد'); return; }
        if (shelved.has(d.id)) return;
        const slot = R.shelf[shelved.size];
        shelved.add(d.id);
        b.dataset.parked = '1';
        b.style.transition = 'left .6s ease, top .6s ease, width .6s ease, height .6s ease';
        b.style.left = slot.x + '%'; b.style.top = slot.y + '%';
        b.style.width = slot.w + '%'; b.style.height = slot.h + '%';
        b.classList.add('lit', 'thinking');
        W.audio.success(); W.fx.sparkleAt(ctx.root, b, 5);
        if (shelved.size === 5) {
          check.done('shelf');
          phase = 'sort';
          say('ما ليس حاسوبًا؟ إلى السلة');
        }
      } else if (phase === 'sort') {
        if (d.pc) { W.fx.softHint(b); say('هذا حاسوب — اتركه'); return; }
        if (binned.has(d.id)) return;
        binned.add(d.id);
        b.dataset.parked = '1';
        b.style.transition = 'left .6s ease, top .6s ease, width .6s ease, height .6s ease';
        b.style.left = (R.basket.x + 1) + '%'; b.style.top = (R.basket.y - 1) + '%';
        b.style.width = '5%'; b.style.height = '8%';
        b.classList.add('lit');
        W.audio.click(); W.fx.sparkleAt(ctx.root, b, 4);
        lbl.action(b, d.ar, d.en, { ms: 2600 });
        if (binned.size === 3) {
          check.done('sort');
          phase = 'touch';
          beamOn = false; paintBeam();
          veil.style.opacity = '0';
          lant.style.opacity = '.4';
          ctx.after(700, touchPhase);
        }
      } else if (phase === 'touch') {
        if (d.touch) {
          const c = centerOf(b);
          const rg = el('div.touch-ring', { style: `left:${c.x}%;top:${c.y}%;width:7%;aspect-ratio:1;transform:translate(-50%,-50%)` });
          stage.appendChild(rg);
          ctx.after(1400, () => rg.remove());
          W.audio.success(); W.fx.sparkleAt(ctx.root, b, 6);
          chipOn(b, 'اللمس', 'Touch');
          check.done('touch');
          phase = 'wait';
          ctx.after(1700, startQuiz);
        } else { W.fx.softHint(b); say('شاشته تعمل باللمس'); }
      } else if (phase === 'q1') {
        if (!quizApi) return;
        if (!underLantern(b)) { say(['اسحب الفانوس فوق الحاسوب المحمول.', 'اضغطه.']); W.fx.glow(lant); return; }
        if (d.id === 'laptop') { chipOn(b, d.ar, d.en); quizApi.correct(b); }
        else quizApi.wrong(b);
      } else if (phase === 'q2') {
        if (!quizApi) return;
        if (d.touch) { chipOn(b, 'اللمس', 'Touch'); quizApi.correct(b); }
        else quizApi.wrong(b);
      } else if (phase === 'q4') {
        if (!quizApi) return;
        if (!underLantern(b)) { say('اسحب الفانوس فوق التلفاز الذكي، ثم اضغطه.'); W.fx.glow(lant); return; }
        if (d.id === 'smarttv') { chipOn(b, d.ar, d.en); quizApi.correct(b); }
        else quizApi.wrong(b);
      }
    });

    function touchPhase() {
      say('المس شاشة اللوحي بإصبعك');
      const t = nodes.tablet.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const f = el('div.finger', {
        style: `left:${((t.left + t.width / 2 - s.left) / s.width * 100 + 3).toFixed(1)}%;top:${((t.top + t.height * .6 - s.top) / s.height * 100).toFixed(1)}%`,
      });
      const fs = sv('svg', { viewBox: '0 0 40 60' });
      fs.appendChild(sv('path', { d: 'M14 58 L14 26 a 5 5 0 0 1 10 0 L24 14 a 4 4 0 0 1 8 0 L32 40 q 0 18 -9 18 Z', fill: '#f2c9a0', stroke: '#8a5a30', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }));
      f.appendChild(fs);
      stage.appendChild(f);
      ctx.after(7000, () => f.remove());
    }

    /* ---------- the house challenge ---------- */
    function picCard(kind, cap) {
      const c = el('button.choice-card.pic', { dataset: { pick: kind } });
      const s = sv('svg', { viewBox: '0 0 90 70' });
      if (kind === 'draw') {
        s.appendChild(sv('rect', { x: 8, y: 8, width: 74, height: 54, rx: 5, fill: '#fdfaf2', stroke: '#8a5a30', 'stroke-width': 3 }));
        s.appendChild(sv('path', { d: 'M16 52 L34 26 L48 44 L60 32 L74 52 Z', fill: '#3f9e6e' }));
        s.appendChild(sv('circle', { cx: 62, cy: 22, r: 7, fill: '#ffd166' }));
      } else if (kind === 'music') {
        s.appendChild(sv('rect', { x: 8, y: 8, width: 74, height: 54, rx: 5, fill: '#eaf2ff', stroke: '#3358a8', 'stroke-width': 3 }));
        s.appendChild(sv('path', { d: 'M36 46 V22 l22 -6 v24', fill: 'none', stroke: '#3358a8', 'stroke-width': 4, 'stroke-linecap': 'round' }));
        s.appendChild(sv('circle', { cx: 32, cy: 47, r: 6, fill: '#3358a8' }));
        s.appendChild(sv('circle', { cx: 54, cy: 41, r: 6, fill: '#3358a8' }));
      } else if (kind === 'water') {
        s.appendChild(sv('rect', { x: 8, y: 8, width: 74, height: 54, rx: 5, fill: '#e8f6ee', stroke: '#3e7d2e', 'stroke-width': 3 }));
        s.appendChild(sv('path', { d: 'M45 56 L45 30', stroke: '#8a5a30', 'stroke-width': 5 }));
        [[-1, 0], [1, 0], [-1, -1], [1, -1]].forEach(d => s.appendChild(sv('path', { d: `M45 32 q ${d[0] * 18} ${-6 + d[1] * 8} ${d[0] * 24} ${d[1] * 10}`, stroke: '#3f9e6e', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' })));
        s.appendChild(sv('path', { d: 'M12 56 q 14 -8 28 0', stroke: '#4c7fe2', 'stroke-width': 4, fill: 'none' }));
      } else {
        s.appendChild(sv('rect', { x: 8, y: 8, width: 74, height: 54, rx: 5, fill: '#fdeee2', stroke: '#a0522d', 'stroke-width': 3 }));
        s.appendChild(sv('path', { d: 'M24 34 h42 v14 a6 6 0 0 1 -6 6 h-30 a6 6 0 0 1 -6 -6 Z', fill: '#8a8f9a', stroke: '#4a4f5a', 'stroke-width': 3 }));
        s.appendChild(sv('path', { d: 'M66 38 h8 M34 28 q 5 -8 0 -14 M48 28 q 5 -8 0 -14', stroke: '#4a4f5a', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }));
      }
      c.appendChild(s);
      c.appendChild(el('span.cap', { text: cap }));
      return c;
    }

    function startQuiz() {
      guide.clearStage({ remove: ['.choice-row', '.finger', '.think-ring'] });
      say('تحدي البيت!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            beamOn = true; veil.style.opacity = '1'; lant.style.opacity = '1';
            paintBeam();
            say(['اسحب الفانوس فوق الحاسوب المحمول.', 'اضغطه.']);
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            beamOn = false; paintBeam(); veil.style.opacity = '0';
            say('أيّ جهاز نلمس شاشته؟');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            say('ماذا يفعل الحاسوب؟ اختر اثنين');
            const row = el('div.choice-row', { dataset: { picks: '1' }, style: 'position:absolute;bottom:4%;inset-inline:6%;z-index:34' });
            const want = new Set(['draw', 'music']);
            let hit = 0;
            [['draw', 'يرسم'], ['water', 'يسقي النخل'], ['music', 'يشغّل أنشودة'], ['cook', 'يطبخ الطعام']].forEach(([k, cap]) => {
              const c = picCard(k, cap);
              ctx.listen(c, 'click', () => {
                if (want.has(k) && !c.classList.contains('done')) {
                  c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5);
                  if (++hit === 2) { ctx.after(450, () => row.remove()); api.correct(); }
                } else if (!want.has(k)) { W.fx.softHint(c); say('هذا لا يفعله الحاسوب'); }
              });
              row.appendChild(c);
            });
            stage.appendChild(row);
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q4';
            /* the lantern must actually be used: relight the room veil */
            beamOn = true; veil.style.opacity = '1'; lant.style.opacity = '1';
            paintBeam();
            say('اسحب الفانوس فوق التلفاز الذكي، ثم اضغطه.');
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          veil.style.opacity = '0';
          lant.style.opacity = '.4';
          W.rig.complete(ctx, lesson, { impactAr: 'أضاء محراب الشاشة في القلعة!' });
        },
      });
    }
  },
});

/* ==== lessons/l1-2.js ==== */
/* Lesson 1.2 — أجزاء جهاز الحاسوب — the visual benchmark.
 * A detailed Omani technology workshop. Object first → child interacts →
 * Arabic term → English term → the environment answers.
 * Full curriculum flow: identify · place · connect · power ·
 * Dark Monitor · safe shutdown · safety · challenge. Prompts stay 2–7 words. */
W.lessons.register('1.2', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'identify', label: 'تعرّف على الأجزاء' },
      { id: 'place', label: 'رتّبها على الطاولة' },
      { id: 'connect', label: 'وصّلها بوحدة النظام' },
      { id: 'power', label: 'شغّل الحاسوب' },
      { id: 'dark', label: 'لغز الشاشة المظلمة' },
      { id: 'shutdown', label: 'أوقف التشغيل بأمان' },
      { id: 'quiz', label: 'تحدي الورشة' },
    ]);

    const lbl = W.label.group(ctx, stage);
    const room = W.interiors.workshopRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const dark = el('div', { style: 'position:absolute;inset:0;background:#0b1030;mix-blend-mode:multiply;opacity:0;transition:opacity 1.4s ease;pointer-events:none' });
    stage.appendChild(dark);

    const speak = el('div.speak', { text: 'اضغط كل جهاز لتعرف اسمه', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    const PARTS = [
      { id: 'monitor', ar: 'الشاشة', en: 'Monitor', w: 17 },
      { id: 'system', ar: 'وحدة النظام', en: 'System Unit', w: 11 },
      { id: 'keyboard', ar: 'لوحة المفاتيح', en: 'Keyboard', w: 15 },
      { id: 'mouse', ar: 'الفأرة', en: 'Mouse', w: 8 },
      { id: 'printer', ar: 'الطابعة', en: 'Printer', w: 13 },
      { id: 'speakers', ar: 'مكبّرات الصوت', en: 'Speakers', w: 12 },
    ];
    const SH = W.interiors.WORKSHOP_SPOTS.shelf, BN = W.interiors.WORKSHOP_SPOTS.bench;

    const cableLayer = sv('svg', { class: 'cable', viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;pointer-events:none;z-index:14' });
    stage.appendChild(cableLayer);

    const layer = el('div', { style: 'position:absolute;inset:0;z-index:16' });
    stage.appendChild(layer);

    const nodes = {}, slots = {}, cables = {};
    PARTS.forEach(p => {
      const s = el('div.slot', {
        dataset: { slot: p.id },
        style: `inset-inline-start:${BN[p.id].x}%;top:${BN[p.id].y}%;width:${BN[p.id].w}%;height:${BN[p.id].w * 1.1}%;opacity:0;transition:opacity .5s`,
      });
      layer.appendChild(s); slots[p.id] = s;
      const b = el('button.part', {
        dataset: { part: p.id }, 'aria-label': p.ar + ' — ' + p.en,
        style: `position:absolute;inset-inline-start:${SH[p.id].x}%;top:${SH[p.id].y}%;width:${p.w}%;border:none;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(10,4,0,.45))`,
      });
      b.appendChild(W.interiors.partArt(p.id));
      layer.appendChild(b); nodes[p.id] = b;
    });

    function termReveal(p, node) {
      const r = node.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const chip = el('div.term-reveal', {
        style: `inset-inline-start:${((r.left + r.width / 2 - sr.left) / sr.width) * 100}%;top:${((r.top - sr.top) / sr.height) * 100}%`,
      });
      chip.appendChild(el('span.t-ar', { text: p.ar }));
      chip.appendChild(el('span.t-en', { text: p.en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }

    let phase = 'identify';

    /* ---- guided step drivers: instruction + source + demo + confirmation ---- */
    function firstUnmet() { return PARTS.find(p => !met.has(p.id)); }
    function armIdentify() {
      const p = firstUnmet();
      if (!p) return;
      guide.step({
        sayAr: 'اضغط كل جهاز لتعرف اسمه',
        simplerAr: 'اضغط هذا الجهاز',
        src: nodes[p.id],
        demo: () => guide.handTap(nodes[p.id], 1),
      });
    }
    function firstUnplaced() { return PARTS.find(p => !nodes[p.id].classList.contains('placed')); }
    function placeStep() {
      const p = firstUnplaced();
      if (!p) return;
      guide.step({
        sayAr: 'اسحب ' + p.ar + ' إلى مكانها على الطاولة',
        simplerAr: 'ضع ' + p.ar + ' داخل الإطار المنقّط',
        src: nodes[p.id],
        tgt: slots[p.id],
        demo: () => guide.handDrag(nodes[p.id], slots[p.id], { ms: 1400 }),
      });
    }

    /* ---- identify: object first, then the name appears ---- */
    const met = new Set();
    ctx.after(80, armIdentify);
    ctx.delegate('click', '.part', (ev, b) => {
      if (phase !== 'identify') return;
      const p = PARTS.find(x => x.id === b.dataset.part);
      if (!p || met.has(p.id)) return;
      met.add(p.id);
      W.audio.open(); W.fx.sparkleAt(ctx.root, b, 6);
      termReveal(p, b);
      lbl.reveal(b, p.ar, p.en, { id: p.id });   // the name stays on the object and travels with it
      if (lbl.onlyFull) lbl.onlyFull(b);          // only the newest label stays expanded; others go mini
      guide.bump();
      if (met.size === PARTS.length) {
        check.done('identify');
        phase = 'place';
        Object.values(slots).forEach(s => s.style.opacity = '1');
        placeStep();
      } else {
        armIdentify();
      }
    });

    /* ---- place onto the bench ---- */
    let placedCount = 0;
    PARTS.forEach(p => {
      W.util.draggable(ctx, nodes[p.id], {
        disabled: () => phase !== 'place' || nodes[p.id].classList.contains('placed'),
        onDrop() {
          const b = nodes[p.id], s = slots[p.id];
          if (W.util.overlaps(b, s, 10)) {
            const rr = layer.getBoundingClientRect(), sr = s.getBoundingClientRect(), br = b.getBoundingClientRect();
            b.style.insetInlineStart = ((sr.left + sr.width / 2 - br.width / 2 - rr.left) / rr.width * 100) + '%';
            b.style.top = ((sr.top + sr.height / 2 - br.height / 2 - rr.top) / rr.height * 100) + '%';
            b.classList.add('placed'); s.classList.add('filled');
            lbl.flash(b);
            guide.clearSource(); guide.clearTarget();
            guide.confirm('وضعتَ ' + p.ar, b);
            if (++placedCount === PARTS.length) {
              check.done('place');
              phase = 'connect';
              room.refs.shaft.setAttribute('opacity', '.26');
              guide.done();
              ctx.after(700, startConnect);
            } else placeStep();
          } else if (PARTS.some(q => q.id !== p.id && W.util.overlaps(b, slots[q.id], 2))) {
            // say exactly what to do next, never a bare "try again"
            W.fx.softHint(b);
            say('ضع ' + p.ar + ' داخل إطارها المنقّط');
            W.fx.glow(slots[p.id]);
          }
        },
      });
    });

    /* ---- connect: peripherals join the System Unit, never each other ----
     * Checkpoint 4U redesign: placement outlines fade away, two step badges lead
     * the child, the chosen device gets a strong amber outline, the System Unit
     * pulses, a dotted preview cable previews the route, and the finished cable is
     * a thick double-stroke line with a travelling light pulse and end nodes.
     * Each device owns its own routing lane so five cables never merge. */
    const needCable = ['monitor', 'keyboard', 'mouse', 'printer', 'speakers'];
    const connected = new Set();
    let picked = null, steps = null, prog = null;
    // separate curved lanes, so the bundle stays readable
    const LANE = { monitor: 30, keyboard: 62, mouse: 94, printer: 126, speakers: 158 };

    function startConnect() {
      // 1) fade out every placement-slot outline — they are done with their job
      Object.values(slots).forEach(s => { s.style.transition = 'opacity .6s ease'; s.style.opacity = '0'; });
      ctx.after(650, () => Object.values(slots).forEach(s => s.classList.add('slot-gone')));
      /* item 3: BEFORE the connection activity, teach the concept clearly.
       * The System Unit is highlighted as the one central destination, and
       * faint preview routes briefly appear from all five devices to it. */
      say('سنصل جميع الأجهزة بوحدة النظام.');
      guide.target(nodes.system);
      W.fx.glow(nodes.system);
      const previews = [];
      needCable.forEach(id => {
        const a = guide.pt(nodes[id], .78), b2 = guide.pt(nodes.system, .86);
        const midY = Math.max(a.y, b2.y) + (LANE[id] || 60);
        const pv = sv('path', {
          d: `M ${a.x} ${a.y} C ${a.x} ${midY}, ${b2.x} ${midY}, ${b2.x} ${b2.y}`,
          fill: 'none', stroke: '#ffd166', 'stroke-width': 5, 'stroke-linecap': 'round',
          'stroke-dasharray': '2 18', opacity: '.38', 'vector-effect': 'non-scaling-stroke',
          class: 'g-preview',
        });
        guide.svgL.appendChild(pv);
        previews.push(pv);
      });
      ctx.after(3600, () => {
        previews.forEach(pv => { if (pv.isConnected) pv.remove(); });
        guide.clearTarget();
        // 3) two visual step badges
        steps = guide.badges(['اختر جهازًا', 'اضغط وحدة النظام']);
        steps.at(0);
        // child-friendly progress: five device lamps that light one by one
        prog = guide.progress(needCable.length, { pos: { x: 42, y: 8 } });
        armPick();
      });
    }
    function nextToConnect() { return needCable.find(id => !connected.has(id)); }
    function armPick() {
      picked = null;
      guide.clearPreview();
      if (steps) steps.at(0);
      const id = nextToConnect();
      if (!id) return;
      const p = PARTS.find(x => x.id === id);
      // 2) pulse one suitable peripheral as the first example
      guide.step({
        sayAr: 'اضغط ' + p.ar + '، ثم وحدة النظام',
        simplerAr: 'اضغط ' + p.ar + ' أولًا',
        src: nodes[id],
        demo: () => guide.handTap(nodes[id], 1),
      });
    }
    function armSystem(id) {
      const p = PARTS.find(x => x.id === id);
      if (steps) steps.at(1);
      guide.step({
        sayAr: 'الآن اضغط وحدة النظام',
        simplerAr: 'اضغط الصندوق في الوسط',
        src: nodes[id],
        tgt: nodes.system,
        demo: () => guide.handTap(nodes.system, 1),
      });
      // 4) an animated dotted preview cable toward the exact target
      guide.preview(nodes[id], nodes.system, { ay: .78, by: .86, sag: LANE[id] || 60 });
    }

    ctx.delegate('click', '.part', (ev, b) => {
      if (phase !== 'connect') return;
      const id = b.dataset.part;
      if (id === 'system') {
        if (!picked) {
          W.fx.softHint(b);
          const nx = nextToConnect();
          say('اضغط ' + (PARTS.find(x => x.id === nx) || {}).ar + ' أولًا');
          if (nx) W.fx.glow(nodes[nx]);
          return;
        }
        const p = PARTS.find(x => x.id === picked);
        connected.add(picked);
        guide.clearPreview();
        // 5) a thick permanent cable with a travelling light pulse
        const c = guide.cable(nodes[picked], nodes.system, { ay: .78, by: .86, sag: LANE[picked] || 60, id: picked });
        cables[picked] = c;
        // keep the active connection brightest; calm the older ones but stay readable
        Object.keys(cables).forEach(k => { if (k !== picked) cables[k].calm(); });
        nodes[picked].classList.remove('g-src');
        nodes[picked].classList.add('wired');
        guide.clearSource(); guide.clearTarget();
        if (prog) prog.light(connected.size - 1);
        // 5) confirm the exact device name, then say what remains, child-friendly
        guide.confirm('تم توصيل ' + p.ar, b);
        const left = needCable.length - connected.size;
        picked = null;
        if (left > 0) {
          const NUM = ['', 'جهاز واحد', 'جهازان', '٣ أجهزة', '٤ أجهزة'];
          ctx.after(900, () => {
            if (phase !== 'connect') return;
            say('بقي ' + (NUM[left] || left + ' أجهزة'));
            ctx.after(800, () => { if (phase === 'connect') armPick(); });
          });
        } else {
          check.done('connect');
          /* hold phase: the same click must not also press the power button */
          phase = 'connected-hold';
          guide.done();
          if (steps) steps.remove();
          if (prog) prog.remove();
          /* item 3: celebrate the completed diagram and KEEP it visible long
           * enough for the pupil to understand it before moving on. */
          say('أحسنت! أصبحت جميع الأجهزة متصلة بوحدة النظام.');
          ctx.after(4200, powerStep);
        }
      } else if (picked && picked !== id) {
        W.fx.softHint(b);
        const p = PARTS.find(x => x.id === picked);
        say('الأجهزة لا تتصل ببعضها — اضغط وحدة النظام');
        W.fx.glow(nodes.system);
        void p;
      } else if (!connected.has(id) && needCable.includes(id)) {
        picked = id;
        W.audio.click();
        guide.source(nodes[id], true);
        armSystem(id);
      }
    });

    function powerStep() {
      phase = 'power';
      guide.step({
        sayAr: 'اضغط زرّ التشغيل في وحدة النظام',
        simplerAr: 'اضغط الزرّ المستدير في الصندوق',
        src: nodes.system,
        demo: () => guide.handTap(nodes.system, 1, { ky: .62 }),
      });
    }


    /* ---- power on: the System Unit leads ---- */
    const led = () => nodes.system.querySelector('.part-led');
    const screenRect = () => nodes.monitor.querySelector('.part-screen');
    const screenMsg = el('div', {
      dataset: { screenmsg: '1' },
      style: 'position:absolute;display:grid;place-items:center;text-align:center;color:#dffbf8;' +
             'font-weight:700;font-size:calc(var(--su)*22);pointer-events:none;opacity:0;transition:opacity .5s;z-index:18',
    });
    stage.appendChild(screenMsg);
    function placeScreenMsg() {
      const rr = stage.getBoundingClientRect(), r = screenRect().getBoundingClientRect();
      screenMsg.style.left = (r.left - rr.left) + 'px'; screenMsg.style.top = (r.top - rr.top) + 'px';
      screenMsg.style.width = r.width + 'px'; screenMsg.style.height = r.height + 'px';
    }
    let sysOn = false, monOn = false, melodyTimer = null;
    function melody(on) {
      if (on && !melodyTimer) {
        const notes = [392, 440, 523, 440, 392, 330];
        let i = 0;
        melodyTimer = ctx.every(430, () => { W.audio.note(notes[i % notes.length], 0.3); i++; });
      } else if (!on && melodyTimer) { clearInterval(melodyTimer); melodyTimer = null; }
    }
    ctx.delegate('click', '.part', (ev, b) => {
      if (phase !== 'power') return;
      if (b.dataset.part === 'system' && !sysOn) {
        sysOn = true; led().setAttribute('fill', '#5fc08f');
        W.audio.open(); W.fx.glow(b);
        guide.clearSource();
        guide.step({
          sayAr: 'أضاء المصباح! الآن اضغط زرّ الشاشة',
          simplerAr: 'اضغط الزرّ الصغير في الشاشة',
          src: nodes.monitor,
          demo: () => guide.handTap(nodes.monitor, 1, { ky: .68 }),
        });
      } else if (b.dataset.part === 'monitor') {
        if (!sysOn) { W.fx.softHint(b); say('وحدة النظام أولًا'); return; }
        monOn = true; screenRect().setAttribute('fill', 'url(#domeTeal)');
        placeScreenMsg(); screenMsg.textContent = 'مرحبًا!'; screenMsg.style.opacity = '1';
        guide.done();
        guide.confirm('شغّلتَ الحاسوب!', b);
        check.done('power');
        phase = 'dark';
        ctx.after(1200, darkMonitor);
      }
    });

    /* ---- the Dark Monitor ---- */
    let waking = false, wakeInput = null;
    function darkMonitor() {
      say('اسمع الأنشودة!');
      melody(true);
      ctx.after(1700, () => {
        say('أطفئ الشاشة فقط', 'زرّ الشاشة الصغير');
        nodes.monitor.querySelector('.part-monbtn').classList.add('glow-pulse');
        ctx.delegate('click', '.part', (ev, b) => {
          if (phase !== 'dark' || b.dataset.part !== 'monitor' || !monOn) return;
          monOn = false;
          screenRect().setAttribute('fill', '#0e1c33');
          screenMsg.style.opacity = '0';
          dark.style.opacity = '.35';
          say('الشاشة نامت… والأنشودة مستمرة! ما زال شيء يعمل — انقره');
          phase = 'dark-find';
        });
      });
    }
    ctx.delegate('click', '.part', (ev, b) => {
      if (phase !== 'dark-find') return;
      if (b.dataset.part === 'system') {
        W.audio.success(); W.fx.sparkleAt(ctx.root, b, 9);
        startWakeExperiment();
      } else {
        W.fx.softHint(b);
        say('انظر إلى المصباح المضيء');
      }
    });

    /* ---- deliberate wake experiment (item 5 redesign) ----
     * The child must make ONE deliberate action inside a defined wake zone,
     * or press a keyboard key. Ordinary background movement is IGNORED. */
    let wakeZone = null;
    function startWakeExperiment() {
      phase = 'wake'; waking = true; wakeInput = null;
      say('أيقِظ الشاشة بطريقةٍ واحدة.', 'حرّك الفأرة داخل المربّع، أو اضغط مفتاحًا');
      // a clearly-bounded wake zone on the desk in front of the monitor
      if (wakeZone) wakeZone.remove();
      wakeZone = el('div.wake-zone', { dataset: { wakezone: '1' }, text: 'حرّك الفأرة هنا' });
      stage.appendChild(wakeZone);
      // «أرِني»: demonstrate a mouse wiggle inside the zone
      guide.step && guide.step({
        sayAr: 'أيقِظ الشاشة بطريقةٍ واحدة.',
        simplerAr: 'حرّك الفأرة داخل المربّع، أو اضغط مفتاحًا',
        src: wakeZone,
        demo: () => { guide.handWiggle ? guide.handWiggle(wakeZone) : (guide.handTap && guide.handTap(wakeZone, 2)); },
      });
      // deliberate mouse wake ONLY inside the zone
      ctx.listen(wakeZone, 'pointermove', () => { if (phase === 'wake' && waking) { wakeInput = 'mouse'; wakeUp(); } });
      // deliberate keyboard wake: any real key
      ctx.listen(window, 'keydown', (e) => { if (phase === 'wake' && waking) { wakeInput = 'keyboard'; wakeUp(); } });
    }
    function wakeUp() {
      if (!waking) return;
      waking = false; phase = 'who';
      if (wakeZone) { wakeZone.remove(); wakeZone = null; }
      guide.clearStage && guide.clearStage();
      monOn = true; screenRect().setAttribute('fill', 'url(#domeTeal)');
      melody(false);
      dark.style.opacity = '0';
      placeScreenMsg(); screenMsg.textContent = 'مَن أيقظني؟'; screenMsg.style.opacity = '1';
      W.audio.open();
      // ask explicitly which object, and highlight ONLY the correct one
      const rightId = wakeInput === 'mouse' ? 'mouse' : 'keyboard';
      const rightAr = wakeInput === 'mouse' ? 'الفأرة' : 'لوحة المفاتيح';
      say(`اضغط ${rightAr} التي أيقظت الشاشة.`, rightId === 'mouse' ? 'Mouse' : 'Keyboard');
      if (nodes[rightId]) {
        W.fx.glow(nodes[rightId]);
        guide.step && guide.step({
          sayAr: `اضغط ${rightAr} التي أيقظت الشاشة.`,
          src: nodes[rightId],
          demo: () => { guide.handTap && guide.handTap(nodes[rightId], 1); },
        });
      }
    }
    ctx.delegate('click', '.part', (ev, b) => {
      if (phase !== 'who') return;
      const id = b.dataset.part;
      const right = wakeInput === 'mouse' ? 'mouse' : 'keyboard';
      if (id === right) {
        guide.clearStage && guide.clearStage();
        screenMsg.textContent = (right === 'mouse' ? 'الفأرة أيقظتني!' : 'لوحة المفاتيح أيقظتني!');
        W.audio.success(); W.fx.sparkleAt(ctx.root, b, 8);
        check.done('dark');
        phase = 'shutdown';
        ctx.after(1300, shutdownPhase);
      } else if (id === 'mouse' || id === 'keyboard') {
        // wrong of the two — let them retry the experiment
        W.fx.softHint(b);
        say(`ليست هذه. جرّب مرّةً أخرى: اضغط ${right === 'mouse' ? 'الفأرة' : 'لوحة المفاتيح'}.`, '');
        if (nodes[right]) W.fx.glow(nodes[right]);
      }
    });

    /* ---- shut down safely (via بدء, never the power button) ---- */
    function shutdownPhase() {
      say('أوقف التشغيل بأمان');
      placeScreenMsg();
      screenMsg.style.pointerEvents = 'auto';
      screenMsg.innerHTML = '';
      const menu = el('div', { style: 'display:flex;flex-direction:column;gap:6px;align-items:center' });
      const startB = el('button.btn.primary', { text: 'بدء', dataset: { sim: 'start' }, style: 'font-size:calc(var(--su)*18);padding:calc(var(--su)*3) calc(var(--su)*16)' });
      menu.appendChild(startB);
      screenMsg.appendChild(menu);
      let opened = false;
      ctx.listen(startB, 'click', () => {
        if (opened) return; opened = true;
        W.audio.click();
        const off = el('button.btn', { text: '⏻ إيقاف التشغيل', dataset: { sim: 'shutdown' }, style: 'font-size:calc(var(--su)*16);padding:calc(var(--su)*3) calc(var(--su)*12)' });
        menu.appendChild(off);
        ctx.listen(off, 'click', () => {
          screenMsg.style.pointerEvents = 'none';
          screenMsg.textContent = 'إلى اللقاء!';
          ctx.after(750, () => {
            screenRect().setAttribute('fill', '#0e1c33');
            screenMsg.style.opacity = '0';
            led().setAttribute('fill', '#4e4436');
            sysOn = false; monOn = false;
            W.audio.click();
            check.done('shutdown');
            say('أغلقناه بأمان من بدء');
            phase = 'quiz';
            ctx.after(1100, assessment);
          });
        });
      });
      ctx.delegate('click', '.part', (ev, b) => {
        if (phase !== 'shutdown') return;
        if (b.dataset.part === 'system' && sysOn) {
          W.fx.softHint(b);
          say('ليس من الزر!', 'قد يتلف الجهاز — من قائمة بدء');
        }
      });
    }

    /* ---- workshop challenge ---- */
    function assessment() {
      guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
      say('تحدي الورشة!');
      let active;
      const tasks = [
        {
          mount(stageEl, api) {
            const want = ['keyboard', 'printer', 'speakers'];
            let i = 0; active = true;
            say('انقر: ' + PARTS.find(p => p.id === want[0]).ar);
            ctx.delegate('click', '.part', (ev, b) => {
              if (!active) return;
              if (b.dataset.part === want[i]) {
                W.audio.success(); W.fx.sparkleAt(ctx.root, b, 5);
                termReveal(PARTS.find(p => p.id === want[i]), b);
                i++;
                if (i === want.length) { active = false; api.correct(b); }
                else say('انقر: ' + PARTS.find(p => p.id === want[i]).ar);
              } else api.wrong(b);
            });
          },
        },
        {
          mount(stageEl, api) {
            active = true;
            say('مَن يتحكم بالجميع؟ انقره');
            ctx.delegate('click', '.part', (ev, b) => {
              if (!active) return;
              if (b.dataset.part === 'system') {
                active = false;
                termReveal(PARTS[1], b);
                api.correct(b);
              } else api.wrong(b);
            });
          },
        },
        {
          mount(stageEl, api) {
            guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
            say('اضغط السلوكين الآمنين');
            const row = el('div.choice-row', { style: 'position:absolute;bottom:4%;inset-inline:5%;z-index:22' });
            [['يداي نظيفتان وجافتان', true], ['آكل بجانب الجهاز', false],
             ['أجلس باعتدال', true], ['أشدّ الأسلاك بنفسي', false]]
              .forEach(([t, ok]) => {
                const c = el('button.choice-card', { text: t });
                ctx.listen(c, 'click', () => {
                  if (ok) {
                    c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5);
                    if (row.querySelectorAll('.choice-card.done').length === 2) { row.remove(); api.correct(); }
                  } else W.fx.softHint(c);
                });
                row.appendChild(c);
              });
            stageEl.appendChild(row);
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          room.refs.shaft.setAttribute('opacity', '.34');
          W.rig.complete(ctx, lesson, { impactAr: 'استيقظت ورشة القلعة!' });
        },
      });
    }
  },
});

/* ==== lessons/l1-3.js ==== */
/* Lesson 1.3 — سطح المكتب.
 * Unique mechanic: LIGHT-THREAD PAIRING. Wooden shutters hide a living desktop.
 * The child pulls them open, then draws a thread of light from a REAL thing on the
 * table to the icon that stands for it — an icon is a door, not a decoration.
 * Flow: open · pair · Start · file types · desktop challenge. */
W.lessons.register('1.3', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'open', label: 'افتح المصراعين' },
      { id: 'pair', label: 'صِل الشيء بأيقونته' },
      { id: 'start', label: 'زرّ بدء' },
      { id: 'files', label: 'أنواع الملفات' },
      { id: 'quiz', label: 'تحدي سطح المكتب' },
    ]);

    const lbl = W.label.group(ctx, stage);
    const room = W.interiors.iconWorkshop();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اسحب المصراعين إلى الجانبين', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    function chipAt(x, y, ar, en) {
      const chip = el('div.term-reveal', { style: `left:${x}%;top:${y}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }
    function chipOn(node, ar, en) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      chipAt((r.left + r.width / 2 - s.left) / s.width * 100, (r.top - s.top) / s.height * 100, ar, en);
    }

    /* ---------- the desktop behind the shutters ---------- */
    const dsk = W.apps.deskScreen({ pos: R.screen, ctx, stage });
    stage.appendChild(dsk.root);
    dsk.root.style.zIndex = '14';
    const ICONS = [
      { id: 'docs', ar: 'المستندات', en: 'Documents', kind: 'docs', x: 5, y: 8 },
      { id: 'thispc', ar: 'هذا الحاسوب الشخصي', en: 'This PC', kind: 'thispc', x: 5, y: 46 },
      { id: 'recycle', ar: 'سلة المحذوفات', en: 'Recycle Bin', kind: 'recycle', x: 62, y: 8 },
      { id: 'browser', ar: 'المتصفح', en: 'Browser', kind: 'browser', x: 62, y: 46 },
    ];
    ICONS.forEach(i => dsk.addIcon(i.id, i.ar, i.kind, i.x, i.y));

    /* ---------- shutters: two grips to pull ---------- */
    let opened = 0;
    const grips = {};
    ctx.after(120, () => {
      guide.step({
        sayAr: 'اسحب المصراعين إلى الجانبين',
        simplerAr: 'اسحب هذا المصراع إلى الجانب',
        src: grips.l,
        demo: () => {
          if (grips.l) guide.handDrag(grips.l, null, { ms: 1300, dx: -150 });
          if (grips.l) W.fx.glow(grips.l);
        },
      });
    });
    [['l', R.screen.x, -1], ['r', R.screen.x + R.screen.w / 2, 1]].forEach(([side, gx, dir]) => {
      const grip = el('button.shutter-grip', {
        dataset: { grip: side }, 'aria-label': 'افتح المصراع',
        style: `left:${gx}%;top:${R.screen.y}%;width:${R.screen.w / 2}%;height:${R.screen.h}%`,
      });
      stage.appendChild(grip);
      grip.classList.add('draggable-grip');
      // a permanent direction arrow tells the child which way this shutter pulls
      guide.arrow(grip, dir < 0 ? 'left' : 'right', { len: 78 });
      grips[side] = grip;
      let d = null, off = 0;
      const grp = R.shutters[side];
      ctx.listen(grip, 'pointerdown', ev => { ev.preventDefault(); grip.setPointerCapture(ev.pointerId); d = ev.clientX; guide.bump(); });
      ctx.listen(grip, 'pointermove', ev => {
        if (d === null) return;
        const s = stage.getBoundingClientRect();
        off = W.util.clamp(off + (ev.clientX - d) / s.width * 1366, dir < 0 ? -340 : 0, dir < 0 ? 0 : 340);
        d = ev.clientX;
        grp.setAttribute('transform', `translate(${off} 0)`);
        if (Math.abs(off) > 150) finish();
      });
      ctx.listen(grip, 'pointerup', () => { d = null; });
      let done = false;
      function finish() {
        if (done) return;
        done = true; d = null;
        grp.style.transition = 'transform .6s ease';
        grp.setAttribute('transform', `translate(${dir * 340} 0)`);
        grip.remove();
        W.audio.open();
        if (++opened === 2) {
          check.done('open');
          guide.done();
          W.fx.sparkleAt(ctx.root, dsk.root, 9);
          chipAt(R.screen.x + R.screen.w / 2, R.screen.y + 8, 'سطح المكتب', 'Desktop');
          lbl.reveal(dsk.root, 'سطح المكتب', 'Desktop', { pos: 'inside-top', id: 'desktop' });
          phase = 'pair';
          things();
          ctx.after(1200, armPair);
        }
      }
    });

    /* ---------- real things + light threads ---------- */
    const PAIRS = [
      { thing: 'paper', icon: 'docs', ar: 'المستندات', en: 'Documents' },
      { thing: 'box', icon: 'thispc', ar: 'هذا الحاسوب الشخصي', en: 'This PC' },
      { thing: 'basket', icon: 'recycle', ar: 'سلة المحذوفات', en: 'Recycle Bin' },
      { thing: 'globe', icon: 'browser', ar: 'المتصفح', en: 'Browser' },
    ];
    const threads = sv('svg', { class: 'thread-layer', viewBox: '0 0 100 100', preserveAspectRatio: 'none' });
    stage.appendChild(threads);
    let live = null;
    function pctOf(node) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      return { x: (r.left + r.width / 2 - s.left) / s.width * 100, y: (r.top + r.height / 2 - s.top) / s.height * 100 };
    }
    const thingNodes = {};
    function things() {
      PAIRS.forEach(p => {
        const s = R.spots[p.thing];
        const b = el('button.rthing', { dataset: { thing: p.thing }, 'aria-label': 'شيء من بيتنا', style: `left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%` });
        b.appendChild(W.interiors.realThingArt(p.thing));
        stage.appendChild(b);
        thingNodes[p.thing] = b;
        ctx.listen(b, 'pointerdown', ev => {
          if (phase !== 'pair' || b.classList.contains('paired')) return;
          ev.preventDefault(); b.setPointerCapture(ev.pointerId);
          const a = pctOf(b);
          const outer = sv('path', { d: '', fill: 'none', stroke: '#1b1209', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round' });
          const path = sv('path', { d: '', fill: 'none', stroke: '#ffd166', 'stroke-width': 0.85, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round', style: 'filter:drop-shadow(0 0 4px rgba(255,209,102,.95))' });
          const dot = sv('circle', { cx: a.x, cy: a.y, r: 1.1, fill: '#fff6dd', stroke: '#1b1209', 'stroke-width': .4, 'vector-effect': 'non-scaling-stroke' });
          const head = sv('circle', { cx: a.x, cy: a.y, r: 1.4, fill: '#ffd166', stroke: '#1b1209', 'stroke-width': .4, 'vector-effect': 'non-scaling-stroke', style: 'filter:drop-shadow(0 0 5px rgba(255,209,102,1))' });
          threads.appendChild(outer); threads.appendChild(path); threads.appendChild(dot); threads.appendChild(head);
          live = { p, a, path, outer, dot, head };
        });
        ctx.listen(b, 'pointermove', ev => {
          if (!live) return;
          const s2 = stage.getBoundingClientRect();
          const x = (ev.clientX - s2.left) / s2.width * 100, y = (ev.clientY - s2.top) / s2.height * 100;
          const d = `M ${live.a.x} ${live.a.y} L ${x} ${y}`;
          live.path.setAttribute('d', d); live.outer.setAttribute('d', d);
          live.head.setAttribute('cx', x); live.head.setAttribute('cy', y);
          live.last = { cx: ev.clientX, cy: ev.clientY };
          // the icon grows and pulses as the thread approaches it. During a drag the
          // pointer is captured by the thing itself, so hit-testing would always
          // return the source — measure the real distance to each icon instead.
          let near = null, best = 1e9;
          Object.values(dsk.icons).forEach(i => {
            const r = i.getBoundingClientRect();
            const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
            const d2 = Math.hypot(dx, dy);
            if (d2 < Math.max(r.width, r.height) * 1.6 && d2 < best) { best = d2; near = i; }
          });
          Object.values(dsk.icons).forEach(i => i.classList.toggle('near', i === near));
        });
        ctx.listen(b, 'pointerup', () => {
          if (!live) return;
          const cur = live;
          live = null;
          // Resolve the drop by geometry, not hit-testing: the thread's own head and
          // strokes sit under the cursor and would otherwise swallow the target.
          let ico = null, bestD = 1e9;
          if (cur.last) {
            Object.values(dsk.icons).forEach(i => {
              const r = i.getBoundingClientRect();
              const d = Math.hypot(cur.last.cx - (r.left + r.width / 2), cur.last.cy - (r.top + r.height / 2));
              if (d < Math.max(r.width, r.height) * 1.6 && d < bestD) { bestD = d; ico = i; }
            });
          }
          Object.values(dsk.icons).forEach(i => i.classList.remove('near'));
          if (ico && ico.dataset.icon === cur.p.icon) {
            const t = pctOf(ico);
            const dd = `M ${cur.a.x} ${cur.a.y} Q ${(cur.a.x + t.x) / 2} ${Math.min(cur.a.y, t.y) - 8} ${t.x} ${t.y}`;
            cur.path.setAttribute('d', dd); cur.path.setAttribute('stroke-width', 1.1);
            cur.outer.setAttribute('d', dd); cur.outer.setAttribute('stroke-width', 1.9);
            cur.head.setAttribute('cx', t.x); cur.head.setAttribute('cy', t.y);
            ico.classList.add('glow');
            b.classList.add('paired');
            chipOn(ico, cur.p.ar, cur.p.en);
            W.apps.bilingual(ico, cur.p.en);
            guide.clearSource(); guide.clearTarget();
            guide.confirm('وصّلتَ ' + cur.p.ar, ico);
            paired++;
            if (paired === PAIRS.length) {
              check.done('pair');
              phase = 'start';
              // the matching stage is over: its threads, dots and arrows go with it
              ctx.after(600, () => guide.clearStage({ remove: ['.thread-layer path', '.thread-layer circle', '.rthing'] }));
              ctx.after(900, () => {
                guide.step({
                  sayAr: 'اضغط زرّ بدء في أسفل الشاشة',
                  simplerAr: 'اضغط الزرّ الأخضر في الشريط',
                  src: dsk.start,
                  demo: () => guide.handTap(dsk.start, 1),
                });
              });
            } else ctx.after(700, armPair);
          } else {
            // show the thread travelling back home instead of a bare "try another"
            const back = 260;
            [cur.path, cur.outer].forEach(x => { x.style.transition = `opacity ${back}ms ease`; });
            const t0 = performance.now();
            const from = cur.last ? { x: (cur.last.cx - stage.getBoundingClientRect().left) / stage.getBoundingClientRect().width * 100, y: (cur.last.cy - stage.getBoundingClientRect().top) / stage.getBoundingClientRect().height * 100 } : cur.a;
            (function retract(now) {
              const k = Math.min(1, (now - t0) / back);
              const x = from.x + (cur.a.x - from.x) * k, y = from.y + (cur.a.y - from.y) * k;
              const d2 = `M ${cur.a.x} ${cur.a.y} L ${x} ${y}`;
              cur.path.setAttribute('d', d2); cur.outer.setAttribute('d', d2);
              cur.head.setAttribute('cx', x); cur.head.setAttribute('cy', y);
              if (k < 1) requestAnimationFrame(retract);
              else [cur.path, cur.outer, cur.dot, cur.head].forEach(n => n.remove());
            })(performance.now());
            W.fx.softHint(b);
            // name the THING the child dragged and the icon it truly belongs to
            const thingAr = { paper: 'الورقة', box: 'الصندوق', basket: 'السلة', globe: 'الكرة الأرضية' }[cur.p.thing] || 'هذا الشيء';
            guide.disarm();
            ctx.after(30, () => {
              guide.step({
                sayAr: thingAr + ' تذهب إلى ' + cur.p.ar,
                simplerAr: 'اسحب ' + thingAr + ' إلى أيقونة ' + cur.p.ar,
                src: thingNodes[cur.p.thing],
                tgt: dsk.icons[cur.p.icon],
                demo: () => guide.handDrag(thingNodes[cur.p.thing], dsk.icons[cur.p.icon], { ms: 1500 }),
              });
            });
            W.fx.glow(dsk.icons[cur.p.icon]);
          }
        });
      });
    }
    let paired = 0;
    function nextPair() { return PAIRS.find(p => !thingNodes[p.thing].classList.contains('paired')); }
    function armPair() {
      const p = nextPair();
      if (!p) return;
      const ico = dsk.icons[p.icon];
      guide.step({
        sayAr: 'اسحب من الشيء إلى أيقونته',
        simplerAr: p.thing === 'paper' ? 'الورقة تذهب إلى المستندات' : 'اسحب هذا الشيء إلى أيقونته',
        src: thingNodes[p.thing],
        tgt: ico,
        demo: () => guide.handDrag(thingNodes[p.thing], ico, { ms: 1500 }),
      });
    }

    /* ---------- Start, files, and the challenge ---------- */
    let phase = 'open', win = null, quizApi = null;
    ctx.listen(dsk.start, 'click', () => {
      if (phase === 'start') {
        W.audio.open(); W.fx.sparkleAt(ctx.root, dsk.start, 5);
        chipOn(dsk.start, 'بدء', 'Start');
        lbl.reveal(dsk.start, 'بدء', 'Start', { pos: 'above', id: 'start' });
        check.done('start');
        phase = 'files';
        guide.clearStage({ remove: ['.thread-layer path', '.thread-layer circle', '.rthing'] });
        ctx.after(1200, () => guide.step({
          sayAr: 'اضغط المستندات مرّتين بسرعة',
          simplerAr: 'اضغط أيقونة المستندات مرّتين',
          src: dsk.icons.docs,
          demo: () => guide.handTap(dsk.icons.docs, 2),
        }));
      }
    });

    const FILES = [
      { id: 'img', ar: 'ملف صورة', en: 'Image File', kind: 'fileimg' },
      { id: 'txt', ar: 'ملف نصّي', en: 'Text File', kind: 'filetext' },
      { id: 'paint', ar: 'ملف رسمة', en: 'Paint File', kind: 'filepaint' },
    ];
    function openDocs() {
      if (win) return;
      const w = W.apps.appWindow({ title: 'المستندات — Documents', normal: 'left:8%;top:6%;width:84%;height:74%', dataset: { docswin: '1' } });
      dsk.root.appendChild(w.root);
      w.body.style.background = '#fdfaf2';
      const row = el('div', { style: 'position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;padding:4%' });
      FILES.forEach(f => {
        const b = el('button.dicon', { dataset: { file: f.id }, 'aria-label': f.ar, style: 'position:relative;left:auto;top:auto;width:26%;color:#3a2412;text-shadow:none' });
        const a = el('div.dart');
        a.appendChild(W.apps.iconArt(f.kind));
        b.appendChild(a);
        b.appendChild(el('span', { text: f.ar }));
        ctx.listen(b, 'click', () => {
          if (phase === 'files') {
            if (f.id === 'img') {
              W.audio.success(); W.fx.sparkleAt(ctx.root, b, 6);
              chipOn(b, f.ar, f.en);
              W.apps.bilingual(b, f.en);
              check.done('files');
              phase = 'wait';
              ctx.after(1500, startQuiz);
            } else { W.fx.softHint(b); say('انظر إلى شكل الملف'); }
          } else if (phase === 'q4' && quizApi) {
            if (f.id === 'paint') { chipOn(b, f.ar, f.en); quizApi.correct(b); }
            else quizApi.wrong(b);
          }
        });
        row.appendChild(b);
      });
      w.body.appendChild(row);
      ctx.listen(w.btns.close, 'click', () => { w.close(); win = null; });
      ctx.listen(w.btns.max, 'click', () => w.setMax(!w.maxed));
      ctx.listen(w.btns.min, 'click', () => { w.root.style.opacity = w.root.style.opacity === '0' ? '1' : '0'; });
      win = w;
      W.audio.open();
      if (phase === 'files') {
        // only the question, its three choices and the window may be on stage
        guide.clearStage({ remove: ['.thread-layer path', '.thread-layer circle', '.rthing'] });
        chipOn(dsk.icons.docs, 'أيقونة', 'Icon');
        say('اضغط الملف الذي يحمل صورة');
      }
      return w;
    }
    ctx.delegate('dblclick', '.dicon[data-icon="docs"]', () => {
      if (phase === 'files') openDocs();
      else if (phase === 'q3' && quizApi) { openDocs(); quizApi.correct(dsk.icons.docs); }
    });
    ctx.delegate('click', '.dicon', (ev, b) => {
      const id = b.dataset.icon;
      if (phase === 'q1' && quizApi) {
        if (id === 'recycle') { chipOn(b, 'سلة المحذوفات', 'Recycle Bin'); quizApi.correct(b); }
        else if (id) quizApi.wrong(b);
      } else if (phase === 'files' && id === 'docs' && !win) {
        say('نقرتان سريعتان لفتحها');
      }
    });

    function startQuiz() {
      if (win) { win.close(); win = null; }
      guide.clearStage({ remove: ['.thread-layer path', '.thread-layer circle', '.rthing'] });
      say('تحدي سطح المكتب!');
      const tasks = [
        { mount(st, api) { quizApi = api; phase = 'q1'; say('أين سلة المحذوفات؟'); } },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            say('أعد الأيقونة الشاردة إلى صفّها');
            const slot = el('div.smart-slot', { dataset: { slotIcon: '1' }, style: 'left:62%;top:78%;width:22%;height:20%' });
            dsk.root.appendChild(slot);
            const stray = dsk.addIcon('star', 'نجمة', 'star', 33, 62, { dataset: { stray: '1' } });
            stray.style.cursor = 'grab';
            let d = null;
            ctx.listen(stray, 'pointerdown', ev => { ev.preventDefault(); stray.setPointerCapture(ev.pointerId); d = { x: ev.clientX, y: ev.clientY, sx: parseFloat(stray.style.left), sy: parseFloat(stray.style.top) }; });
            ctx.listen(stray, 'pointermove', ev => {
              if (!d) return;
              const r = dsk.root.getBoundingClientRect();
              stray.style.left = (d.sx + (ev.clientX - d.x) / r.width * 100) + '%';
              stray.style.top = (d.sy + (ev.clientY - d.y) / r.height * 100) + '%';
            });
            ctx.listen(stray, 'pointerup', () => {
              if (!d) return; d = null;
              if (W.util.overlaps(stray, slot, -6)) {
                stray.style.transition = 'left .3s, top .3s';
                stray.style.left = '63%'; stray.style.top = '79%';
                slot.remove();
                api.correct(stray);
              } else W.fx.softHint(stray);
            });
          },
        },
        { mount(st, api) { quizApi = api; phase = 'q3'; say('افتح المستندات', 'نقرة مزدوجة'); } },
        { mount(st, api) {
            quizApi = api; phase = 'q4';
            guide.clearStage({ remove: ['.thread-layer path', '.thread-layer circle', '.rthing'] });
            say('أيّ ملف يحفظ رسمتك؟');
          } },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          W.rig.complete(ctx, lesson, { impactAr: 'أضاءت نافذة سطح المكتب!' });
        },
      });
    }
  },
});

/* ==== lessons/l1-4.js ==== */
/* Lesson 1.4 — انقر واكتب — the second pilot.
 * Unique mechanic: 1:1 mirror driving — the child drags a big illustrated Mouse
 * on its leather mat and the real on-screen pointer follows, solving the
 * "pointer disappears" challenge from the teacher guide. Real keyboard input
 * (physical keys or the big illustrated keys) writes into a living Notepad.
 * Flow: move · hover/click · right-click · double-click · window controls ·
 * guided typing (letters, numbers, Space, Enter, Backspace, arrows) · posture · quiz. */
W.lessons.register('1.4', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'mouse', label: 'حرّك الفأرة' },
      { id: 'click', label: 'انقر وحدّد' },
      { id: 'rclick', label: 'القائمة اليمنى' },
      { id: 'dbl', label: 'نقرة مزدوجة' },
      { id: 'win', label: 'نافذة المفكرة' },
      { id: 'type', label: 'اكتب بيديك' },
      { id: 'posture', label: 'اجلس صحيحًا' },
      { id: 'quiz', label: 'تحدي المكتب' },
    ]);

    const lbl = W.label.group(ctx, stage);
    const room = W.interiors.studyRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));

    const speak = el('div.speak', { text: 'اسحب الفأرة على سجّادتها', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    const R = room.refs;
    const pct = o => `left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%`;

    /* ---------- the living desktop inside the monitor glass ---------- */
    const screen = el('div.deskscreen', { dataset: { deskscreen: '1' }, style: pct(R.screen) });
    stage.appendChild(screen);
    /* CLOSURE: lesson 1.4 builds its own desktop layer — pin it to the real
     * monitor glass with the shared projection, exactly like every other. */
    {
      const svgEl = W.util.roomSvg(stage);
      if (svgEl && R.screen.svg) W.util.pinOverlayToSvgRect(ctx, svgEl, screen, R.screen.svg);
    }
    screen.appendChild(el('div.dsk-wall'));
    const wp = sv('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;opacity:.5' });
    wp.appendChild(sv('path', { d: 'M0 70 Q 25 56 50 68 T 100 66 L100 100 L0 100 Z', fill: '#2c7a6e' }));
    wp.appendChild(sv('circle', { cx: 78, cy: 24, r: 10, fill: '#ffe2a3', opacity: .8 }));
    screen.appendChild(wp);
    const bar = el('div.dsk-bar');
    const startChip = el('button.startchip', { 'aria-label': 'بدء', dataset: { sim: 'start' } });
    bar.appendChild(startChip);
    screen.appendChild(bar);

    function icon(id, label, artFn, x, y) {
      /* R3 item 1: the whole icon WITH its name is one clear click target.
       * It stays reachable both through the virtual mouse and by clicking it
       * directly with a real mouse — a first-grader will try both. */
      const b = el('button.dicon.dclickable', { dataset: { icon: id }, 'aria-label': label, style: `inset-inline-start:${x}%;top:${y}%` });
      const dart = el('div.dart');
      dart.appendChild(artFn());
      b.appendChild(dart);
      b.appendChild(el('span', { text: label }));
      screen.appendChild(b);
      /* real mouse: a true dblclick, plus a two-tap fallback (<=650ms) */
      ctx.listen(b, 'dblclick', ev => { ev.preventDefault(); ev.stopPropagation(); directDbl(b); });
      ctx.listen(b, 'pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); iconTap(b, ev); });
      /* moving the real mouse onto the icon also moves the scene pointer,
       * so hovering behaves exactly as a child expects */
      ctx.listen(b, 'pointerenter', () => syncPtrTo(b));
      ctx.listen(b, 'pointermove', () => syncPtrTo(b));
      return b;
    }
    const noteArt = () => { const s = sv('svg', { viewBox: '0 0 40 40', style: 'width:70%;height:70%' }); s.appendChild(sv('rect', { x: 6, y: 4, width: 28, height: 32, rx: 3, fill: '#fff', stroke: '#3358a8', 'stroke-width': 2.5 })); [12, 18, 24].forEach(y => s.appendChild(sv('line', { x1: 11, y1: y, x2: 29, y2: y, stroke: '#4c7fe2', 'stroke-width': 2.2, 'stroke-linecap': 'round' }))); return s; };
    const picArt = () => { const s = sv('svg', { viewBox: '0 0 40 40', style: 'width:70%;height:70%' }); s.appendChild(sv('rect', { x: 5, y: 7, width: 30, height: 26, rx: 3, fill: '#eaf2ff', stroke: '#8a5aa0', 'stroke-width': 2.5 })); s.appendChild(sv('circle', { cx: 14, cy: 15, r: 3.4, fill: '#f2b24c' })); s.appendChild(sv('path', { d: 'M8 28 L17 19 L23 25 L28 21 L32 26 L32 30 L8 30 Z', fill: '#3f9e6e' })); return s; };
    const starArt = () => { const s = sv('svg', { viewBox: '0 0 40 40', style: 'width:70%;height:70%' }); s.appendChild(sv('path', { d: 'M20 4 L24.6 14.8 L36 15.8 L27.4 23.4 L30.2 34.6 L20 28.6 L9.8 34.6 L12.6 23.4 L4 15.8 L15.4 14.8 Z', fill: '#ffd166', stroke: '#b8862e', 'stroke-width': 2 })); return s; };
    const moonArt = () => { const s = sv('svg', { viewBox: '0 0 40 40', style: 'width:70%;height:70%' }); s.appendChild(sv('path', { d: 'M27 4 A 15 15 0 1 0 36 22 A 12 12 0 0 1 27 4 Z', fill: '#dfe8ff', stroke: '#6b7dc4', 'stroke-width': 2 })); return s; };

    const icNote = icon('note', 'المفكرة', noteArt, 8, 12);
    icon('pic', 'صورة', picArt, 8, 52);
    const icStar = icon('star', 'نجمة', starArt, 52, 20);
    let icMoon = null;

    /* ---------- the mirrored pointer ---------- */
    const ptr = el('div.ptr', { dataset: { pointer: '1' } });
    const ptrSvg = sv('svg', { viewBox: '0 0 24 24' });
    ptrSvg.appendChild(sv('path', { d: 'M4 2 L4 19 L8.6 15.2 L11.4 21.6 L14.6 20.2 L11.8 13.8 L18 13.4 Z', fill: '#fff', stroke: '#23406e', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }));
    ptr.appendChild(ptrSvg);
    screen.appendChild(ptr);
    let px = 50, py = 62;
    function placePtr() { ptr.style.insetInlineStart = px + '%'; ptr.style.top = py + '%'; }
    placePtr();

    /* ---------- the illustrated mouse riding the mat ---------- */
    const mouseB = el('button.matmouse', { dataset: { matmouse: '1' }, 'aria-label': 'الفأرة — Mouse', style: 'width:9%;aspect-ratio:220/180' });
    mouseB.appendChild(W.interiors.partArt('mouse'));
    const zoneL = el('button.mbtnzone', { 'aria-label': 'زر أيسر', dataset: { mbtn: 'left' }, style: 'inset-inline-start:6%' });
    const zoneR = el('button.mbtnzone', { 'aria-label': 'زر أيمن', dataset: { mbtn: 'right' }, style: 'inset-inline-end:6%' });
    mouseB.appendChild(zoneL); mouseB.appendChild(zoneR);
    stage.appendChild(mouseB);
    let mnx = .5, mny = .55;
    function placeMouse() {
      const sr = stage.getBoundingClientRect();
      const mw = mouseB.getBoundingClientRect().width || sr.width * .09;
      const mh = mouseB.getBoundingClientRect().height || mw * (180 / 220);
      const mx = (R.mat.x + mnx * R.mat.w) / 100 * sr.width - mw / 2;
      const my = (R.mat.y + mny * R.mat.h) / 100 * sr.height - mh / 2;
      mouseB.style.insetInlineStart = 'auto';
      mouseB.style.left = mx + 'px'; mouseB.style.top = my + 'px';
      /* R4: the virtual pointer must reach EVERY part of the screen —
       * including the blue taskbar at the very bottom. */
      px = 3 + mnx * 94; py = 3 + mny * 94;
      placePtr(); hoverScan();
    }
    ctx.after(60, placeMouse);
    ctx.listen(window, 'resize', placeMouse);
    ctx.after(150, () => {
      guide.step({
        sayAr: 'اسحب الفأرة على سجّادتها',
        simplerAr: 'أمسك الفأرة وحرّكها قليلًا',
        src: mouseB,
        demo: () => guide.handDrag(mouseB, null, { ms: 1200, dx: 90, dy: -50 }),
      });
    });

    let phase = 'meet';
    let hoverId = null, tip = null;
    /* ===== R4 · ONE HIT TEST FOR THE VIRTUAL POINTER =====================
     * The illustrated mouse must be able to reach EVERY control the lesson
     * teaches — the desktop icons, the window buttons, the taskbar chip, the
     * context menu, the Start chip — not just the icons. We translate the
     * virtual pointer into real screen coordinates and ask the document what
     * is really there, then resolve the nearest control the lesson owns. */
    const VCTRL = '.dicon, .winbtn, .taskchip, .ctxmenu button, .startchip, [data-vctrl]';
    function ptrPoint() {
      const sr = screen.getBoundingClientRect();
      return { x: sr.left + px / 100 * sr.width, y: sr.top + py / 100 * sr.height };
    }
    function controlAtVirtualPointer() {
      const { x, y } = ptrPoint();
      if (!isFinite(x) || !isFinite(y)) return null;
      let node = document.elementFromPoint(x, y);
      // never let decoration, the pointer itself or the illustrated mouse win
      let guard = 0;
      while (node && guard++ < 6) {
        if (node.closest && (node.closest('.ptr') || node.closest('.matmouse'))) {
          const prev = node.style.pointerEvents;
          node.style.pointerEvents = 'none';
          const below = document.elementFromPoint(x, y);
          node.style.pointerEvents = prev;
          node = below;
          continue;
        }
        break;
      }
      if (!node || !node.closest) return null;
      const ctrl = node.closest(VCTRL);
      if (!ctrl) return null;
      if (ctrl.disabled || ctrl.getAttribute('aria-disabled') === 'true') return null;
      if (!screen.contains(ctrl) && !stage.contains(ctrl)) return null;
      const cs = getComputedStyle(ctrl);
      if (cs.pointerEvents === 'none' || cs.visibility === 'hidden' || cs.display === 'none') return null;
      return ctrl;
    }
    /* the icons-only helper stays, expressed through the general one */
    function iconAt() {
      const c = controlAtVirtualPointer();
      return c && c.classList.contains('dicon') ? c : null;
    }
    function ctrlKey(c) {
      if (!c) return null;
      if (c.classList.contains('dicon')) return 'icon:' + c.dataset.icon;
      if (c.classList.contains('winbtn')) return 'win:' + (c.dataset.action || c.dataset.win);
      if (c.classList.contains('taskchip')) return 'chip:' + (c.dataset.task || '');
      if (c.classList.contains('startchip')) return 'start';
      if (c.closest('.ctxmenu')) return 'menu:' + (c.dataset.menu || '');
      return 'ctrl';
    }
    function hoverScan() {
      const c = controlAtVirtualPointer();
      const id = ctrlKey(c);
      if (id === hoverId) return;
      /* R4 · VISUAL HOVER: exactly one control is highlighted at a time */
      screen.querySelectorAll('.dicon.hovered, .vhover').forEach(x => { x.classList.remove('hovered'); x.classList.remove('vhover'); });
      if (tip) { tip.remove(); tip = null; }
      hoverId = id;
      if (c) {
        c.classList.add(c.classList.contains('dicon') ? 'hovered' : 'vhover');
        const label = c.getAttribute('aria-label') || c.textContent.trim();
        if (label) {
          tip = el('div.dtip', { text: label, style: `inset-inline-start:${W.util.clamp(px, 4, 92)}%;top:${W.util.clamp(py - 4, 1, 92)}%` });
          screen.appendChild(tip);
        }
        onHover(c.classList.contains('dicon') ? c.dataset.icon : null);
      } else onHover(null);
    }

    let dragMoved = 0, downAt = null, lastTap = 0;
    ctx.listen(mouseB, 'pointerdown', ev => {
      if (ev.button !== undefined && ev.button !== 0) return;
      if (ev.target.dataset && ev.target.dataset.mbtn) return;
      ev.preventDefault();
      mouseB.setPointerCapture(ev.pointerId);
      downAt = { x: ev.clientX, y: ev.clientY, moved: false, total: 0 };
    });
    ctx.listen(mouseB, 'pointermove', ev => {
      if (!downAt) return;
      const sr = stage.getBoundingClientRect();
      const dx = ev.clientX - downAt.x, dy = ev.clientY - downAt.y;
      /* R4: a slow drag is still a drag — accumulate the whole journey
       * instead of judging each tiny pointermove on its own, otherwise a
       * careful little hand ends up firing clicks while it is still moving. */
      downAt.total += Math.abs(dx) + Math.abs(dy);
      if (downAt.total > 6) downAt.moved = true;
      downAt.x = ev.clientX; downAt.y = ev.clientY;
      mnx = W.util.clamp(mnx + dx / (sr.width * R.mat.w / 100), 0, 1);
      mny = W.util.clamp(mny + dy / (sr.height * R.mat.h / 100), 0, 1);
      dragMoved += Math.abs(dx) + Math.abs(dy);
      placeMouse();
      if (phase === 'meet' && dragMoved > 60) meetDone();
    });
    ctx.listen(mouseB, 'pointerup', () => {
      if (!downAt) return;
      const wasMove = downAt.moved; downAt = null;
      if (wasMove) return;
      tap();
    });
    ctx.listen(mouseB, 'contextmenu', ev => { ev.preventDefault(); vRClick(); });
    ctx.listen(zoneL, 'pointerup', ev => { ev.stopPropagation(); tap(); });
    ctx.listen(zoneR, 'pointerup', ev => { ev.stopPropagation(); ev.preventDefault(); vRClick(); });
    ctx.listen(zoneR, 'contextmenu', ev => ev.preventDefault());

    /* ===== R4 · ONE DOUBLE-CLICK DETECTOR ===============================
     * Used by the illustrated mouse AND by direct clicks, in the guided
     * phase AND in the quiz. A first-grade window: two clicks on the SAME
     * target within 800 ms count as a double-click; beyond 1000 ms they do
     * not. Small hand movement (≤ 60 px) is forgiven. */
    /* accepted window: two clicks within ~800 ms of each other count, with a
     * little headroom for a small hand; beyond 1000 ms they never count. */
    const DBL_MS = 950, DBL_MOVE = 60;
    let dblTarget = null, dblAt = 0, dblPt = null;
    function isDoubleOn(target, pt) {
      const now = performance.now();
      const gap = now - dblAt;
