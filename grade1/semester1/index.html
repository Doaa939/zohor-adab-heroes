  /* ---------- 6 · REAL-INPUT MATCHER (R2 · item 1) ----------
   * The typed buffer always contains exactly what the pupil pressed.
   * This matcher only *judges* the buffer; it never rewrites it.
   * Comparison ignores harakat, tatweel and alef-madda variants — but a
   * letter is NEVER converted into another letter. */
  const IGNORABLE = /[\u064B-\u0652\u0670\u0640\u200C\u200D]/;
  const FOLD = { 'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا' };
  function normArr(s) {
    const out = [];
    for (const c of String(s || '')) {
      if (IGNORABLE.test(c)) continue;
      out.push(FOLD[c] || c);
    }
    return out;
  }
  function matcher(targetRaw) {
    let target = String(targetRaw || '');
    // normalized target + the raw char that produced each normalized slot
    let norm = [], raws = [];

       * earlier text). Returns {ok, complete, next, index}. */
      check(value) {

        if (v.length > norm.length) return { ok: false, complete: false, next: null, index: norm.length };

  /* R2 · WHICH CHARACTER DID THE PUPIL ACTUALLY PRESS?
   * 1) If the operating system already produces an Arabic letter, that letter
   *    is used exactly as it came (the school computers' normal state).
   * 2) Otherwise, for an Arabic writing task, we read the letter ENGRAVED on
   *    the physical key that was pressed (Arabic-101), exactly as an Arabic
   *    keyboard does in hardware. This depends only on WHICH KEY was pressed —
   *    never on which letter the lesson expects. Pressing the key marked «ك»
   *    always yields «ك», even when «ع» is the letter being asked for.

  function pressedChar(ev, arabicTask) {

  function sameText(a, b) {
    return normArr(String(a).trim()).join('') === normArr(String(b).trim()).join('');
  }

  /* ---------- 7 · GLOBAL LABEL / GUIDE MANAGER (R2 · item 8) ----------
   * One authority decides what teaching chrome is on screen. Before any new
   * step it clears the previous ring, arrow, ghost hand and label, and it
   * refuses to leave a card sitting on top of the element the child must
   * touch — overlap is measured with getBoundingClientRect, not by eye. */
  const OVERLAP_SEL = 'button, a, input, .wb-url, .wb-link, .wb-go, .wb-chip, .wb-searchbtn, .ptool, .swatch, .kb-key, .wb-tab, .wb-newtab, .wb-back, .wb-home, .ma-fbtn, .ma-send, .ma-slot, .ma-contact, .net-hot, .net-card, .choice-card, .part, .hdev, .mlantern';

  function labelManager(ctx, root) {
    const api = {
      /* remove every teaching label except the ones whose id is kept */
      clearLabels(keep) {
        const k = keep ? (Array.isArray(keep) ? keep : [keep]) : [];
        root.querySelectorAll('.tag, .term-tag, .label-tag, [data-label]').forEach(n => {
          const id = n.dataset ? n.dataset.label : null;
          if (id && k.indexOf(id) >= 0) return;

        });

      /* nudge any label that sits on top of an interactive element away from it */
      resolveOverlaps() {
        const labels = Array.from(root.querySelectorAll('.tag, .term-tag, .label-tag, [data-label]'));
        if (!labels.length) return 0;
        const targets = Array.from(root.querySelectorAll(OVERLAP_SEL))
          .filter(t => t.offsetParent !== null);
        let moved = 0;
        labels.forEach(lab => {
          const lr = lab.getBoundingClientRect();
          if (!lr.width) return;

            if (lab.contains(t) || t.contains(lab)) return false;
            return rectsOverlap(lr, t.getBoundingClientRect(), -2);
          });
          if (hit) { lab.remove(); moved++; }
        });
        return moved;
      },
      /* audit hook used by the acceptance tests */
      overlapCount() {
        const labels = Array.from(root.querySelectorAll('.tag, .term-tag, .label-tag, [data-label]'));
        const targets = Array.from(root.querySelectorAll(OVERLAP_SEL)).filter(t => t.offsetParent !== null);
        let n = 0;
        labels.forEach(lab => {
          const lr = lab.getBoundingClientRect();
          if (!lr.width) return;
          targets.forEach(t => {
            if (lab.contains(t) || t.contains(lab)) return;
            if (rectsOverlap(lr, t.getBoundingClientRect(), -2)) n++;
          });
        });
        return n;
      },
    };
    return api;
  }

  return { renderSay, AR_EN, CODE_AR, decorateKey, decorateBoard, visualKeyFor, fitKeyboard, saveDialog,
           matcher, sameText, normArr, labelManager, rectsOverlap, OVERLAP_SEL,
           pressedChar, isArabic };
})();

/* ==== engine/assess.js ==== */
/* Assessment engine core.
 * Provides: task sequencing, gentle feedback (no red X, no shame, free retry),
 * completion signalling, and the rail Checklist component.
 * Lesson modules supply concrete task implementations on top of this core. */
W.assess = (function () {
  const { el } = W.util;

  /** Checklist — MUST be mounted inside the lesson rail (never over the stage).
   *  This is enforced structurally: the constructor refuses any other parent. */
  function Checklist(railEl, items) {
    if (!railEl.classList.contains('lesson-rail')) {
      throw new Error('Checklist may only mount inside .lesson-rail (layout convention)');
    }
    this.items = items;
    this.el = W.util.el('div.lantern-rail', { role: 'list', 'aria-label': 'خطوات الدرس' });
    this.map = {};
    items.forEach(it => {
      const row = W.util.el('div.lantern-item', { role: 'listitem', dataset: { check: it.id } });
      const fl = W.util.el('span.flame');
      fl.appendChild(W.interiors.flameLantern());
      row.appendChild(fl);
      row.appendChild(W.util.el('span', { text: it.label }));
      this.el.appendChild(row);
      this.map[it.id] = row;
    });
    railEl.appendChild(this.el);
  }
  Checklist.prototype.done = function (id) {
    const row = this.map[id];
    if (!row || row.classList.contains('done')) return;
    row.classList.add('done');
    row.setAttribute('data-done', '1');
    W.audio.hint();
  };
  Object.defineProperty(Checklist.prototype, 'allDone', {
    get() { return Object.values(this.map).every(r => r.classList.contains('done')); },
  });

  function run(ctx, stageEl, tasks, opts) {
    const o = opts || {};
    let i = -1;
    const api = {
      correct(target) {
        W.audio.success();
        if (target) W.fx.sparkleAt(ctx.root, target);
        if (o.onCorrect) o.onCorrect(tasks[i]);
        next();
      },
      wrong(target) {
        if (target) W.fx.softHint(target);
        if (o.onWrong) o.onWrong(tasks[i]);
        // free retry: nothing else happens, no penalty
      },
      step(id) { if (o.onStep) o.onStep(id); },
      ctx, stage: stageEl,
    };
    function next() {
      i += 1;
      if (i >= tasks.length) { if (o.onDone) o.onDone(); return; }
      if (o.onTask) o.onTask(tasks[i]);
      tasks[i].mount(stageEl, api);
    }
    next();
    return api;
  }

  return { Checklist, run };
})();

        // recipient row
        const toRow = el('div.fp-mail-row');
        toRow.appendChild(el('span.fp-mail-lbl', { text: 'إلى:' }));
        const contacts = [{ id: 'gram', ar: 'جدتي' }, { id: 'friend', ar: 'صديقي' }];
        contacts.forEach(c => {
          const b = el('button.ma-contact', { dataset: { to: c.id }, text: c.ar });
          b.addEventListener('click', () => {
            W.audio.click(); chosenTo = c.id;
            toRow.querySelectorAll('.ma-contact').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
          });
          toRow.appendChild(b);
        });
        body.appendChild(toRow);
        // message: pick a short friendly message (large, simple)
        const msgRow = el('div.fp-mail-row');
        msgRow.appendChild(el('span.fp-mail-lbl', { text: 'الرسالة:' }));
        const msgBox = el('div.fp-mail-msg', { dataset: { msg: '1' }, text: '' });
        msgRow.appendChild(msgBox);
        body.appendChild(msgRow);
        const picks = el('div.fp-mail-picks');
        ['سلامي يا جدتي! هذه هديتي لك.', 'أراك قريبًا إن شاء الله.', 'شكرًا على كل شيء.'].forEach(t => {
          const p = el('button.fp-msg-pick', { text: t });
          p.addEventListener('click', () => { W.audio.click(); msgBox.textContent = t; });
          picks.appendChild(p);
        });
        body.appendChild(picks);
        // attachment
        const attRow = el('div.fp-mail-row');
        const attBtn = el('button.fp-attach', { text: '📎 أرفق صورة', 'aria-label': 'أرفق ملفًا' });
        const attView = el('div.fp-attview', { dataset: { attview: '1' } });
        attBtn.addEventListener('click', () => {
          W.audio.click(); attached = true;
          attView.innerHTML = ''; attView.appendChild(el('div.fp-att-thumb', { text: '🖼️ صورة.png' }));
          if (say) say('أرفقتَ صورة. الآن اضغط زر أرسِل الأخضر.', 'Attached');
        });
        attRow.appendChild(attBtn); attRow.appendChild(attView);
        body.appendChild(attRow);
        // sticky send bar (item 16: always visible, green, named)
        const sendBar = el('div.fp-sendbar', { dataset: { sendbar: '1' } });
        const sendBtn = el('button.fp-send', { dataset: { send: '1' }, text: 'أرسِل ✉' , 'aria-label': 'أرسِل — Send' });
        sendBar.appendChild(sendBtn);
        m.root.appendChild(sendBar);
        sendBtn.addEventListener('click', () => {
          if (sent) return;
          if (!chosenTo) { W.fx.softHint(toRow); if (say) say('اختر مَن تُرسل له أولًا.', ''); return; }
          if (!msgBox.textContent) { W.fx.softHint(msgBox); if (say) say('اختر رسالة أولًا.', ''); return; }
          sent = true; W.audio.success();
          body.innerHTML = '';
          const ok = el('div.fp-mail-sent');
          ok.appendChild(el('div.fp-sent-ic', { text: '🕊️' }));
          ok.appendChild(el('div.fp-sent-txt', { text: 'أُرسلت رسالتك!' + (attached ? ' (مع المرفق)' : '') }));
          body.appendChild(ok);
          if (say) say('أحسنت! أُرسلت رسالتك.', 'Sent');
        });
      };
      build();
      return { destroy() { wrap.remove(); } };
    }

    /* ===================== SEARCH (item 14) ===================== */
    if (kind === 'search') {
      const build = () => {
        wrap.innerHTML = '';
        wrap.appendChild(taskBar('اكتب كلمة ثم ابحث واختر نتيجة آمنة', () => build()));
        if (say) say('اضغط مربّع البحث واكتب كلمة، أو اختر كلمة مضيئة، ثم اضغط ابحث.', 'Search safely');
        const keywords = ['عُمان', 'الخيل العربي', 'قلعة نزوى', 'الفلج', 'المها العربي'];
        const home = W.net.searchHome({ keywords });
        const view = el('div.freenet-view');
        view.appendChild(home.node);
        wrap.appendChild(view);
        let filled = '';
        // real typing into the search box via keyboard
        home.q.setAttribute('tabindex', '0');
        const typeHandler = (e) => {
          if (!wrap.isConnected) return;
          const k = e.key;
          if (k === 'Backspace') { filled = filled.slice(0, -1); home.q.textContent = filled; e.preventDefault(); }
          else if (k === 'Enter') { doSearch(); e.preventDefault(); }
          else if (k.length === 1) { filled += k; home.q.textContent = filled; }
        };
        ctx.listen(document, 'keydown', typeHandler);
        ctx.listen(home.q, 'click', () => { home.q.classList.add('focused'); });
        // chips also fill
        ctx.listen(home.chips, 'click', (e) => {
          const chip = e.target.closest('.wb-chip'); if (!chip) return;
          filled = chip.dataset.chip; home.q.textContent = filled; W.audio.click();
          home.chips.querySelectorAll('.wb-chip.hl').forEach(x => x.classList.remove('hl'));
          chip.classList.add('hl');
        });
        function doSearch() {
          if (!filled) { W.fx.softHint(home.btn); if (say) say('اكتب كلمة أو اختر كلمة مضيئة أولًا.', ''); return; }
          W.audio.click();
          const res = W.net.resultsPage(filled, [
            { titleAr: filled + ' — موقع تعليمي آمن', urlAr: 'مدرستي.عمان', safe: true },
            { titleAr: 'صور عن ' + filled, urlAr: 'صور.محلي', safe: true },
            { titleAr: 'فيديو تعليمي عن ' + filled, urlAr: 'فيديو.محلي', safe: true },
          ]);
          view.innerHTML = '';
          // back button to return to search
          const back = el('button.fp-back', { text: '← رجوع', 'aria-label': 'رجوع' });
          back.addEventListener('click', () => { W.audio.click(); build(); });
          view.appendChild(back);
          view.appendChild(res.node);
          // opening a result shows a friendly local page
          res.node.querySelectorAll('.wb-link, .wb-result').forEach(link => {
            link.addEventListener('click', () => {
              W.audio.success();
              view.innerHTML = '';
              const b2 = el('button.fp-back', { text: '← رجوع', 'aria-label': 'رجوع' });
              b2.addEventListener('click', () => { doSearch(); });
              view.appendChild(b2);
              view.appendChild(W.net.museumPage().node);
              if (say) say('فتحتَ نتيجةً آمنة. أحسنت!', 'Opened');
            });
          });
          if (say) say('اختر نتيجةً لتفتحها.', 'Choose a result');
        }
        ctx.listen(home.btn, 'click', doSearch);
      };
      build();
      return { destroy() { wrap.remove(); } };
    }

    /* ===================== BROWSER (item 13) ===================== */
    if (say) say('اكتب عنوانًا أو اضغط رابطًا، وتصفّح بأمان.', 'Browse safely');
    wrap.appendChild(taskBar('تصفّح: اضغط رابطًا، أو ارجع للرئيسة', () => { rebuild(); }));
    let br = null;
    function homePage() {
      const page = el('div.wb-page.fp-home', { dataset: { site: 'home' } });
      page.appendChild(el('div.fp-home-title', { text: '🏠 الصفحة الرئيسة — الواحة' }));
      const links = el('div.fp-home-links');
      [{ ar: 'المتحف', to: 'museum' }, { ar: 'الحيوانات', to: 'animals' }].forEach(l => {
        const b = el('button.fp-home-link', { dataset: { link: l.to }, text: l.ar });
        b.addEventListener('click', () => {
          W.audio.click();
          const pg = l.to === 'museum' ? W.net.museumPage() : W.net.animalsPage();
          br.setContent(pg.node, pg.h); br.setAddress(l.to === 'museum' ? 'almathaf.om' : 'alhayawanat.om');
          if (say) say('فتحتَ صفحة. اضغط رجوع للعودة للرئيسة.', 'Opened');
        });
        links.appendChild(b);
      });
      page.appendChild(links);
      return { node: page, h: 480 };
    }
    function rebuild() {
      if (br && br.root) br.root.remove();
      br = W.net.browser(ctx, { host: wrap, pos: { x: 3, y: 12, w: 94, h: 82 }, free: true });
      br.addTab('الرئيسة'); br.activate(0);
      const hp = homePage(); br.setContent(hp.node, hp.h); br.setAddress('alwaha.om');
      // Home button returns to homepage
      if (br.goBtn) { /* address bar Go */ br.onGo = (target) => { const hp2 = homePage(); br.setContent(hp2.node, hp2.h); br.setAddress(target || 'alwaha.om'); }; }
    }
    rebuild();
    return { destroy() { wrap.remove(); } };
  }

  // attach to the world modules so the mode hub's feature-detect picks them up
  if (W.typing) W.typing.freePad = freePad;
  if (W.paint) W.paint.freeCanvas = freeCanvas;
  if (W.net) W.net.freeSurface = freeSurface;
})();

/* ==== engine/mode-hub.js ==== */
/* ==== engine/mode-hub.js — Grade-1 v2 FOUR-MODE lesson hub ====
 *
 * One shared implementation gives EVERY lesson four child modes:
 *   تعلّم معي   Learn With Me      → the existing guided lesson (impl.mount)
 *   جرّب وحدك   Try It Yourself    → free practice by kind (fewer auto hints, «أرِني» stays)
 *   تحدٍّ صغير  Small Challenge    → 3–5 varied tasks, gentle feedback, no scores
 *   راجع بالصور Review With Pictures→ big picture cards, term on object, replay + quick check
 *
 * The hub is NOT four copies of a lesson. Learn reuses the lesson's own mount.
 * Review / Practice / Challenge are generated from W.CURR2 concept data + W.icons2.
 * Shared progress: the lesson is marked complete via W.store once the child has
 * done Learn AND at least the Small Challenge (mirrors classroom "practise+assess").
 *
 * Everything is offline, teardown-safe (all timers via ctx.timer/ctx.raf), gentle,
 * and taskbar-safe. No red X, no coins, no scores, no leaderboards.
 */
W.modeHub = (function () {
  const { el, sv } = W.util;

  const MODES = [
    { id: 'learn', ar: 'تعلّم معي', en: 'Learn With Me', icon: 'star', tone: 'learn' },
    { id: 'practice', ar: 'جرّب وحدك', en: 'Try It Yourself', icon: 'edit', tone: 'practice' },
    { id: 'challenge', ar: 'تحدٍّ صغير', en: 'Small Challenge', icon: 'shapes', tone: 'challenge' },
    { id: 'review', ar: 'راجع بالصور', en: 'Review With Pictures', icon: 'review', tone: 'review' },
  ];

  /* ---------------- gentle reward: growing plant / light ---------------- */
  function growLayer(stage) {
    const g = el('div.grow-layer', { dataset: { grow: '1' } });
    stage.appendChild(g);
    let level = 0;
    const svgEl = sv('svg', { viewBox: '0 0 100 100', style: 'position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:88px;height:88px;overflow:visible' });
    g.appendChild(svgEl);
    function render() {
      svgEl.innerHTML = '';
      // pot
      svgEl.appendChild(sv('path', { d: 'M38 78 L62 78 L59 92 L41 92 Z', fill: '#c07a43' }));
      svgEl.appendChild(sv('rect', { x: 36, y: 73, width: 28, height: 7, rx: 2, fill: '#d98b52' }));
      const stem = Math.min(level, 5);
      if (stem > 0) svgEl.appendChild(sv('line', { x1: 50, y1: 78, x2: 50, y2: 78 - stem * 8, stroke: '#3fa87a', 'stroke-width': 4, 'stroke-linecap': 'round' }));
      for (let i = 0; i < stem; i++) {
        const y = 74 - i * 8, side = i % 2 ? 1 : -1;
        svgEl.appendChild(sv('path', { d: `M50 ${y} q ${side * 12} -4 ${side * 16} 4 q ${-side * 6} 6 ${-side * 16} -4 Z`, fill: '#4fb889' }));
      }
      if (stem >= 5) svgEl.appendChild(sv('circle', { cx: 50, cy: 30, r: 9, fill: '#ffd166', stroke: '#f2b705', 'stroke-width': 2 }));
    }
    render();
    return {
      step() { level += 1; render(); W.fx && W.fx.sparkleAt && W.fx.sparkleAt(stage, svgEl); },
      full() { return level >= 5; },
      el: g,
    };
  }

  /* ---------------- shared praise line (no scores) ---------------- */
  function praise(say, done, total) {
    const msgs = ['أحسنت!', 'رائع!', 'ممتاز!', 'عملٌ جميل!'];
    say(msgs[Math.min(done, msgs.length - 1)], total ? `${done} / ${total}` : '');
  }

  /* =====================================================================
   *  REVIEW WITH PICTURES  — big cards, term on object, replay + one check
   * ===================================================================== */
  function mountReview(ctx, host, lesson, opts) {
    const concepts = W.CURR2.concepts(lesson.id);
    const say = opts.say;
    /* stage already cleared by clearStage(); keep guide+speak intact */
    const wrap = el('div.review-wrap', { dataset: { review: '1' } });
    host.appendChild(wrap);

    // TWO honest states only, decided once from the real device capability:
    //   A = a real local voice exists -> speaker icon + "لتسمع اسمها"
    //   B = no voice -> NO speaker icon, NO tone-as-speech, "لترى اسمها بالعربية والإنجليزية"
    const voice = W.speech && W.speech.available ? W.speech.available() : { any: false };
    const canSpeak = !!voice.any;
    if (canSpeak) say('اضغط أي صورة لتسمع اسمها.', 'راجع بالصور');
    else say('اضغط أي صورة لترى اسمها بالعربية والإنجليزية.', 'راجع بالصور');

    const grid = el('div.ic2-grid', { dataset: { reviewgrid: '1' } });
    wrap.appendChild(grid);
    concepts.forEach(c => {
      const t = W.icons2.tile(c.key, c.ar, c.en);
      t.setAttribute('role', 'button');
      t.setAttribute('tabindex', '0');
      t.classList.add('review-card');
      // speaker icon appears ONLY when real pronunciation is available (State A)
      if (canSpeak) t.appendChild(el('span.card-speaker', { text: '🔊', 'aria-hidden': 'true' }));
      const reveal = () => {
        t.classList.add('picked');
        if (canSpeak && W.speech && W.speech.say) {
          // State A: real pronunciation (Arabic then English). No click tone as speech.
          W.speech.say(c.ar, c.en || '');
          say(c.ar, c.en || '');
        } else {
          // State B: written-only. Show both terms clearly, no tone, no listening wording.
          say(c.ar, c.en || '');
          ctx.timer(() => { if (!solved) say(questionText, ''); }, 1400);
        }
        ctx.timer(() => t.classList.remove('picked'), 1200);
      };
      t.addEventListener('click', reveal);
      t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
      grid.appendChild(t);
    });

    // quick check: "which one is X?" — one gentle question, free retry
    /* FINAL POLISH (11+12): the active question is the ONE instruction the
     * pupil sees, and it lives in the normal top instruction area — never in
     * a dark bar at the bottom next to the attribution, and never alongside a
     * second competing command. The answering logic below is unchanged. */
    let target = concepts[Math.floor(Math.random() * concepts.length)];
    let solved = false;
    const questionText = `أين «${target.ar}»؟ اضغط البطاقة الصحيحة.`;
    say(questionText, '');
    const checkBar = el('div.review-check', { dataset: { reviewcheck: '1' }, style: 'display:none' });
    wrap.appendChild(checkBar);
    const q = el('div.review-q', { text: questionText });
    checkBar.appendChild(q);
    grid.querySelectorAll('.review-card').forEach((card, idx) => {
      card.addEventListener('click', () => {
        if (solved) return;
        if (concepts[idx].key === target.key) {
          solved = true;
          card.classList.add('correct');
          W.audio.success();
          say('أحسنت! وجدتها.', target.en || '');
          if (opts.onDone) opts.onDone();
        } else {
          card.classList.add('tryagain');
          ctx.timer(() => card.classList.remove('tryagain'), 500);
          W.fx && W.fx.softHint && W.fx.softHint(card);
        }
      });
    });
    return { destroy() { wrap.remove(); } };
  }

  /* =====================================================================
   *  SMALL CHALLENGE — 3–5 varied tasks from concept set; gentle; no scores
   * ===================================================================== */
  function mountChallenge(ctx, host, lesson, opts) {
    const concepts = W.CURR2.concepts(lesson.id);
    const say = opts.say;
    /* stage already cleared by clearStage(); keep guide+speak intact */
    const wrap = el('div.challenge-wrap', { dataset: { challenge: '1' } });
    host.appendChild(wrap);

    const grow = growLayer(wrap);
    const stepEl = el('div.step-counter', { dataset: { step: '1' } });
    wrap.appendChild(stepEl);

    // Build 3–5 "find the named concept" tasks (varied targets)
    const pool = concepts.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const N = Math.max(3, Math.min(5, pool.length));
    const tasks = pool.slice(0, N);

    const board = el('div.challenge-board', { dataset: { board: '1' } });
    wrap.appendChild(board);

    let idx = 0, done = 0, transitioning = false;
    function buildTask() {
      const frag = el('div.challenge-choices');
      if (idx >= tasks.length) return null;
      const target = tasks[idx];
      const others = concepts.filter(c => c.key !== target.key);
      for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
      const choices = [target, ...others.slice(0, 3)];
      for (let i = choices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [choices[i], choices[j]] = [choices[j], choices[i]]; }
      choices.forEach(c => {
        const t = W.icons2.tile(c.key, c.ar, '');
        t.classList.add('challenge-choice');
        t.setAttribute('role', 'button'); t.setAttribute('tabindex', '0');
        const pick = () => {
          if (transitioning) return;
          if (c.key === target.key) {
            t.classList.add('correct'); W.audio.success();
            done += 1; grow.step();
            idx += 1;
            transitioning = true;
            // keep the current (correct) board on screen during the pause,
            // then swap in the next task in one frame — never a blank stage.
            ctx.timer(() => { transitioning = false; renderTask(); }, 650);
          } else {
            t.classList.add('tryagain'); W.fx && W.fx.softHint && W.fx.softHint(t);
            ctx.timer(() => t.classList.remove('tryagain'), 450);
          }
        };
        t.addEventListener('click', pick);
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
        frag.appendChild(t);
      });
      return { row: frag, target };
    }

    function renderTask() {
      if (idx >= tasks.length) {
        board.innerHTML = '';
        stepEl.textContent = '';
        // completion is never blank: show a clear finish card
        const doneCard = el('div.challenge-done', { dataset: { done: '1' } });
        doneCard.appendChild(el('div.challenge-done-ic', { text: '🌸' }));
        doneCard.appendChild(el('div.challenge-done-txt', { text: 'أكملت التحدّي! أزهرت نبتتك.' }));
        board.appendChild(doneCard);
        say('أكملت التحدّي! أزهرت نبتتك.', `${done} / ${tasks.length}`);
        if (opts.onDone) opts.onDone();
        return;
      }
      stepEl.textContent = `الخطوة ${idx + 1} من ${tasks.length}`;
      const built = buildTask();
      say(`اضغط «${built.target.ar}».`, built.target.en || '');
      // swap content in a single operation (no blank frame)
      board.replaceChildren(built.row);
    }
    renderTask();
    return { destroy() { wrap.remove(); } };
  }

  /* =====================================================================
   *  TRY IT YOURSELF (free practice) — real, by kind; «أرِني» stays
   *  Kinds map to real practice surfaces already in the app where possible;
   *  otherwise a concept sandbox (tap objects, hear names, arrange freely).
   * ===================================================================== */
  function mountPractice(ctx, host, lesson, opts) {
    const kind = W.CURR2.practiceKind(lesson.id);
    const say = opts.say;
    /* stage already cleared by clearStage(); keep guide+speak intact */
    const wrap = el('div.practice-wrap', { dataset: { practice: '1', kind } });
    host.appendChild(wrap);

    // Try real surfaces first (typing / paint) where the world modules exist.
    if (kind === 'type' && W.typing && W.typing.freePad) {
      try { W.typing.freePad(ctx, wrap, { lesson, say }); return { destroy() { wrap.remove(); } }; } catch (e) { /* fall through */ }
    }
    if (kind === 'paint' && W.paint && W.paint.freeCanvas) {
      try { W.paint.freeCanvas(ctx, wrap, { lesson, say }); return { destroy() { wrap.remove(); } }; } catch (e) { /* fall through */ }
    }
    if ((kind === 'browse' || kind === 'search' || kind === 'email') && W.net && W.net.freeSurface) {
      try { W.net.freeSurface(ctx, wrap, { lesson, kind, say }); return { destroy() { wrap.remove(); } }; } catch (e) { /* fall through */ }
    }

    // Concept sandbox fallback — always works, fully offline, gentle.
    const concepts = W.CURR2.concepts(lesson.id);
    const voice = W.speech && W.speech.available ? W.speech.available() : { any: false };
    const canSpeak = !!voice.any;
    if (canSpeak) say('اضغط أي صورة لتسمع اسمها، وجرّب بحرّية.', 'جرّب وحدك');
    else say('اضغط أي صورة لترى اسمها بالعربية والإنجليزية.', 'جرّب وحدك');
    const grid = el('div.ic2-grid', { dataset: { sandbox: '1' } });
    wrap.appendChild(grid);
    concepts.forEach(c => {
      const t = W.icons2.tile(c.key, c.ar, c.en);
      t.classList.add('sandbox-tile');
      t.setAttribute('role', 'button'); t.setAttribute('tabindex', '0');
      if (canSpeak) t.appendChild(el('span.card-speaker', { text: '🔊', 'aria-hidden': 'true' }));
      const pick = () => {
        t.classList.add('picked');
        if (canSpeak && W.speech && W.speech.say) W.speech.say(c.ar, c.en || '');
        say(c.ar, c.en || '');
        ctx.timer(() => t.classList.remove('picked'), 1000);
      };
      t.addEventListener('click', pick);
      t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      grid.appendChild(t);
    });
    return { destroy() { wrap.remove(); } };
  }

  /* =====================================================================
   *  THE HUB — mode bar + host; remembers per-lesson progress
   * ===================================================================== */
  function mount(ctx, frame, lesson) {
    const impl = W.lessons.get(lesson.id);
    const stage = frame.stage;

    // progress flags for this lesson (shared store)
    const st = W.store.lessonState(lesson.id);
    const seen = st.modes || {};

    // --- mode bar in the rail (never over the stage) ---
    const bar = el('div.mode-bar', { dataset: { modebar: '1' }, role: 'tablist', 'aria-label': 'أنماط الدرس' });
    frame.rail.appendChild(bar);
    const btns = {};
    MODES.forEach(m => {
      const b = el('button.mode-btn', {
        dataset: { mode: m.id, tone: m.tone }, role: 'tab', 'aria-label': m.ar,
      });
      const ic = el('span.mode-ic'); ic.appendChild(W.icons2.make(m.icon)); b.appendChild(ic);
      b.appendChild(el('span.mode-ar', { text: m.ar }));
      b.appendChild(el('span.mode-en', { text: m.en }));
      if (seen[m.id]) b.classList.add('visited');
      b.addEventListener('click', () => { W.audio.click(); go(m.id); });
      bar.appendChild(b);
      btns[m.id] = b;
    });

    // --- speech line shared by generated modes ---
    let curSpeak = null;
    function ensureSpeak(host) {
      const s = el('div.speak', { dataset: { speak: '1' } });
      host.appendChild(s);
      return (t, sub) => { s.innerHTML = ''; s.appendChild(el('span', { text: t })); if (sub) s.appendChild(el('span.en', { text: sub })); };
    }

    let active = null; // { id, api }
    function clearStage() {
      if (active && active.api && active.api.destroy) { try { active.api.destroy(); } catch (e) {} }
      // reset the stage for the next mode
      stage.innerHTML = '';
      active = null;
    }

    function markMode(id) {
      const s = W.store.lessonState(lesson.id);
      s.modes = s.modes || {};
      if (!s.modes[id]) { s.modes[id] = true; W.store.artworkSave; }
      // persist via lessonOpened path (store merges); use a light touch:
      try { W.store._setModes && W.store._setModes(lesson.id, s.modes); } catch (e) {}
      btns[id] && btns[id].classList.add('visited');
      // completion rule: Learn + Challenge done → lesson complete
      if (s.modes.learn && s.modes.challenge) W.store.lessonCompleted(lesson.id);
    }

    function go(id) {
      clearStage();
      MODES.forEach(m => btns[m.id].setAttribute('aria-selected', m.id === id ? 'true' : 'false'));
      Object.values(btns).forEach(b => b.classList.remove('active'));
      btns[id].classList.add('active');

      if (id === 'learn') {
        // reuse the real lesson: mount into the SAME frame (stage+rail already there)
        // Learn owns the stage; the mode bar remains in the rail.
        if (impl && impl.mount) {
          try { impl.mount(ctx, { frame: frame.frame, head: frame.head, rail: frame.rail, stage }, lesson); }
          catch (e) { fallbackLearn(); }
        } else { fallbackLearn(); }
        markMode('learn');
        active = { id, api: null };
        return;
      }

      const say = ensureSpeak(stage);
      const guide = W.guide.group(ctx, stage, { say }); // «أرِني» + idle hints available
      guide.help();
      const common = { say, guide, onDone: () => { markMode(id); } };

      let api;
      if (id === 'review') api = mountReview(ctx, stage, lesson, common);
      else if (id === 'challenge') api = mountChallenge(ctx, stage, lesson, common);
      else if (id === 'practice') api = mountPractice(ctx, stage, lesson, common);
      active = { id, api };
      markMode(id);
    }

    function fallbackLearn() {
      const say = ensureSpeak(stage);
      say('لنتعلّم بالصور.', lesson.en || '');
      mountReview(ctx, stage, lesson, { say, onDone: () => markMode('learn') });
    }

    // default mode: Learn With Me, unless a specific mode was requested (Teacher Mode launch)
    const startMode = (ctx.params && ctx.params.mode && MODES.some(m => m.id === ctx.params.mode)) ? ctx.params.mode : 'learn';
    go(startMode);
    return { go };
  }

  return { mount, MODES, mountReview, mountChallenge, mountPractice };
})();

/* ==== engine/analytics.js ==== */
/* Optional analytics adapter — DISABLED and inert in the offline school build.
 * The offline build makes zero network requests; this adapter only defines the
 * event surface for a possible future connected deployment (see ANALYTICS_GUIDE.md).
 * It never invents global counts: separate offline copies cannot form a central total. */
W.analytics = (function () {
  const queueless = { enabled: false };
  const events = ['app_opened', 'lesson_opened', 'lesson_completed', 'unit_completed'];
  return {
    get enabled() { return queueless.enabled; },
    events,
    /** In the offline build this is a no-op by design. */
    send(event, payload) {
      if (!queueless.enabled) return false;
      // A future connected build may register a transport here. None exists offline.
      return false;
    },
  };
})();

/* ==== engine/teacher.js ==== */
/* Teacher Mode — a ready classroom companion.
 * Opens with Ctrl+Shift+T (routed in boot.js). Gives the teacher every lesson's
 * objectives, official bilingual terms, suggested introduction, expected
 * misconceptions, teaching sequence, closure, assessment, timing and textbook
 * references; a Curriculum Evidence View (objective → interaction → evidence);
 * accurate local-device statistics (never "users"); and controls to launch or
 * restart any lesson, show a hint, pause animation, mute, reduce motion, run the
 * Supervisor Demo, open the finale, or return to the map. Fully local. */
W.teacherMode = (function () {
  const { el } = W.util;
  const C = () => window.WAHAT_CURRICULUM;
  let openEl = null, selId = null;

  function lessonById(id) { return C().lessons.find(l => l.id === id); }
  function teachOf(id) { return (C().teach && C().teach[id]) || {}; }

  function currentLessonId() {
    const sc = document.querySelector('.scene[data-scene="lesson"]');
    if (!sc) return null;
    // the lesson frame carries the title; match it back to an id
    const t = sc.querySelector('.lesson-title');
    if (!t) return null;
    const l = C().lessons.find(x => x.ar === t.textContent.trim());
    return l ? l.id : null;
  }

  function open() {
    if (openEl) return;
    selId = currentLessonId() || selId || '1.1';
    const stage = W.scene.stage || document.querySelector('.stage');
    const root = el('div.teacher', { dataset: { teacher: '1' }, role: 'dialog', 'aria-modal': 'true', 'aria-label': 'وضع المعلم' });

    // header
    const head = el('div.tm-head');
    head.appendChild(el('div.tm-title', { text: 'وضع المعلم — Teacher Mode' }));
    head.appendChild(el('div', { style: 'flex:1' }));
    const toggles = el('div.tm-toggles');
    toggles.appendChild(tmBtn('كتم الصوت', () => { const m = !W.store.settings.muted; W.audio.setMuted(m); flash(); }, { dataset: { tm: 'mute' } }));
    toggles.appendChild(tmBtn('تهدئة الحركة', () => { const v = document.documentElement.dataset.reducedMotion !== '1'; document.documentElement.dataset.reducedMotion = v ? '1' : ''; W.store.saveSettings({ reducedMotion: v }); flash(); }, { dataset: { tm: 'motion' } }));
    toggles.appendChild(tmBtn('إيقاف الحركة', () => { const v = document.documentElement.dataset.animPaused !== '1'; document.documentElement.dataset.animPaused = v ? '1' : ''; flash(); }, { dataset: { tm: 'pause' } }));
    head.appendChild(toggles);
    const close = el('button.tm-close', { text: '✕', 'aria-label': 'إغلاق وضع المعلم', dataset: { tm: 'close' }, onclick: () => api.close() });
    head.appendChild(close);
    root.appendChild(head);

    // body: unit/lesson rail + detail
    const body = el('div.tm-body');
    const rail = el('div.tm-rail', { dataset: { tmRail: '1' } });
    C().units.forEach(u => {
      rail.appendChild(el('div.tm-unit', { text: u.num + '. ' + u.ar }));
      C().lessons.filter(l => l.unit === u.id).forEach(l => {
        const st = W.store.lessonState(l.id);
        const b = el('button.tm-lesson' + (st.completed ? '.done' : ''), {
          dataset: { tmLesson: l.id },
          text: l.num + ' · ' + l.ar,
        });
        b.addEventListener('click', () => { selId = l.id; renderDetail(detail); markSel(rail); });
        rail.appendChild(b);
      });
    });
    body.appendChild(rail);

    const detail = el('div.tm-detail', { dataset: { tmDetail: '1' } });
    body.appendChild(detail);
    root.appendChild(body);

    // footer actions
    const foot = el('div.tm-foot');
    foot.appendChild(el('button.btn.primary', { text: '▶ العرض التوضيحي', dataset: { tm: 'demo' }, onclick: () => { api.close(); if (W.demo) W.demo.start(); } }));
    foot.appendChild(el('button.btn', { text: '📊 الإحصاءات', dataset: { tm: 'stats' }, onclick: () => renderStats(detail) }));
    foot.appendChild(el('button.btn', { text: '✨ المشهد الختامي', dataset: { tm: 'finale' }, onclick: () => { api.close(); W.scene.go('finale'); } }));
    foot.appendChild(el('button.btn', { text: '🗺️ خريطة الرحلة', dataset: { tm: 'map' }, onclick: () => { api.close(); W.scene.go('journey'); } }));
    foot.appendChild(el('div', { style: 'flex:1' }));
    foot.appendChild(el('div.tm-credit', { text: C().meta.credit }));
    root.appendChild(foot);

    stage.appendChild(root);
    openEl = root;
    markSel(rail);
    renderDetail(detail);

    root.addEventListener('keydown', e => { if (e.key === 'Escape') api.close(); });
    root.tabIndex = -1; root.focus();

    function flash() {
      // reflect toggle states in labels
      toggles.querySelector('[data-tm="mute"]').textContent = W.store.settings.muted ? 'تشغيل الصوت' : 'كتم الصوت';
      toggles.querySelector('[data-tm="motion"]').textContent = document.documentElement.dataset.reducedMotion === '1' ? 'تشغيل الحركة' : 'تهدئة الحركة';
      toggles.querySelector('[data-tm="pause"]').textContent = document.documentElement.dataset.animPaused === '1' ? 'تشغيل الحركة الآن' : 'إيقاف الحركة';
    }
  }

  function tmBtn(label, onClick, extra) {
    return el('button.tm-tbtn', Object.assign({ text: label, onclick: onClick }, extra || {}));
  }

  function markSel(rail) {
    rail.querySelectorAll('.tm-lesson.sel').forEach(x => x.classList.remove('sel'));
    const b = rail.querySelector(`.tm-lesson[data-tm-lesson="${selId}"]`);
    if (b) b.classList.add('sel');
  }

  function section(titleAr, node) {
    const s = el('div.tm-sec');
    s.appendChild(el('div.tm-sec-h', { text: titleAr }));
    s.appendChild(node);
    return s;
  }
  function ulOf(items) {
    const ul = el('ul.tm-ul');
    items.forEach(t => ul.appendChild(el('li', { text: t })));
    return ul;
  }
  function rowKV(k, v) {
    const r = el('div.tm-kv');
    r.appendChild(el('span.tm-kv-k', { text: k }));
    r.appendChild(el('span.tm-kv-v', { text: v }));
    return r;
  }
  function prevLessonId(id) {
    const order = ['1.1', '1.2', '1.3', '1.4', '1.5', '1.6', '2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '3.1', '3.2', '3.3', '3.4'];
    const i = order.indexOf(id);
    return i > 0 ? order[i - 1] : null;
  }

  function renderDetail(detail) {
    const l = lessonById(selId), t = teachOf(selId);
    detail.innerHTML = '';
    detail.dataset.view = 'lesson';

    const top = el('div.tm-lhead');
    top.appendChild(el('div.tm-lnum', { text: l.num }));
    const ttl = el('div');
    ttl.appendChild(el('div.tm-lname', { text: l.ar }));
    ttl.appendChild(el('div.tm-len', { text: l.en }));
    top.appendChild(ttl);
    detail.appendChild(top);

    // action row
    const acts = el('div.tm-acts');
    acts.appendChild(el('button.btn.primary', { text: '▶ تشغيل الدرس', dataset: { tm: 'launch' }, onclick: () => { api.close(); W.scene.go('lesson', { id: l.id }); } }));
    acts.appendChild(el('button.btn', { text: '↺ إعادة الدرس', dataset: { tm: 'restart' }, onclick: () => { api.close(); W.scene.go('lesson', { id: l.id }); } }));
    acts.appendChild(el('button.btn', { text: '💡 تلميح', dataset: { tm: 'hint' }, onclick: () => showHint(l.id) }));
    detail.appendChild(acts);

    // launch a specific mode directly (classroom demonstration)
    const modeActs = el('div.tm-mode-acts');
    [['learn', 'تعلّم معي'], ['practice', 'جرّب وحدك'], ['challenge', 'تحدٍّ صغير'], ['review', 'راجع بالصور']].forEach(m => {
      modeActs.appendChild(el('button.btn.tm-modelaunch', {
        text: m[1], dataset: { tm: 'mode-' + m[0] },
        onclick: () => { api.close(); W.scene.go('lesson', { id: l.id, mode: m[0] }); },
      }));
    });
    detail.appendChild(section('تشغيل نمط مباشرةً', modeActs));

    // reset this lesson's local progress (with confirm)
    const resetRow = el('div.tm-acts');
    resetRow.appendChild(el('button.btn.tm-reset', {
      text: '🧹 تصفير تقدّم هذا الدرس', dataset: { tm: 'reset-lesson' },
      onclick: () => {
        if (!window.confirm('تصفير تقدّم الدرس ' + l.id + ' على هذا الجهاز؟')) return;
        if (W.store && W.store.resetLesson) W.store.resetLesson(l.id);
        else if (W.store && W.store.clearLessonProgress) W.store.clearLessonProgress(l.id);
        renderStats(detail);
      },
    }));
    detail.appendChild(resetRow);

    const meta = el('div.tm-meta');
    const unitTitles = { '1': 'الوحدة الأولى · قلعة الحاسوب', '2': 'الوحدة الثانية · استديو الإبداع', '3': 'الوحدة الثالثة · سماء الوصل' };
    const unitKey = String(l.id).charAt(0);
    if (unitTitles[unitKey]) meta.appendChild(el('span.tm-chip.tm-unit', { text: unitTitles[unitKey] }));
    meta.appendChild(el('span.tm-chip', { text: '⏱ ' + (t.timingAr || '٣٠ دقيقة') }));
    if (l.pagesStudent) meta.appendChild(el('span.tm-chip', { text: 'كتاب التلميذ: ص ' + l.pagesStudent[0] + '–' + l.pagesStudent[1] }));
    if (l.pagesGuide) meta.appendChild(el('span.tm-chip', { text: 'دليل المعلم: ص ' + l.pagesGuide[0] + '–' + l.pagesGuide[1] }));
    if (l.unitChallenge) meta.appendChild(el('span.tm-chip.tm-chal', { text: 'تحدي الوحدة' }));
    detail.appendChild(meta);

    if (l.descAr) detail.appendChild(section('وصف الدرس', el('p.tm-p', { text: l.descAr })));
    detail.appendChild(section('أهداف الدرس', ulOf(l.objectives || [])));

    // terms table AR — EN
    const terms = el('div.tm-terms');
    (l.terms || []).forEach(tm => {
      const row = el('div.tm-term');
      row.appendChild(el('span.tm-tar', { text: tm.ar }));
      row.appendChild(el('span.tm-ten', { text: tm.en }));
      terms.appendChild(row);
    });
    if (l.keysAr) l.keysAr.forEach(k => { const row = el('div.tm-term'); row.appendChild(el('span.tm-tar', { text: k.ar })); row.appendChild(el('span.tm-ten', { text: k.en })); terms.appendChild(row); });
    detail.appendChild(section('المصطلحات (عربي — إنجليزي)', terms));

    if (t.teach && t.teach.introAr) detail.appendChild(section('التمهيد', el('p.tm-p', { text: t.teach.introAr })));
    // previous knowledge: the prior lesson's objectives feed this one
    const prevId = prevLessonId(l.id);
    if (prevId) {
      const pv = (C().lessons || []).find(x => x.id === prevId);
      if (pv) detail.appendChild(section('المعرفة السابقة', el('p.tm-p', { text: 'يبني هذا الدرس على الدرس ' + prevId + ' «' + pv.ar + '».' })));
    }
    if (t.strategyAr) detail.appendChild(section('استراتيجية التدريس المقترحة', el('p.tm-p', { text: t.strategyAr })));
    if (t.skillsAr && t.skillsAr.length) detail.appendChild(section('المهارات العملية المطلوبة', ulOf(t.skillsAr)));
    if (t.activitiesAr && t.activitiesAr.length) detail.appendChild(section('أنشطة الكتاب', ulOf(t.activitiesAr)));
    if (t.teach && t.teach.misAr) detail.appendChild(section('التحديات المتوقعة', ulOf(t.teach.misAr)));
    if (t.safetyAr && t.safetyAr.length) detail.appendChild(section('مفاهيم السلامة', ulOf(t.safetyAr)));

    // teaching sequence from evidence acts
    if (t.evidence) detail.appendChild(section('تسلسل التدريس', ulOf(t.evidence.map(e => e.actAr))));
    if (t.teach && t.teach.closureAr) detail.appendChild(section('الغلق والمناقشة', el('p.tm-p', { text: t.teach.closureAr })));

    // Curriculum Evidence View
    if (t.evidence) {
      const table = el('div.tm-ev');
      const hrow = el('div.tm-ev-row.tm-ev-head');
      hrow.appendChild(el('span', { text: 'الهدف' }));
      hrow.appendChild(el('span', { text: 'التفاعل' }));
      hrow.appendChild(el('span', { text: 'دليل التعلّم' }));
      table.appendChild(hrow);
      t.evidence.forEach(e => {
        const r = el('div.tm-ev-row');
        r.appendChild(el('span', { text: e.objAr }));
        r.appendChild(el('span', { text: e.actAr }));
        r.appendChild(el('span', { text: e.evAr }));
        table.appendChild(r);
      });
      detail.appendChild(section('عرض الأدلّة على تحقّق المنهج', table));
    }

    detail.appendChild(section('التقييم', el('p.tm-p', { text: 'تقييم تكوينيّ تفاعليّ في نهاية الدرس (٣–٥ مهامّ): اختيار ومطابقة وتوصيل وأداء المهارة في موقف جديد، مع تغذية راجعة لطيفة دون درجات.' })));

    // classroom-use overview (item 3E): teacher-introduces / child-does / teacher-observes
    if (t.evidence && t.evidence.length) {
      const co = el('div.tm-classroom');
      const first = t.evidence[0];
      co.appendChild(rowKV('يقدّم المعلم', t.teach && t.teach.introAr ? t.teach.introAr : (t.strategyAr || '')));
      co.appendChild(rowKV('ينفّذ الطفل', t.evidence.map(e => e.actAr).join(' ثم ')));
      co.appendChild(rowKV('يلاحظ المعلم', t.evidence.map(e => e.evAr).join(' — ')));
      if (t.teach && t.teach.misAr && t.teach.misAr.length) co.appendChild(rowKV('نقاط الصعوبة المتوقّعة', t.teach.misAr.join(' ')));
      co.appendChild(rowKV('دليل الإتقان', 'إكمال المهامّ الختامية بنجاح والإجابة الصحيحة في موقفٍ جديد.'));
      detail.appendChild(section('نظرة الاستخدام الصفّي', co));
    }

    // curriculum-coverage status + the four modes present in every lesson (v2)
    const modesRow = el('div.tm-modes');
    [['تعلّم معي', 'Learn With Me'], ['جرّب وحدك', 'Try It Yourself'], ['تحدٍّ صغير', 'Small Challenge'], ['راجع بالصور', 'Review With Pictures']].forEach(m => {
      const c = el('span.tm-modechip');
      c.appendChild(el('span.tm-modechip-ar', { text: '✓ ' + m[0] }));
      c.appendChild(el('span.tm-modechip-en', { text: m[1] }));
      modesRow.appendChild(c);
    });
    detail.appendChild(section('الأنماط الأربعة (متوفّرة في هذا الدرس)', modesRow));
    detail.appendChild(section('حالة تغطية المنهج', el('p.tm-p.tm-cov', { text: t.coverageAr || 'مغطّى في v2.0 مع الأنماط الأربعة وتقويم عمليّ.' })));
    detail.scrollTop = 0;
  }

  function renderStats(detail) {
    const s = W.store.statsSnapshot();
    detail.innerHTML = '';
    detail.dataset.view = 'stats';
    detail.appendChild(el('div.tm-lhead', {}, [el('div.tm-lname', { text: 'إحصاءات هذا الجهاز' }), el('div.tm-len', { text: 'Local device statistics' })]));
    detail.appendChild(el('p.tm-note', { text: 'كل الأرقام محلية على هذا الجهاز فقط، ولا تُجمَع أيّ بيانات شخصية، ولا يوجد عدّاد مستخدمين عالميّ.' }));

    const rows = [];
    rows.push(['عدد مرات فتح البرنامج على هذا الجهاز', String(s.opens || 0)]);
    rows.push(['عدد الجلسات المحلية', String(s.sessions || 0)]);
    const completedN = Object.keys(s.completed || {}).length;
    rows.push(['الدروس المكتملة محليًّا', completedN + ' من ١٦']);
    // most opened lesson
    let most = null, mostN = 0;
    Object.keys(s.lessonOpens || {}).forEach(id => { if (s.lessonOpens[id] > mostN) { mostN = s.lessonOpens[id]; most = id; } });
    rows.push(['أكثر درس فتحًا', most ? (labelFor(most) + ' (' + mostN + ')') : '—']);
    rows.push(['آخر درس زُرته', s.lastLesson ? labelFor(s.lastLesson) : '—']);
    rows.push(['تاريخ آخر استخدام', s.lastUse ? fmtDate(s.lastUse) : '—']);

    const grid = el('div.tm-stats');
    rows.forEach(([k, v]) => {
      const r = el('div.tm-stat');
      r.appendChild(el('span.tm-stat-k', { text: k }));
      r.appendChild(el('span.tm-stat-v', { text: v }));
      grid.appendChild(r);
    });
    detail.appendChild(grid);

    // per-lesson opens
    const per = el('div.tm-peropens');
    C().lessons.forEach(l => {
      const n = (s.lessonOpens || {})[l.id] || 0;
      const r = el('div.tm-peropen');
      r.appendChild(el('span', { text: l.num + ' · ' + l.ar }));
      r.appendChild(el('span.tm-peropen-n' + (n ? '.on' : ''), { text: String(n) }));
      per.appendChild(r);
    });
    detail.appendChild(section('مرات فتح كل درس', per));

    const reset = el('button.btn', { text: '🗑 تصفير الإحصاءات المحلية', dataset: { tm: 'reset-stats' }, style: 'margin-top:calc(var(--su)*12)' });
    reset.addEventListener('click', () => {
      W.ui.dialog({ root: openEl }, (box, closeD) => {
        box.appendChild(el('h2', { text: 'تصفير الإحصاءات؟' }));
        box.appendChild(el('p.t-body', { text: 'سيُحذف عدّ مرات الفتح والجلسات على هذا الجهاز. لا يمكن التراجع.' }));
        const a = el('div.d-actions');
        a.appendChild(el('button.btn', { text: 'إلغاء', onclick: closeD }));
        a.appendChild(el('button.btn.primary', { text: 'تصفير', dataset: { tm: 'reset-confirm' }, onclick: () => { W.store.resetStats(); closeD(); renderStats(detail); } }));
        box.appendChild(a);
      });
    });
    detail.appendChild(reset);
    detail.scrollTop = 0;
  }

  function labelFor(id) { const l = lessonById(id); return l ? (l.num + ' · ' + l.ar) : id; }
  function fmtDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' }) + ' — ' + d.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso.slice(0, 10); }
  }

  function showHint(id) {
    // close the panel so the teacher sees the lesson, then pulse the next step
    const wasLesson = document.querySelector('.scene[data-scene="lesson"]');
    if (!wasLesson || currentLessonId() !== id) { api.close(); W.scene.go('lesson', { id }); return; }
    api.close();
    const sc = document.querySelector('.scene[data-scene="lesson"]');
    if (!sc) return;
    const speak = sc.querySelector('[data-speak]');
    if (speak) W.fx.glow(speak);
    const hl = sc.querySelector('.hl, .beckon, .q-hint, .kb-key.hl');
    if (hl) W.fx.glow(hl);
    const undone = sc.querySelector('.lantern-item:not([data-done])');
    if (undone) W.fx.glow(undone);
  }

  const api = {
    open,
    close() { if (openEl) { openEl.remove(); openEl = null; } },
    get isOpen() { return !!openEl; },
    showStats() { if (openEl) { const d = openEl.querySelector('[data-tm-detail]'); if (d) renderStats(d); } },
    selectLesson(id) { selId = id; if (openEl) { renderDetail(openEl.querySelector('[data-tm-detail]')); markSel(openEl.querySelector('[data-tm-rail]')); } },
  };
  return api;
})();

/* Supervisor Demo Mode — a polished ~4-minute automatic tour of the highlights.
 * Opens with Ctrl+Shift+D or from Teacher Mode. Presents the opening oasis and the
 * falaj light, the flagship Computer Parts lesson, the drawing studio, the offline
 * browser / email / search, the teacher tools with curriculum evidence, and the
 * restored oasis — while noting 3 units, 16 lessons, bilingual terms, fully offline
 * operation and future expansion to Grades 2–4. Skippable at any moment. It never
 * replaces the real interactive product. */
W.demo = (function () {
  const { el } = W.util;
  let overlay = null, timer = null, i = 0, beats = null;

  function caption(capAr, capEn) {
    const cap = overlay.querySelector('[data-demo-cap]');
    cap.innerHTML = '';
    cap.appendChild(el('div.dm-ar', { text: capAr }));
    if (capEn) cap.appendChild(el('div.dm-en', { text: capEn }));
    cap.classList.remove('dm-pop'); void cap.offsetWidth; cap.classList.add('dm-pop');
  }
  function dots() {
    const d = overlay.querySelector('[data-demo-dots]');
    d.innerHTML = '';
    beats.forEach((b, k) => d.appendChild(el('span.dm-dot' + (k === i ? '.on' : (k < i ? '.done' : '')))));
  }

  function BEATS() {
    return [
      { go: ['opening'], capAr: 'واحة التقنية — رحلة الضوء في عالمي الرقمي', capEn: 'Wahat Al-Taqnia — a cinematic Omani learning world', ms: 4200,
        enter() { setTimeout(() => { try { const w = document.querySelector('[data-touch-water]'); if (w && typeof w.click === 'function') w.click(); else if (w) w.dispatchEvent(new MouseEvent('click', { bubbles: true })); } catch (e) {} }, 1400); } },
      { go: null, capAr: 'الفَلَج يحمل الماء، والآلة تحمل الضوء', capEn: 'The falaj carries water, and the machine carries light', ms: 4200 },
      { go: ['journey'], capAr: 'ثلاث محطّات: قلعة الحاسوب، استديو الإبداع، سماء الوصل', capEn: '3 worlds · 16 lessons · one connected journey', ms: 4200 },
      { go: ['location', { unit: 'u1' }], capAr: 'الوحدة الأولى: قلعة الحاسوب', capEn: 'Unit 1 — The Computer Citadel', ms: 3400 },
      { go: ['lesson', { id: '1.2' }], capAr: 'الدرس المرجعيّ: أجزاء الحاسوب — كل جزء باسمه', capEn: 'Flagship lesson: Computer Parts — every part named', ms: 4600,
        enter() { try { setTimeout(() => { const m = document.querySelector('.part[data-part="monitor"]'); if (m) m.click(); }, 1200); setTimeout(() => { const k = document.querySelector('.part[data-part="keyboard"]'); if (k) k.click(); }, 2600); } catch (e) {} } },
      { go: null, capAr: 'لغز الشاشة المظلمة: وحدة النظام تعمل والشاشة نائمة', capEn: 'The Dark Monitor puzzle — discovery, not telling', ms: 4200 },
      { go: ['lesson', { id: '1.1' }], capAr: 'الأنماط الأربعة في كل درس: تعلّم معي، جرّب وحدك، تحدٍّ صغير، راجع بالصور', capEn: 'Four modes in every lesson — one shared lesson, four ways to learn', ms: 7200,
        enter() { try {
          const clicks = ['review', 'practice', 'challenge', 'learn'];
          clicks.forEach((m, k) => setTimeout(() => { const b = document.querySelector(`.mode-btn[data-mode="${m}"]`); if (b) b.click(); }, 1200 + k * 1400)); } catch (e) {} } },
      { go: ['location', { unit: 'u2' }], capAr: 'الوحدة الثانية: استديو الإبداع', capEn: 'Unit 2 — The Creativity Studio', ms: 3400 },
      { go: ['lesson', { id: '2.4' }], capAr: 'دمج الأشكال: بناء شمس الاستديو', capEn: 'Combining shapes to rebuild the studio sun', ms: 4200 },
      { go: ['location', { unit: 'u3' }], capAr: 'الوحدة الثالثة: سماء الوصل', capEn: 'Unit 3 — The Sky of Connection', ms: 3400 },
      { go: ['lesson', { id: '3.2' }], capAr: 'متصفّح آمن يعمل دون إنترنت بصفحات محلّية', capEn: 'A safe browser — fully offline, local pages only', ms: 4200 },
      { go: ['lesson', { id: '3.3' }], capAr: 'بريد إلكترونيّ محليّ آمن برسائل قصصيّة', capEn: 'Safe local email with story-based messages', ms: 4000 },
      { go: ['lesson', { id: '3.4' }], capAr: 'بحث محليّ آمن بكلمات مفتاحية ونتائج جاهزة', capEn: 'Safe local search with prepared results', ms: 4000 },
      { go: ['journey'], capAr: 'وضع المعلم: أهداف ومصطلحات ثنائية اللغة وأدلّة المنهج', capEn: 'Teacher tools: objectives, bilingual terms, curriculum evidence', ms: 5200,
        enter() { try { W.teacherMode.open(); W.teacherMode.selectLesson('1.2'); } catch (e) {} },
        leave() { try { W.teacherMode.close(); } catch (e) {} } },
      { go: ['journey'], capAr: 'إحصاءات محلية على هذا الجهاز فقط — لا بيانات شخصية ولا عدّاد مستخدمين', capEn: 'Local-only statistics on this device — no personal data collected', ms: 5000,
        enter() { try { W.teacherMode.open(); const sb = document.querySelector('[data-tm="stats"], .tm-navbtn'); if (W.teacherMode.showStats) W.teacherMode.showStats(); } catch (e) {} },
        leave() { try { W.teacherMode.close(); } catch (e) {} } },
      { go: ['finale'], capAr: 'عاد نبض الفلج', capEn: 'The falaj beats again — the oasis is restored', ms: 4600 },
      { go: null, capAr: '٣ وحدات · ١٦ درسًا · مصطلحات ثنائية اللغة · يعمل دون إنترنت · قابل للتوسّع للصفوف ٢–٤', capEn: '3 units · 16 lessons · bilingual · offline · ready for Grades 2–4', ms: 5200 },
    ];
  }

  function run() {
    if (!overlay) return;
    const prev = beats[i - 1];
    if (prev && prev.leave) prev.leave();
    if (i >= beats.length) { end(true); return; }
    const b = beats[i];
    if (b.go) { try { W.scene.go(b.go[0], b.go[1]); } catch (e) {} }
    caption(b.capAr, b.capEn);
    dots();
    // keep the demo overlay on top even after a scene (re)mounts
    lift();
    if (b.enter) b.enter();
    timer = setTimeout(() => { i++; run(); }, b.ms);
  }

  function lift() {
    const stage = W.scene.stage || document.querySelector('.stage');
    if (overlay.parentElement !== stage) stage.appendChild(overlay);
    else stage.appendChild(overlay); // re-append to top of stacking within stage
  }

  function start() {
    if (overlay) return;
    const stage = W.scene.stage || document.querySelector('.stage');
    overlay = el('div.demo', { dataset: { demo: '1' }, 'aria-label': 'العرض التوضيحي للمشرف' });
    const top = el('div.dm-top');
    top.appendChild(el('div.dm-badge', { text: 'عرض توضيحي' }));
    top.appendChild(el('div', { style: 'flex:1' }));
    const skip = el('button.dm-skip', { text: 'إنهاء العرض ✕', dataset: { demoSkip: '1' }, onclick: () => end(false) });
    top.appendChild(skip);
    overlay.appendChild(top);
    const cap = el('div.dm-cap', { dataset: { demoCap: '1' } });
    overlay.appendChild(cap);
    const dotsEl = el('div.dm-dots', { dataset: { demoDots: '1' } });
    overlay.appendChild(dotsEl);
    overlay.appendChild(el('div.dm-credit', { text: window.WAHAT_CURRICULUM.meta.credit }));
    stage.appendChild(overlay);

    window.addEventListener('keydown', escHandler, true);
    beats = BEATS();
    i = 0;
    run();
  }

  function escHandler(e) { if (e.key === 'Escape') { e.preventDefault(); end(false); } }

  function end(complete) {
    if (timer) { clearTimeout(timer); timer = null; }
    const prev = beats && beats[i];
    if (prev && prev.leave) prev.leave();
    try { W.teacherMode && W.teacherMode.close(); } catch (e) {}
    window.removeEventListener('keydown', escHandler, true);
    if (overlay) { overlay.remove(); overlay = null; }
    beats = null; i = 0;
    W.scene.go('home');
  }

  return { start, end, get isRunning() { return !!overlay; } };
})();

/* ==== scenes/worldstage.js ==== */
/* World stage helpers shared by opening / home / journey:
 * mounts the layered world, wires parallax, plays the falaj wake choreography,
 * and builds the physical home signposts and the inscribed title. */
W.worldstage = (function () {
  const { el, sv } = W.util;

  function mount(ctx, opts) {
    const o = opts || {};
    const wrap = el('div.world-wrap');
    const w3 = el('div.world3d');
    const pano = W.art.panorama({ time: o.time || 'dawn', progress: o.progress || 0 });
    w3.appendChild(pano.svg);
    wrap.appendChild(w3);
    const dim = el('div', {
      class: 'world-dim',
      style: 'position:absolute;inset:0;pointer-events:none;background:rgba(9,13,42,.48);' +
             'opacity:' + (o.asleep ? '1' : '0') + ';transition:opacity 2.4s ease',
    });
    wrap.appendChild(dim);
    wrap.appendChild(el('div.grade'));
    wrap.appendChild(el('div.grain'));
    ctx.root.appendChild(wrap);
    W.art.parallax(ctx, wrap);
    if (o.asleep) sleepWorld(pano);
    return { wrap, w3, pano, dim };
  }

  function sleepWorld(pano) {
    pano.refs.lanterns.forEach(l => {
      const glow = l.querySelector('.lamp-glow'); if (glow) glow.setAttribute('opacity', '0');
      const glass = l.querySelector('.lamp-glass'); if (glass) glass.setAttribute('fill', '#3a2c3c');
    });
  }

  /* light a recessed window group */
  function lightWin(winG) {
    if (!winG) return;
    const glow = winG.querySelector('.wglow'), lit = winG.querySelector('.wlit');
    [glow, lit].forEach(n => { if (n) { n.setAttribute('opacity', '1'); n.classList.add('win-wake'); } });
  }
  function lightLantern(l) {
    const glow = l.querySelector('.lamp-glow'); if (glow) glow.setAttribute('opacity', '1');
    const glass = l.querySelector('.lamp-glass'); if (glass) glass.setAttribute('fill', '#ffd166');
  }
  function bloomPlant(p) {
    const blades = p.querySelector('.blades'); if (blades) blades.setAttribute('stroke', 'url(#frond)');
    const fl = p.querySelector('.flower'); if (fl) { fl.setAttribute('opacity', '1'); fl.classList.add('win-wake'); }
  }

  /* ripple rings at a point in panorama coordinates */
  function ripple(pano, x, y) {
    for (let i = 0; i < 3; i++) {
      const c = sv('circle', {
        cx: x, cy: y, r: 10 + i * 4, fill: 'none', stroke: '#eafffb',
        'stroke-width': 3 - i * .6, class: 'ripple-ring', opacity: .9,
        style: `animation-delay:${i * .16}s`,
      });
      pano.svg.appendChild(c);
      setTimeout(() => c.remove(), 1900);
    }
  }

  /**
   * The falaj awakening: a thin golden thread with a warm light head travels
   * the foreground channel; windows, lanterns and plants wake as it passes.
   */
  function wake(ctx, world, opts) {
    const o = opts || {};
    const pano = world.pano;
    const reduced = document.documentElement.dataset.reducedMotion === '1';
    const layer = sv('g', { class: 'thread-layer' });
    pano.svg.appendChild(layer);
    const guide = sv('path', { d: pano.refs.foreWaterD, fill: 'none', stroke: 'none' });
    layer.appendChild(guide);
    const total = guide.getTotalLength();
    const gold = sv('path', {
      d: pano.refs.foreWaterD, fill: 'none', stroke: '#ffd166', 'stroke-width': 4.5,
      'stroke-linecap': 'round', class: 'thread', 'stroke-dasharray': total + ' ' + total,
      'stroke-dashoffset': total, opacity: .95,
    });
    layer.appendChild(gold);
    const trail = [];
    for (let i = 0; i < 4; i++) {
      const t = sv('circle', { r: 5 - i, fill: '#ffe2a3', opacity: (0.55 - i * .12), class: 'thread' });
      layer.appendChild(t); trail.push(t);
    }
    const head = sv('circle', { r: 7, fill: 'url(#threadGlow)', class: 'thread-head' });
    const headCore = sv('circle', { r: 3.4, fill: '#fff6dd' });
    layer.appendChild(head); layer.appendChild(headCore);

    const marks = { fort: false, studio: false, tower: false, l1: false, l2: false };
    function fire(frac) {
      if (frac > .12 && !marks.l2) { marks.l2 = true; lightLantern(pano.refs.lanterns[1]); W.audio.hint(); }
      if (frac > .2 && !marks.fort) {
        marks.fort = true;
        pano.refs.fort.querySelectorAll('.win').forEach((wn, i) => setTimeout(() => lightWin(wn), i * 220));
        W.audio.note(523, .35);
      }
      if (frac > .55 && !marks.studio) {
        marks.studio = true;
        pano.refs.studio.querySelectorAll('.win').forEach((wn, i) => setTimeout(() => lightWin(wn), i * 220));
        W.audio.note(587, .35);
      }
      if (frac > .68 && !marks.l1) { marks.l1 = true; lightLantern(pano.refs.lanterns[0]); }
      if (frac > .86 && !marks.tower) {
        marks.tower = true;
        const b = pano.refs.tower.querySelector('.beacon'); if (b) { b.setAttribute('opacity', '1'); b.classList.add('win-wake'); }
        const bc = pano.refs.tower.querySelector('.beacon-core'); if (bc) bc.setAttribute('fill', '#ffe2a3');
        pano.refs.tower.querySelectorAll('.win').forEach(wn => lightWin(wn));
        W.audio.note(659, .4);
      }
      const headPt = guide.getPointAtLength(frac * total);
      pano.refs.plants.forEach(p => {
        if (p.dataset.woke) return;
        const tf = p.getAttribute('transform');
        const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(tf);
        if (m && Math.abs(+m[1] - headPt.x) < 130 && Math.abs(+m[2] - headPt.y) < 120) {
          p.dataset.woke = '1'; bloomPlant(p);
        }
      });
    }

    const dur = o.duration || 3600;
    world.dim.style.opacity = '0';
    if (reduced) {
      gold.setAttribute('stroke-dashoffset', '0');
      const pt = guide.getPointAtLength(total);
      head.setAttribute('cx', pt.x); head.setAttribute('cy', pt.y);
      headCore.setAttribute('cx', pt.x); headCore.setAttribute('cy', pt.y);
      for (let f = 0; f <= 1; f += .1) fire(f);
      pano.refs.plants.forEach(bloomPlant);
      setTimeout(() => { gold.style.transition = 'opacity 1.2s'; gold.setAttribute('opacity', '.35'); }, 400);
      if (o.onDone) setTimeout(o.onDone, 500);
      return;
    }
    const t0 = performance.now();
    function step(now) {
      if (!layer.isConnected) return;
      const f = Math.min(1, (now - t0) / dur);
      const e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      gold.setAttribute('stroke-dashoffset', String(total * (1 - e)));
      const pt = guide.getPointAtLength(e * total);
      head.setAttribute('cx', pt.x); head.setAttribute('cy', pt.y);
      headCore.setAttribute('cx', pt.x); headCore.setAttribute('cy', pt.y);
      trail.forEach((tc, i) => {
        const tp = guide.getPointAtLength(Math.max(0, e - (i + 1) * .028) * total);
        tc.setAttribute('cx', tp.x); tc.setAttribute('cy', tp.y);
      });
      fire(e);
      if (f < 1) requestAnimationFrame(step);
      else {
        setTimeout(() => {
          gold.style.transition = 'opacity 1.6s'; gold.setAttribute('opacity', '.35');
          head.style.transition = 'opacity 1.6s'; head.setAttribute('opacity', '.5');
          trail.forEach(tc => tc.remove()); headCore.remove();
        }, 500);
        if (o.onDone) setTimeout(o.onDone, 550);
      }
    }
    requestAnimationFrame(step);
  }

  /* inscribed title — part of the sky, not a card */
  function titleInscription(small) {
    const m = window.WAHAT_CURRICULUM.meta;
    const box = el('div', {
      dataset: { title: '1' },
      style: 'position:absolute;top:' + (small ? '4%' : '9%') + ';inset-inline:0;margin:auto;width:max-content;' +
             'text-align:center;z-index:22;pointer-events:none;',
    });
    const t = el('div', {
      text: m.projectAr,
      style: 'font-size:calc(var(--su)*' + (small ? 44 : 66) + ');font-weight:700;color:#ffe9b8;' +
             'text-shadow:0 calc(var(--su)*2) 0 rgba(120,60,10,.55), 0 calc(var(--su)*5) calc(var(--su)*22) rgba(0,0,0,.65), 0 0 calc(var(--su)*30) rgba(255,209,102,.35);' +
             'letter-spacing:.01em;',
    });
    box.appendChild(t);
    if (!small) {
      box.appendChild(el('div', {
        text: m.subtitleAr,
        style: 'font-size:calc(var(--su)*24);color:#f2c98f;text-shadow:0 2px 12px rgba(0,0,0,.7);margin-top:calc(var(--su)*2)',
      }));
      box.appendChild(el('div', {
        style: 'color:#c97f3d;font-size:calc(var(--su)*16);margin-top:calc(var(--su)*4);opacity:.9',
      }, [el('span', { style: 'letter-spacing:.3em', text: '⸻ ✦ ⸻' })]));
      box.appendChild(el('div', {
        text: m.stageAr,
        style: 'font-size:calc(var(--su)*19);color:#e8cf9b;text-shadow:0 2px 8px rgba(0,0,0,.7);margin-top:calc(var(--su)*3)',
      }));
    }
    return box;
  }

  /* the three destinations as carved signposts standing in the world */
  function homeSigns(ctx, appear) {
    const wrap = el('div', { style: 'position:absolute;inset:0;z-index:24;pointer-events:none' });
    function sign(action, label, sub, x, y, primary, go) {
      const post = el('div', {
        style: 'position:absolute;inset-inline-start:' + x + '%;top:' + y + '%;transform:translate(-50%,0);pointer-events:auto;' +
               (appear ? 'opacity:0;transition:opacity .9s ease ' + (0.15 + Math.random() * 0.2) + 's, transform .9s ease;' : ''),
      });
      const stick = el('div', {
        style: 'position:absolute;top:calc(var(--su)*30);inset-inline-start:50%;transform:translateX(-50%);' +
               'width:calc(var(--su)*10);height:calc(var(--su)*86);border-radius:calc(var(--su)*4);' +
               'background:linear-gradient(90deg,#8a5a30,#58341a);box-shadow:inset calc(var(--su)*2) 0 0 rgba(255,230,180,.3), 0 calc(var(--su)*6) calc(var(--su)*10) rgba(8,4,0,.5)',
      });
      post.appendChild(stick);
      const p = el('button.plaque', {
        dataset: { action },
        style: 'position:relative;inset-inline-start:auto;top:auto;transform:none;' +
               (primary ? 'background:linear-gradient(180deg,rgba(255,240,200,.25),rgba(0,0,0,.12)),linear-gradient(180deg,#d99a4e 0%,#b3712f 55%,#8a5424 100%);' : ''),
        onclick: () => { W.audio.click(); go(); },
      });
      p.appendChild(el('span', { text: label }));
      if (sub) p.appendChild(el('span.sub', { text: sub }));
      post.appendChild(p);
      wrap.appendChild(post);
      if (appear) requestAnimationFrame(() => requestAnimationFrame(() => { post.style.opacity = '1'; }));
      return post;
    }
    const hasProg = W.store.hasProgress;
    sign('start', 'ابدأ الرحلة', 'من قلعة الحاسوب', 66, 68, !hasProg, () => W.scene.go('journey', { zoomTo: 'u1' }));
    sign('choose', 'اختر درسًا', 'خريطة الواحة', 41, 73, false, () => W.scene.go('journey'));
    if (hasProg) {
      sign('continue', 'تابع رحلتك', '', 18, 66, true, () => {
        const last = W.store.lastLesson;
        const lessons = window.WAHAT_CURRICULUM.lessons;
        const idx = lessons.findIndex(l => l.id === last);
        const st = last && W.store.lessonState(last);
        let target = last || '1.2';
        if (st && st.completed && idx >= 0) {
          const next = lessons.slice(idx + 1).find(l => W.lessons.has(l.id));
          if (next) target = next.id;
        }
        if (!W.lessons.has(target)) target = '1.2';
        W.scene.go('lesson', { id: target });
      });
    }
    ctx.root.appendChild(wrap);
    return wrap;
  }

  return { mount, wake, ripple, titleInscription, homeSigns, lightWin, lightLantern, bloomPlant };
})();

/* ==== scenes/opening.js ==== */
/* Opening — the child wakes the oasis by touching the falaj water. */
W.scene.register('opening', {
  mount(ctx) {
    const { el, sv } = W.util;
    const world = W.worldstage.mount(ctx, { time: 'dawn', progress: 0, asleep: true });
    ctx.root.appendChild(W.ui.credit());
    const speak = el('div.speak', { text: 'المس ماء الفلج', dataset: { speak: '1' } });
    ctx.root.appendChild(speak);

    /* pulsing invitation on the water */
    const guide = sv('path', { d: world.pano.refs.foreWaterD, fill: 'none', stroke: 'none' });
    world.pano.svg.appendChild(guide);
    const pt = guide.getPointAtLength(guide.getTotalLength() * 0.44);
    const pulse = sv('circle', { cx: pt.x, cy: pt.y, r: 12, fill: 'none', stroke: '#eafffb', 'stroke-width': 3, class: 'touch-pulse' });
    const pulseDot = sv('circle', { cx: pt.x, cy: pt.y, r: 5, fill: '#eafffb', opacity: .95 });
    world.pano.svg.appendChild(pulse); world.pano.svg.appendChild(pulseDot);

    /* wide invisible touch target along the water */
    const touch = sv('path', {
      d: world.pano.refs.foreWaterD, fill: 'none', stroke: 'rgba(0,0,0,0.001)', 'stroke-width': 70,
      'stroke-linecap': 'round', style: 'cursor:pointer', tabindex: 0, role: 'button',
      'aria-label': 'المس ماء الفلج لتوقظ الواحة', 'data-touch-water': '1',
    });
    world.pano.svg.appendChild(touch);

    let touched = false;
    const begin = ev => {
      if (touched) return; touched = true;
      W.audio.unlock(); W.audio.water(true);
      ctx.onCleanup(() => W.audio.water(false));
      pulse.remove(); pulseDot.remove(); touch.remove();
      let rx = pt.x, ry = pt.y;
      if (ev && ev.clientX != null) {
        const ctm = world.pano.svg.getScreenCTM();
        if (ctm) { const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse()); rx = p.x; ry = p.y; }
      }
      W.worldstage.ripple(world.pano, rx, ry);
      speak.textContent = '';
      W.worldstage.wake(ctx, world, {
        onDone() {
          W.store.saveSettings({ seenIntro: true });
          ctx.root.appendChild(W.worldstage.titleInscription(false));
          speak.textContent = 'اختر طريقك';
          W.worldstage.homeSigns(ctx, true);
          W.audio.success();
        },
      });
    };
    ctx.listen(touch, 'pointerdown', begin);
    ctx.listen(touch, 'keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); begin(); } });
    ctx.after(400, () => touch.focus && touch.focus());
  },
});

/* ==== scenes/journey.js ==== */
/* Journey — the oasis map: exactly three living destinations. */
W.scene.register('journey', {
  mount(ctx) {
    const { el } = W.util;
    const C = window.WAHAT_CURRICULUM;
    const progress = Math.max(.4, W.store.completedCount() / 16 + .4);
    const world = W.worldstage.mount(ctx, { time: 'dawn', progress });
    world.pano.refs.plants.forEach(W.worldstage.bloomPlant);
    W.audio.water(true); ctx.onCleanup(() => W.audio.water(false));
    ctx.root.appendChild(W.ui.credit());
    ctx.root.appendChild(el('div.speak', { text: 'إلى أين نذهب؟', dataset: { speak: '1' } }));

    const chrome = el('div.chrome');
    chrome.appendChild(W.ui.iconBtn('العودة', '🏠', () => { W.audio.click(); W.scene.go('home'); }, { dataset: { action: 'home' } }));
    chrome.appendChild(el('div.spacer'));
    chrome.appendChild(W.ui.muteBtn(ctx));
    ctx.root.appendChild(chrome);

    const layer = el('div', { style: 'position:absolute;inset:0;z-index:20' });
    ctx.root.appendChild(layer);
    const landmarkEl = { u1: world.pano.refs.fort, u2: world.pano.refs.studio, u3: world.pano.refs.tower };

    function place(hs, unitId, dy) {
      const g = landmarkEl[unitId];
      const gr = g.getBoundingClientRect();
      const rr = ctx.root.getBoundingClientRect();
      hs.style.insetInlineStart = (((gr.left + gr.width / 2) - rr.left) / rr.width * 100) + '%';
      /* FINAL POLISH (6): the destination sits on its landmark but is kept
       * clear of the bottom edge and of the fixed global controls
       * (attribution, Back to Grade Page, Teacher Mode). Only the hotspot
       * moves — the map artwork is untouched. */
      const hr = hs.getBoundingClientRect();
      const hHeight = hr.height || rr.height * 0.16;
      const SAFE_BOTTOM = rr.height * 0.20;                 // room for the fixed chrome
      let topPx = (gr.bottom + dy) - rr.top;
      const maxTop = rr.height - SAFE_BOTTOM;
      if (topPx > maxTop) topPx = maxTop;
      const minTop = hHeight + rr.height * 0.06;            // never above the header
      if (topPx < minTop) topPx = minTop;
      hs.style.top = (topPx / rr.height * 100) + '%';
    }

    const spots = [];
    C.units.forEach(u => {
      const total = C.lessons.filter(l => l.unit === u.id).length;
      const done = C.lessons.filter(l => l.unit === u.id && W.store.lessonState(l.id).completed).length;
      const art = el('span', { style: 'display:block;height:calc(var(--su)*120)' }); /* the landmark itself is the art */
      const hs = W.ui.hotspot({
        id: u.id, dataset: { unit: u.id }, x: 0, y: 0, w: 16,
        /* FINAL POLISH (5): the visible label is the official curriculum unit
         * name from the Student Book. The artwork and every internal id,
         * route and storage key stay exactly as approved. */
        name: u.ar, sub: done + '/' + total, art,
        aria: 'الوحدة ' + u.num + ': ' + u.ar,
      });
      hs.style.transform = 'translate(-50%,-100%)';
      hs.classList.add('beckon');
      layer.appendChild(hs);
      spots.push([hs, u.id]);
      ctx.listen(hs, 'click', () => enter(u.id));
    });
    function liftClear() {
      /* measured pass: keep every destination clear of the bottom edge and of
       * the fixed global controls (attribution / Back / Teacher Mode). */
      const rr = ctx.root.getBoundingClientRect();
      const SAFE = Math.max(96, rr.height * 0.17);
      spots.forEach(([hs]) => {
        const q = hs.getBoundingClientRect();
        const overflow = q.bottom - (rr.bottom - SAFE);
        if (overflow > 0) {
          const cur = parseFloat(hs.style.top) || 0;
          hs.style.top = (cur - (overflow / rr.height * 100)) + '%';
        }
      });
    }
    function placeAll() {
      spots.forEach(([hs, uid]) => place(hs, uid, uid === 'u3' ? 26 : 40));
      ctx.after(40, liftClear);
      ctx.after(320, liftClear);
    }
    placeAll();
    ctx.listen(window, 'resize', placeAll);

    let zooming = false;
    function enter(unitId) {
      if (zooming) return; zooming = true;
      W.audio.open();
      layer.style.pointerEvents = 'none';
      const g = landmarkEl[unitId];
      const gr = g.getBoundingClientRect();
      const wr = world.w3.getBoundingClientRect();
      const ox = ((gr.left + gr.width / 2) - wr.left) / wr.width * 100;
      const oy = ((gr.top + gr.height * .55) - wr.top) / wr.height * 100;
      const reduced = document.documentElement.dataset.reducedMotion === '1';
      if (reduced) { W.scene.go('location', { unit: unitId }); return; }
      world.w3.style.transformOrigin = ox + '% ' + oy + '%';
      // Hand-driven camera: a CSS transition on this full-scene SVG is silently
      // dropped by the compositor (the screen went blank for a second), so the
      // push-in is tweened frame by frame — the same technique as the falaj thread.
      world.w3.style.transition = 'none';
      const t0 = performance.now(), DUR = 950;
      (function step(now) {
        const f = Math.min(1, ((now || performance.now()) - t0) / DUR);
        const e = 1 - Math.pow(1 - f, 3);
        world.w3.style.transform = 'scale(' + (1 + .58 * e).toFixed(4) + ')';
        if (f < 1 && world.w3.isConnected) requestAnimationFrame(step);
      })(performance.now());
      layer.style.transition = 'opacity .45s ease'; layer.style.opacity = '0';
      const flash = el('div', {
        dataset: { camFlash: '1' },
        style: 'position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .55s ease;' +
               'background:radial-gradient(60% 60% at ' + ox + '% ' + oy + '%, rgba(255,231,168,.85), rgba(255,209,102,.25) 55%, rgba(20,12,34,0))',
      });
      ctx.root.appendChild(flash);
      ctx.after(420, () => { flash.style.opacity = '1'; });
      ctx.after(1020, () => W.scene.go('location', { unit: unitId }));
    }

    if (ctx.params && ctx.params.zoomTo) ctx.after(350, () => enter(ctx.params.zoomTo));
  },
});
