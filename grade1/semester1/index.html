        guide.done();
        guide.confirm('رسمتَ الدائرة', P.wrap);
        check.done('circle');
        phase = 'stroke';
        ctx.after(700, () => guide.step({
          sayAr: 'اضغط زرّ الحدّ السميك',
          simplerAr: 'اضغط الزرّ المضيء في الشريط',
          src: bar.btns.thick,
          demo: () => guide.handTap(bar.btns.thick, 1),
        }));
        hl('thick');
      } else if (phase === 'rays' && info.tool === 'shape' && info.shape === 'line') {
        if (nearRing(info.bbox)) {
          rays++;
          W.audio.note(440 + rays * 30, .12);
          guide.bump();
          const left8 = 8 - rays;
          say(left8 > 0 ? ('رسمتَ شعاعًا — بقي ' + '٠١٢٣٤٥٦٧٨'[left8]) : 'رسمتَ ٨ أشعّة!');
          if (rays >= 8) {
            chipCanvas('الأشعة', 'Rays');
            guide.done();
            check.done('rays');
            phase = 'sky';
            ctx.after(600, () => guide.step({
              sayAr: 'اختر أداة التعبئة، ثم اضغط السماء',
              simplerAr: 'اضغط التعبئة ثم اضغط أعلى الورقة',
              src: bar.btns.fill,
              demo: () => guide.handTap(bar.btns.fill, 1),
            }));
            hl('fill');
            const sw = bar.root.querySelector('.swatch[data-swatch="#7ec3e8"]');
            if (sw) sw.classList.add('hl');
          }
        } else { P.undo(); W.fx.softHint(P.wrap); say('قريبًا من حافة الشمس'); }
      } else if (phase === 'sky' && info.tool === 'fill' && info.painted > 40000) {
        const c = P.sampleAt(30, 30);
        if (c[2] > 150 && c[2] > c[0]) {
          chipCanvas('الخلفية', 'Background');
          guide.done();
          guide.confirm('لوّنتَ السماء', P.wrap);
          check.done('sky');
          phase = 'save';
          guide.step({
            sayAr: 'اضغط زرّ الحفظ',
            simplerAr: 'اضغط زرّ الحفظ المضيء',
            src: bar.btns.save,
            demo: () => guide.handTap(bar.btns.save, 1),
          });
          bar.root.querySelectorAll('.swatch.hl').forEach(x => x.classList.remove('hl'));
          hl('save');
        }
      } else if (phase === 'q1' && quizApi && info.tool === 'shape' && info.shape === 'line' && nearRing(info.bbox)) {
        extraRays++;
        if (extraRays >= 2) quizApi.correct(P.wrap);
        else say('شعاع آخر');
      } else if (phase === 'q2' && quizApi && info.tool === 'fill') {
        const c = P.sampleAt(sun.cx, sun.cy);
        if (c[0] > 200 && c[1] > 110 && c[1] < 200 && c[2] < 110) quizApi.correct(P.wrap);
      } else if (phase === 'q3' && quizApi && info.tool === 'shape' && info.shape === 'circle') {
        if (info.color === '#fdfaf2' && info.bbox.y + info.bbox.h < (sun ? sun.cy : 300) && info.bbox.w > 60) quizApi.correct(P.wrap);
        else { P.undo(); quizApi.wrong(P.wrap); }
      }
    });

    function onSave() {
      /* item 12: visible Save-As dialog on every Save press */
      W.fixkit.saveDialog(ctx, P, {
        host: stage, id: 'a24', nameAr: 'شمسي',
        onSaved(ok) {
          if (!ok || phase !== 'save') return;
          chipCanvas('حفظ', 'Save');
          guide.done();
          guide.confirm('حفظتَ الشمس', bar.btns.save);
          say('تم حفظ رسمتك');
          check.done('save');
          phase = 'wait';
          hl(null);
          ctx.after(1500, startQuiz);
        },
      });
    }

    function startQuiz() {
      guide.clearStage({ remove: ['.draw-zone', '.choice-row'] });
      say('تحدي الشمس!');
      const tasks = [
        { mount(st, api) { quizApi = api; phase = 'q1'; extraRays = 0; say('أضف شعاعين آخرين'); hl('line'); } },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            say('املأ قلب الشمس برتقاليًا');
            hl('fill');
            const sw = bar.root.querySelector('.swatch[data-swatch="#f2b24c"]');
            if (sw) sw.classList.add('hl');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            bar.root.querySelectorAll('.swatch.hl').forEach(x => x.classList.remove('hl'));
            say('غيمة بيضاء في السماء');
            hl('circle');
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          hl(null);
          P.save('a24', 'شمسي');
          W.rig.complete(ctx, lesson, { impactAr: 'أشرقت شمسك على إطار الاستديو!' });
        },
      });
    }
  },
});

/* ==== lessons/l2-5.js ==== */
/* Lesson 2.5 — لنتدرب على دمج الأشكال.
 * Unique mechanic: SCENE COMPOSITION + TOOL RECOGNITION. The paper already holds a
 * sea and a sky; the child composes a dhow from distinct shapes — then must SAY
 * which tool made which part, proving they can tell tools and shapes apart. */
W.lessons.register('2.5', {
  mount(ctx, frame, lesson) {
    const { el } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'hull', label: 'بدن القارب' },
      { id: 'sail', label: 'الشراع' },
      { id: 'sun', label: 'شمس المساء' },
      { id: 'tools', label: 'أيّ أداة رسمت؟' },
      { id: 'quiz', label: 'تحدي البحر' },
    ]);

    const room = W.interiors.atelierRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اختر المستطيل البُنّي', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = t => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();
    const lbl = W.label.group(ctx, stage);
    const STEPS = {
      hull: { tool: 'rect', color: '#8a5a30', pick: 'اختر المستطيل البُنّي', draw: 'ارسم بدن القارب فوق الماء', partAr: 'بدن القارب' },
      sail: { tool: 'tri', color: '#fdfaf2', pick: 'اختر المثلث الأبيض', draw: 'ارسم الشراع فوق البدن', partAr: 'الشراع' },
      sun: { tool: 'circle', color: '#ffd166', pick: 'اختر الدائرة الصفراء', draw: 'ارسم الشمس في السماء', partAr: 'شمس الغروب' },
    };
    let tag = null;
    function partTag(o) {
      if (tag) tag.remove();
      tag = el('div.draw-tag', { text: o.partAr, style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 2}%` });
      stage.appendChild(tag);
    }
    function armStep(k) {
      const o = STEPS[k];
      if (!o) return;
      partTag(o);
      hl(o.tool);
      const sw = bar.root.querySelector(`.swatch[data-swatch="${o.color}"]`);
      bar.root.querySelectorAll('.swatch.hl').forEach(x => x.classList.remove('hl'));
      if (sw) sw.classList.add('hl');
      guide.clearStage({ keepLabels: true });
      // only the requested tool keeps a full label; a short pointer names it
      Object.keys(bar.btns).forEach(k => { if (k !== o.tool) lbl.mini(bar.btns[k]); });
      const tt = W.paint.TOOL_TERMS[o.tool];
      if (tt) { lbl.reveal(bar.btns[o.tool], tt[0], tt[1], { pos: 'above', id: 'tool-' + o.tool, keepFull: true }); lbl.full(bar.btns[o.tool]); }
      guide.arrow(bar.btns[o.tool], 'up', { len: 44, ky: 0 });
      guide.step({
        sayAr: o.pick,
        simplerAr: 'اضغط الأداة المضيئة',
        src: bar.btns[o.tool],
        demo: () => { guide.handTap(bar.btns[o.tool], 1); if (sw) W.fx.glow(sw); },
      });
      const once = () => {
        if (phase !== k) return;
        guide.clearSource();
        guide.step({ sayAr: o.draw, simplerAr: o.draw, demo: () => W.fx.glow(P.wrap) });
      };
      ctx.listen(bar.btns[o.tool], 'click', once);
    }

    const P = W.paint.make(ctx, { host: stage, pos: R.canvas });
    // the sea and the evening sky are already poured
    P.stamp(g => {
      g.fillStyle = '#f6c78e'; g.fillRect(0, 0, P.CW, P.CH * .62);
      g.fillStyle = '#2c8f86'; g.fillRect(0, P.CH * .62, P.CW, P.CH * .38);
      g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 4;
      for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(60 + i * 190, P.CH * .7 + (i % 2) * 40); g.quadraticCurveTo(120 + i * 190, P.CH * .68 + (i % 2) * 40, 180 + i * 190, P.CH * .7 + (i % 2) * 40); g.stroke(); }
    });
    const bar = W.paint.bar(ctx, P, {
      host: stage, stage, pos: R.bar,
      tools: [
        { id: 'circle', aria: 'دائرة' }, { id: 'rect', aria: 'مستطيل' }, { id: 'tri', aria: 'مثلث' },
        { id: 'fill', aria: 'تعبئة' },
        { id: 'undo', aria: 'تراجع', act() { P.undo(); } },
        { id: 'save', aria: 'حفظ', act() { W.fixkit.saveDialog(ctx, P, { host: stage, id: 'a25', nameAr: 'قاربي عند الغروب', onSaved() {} }); } },
      ],
      colors: ['#8a5a30', '#fdfaf2', '#ffd166', '#e2574c'],
    });
    P.setFillMode(true); P.setSize(8);
    const hl = id => { Object.values(bar.btns).forEach(b => b.classList.remove('hl')); if (id && bar.btns[id]) bar.btns[id].classList.add('hl'); };

    let phase = 'hull', quizApi = null;
    ctx.after(90, () => armStep('hull'));
    const SEA_Y = P.CH * .62;
    const made = {};

    P.on('commit', info => {
      if (info.tool !== 'shape' && info.tool !== 'fill') return;
      const bb = info.bbox || {};
      const cy = bb.y + (bb.h || 0) / 2;
      if (phase === 'hull' && info.shape === 'rect' && bb.w > 160 && Math.abs(cy - SEA_Y) < 120) {
        made.hull = bb;
        guide.done(); guide.confirm('رسمتَ بدن القارب', P.wrap);
        check.done('hull');
        phase = 'sail'; ctx.after(650, () => armStep('sail'));
      } else if (phase === 'sail' && info.shape === 'tri' && bb.h > 100 && bb.y + bb.h < SEA_Y + 60 && made.hull && Math.abs((bb.x + bb.w / 2) - (made.hull.x + made.hull.w / 2)) < made.hull.w) {
        made.sail = bb;
        guide.done(); guide.confirm('رسمتَ الشراع', P.wrap);
        check.done('sail');
        phase = 'sun'; ctx.after(650, () => armStep('sun'));
      } else if (phase === 'sun' && info.shape === 'circle' && bb.w > 70 && bb.y + bb.h < SEA_Y) {
        made.sun = bb;
        guide.done(); guide.confirm('رسمتَ الشمس', P.wrap);
        if (tag) tag.remove();
        check.done('sun');
        phase = 'tools'; hl(null);
        ctx.after(900, toolQuiz);
      } else if (phase.startsWith('q') && quizApi) {
        if (phase === 'q1' && info.shape === 'circle' && info.color === '#fdfaf2' && bb.y + bb.h < SEA_Y * .6) {
          quizApi.correct(P.wrap);
        } else if (phase === 'q2' && info.tool === 'fill') {
          const c = P.sampleAt(made.sail.x + made.sail.w / 2, made.sail.y + made.sail.h * .7);
          if (c[0] > 190 && c[1] < 130) quizApi.correct(P.wrap);
        } else if (phase === 'q3' && info.shape === 'tri' && bb.w < (made.sail ? made.sail.w : 300) && bb.y + bb.h < SEA_Y + 80) {
          quizApi.correct(P.wrap);
        }
      } else if (phase === 'hull' || phase === 'sail' || phase === 'sun') {
        P.undo(); W.fx.softHint(P.wrap);
        say((STEPS[phase] || {}).draw || 'ارسم فوق المكان المضيء');
      }
    });

    /* which tool drew the sail? — tap the tool itself */
    function toolQuiz() {
      say('أيّ أداة رسمت الشراع؟ انقرها');
      const want = 'tri';
      const once = ev => {
        const b = ev.target.closest('.ptool');
        if (!b) return;
        ev.stopPropagation();
        if (b.dataset.ptool === want) {
          bar.root.removeEventListener('click', once, true);
          W.audio.success(); W.fx.sparkleAt(ctx.root, b, 6);
          const chip = el('div.term-reveal', { style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 4}%` });
          chip.appendChild(el('span.t-ar', { text: 'أداة المثلث' }));
          chip.appendChild(el('span.t-en', { text: 'Triangle Tool' }));
          stage.appendChild(chip);
          ctx.after(2200, () => chip.remove());
          check.done('tools');
          phase = 'wait';
          ctx.after(1500, startQuiz);
        } else { W.fx.softHint(b); say('انظر إلى شكل الشراع'); }
      };
      bar.root.addEventListener('click', once, true);
      ctx.onCleanup(() => bar.root.removeEventListener('click', once, true));
    }

    function startQuiz() {
      guide.clearStage({ remove: ['.draw-zone', '.draw-tag', '.choice-row'] });
      say('تحدي البحر!');
      const tasks = [
        { mount(st, api) { quizApi = api; phase = 'q1'; say('قمرٌ أبيض صغير في الأعلى'); hl('circle'); } },
        { mount(st, api) { quizApi = api; phase = 'q2'; say('املأ الشراع بالأحمر'); hl('fill'); } },
        { mount(st, api) { quizApi = api; phase = 'q3'; say('شراع صغير ثانٍ للقارب'); hl('tri'); } },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          hl(null);
          P.save('a25', 'قاربي عند الغروب');
          W.rig.complete(ctx, lesson, { impactAr: 'اكتمل جدار الفسيفساء بقاربك!' });
        },
      });
    }
  },
});

/* ==== lessons/l2-6.js ==== */
/* Lesson 2.6 — الرسم الحر.
 * Unique mechanic: THE GALLERY RETURNS. Free brush play first; then the studio wall
 * offers the child's OWN saved artworks — they open one, decorate it with the brush,
 * and save it again. Finishing completes the Creativity Studio and the second falaj. */
W.lessons.register('2.6', {
  mount(ctx, frame, lesson) {
    const { el } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'brush', label: 'جرّب الفرشاة' },
      { id: 'open', label: 'افتح رسمتك' },
      { id: 'decorate', label: 'زيّنها بحرية' },
      { id: 'save', label: 'احفظها من جديد' },
      { id: 'quiz', label: 'تحدي المعرض' },
    ]);

    const room = W.interiors.atelierRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اختر الفرشاة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = t => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    const P = W.paint.make(ctx, { host: stage, pos: R.canvas });
    const bar = W.paint.bar(ctx, P, {
      host: stage, stage, pos: R.bar,
      tools: [
        { id: 'brush', aria: 'فرشاة' },
        { id: 'eraser', aria: 'ممحاة' },
        { id: 'open', aria: 'فتح', act: () => openGallery() },
        { id: 'undo', aria: 'تراجع', act() { P.undo(); } },
        { id: 'save', aria: 'حفظ', act: () => onSave() },
      ],
    });
    P.setTool('brush'); P.setSize(10);
    bar.btns.brush.classList.add('on');
    ctx.after(90, () => {
      guide.step({
        sayAr: 'اختر الفرشاة',
        simplerAr: 'اضغط الفرشاة المضيئة',
        src: bar.btns.brush,
        demo: () => guide.handTap(bar.btns.brush, 1),
      });
    });
    ctx.listen(bar.btns.brush, 'click', () => {
      if (phase !== 'brush') return;
      guide.clearSource();
      guide.step({ sayAr: 'ارسم على اللوحة', simplerAr: 'اسحب إصبعك على الورقة', demo: () => W.fx.glow(P.wrap) });
    });
    const hl = id => { Object.values(bar.btns).forEach(b => b.classList.remove('hl')); if (id && bar.btns[id]) bar.btns[id].classList.add('hl'); };

    function chipCanvas(ar, en) {
      const chip = el('div.term-reveal', { style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 4}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2300, () => chip.remove());
    }

    let phase = 'brush', strokes = 0, decoPts = 0, quizApi = null, qDeco = 0;
    P.on('commit', info => {
      if (info.tool === 'brush') {
        if (phase === 'brush') {
          strokes += info.points;
          if (strokes > 24 && !P._brushTermed) {
            P._brushTermed = true;
            chipCanvas('فرشاة', 'Brush');
          }
          if (strokes > 90) {
            guide.done();
            guide.confirm('رسمتَ بالفرشاة', P.wrap);
            check.done('brush');
            phase = 'open';
            ctx.after(600, () => guide.step({
              sayAr: 'اضغط زرّ «فتح» لتفتح رسمتك',
              simplerAr: 'اضغط زرّ الفتح المضيء',
              src: bar.btns.open,
              demo: () => guide.handTap(bar.btns.open, 1),
            }));
            hl('open');
          }
        } else if (phase === 'decorate') {
          decoPts += info.points;
          if (decoPts > 110) {
            guide.done();
            guide.confirm('زيّنتَ رسمتك', P.wrap);
            check.done('decorate');
            phase = 'save';
            guide.step({
              sayAr: 'اضغط زرّ الحفظ',
              simplerAr: 'اضغط زرّ الحفظ المضيء',
              src: bar.btns.save,
              demo: () => guide.handTap(bar.btns.save, 1),
            });
            hl('save');
          }
        } else if (phase === 'q2' && quizApi) {
          qDeco += info.points;
          if (qDeco > 70) quizApi.correct(P.wrap);
        }
      }
    });

    /* ---------- the little gallery of the child's works ---------- */
    let gal = null;
    function openGallery(forQuiz) {
      if (gal) return;
      const works = W.store.artworkList().filter(a => a.url);
      gal = el('div.choice-row', { dataset: { gallery: '1' }, style: 'position:absolute;top:10%;inset-inline:14%;z-index:36;background:rgba(20,12,6,.55);border-radius:calc(var(--su)*14);padding:calc(var(--su)*12)' });
      if (!works.length) {
        // an honest fallback so the lesson never dead-ends: seed a small sun
        P.stamp(g => {
          g.fillStyle = '#7ec3e8'; g.fillRect(0, 0, P.CW, P.CH);
          g.fillStyle = '#ffd166'; g.beginPath(); g.arc(P.CW / 2, P.CH / 2, 120, 0, Math.PI * 2); g.fill();
        });
        gal.remove(); gal = null;
        afterOpen(forQuiz);
        return;
      }
      works.slice(-4).forEach(w => {
        const c = el('button.choice-card', { dataset: { work: w.id } });
        const im = el('img', { src: w.url, alt: w.nameAr || 'رسمة', style: 'width:calc(var(--su)*130);height:calc(var(--su)*86);object-fit:cover;border-radius:calc(var(--su)*6)' });
        c.appendChild(im);
        c.appendChild(el('span.cap', { text: w.nameAr || 'رسمة' }));
        ctx.listen(c, 'click', () => {
          P.load(w.id, () => {
            gal.remove(); gal = null;
            W.audio.open();
            chipCanvas('فتح', 'Open');
            afterOpen(forQuiz);
          });
        });
        gal.appendChild(c);
      });
      stage.appendChild(gal);
      say('اختر رسمة من معرضك');
    }
    function afterOpen(forQuiz) {
      if (forQuiz && quizApi) { quizApi.correct(P.wrap); return; }
      if (phase === 'open') {
        guide.done();
        guide.confirm('فتحتَ رسمتك', P.wrap);
        check.done('open');
        phase = 'decorate';
        guide.step({ sayAr: 'زيّنها بالفرشاة كما تحب', simplerAr: 'اسحب الفرشاة على الرسمة', src: bar.btns.brush, demo: () => W.fx.glow(P.wrap) });
        hl('brush');
        P.setTool('brush');
      }
    }
    function onSave() {
      /* item 12: visible Save-As dialog on every Save press */
      W.fixkit.saveDialog(ctx, P, {
        host: stage, id: 'a26', nameAr: 'رسمتي الحرة',
        onSaved(ok) {
          if (!ok) return;
          if (phase === 'save') {
            W.fx.sparkleAt(ctx.root, bar.btns.save, 7);
            chipCanvas('حفظ', 'Save');
            say('تم حفظ رسمتك');
            check.done('save');
            phase = 'wait';
            hl(null);
            ctx.after(1500, startQuiz);
          } else if (phase === 'q3' && quizApi) {
            quizApi.correct(bar.btns.save);
          }
        },
      });
    }

    function startQuiz() {
      guide.clearStage({ remove: ['.draw-zone', '.choice-row'] });
      say('تحدي المعرض!');
      const tasks = [
        { mount(st, api) { quizApi = api; phase = 'q1'; say('افتح رسمة أخرى من المعرض'); hl('open'); openGallery(true); } },
        { mount(st, api) { quizApi = api; phase = 'q2'; qDeco = 0; say('أضف لمساتك بالفرشاة'); hl('brush'); P.setTool('brush'); } },
        { mount(st, api) { quizApi = api; phase = 'q3'; say('احفظ التحفة الأخيرة'); hl('save'); } },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          hl(null);
          W.rig.complete(ctx, lesson, { impactAr: 'اكتمل الاستديو وجرى الفلج الثاني!' });
        },
      });
    }
  },
});

/* ==== lessons/l3-1.js ==== */
/* Lesson 3.1 — الإنترنت — the first lesson of the Sky of Connection.
 * Unique mechanic: WIRING THE WORLD. The child connects Ahmed's home to the sky:
 * a copper wire teaches the Wired connection, waves teach the Wireless one, then a
 * beam climbs to the satellite, hops the antennas, and lights grandmother's window —
 * a video call. Then the child chooses good uses and safe behaviour.
 * Flow: wired · wireless · satellites+antennas · uses · safety · quiz. */
W.lessons.register('3.1', {
  /* Item 13 — LESSON 3.1 REBUILT for first grade.
   * The familiar story: Ahmed's HOME (computer + Wi-Fi router) on one side,
   * the SCHOOL LIBRARY on the other. A visible wired cable, clear Wi-Fi
   * waves, and a picture travelling between the two computers teach the
   * central sentence: «الإنترنت يربط الأجهزة لتبادل المعلومات.»
   * Antennas and satellites arrive LATER as two simple visual cards.
   * Checklist ids, curriculum objectives, order, progress and offline-only
   * operation are all preserved. */
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;
    const lbl = W.label.group(ctx, stage);

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'wired', label: 'الاتصال السلكي' },
      { id: 'wireless', label: 'الاتصال اللاسلكي' },
      { id: 'sat', label: 'الأقمار والهوائيات' },
      { id: 'uses', label: 'فوائد الإنترنت' },
      { id: 'safety', label: 'قواعد الأمان' },
      { id: 'quiz', label: 'تحدي السماء' },
    ]);

    /* ---------------- the scene: home ↔ school ---------------- */
    const scene = el('div.net-scene');
    stage.appendChild(scene);
    const svg = sv('svg', { viewBox: '0 0 1366 768', preserveAspectRatio: 'xMidYMid slice', style: 'position:absolute;inset:0;width:100%;height:100%' });
    scene.appendChild(svg);

    /* measured separation (getBoundingClientRect), never guessed by eye */
    function separateLabels() {
      const tags = Array.from(stage.querySelectorAll('.tag, .term-tag, .label-tag, [data-label]'));
      for (let i = 0; i < tags.length; i++) {
        for (let j = i + 1; j < tags.length; j++) {
          const a = tags[i].getBoundingClientRect(), b = tags[j].getBoundingClientRect();
          if (!a.width || !b.width) continue;
          if (W.fixkit.rectsOverlap(a, b, -2)) {
            // push the lower card further down and out of the way
            const move = (b.bottom - a.top) + 8;
            const cur = parseFloat(tags[j].style.marginTop || '0');
            tags[j].style.marginTop = (cur + move) + 'px';
            tags[j].style.transform = 'translateY(' + move + 'px)';
          }

          const c = el('button.choice-card', { text: cap, dataset: { safe: ok ? '1' : '0' } });

          row.appendChild(c);
        });
      stage.appendChild(row);
    }

    /* ---------------- 6 · the sky challenge ---------------- */
    let quizApi = null;
    function startQuiz() {
      guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
      say('تحدي السماء!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
            const satCard = scene.querySelector('.net-card[data-card="sat"]');
            guide.step({ sayAr: 'اضغط بطاقة القمر الصناعي', simplerAr: 'اضغط البطاقة التي فيها جسم بجناحين أزرقين', src: satCard, demo: () => satCard && guide.handTap(satCard, 1) });
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
            say('اضغط الجهاز الذي يتصل بلا سلك');
            const row = cardRow('q2');
            [['wire', 'حاسوب بسلك', false], ['wifi', 'جهاز لوحي بلا سلك', true]].forEach(([k, cap, ok]) => {
              const c = el('button.choice-card', { text: cap, dataset: { pick: k } });
              ctx.listen(c, 'click', () => {
                if (ok) { c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5); ctx.after(400, () => row.remove()); api.correct(c); }
                else { W.fx.softHint(c); say('السلك يعني اتصالًا سلكيًا'); }
              });
              row.appendChild(c);
            });
            stage.appendChild(row);
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            guide.clearStage({ keepCables: true, remove: ['.choice-row'] });
            say('اضغط السلوك الآمن على الإنترنت');
            const row = cardRow('q3');
            [['ask', 'أستأذن والديّ', true], ['name', 'أكتب اسمي لغريب', false], ['secret', 'أنشر كلمة السرّ', false]].forEach(([k, cap, ok]) => {
              const c = el('button.choice-card', { text: cap, dataset: { pick: k } });
              ctx.listen(c, 'click', () => {
                if (ok) { c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5); ctx.after(400, () => row.remove()); api.correct(c); }
                else { W.fx.softHint(c); say('هذا ليس آمنًا'); }
              });
              row.appendChild(c);
            });
            stage.appendChild(row);
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          W.rig.complete(ctx, lesson, { impactAr: 'ربط الإنترنتُ بيتَ أحمد بمكتبة المدرسة!' });
        },
      });
    }
  },
});

/* ==== lessons/l3-2.js ==== */
/* Lesson 3.2 — استمتع — the offline web browser.
 * Unique mechanic: THE BROWSER IS A BOAT. The child opens a safe local browser,
 * types a website address and sails to the museum of the oasis, then discovers a
 * page holds pictures AND video, and opens a second tab. Nothing leaves the device.
 * Flow: open browser · type address · picture+video · new tab · browsing challenge. */
W.lessons.register('3.2', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;
    const lbl = W.label.group(ctx, stage);
    const lblMgr = W.fixkit.labelManager(ctx, stage);

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'open', label: 'افتح المتصفح' },
      { id: 'visit', label: 'اكتب عنوان الموقع' },
      { id: 'media', label: 'صورة وفيديو' },
      { id: 'tab', label: 'علامة تبويب' },
      { id: 'quiz', label: 'تحدي التصفح' },
    ]);

    const room = W.interiors.skyStudy();
    const art = el('div', { style: 'position:absolute;inset:0;pointer-events:none' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اضغط المتصفّح مرّتين بسرعة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    /* ---------- a small desktop inside the monitor glass ---------- */
    const dsk = W.apps.deskScreen({ pos: R.screen, ctx, stage });
    stage.appendChild(dsk.root);
    dsk.root.style.zIndex = '14';
    dsk.addIcon('browser', 'المتصفح', 'browser', 8, 12);
    dsk.addIcon('note', 'المفكرة', 'note', 8, 54);

    let phase = 'open', br = null, museum = null, quizApi = null;

    ctx.after(120, () => {
      guide.step({
        sayAr: 'اضغط المتصفّح مرّتين بسرعة',
        simplerAr: 'اضغط أيقونة المتصفّح مرّتين',
        src: dsk.icons.browser,
        demo: () => guide.handTap(dsk.icons.browser, 2),
      });
    });
    ctx.listen(dsk.icons.browser, 'click', () => { if (phase === 'open') { say('اضغط مرّتين سريعتين'); guide.runDemo(); } });
    ctx.listen(dsk.icons.browser, 'dblclick', () => { if (phase === 'open') openBrowser(); });

    function openBrowser() {
      br = W.net.browser(ctx, { host: stage, pos: R.screen });
      br.root.style.zIndex = '28';
      const tab = br.addTab('علامة تبويب'); br.activate(0);
      W.audio.open();
      lbl.reveal(br.root, 'متصفح الإنترنت', 'Web Browser', { pos: 'above', id: 'browser' });
      lbl.reveal(tab.el, 'علامة تبويب', 'Tab', { pos: 'below', id: 'tab0' });
      check.done('open');
      guide.done();
      guide.confirm('فتحتَ المتصفّح', br.root);
      phase = 'address';
      ctx.after(1400, () => {
        /* R2 item 6: the address bar is taught in three plain steps and the
         * pupil really types it — no auto-completion, no «several times». */
        lblMgr.clearLabels(['browser']);
        br.armAddress('almathaf.om');
        guide.step({
          sayAr: 'اضغط شريط العنوان مرة واحدة.',
          simplerAr: 'اضغط الشريط الأبيض مرة واحدة',
          src: br.addrField,
          demo: () => guide.handTap(br.addrField, 1),
        });
      });
      br.onAddrFocus = () => {
        if (phase !== 'address' && phase !== 'q3') return;
        guide.clearSource();
        say('اكتب العنوان كاملًا: almathaf.om');
      };
      br.onAddrMistake = () => say('راجع الحرف، ثم استخدم Backspace لتصحيحه.');
      br.onAddrRecovered = () => say('اكتب العنوان كاملًا: almathaf.om');
      br.onAddrIncomplete = () => say('أكمل العنوان أولًا: almathaf.om');
      br.onAddrFull = () => {
        if (phase !== 'address' && phase !== 'q3') return;
        guide.step({
          sayAr: 'بعد اكتمال العنوان، اضغط زر «اذهب».',
          simplerAr: 'اضغط الزرّ المضيء بجانب العنوان',
          src: br.goBtn,
          demo: () => guide.handTap(br.goBtn, 1),
        });
      };
      br.onGo = () => {
        if (phase !== 'address' && phase !== 'q3') return;
        museum = W.net.museumPage();
        br.setAddress('almathaf.om');
        br.setContent(museum.node, museum.h);
        if (br.tabs[0]) br.tabs[0].el.querySelector('.wb-title').textContent = 'المتحف';
        W.audio.success(); W.fx.sparkleAt(ctx.root, br.root, 8);
        const page = museum.node;
        /* R2 item 6.7: clear the teaching labels so the page content is visible */
        lblMgr.clearLabels();
        lbl.reveal(page.querySelector('.wb-h1'), 'موقع ويب', 'Website', { pos: 'below', id: 'website' });
        ctx.after(2400, () => lblMgr.clearLabels());
        if (phase === 'address') {
          check.done('visit');
          guide.done();
          guide.confirm('زرتَ موقع المتحف', br.root);
          phase = 'image';
          ctx.after(1500, () => {
            const pic = museum.node.querySelector('.wb-card[data-pic]');
            guide.step({
              sayAr: 'اضغط صورةً في الصفحة لتكبُر',
              simplerAr: 'اضغط صورة السفينة',
              src: pic,
              demo: () => pic && guide.handTap(pic, 1),
            });
          });
        } else if (phase === 'q3' && quizApi) { quizApi.correct(br.root); }
      };
      br.onNewTab = () => {
        if (phase === 'tab') {
          const t = br.addTab('صفحة جديدة'); br.activate(br.tabs.length - 1);
          br.armAddress('alwaha.om');
          lblMgr.clearLabels();
          lbl.reveal(t.el, 'علامة تبويب', 'Tab', { pos: 'below', id: 'tab1' });
          ctx.after(2200, () => lblMgr.clearLabels());
          guide.done();
          guide.confirm('فتحتَ علامة تبويب', t.el);
          check.done('tab');
          phase = 'wait';
          const home = W.net.searchHome({ keywords: [] });
          br.setContent(home.node, home.h);
          br.setAddress('');
          ctx.after(1400, startQuiz);
        } else if (phase === 'q1' && quizApi) { const t = br.addTab('صفحة'); br.activate(br.tabs.length - 1); }
      };
      br.onTab = () => { if (phase === 'q1' && quizApi) quizApi.correct(br.root); };
    }

    /* clicks inside pages: images enlarge, videos play */
    let lightbox = null;
    ctx.delegate('click', '.wb-card[data-pic]', (ev, card) => {
      if (phase === 'image') {
        showLightbox(card);
        check.done('media-img');
        guide.done();
        phase = 'video';
        ctx.after(1200, () => {
          const play = stage.querySelector('.wb-play');
          guide.step({
            sayAr: 'اضغط زرّ ▶ لتشغيل الفيديو',
            simplerAr: 'اضغط المثلث في الصورة الأخرى',
            src: play,
            demo: () => play && guide.handTap(play, 1),
          });
        });
      }
    });
    ctx.delegate('click', '.wb-play', (ev, play) => {
      ev.stopPropagation();
      const card = play.closest('.wb-card');
      if (phase === 'video') { playVideo(play, card); }
      else if (phase === 'q2' && quizApi) { playVideo(play, card); quizApi.correct(play); }
    });
    function showLightbox(card) {
      if (lightbox) lightbox.remove();
      lightbox = el('div', { dataset: { lightbox: '1' }, style: 'position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,8,20,.6)' });
      const big = card.querySelector('svg').cloneNode(true);
      const holder = el('div', { style: 'width:52%;border-radius:calc(var(--su)*10);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);background:#fff' });
      holder.appendChild(big);
      holder.appendChild(el('div', { text: card.querySelector('.wb-cap').textContent, style: 'padding:calc(var(--su)*8);text-align:center;font-weight:700;color:#3a2412;font-size:calc(var(--su)*17)' }));
      lightbox.appendChild(holder);
      W.audio.open(); W.fx.sparkleAt(ctx.root, card, 6);
      ctx.listen(lightbox, 'click', () => { lightbox.remove(); lightbox = null; });
      stage.appendChild(lightbox);
      ctx.after(2600, () => { if (lightbox) { lightbox.remove(); lightbox = null; } });
    }
    function playVideo(play, card) {
      if (play.classList.contains('played')) return;
      play.classList.add('played'); play.textContent = '⏸';
      const bar = el('div', { style: 'position:absolute;inset-inline:6%;bottom:8%;height:calc(var(--su)*8);border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden' });
      const fill = el('div', { style: 'height:100%;width:0;background:#ffd166;transition:width 1.4s linear' });
      bar.appendChild(fill);
      card.querySelector('.wb-pic').appendChild(bar);
      ctx.after(30, () => { fill.style.width = '100%'; });
      W.audio.note(392, .5);
      ctx.after(1500, () => {
        W.audio.success(); W.fx.sparkleAt(ctx.root, card, 6);
        if (phase === 'video') {
          check.done('media');
          guide.done();
          guide.confirm('شغّلتَ الفيديو', card);
          phase = 'tab';
          if (br) br.newTabBtn.classList.add('hl');
          ctx.after(800, () => guide.step({
            sayAr: 'اضغط + لفتح علامة تبويب جديدة',
            simplerAr: 'اضغط علامة + في الأعلى',
            src: br.newTabBtn,
            demo: () => guide.handTap(br.newTabBtn, 1),
          }));
        }
      });
    }

    /* ---------- browsing challenge ---------- */
    function startQuiz() {
      guide.clearStage({ remove: ['.choice-row'] });
      say('تحدي التصفح!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            say('افتح علامة تبويب جديدة +');
            if (br) br.newTabBtn.classList.add('hl');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            if (br) br.newTabBtn.classList.remove('hl');
            // put the museum back so a video is present to play
            if (br) { const m = W.net.museumPage(); br.setContent(m.node, m.h); br.setAddress('almathaf.om'); }
            say('شغّل الفيديو في الصفحة ▶');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            if (br) { const h = W.net.searchHome({ keywords: [] }); br.setContent(h.node, h.h); br.setAddress(''); br.armAddress('almathaf.om'); }
            say('اكتب عنوان الموقع واذهب');
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          W.rig.complete(ctx, lesson, { impactAr: 'أبحرت في موقع المتحف وأضاء برج السماء!' });
        },
      });
    }
  },
});

/* ==== lessons/l3-3.js ==== */
/* Lesson 3.3 — تواصل — the offline email.
 * Unique mechanic: A LETTER OF LIGHT. The child writes to grandmother, attaches a
 * file that CAN travel (a picture, a video, a text — not a ball or a sandwich), and
 * sends it; a dove of light carries it across the wadi and a reply returns with a
 * photo. Then the child names the benefits of email.
 * Flow: open mail · choose grandmother · attach a sendable file · send · benefits · quiz. */
W.lessons.register('3.3', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;
    const lbl = W.label.group(ctx, stage);

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'open', label: 'افتح البريد' },
      { id: 'to', label: 'اكتب إلى جدتك' },
      { id: 'attach', label: 'أرفق ملفًا' },
      { id: 'send', label: 'أرسِل الرسالة' },
      { id: 'benefits', label: 'فوائد البريد' },
      { id: 'quiz', label: 'تحدي البريد' },
    ]);

    const room = W.interiors.skyStudy();
    const art = el('div', { style: 'position:absolute;inset:0;pointer-events:none' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اضغط البريد مرّتين بسرعة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    const dsk = W.apps.deskScreen({ pos: R.screen, ctx, stage });
    stage.appendChild(dsk.root);
    dsk.root.style.zIndex = '14';
    dsk.addIcon('mail', 'البريد', 'mail', 8, 12);
    dsk.addIcon('browser', 'المتصفح', 'browser', 8, 54);

    let phase = 'open', mailApp = null, quizApi = null, chosenTo = false, attached = false;

    ctx.after(120, () => {
      guide.step({
        sayAr: 'اضغط البريد مرّتين بسرعة',
        simplerAr: 'اضغط أيقونة البريد مرّتين',
        src: dsk.icons.mail,
        demo: () => guide.handTap(dsk.icons.mail, 2),
      });
    });
    ctx.listen(dsk.icons.mail, 'click', () => { if (phase === 'open' || phase === 'q2') { say('اضغط مرّتين سريعتين'); guide.runDemo(); } });
    ctx.listen(dsk.icons.mail, 'dblclick', () => {
      if (phase === 'open') openMail(false);
      else if (phase === 'q2' && quizApi) { openMail(true); quizApi.correct(dsk.icons.mail); }
    });

    function faceArt(kind) {
      const s = sv('svg', { viewBox: '0 0 54 54', style: 'width:100%;height:100%' });
      s.appendChild(sv('rect', { x: 0, y: 0, width: 54, height: 54, fill: kind === 'gram' ? '#f4d9c0' : '#cfe4d6' }));
      s.appendChild(sv('circle', { cx: 27, cy: 22, r: 11, fill: '#f2c9a0', stroke: '#8a5a30', 'stroke-width': 2 }));
      if (kind === 'gram') {
        s.appendChild(sv('path', { d: 'M14 20 q 13 -14 26 0 l-2 -12 q -11 -6 -22 0 Z', fill: '#e6e2d4' }));
        s.appendChild(sv('path', { d: 'M18 22 a 9 9 0 0 1 18 0', fill: 'none', stroke: '#b0a58c', 'stroke-width': 2 }));
      } else {
        s.appendChild(sv('path', { d: 'M15 16 q 12 -12 24 0 l0 -6 q -12 -8 -24 0 Z', fill: '#3a2412' }));
      }
      s.appendChild(sv('path', { d: 'M12 52 q 15 -18 30 0 Z', fill: kind === 'gram' ? '#8a5aa0' : '#3f9e6e' }));
      return s;
    }
    function itemArt(kind) {
      if (kind === 'img') return W.apps.iconArt('fileimg');
      if (kind === 'text') return W.apps.iconArt('filetext');
      const s = sv('svg', { viewBox: '0 0 40 40', style: 'width:74%;height:74%' });
      if (kind === 'vid') {
        s.appendChild(sv('rect', { x: 6, y: 10, width: 22, height: 20, rx: 2, fill: '#33333f' }));
        s.appendChild(sv('path', { d: 'M28 15 L36 11 L36 29 L28 25 Z', fill: '#5b6272' }));
        s.appendChild(sv('path', { d: 'M13 16 L21 20 L13 24 Z', fill: '#ffd166' }));
      } else if (kind === 'ball') {
        s.appendChild(sv('circle', { cx: 20, cy: 20, r: 14, fill: '#e2574c', stroke: '#8a2f26', 'stroke-width': 2 }));
        s.appendChild(sv('path', { d: 'M6 20 h28 M20 6 v28 M10 10 q10 10 20 0 M10 30 q10 -10 20 0', fill: 'none', stroke: '#8a2f26', 'stroke-width': 1.6 }));
      } else {
        s.appendChild(sv('path', { d: 'M8 22 q12 -14 24 0 q -12 8 -24 0 Z', fill: '#e8b06a', stroke: '#8a5a30', 'stroke-width': 2 }));
        s.appendChild(sv('path', { d: 'M8 22 q12 6 24 0', fill: 'none', stroke: '#3f9e6e', 'stroke-width': 2.4 }));
        s.appendChild(sv('path', { d: 'M10 18 q10 -6 20 0', fill: 'none', stroke: '#e2574c', 'stroke-width': 2.4 }));
      }
      return s;
    }

    function openMail(quiet) {
      mailApp = W.net.mail(ctx, { host: stage, stage, pos: R.screen });
      mailApp.root.style.zIndex = '28';
      W.audio.open();
      lbl.reveal(mailApp.root, 'البريد الإلكتروني', 'Email', { pos: 'above', id: 'email', dy: -1.2 });
      /* item 13 (3.3): folders live — compose restores the current step,
       * and a friendly starter message waits in the Inbox. */
      mailApp.addInbox({ from: 'معلمتك', subject: 'أهلًا بك في بريد الواحة!' });
      mailApp.onCompose = () => {
        buildCompose();
        if (phase === 'attach' || phase === 'send' || phase === 'q3') showItems();
        if (phase === 'send' && sendBtn) sendBtn.classList.add('hl');
      };
      if (!quiet) {
        check.done('open');
        guide.done();
        guide.confirm('فتحتَ البريد', mailApp.root);
        phase = 'to';
        buildCompose();
        ctx.after(700, () => {
          const g = mailApp.body.querySelector('.ma-contact[data-to="gram"]');
          guide.step({
            sayAr: 'اضغط صورة جدتك',
            simplerAr: 'اضغط الوجه المكتوب تحته «جدتي»',
            src: g,
            demo: () => g && guide.handTap(g, 1),
          });
        });
      } else buildCompose();
    }

    let slot = null, sendBtn = null, lastAttached = null;
    function buildCompose() {
      if (mailApp.folders) mailApp.folders.compose.classList.add('on');
      const body = mailApp.body;
      body.innerHTML = '';
      // recipient row
      const toField = el('div.ma-field');
      toField.appendChild(el('span.ma-flabel', { text: 'إلى:' }));
      const to = el('div.ma-to');
      [['gram', 'جدتي'], ['friend', 'صديقي']].forEach(([k, name]) => {
        const c = el('button.ma-contact', { dataset: { to: k } });
        const face = el('div.ma-face'); face.appendChild(faceArt(k));
        c.appendChild(face);
        c.appendChild(el('span.ma-cname', { text: name }));
        if (k === 'gram' && chosenTo) c.classList.add('on');
        ctx.listen(c, 'click', () => {
          if (phase !== 'to') return;
          to.querySelectorAll('.ma-contact.on').forEach(x => x.classList.remove('on'));
          c.classList.add('on');
          chosenTo = k === 'gram';
          W.audio.click();
          if (k === 'gram') {
            guide.done();
            guide.confirm('اخترتَ جدتك', c);
            check.done('to');
            phase = 'attach';
            showItems();
            ctx.after(500, () => {
              const img = itemsWrap && itemsWrap.querySelector('.ma-item[data-item="img"]');
              guide.step({
                sayAr: 'اسحب الصورة إلى مربع المرفق',
                simplerAr: 'أمسك الصورة وضعها في المربّع المنقّط',
                src: img,
                tgt: slot,
                demo: () => { if (img) { guide.handDrag(img, slot, { ms: 1500 }); guide.preview(img, slot, { ay: .5, by: .5, sag: 18 }); } },
              });
            });
          } else say('اضغط صورة جدتك');
        });
        to.appendChild(c);
      });
      toField.appendChild(to);
      body.appendChild(toField);
      /* item 13 (3.3): Subject field — الموضوع */
      const subjRow = el('div.ma-field');
      subjRow.appendChild(el('span.ma-flabel', { text: 'الموضوع:' }));
      subjRow.appendChild(el('span', { text: 'هديتي لك 🎁', style: 'font-size:calc(var(--su)*15);font-weight:700;color:#3a2412' }));
      subjRow.appendChild(el('span', { text: ' Subject', style: 'font-size:calc(var(--su)*11);color:#7a5a30;font-weight:700' }));
      body.appendChild(subjRow);
      // message line
      const subj = el('div.ma-field');
      subj.appendChild(el('span.ma-flabel', { text: 'الرسالة:' }));
      subj.appendChild(el('span', { text: 'سلامي يا جدتي! هذه هديتي لك.', style: 'font-size:calc(var(--su)*15);color:#4e3a24' }));
      body.appendChild(subj);
      // attachment slot
      slot = el('div.ma-slot', { dataset: { slot: '1' } });
      slot.appendChild(el('span', { text: '📎 المرفق' }));
      if (attached && lastAttached) { slot.innerHTML = ''; slot.appendChild(itemArt(lastAttached)); slot.classList.add('filled'); }
      body.appendChild(slot);
      // send button — sticky bottom row so it is always reachable (item 16)
      const row = el('div.ma-sendrow-sticky', { style: 'margin-top:auto;text-align:center' });
      sendBtn = el('button.ma-send', { text: '➤ أرسِل', dataset: { send: '1' }, 'aria-label': 'أرسِل — Send (الزر الأخضر)' });
      ctx.listen(sendBtn, 'click', () => {
        if (phase === 'send' && attached && chosenTo) doSend();
        else if (phase === 'q3' && quizApi && attached) { doSend(); }
        else { W.fx.softHint(sendBtn); say('أرفق ملفًا أولًا'); }
      });
      row.appendChild(sendBtn);
      body.appendChild(row);
    }

    let itemsWrap = null;
    function showItems() {
      if (itemsWrap) itemsWrap.remove();
      itemsWrap = el('div.ma-attachrow', { dataset: { items: '1' } });
      const ITEMS = [['img', true], ['vid', true], ['text', true], ['ball', false], ['sandwich', false]];
      ITEMS.forEach(([k, ok]) => {
        const it = el('button.ma-item', { dataset: { item: k, ok: ok ? '1' : '0' }, 'aria-label': 'ملف' });
        it.appendChild(itemArt(k));
        itemsWrap.appendChild(it);
        // freeze the item into absolute coordinates the first time it is grabbed,
        // so the pointer drag moves it accurately over the attachment slot
        ctx.listen(it, 'pointerdown', () => {
          if (it.dataset.freed === '1') return;
          const r = it.getBoundingClientRect(), pr = itemsWrap.getBoundingClientRect();
          it.dataset.homeLeft = String(r.left - pr.left);
          it.dataset.homeTop = String(r.top - pr.top);
          it.style.position = 'absolute';
          it.style.left = it.dataset.homeLeft + 'px';
          it.style.top = it.dataset.homeTop + 'px';
          it.dataset.freed = '1';
        });
        W.util.draggable(ctx, it, {
          disabled: () => !(phase === 'attach' || phase === 'q3'),
          onDrop() {
            if (W.util.overlaps(it, slot, 10)) {
              if (ok) {
                it.style.display = 'none';
                slot.innerHTML = ''; slot.appendChild(itemArt(k));
                slot.classList.add('filled');
                attached = true; lastAttached = k;
                lbl.reveal(slot, 'المرفق', 'Attachment', { pos: 'above', id: 'attach' });
                W.audio.success(); W.fx.sparkleAt(ctx.root, slot, 6);
                if (phase === 'attach') {
                  check.done('attach');
                  guide.done();
                  guide.confirm('أرفقتَ الصورة', slot);
                  phase = 'send';
                  sendBtn.classList.add('hl');
                  if (sendBtn.scrollIntoView) sendBtn.scrollIntoView({ block: 'nearest' });
                  ctx.after(700, () => guide.step({
                    sayAr: 'اضغط زرّ أرسِل الأخضر',
                    simplerAr: 'اضغط الزرّ الأخضر المكتوب عليه أرسِل',
                    src: sendBtn,
                    demo: () => { if (sendBtn.scrollIntoView) sendBtn.scrollIntoView({ block: 'nearest' }); guide.handTap(sendBtn, 1); },
                  }));
                }
                return;
              }
              W.fx.softHint(it);
              say('هذا شيء ماديّ — اسحب صورةً أو فيديو أو ملفًّا نصيًّا');
            }
            // always return the item to its own place on the shelf
            it.style.left = (it.dataset.homeLeft || 0) + 'px';
            it.style.top = (it.dataset.homeTop || 0) + 'px';
          },
        });
      });
      mailApp.body.appendChild(itemsWrap);
    }

    function doSend() {
      if (sendBtn) sendBtn.classList.remove('hl');
      guide.done();
      say('طارت الرسالة إلى جدتك…');
      const sentEntry = { to: 'جدتي', subject: 'هديتي لك 🎁', attach: lastAttached || 'img' };
      // a dove of light flies from the perch to the far window
      const dove = el('div.light-dove', { style: `left:${R.perch.x}%;top:${R.perch.y}%` });
      dove.appendChild((function () {
        const s = sv('svg', { viewBox: '0 0 60 40' });
        s.appendChild(sv('path', { d: 'M6 24 q 14 -20 32 -8 q 12 -14 20 -2 q -8 18 -30 16 q -20 2 -22 -6 Z', fill: '#fff6dd', stroke: '#ffd166', 'stroke-width': 2 }));
        return s;
      })());
      stage.appendChild(dove);
      const fx = R.farGlass;
      const t0 = performance.now(), dur = 1600;
      const x0 = R.perch.x, y0 = R.perch.y, x1 = fx.x, y1 = fx.y;
      function step(now) {
        if (!dove.isConnected) return;
        const k = Math.min(1, (now - t0) / dur);
        dove.style.left = (x0 + (x1 - x0) * k) + '%';
        dove.style.top = (y0 + (y1 - y0) * k - Math.sin(k * Math.PI) * 10) + '%';
        if (k < 1) requestAnimationFrame(step);
        else {
          dove.remove();
          const fg = room.svg.querySelector('.far-tower .far-glass');
          if (fg) { fg.setAttribute('fill', 'url(#winGlow)'); fg.classList.add('win-wake'); }
          W.audio.success();
          /* item 13 (3.3): the sent message is placed VISIBLY in المرسل */
          mailApp.addSent(sentEntry);
          if (phase === 'send') {
            mailApp.showSent();
            say('انظر: رسالتك الآن في «المرسل».', 'Sent ✓');
            W.fx.sparkleAt(ctx.root, mailApp.root, 6);
            check.done('send'); phase = 'reply';
            ctx.after(2400, showReply);
          }
          else if (phase === 'q3' && quizApi) { mailApp.showSent(); quizApi.correct(mailApp.root); }
        }
      }
      requestAnimationFrame(step);
      W.audio.note(659, .4);
    }

    function showReply() {
      /* the reply arrives in the INBOX like a real mail */
      const photo = el('div', { style: 'width:44%;border-radius:calc(var(--su)*8);overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3);margin:calc(var(--su)*6) 0 calc(var(--su)*10)' });
      photo.appendChild(W.net.art('falaj'));
      const bodyNode = el('div');
      bodyNode.appendChild(el('div', { text: 'شكرًا يا حبيبي! هذه صورةٌ لك.', style: 'font-size:calc(var(--su)*16);color:#4e3a24;margin:calc(var(--su)*4) 0' }));
      bodyNode.appendChild(photo);
      mailApp.addInbox({ from: 'جدتي 💛', subject: 'ردّ: هديتي لك', attach: 'img', bodyNode });
      mailApp.showInbox();
      W.fx.sparkleAt(ctx.root, mailApp.root, 7);
      say('وصلك ردّ جدتك في «الوارد» بصورة!');
      phase = 'benefits';
      ctx.after(1800, benefitsPick);
    }

    function benefitsPick() {
      guide.clearStage({ remove: ['.choice-row'] });
      say('اضغط فائدتين للبريد');
      const row = el('div.choice-row', { dataset: { benefits: '1' }, style: 'position:absolute;bottom:5%;inset-inline:6%;z-index:34' });
      const want = new Set(['free', 'fast']);
      let hit = 0;
      [['free', 'مجاني', true], ['printer', 'يحتاج طابعة دائمًا', false], ['fast', 'سريع ويصل للعالم', true], ['ball', 'يرسل كرة', false]]
        .forEach(([k, cap, ok]) => {
          const c = el('button.choice-card', { text: cap, dataset: { benefit: k } });
          ctx.listen(c, 'click', () => {
            if (want.has(k) && !c.classList.contains('done')) {
              c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5);
              if (++hit === 2) { ctx.after(450, () => row.remove()); check.done('benefits'); phase = 'wait'; ctx.after(500, startQuiz); }
            } else if (!want.has(k)) { W.fx.softHint(c); say('فكّر في فائدة حقيقية'); }
          });
          row.appendChild(c);
        });
      stage.appendChild(row);
    }

    /* ---------- the email challenge ---------- */
    function startQuiz() {
      guide.clearStage({ remove: ['.choice-row'] });
      say('تحدي البريد!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            say('أيّ شيء يمكن إرساله بالبريد؟');
            const row = el('div.choice-row', { dataset: { q1: '1' }, style: 'position:absolute;bottom:5%;inset-inline:8%;z-index:34' });
            [['img', 'ملف صورة', true], ['ball', 'كرة', false], ['sandwich', 'شطيرة', false]].forEach(([k, cap, ok]) => {
              const c = el('button.choice-card.pic', { dataset: { pick: k } });
              const holder = el('div', { style: 'width:calc(var(--su)*70);height:calc(var(--su)*70)' });
              holder.appendChild(itemArt(k));
              c.appendChild(holder);
              c.appendChild(el('span.cap', { text: cap }));
              ctx.listen(c, 'click', () => {
                if (ok) { c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5); ctx.after(400, () => row.remove()); api.correct(c); }
                else { W.fx.softHint(c); say('هذا شيء ماديّ لا يُرسَل'); }
              });
              row.appendChild(c);
            });
            stage.appendChild(row);
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            if (mailApp) { mailApp.root.remove(); mailApp = null; }
            attached = false; chosenTo = true;
            say('افتح البريد من جديد', 'نقرة مزدوجة');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            attached = false;
            if (!mailApp) openMail(true);
            buildCompose();
            // preselect grandmother so the child only attaches + sends
            const g = mailApp.body.querySelector('.ma-contact[data-to="gram"]');
            if (g) g.classList.add('on');
            showItems();
            say('أرفق ملفًا ثم أرسِل');
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          W.rig.complete(ctx, lesson, { impactAr: 'حملت حمامةُ الضوء رسالتك عبر الوادي!' });
        },
      });
    }
  },
});

/* ==== lessons/l3-4.js ==== */
/* Lesson 3.4 — ابحث — the Unit 3 integrated challenge.
 * No new teaching: the child uses the whole sky. Search with keywords, follow a
 * hyperlink, scroll a page by holding and dragging the scrollbar, find the Arabian
 * oryx, then search again for the museum. Finishing runs the THIRD falaj and, when
 * every lesson is done, opens the restored oasis.
 * Flow: search · hyperlink · scroll · find the oryx · search again · the falaj runs. */
W.lessons.register('3.4', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;
    const lbl = W.label.group(ctx, stage);

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'search1', label: 'ابحث بكلمة' },
      { id: 'link', label: 'افتح الارتباط' },
      { id: 'scroll', label: 'مرّر الصفحة' },
      { id: 'animal', label: 'المها العربي' },
      { id: 'search2', label: 'ابحث ثانيةً' },
      { id: 'falaj', label: 'أجرِ الفلج الثالث' },
    ]);

    const room = W.interiors.skyStudy();
    const art = el('div', { style: 'position:absolute;inset:0;pointer-events:none' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اضغط كلمة «حيوانات عُمان»', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    const lblMgr = W.fixkit.labelManager(ctx, stage);
    guide.help();

    const br = W.net.browser(ctx, { host: stage, pos: R.screen });
    br.root.style.zIndex = '28';
    br.addTab('ابحث'); br.activate(0);
    lbl.reveal(br.root, 'متصفح الإنترنت', 'Web Browser', { pos: 'above', id: 'browser' });

    const RESULTS = {
      animals: [
        { id: 'animals', title: 'الحيوانات البرية في عُمان', url: 'hayawanat.om', snippet: 'المها العربي، والنمر، والغزال في سلطنة عُمان.', art: 'oryx' },
        { id: 'zoo', title: 'حديقة الحيوانات', url: 'zoo.om', snippet: 'زيارة الحديقة ومشاهدة الطيور.', art: 'turtle' },
      ],
      museum: [
        { id: 'museum', title: 'متحف واحة التقنية', url: 'almathaf.om', snippet: 'سفنٌ وخناجرُ وفخّارٌ من تراث عُمان.', art: 'fort' },
        { id: 'library', title: 'مكتبة الواحة', url: 'maktaba.om', snippet: 'قصصٌ وكتبٌ للأطفال.', art: 'pot' },
      ],
    };

    let phase = 'search1';

    // the child starts at the search home with keyword chips ready
    ctx.after(60, () => showSearch(['حيوانات عُمان', 'المتحف الوطني', 'قلاع عُمان'], 'اضغط كلمة «حيوانات عُمان»'));

    function showSearch(keywords, prompt) {
      guide.clearStage();
      const home = W.net.searchHome({ keywords });
      br.setContent(home.node, home.h);
      br.setAddress('ابحث.عُمان');
      /* fit the page to the visible browser area: the chips and the letter
       * strip must be reachable without scrolling. */
      ctx.after(30, () => br.refreshHeight(Math.max(200, br.view.clientHeight - 2)));
      /* item 13 (3.4): name the parts — the SEARCH BOX gets its own label */
      lblMgr.clearLabels();
      lbl.reveal(home.box, 'صندوق البحث', 'Search box', { pos: 'above', id: 'searchbox' });
      say(prompt);
      let filled = '', typingTimer = null;
      /* ===== R2 item 7.7 — REAL SEARCH INPUT =======================
       * The chip only *chooses* the word to look for. Every character in
       * the box is typed by the pupil: a wrong letter shows, Backspace
       * deletes it, and nothing is generated automatically. */
      let want = '', typed = '', sErr = false;
      const sMatch = W.fixkit.matcher('');
      function renderBox() {
        home.q.innerHTML = '';
        const sp = el('span', { text: typed });
        if (typed && !sMatch.check(typed).ok) sp.style.color = '#b8552e';
        home.q.appendChild(sp);
        home.q.appendChild(el('span.caret'));
        const done = want && sMatch.check(typed).complete;
        home.btn.classList.toggle('hl', !!done);
        filled = done ? want : '';
      }
      function searchKey(ch) {
        if (!want) { W.fx.softHint(home.chips); say('اختر الكلمة المضيئة أولًا'); return; }
        if (ch === 'Backspace') typed = typed.slice(0, -1);
        else typed += ch;                      // exactly what was pressed
        W.audio.key();
        renderBox();
        const j = sMatch.check(typed);
        if (!j.ok && !sErr) { sErr = true; W.fx.softHint(home.q); say('راجع الحرف، ثم استخدم Backspace لتصحيحه.'); }
        else if (j.ok && sErr) { sErr = false; say('أكمل كتابة الكلمة: ' + want); }
        else if (j.complete) {
          say('اضغط زرّ «ابحث»');
          guide.step({ sayAr: 'اضغط زرّ «ابحث»', simplerAr: 'اضغط الزرّ الأزرق المضيء', src: home.btn, demo: () => guide.handTap(home.btn, 1) });
        }
      }
      ctx.listen(window, 'keydown', ev => {
        if (!home.q.isConnected) return;
        if (ev.key === 'Backspace') { ev.preventDefault(); searchKey('Backspace'); return; }
        if (ev.key === 'Enter') { ev.preventDefault(); if (filled) home.btn.click(); return; }
        if (ev.key.length === 1) {
          ev.preventDefault();
          const ch = W.fixkit.pressedChar(ev, W.fixkit.isArabic(want));
          if (ch) searchKey(ch);
        }
      });
      /* an on-screen letter strip so a tablet pupil can type too */
      const strip = el('div.wb-keystrip', { dataset: { keystrip: '1' } });
      home.box.parentElement.insertBefore(strip, home.box.nextSibling);
      function buildStrip(word) {
        strip.innerHTML = '';
        /* the page grows by one letter row — let the browser re-measure */
        ctx.after(30, () => br.refreshHeight(Math.max(200, br.view.clientHeight - 2)));
        const chars = Array.from(new Set((word + 'ا ').split(''))).filter(c => c !== ' ');
        chars.push(' ');
        chars.forEach(c => {
          const k = el('button.wb-k', { text: c === ' ' ? 'مسافة' : c, dataset: { k: c } });
          ctx.listen(k, 'click', () => { k.classList.add('pressed'); ctx.after(600, () => k.classList.remove('pressed')); searchKey(c); });
          strip.appendChild(k);
        });
        const bsp = el('button.wb-k.bsp', { text: '⌫ حذف', dataset: { k: 'Backspace' } });
        ctx.listen(bsp, 'click', () => searchKey('Backspace'));
        strip.appendChild(bsp);
      }
      const firstChip = home.chips.querySelector('.wb-chip');
      if (firstChip) {
        guide.step({
          sayAr: prompt,
          simplerAr: 'اضغط الكلمة المضيئة',
          src: firstChip,
          demo: () => guide.handTap(firstChip, 1),
        });
      }
      home.chips.querySelectorAll('.wb-chip').forEach(chip => {
        ctx.listen(chip, 'click', () => {
          const word = chip.dataset.chip;
          home.chips.querySelectorAll('.wb-chip.hl').forEach(x => x.classList.remove('hl'));
          chip.classList.add('hl');
          guide.clearSource();
          /* the chip chooses WHAT to look for; the pupil still types it */
          want = word; sMatch.set(word); typed = ''; sErr = false;
          buildStrip(word);
          renderBox();
          say('اكتب الكلمة في صندوق البحث: ' + word);
          guide.step({ sayAr: 'اكتب الكلمة في صندوق البحث: ' + word, simplerAr: 'استخدم لوحة الحروف أسفل الصندوق', src: strip });
        });
      });
      ctx.listen(home.btn, 'click', () => {
        if (!filled) { W.fx.softHint(home.btn); say('اضغط كلمةً من الكلمات المضيئة أولًا'); if (firstChip) W.fx.glow(firstChip); return; }
        guide.done();
        W.audio.success();
        onSearch(filled);
      });
      return home;
    }

    function onSearch(kw) {
      guide.clearStage();
      const which = kw.includes('متحف') || kw.includes('تراث') ? 'museum' : 'animals';
      const res = W.net.resultsPage(kw, RESULTS[which]);
      br.setContent(res.node, res.h);
      br.setAddress('ابحث.عُمان/نتائج');
      // name the first hyperlink
      const firstLink = res.node.querySelector('.wb-link');
      /* R2 item 7.2–7.5: only ONE explanation at a time, and it sits beside
       * the link — the blue words are never covered. Verified by rectangle. */
      lblMgr.clearLabels();
      lbl.reveal(firstLink, 'ارتباط تشعبي', 'Hyperlink', { pos: 'end', id: 'link' });
      ctx.after(80, () => lblMgr.resolveOverlaps());
      if (phase === 'search1') {
        check.done('search1'); phase = 'link';
        ctx.after(900, () => guide.step({
          sayAr: 'اضغط الرابط الأزرق الأول',
          simplerAr: 'اضغط الكلمات الزرقاء المسطّرة',
          src: firstLink,
          demo: () => guide.handTap(firstLink, 1),
        }));
      } else if (phase === 'search2') {
        check.done('search2'); phase = 'link2';
        ctx.after(700, () => guide.step({
          sayAr: 'اضغط رابط المتحف الأزرق',
          simplerAr: 'اضغط الكلمات الزرقاء المسطّرة',
          src: firstLink,
          demo: () => guide.handTap(firstLink, 1),
        }));
      }
    }

    /* follow a hyperlink */
    ctx.delegate('click', '.wb-link', (ev, link) => {
      const id = link.dataset.link;
      if (phase === 'link' && id === 'animals') {
        const pg = W.net.animalsPage();
        br.setContent(pg.node, pg.h);
        br.setAddress('hayawanat.om');
        lblMgr.clearLabels();
        lbl.reveal(pg.node.querySelector('.wb-h1'), 'موقع ويب', 'Website', { pos: 'below', id: 'website34' });
        ctx.after(2400, () => lblMgr.clearLabels());
        W.audio.open(); W.fx.sparkleAt(ctx.root, br.root, 6);
        check.done('link');
        guide.done();
        guide.confirm('فتحتَ صفحة الحيوانات', br.root);
        phase = 'scroll';
        ctx.after(700, () => {
          guide.arrow(br.thumb, 'down', { len: 90 });
          guide.step({
            sayAr: 'اسحب شريط التمرير إلى الأسفل',
            simplerAr: 'أمسك الشريط البُنّي واسحبه للأسفل',
            src: br.thumb,
            demo: () => guide.handDrag(br.thumb, null, { ms: 1400, dx: 0, dy: 150 }),
          });
        });
        watchScroll();
      } else if (phase === 'link' && id) { W.fx.softHint(link); say('افتح رابط الحيوانات'); }
      else if (phase === 'link2' && id === 'museum') {
        const pg = W.net.museumPage();
        br.setContent(pg.node, pg.h);
        br.setAddress('almathaf.om');
        W.audio.open(); W.fx.sparkleAt(ctx.root, br.root, 7);
        check.done('search2');
        phase = 'collect';
        collectLight();
      } else if (phase === 'link2' && id) { W.fx.softHint(link); say('افتح رابط المتحف'); }
    });

    /* scroll the tall page by dragging the thumb */
    function watchScroll() {
      br.onScroll = (pos, max) => {
        if (phase === 'scroll' && max > 0 && pos > max * 0.5) {
          br.onScroll = null;
          guide.done();
          guide.confirm('مرّرتَ الصفحة', br.thumb);
          check.done('scroll');
          phase = 'animal';
          ctx.after(700, () => {
            const o = stage.querySelector('.wb-animal[data-animal="oryx"]');
            guide.step({
              sayAr: 'اضغط صورة المها العربي',
              simplerAr: 'اضغط الحيوان الأبيض ذا القرنين',
              src: o,
              demo: () => o && guide.handTap(o, 1),
            });
          });
          // return to the top only once the child lets go of the scrollbar,
          // otherwise the rest of the drag would scroll the page straight back down
          ctx.after(650, () => { if (phase === 'animal') br.setScroll(0); });
        }
      };
    }

    /* find the Arabian oryx */
    ctx.delegate('click', '.wb-animal', (ev, card) => {
      if (phase !== 'animal') return;
      const a = card.dataset.animal;
      if (a === 'oryx') {
        lbl.reveal(card.querySelector('.wb-cap'), 'المها العربي', 'Arabian Oryx', { pos: 'above', id: 'oryx' });
        guide.done();
        guide.confirm('وجدتَ المها العربي', card);
        check.done('animal');
        phase = 'search2';
        ctx.after(1400, () => showSearch(['المتحف الوطني', 'حيوانات عُمان', 'قلاع عُمان'], 'اضغط كلمة «المتحف الوطني»'));
      } else { W.fx.softHint(card); say('المها العربي أبيض بقرنين طويلين'); }
    });

    /* ---------- collect the light, run the third falaj ---------- */
    function collectLight() {
      say('اجمع ضوء المعرفة…');
      const orb = el('div', { style: 'position:absolute;left:50%;top:44%;width:calc(var(--su)*70);height:calc(var(--su)*70);transform:translate(-50%,-50%);z-index:30;border-radius:50%;background:radial-gradient(circle at 40% 35%, #fff6dd, #ffd166 60%, rgba(255,209,102,0));opacity:0;transition:opacity .8s ease' });
      stage.appendChild(orb);
      ctx.after(60, () => { orb.style.opacity = '1'; });
      W.audio.note(523, .3); ctx.after(300, () => W.audio.note(659, .3)); ctx.after(600, () => W.audio.note(784, .4));
      ctx.after(1500, () => {
        if (br) br.root.style.transition = 'opacity .8s ease', br.root.style.opacity = '0';
        orb.style.transition = 'left 1s ease, top 1s ease, transform 1s ease';
        orb.style.left = '50%'; orb.style.top = '20%';
        ctx.after(1100, runFalaj);
      });
    }

    function runFalaj() {
      check.done('falaj');
      phase = 'done';
      say('اكتمل الوصل!');
      // the signal beacon on the far tower blazes
      const bc = room.svg.querySelector('.far-tower .far-glass');
      if (bc) { bc.setAttribute('fill', 'url(#winGlow)'); bc.classList.add('win-wake'); }
      // a golden falaj runs across the terrace foreground
      const water = sv('svg', { viewBox: '0 0 1366 768', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;z-index:22;pointer-events:none' });
      const path = sv('path', { d: 'M1300 470 C 1000 560, 500 600, 40 700', fill: 'none', stroke: 'url(#waterMain)', 'stroke-width': 24, 'stroke-linecap': 'round', opacity: .92 });
      water.appendChild(path);
      stage.appendChild(water);
      const len = 1200;
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.style.transition = 'stroke-dashoffset 2.2s ease';
      ctx.after(500, () => { path.style.strokeDashoffset = '0'; W.audio.note(320, .9); });
      ctx.after(2600, () => {
        const allDone = W.store.completedCount() >= 15; // this completion makes 16
        const extra = allDone ? el('button.btn.primary', {
          text: '✨ عاد نبض الفلج', dataset: { action: 'finale' },
          onclick: () => { W.audio.click(); W.scene.go('finale'); },
        }) : null;
        W.rig.complete(ctx, lesson, { impactAr: 'اكتمل الوصل وجرى الفلج الثالث!', extra });
      });
    }
  },
});

/* ==== engine/boot.js ==== */
/* Boot. */
(function () {
  const app = document.getElementById('app');
  const stage = W.util.el('div.stage');
  app.appendChild(stage);
  W.util.bindStageUnit(stage);
  W.scene.init(stage);

  // persisted settings
  if (W.store.settings.reducedMotion) document.documentElement.dataset.reducedMotion = '1';

  W.store.sessionStart();
  W.analytics.send('app_opened'); // inert offline (adapter disabled)

  // Teacher Mode entry (Ctrl+Shift+T) — ships in v2.0.
  window.addEventListener('keydown', ev => {
    if (!(ev.ctrlKey && ev.shiftKey && (ev.key === 'T' || ev.key === 't'))) return;
    ev.preventDefault();
    if (W.teacherMode) { W.teacherMode.open(); return; }
  });

  // Visible Teacher Mode button — persistent across all scenes (except the
  // immersive opening). Mirrors the Grade-4 affordance; shortcut still works.
  const tmBtn = W.util.el('button.teacher-fab', {
    dataset: { teacherFab: '1' },
    'aria-label': 'وضع المعلم — Teacher Mode',
    title: 'وضع المعلم (Ctrl+Shift+T)',
  });
  tmBtn.appendChild(W.util.el('span.tm-fab-ic', { text: '👩‍🏫' }));
  tmBtn.appendChild(W.util.el('span.tm-fab-lab', { text: 'وضع المعلم' }));
  tmBtn.addEventListener('click', () => { if (W.teacherMode) W.teacherMode.open(); });
  app.appendChild(tmBtn);
  // hide the FAB during the opening intro and inside a lesson (the lesson header
  // already carries its own controls; the Ctrl+Shift+T shortcut still works there),
  // and while Teacher Mode / Demo overlays are open.
  function syncFab() {
    const s = W.scene.currentId;
    const hide = (s === 'opening') || (s === 'lesson') || (W.teacherMode && W.teacherMode.isOpen) || (W.demo && W.demo.isRunning);
    tmBtn.style.display = hide ? 'none' : '';
  }
  W.scene.onChange && W.scene.onChange(syncFab);
  setInterval(syncFab, 400); // lightweight guard for open/close of overlays
  syncFab();

  // Supervisor Demo Mode entry (Ctrl+Shift+D)
  window.addEventListener('keydown', ev => {
    if (!(ev.ctrlKey && ev.shiftKey && (ev.key === 'D' || ev.key === 'd'))) return;
    ev.preventDefault();
    if (W.demo) { if (W.demo.isRunning) W.demo.end(false); else W.demo.start(); }
  });

  // unlock audio on first gesture
  window.addEventListener('pointerdown', () => W.audio.unlock(), { once: true });

  // deterministic test hooks (harmless in production)
  W.test = {
    go: (id, p) => W.scene.go(id, p),
    scene: () => W.scene.currentId,
    store: W.store,
    lessonsBuilt: () => W.lessons.builtCount,
    teacher: () => W.teacherMode,
    demo: () => W.demo,
    openTeacher: () => W.teacherMode && W.teacherMode.open(),
    startDemo: () => W.demo && W.demo.start(),
  };

  W.scene.go(W.store.settings.seenIntro ? 'home' : 'opening');
})();

</script>


<script id="waha-paint-fit">
/* تثبيت لوحة الأدوات وفقاعة الشرح داخل حدود المسرح — مواضع فقط.
   لا يمسّ منطق المحاكي ولا إحداثيات الرسم ولا ترتيب الدروس. */
(function () {
  "use strict";
  function stageOf(n) { return n.closest('#stage,.stage,#app') || document.body; }
  function fitBar() {
    var bars = document.querySelectorAll('.pbar'), i;
    for (i = 0; i < bars.length; i++) {
      var b = bars[i], host = b.offsetParent || stageOf(b);
      var hr = host.getBoundingClientRect(), r = b.getBoundingClientRect();
      if (!r.height) { continue; }
      var pad = 10, over = r.bottom - (hr.bottom - pad);
      if (over > 0) {
        var curTop = parseFloat(getComputedStyle(b).top) || 0;
        b.style.top = Math.max(pad, curTop - over) + 'px';
      }
      r = b.getBoundingClientRect();
      var ox = r.right - (hr.right - pad);
      if (ox > 0) { var cl = parseFloat(getComputedStyle(b).left) || 0; b.style.left = Math.max(pad, cl - ox) + 'px'; }
      if (r.left < hr.left + pad) { b.style.left = pad + 'px'; }
    }
  }
  function fitSpeak() {
    var sp = document.querySelector('.speak'), sc = document.querySelector('.step-counter');
    if (!sp) { return; }
    sp.style.removeProperty('top');
    if (!sc) { return; }
    var a = sp.getBoundingClientRect(), b = sc.getBoundingClientRect();
    var overlap = !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    if (overlap) { sp.style.top = Math.round(b.bottom - (sp.offsetParent ? sp.offsetParent.getBoundingClientRect().top : 0) + 10) + 'px'; }
  }
  function run() { try { fitBar(); fitSpeak(); } catch (e) {} }
  function boot() {
    run();
    setInterval(run, 700);
    window.addEventListener('resize', function () { setTimeout(run, 120); });
    window.addEventListener('orientationchange', function () { setTimeout(run, 260); });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script></body>
