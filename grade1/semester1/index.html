/* ==== styles/base.css ==== */
/* ======= Wahat Al-Taqnia — design tokens ======= */
:root {
  /* Omani dawn-oasis palette */
  --night: #17264f;
  --sky1: #1d3557;
  --sky2: #5e7fb2;
  --sky3: #f4a95c;
  --day1: #7ec3e8;
  --day2: #cfeaf6;
  --sand: #e8d5a8;
  --sand-deep: #c9a96e;
  --palm: #2f7d52;
  --palm-deep: #1e5a3a;
  --water: #49b8b0;
  --water-glow: #9fe8e2;
  --stone: #8a6a52;
  --wood: #6b4a33;
  --wood-deep: #4d3423;
  --copper: #c97f3d;
  --copper-bright: #e8a45c;
  --ink: #2a2118;
  --ink-soft: #5a4a3a;
  --paper: #fbf3e2;
  --paper-deep: #f1e3c6;
  --focus: #ffd166;
  --good: #3f9e6e;
  --star: #ffe9a8;
  /* stage unit: 1su = 1px at the 1366-wide reference stage */
  --su: 1px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { height: 100dvh; }
body { min-height: 100dvh; overflow-x: hidden; }
body {
  background: var(--wood-deep);
  font-family: 'Sakkal Majalla', 'Segoe UI', Tahoma, 'FreeSerif', serif;
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
.noscript {
  color: var(--paper); text-align: center; padding: 2rem; font-size: 1.4rem;
}

/* ======= Stage & integrated letterboxing =======
   The world keeps a fixed 16:9 composition. The surrounding frame is a
   crafted wooden border, never dead black bars. Nothing is ever cropped. */
#app {
  position: fixed; inset: 0;
  width: 100dvw; height: 100dvh;
  /* respect notches and rounded corners on iPhone/iPad */
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
           env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  /* the shell fills #app — nothing is centred inside a smaller box */
  display: grid; grid-template: 1fr / 1fr; place-items: stretch;
  background:
    radial-gradient(120% 90% at 50% 8%, #5d4028 0%, var(--wood-deep) 58%, #33220f 100%);
}
#app::before { /* carved frame texture */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, rgba(255, 230, 190, .045) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .10) 0 2px, transparent 2px 30px);
}
.stage {
  position: relative;
  /* TRUE EDGE-TO-EDGE: the browser viewport IS the platform. No centred
     16:9 cap, no wooden gutters. Room artwork covers the whole area with
     `xMidYMid slice` so nothing is stretched, and interactive objects keep
     their own proportions through aspect-ratio. */
  width: 100vw;  height: 100vh;
  width: 100svw; height: 100svh;
  width: 100dvw; height: 100dvh;
  max-width: 100%; max-height: 100%;
  background: var(--night);
  overflow: hidden;
  box-shadow: 0 0 0 calc(var(--su) * 3) var(--copper),
              0 0 calc(var(--su) * 40) rgba(0, 0, 0, .55);
  border-radius: calc(var(--su) * 6);
}
.scene { position: absolute; inset: 0; }
.scene > svg.world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ======= Type scale (scales with the stage) ======= */
.t-display { font-size: calc(var(--su) * 64); font-weight: 700; letter-spacing: .01em; }
.t-title   { font-size: calc(var(--su) * 40); font-weight: 700; }
.t-big     { font-size: calc(var(--su) * 28); font-weight: 700; }
.t-body    { font-size: calc(var(--su) * 23); }
.t-small   { font-size: calc(var(--su) * 18); }
.t-en      { font-family: 'Segoe UI', Tahoma, 'FreeSerif', sans-serif; direction: ltr; unicode-bidi: isolate; }

/* ======= Focus & accessibility ======= */
:focus { outline: none; }
:focus-visible {
  outline: calc(var(--su) * 4) solid var(--focus);
  outline-offset: calc(var(--su) * 3);
  border-radius: calc(var(--su) * 10);
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* Reduced motion: honor both the OS setting and the in-app toggle */
@media (prefers-reduced-motion: reduce) {
  .anim, .anim * { animation: none !important; transition: none !important; }
}
html[data-reduced-motion="1"] .anim,
html[data-reduced-motion="1"] .anim * { animation: none !important; transition: none !important; }

/* ==== styles/world.css ==== */
/* ======= The living world: cinematic layers, light, materials ======= */

.world-wrap {
  position: absolute; inset: 0; overflow: hidden;

}
.world3d { position: absolute; inset: -3.5%; will-change: transform; transition: transform 1.6s cubic-bezier(.22,.8,.3,1); }

/* camera moves */
.world3d.cam-in { transform: scale(1.045); }
[data-reduced-motion="1"] .world3d { transition: none !important; }

/* parallax layers move via JS translate3d on --px/--py */
.pxl { transform: translate3d(calc(var(--px, 0) * var(--depth, 0) * 1px), calc(var(--py, 0) * var(--depth, 0) * 1px), 0); }

/* ---- the golden light thread ---- */
.thread { filter: drop-shadow(0 0 6px rgba(255, 214, 128, .9)); }

  var SIM_SEL = [

      if (cs.display === "none" || cs.visibility === "hidden") { continue; }
      r = e.getBoundingClientRect();

  }
  function buildSimRot() {
    if (document.getElementById("waha-simrot")) { return; }
    var ov = el("div", { id: "waha-simrot", role: "alertdialog", "aria-live": "polite" });
    ov.appendChild(el("div", { class: "waha-rot-emoji", text: "📱" }));

        svgEl("circle", { cx: "56", cy: "75", r: "2.4" }),

    var r = g.getBoundingClientRect();

    g.style.setProperty("position", "fixed", "important");
    g.style.setProperty("top", "10px", "important");
    g.style.setProperty("right", "12px", "important");
    g.style.setProperty("left", "auto", "important");
    g.style.setProperty("bottom", "auto", "important");
    g.style.setProperty("inset-inline-end", "12px", "important");

    g.style.setProperty("height", "", "important");

W.util.draggable = function (ctx, node, opts) {

    if (o.disabled && o.disabled()) return;

    const nr = node.getBoundingClientRect();

    node.setPointerCapture(ev.pointerId);

      travelled += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
      lx = e.clientX; ly = e.clientY;
      node.style.insetInlineStart = 'auto';
      node.style.left = (e.clientX - pr.left - dx) + 'px';
      node.style.top = (e.clientY - pr.top - dy) + 'px';

  });

W.util.overlaps = function (a, b, pad) {
  const p = pad || 0, ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  return !(ra.right < rb.left - p || rb.right < ra.left - p || ra.bottom < rb.top - p || rb.bottom < ra.top - p);
};

/* ==== engine/storage.js ==== */
/* Local progress, local anonymous statistics, and settings.
 * Works even when browser storage is unavailable (in-memory fallback).
 * Stores only anonymous local data. No personal data. No network. */
W.store = (function () {
  const KEY = 'wahat.g1.v1';
  const mem = {}; // fallback
  let usable = true;
  try {
    const t = '__wahat_probe__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
  } catch (e) { usable = false; }

  function rawGet() {
    try {
      if (usable) {
        const s = window.localStorage.getItem(KEY);
        return s ? JSON.parse(s) : null;
      }
    } catch (e) { /* fall through to memory */ }
    return mem[KEY] || null;
  }
  function rawSet(obj) {
    mem[KEY] = obj;
    try { if (usable) window.localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* memory only */ }
  }

  function blank() {
    return {
      progress: { lessons: {}, lastLesson: null, artworks: {} },
      stats: { opens: 0, sessions: 0, lessonOpens: {}, completed: {}, lastLesson: null, lastUse: null },
      settings: { muted: false, reducedMotion: false },
    };
  }

  let data = rawGet() || blank();
  // forward-compatible merge
  data = Object.assign(blank(), data);
  data.progress = Object.assign(blank().progress, data.progress);
  data.stats = Object.assign(blank().stats, data.stats);
  data.settings = Object.assign(blank().settings, data.settings);

  function save() { rawSet(data); }

  const api = {
    get storageAvailable() { return usable; },
    get settings() { return data.settings; },
    setSetting(k, v) { data.settings[k] = v; save(); },
    saveSettings(patch) { Object.assign(data.settings, patch || {}); save(); },

    sessionStart() {
      data.stats.opens += 1;
      data.stats.sessions += 1;
      data.stats.lastUse = new Date().toISOString();
      save();
    },
    lessonOpened(id) {
      data.stats.lessonOpens[id] = (data.stats.lessonOpens[id] || 0) + 1;
      data.stats.lastLesson = id;
      data.stats.lastUse = new Date().toISOString();
      const L = data.progress.lessons[id] || (data.progress.lessons[id] = {});
      L.visited = true;
      data.progress.lastLesson = id;
      save();
    },
    lessonCompleted(id) {
      const L = data.progress.lessons[id] || (data.progress.lessons[id] = {});
      L.completed = true; L.completedAt = new Date().toISOString();
      L.visited = true;
      data.stats.completed[id] = true;
      data.progress.lastLesson = id;
      save();
    },
    lessonState(id) { return data.progress.lessons[id] || {}; },
    _setModes(id, modes) {
      const L = data.progress.lessons[id] || (data.progress.lessons[id] = {});
      L.modes = Object.assign({}, L.modes, modes);
      save();
    },
    artworkSave(id, art) { (data.progress.artworks || (data.progress.artworks = {}))[id] = art; save(); },
    artworkGet(id) { return (data.progress.artworks || {})[id] || null; },
    artworkList() { const a = data.progress.artworks || {}; return Object.keys(a).map(k => Object.assign({ id: k }, a[k])); },
    get lastLesson() { return data.progress.lastLesson; },
    get hasProgress() { return !!data.progress.lastLesson; },
    completedCount() { return Object.keys(data.stats.completed).length; },
    statsSnapshot() { return JSON.parse(JSON.stringify(data.stats)); },
    resetStats() { data.stats = blank().stats; save(); },
    resetAll() { data = blank(); save(); },
  };
  return api;
})();

/* ==== engine/audio.js ==== */
/* Subtle local audio, synthesized with WebAudio — no files, no network.
 * Every essential sound has a visual equivalent elsewhere in the UI. */
W.audio = (function () {
  let ctx = null, master = null, waterNodes = null;

  function ensure() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = W.store.settings.muted ? 0 : 0.8;
      master.connect(ctx.destination);
      return true;
    } catch (e) { return false; }
  }

  function tone(freq, dur, type, vol, when, slideTo) {
    if (!ensure() || W.store.settings.muted) return;
    const t0 = ctx.currentTime + (when || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  const api = {
    unlock() { if (ensure() && ctx.state === 'suspended') ctx.resume(); },
    click() { tone(1250, 0.05, 'triangle', 0.12); },
    key() { tone(680 + Math.random() * 160, 0.045, 'square', 0.05); },
    open() { tone(420, 0.12, 'sine', 0.14, 0, 640); },
    note(freq, dur) { tone(freq, dur || 0.3, 'sine', 0.12); },
    success() { // warm three-note chime
      tone(523, 0.16, 'sine', 0.16);
      tone(659, 0.18, 'sine', 0.16, 0.10);
      tone(784, 0.30, 'sine', 0.18, 0.20);
    },
    hint() { tone(300, 0.14, 'sine', 0.08, 0, 240); }, // soft, never harsh
    water(on) {
      if (!ensure()) return;
      if (on && !waterNodes && !W.store.settings.muted) {
        const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < d.length; i++) { // soft brown noise
          const white = Math.random() * 2 - 1;
          last = (last + 0.02 * white) / 1.02;
          d[i] = last * 3.2;
        }
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 0.6;
        const g = ctx.createGain(); g.gain.value = 0.045;
        src.connect(f); f.connect(g); g.connect(master); src.start();
        waterNodes = { src, g };
      } else if (!on && waterNodes) {
        try { waterNodes.src.stop(); } catch (e) { /* already stopped */ }
        waterNodes = null;
      }
    },
    setMuted(m) {
      W.store.setSetting('muted', m);
      if (master) master.gain.value = m ? 0 : 0.8;
      if (m) api.water(false);
    },
    get muted() { return W.store.settings.muted; },
  };
  return api;
})();

/* ==== engine/speech.js ==== */
/* ==== engine/speech.js — Grade-1 v2 offline word pronunciation ====
 * Speaks concept names aloud using the browser's LOCAL SpeechSynthesis voices
 * (no network, no external API). Speaks Arabic first, pauses, then the English
 * term, and highlights the written word. Respects the mute setting and never
 * lets two words overlap.
 *
 * HONESTY: callers check available() ONCE and pick one of two states. When no
 * local voice exists, the UI shows written-only wording ("لترى اسمها بالعربية
 * والإنجليزية"), hides the speaker icon, and plays no tone. We never pretend a
 * name was heard, and never promise listening the device cannot deliver.
 *
 * API:
 *   W.speech.available()            -> { ar:boolean, en:boolean, any:boolean }
 *   W.speech.say(arText, enText, o) -> Promise<{spokenAr, spokenEn}>
 *   W.speech.stop()                 -> cancel any in-progress speech
 *   W.speech.supported              -> boolean (SpeechSynthesis exists at all)
 */
W.speech = (function () {
  const synth = (typeof window !== 'undefined') && window.speechSynthesis;
  const supported = !!synth;
  let voices = [];

  function loadVoices() {
    if (!supported) return;
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
  }
  if (supported) {
    loadVoices();
    try { synth.addEventListener('voiceschanged', loadVoices); } catch (e) { /* older engines */ }
  }

  function pickVoice(langPrefix) {
    if (!voices.length) loadVoices();
    // exact-ish match on language prefix ('ar', 'en')
    return voices.find(v => (v.lang || '').toLowerCase().startsWith(langPrefix)) || null;
  }

  function available() {
    const ar = !!pickVoice('ar');
    const en = !!pickVoice('en');
    return { ar, en, any: ar || en };
  }

  function stop() {
    if (!supported) return;
    try { synth.cancel(); } catch (e) { /* no-op */ }
  }

  function utter(text, voice, lang, rate) {
    return new Promise((resolve) => {
      if (!supported || !voice) { resolve(false); return; }
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.voice = voice; u.lang = voice.lang || lang;
        u.rate = rate || 0.9; u.pitch = 1.0; u.volume = 1.0;
        let done = false;
        const fin = () => { if (done) return; done = true; resolve(true); };
        u.onend = fin; u.onerror = () => { done = true; resolve(false); };
        // safety timeout so a stuck engine never hangs the flow
        setTimeout(fin, 4000);
        synth.speak(u);
      } catch (e) { resolve(false); }
    });
  }

  /* say the Arabic name, pause, then the English term.
   * returns which parts were actually spoken (for truthful UI). */
  async function say(arText, enText, o) {
    o = o || {};
    if (W.store && W.store.settings && W.store.settings.muted) {
      return { spokenAr: false, spokenEn: false, muted: true };
    }
    if (!supported) return { spokenAr: false, spokenEn: false };
    stop(); // never overlap
    const arV = pickVoice('ar');
    const enV = pickVoice('en');
    let spokenAr = false, spokenEn = false;
    if (arText && arV) spokenAr = await utter(arText, arV, 'ar', 0.85);
    if (enText && enV) {
      await new Promise(r => setTimeout(r, spokenAr ? 220 : 0)); // brief pause
      spokenEn = await utter(enText, enV, 'en', 0.9);
    }
    return { spokenAr, spokenEn };
  }

  return { supported, available, say, stop, _reloadVoices: loadVoices };
})();

/* ==== engine/fx.js ==== */
/* Controlled magical feedback effects. Warm, small, never harsh. */
W.fx = (function () {
  function layer(sceneRoot) {
    let l = sceneRoot.querySelector(':scope > .fx-layer');
    if (!l) { l = W.util.el('div.fx-layer'); sceneRoot.appendChild(l); }
    return l;
  }

  /** Warm sparkles at (x, y) in stage pixels, relative to sceneRoot. */
  function sparkle(sceneRoot, x, y, n) {
    if (document.documentElement.dataset.reducedMotion === '1') return;
    const l = layer(sceneRoot);
    const count = n || 10;
    for (let i = 0; i < count; i++) {
      const s = W.util.el('div.spark');
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.6;
      const r = 30 + Math.random() * 55;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(a) * r + 'px');
      s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      l.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  function sparkleAt(sceneRoot, el, n) {
    const r = el.getBoundingClientRect(), s = sceneRoot.getBoundingClientRect();
    sparkle(sceneRoot, r.left - s.left + r.width / 2, r.top - s.top + r.height / 2, n);
  }

  function glow(el) {
    el.classList.remove('glow-pulse'); void el.offsetWidth; el.classList.add('glow-pulse');
    setTimeout(() => el.classList.remove('glow-pulse'), 800);
  }

  /** Gentle wrong-answer response: soft nudge + soft sound. Never a red X. */
  function softHint(el) {
    el.classList.remove('soft-hint'); void el.offsetWidth; el.classList.add('soft-hint');
    W.audio.hint();
    setTimeout(() => el.classList.remove('soft-hint'), 600);
  }

  return { sparkle, sparkleAt, glow, softHint };
})();

/* ==== engine/label.js ==== */
/* Object-anchored bilingual labels — the binding object-label rule.
 * Sequence: object appears → child interacts → object responds →
 * the ARABIC name appears ON or BESIDE that exact object →
 * the ENGLISH term appears directly below it, smaller →
 * the child applies the skill.
 *
 * Guarantees:
 *  - the label is anchored to the object's live bounding box and FOLLOWS it
 *    (drags, CSS transitions, layout shifts) via one light rAF loop per stage;
 *  - the label never blocks interaction (pointer-events: none) and is placed
 *    OUTSIDE the object by default so it never covers the target;
 *  - Arabic first, English directly below in a smaller size;
 *  - re-revealing the same object flashes its existing label instead of
 *    duplicating it; a detached object removes its own label. */
W.label = (function () {
  const { el } = W.util;

  /** Create a label group bound to one lesson stage. */
  function group(ctx, stage) {
    const layer = el('div.obj-label-layer', { dataset: { objLabels: '1' } });
    stage.appendChild(layer);
    const items = new Map(); // node -> { node, box, opts }
    let raf = null;

    function place(it) {
      const sr = stage.getBoundingClientRect();
      if (!sr.width) return;
      const r = it.node.getBoundingClientRect();
      if (!it.node.isConnected || r.width === 0) {
        // the object left the world — its name goes with it
        it.box.classList.add('ol-gone');
        items.delete(it.node);
        setTimeout(() => it.box.remove(), 380);
        return;
      }
      const b = it.box;
      const bw = b.offsetWidth, bh = b.offsetHeight;
      const pos = it.opts.pos || 'below';
      let x = r.left + r.width / 2 - sr.left;
      let y;
      if (pos === 'above') y = r.top - sr.top - bh - 6;
      else if (pos === 'inside-top') y = r.top - sr.top + 4;
      else if (pos === 'inside-bottom') y = r.bottom - sr.top - bh - 4;
      else if (pos === 'start') { x = r.right - sr.left + bw / 2 + 8; y = r.top - sr.top + r.height / 2 - bh / 2; }
      else if (pos === 'end') { x = r.left - sr.left - bw / 2 - 8; y = r.top - sr.top + r.height / 2 - bh / 2; }
      else y = r.bottom - sr.top + 6; // below (default)
      x += (it.opts.dx || 0) * sr.width / 100;
      y += (it.opts.dy || 0) * sr.height / 100;
      // stay inside the stage
      x = W.util.clamp(x, bw / 2 + 2, sr.width - bw / 2 - 2);
      y = W.util.clamp(y, 2, sr.height - bh - 2);
      b.style.transform = `translate(-50%,0) translate(${x}px, ${y}px)`;
      b.dataset.side = pos;
    }

    function tick() {
      raf = null;
      if (!stage.isConnected) return;
      items.forEach(place);
      if (items.size) raf = requestAnimationFrame(tick);
    }
    function ensureLoop() { if (!raf && items.size) raf = requestAnimationFrame(tick); }
    ctx.onCleanup(() => { if (raf) cancelAnimationFrame(raf); items.clear(); });

    return {
      /** Reveal (or flash) the bilingual name of `node`. */
      reveal(node, ar, en, opts) {
        if (!node || !node.isConnected) return null;
        const had = items.get(node);
        if (had) { flash(had.box); return had.box; }
        const box = el('div.obj-label', { dataset: { labelFor: (opts && opts.id) || ar } });
        box.appendChild(el('span.ol-ar', { text: ar }));
        if (en) box.appendChild(el('span.ol-en', { text: en }));
        layer.appendChild(box);
        const it = { node, box, opts: opts || {} };
        items.set(node, it);
        place(it);
        ensureLoop();
        if (!(opts && opts.quiet)) W.audio.hint();
        // clarity without clutter: the full name reads first, then folds into a
        // compact tag; touching/hovering/focusing the object opens it again
        if (!(opts && opts.keepFull)) {
          const fold = setTimeout(() => box.classList.add('ol-mini'), (opts && opts.fold) || 4200);
          const open = () => { clearTimeout(fold); box.classList.remove('ol-mini'); };
          const shut = () => { if (!box.classList.contains('ol-mini')) setTimeout(() => box.classList.add('ol-mini'), 2200); };
          node.addEventListener('pointerenter', open, { signal: ctx.signal });
          node.addEventListener('pointerleave', shut, { signal: ctx.signal });
          node.addEventListener('focus', open, { signal: ctx.signal });
          node.addEventListener('click', open, { signal: ctx.signal });
        }
        return box;
      },
      /** Momentary action-term at a node (for verbs like انقر / نقرة مزدوجة). */
      action(node, ar, en, opts) {
        const box = this.reveal(node, ar, en, Object.assign({ quiet: true }, opts));
        if (!box) return;
        box.classList.add('ol-action');
        const life = (opts && opts.ms) || 2400;
        ctx.after(life, () => { this.remove(node); });
        return box;
      },
      flash(node) { const it = items.get(node); if (it) flash(it.box); },
      /** Collapse this object's label to a compact anchored tag. */
      mini(node) { const it = items.get(node); if (it) it.box.classList.add('ol-mini'); },
      /** Expand this object's label again (click / focus / renewed interaction). */
      full(node) { const it = items.get(node); if (it) it.box.classList.remove('ol-mini'); },
      /** Collapse every label except the one belonging to `node`. */
      onlyFull(node) {
        items.forEach((it, n) => it.box.classList.toggle('ol-mini', n !== node));
      },
      remove(node) {
        const it = items.get(node);
        if (!it) return;
        items.delete(node);
        it.box.classList.add('ol-gone');
        setTimeout(() => it.box.remove(), 380);
      },
      has(node) { return items.has(node); },
      layer,
    };
  }

  function flash(box) {
    box.classList.remove('ol-flash'); void box.offsetWidth; box.classList.add('ol-flash');
    setTimeout(() => box.classList.remove('ol-flash'), 700);
  }

  return { group };
})();

/* ==== engine/guide.js ==== */
/* Grade-1 guidance engine — Checkpoint 4U.
 *
 * A six-year-old must never guess. Every step answers, visually:
 *   1) what do I touch?      → source(node)      strong amber halo + pulse
 *   2) what do I do?         → hand/tap cues     ghost hand, tap rings, arrows
 *   3) where does it go?     → target(node)      pulsing destination + dotted preview
 *   4) what happened?        → confirm(text)     names the object/action that succeeded
 *
 * Also provides: high-contrast double-stroke cables with direction pulses and end
 * nodes, an idle-hint escalator (3s demo → 7s simpler wording + both ends lit),
 * and an «أرِني» help button that replays the current demonstration.
 *
 * Everything is teardown-safe: all timers/rAF are owned by the scene ctx. */
W.guide = (function () {
  const { el, sv } = W.util;

  function group(ctx, stage, opts) {
    const o = opts || {};
    const layer = el('div.guide-layer', { dataset: { guide: '1' } });
    stage.appendChild(layer);
    const svgL = sv('svg', {
      class: 'guide-svg', viewBox: '0 0 1366 768', preserveAspectRatio: 'none',
      style: 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible',
    });
    layer.appendChild(svgL);

    let srcNode = null, tgtNode = null, previewPath = null;
    let idleT1 = null, idleT2 = null, demoEl = null, lastDemo = null;
    let sayFn = o.say || (() => {});

    /* ---------- geometry in the 1366×768 guide space ---------- */
    function pt(node, ky, kx) {
      const sr = stage.getBoundingClientRect(), r = node.getBoundingClientRect();
      return {
        x: (r.left + r.width * (kx == null ? .5 : kx) - sr.left) / sr.width * 1366,
        y: (r.top + r.height * (ky == null ? .5 : ky) - sr.top) / sr.height * 768,
      };
    }

    /* ---------- 1) the START object ---------- */
    function source(node, hold) {
      clearSource();
      if (!node) return;
      srcNode = node;
      node.classList.add('g-src');
      if (!hold) W.audio.click();
    }
    function clearSource() {
      if (srcNode) srcNode.classList.remove('g-src');
      srcNode = null;
    }

    /* ---------- 3) the DESTINATION ---------- */
    function target(node) {
      clearTarget();
      if (!node) return;
      tgtNode = node;
      node.classList.add('g-tgt');
    }
    function clearTarget() {
      if (tgtNode) tgtNode.classList.remove('g-tgt');
      tgtNode = null;
    }

    /** A dotted animated preview path from the chosen source to its target. */
    function preview(fromNode, toNode, opt) {
      clearPreview();
      if (!fromNode || !toNode) return;
      const op = opt || {};
      const a = pt(fromNode, op.ay == null ? .78 : op.ay);
      const b = pt(toNode, op.by == null ? .5 : op.by);
      const midY = Math.max(a.y, b.y) + (op.sag == null ? 54 : op.sag);
      const d = `M ${a.x} ${a.y} C ${a.x} ${midY}, ${b.x} ${midY}, ${b.x} ${b.y}`;
      previewPath = sv('path', {
        d, fill: 'none', stroke: '#ffd166', 'stroke-width': 6, 'stroke-linecap': 'round',
        'stroke-dasharray': '2 20', class: 'g-preview', 'vector-effect': 'non-scaling-stroke',
      });
      svgL.appendChild(previewPath);
      return previewPath;
    }
    function clearPreview() { if (previewPath) { previewPath.remove(); previewPath = null; } }

    /* ---------- 2) ACTION cues ---------- */
    /** A ghost hand that travels from A to B, demonstrating the drag. */
    function handDrag(fromNode, toNode, opt) {
      const op = opt || {};
      const a = pt(fromNode, op.ay);
      const b = toNode ? pt(toNode, op.by)
        : { x: a.x + (op.dx == null ? 90 : op.dx), y: a.y + (op.dy == null ? 0 : op.dy) };
      const h = handSvg();
      h.setAttribute('class', 'g-hand');
      svgL.appendChild(h);
      const dur = op.ms || 1500;
      const t0 = performance.now();
      function step(now) {
        if (!h.isConnected || !stage.isConnected) return;
        const k = Math.min(1, (now - t0) / dur);
        const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        h.setAttribute('transform', `translate(${a.x + (b.x - a.x) * e} ${a.y + (b.y - a.y) * e})`);
        h.style.opacity = k > .85 ? String((1 - k) / .15) : '1';
        if (k < 1) requestAnimationFrame(step); else h.remove();
      }
      requestAnimationFrame(step);
      return h;
    }
    /** A ghost hand that taps in place: 1 ring for click, 2 for double-click. */
    function handTap(node, taps, opt) {
      const op = opt || {};
      const p = pt(node, op.ky);
      const h = handSvg();
      h.setAttribute('transform', `translate(${p.x} ${p.y})`);
      h.setAttribute('class', 'g-hand g-hand-tap');
      svgL.appendChild(h);
      const n = taps || 1;
      for (let i = 0; i < n; i++) {
        ctx.after(i * 380, () => {
          if (!stage.isConnected) return;
          const ring = sv('circle', {
            cx: p.x, cy: p.y, r: 10, fill: 'none', stroke: '#ffd166', 'stroke-width': 5,
            class: 'g-tap', 'vector-effect': 'non-scaling-stroke',
          });
          svgL.appendChild(ring);
          ctx.after(900, () => ring.remove());
          W.audio.click();
        });
      }
      ctx.after(n * 380 + 1100, () => h.remove());
      return h;
    }
    /** A short arrow pointing where to pull/drag. */
    function arrow(node, dir, opt) {
      const op = opt || {};
      const p = pt(node, op.ky, op.kx);
      const len = op.len || 70;
      const dx = dir === 'left' ? -len : dir === 'right' ? len : 0;
      const dy = dir === 'down' ? len : dir === 'up' ? -len : 0;

      g.appendChild(sv('path', { d, stroke: '#ffd166', 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none', 'vector-effect': 'non-scaling-stroke' }));
      const hx = p.x + dx, hy = p.y + dy;
      const ang = Math.atan2(dy, dx);
      const head = `M ${hx} ${hy} L ${hx - 20 * Math.cos(ang - .5)} ${hy - 20 * Math.sin(ang - .5)} L ${hx - 20 * Math.cos(ang + .5)} ${hy - 20 * Math.sin(ang + .5)} Z`;
      g.appendChild(sv('path', { d: head, fill: '#241c14', stroke: '#241c14', 'stroke-width': 6, 'stroke-linejoin': 'round' }));

    function handSvg() {

      g.appendChild(sv('path', {
        d: 'M0 26 L0 -6 a 6 6 0 0 1 12 0 L12 -22 a 5 5 0 0 1 10 0 L22 -6 a 5 5 0 0 1 10 0 L32 -2 a 5 5 0 0 1 10 0 L42 22 q 0 22 -12 22 L8 44 q -8 -8 -8 -18 Z',

    function cable(fromNode, toNode, opt) {

      const b = pt(toNode, op.by == null ? .5 : op.by);

      const g = sv('g', { class: 'g-cable', 'data-cable': op.id || '1' });

      // bright inner stroke
      g.appendChild(sv('path', { d, fill: 'none', stroke: '#f2b24c', 'stroke-width': 7, 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke', class: 'g-cable-in' }));

      [[a, 'g-node-a'], [b, 'g-node-b']].forEach(([p, cls]) => {

        g.appendChild(sv('circle', { cx: p.x, cy: p.y, r: 5, fill: '#ffd166', class: cls + ' g-node-core' }));
      });

      const pulse = sv('circle', { r: 7, fill: '#fff6dd', class: 'g-pulse' });
      g.appendChild(pulse);
      svgL.appendChild(g);
      const probe = sv('path', { d, fill: 'none', stroke: 'none' });
      svgL.appendChild(probe);
      const total = probe.getTotalLength();

     *  later by the instruction it corrected. */
    function step(cfg) {
      // cfg: { sayAr, simplerAr, src, tgt, demo, ms1, ms2 }
      disarm();
      /* Correction (items 1+4): a new step ALWAYS clears the previous guide
       * source, ring, arrow, ghost hand and preview before arming the next
       * target — only the exact current target may glow. */
      clearSource(); clearTarget(); clearPreview();
      stage.querySelectorAll('.g-src, .g-tgt').forEach(n => n.classList.remove('g-src', 'g-tgt'));
      svgL.querySelectorAll('.g-arrow, .g-hand, .g-tap, .g-preview').forEach(n => n.remove());

      if (cfg.sayAr) sayFn(cfg.sayAr);

      if (cfg.tgt) target(cfg.tgt);

       * element the child must touch. Measured with getBoundingClientRect. */
      ctx.after(60, () => clearBlockers(cfg.src, cfg.tgt));
      ctx.after(420, () => clearBlockers(cfg.src, cfg.tgt));

    function clearBlockers() {
      const aims = Array.from(arguments).filter(Boolean);
      if (!aims.length || !stage.isConnected) return 0;
      const boxes = aims.map(a => a.getBoundingClientRect()).filter(r => r.width);
      if (!boxes.length) return 0;
      let removed = 0;
      stage.querySelectorAll('.tag, .term-tag, .label-tag, [data-label]').forEach(lab => {
        if (aims.some(a => lab.contains(a) || a.contains(lab))) return;
        const lr = lab.getBoundingClientRect();
        if (!lr.width) return;
        if (boxes.some(b => W.fixkit.rectsOverlap(lr, b, -2))) { lab.remove(); removed++; }
      });
      return removed;
    }
    function runDemo() {
      if (!lastDemo || !stage.isConnected) return;
      if (lastDemo.src) W.fx.glow(lastDemo.src);
      if (lastDemo.demo) { try { lastDemo.demo(); } catch (e) { /* a hint must never break a lesson */ } }

    /** The child acted: restart the idle countdown. */
    function bump() {
      if (idleT1) { clearTimeout(idleT1); idleT1 = null; }
      if (idleT2) { clearTimeout(idleT2); idleT2 = null; }
      if (lastDemo) step2(lastDemo);
    }
    function step2(cfg) {
      idleT1 = ctx.after(cfg.ms1 || 3000, () => {
        runDemo();
        idleT2 = ctx.after(cfg.ms2 || 4000, () => {

      if (idleT1) { clearTimeout(idleT1); idleT1 = null; }

      const b = el('button.g-help', { dataset: { showMe: '1' }, 'aria-label': 'أرِني ما أفعل' });
      const s = sv('svg', { viewBox: '0 0 40 52', style: 'width:64%;height:64%' });
      s.appendChild(sv('path', { d: 'M14 6 q 6 -6 12 0', fill: 'none', stroke: '#3a2412', 'stroke-width': 3 }));

      s.appendChild(sv('path', { d: 'M8 14 L32 14 L29 44 L11 44 Z', fill: 'rgba(255,225,160,.9)', stroke: '#3a2412', 'stroke-width': 3, 'stroke-linejoin': 'round' }));

        if (lastDemo && lastDemo.tgt) lastDemo.tgt.classList.add('g-tgt');

      });
      layer.appendChild(b);
      return b;
    }

    ctx.onCleanup(() => { disarm(); });

    /* ---------- the stage-transition cleanup contract (Checkpoint 4F) ----------
     * Root cause of the leftover-overlay family of defects: each lesson removed
     * its own temporary art ad hoc, so arrows, threads, dots, hands, highlights
     * and answer cards survived into the next substage and buried the question.
     *
     * clearStage() is the single contract every lesson calls BEFORE mounting a new
     * substage. It severs the previous stage's hint timers, empties the guide's own
     * overlay surface, and removes the temporary classes/nodes that lessons create.
     * Lessons pass `keep` for anything that must survive (e.g. permanent cables). */
    function clearStage(opts) {
      const o = opts || {};
      // 1) stop the previous stage's guidance and its timers
      disarm();
      lastDemo = null;
      // 2) drop selection/destination highlights wherever they were applied
      clearSource(); clearTarget(); clearPreview();
      stage.querySelectorAll('.g-src, .g-tgt').forEach(n => n.classList.remove('g-src', 'g-tgt'));
      stage.querySelectorAll('.dicon.near').forEach(n => n.classList.remove('near'));
      // 3) empty the guide's own SVG surface: arrows, hands, taps, previews,
      //    and any cable the caller has not asked to keep
      [...svgL.childNodes].forEach(n => {
        if (!n.classList) { n.remove(); return; }
        const isCable = n.classList.contains('g-cable');
        if (isCable && o.keepCables) return;

      // 5) hand extra selectors from the lesson: threads, cards, chips, custom art
      (o.remove || []).forEach(sel => stage.querySelectorAll(sel).forEach(n => n.remove()));
      // 6) collapse every expanded label so nothing covers the new stage
      if (!o.keepLabels) stage.querySelectorAll('.obj-label').forEach(n => n.classList.add('ol-mini'));
    }

    return {
      layer, svgL, pt,
      source, clearSource, target, clearTarget,
      preview, clearPreview,
      handDrag, handTap, arrow,
      cable, badges, progress,
      confirm, step, bump, disarm, done, help, runDemo, clearStage, clearBlockers,
      setSay(fn) { sayFn = fn; },
    };
  }

  return { group };
})();

/* ==== engine/scene.js ==== */
/* Scene manager.
 * Teardown safety (binding rule, see RECOVERY_REPORT §4):
 *  - every scene gets an AbortController; ctx.listen() attaches with its signal,
 *    so ALL listeners are severed atomically before DOM removal;
 *  - ctx.every()/ctx.after() timers are cancelled on teardown;
 *  - delegated handlers re-check element.isConnected before acting,
 *    so a click landing mid-teardown can never touch a detached node. */
W.scene = (function () {
  const scenes = {};
  let current = null;   // { id, ctx }
  let stageEl = null;

  function register(id, def) { scenes[id] = def; }

  function makeCtx(root) {
    const ab = new AbortController();
    const timers = new Set();
    const rafs = new Set();
    const cleanups = [];
    return {
      root,
      signal: ab.signal,
      listen(target, type, fn, opts) {
        target.addEventListener(type, function (ev) {
          if (!root.isConnected) return;           // teardown guard
          fn.call(this, ev);
        }, Object.assign({ signal: ab.signal }, opts || {}));
      },
      /** Delegated listener: selector re-queried per event; detached targets no-op. */
      delegate(type, selector, fn, opts) {
        this.listen(root, type, function (ev) {
          const t = ev.target.closest(selector);
          if (t && root.contains(t) && t.isConnected) fn(ev, t);
        }, opts);
      },
      after(ms, fn) { const t = setTimeout(() => { timers.delete(t); if (root.isConnected) fn(); }, ms); timers.add(t); return t; },
      every(ms, fn) { const t = setInterval(() => { if (root.isConnected) fn(); }, ms); timers.add(t); return t; },
      /** timer(fn, ms): teardown-safe one-shot; fn-first for call-site ergonomics. */
      timer(fn, ms) { const t = setTimeout(() => { timers.delete(t); if (root.isConnected) fn(); }, ms); timers.add(t); return t; },
      /** raf(fn): teardown-safe requestAnimationFrame. */
      raf(fn) { const id = requestAnimationFrame(() => { if (root.isConnected) fn(); }); rafs.add(id); return id; },
      onCleanup(fn) { cleanups.push(fn); },
      _teardown() {
        ab.abort();
        timers.forEach(t => { clearTimeout(t); clearInterval(t); });
        timers.clear();
        rafs.forEach(id => cancelAnimationFrame(id));
        rafs.clear();
        cleanups.forEach(fn => { try { fn(); } catch (e) { /* cleanup must never throw */ } });
      },
    };
  }

  function go(id, params) {
    const def = scenes[id];
    if (!def) { console.error('unknown scene', id); return; }
    if (current) {
      current.ctx._teardown();                 // 1) sever all listeners & timers
      if (current.def.unmount) { try { current.def.unmount(current.ctx); } catch (e) { console.error(e); } }
      current.ctx.root.remove();               // 2) only then remove the DOM
    }
    const root = W.util.el('div.scene', { dataset: { scene: id } });
    stageEl.appendChild(root);
    const ctx = makeCtx(root);
    ctx.params = params || {};
    current = { id, def, ctx };
    def.mount(ctx);
    return ctx;
  }

  return {
    register, go,
    get currentId() { return current && current.id; },
    init(el) { stageEl = el; },
    get stage() { return stageEl; },
  };
})();

     * glass, measured against the room's own SVG. */
    if (opt.pos && opt.pos.svg && opt.stage) {
      const svgEl = W.util.roomSvg(opt.stage);
      if (svgEl) W.util.pinOverlayToSvgRect(opt.ctx, svgEl, root, opt.pos.svg);
    }
    root.appendChild(el('div.dsk-wall'));
    const wp = sv('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;opacity:.5' });

    bar.appendChild(start);
    root.appendChild(bar);

    const icons = {};
    function addIcon(id, label, kind, x, y, extra) {
      const b = el('button.dicon', {
        dataset: Object.assign({ icon: id }, (extra && extra.dataset) || {}),
        'aria-label': label, style: `left:${x}%;top:${y}%` + ((extra && extra.style) || ''),
      });
      const art = el('div.dart');
      art.appendChild(iconArt(kind));
      b.appendChild(art);
      b.appendChild(el('span.icon-ar', { text: label }));
      root.appendChild(b);
      icons[id] = b;
      return b;
    }
    return { root, bar, start, icons, addIcon };
  }

  /* ---------------- an application window ---------------- */
  function appWindow(o) {
    const opt = o || {};
    const NORMAL = opt.normal || 'left:10%;top:6%;width:80%;height:76%';
    const win = el('div.npwin', { dataset: Object.assign({ appwin: '1' }, opt.dataset || {}), style: NORMAL });
    const ttl = el('div.ttl');
    ttl.appendChild(el('span.tname', { text: opt.title || 'تطبيق' }));
    const btns = {};
    (opt.buttons || ['min', 'max', 'close']).forEach(k => {
      const glyph = k === 'min' ? '–' : k === 'max' ? '▢' : '✕';
      const aria = k === 'min' ? 'تصغير' : k === 'max' ? 'تكبير' : 'إغلاق';
      const b = el('button.winbtn' + (k === 'close' ? '.close' : ''), { text: glyph, 'aria-label': aria, dataset: { win: k, action: 'win-' + k } });
      ttl.appendChild(b);
      btns[k] = b;
    });
    win.appendChild(ttl);
    const body = el('div', { style: 'flex:1;position:relative;overflow:hidden;background:#fdfaf2' });
    win.appendChild(body);
    let maxed = false;
    return {
      root: win, body, ttl, btns,
      get maxed() { return maxed; },
      setMax(v) { maxed = v; win.style.cssText = 'position:absolute;z-index:30;' + (v ? 'inset:0 0 14% 0' : NORMAL); },
      close() { win.remove(); },
    };
  }

  /** Reveal the English term directly below an icon's own Arabic name. */
  function bilingual(iconBtn, en) {
    if (!iconBtn || iconBtn.querySelector('.icon-en')) { if (iconBtn) W.fx.glow(iconBtn); return; }
    iconBtn.appendChild(el('span.icon-en', { text: en }));
    W.fx.glow(iconBtn);
  }

  return { iconArt, deskScreen, appWindow, bilingual, ART_KINDS: Object.keys(A) };
})();

  /* ---------------- the fictional browser ---------------- */
  function browser(ctx, o) {
    const root = el('div.webapp', { dataset: { webapp: '1' }, style: `left:${o.pos.x}%;top:${o.pos.y}%;width:${o.pos.w}%;height:${o.pos.h}%` });
    const tabsRow = el('div.wb-tabs');
    const addTabBtn = el('button.wb-newtab', { text: '+', 'aria-label': 'علامة تبويب جديدة', dataset: { newtab: '1' } });
    tabsRow.appendChild(addTabBtn);
    const addrRow = el('div.wb-addr');
    const lock = el('span.wb-lock', { text: '🔒' });
    const addrField = el('div.wb-url', { dataset: { url: '1' } });
    const goBtn = el('button.wb-go', { text: '⏎ اذهب', 'aria-label': 'اذهب — Enter', dataset: { go: '1' } });
    /* item 13 (3.2): a real Back button and a Home button */
    const backBtn = el('button.wb-back', { text: '◀ رجوع', 'aria-label': 'رجوع — Back', dataset: { back: '1' } });
    const homeBtn = el('button.wb-home', { text: '⌂ الرئيسية', 'aria-label': 'الصفحة الرئيسية — Home', dataset: { home: '1' } });
    addrRow.appendChild(goBtn); addrRow.appendChild(addrField); addrRow.appendChild(lock);
    addrRow.appendChild(homeBtn); addrRow.appendChild(backBtn);
    const view = el('div.wb-view');
    const pageWrap = el('div.wb-pagewrap');
    const sb = el('div.wb-scrollbar');
    const thumb = el('button.wb-thumb', { 'aria-label': 'شريط التمرير — اسحبه' });
    sb.appendChild(thumb);
    view.appendChild(pageWrap); view.appendChild(sb);
    root.appendChild(tabsRow); root.appendChild(addrRow); root.appendChild(view);
    (o.host || ctx.root).appendChild(root);

    const tabs = [];
    let active = -1;
    function addTab(title) {
      const t = el('button.wb-tab', { dataset: { tab: String(tabs.length) } });
      t.appendChild(el('span.wb-fav'));
      t.appendChild(el('span.wb-title', { text: title || 'صفحة جديدة' }));
      tabsRow.insertBefore(t, addTabBtn);
      const tab = { el: t, title: title || 'صفحة جديدة', content: null, scroll: 0, url: '' };
      tabs.push(tab);
      ctx.listen(t, 'click', () => activate(tabs.indexOf(tab)));
      return tab;
    }
    function activate(i) {
      if (i === active || !tabs[i]) return;
      if (tabs[active]) { tabs[active].scroll = scrollPos; tabs[active].el.classList.remove('on'); }
      active = i;
      tabs[i].el.classList.add('on');
      pageWrap.innerHTML = '';
      if (tabs[i].content) pageWrap.appendChild(tabs[i].content);
      addrField.textContent = tabs[i].url || '';
      setScroll(tabs[i].scroll || 0, true);
      if (api.onTab) api.onTab(i, tabs[i]);
    }

    /* ===== R2 · REAL ADDRESS TYPING (items 1 + 6) =================
     * One click focuses the bar. After that every character comes from the
     * keyboard exactly as pressed: a wrong letter is visible, Backspace
     * deletes it, and «اذهب» only works once the address matches. */
    let target = '', typed = '', armed = false, focused = false, addrErr = false;
    const addrMatch = W.fixkit.matcher('');
    function renderAddr() {
      addrField.innerHTML = '';
      const j = addrMatch.check(typed);
      const sp = el('span.wb-typed', { text: typed });
      if (armed && !j.ok) sp.classList.add('wrong');
      addrField.appendChild(sp);
      if (armed && focused && j.ok && typed.length < target.length) {
        addrField.appendChild(el('span.wb-ghost', { text: target.slice(typed.length) }));
      }
      if (armed && focused) addrField.appendChild(el('span.caret'));
      addrField.classList.toggle('focused', armed && focused);
      goBtn.classList.toggle('hl', armed && j.complete);
    }
    function evalAddr() {
      const j = addrMatch.check(typed);
      if (!j.ok && !addrErr) {
        addrErr = true;
        W.fx.softHint(addrField);
        if (api.onAddrMistake) api.onAddrMistake();
      } else if (j.ok && addrErr) {
        addrErr = false;
        if (api.onAddrRecovered) api.onAddrRecovered();
      }
      if (j.complete && api.onAddrFull) api.onAddrFull();
    }
    ctx.listen(addrField, 'click', () => {
      if (armed && !focused) { focused = true; renderAddr(); W.audio.click(); if (api.onAddrFocus) api.onAddrFocus(); }
      if (api.onAddrTap) api.onAddrTap();
    });
    ctx.listen(window, 'keydown', ev => {
      if (!root.isConnected || !armed || !focused) return;
      if (ev.key === 'Enter') { ev.preventDefault(); commitGo(); return; }
      if (ev.key === 'Backspace') { ev.preventDefault(); typed = typed.slice(0, -1); W.audio.key(); renderAddr(); evalAddr(); return; }
      if (ev.key.length === 1) {
        ev.preventDefault();
        typed += ev.key;                       // exactly what was pressed
        W.audio.key(); renderAddr(); evalAddr();
      }
    });
    ctx.listen(goBtn, 'click', commitGo);
    function commitGo() {
      const j = addrMatch.check(typed);
      if (!armed || !j.complete) {
        if (armed) { W.fx.softHint(addrField); if (api.onAddrIncomplete) api.onAddrIncomplete(); }
        return;
      }
      armed = false; focused = false; addrErr = false; renderAddr();
      if (api.onGo) api.onGo(target);
    }
    /* on-screen typing support for tablets: type one real character */
    function addrKey(ch) {
      if (!armed) return;
      focused = true;
      if (ch === 'Backspace') typed = typed.slice(0, -1); else typed += ch;
      W.audio.key(); renderAddr(); evalAddr();
    }

    /* the custom scrollbar: hold the left button and drag */
    let scrollPos = 0, contentH = 0, dragY = null;
    function setScroll(p, silent) {
      const viewH = view.clientHeight || 1;
      const max = Math.max(0, contentH - viewH);
      scrollPos = W.util.clamp(p, 0, max);
      pageWrap.style.transform = `translateY(${-scrollPos}px)`;
      const track = sb.clientHeight - thumb.offsetHeight;
      thumb.style.top = (max ? scrollPos / max * track : 0) + 'px';
      if (!silent && api.onScroll) api.onScroll(scrollPos, max);
    }
    ctx.listen(thumb, 'pointerdown', ev => { ev.preventDefault(); thumb.setPointerCapture(ev.pointerId); dragY = ev.clientY; thumb.classList.add('grab'); });
    ctx.listen(thumb, 'pointermove', ev => {
      if (dragY === null) return;
      const viewH = view.clientHeight, max = Math.max(0, contentH - viewH);
      const track = sb.clientHeight - thumb.offsetHeight;
      if (track > 0) setScroll(scrollPos + (ev.clientY - dragY) / track * max);
      dragY = ev.clientY;
    });
    ctx.listen(thumb, 'pointerup', () => { dragY = null; thumb.classList.remove('grab'); });
    ctx.listen(view, 'wheel', ev => { ev.preventDefault(); setScroll(scrollPos + ev.deltaY); });

    const api = {
      root, tabs, addTab, activate, view, pageWrap, thumb, goBtn, addrField, backBtn, homeBtn,
      armAddress(url) { target = url; addrMatch.set(url); typed = ''; armed = true; focused = false; addrErr = false; renderAddr(); },
      setAddress(url) { target = url; addrMatch.set(url); typed = url; armed = false; focused = false; addrErr = false; if (tabs[active]) tabs[active].url = url; renderAddr(); addrField.textContent = url; },
      addrKey,
      get addrTyped() { return typed; },
      get addrArmed() { return armed; },
      get addrFocused() { return focused; },
      setContent(node, h) {
        /* item 13: keep a per-tab history so Back can really go back */
        const tab = tabs[active];
        if (tab) {
          tab.hist = tab.hist || [];
          if (tab.content && tab.content !== node) tab.hist.push({ node: tab.content, h: tab.h || contentH, url: tab.url || '' });
          if (tab.hist.length > 12) tab.hist.shift();
          tab.h = h;
        }
        contentH = h;
        pageWrap.style.height = h + 'px';
        if (tabs[active]) { tabs[active].content = node; tabs[active].url = typed || target; }
        pageWrap.innerHTML = ''; pageWrap.appendChild(node);
        setScroll(0, true);
        const viewH = view.clientHeight || 1;
        sb.style.display = h > viewH + 4 ? '' : 'none';
        thumb.style.height = Math.max(18, viewH / h * (sb.clientHeight || viewH)) + 'px';
      },
      /* R2: re-measure the page after its content grows (e.g. the letter strip) */
      refreshHeight(h) {
        const tab = tabs[active];
        contentH = h; if (tab) tab.h = h;
        pageWrap.style.height = h + 'px';
        const viewH = view.clientHeight || 1;
        sb.style.display = h > viewH + 4 ? '' : 'none';
        thumb.style.height = Math.max(18, viewH / h * (sb.clientHeight || viewH)) + 'px';
      },
      goBack() {
        const tab = tabs[active];
        if (!tab || !tab.hist || !tab.hist.length) { W.fx.softHint(backBtn); return false; }
        /* an armed address exercise survives navigation (a child may explore
         * Back/Home mid-lesson; the typing task must stay available) */
        const wasArmed = armed, keepTarget = target, keepTyped = typed, keepFocus = focused;
        const prev = tab.hist.pop();
        contentH = prev.h; tab.h = prev.h;
        pageWrap.style.height = prev.h + 'px';
        tab.content = prev.node; tab.url = prev.url;
        pageWrap.innerHTML = ''; pageWrap.appendChild(prev.node);
        if (wasArmed) { armed = true; target = keepTarget; addrMatch.set(keepTarget); typed = keepTyped; focused = keepFocus; renderAddr(); }
        else { armed = false; focused = false; typed = prev.url; target = prev.url; addrField.textContent = prev.url || ''; }
        setScroll(0, true);
        const viewH = view.clientHeight || 1;
        sb.style.display = prev.h > viewH + 4 ? '' : 'none';
        thumb.style.height = Math.max(18, viewH / prev.h * (sb.clientHeight || viewH)) + 'px';
        W.audio.click();
        if (api.onBack) api.onBack();
        return true;
      },
      goHome() {
        W.audio.click();
        if (api.onHome) { api.onHome(); return; }
        const wasArmed = armed, keepTarget = target, keepTyped = typed, keepFocus = focused;
        const home = W.net.searchHome({ keywords: [] });
        api.setContent(home.node, home.h);
        if (wasArmed) { armed = true; target = keepTarget; addrMatch.set(keepTarget); typed = keepTyped; focused = keepFocus; renderAddr(); }
        else api.setAddress('');
      },
      get scroll() { return scrollPos; },
      get maxScroll() { return Math.max(0, contentH - (view.clientHeight || 1)); },
      setScroll,
      newTabBtn: addTabBtn,
    };
    ctx.listen(addTabBtn, 'click', () => { if (api.onNewTab) api.onNewTab(); });
    ctx.listen(backBtn, 'click', () => api.goBack());
    ctx.listen(homeBtn, 'click', () => api.goHome());
    /* CLOSURE (5): the browser window is projected onto the real glass */
    if (o.pos && o.pos.svg && (o.stage || o.host)) {
      const svgEl = W.util.roomSvg(o.stage || o.host);
      if (svgEl) W.util.pinOverlayToSvgRect(ctx, svgEl, root, o.pos.svg);
    }
    return api;
  }

    return { node: page, h: 430, q, btn, chips, box };

  function resultsPage(queryAr, results) {

    page.appendChild(el('div.wb-h2', { text: 'نتائج البحث عن: ' + queryAr }));
    results.forEach(r => {

        it.appendChild(th);

       * address in a smaller line. */

    return { node: page, h: 230 + results.length * 160 };
  }

  /* ---------------- the fictional mail app ---------------- */
  function mail(ctx, o) {
    const root = el('div.mailapp', { dataset: { mailapp: '1' }, style: `left:${o.pos.x}%;top:${o.pos.y}%;width:${o.pos.w}%;height:${o.pos.h}%` });
    const head = el('div.ma-head');
    head.appendChild(el('span.ma-title', { text: 'بريد الواحة — Email' }));
    root.appendChild(head);
    /* item 13 (3.3): a real folder shell — الوارد Inbox · إنشاء Compose ·
     * المرسل Sent. Sending visibly places the message in Sent. */
    const shell = el('div.ma-shell');
    const side = el('div.ma-side');
    const main = el('div.ma-main');
    shell.appendChild(side); shell.appendChild(main);
    root.appendChild(shell);
    const body = el('div.ma-body');
    main.appendChild(body);

    const folders = {};
    function fbtn(id, ar, en, ic) {
      const b = el('button.ma-fbtn', { dataset: { folder: id }, 'aria-label': ar + ' — ' + en });
      b.appendChild(el('span', { text: ic + ' ' + ar }));
      b.appendChild(el('span.fen', { text: en }));
      side.appendChild(b);
      folders[id] = b;
      ctx.listen(b, 'click', () => { W.audio.click(); show(id); });
      return b;
    }
    fbtn('compose', 'إنشاء', 'Compose', '✎');
    fbtn('inbox', 'الوارد', 'Inbox', '📥');
    fbtn('sent', 'المرسل', 'Sent', '📤');

    const inboxMsgs = [];
    const sentMsgs = [];
    let cur = 'compose';
    function badge(id, n) {
      const b = folders[id];
      let bd = b.querySelector('.fbadge');
      if (!n) { if (bd) bd.remove(); return; }
      if (!bd) { bd = el('span.fbadge'); b.appendChild(bd); }
      bd.textContent = '٠١٢٣٤٥٦٧٨٩'[n] || String(n);
    }
    function msgRow(m, sent) {
      const r = el('div.ma-msgrow', { dataset: { msg: '1' } });
      r.appendChild(el('span', { text: sent ? ('إلى: ' + m.to) : ('من: ' + m.from) }));
      r.appendChild(el('span', { text: '— ' + (m.subject || ''), style: 'color:#5B4630' }));
      if (m.attach) r.appendChild(el('span', { text: '📎' }));
      if (sent) r.appendChild(el('span.sentok', { text: '✓ تم الإرسال — Sent' }));

    function renderList(list, sent, emptyAr) {
      body.innerHTML = '';
      if (!list.length) { body.appendChild(el('div', { text: emptyAr, style: 'font-weight:700;color:#5B4630;font-size:calc(var(--su)*15);padding:calc(var(--su)*10)' })); return; }
      list.forEach(m => {

    }
    function show(id) {
      cur = id;
      Object.keys(folders).forEach(k => folders[k].classList.toggle('on', k === id));
      if (id === 'sent') { renderList(sentMsgs, true, 'لا رسائل مُرسلة بعد.'); badge('sent', 0); }
      else if (id === 'inbox') { renderList(inboxMsgs, false, 'لا رسائل واردة بعد.'); badge('inbox', 0); }
      else if (api.onCompose) api.onCompose();
      if (api.onFolder) api.onFolder(id);
    }
    function clear() { body.innerHTML = ''; }
    const api = {
      root, head, body, clear, folders, show,
      addSent(m) { sentMsgs.push(m); badge('sent', sentMsgs.length); },
      addInbox(m) { inboxMsgs.push(m); badge('inbox', inboxMsgs.length); },
      showSent() { show('sent'); },
      showInbox() { show('inbox'); },
      get folder() { return cur; },
    };
    show('compose');
    (o.host || ctx.root).appendChild(root);
    /* CLOSURE (5): the mail window is projected onto the real monitor glass */
    if (o.pos && o.pos.svg && (o.stage || o.host)) {
      const svgEl = W.util.roomSvg(o.stage || o.host);
      if (svgEl) W.util.pinOverlayToSvgRect(ctx, svgEl, root, o.pos.svg);
    }
    return api;
  }

  return { browser, mail, museumPage, animalsPage, searchHome, resultsPage, mediaCard, art };
})();

/* ==== world/typing.js ==== */
/* Shared typing kit — a big illustrated Arabic keyboard whose keys respond to the
 * child's REAL keys, plus a caret text field and a gentle guided-sequence engine.
 * The child always performs the keystroke; the guide only lights the next key.
 * Used by Lesson 1.6 (quest), 3.3 (mail) and 3.4 (search). Lesson 1.4 keeps its own. */
W.typing = (function () {
  const { el } = W.util;
  const AD = '٠١٢٣٤٥٦٧٨٩';
  const ROWS = [
    ['١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '٠'],
    ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج'],
    ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ة'],
    ['ر', 'و', 'ز', 'د', 'ط', { k: 'Backspace', t: 'Backspace', cls: 'back' }, { k: 'Enter', t: 'Enter', cls: 'enter' }],
    [{ k: 'ArrowRight', t: '→', cls: 'arrow' }, { k: ' ', t: 'Space', cls: 'space' }, { k: 'ArrowLeft', t: '←', cls: 'arrow' }],
  ];

  /* text field with a blinking caret */
  function field(node) {
    let buf = '', caret = 0;
    const cursor = el('span.caret');
    function render() {
      node.innerHTML = '';
      node.appendChild(document.createTextNode(buf.slice(0, caret)));
      node.appendChild(cursor);
      node.appendChild(document.createTextNode(buf.slice(caret)));
    }
    render();
    return {
      get value() { return buf; },
      get caret() { return caret; },
      set(v) { buf = v; caret = v.length; render(); },
      type(ch) { buf = buf.slice(0, caret) + ch + buf.slice(caret); caret++; render(); },
      back() { if (caret > 0) { buf = buf.slice(0, caret - 1) + buf.slice(caret); caret--; render(); return true; } return false; },
      move(d) { caret = W.util.clamp(caret + d, 0, buf.length); render(); },
      atEnd() { return caret === buf.length; },
      render,
    };
  }

  /* the board: builds keys, mirrors physical keys, runs guided sequences */
  function make(ctx, o) {
    const opt = o || {};
    const fld = field(opt.text);
    const keys = {};
    const kb = el('div.kb', { dataset: { kb: '1' }, style: `left:${opt.pos.x}%;top:${opt.pos.y}%;width:${opt.pos.w}%` });
    ROWS.forEach(row => {
      const r = el('div.kb-row');
      row.forEach(def => {
        const k = typeof def === 'string' ? { k: def, t: def, cls: '' } : def;
        const b = el('button.kb-key' + (k.cls ? '.' + k.cls : ''), { text: k.t, dataset: { key: k.k } });
        W.fixkit.decorateKey(b, k.k);   // Arabic prominent + EN physical label (item 7)
        ctx.listen(b, 'click', () => { flash(b); press(k.k); });
        r.appendChild(b);
        keys[k.k] = b;
      });
      kb.appendChild(r);
    });
    (opt.host || document.body).appendChild(kb);
    if (opt.stage) W.fixkit.fitKeyboard(ctx, kb, opt.stage, opt.fit);   // item 10: never clipped

    /* R3 item 2: the child must SEE which key was pressed — the lit state
     * lasts ~600 ms, the key sinks a little, and a wrong key lights red. */
    const pressT = new Map();
    function flash(b, wrong) {
      if (!b) return;
      const cls = wrong ? 'wrongpress' : 'pressed';
      b.classList.add(cls);
      if (pressT.has(b)) clearTimeout(pressT.get(b));
      pressT.set(b, ctx.after(600, () => { b.classList.remove('pressed'); b.classList.remove('wrongpress'); pressT.delete(b); }));
    }
    function holdKey(b) { if (b) b.classList.add('pressed'); }
    function releaseKey(b) { if (b) flash(b); }

    /* ===== R2 · REAL TYPING =====================================
     * The character that reaches the paper is ALWAYS the character the
     * pupil pressed. Nothing is substituted, auto-corrected or completed.
     * A guided word is only a target to compare against: a wrong letter
     * stays on screen, the step does not advance, and Backspace removes it.
     * ============================================================ */
    let target = '', base = '', match = W.fixkit.matcher(''), seqDone = null;
    let stray = false, handlers = {}, errActive = false;
    /* the part of the buffer that belongs to the current guided word */
    function typedPart() { return fld.value.slice(base.length); }
    function judge() { return match.check(typedPart()); }
    function highlight() {
      Object.values(keys).forEach(b => b.classList.remove('hl'));
      if (!target) return;
      const j = judge();
      if (!j.ok) return;                       // no hint while a mistake stands
      const n = j.next;
      if (n && keys[n]) keys[n].classList.add('hl');
    }
    function evaluate() {
      if (!target) return;
      const j = judge();
      if (j.ok) {
        if (errActive) {
          errActive = false;
          if (stray) {
            stray = false;
            W.fx.sparkleAt(ctx.root, opt.text, 5);
            if (handlers.fixed) handlers.fixed(fld);
          } else if (handlers.recovered) handlers.recovered(fld);
        }
        highlight();
        if (j.complete && seqDone) { const d = seqDone; seqDone = null; d(fld); }
      } else {
        highlight();
        if (!errActive) {
          errActive = true;
          W.fx.softHint(opt.text);
          if (handlers.mistake) handlers.mistake(j.next, fld);
          else if (opt.say) opt.say('راجع الحرف، ثم استخدم Backspace لتصحيحه.');
        }
      }
    }
    function press(k) {
      if (k === 'Backspace') {
        fld.back();
        evaluate();
        return;
      }
      if (k === 'Enter' || k === 'ArrowLeft' || k === 'ArrowRight') {
        if (k !== 'Enter') fld.move(k === 'ArrowLeft' ? -1 : 1);
        if (handlers[k]) handlers[k](fld);
        else if (k === 'Enter') { fld.type('\n'); evaluate(); }
        return;
      }
      if (k.startsWith('DIGIT:')) {
        fld.type(k.slice(6));                  // the digit actually pressed
        if (handlers.digit) handlers.digit(fld);
        evaluate();
        return;
      }
      // ordinary character (letter, space, punctuation) — inserted verbatim
      const expected = target ? judge().next : null;
      fld.type(k);
      W.audio.note(520 + Math.random() * 120, .12);
      if (keys[k]) flash(keys[k], !!(target && expected && k !== expected));
      evaluate();
    }

    ctx.listen(window, 'keydown', ev => {
      if (!kb.isConnected) return;
      const k = ev.key;
      if (k === ' ' || k === 'Enter' || k === 'Backspace' || k.startsWith('Arrow')) {
        ev.preventDefault();
        holdKey(keys[k === 'ArrowUp' || k === 'ArrowDown' ? 'ArrowLeft' : k]);
        press(k);
      } else if (k.length === 1 && /\S/.test(k)) {
        ev.preventDefault();
        if (/\d/.test(k)) { flash(keys[AD['1234567890'.indexOf(k)] || '١']); press('DIGIT:' + k); return; }
        /* the key the pupil pressed — never the letter the lesson expects */
        const ch = W.fixkit.pressedChar(ev, W.fixkit.isArabic(target) || !target);
        const vis = W.fixkit.visualKeyFor(ev, keys) || keys[ch];
        holdKey(vis);                                  // stays lit while held
        press(ch);
      }
    });

    ctx.listen(window, 'keyup', ev => {
      if (!kb.isConnected) return;
      const vis = W.fixkit.visualKeyFor(ev, keys) || keys[ev.key] ||
                  keys[W.fixkit.pressedChar(ev, true) || ''] ||
                  (ev.key === ' ' ? keys[' '] : null) || keys[ev.key];
      releaseKey(vis);
      /* the light restarts on release so the child sees the full ~600 ms,
       * whether the key was the right one or the wrong one */
      Object.values(keys).forEach(b => {
        if (b.classList.contains('wrongpress')) flash(b, true);
        else if (b.classList.contains('pressed')) releaseKey(b);
      });
    });

    return {
      kb, keys, field: fld,
      seq(word, done) {
        base = fld.value; target = word; match.set(word); seqDone = done;
        errActive = false; highlight();
      },
      clearSeq() { base = fld.value; target = ''; match.set(''); seqDone = null; errActive = false; highlight(); },
      plant(ch) { fld.type(ch); stray = true; evaluate(); },
      get hasStray() { return stray; },
      get done() { return !target || judge().complete; },
      get typed() { return typedPart(); },
      matches(t) { return W.fixkit.sameText(typedPart(), t); },
      on(k, fn) { handlers[k] = fn; },
      remove() { kb.remove(); },
    };
  }

  return { make, field, ROWS };
})();

/* ==== world/paint.js ==== */
/* W.paint — the Creativity Studio engine. A real drawing surface: shape tools with
 * live preview, scanline flood fill, eraser, brush, undo/redo, local save/open.
 * Everything happens on a local <canvas>; nothing leaves the device. */
W.paint = (function () {
  const { el, sv } = W.util;
  const CW = 960, CH = 620;

  function make(ctx, o) {
    const wrap = el('div.paint-wrap', { dataset: { paint: '1' }, style: `left:${o.pos.x}%;top:${o.pos.y}%;width:${o.pos.w}%;height:${o.pos.h}%` });
    const canvas = el('canvas', { width: CW, height: CH, class: 'paint-main' });
    const overlay = el('canvas', { width: CW, height: CH, class: 'paint-over', style: 'touch-action:none' });
    wrap.appendChild(canvas); wrap.appendChild(overlay);
    /* item 11: a visible circular eraser cursor that follows the pointer */
    const eCursor = el('div.eraser-cursor', { dataset: { eraserCursor: '1' } });
    wrap.appendChild(eCursor);
    const ERASER_R = () => Math.max(64, st.size * 5);   // R2: a first-grade-sized eraser (canvas px)
    function moveECursor(ev) {
      if (st.tool !== 'eraser') { eCursor.style.display = 'none'; return; }
      const r = canvas.getBoundingClientRect();
      const d = ERASER_R() * (r.width / CW);
      eCursor.style.display = 'block';
      eCursor.style.width = d + 'px'; eCursor.style.height = d + 'px';
      eCursor.style.left = (ev.clientX - r.left) + 'px';
      eCursor.style.top = (ev.clientY - r.top) + 'px';
    }
    (o.host || ctx.root).appendChild(wrap);

    /* EDGE-TO-EDGE: the stage may now be any aspect, so the drawing surface
     * is fitted in real pixels to keep the 960:620 design proportion exactly.
     * A circle stays a circle, and because the element box itself stays
     * proportional every pointer coordinate keeps mapping 1:1. */
    function fitCanvas() {
      if (!wrap.isConnected) return;
      const host = wrap.offsetParent || wrap.parentElement;
      if (!host) return;
      const hr = host.getBoundingClientRect();
      if (!hr.width || !hr.height) return;
      let boxW = hr.width * (o.pos.w / 100);
      const boxH = hr.height * (o.pos.h / 100);
      let boxX = hr.width * (o.pos.x / 100);
      /* CLASSROOM CLOSURE (5): the tool palette owns a reserved column on the
       * inline-end side; the drawing surface never runs underneath it. One
       * shared calculation for every Unit-2 activity. On phones the palette
       * becomes the approved bottom strip, so no reserve is taken. */
      const palette = host.querySelector('.pbar-wrap');
      const phoneStrip = window.matchMedia('(max-width: 932px)').matches;
      if (palette && !phoneStrip) {
        const pr = palette.getBoundingClientRect();
        const gap = Math.max(18, hr.width * 0.02);
        const reserved = (hr.right - pr.left) + gap;          // palette + gap
        const avail = hr.width - reserved - Math.max(12, hr.width * 0.02);
        if (avail > 120 && boxX + boxW > hr.width - reserved) {
          boxW = Math.min(boxW, avail);
          boxX = Math.max(hr.width * 0.02, Math.min(boxX, hr.width - reserved - boxW));
        }
      }
      const k = Math.min(boxW / CW, boxH / CH);
      const w = CW * k, h = CH * k;
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      const cx = boxX + boxW / 2;
      const cy = hr.height * (o.pos.y / 100) + boxH / 2;
      wrap.style.left = (cx - w / 2) + 'px';
      wrap.style.top = (cy - h / 2) + 'px';
      wrap.style.insetInlineStart = 'auto';
    }
    ctx.after(60, fitCanvas);
    ctx.after(360, fitCanvas);
    ctx.after(900, fitCanvas);
    ctx.listen(window, 'resize', fitCanvas);
    const g = canvas.getContext('2d', { willReadFrequently: true });
    const og = overlay.getContext('2d');
    g.fillStyle = o.bg || '#fdfaf2';
    g.fillRect(0, 0, CW, CH);
    g.lineJoin = g.lineCap = 'round';

    const st = { tool: 'shape', shape: 'circle', color: '#e2574c', size: 8, fillMode: false };
    const undoS = [], redoS = [];
    const handlers = {};
    const on = (k, fn) => { handlers[k] = fn; };
    const emit = (k, d) => { if (handlers[k]) handlers[k](d); };

    function snap() { undoS.push(g.getImageData(0, 0, CW, CH)); if (undoS.length > 24) undoS.shift(); redoS.length = 0; emit('stacks'); }
    function undo() { if (!undoS.length) return false; redoS.push(g.getImageData(0, 0, CW, CH)); g.putImageData(undoS.pop(), 0, 0); emit('stacks'); emit('change'); return true; }
    function redo() { if (!redoS.length) return false; undoS.push(g.getImageData(0, 0, CW, CH)); g.putImageData(redoS.pop(), 0, 0); emit('stacks'); emit('change'); return true; }

    function pt(ev) {
      const r = canvas.getBoundingClientRect();
      return { x: (ev.clientX - r.left) / r.width * CW, y: (ev.clientY - r.top) / r.height * CH };
    }
    function shapePath(c, a, b, kind) {
      const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
      c.beginPath();
      if (kind === 'rect') c.rect(x0, y0, w, h);
      else if (kind === 'circle') c.ellipse(x0 + w / 2, y0 + h / 2, Math.max(2, w / 2), Math.max(2, h / 2), 0, 0, Math.PI * 2);
      else if (kind === 'tri') { c.moveTo(x0 + w / 2, y0); c.lineTo(x0 + w, y0 + h); c.lineTo(x0, y0 + h); c.closePath(); }
      else { c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); }
      return { x: x0, y: y0, w, h };
    }
    function paintShape(c, a, b) {
      c.lineWidth = st.size; c.strokeStyle = st.color; c.fillStyle = st.color;
      const bb = shapePath(c, a, b, st.shape);
      if (st.fillMode && st.shape !== 'line') { c.fill(); c.stroke(); } else c.stroke();
      return bb;
    }

    /* scanline flood fill with small tolerance */
    function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
    function flood(x, y, hex) {
      x = Math.round(x); y = Math.round(y);
      const img = g.getImageData(0, 0, CW, CH), d = img.data;
      const i0 = (y * CW + x) * 4;
      const t = [d[i0], d[i0 + 1], d[i0 + 2]];
      const nc = hexRGB(hex);
      const close = i => Math.abs(d[i] - t[0]) + Math.abs(d[i + 1] - t[1]) + Math.abs(d[i + 2] - t[2]) < 42;
      if (Math.abs(t[0] - nc[0]) + Math.abs(t[1] - nc[1]) + Math.abs(t[2] - nc[2]) < 12) return 0;
      const stack = [[x, y]];
      let painted = 0;
      while (stack.length) {
        let [cx, cy] = stack.pop();
        let i = (cy * CW + cx) * 4;
        while (cx >= 0 && close(i)) { cx--; i -= 4; }
        cx++; i += 4;
        let up = false, dn = false;
        while (cx < CW && close(i)) {
          d[i] = nc[0]; d[i + 1] = nc[1]; d[i + 2] = nc[2]; d[i + 3] = 255; painted++;
          if (cy > 0) { const ai = i - CW * 4; if (close(ai)) { if (!up) { stack.push([cx, cy - 1]); up = true; } } else up = false; }
          if (cy < CH - 1) { const bi = i + CW * 4; if (close(bi)) { if (!dn) { stack.push([cx, cy + 1]); dn = true; } } else dn = false; }
          cx++; i += 4;
        }
      }
      g.putImageData(img, 0, 0);
      return painted;
    }

    let down = null, strokePts = 0;
    ctx.listen(overlay, 'pointerdown', ev => {
      ev.preventDefault(); overlay.setPointerCapture(ev.pointerId);
      const p = pt(ev);
      if (st.tool === 'fill') {
        snap();
        const n = flood(p.x, p.y, st.color);
        emit('change');
        emit('commit', { tool: 'fill', color: st.color, at: p, painted: n });
        undoS.length && n === 0 && undoS.pop(); // nothing changed → drop the snapshot
        return;
      }
      down = p; strokePts = 0;
      /* R2 item 2: capture the pointer so a fast or touch drag never loses
       * its stroke half-way — the eraser must keep erasing until pointerup. */
      try { overlay.setPointerCapture(ev.pointerId); } catch (e) { /* older engines */ }
      if (st.tool === 'brush' || st.tool === 'eraser') {
        snap();
        g.globalCompositeOperation = 'source-over';
        g.lineJoin = g.lineCap = 'round';
        g.lineWidth = st.tool === 'eraser' ? ERASER_R() : st.size;
        g.strokeStyle = st.tool === 'eraser' ? (o.bg || '#fdfaf2') : st.color;
        g.beginPath(); g.moveTo(p.x, p.y);
        if (st.tool === 'eraser') {
          // erasing begins on pointerdown: a visible first dab at the touch point
          g.lineTo(p.x + 0.01, p.y + 0.01); g.stroke();
          g.beginPath(); g.moveTo(p.x, p.y);
          strokePts++;
        }
      }
      moveECursor(ev);
    });
    ctx.listen(overlay, 'pointermove', ev => {
      moveECursor(ev);
      if (!down) return;
      const p = pt(ev);
      if (st.tool === 'shape') {
        og.clearRect(0, 0, CW, CH);
        og.lineWidth = st.size; og.strokeStyle = st.color; og.fillStyle = st.color; og.globalAlpha = .85;
        const bb = shapePath(og, down, p, st.shape);

/* ==== engine/fixkit.js — Grade-1 S1 classroom correction kit (2026-08) ====
 * Shared helpers for the final classroom-usability correction:
 *   renderSay      — instruction renderer; arrays become numbered ١/٢ step rows
 *   AR_EN / CODE_AR — standard Arabic-101 keyboard correspondence
 *   decorateKey    — bilingual visual key (Arabic prominent + EN physical label)
 *   flashByEvent   — KeyboardEvent.code → the physical visual key to illuminate
 *   fitKeyboard    — a visual keyboard must never be clipped below the stage
 *   saveDialog     — the simulated «حفظ باسم — Save As» dialog (item 12)
 * Fully offline; owns no global listeners beyond what each ctx tears down. */
W.fixkit = (function () {
  const { el } = W.util;

  /* ---------- 1 · instruction renderer with numbered steps ---------- */
  function renderSay(speakEl, t, sub) {
    speakEl.innerHTML = '';
    if (Array.isArray(t)) {
      const wrap = el('div.spk-steps');
      const NUM = ['١', '٢', '٣'];

    } else {
      speakEl.appendChild(el('span', { text: t }));
    }
    if (sub) speakEl.appendChild(el('span.en', { text: sub }));
  }

  /* ---------- 2 · standard Arabic-101 keyboard correspondence ---------- */
  const AR_EN = {
    'ض': 'Q', 'ص': 'W', 'ث': 'E', 'ق': 'R', 'ف': 'T', 'غ': 'Y', 'ع': 'U', 'ه': 'I', 'خ': 'O', 'ح': 'P', 'ج': '[', 'د': ']',
    'ش': 'A', 'س': 'S', 'ي': 'D', 'ب': 'F', 'ل': 'G', 'ا': 'H', 'ت': 'J', 'ن': 'K', 'م': 'L', 'ك': ';', 'ط': "'",
    'ئ': 'Z', 'ء': 'X', 'ؤ': 'C', 'ر': 'V', 'ى': 'N', 'ة': 'M', 'و': ',', 'ز': '.', 'ظ': '/', 'ذ': '`',
    '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '٠': '0',

  Object.keys(AR_EN).forEach(ar => {
    const en = AR_EN[ar];
    let code = null;
    if (/^[A-Z]$/.test(en)) code = 'Key' + en;
    else if (/^[0-9]$/.test(en)) code = 'Digit' + en;
    else code = { '[': 'BracketLeft', ']': 'BracketRight', ';': 'Semicolon', "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash', '`': 'Backquote' }[en];
    if (code && !CODE_AR[code]) CODE_AR[code] = ar;
  });

  /* Special keys — English term prominent (taught in class), Arabic supporting */
  const SPECIAL = {
    'Backspace': { big: 'Backspace ⌫', sub: 'حذف' },
    'Enter': { big: '↵ Enter', sub: 'إدخال' },
    ' ': { big: 'Space', sub: 'مسافة' },
  };

  /* ---------- 3 · bilingual visual key decoration ---------- */
  function decorateKey(btn, keyId) {
    const sp = SPECIAL[keyId];
    if (sp) {
      btn.textContent = '';
      btn.classList.add('k-special');
      btn.appendChild(el('span.kb-big', { text: sp.big }));
      btn.appendChild(el('span.kb-sub', { text: sp.sub }));
      return;
    }
    if (keyId && keyId.length === 1 && AR_EN[keyId]) {
      const ar = btn.textContent;
      btn.textContent = '';
      btn.appendChild(el('span.kb-ar', { text: ar }));
      btn.appendChild(el('span.kb-en', { text: AR_EN[keyId] }));
    }
  }
  function decorateBoard(kbEl) {
    kbEl.querySelectorAll('.kb-key').forEach(b => {
      const k = b.dataset.key;
      if (k === 'Backspace' || k === 'Enter' || k === ' ') decorateKey(b, k);
      else if (k && k.length === 1) decorateKey(b, k);
    });

  /* Which visual key should light for this physical event?
   * KeyboardEvent.code identifies the PHYSICAL key (layout-independent);
   * KeyboardEvent.key stays the actual character that is inserted. */
  function visualKeyFor(ev, keys) {
    if (keys[ev.key]) return keys[ev.key];
    const ar = CODE_AR[ev.code];
    if (ar && keys[ar]) return keys[ar];
    if (/^Digit[0-9]$/.test(ev.code)) {
      const d = '٠١٢٣٤٥٦٧٨٩'[+ev.code.slice(5)];
      if (keys[d]) return keys[d];
    }

  }

  /* ---------- 4 · keyboards are never clipped (item 10) ---------- */
  function fitKeyboard(ctx, kbEl, stageEl, opts) {
    const o = opts || {};
    const minTopFrac = o.minTopFrac == null ? 0.5 : o.minTopFrac;
    function fit() {
      if (!kbEl.isConnected || !stageEl.isConnected) return;
      kbEl.style.transform = '';
      const sr = stageEl.getBoundingClientRect();
      const kr = kbEl.getBoundingClientRect();
      if (!sr.height || !kr.height) return;
      const margin = sr.height * 0.015;
      const minTop = sr.height * minTopFrac;
      let top = kr.top - sr.top;
      const avail = sr.height - margin - minTop;
      let scale = 1;
      if (kr.height > avail) scale = Math.max(0.5, avail / kr.height);
      const hScaled = kr.height * scale;
      let newTop = top;
      if (top + hScaled > sr.height - margin) newTop = Math.max(minTop, sr.height - margin - hScaled);
      // horizontal: keep inside stage too
      const wScaled = kr.width * scale;
      kbEl.style.transformOrigin = 'top center';
      kbEl.style.transform = scale < 1 ? `scale(${scale.toFixed(3)})` : '';
      kbEl.style.top = (newTop / sr.height * 100).toFixed(2) + '%';
      if (wScaled > sr.width * 0.98) {
        const s2 = Math.max(0.45, (sr.width * 0.96) / kr.width);
        kbEl.style.transform = `scale(${Math.min(scale, s2).toFixed(3)})`;

    ctx.after(40, fit);
    ctx.after(300, fit);
    ctx.listen(window, 'resize', fit);

  /* ---------- 5 · the simulated Save-As dialog (item 12) ----------

  function saveDialog(ctx, P, o) {

    const host = (ctx.root && ctx.root.querySelector('.lesson-frame')) || ctx.root || o.host;

    const bCancel = el('button.sd-cancel', { text: 'إلغاء — Cancel', dataset: { sdCancel: '1' } });
    acts.appendChild(bSave); acts.appendChild(bCancel);
    box.appendChild(acts);
