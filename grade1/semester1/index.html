      const sameTarget = !!target && dblTarget === target;
      const near = !dblPt || !pt ? true : (Math.abs(pt.x - dblPt.x) + Math.abs(pt.y - dblPt.y) <= DBL_MOVE);
      if (sameTarget && gap <= DBL_MS && near) {
        dblTarget = null; dblAt = 0; dblPt = null;      // consume the pair
        return true;
      }
      dblTarget = target; dblAt = now; dblPt = pt || null;
      return false;
    }
    function tap() {
      pressFx();
      const c = controlAtVirtualPointer();
      const pt = ptrPoint();
      if (isDoubleOn(c, pt)) activateDouble(c, 'mat');
      else {
        if (c && c.classList.contains('dicon')) {
          c.classList.add('tapped');
          ctx.after(DBL_MS, () => c.classList.remove('tapped'));
        }
        activateSingle(c, 'mat');
      }
    }

    /* ===== R4 · SHARED ACTIVATION =======================================
     * The illustrated mouse and the real pointer run the SAME code. */
    /* one press = one activation, never two (guarded per element) */
    let lastAct = null, lastActAt = 0;
    function pressControl(c) {
      const now = performance.now();
      if (lastAct === c && now - lastActAt < 260) return;   // swallow a repeat
      lastAct = c; lastActAt = now;
      c.click();
    }
    function activateSingle(c, src) {
      if (!c) { if (ctxMenu) closeMenu(); else vClick(); return; }
      if (c.classList.contains('winbtn') || c.classList.contains('taskchip') ||
          c.classList.contains('startchip') || c.closest('.ctxmenu')) {
        if (src === 'mat') pressControl(c);            // its own handler, once
        return;
      }
      vClick();                                        // desktop icons
    }
    function activateDouble(c, src) {
      if (!c) { vClick(); return; }
      if (c.classList.contains('dicon')) { vDbl(c); return; }
      if (src === 'mat') pressControl(c);              // buttons: another press
    }
    function pressFx() {
      const dot = el('div', { style: `position:absolute;inset-inline-start:${px}%;top:${py}%;width:14px;height:14px;border-radius:50%;border:2px solid #ffd166;transform:translate(-50%,-50%);pointer-events:none;z-index:39` });
      screen.appendChild(dot); ctx.after(280, () => dot.remove());
      W.audio.click();
    }

    function chipAt(xPct, yPct, ar, en) {
      const chip = el('div.term-reveal', { style: `left:${xPct}%;top:${yPct}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }
    const chipAtPtr = (ar, en) => {
      const sr = stage.getBoundingClientRect(), r = screen.getBoundingClientRect();
      chipAt(((r.left - sr.left) / sr.width * 100) + px * r.width / sr.width, ((r.top - sr.top) / sr.height * 100) + py * r.height / sr.height, ar, en);
    };

    /* ---------- meet the mouse, reach the star ---------- */
    let starTimer = null;
    function meetDone() {
      phase = 'reach';
      const r = mouseB.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      chipAt((r.left + r.width / 2 - sr.left) / sr.width * 100, (r.top - sr.top) / sr.height * 100, 'الفأرة', 'Mouse');
      lbl.reveal(mouseB, 'الفأرة', 'Mouse', { pos: 'above', id: 'mouse' });
      W.fx.sparkleAt(ctx.root, mouseB, 6);
      say('أوصل المؤشر إلى النجمة');
      onHover(hoverId); // the pointer may already rest on the star
    }
    function onHover(id) {
      if (phase === 'reach') {
        if (id === 'star') {
          if (!starTimer) starTimer = ctx.after(650, () => {
            W.audio.success(); W.fx.sparkleAt(ctx.root, icStar, 8);
            icStar.style.transition = 'opacity .6s, transform .6s';
            icStar.style.transform = 'translateY(-30%) scale(.6)'; icStar.style.opacity = '0';
            ctx.after(650, () => icStar.remove());
            check.done('mouse');
            phase = 'hover1';
            say('مرّر فوق المفكرة');
          });
        } else if (starTimer) { clearTimeout(starTimer); starTimer = null; }
      } else if (phase === 'hover1' && id === 'note') {
        say('أحسنت! الآن ابتعد عنها');
        phase = 'away';
      } else if (phase === 'away' && id !== 'note') {
        phase = 'click';
        guide.step({
          sayAr: 'عُد إلى المفكرة، ثم اضغط الزرّ الأيسر',
          simplerAr: 'اضغط الزرّ الأيسر في الفأرة',
          src: zoneL,
          demo: () => guide.handTap(zoneL, 1),
        });
      }
    }

    /* ---------- click / right-click / double-click ---------- */
    let ctxMenu = null;
    function vClick() {
      const b = iconAt();
      if (ctxMenu && !b) { closeMenu(); return; }
      if (phase === 'click') {
        if (b === icNote) {
          icNote.classList.add('sel');
          chipAtPtr('انقر', 'Click');
          W.apps.bilingual(icNote, 'Notepad');
          W.audio.open();
          check.done('click');
          phase = 'rclick';
          guide.clearSource();
          ctx.after(1300, () => guide.step({
            sayAr: 'اضغط الزرّ الأيمن فوق المفكرة',
            simplerAr: 'اضغط الزرّ الأيمن في الفأرة',
            src: zoneR,
            demo: () => guide.handTap(zoneR, 1),
          }));
        } else if (b) { W.fx.softHint(b); say('المفكرة أولًا'); }
      } else if (phase === 'quizHover' && quizApi) {
        quizApi.wrong(mouseB); say('بلا نقر! فقط أوصل المؤشر');
      } else if (phase === 'dbl' || phase === 'quizDbl') {
        say('نقرتان سريعتان متتابعتان');
      }
    }
    function vRClick() {
      pressFx();
      dblTarget = null; dblAt = 0; dblPt = null;        // a right click breaks a pair
      if (phase !== 'rclick') { if (phase === 'dbl' || phase === 'click') say('ليس الأيمن الآن'); return; }
      const b = iconAt();
      if (b !== icNote) { say('فوق المفكرة'); return; }
      ctxMenu = el('div.ctxmenu', { dataset: { ctxmenu: '1' }, style: `inset-inline-start:${Math.min(px, 60)}%;top:${Math.min(py, 55)}%` });
      [['فتح', 'open'], ['إعادة تسمية', 'ren'], ['أغلق القائمة', 'close']].forEach(([t, k]) => {
        const btn = el('button', { text: t, dataset: { menu: k } });
        ctx.listen(btn, 'click', () => { if (k === 'close') closeMenu(); });
        ctxMenu.appendChild(btn);
      });
      screen.appendChild(ctxMenu);
      chipAtPtr('نقرة بزر الفأرة الأيمن', 'Right-click');
      W.audio.open();
      say('هذه قائمتها — أغلقها');
    }
    function closeMenu() {
      if (!ctxMenu) return;
      ctxMenu.remove(); ctxMenu = null;
      if (phase === 'rclick') {
        check.done('rclick');
        phase = 'dbl';
        guide.clearSource();
        guide.step({
          sayAr: 'اضغط المفكرة مرّتين بسرعة',
          simplerAr: 'اضغط مرّتين متتابعتين على المفكرة',
          src: icNote,
          demo: () => { guide.handTap(icNote, 2); guide.handTap(zoneL, 2); },
        });
      }
    }
    /* R3 item 1 — DIRECT CLICKS ON THE ICON ITSELF.
     * A genuine dblclick event opens it; two taps on the SAME icon inside
     * 650 ms without wandering also count, which is what a small hand does.
     * The first tap only gives a gentle ring — it never advances the stage. */
    function iconTap(b, ev) {
      syncPtrTo(b);
      const pt = ev ? { x: ev.clientX, y: ev.clientY } : ptrPoint();
      if (isDoubleOn(b, pt)) { directDbl(b); return; }
      b.classList.add('tapped');
      ctx.after(DBL_MS, () => b.classList.remove('tapped'));
      W.audio.click();
      directSingle(b);
    }
    function syncPtrTo(b) {
      const sr = screen.getBoundingClientRect(), r = b.getBoundingClientRect();
      if (!sr.width || !r.width) return;
      px = W.util.clamp((r.left + r.width / 2 - sr.left) / sr.width * 100, 0, 100);
      py = W.util.clamp((r.top + r.height / 2 - sr.top) / sr.height * 100, 0, 100);
      placePtr(); hoverScan();
    }
    function directSingle(b) {
      syncPtrTo(b);
      if (phase === 'click') vClick();
      else if (phase === 'dbl' || phase === 'quizDbl') say('نقرتان سريعتان متتابعتان');
      else if (phase === 'quizHover' && quizApi) { quizApi.wrong(b); say('بلا نقر! فقط أوصل المؤشر'); }
    }
    function directDbl(b) {
      syncPtrTo(b);
      vDbl(b);
    }
    /* R4 item 8: a single opening can never be counted twice, whichever
     * path fired it (native dblclick, two-tap fallback, mat or pointer). */
    let dblLock = 0, quizDblDone = false;
    function vDbl(forced) {
      const b = forced || iconAt();
      const now = performance.now();
      if (now - dblLock < 400) return;                 // once-only guard
      dblLock = now;
      if (phase === 'dbl') {
        if (b === icNote) openNotepad(false);
        else say('فوق المفكرة');
      } else if (phase === 'quizDbl' && quizApi) {
        if (b === icNote) {
          if (quizDblDone) return;
          quizDblDone = true;
          const api = quizApi;
          openNotepad(true);
          api.correct(icNote);
        } else quizApi.wrong(mouseB);
      }
    }

    /* ---------- the Notepad window ---------- */
    let win = null, winMax = false, text1 = null, caret = null;
    const NORMAL = 'inset-inline-start:14%;top:8%;width:70%;height:72%';
    let winStep = 0;
    function openNotepad(quiet) {
      if (win) { win.style.opacity = '1'; win.style.pointerEvents = 'auto'; return; }
      win = el('div.npwin', { dataset: { npwin: '1' }, style: NORMAL });
      const ttl = el('div.ttl');
      ttl.appendChild(el('span.tname', { text: 'المفكرة — Notepad' }));
      const bMin = el('button.winbtn', { text: '–', 'aria-label': 'زر التصغير', dataset: { win: 'min', action: 'win-min' } });
      const bMax = el('button.winbtn', { text: '▢', 'aria-label': 'زر التكبير', dataset: { win: 'max', action: 'win-max' } });
      const bCls = el('button.winbtn.close', { text: '✕', 'aria-label': 'زر الإغلاق', dataset: { win: 'close', action: 'win-close' } });
      [bMin, bMax, bCls].forEach(x => ttl.appendChild(x));
      win.appendChild(ttl);
      text1 = el('div.nptext', { dataset: { nptext: '1' } });
      caret = el('span.caret');
      text1.appendChild(caret);
      win.appendChild(text1);
      screen.appendChild(win);
      let chipTask = null;
      ctx.listen(bMin, 'click', () => {
        lbl.action(bMin, 'تصغير', 'Minimize', { pos: 'below', ms: 2000 });
        win.style.opacity = '0'; win.style.pointerEvents = 'none';
        if (!chipTask) {
          chipTask = el('button.taskchip', { text: 'المفكرة', dataset: { task: 'note' } });
          ctx.listen(chipTask, 'click', () => {
            win.style.opacity = '1'; win.style.pointerEvents = 'auto';
            if (phase === 'win' && winStep === 1) {
              winStep = 2;
              /* item 4: «الآن كبّرها» must target ONLY [data-action="win-max"] —
               * a fresh guide step clears the stale Minimize highlight. */
              say('الآن كبّرها', 'Maximize');
              guide.step({
                simplerAr: 'اضغط الزرّ ▢ في أعلى النافذة',
                src: bMax,
                demo: () => guide.handTap(bMax, 1),
              });
            }
          });
          bar.appendChild(chipTask);
        }
        if (phase === 'win' && winStep === 0) {
          winStep = 1;
          say('أعدها من الشريط الأزرق');
          guide.step({
            simplerAr: 'اضغط «المفكرة» في الشريط الأزرق بالأسفل',
            src: chipTask,
            demo: () => chipTask && guide.handTap(chipTask, 1),
          });
        }
      });
      ctx.listen(bMax, 'click', () => {
        winMax = !winMax;
        win.style.cssText = 'position:absolute;z-index:30;' + (winMax ? 'inset:0 0 14% 0' : NORMAL);
        if (winMax) lbl.action(bMax, 'تكبير', 'Maximize', { pos: 'below', ms: 2000 });
        if (phase === 'win') {
          if (winStep === 2 && winMax) {
            winStep = 3;
            say('أعدها لحجمها');
            /* item 4: restore-size step keeps the guide on the SAME control ▢ */
            guide.step({
              simplerAr: 'اضغط ▢ مرّةً أخرى لتعود النافذة لحجمها',
              src: bMax,
              demo: () => guide.handTap(bMax, 1),
            });
          }
          else if (winStep === 3 && !winMax) winDone();
        }
        if (phase === 'quizWin' && quizApi && winMax && quizWinStep === 0) {
          quizWinStep = 1;
          guide.clearStage({ keepLabels: false });
          const cb = win.querySelector('[data-action="win-close"]');
          guide.step({
            sayAr: 'اضغط زر الإغلاق ✕',
            simplerAr: 'اضغط الزر الأحمر المضيء',
            src: cb,
            demo: () => cb && guide.handTap(cb, 1),
          });
        }
      });
      ctx.listen(bCls, 'click', () => {
        if (phase === 'quizWin' && quizApi && quizWinStep === 1) {
          win.remove(); win = null; quizApi.correct(bar);
        } else if (phase === 'win' || phase === 'type') {
          say('لا تغلقها الآن'); W.fx.softHint(bCls);
        } else { win.remove(); win = null; }
      });
      if (!quiet) {
        chipAtPtr('نقرة مزدوجة', 'Double-click');
        W.audio.success();
        check.done('dbl');
        guide.done();
        phase = 'win'; winStep = 0;
        ctx.after(1400, () => guide.step({
          sayAr: 'اضغط زرّ التصغير –',
          simplerAr: 'اضغط الزرّ – في أعلى النافذة',
          src: bMin,
          demo: () => guide.handTap(bMin, 1),
        }));
      }
    }
    function winDone() {
      check.done('win');
      guide.clearStage();
      phase = 'type';
      buildKeyboard();
      say('اكتب: عُمان');
      typeStart();
    }

    /* ---------- the big keyboard: real keys, guided letters ---------- */
    let kb = null, kbKeys = {};
    const ROWS = [
      ['١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '٠'],
      ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج'],
      ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ة'],
      ['ر', 'و', 'ز', 'د', { k: 'Backspace', t: 'Backspace', cls: 'back' }, { k: 'Enter', t: 'Enter', cls: 'enter' }],
      [{ k: 'ArrowRight', t: '→', cls: 'arrow' }, { k: ' ', t: 'Space', cls: 'space' }, { k: 'ArrowLeft', t: '←', cls: 'arrow' }],
    ];
    function buildKeyboard() {
      kb = el('div.kb', { dataset: { kb: '1' }, style: `left:${R.kb.x}%;top:${R.kb.y}%;width:${R.kb.w}%` });
      ROWS.forEach(row => {
        const rEl = el('div.kb-row');
        row.forEach(def => {
          const key = typeof def === 'string' ? { k: def, t: def, cls: '' } : def;
          const b = el('button.kb-key' + (key.cls ? '.' + key.cls : ''), { text: key.t, dataset: { key: key.k } });
          W.fixkit.decorateKey(b, key.k);   // item 7: Arabic prominent + EN physical label
          ctx.listen(b, 'click', () => { flash(b); input(key.k); });
          rEl.appendChild(b);
          kbKeys[key.k] = b;
        });
        kb.appendChild(rEl);
      });
      stage.appendChild(kb);
      W.fixkit.fitKeyboard(ctx, kb, stage, { minTopFrac: 0.56 });   // item 10
    }
    /* R3 item 2: long, obvious press feedback; a wrong key lights red */
    const kbPressT = new Map();
    function flash(b, wrong) {
      if (!b) return;
      const cls = wrong ? 'wrongpress' : 'pressed';
      b.classList.add(cls);
      if (kbPressT.has(b)) clearTimeout(kbPressT.get(b));
      kbPressT.set(b, ctx.after(600, () => { b.classList.remove('pressed'); b.classList.remove('wrongpress'); kbPressT.delete(b); }));
    }
    ctx.listen(window, 'keydown', ev => {
      if (!kb) return;
      const k = ev.key;
      if (k === ' ' || k === 'Enter' || k === 'Backspace' || k.startsWith('Arrow')) {
        ev.preventDefault();
        flash(kbKeys[k === 'ArrowUp' || k === 'ArrowDown' ? 'ArrowLeft' : k]);
        input(k);
      } else if (k.length === 1 && /\S/.test(k)) {
        if (/\d/.test(k)) { flash(kbKeys['١٢٣٤٥٦٧٨٩٠'['1234567890'.indexOf(k)] || '١']); input('DIGIT:' + k); return; }
        /* the key the pupil pressed — never the letter the lesson expects */
        const ch = W.fixkit.pressedChar(ev, true);
        flash(W.fixkit.visualKeyFor(ev, kbKeys) || kbKeys[ch]);
        input(ch);
      }
    });

    ctx.listen(window, 'keyup', () => {
      if (!kb) return;
      Object.values(kbKeys).forEach(b => {
        if (b.classList.contains('pressed') || b.classList.contains('wrongpress')) flash(b, b.classList.contains('wrongpress'));
      });
    });

    /* guided writing engine */
    let buf = '', caretIdx = 0, seq = [], seqI = 0, kbTermShown = false, typeStage = 0;
    const AD = '٠١٢٣٤٥٦٧٨٩';
    function render() {
      text1.innerHTML = '';
      text1.appendChild(document.createTextNode(buf.slice(0, caretIdx)));
      text1.appendChild(caret);
      text1.appendChild(document.createTextNode(buf.slice(caretIdx)));
    }
    function nextChar() { const j = matcher.check(buf.slice(base.length)); return j.ok ? j.next : null; }
    function highlightNext() {
      Object.values(kbKeys).forEach(b => b.classList.remove('hl'));
      if (!seq.length) return;
      const j = matcher.check(buf.slice(base.length));
      if (!j.ok) return;                      // no hint while a mistake stands
      const n = j.next;
      if (n && kbKeys[n]) kbKeys[n].classList.add('hl');
    }
    let seqDone = null, gremlinOn = false, errActive = false;
    /* ===== R2 · REAL TYPING (item 1) ==============================
     * What appears on the notepad is exactly the key the pupil pressed.
     * The target word is only a yardstick: a wrong letter stays visible,
     * the step does not advance, Backspace deletes it, and the correct
     * letter may then be typed. No substitution anywhere. */
    const matcher = W.fixkit.matcher('');
    let base = '';
    function typedPart() { return buf.slice(base.length); }
    function judge() { return matcher.check(typedPart()); }
    function startSeq(word, done) {
      base = buf; seq = word.split(''); matcher.set(word); seqDone = done;
      errActive = false; highlightNext();
    }
    function typeChar(ch) {
      buf = buf.slice(0, caretIdx) + ch + buf.slice(caretIdx);
      caretIdx++; render();
      W.audio.note(520 + Math.random() * 120, .12);
    }
    function evaluate() {
      if (!seq.length) return;
      const j = judge();
      if (j.ok) {
        if (errActive) {
          errActive = false;
          if (gremlinOn) {
            gremlinOn = false;
            W.fx.sparkleAt(ctx.root, text1, 5);
            if (phase === 'type') { say('اضغط إدخال ⏎', 'Enter'); typeStage = 3; return; }
            say('أكمل الكلمة');
          } else say('أحسنت — أكمل الكلمة.');
        }
        highlightNext();
        if (j.complete && seqDone) { const d = seqDone; seqDone = null; d(); }
      } else {
        highlightNext();
        if (!errActive) {
          errActive = true;
          W.fx.softHint(text1);
          say('راجع الحرف، ثم استخدم Backspace لتصحيحه.', '⌫ Backspace');
        }
      }
    }
    function input(k) {
      if (!kbTermShown) {
        kbTermShown = true;
        lbl.reveal(kb, 'لوحة المفاتيح', 'Keyboard', { pos: 'above', id: 'kb' });
      }
      if (phase !== 'type' && phase !== 'quizType') return;
      if (k === 'Backspace') {
        if (caretIdx > 0) { buf = buf.slice(0, caretIdx - 1) + buf.slice(caretIdx); caretIdx--; render(); }
        evaluate();
        return;
      }
      if (k === 'Enter') {
        if (phase === 'type' && typeStage === 3) {
          typeChar('\n');
          say('اضغط أي رقم', 'للوحة مجموعتا أرقام');
          typeStage = 4;
        } else if (phase === 'quizType' && quizApi && judge().complete && !gremlinOn) {
          quizApi.correct(kb);
        } else typeChar('\n');
        return;
      }
      if (k.startsWith('DIGIT:')) {
        const d = k.slice(6);                 // the digit actually pressed
        if (phase === 'type' && typeStage === 4) {
          typeChar(d); typeStage = 5;
          say('عُد لأول السطر بالأسهم', '← →');
        } else if (typeStage >= 4) typeChar(d);

      }
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        caretIdx = W.util.clamp(caretIdx + (k === 'ArrowLeft' ? -1 : 1), 0, buf.length);
        render();
        if (phase === 'type' && typeStage === 5) {
          const lineStart = buf.lastIndexOf('\n', caretIdx - 1) + 1;
          if (caretIdx === lineStart) {
            W.audio.success(); W.fx.sparkleAt(ctx.root, text1, 7);
            typeDone();
          }
        }
        return;
      }
      const expected = seq.length ? judge().next : null;
      typeChar(k);                            // letters AND space, verbatim
      if (kbKeys[k]) flash(kbKeys[k], !!(expected && k !== expected));
      evaluate();
    }
    function typeStart() {

      startSeq('عمان', () => {
        say('مسافة ثم: الرقمية');

          ctx.after(500, () => {

            W.fx.softHint(text1);

    function clearOverlayCards() {

        const glyph = el('div.fn-glyph', { style: 'font-size:calc(var(--su)*22);line-height:1' , text: '⚙️' });
        fnWrap.appendChild(glyph);
        fnWrap.appendChild(el('div.lbl', { text: c.p.fn, style: 'font-weight:800;text-align:center' }));
        fnWrap.appendChild(el('div.fn-hint', { text: 'الوظيفة', style: 'font-size:calc(var(--su)*10);opacity:.6' }));
        back.appendChild(fnWrap);
      }
      b.appendChild(front); b.appendChild(back);
      stage.appendChild(b);

      ctx.listen(b, 'click', () => {
        if (phase !== 'memory') { tapLantern(c, b); return; }
        if (busy || b.classList.contains('matched') || b === (flipA && flipA.b)) return;
        b.classList.add('flipped');
        W.audio.click();
        if (!flipA) { flipA = { c, b }; return; }
        busy = true;
        if (flipA.c.p.id === c.p.id) {
          const a = flipA; flipA = null; busy = false;
          [a.b, b].forEach(x => x.classList.add('matched'));
          lit.add(c.p.id);
          W.audio.success(); W.fx.sparkleAt(ctx.root, b, 6);
          chipOn(b, c.p.ar, c.p.en);
          const picB = (c.side === 'pic') ? b : a.b;
          lbl.reveal(picB, c.p.ar, c.p.en, { id: c.p.id });
          guide.clearSource();
          guide.confirm('طابقتَ ' + c.p.ar, b);
          if (++matched === PAIRS.length) {
            check.done('memory');
            phase = 'gates';
            guide.done();
            ctx.after(1100, () => say('اضغط بوابة زرّ وحدة النظام أولًا'));
            showGates();
          } else {
            const rem = PAIRS.length - matched;
            ctx.after(800, () => { if (phase === 'memory') say('بقي ' + '٠١٢٣٤٥٦'[rem] + ' من الأزواج'); });
          }
        } else {
          const a = flipA; flipA = null;
          say('ليس زوجًا… انظر جيدًا');
          ctx.after(750, () => { a.b.classList.remove('flipped'); b.classList.remove('flipped'); busy = false; });
        }
      });
    });

    ctx.after(140, () => {
      const first = stage.querySelector('.mlantern');
      if (!first) return;
      guide.step({
        sayAr: 'اضغط فانوسًا ليكشف ما تحته',
        simplerAr: 'اضغط فانوسين متشابهين',
        src: first,
        demo: () => guide.handTap(first, 1),
      });
    });
    function chipOn(node, ar, en) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const chip = el('div.term-reveal', { style: `left:${(r.left + r.width / 2 - s.left) / s.width * 100}%;top:${(r.top - s.top) / s.height * 100}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2300, () => chip.remove());
    }

    /* ---------- water gates ---------- */
    const GATES = [
      { i: 0, id: 'system', label: 'زرّ وحدة النظام', step: 1 },
      { i: 1, id: 'monitor', label: 'زرّ الشاشة', step: 2 },
      { i: 2, id: 'start', label: 'قائمة بدء', step: 3 },
      { i: 3, id: 'off', label: 'إيقاف التشغيل', step: 4 },
    ];
    let want = 1;
    function showGates() {
      GATES.forEach(g => {
        const s = R.gateSpots[g.i];
        const b = el('button.wgate-btn', { dataset: { gate: g.id }, 'aria-label': g.label, style: `left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%` });
        const pic = sv('svg', { viewBox: '0 0 60 80', style: 'width:100%;height:100%' });
        if (g.id === 'system' || g.id === 'monitor') {
          pic.appendChild(sv('rect', { x: 8, y: 10, width: 44, height: 40, rx: 4, fill: 'url(#bezel)', stroke: '#12121a', 'stroke-width': 2.6 }));
          if (g.id === 'monitor') pic.appendChild(sv('rect', { x: 13, y: 15, width: 34, height: 26, rx: 2, fill: 'url(#glassTeal)' }));
          pic.appendChild(sv('circle', { cx: 30, cy: 62, r: 11, fill: 'url(#copper)', stroke: '#5d3116', 'stroke-width': 3 }));
          pic.appendChild(sv('path', { d: 'M30 56 v8 M25 58 a 7 7 0 1 0 10 0', fill: 'none', stroke: '#3a2412', 'stroke-width': 2.4, 'stroke-linecap': 'round' }));
        } else if (g.id === 'start') {
          pic.appendChild(sv('rect', { x: 6, y: 22, width: 48, height: 36, rx: 5, fill: '#14233b', stroke: '#0a1220', 'stroke-width': 2.6 }));
          pic.appendChild(sv('rect', { x: 12, y: 32, width: 20, height: 16, rx: 8, fill: '#3f9e6e' }));
        } else {
          pic.appendChild(sv('circle', { cx: 30, cy: 40, r: 20, fill: '#e8e2d0', stroke: '#5b6272', 'stroke-width': 3 }));
          pic.appendChild(sv('path', { d: 'M30 26 v14 M21 30 a 12 12 0 1 0 18 0', fill: 'none', stroke: '#3a2412', 'stroke-width': 3.4, 'stroke-linecap': 'round' }));
        }
        b.appendChild(pic);
        stage.appendChild(b);
        lbl.reveal(b, g.label, null, { id: 'gate-' + g.id, quiet: true });
        ctx.listen(b, 'click', () => {
          if (phase !== 'gates') return;
          const g2 = GATES.find(x => x.id === b.dataset.gate);
          if (g2.step !== want) {
            W.fx.softHint(b);
            const wants = { 1: 'اضغط بوابة زرّ وحدة النظام', 2: 'اضغط بوابة زرّ الشاشة', 3: 'اضغط بوابة قائمة بدء', 4: 'اضغط بوابة إيقاف التشغيل' };
            say(wants[want] || 'اضغط البوابة الصحيحة');
            const right = GATES.find(x => x.step === want);
            if (right) { const rb = stage.querySelector(`.wgate-btn[data-gate="${right.id}"]`); if (rb) W.fx.glow(rb); }
            return;
          }
          b.appendChild(el('span.num', { text: '١٢٣٤'[want - 1] }));
          const leaf = R.gates[g2.i].leaf;
          leaf.style.transition = 'transform .6s ease';
          leaf.setAttribute('transform', `translate(0 -${118}) `);
          R.water.setAttribute('width', String(Math.round(1366 * want / 4)));
          guide.confirm('فتحتَ ' + g2.label, b);
          want++;
          if (want === 3) say('أحسنت! الآن اضغط قائمة بدء');
          else if (want === 5) {
            check.done('gates');
            phase = 'wait';
            say('جرى الماء إلى آخر الجدار!');
            ctx.after(1400, startQuiz);
          }
        });
      });
    }

    /* ---------- retrieval challenge ---------- */
    let phase = 'memory', quizApi = null;
    function tapLantern(c, b) {
      if (phase === 'q2' && quizApi) {
        /* item 9: the challenge tests VISUAL recognition — the pupil presses
         * the real picture of the mouse, which stays face-up after matching. */
        if (c.p.id === 'mouse' && c.side === 'pic') { chipOn(b, c.p.ar, c.p.en); quizApi.correct(b); }
        else if (c.p.id === 'mouse') { W.fx.softHint(b); say('هذه بطاقة الوظيفة — اضغط صورة الفأرة.'); }
        else quizApi.wrong(b);
      }
    }
    function cards3(api, opts) {
      const row = el('div.choice-row', { dataset: { cards: '1' }, style: 'position:absolute;top:38%;inset-inline:8%;z-index:34' });
      opts.forEach(([txt, ok]) => {
        const c = el('button.choice-card', { text: txt });
        ctx.listen(c, 'click', () => {
          if (ok) { c.classList.add('done'); W.audio.success(); W.fx.sparkleAt(ctx.root, c, 5); ctx.after(400, () => row.remove()); api.correct(); }
          else { W.fx.softHint(c); say('فكّر مرة أخرى'); }
        });
        row.appendChild(c);
      });
      stage.appendChild(row);
    }
    function startQuiz() {
      guide.clearStage({ remove: ['.choice-row'] });
      say('تحدي التذكّر!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            say('الشاشة مظلمة والأنشودة تعمل — ماذا يعمل؟');
            cards3(api, [['وحدة النظام', true], ['الشاشة', false], ['الطابعة', false]]);
          },
        },
        { mount(st, api) { quizApi = api; phase = 'q2'; say('اضغط صورة الفأرة.', 'Mouse'); } },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            say('كيف نوقف الحاسوب بأمان؟');
            cards3(api, [['من قائمة بدء', true], ['أسحب الكهرباء', false], ['أضغط الزرّ طويلًا', false]]);
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          R.water.setAttribute('width', '1366');
          W.rig.complete(ctx, lesson, { impactAr: 'اشتعل جدار الفوانيس كلّه!' });
        },
      });
    }
  },
});

/* ==== lessons/l1-6.js ==== */
/* Lesson 1.6 — لنطبق معًا — the Unit 1 challenge.
 * Unique mechanic: ONE FREE QUEST CHAIN. No new teaching: the gate opens only for a
 * child who makes the Oasis card with their own hands — power on in order, open
 * Notepad with a real double-click rhythm, type, repair, print, and shut down safely.
 * Every finished step lights one stone of the arch; six stones open the gate. */
W.lessons.register('1.6', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'power', label: 'شغّل بالترتيب' },
      { id: 'open', label: 'افتح المفكرة' },
      { id: 'write', label: 'اكتب البطاقة' },
      { id: 'fix', label: 'صحّح الخطأ' },
      { id: 'print', label: 'اطبع البطاقة' },
      { id: 'shutdown', label: 'أوقف بأمان' },
    ]);

    const lbl = W.label.group(ctx, stage);
    const room = W.interiors.questRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اضغط زرّ التشغيل', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    let stoneI = 0;
    function lightStone() {
      const s = R.stones[stoneI++];
      if (!s) return;
      s.setAttribute('fill', '#ffd166');
      s.setAttribute('stroke', '#ffe9b8');
      s.style.filter = 'drop-shadow(0 0 10px rgba(255,209,102,.95))';
      W.audio.note(520 + stoneI * 60, .18);
    }
    function chipOn(node, ar, en) {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const chip = el('div.term-reveal', { style: `left:${(r.left + r.width / 2 - s.left) / s.width * 100}%;top:${(r.top - s.top) / s.height * 100}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2200, () => chip.remove());
    }

    /* ---------- the desktop inside the monitor ---------- */
    const dsk = W.apps.deskScreen({ pos: R.screen, ctx, stage });
    dsk.root.style.opacity = '0';
    dsk.root.style.transition = 'opacity .6s ease';
    stage.appendChild(dsk.root);
    const icNote = dsk.addIcon('note', 'المفكرة', 'note', 8, 10);
    dsk.addIcon('pic', 'صورة', 'fileimg', 8, 52);

    /* ---------- step 1: power on, system unit first ---------- */
    let phase = 'power', sysOn = false;
    const powerBtn = el('button.q-hint', {
      dataset: { qpower: '1' }, 'aria-label': 'زرّ التشغيل — Power',
      style: `position:absolute;left:${R.powerSpot.x}%;top:${R.powerSpot.y}%;width:${R.powerSpot.w}%;height:${R.powerSpot.h}%;background:none;border:none;cursor:pointer;z-index:20`,
    });
    stage.appendChild(powerBtn);
    ctx.after(120, () => {
      guide.step({
        sayAr: 'اضغط زرّ التشغيل',
        simplerAr: 'اضغط الزرّ المضيء في وحدة النظام',
        src: powerBtn,
        demo: () => guide.handTap(powerBtn, 1),
      });
    });
    ctx.listen(powerBtn, 'click', () => {
      if (phase !== 'power' || sysOn) return;
      sysOn = true;
      powerBtn.classList.remove('q-hint');
      R.led.setAttribute('fill', '#5fc08f');
      W.audio.open();
      say('أضاء المصباح — الآن الشاشة');
      ctx.after(500, () => {
        dsk.root.style.opacity = '1';
        W.audio.success();
        W.fx.sparkleAt(ctx.root, dsk.root, 7);
        check.done('power');
        lightStone();
        phase = 'open';
        guide.done();
        guide.step({
          sayAr: 'اضغط المفكرة مرّتين بسرعة',
          simplerAr: 'اضغط أيقونة المفكرة مرّتين',
          src: icNote,
          demo: () => guide.handTap(icNote, 2),
        });
      });
    });

    /* ---------- step 2: open Notepad with a real double-click ---------- */
    let win = null, npText = null, board = null;
    ctx.listen(icNote, 'click', () => {
      if (phase === 'open') say('نقرتان سريعتان متتابعتان');
    });
    ctx.listen(icNote, 'dblclick', () => {
      if (phase !== 'open' || win) return;
      win = W.apps.appWindow({ title: 'المفكرة — Notepad', normal: 'left:6%;top:6%;width:88%;height:74%', dataset: { npwin: '1' } });
      dsk.root.appendChild(win.root);
      npText = el('div.nptext', { dataset: { nptext: '1' } });
      win.body.appendChild(npText);
      ctx.listen(win.btns.max, 'click', () => win.setMax(!win.maxed));
      ctx.listen(win.btns.min, 'click', () => { win.root.style.opacity = '0'; ctx.after(900, () => { win.root.style.opacity = '1'; }); });
      ctx.listen(win.btns.close, 'click', () => { if (phase === 'write' || phase === 'fix') { say('لا تغلقها الآن'); W.fx.softHint(win.btns.close); } });
      W.audio.open();
      chipOn(icNote, 'نقرة مزدوجة', 'Double-click');
      W.apps.bilingual(icNote, 'Notepad');
      check.done('open');
      lightStone();
      guide.done();
      phase = 'write';
      ctx.after(900, startWriting);
    });

    /* ---------- step 3+4: type the card, then repair it ---------- */
    function startWriting() {
      say('اكتب: واحة');
      /* item 10: while typing, the monitor and Notepad slide upward and the
       * keyboard is fitted so every row — Backspace, Enter and Space — stays
       * fully visible; no page scrolling at 1366×768. */
      [art, dsk.root].forEach(n => { n.style.transition = 'transform .6s ease'; n.style.transform = 'translateY(-4%)'; });
      board = W.typing.make(ctx, { host: stage, pos: { x: 18, y: 64, w: 46 }, text: npText, stage, fit: { minTopFrac: 0.62 }, say });
      lbl.reveal(board.kb, 'لوحة المفاتيح', 'Keyboard', { pos: 'above', id: 'kb' });
      board.seq('واحة', () => {
        say('مسافة ثم: التقنية');
        board.seq(' التقنية', () => {
          check.done('write');
          lightStone();
          phase = 'fix';
          ctx.after(600, () => {
            board.plant('ن');
            W.fx.softHint(npText);
            say('حرف دخيل! امسحه', '⌫ Backspace');
          });
        });
      });
      board.on('fixed', () => {
        check.done('fix');
        lightStone();
        phase = 'print';
        // restore the room so the printer's hotspot matches its picture again
        [art, dsk.root].forEach(n => { n.style.transform = ''; });
        board.clearSeq();
        printBtn.classList.add('q-hint');
        guide.step({
          sayAr: 'اضغط الطابعة لتطبع البطاقة',
          simplerAr: 'اضغط الطابعة على الطاولة',
          src: printBtn,
          demo: () => guide.handTap(printBtn, 1),
        });
      });
      board.on('mistake', () => say('راجع الحرف، ثم استخدم Backspace لتصحيحه.', '⌫ Backspace'));
    }

    /* ---------- step 5: print the card ---------- */
    const printBtn = el('button', {
      dataset: { printer: '1' }, 'aria-label': 'الطابعة — Printer',
      style: `position:absolute;left:${R.printer.x}%;top:${R.printer.y}%;width:${R.printer.w}%;height:${R.printer.h}%;background:none;border:none;cursor:pointer;z-index:20`,
    });
    stage.appendChild(printBtn);
    ctx.listen(printBtn, 'click', () => {
      if (phase !== 'print') return;
      printBtn.classList.remove('q-hint');
      W.audio.note(430, .3);
      const card = el('div', {
        dataset: { card: '1' },
        style: `position:absolute;left:${R.printSlot.x}%;top:${R.printSlot.y}%;width:${R.printSlot.w}%;height:2%;z-index:19;` +
               'background:linear-gradient(180deg,#fdfaf2,#efe4cd);border:2px solid #b99f74;border-radius:3px;' +
               'display:grid;place-items:center;overflow:hidden;transition:height .9s ease, top .9s ease;' +
               'font-weight:700;color:#23406e;font-size:calc(var(--su)*15)',
      });
      card.textContent = board.field.value.trim() || 'واحة التقنية';
      stage.appendChild(card);
      ctx.after(60, () => { card.style.height = '9%'; card.style.top = (R.printSlot.y + 3) + '%'; });
      ctx.after(1000, () => {
        W.audio.success(); W.fx.sparkleAt(ctx.root, card, 7);
        chipOn(printBtn, 'الطابعة', 'Printer');
        lbl.reveal(printBtn, 'الطابعة', 'Printer', { pos: 'above', id: 'printer' });
        check.done('print');
        lightStone();
        phase = 'shutdown';
        guide.done();
        dsk.start.classList.add('q-hint');
        guide.step({
          sayAr: 'اضغط زرّ بدء لتوقف التشغيل',
          simplerAr: 'اضغط الزرّ الأخضر في الشريط',
          src: dsk.start,
          demo: () => guide.handTap(dsk.start, 1),
        });
      });
    });

    /* ---------- step 6: safe shutdown ---------- */
    ctx.listen(dsk.start, 'click', () => {
      if (phase !== 'shutdown') return;
      dsk.start.classList.remove('q-hint');
      W.audio.click();
      if (dsk.bar.querySelector('[data-sim="shutdown"]')) return;
      const off = el('button.taskchip', { text: '⏻ إيقاف التشغيل', dataset: { sim: 'shutdown' }, style: 'font-size:calc(var(--su)*13)' });
      dsk.bar.appendChild(off);
      ctx.listen(off, 'click', () => {
        if (phase !== 'shutdown') return;
        phase = 'done';
        if (win) win.close();
        if (board) board.remove();
        dsk.root.style.opacity = '0';
        R.led.setAttribute('fill', '#4e4436');
        check.done('shutdown');
        lightStone();
        ctx.after(700, openGate);
      });
    });
    ctx.listen(powerBtn, 'click', () => {
      if (phase === 'shutdown') { W.fx.softHint(powerBtn); say('ليس من الزر! من بدء'); }
    });

    /* ---------- the gate opens, the falaj runs ---------- */
    function openGate() {
      say('تفتح البوابة!');
      R.doors.l.style.transition = 'transform 1.6s ease';
      R.doors.r.style.transition = 'transform 1.6s ease';
      R.doors.l.setAttribute('transform', 'translate(-230 0)');
      R.doors.r.setAttribute('transform', 'translate(230 0)');
      const glow = el('div', {
        style: 'position:absolute;left:32%;top:16%;width:36%;height:46%;z-index:8;border-radius:50% 50% 0 0;' +
               'background:radial-gradient(60% 70% at 50% 70%, rgba(255,231,168,.95), rgba(255,209,102,.35) 60%, rgba(255,209,102,0));' +
               'opacity:0;transition:opacity 1.8s ease',
      });
      stage.appendChild(glow);
      ctx.after(300, () => { glow.style.opacity = '1'; });
      const water = sv('svg', { viewBox: '0 0 1366 768', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;z-index:9;pointer-events:none' });
      const path = sv('path', { d: 'M683 470 C 683 560, 400 620, 60 700', fill: 'none', stroke: 'url(#waterMain)', 'stroke-width': 26, 'stroke-linecap': 'round', opacity: .9 });
      water.appendChild(path);
      stage.appendChild(water);
      const len = 900;
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.style.transition = 'stroke-dashoffset 2.2s ease';
      ctx.after(700, () => { path.style.strokeDashoffset = '0'; W.audio.note(320, .8); });
      ctx.after(2600, () => {
        W.rig.complete(ctx, lesson, { impactAr: 'انفتحت بوابة القلعة وجرى الفلج!' });
      });
    }
  },
});

/* ==== lessons/l2-1.js ==== */
/* Lesson 2.1 — مقدمة إلى الرسم الرقمي.
 * Unique mechanic: THE MAGNIFYING LENS. A framed digital picture hangs in the
 * gallery; the child drags a brass lens over it and presses "قرّب" until the
 * picture breaks into visible squares — the Pixel is discovered, not defined.
 * Flow: look · zoom in steps · squares appear · tap a pixel · digital vs paper · quiz. */
W.lessons.register('2.1', {
  mount(ctx, frame, lesson) {
    const { el, sv } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'zoom', label: 'قرّب الصورة' },
      { id: 'pixel', label: 'اكتشف المربع' },
      { id: 'digital', label: 'رقمي أم ورقي؟' },
      { id: 'quiz', label: 'تحدي الرواق' },
    ]);

    const lbl = W.label.group(ctx, stage);
    const room = W.interiors.pixelGallery();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اضغط + لتقريب الصورة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();

    /* ---------- the picture: a tiny palm bitmap scaled up ---------- */
    const PW = 24, PH = 16;
    const SKY = '#7ec3e8', SAND = '#e8cf9b', TRUNK = '#8a5a30', LEAF = '#3f9e6e', SUN = '#ffd166', DATE = '#c9503d';
    function palmBitmap(g) {
      g.fillStyle = SKY; g.fillRect(0, 0, PW, PH);
      g.fillStyle = SUN; g.fillRect(19, 2, 3, 3);
      g.fillStyle = SAND; g.fillRect(0, 12, PW, 4);
      g.fillStyle = TRUNK; [11, 10, 10, 9, 9].forEach((x, i) => g.fillRect(x, 11 - i, 2, 1));
      g.fillStyle = LEAF;
      g.fillRect(6, 4, 4, 1); g.fillRect(4, 5, 4, 1);
      g.fillRect(12, 4, 4, 1); g.fillRect(14, 5, 4, 1);
      g.fillRect(8, 3, 6, 1); g.fillRect(9, 2, 4, 1);
      g.fillStyle = DATE; g.fillRect(10, 5, 1, 1); g.fillRect(12, 5, 1, 1);
    }
    const frameEl = el('div.pixframe', { dataset: { pixframe: '1' }, style: `left:${R.frame.x}%;top:${R.frame.y}%;width:${R.frame.w}%;height:${R.frame.h}%` });
    const cv = el('canvas', { width: 960, height: 640 });
    frameEl.appendChild(cv);
    stage.appendChild(frameEl);
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    const src = el('canvas', { width: PW, height: PH });
    const sg = src.getContext('2d');
    palmBitmap(sg);

    let zoom = 1, CXX = 11, CYY = 6; // view centre moves per challenge
    const Z = [1, 1.8, 3.2, 5.5, 9];
    function draw() {
      const f = Z[zoom - 1];
      const vw = PW / f, vh = PH / f;
      const cx = CXX, cy = CYY;
      const sx = W.util.clamp(cx - vw / 2, 0, PW - vw), sy = W.util.clamp(cy - vh / 2, 0, PH - vh);
      g.clearRect(0, 0, 960, 640);
      g.drawImage(src, sx, sy, vw, vh, 0, 0, 960, 640);
      if (zoom >= 4) {
        g.strokeStyle = 'rgba(20,28,51,.5)'; g.lineWidth = 1;
        const cell = 960 / vw;
        for (let i = 0; i <= Math.ceil(vw); i++) { g.beginPath(); g.moveTo(i * cell - (sx % 1) * cell, 0); g.lineTo(i * cell - (sx % 1) * cell, 640); g.stroke(); }
        for (let j = 0; j <= Math.ceil(vh); j++) { g.beginPath(); g.moveTo(0, j * cell - (sy % 1) * cell); g.lineTo(960, j * cell - (sy % 1) * cell); g.stroke(); }
      }
      frameEl.dataset.zoom = String(zoom);
    }
    draw();

    /* the brass lens rides the frame */
    const lens = el('button.zoomlens', { dataset: { lens: '1' }, 'aria-label': 'العدسة' });
    const lsvg = sv('svg', { viewBox: '0 0 100 100' });
    lsvg.appendChild(sv('circle', { cx: 40, cy: 40, r: 30, fill: 'rgba(230,246,255,.28)', stroke: 'url(#copper)', 'stroke-width': 9 }));
    lsvg.appendChild(sv('path', { d: 'M62 62 L88 88', stroke: 'url(#copper)', 'stroke-width': 12, 'stroke-linecap': 'round' }));
    lsvg.appendChild(sv('path', { d: 'M28 30 q 10 -8 22 -2', stroke: '#fff', 'stroke-width': 4, fill: 'none', opacity: .7, 'stroke-linecap': 'round' }));
    lens.appendChild(lsvg);
    lens.style.left = (R.frame.x + R.frame.w * .58) + '%';
    lens.style.top = (R.frame.y + R.frame.h * .3) + '%';
    stage.appendChild(lens);
    let ld = null;
    ctx.listen(lens, 'pointerdown', ev => { ev.preventDefault(); lens.setPointerCapture(ev.pointerId); ld = { x: ev.clientX, y: ev.clientY }; });
    ctx.listen(lens, 'pointermove', ev => {
      if (!ld) return;
      const s = stage.getBoundingClientRect();
      lens.style.left = (parseFloat(lens.style.left) + (ev.clientX - ld.x) / s.width * 100) + '%';
      lens.style.top = (parseFloat(lens.style.top) + (ev.clientY - ld.y) / s.height * 100) + '%';
      ld = { x: ev.clientX, y: ev.clientY };
    });
    ctx.listen(lens, 'pointerup', () => { ld = null; });

    /* zoom buttons carved beside the frame */
    function zbtn(txt, dy, fn, id) {
      const b = el('button.choice-card.zbtn', { text: txt, dataset: { z: id }, style: `left:${R.frame.x + R.frame.w + 1.5}%;top:${R.frame.y + dy}%;min-width:8%;min-height:9%` });
      ctx.listen(b, 'click', fn);
      stage.appendChild(b);
      return b;
    }
    const zIn = zbtn('قرّب +', 4, () => {
      if (zoom >= 5) return;
      zoom++; draw(); W.audio.note(480 + zoom * 40, .12);
      if (zoom === 3 && phase === 'zoom') say('أكثر… شيء يظهر!');
      guide.bump();
      if (zoom >= 4 && phase === 'zoom') {
        phase = 'pixel';
        check.done('zoom');
        guide.clearSource();
        guide.step({
          sayAr: 'اضغط مربّعًا صغيرًا في الصورة',
          simplerAr: 'اضغط أيّ مربّع ملوّن',
          src: frameEl,
          demo: () => guide.handTap(frameEl, 1),
        });
      }
    }, 'in');
    const zOut = zbtn('بعّد −', 15, () => { if (zoom > 1) { zoom--; draw(); W.audio.click(); } }, 'out');
    void zOut;
    ctx.after(100, () => {
      guide.step({
        sayAr: 'اضغط + لتقريب الصورة',
        simplerAr: 'اضغط زرّ «قرّب +» مرّاتٍ',
        src: zIn,
        demo: () => guide.handTap(zIn, 1),
      });
    });

    /* tap a pixel */
    let phase = 'zoom', quizApi = null;
    ctx.listen(cv, 'click', ev => {
      const r = cv.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * 100, y = (ev.clientY - r.top) / r.height * 100;
      if (phase === 'pixel' && zoom >= 4) {
        const ring = el('div', { style: `position:absolute;left:${x}%;top:${y}%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #ffd166;border-radius:8px;box-shadow:0 0 14px rgba(255,209,102,.9);pointer-events:none` });
        frameEl.appendChild(ring);
        ctx.after(2000, () => ring.remove());
        chipAt(R.frame.x + R.frame.w / 2, R.frame.y + 6, 'بكسل', 'Pixel');
        lbl.reveal(frameEl, 'بكسل', 'Pixel', { pos: 'inside-top', id: 'pixel' });
        guide.done();
        guide.confirm('وجدتَ البكسل!', frameEl);
        check.done('pixel');
        phase = 'digital';
        ctx.after(2200, digitalPick);
      } else if (phase === 'q1' && quizApi) {
        if (zoom >= 4) { quizApi.correct(frameEl); }
        else say('قرّب أولًا حتى المربعات');
      } else if (phase === 'q3' && quizApi) {
        // find the odd square: sample the bitmap under the tap
        const f = Z[zoom - 1], vw = PW / f, vh = PH / f;
        const sx = W.util.clamp(CXX - vw / 2, 0, PW - vw), sy = W.util.clamp(CYY - vh / 2, 0, PH - vh);
        const px = Math.floor(sx + x / 100 * vw), py = Math.floor(sy + y / 100 * vh);
        if (px === odd.x && py === odd.y) {
          sg.fillStyle = LEAF; sg.fillRect(odd.x, odd.y, 1, 1); draw();
          quizApi.correct(frameEl);
        } else quizApi.wrong(frameEl);
      }
    });

    function chipAt(x, y, ar, en) {
      const chip = el('div.term-reveal', { style: `left:${x}%;top:${y}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }

    /* digital vs paper */
    function digitalPick() {
      say('أيّ رسمة نكبّرها فتظهر مربعات؟');
      const row = el('div.choice-row', { dataset: { digital: '1' }, style: 'position:absolute;bottom:4%;inset-inline:10%;z-index:34' });
      const mk = (kind, cap, ok) => {
        const c = el('button.choice-card.pic', { dataset: { dv: kind } });
        const s = sv('svg', { viewBox: '0 0 90 70' });
        if (kind === 'screen') {
          s.appendChild(sv('rect', { x: 12, y: 8, width: 66, height: 44, rx: 4, fill: 'url(#bezel)' }));
          s.appendChild(sv('rect', { x: 17, y: 13, width: 56, height: 34, fill: '#7ec3e8' }));
          [['#3f9e6e', 24, 30], ['#ffd166', 58, 18], ['#8a5a30', 40, 34]].forEach(q => s.appendChild(sv('rect', { x: q[1], y: q[2], width: 8, height: 8, fill: q[0] })));
          s.appendChild(sv('rect', { x: 36, y: 52, width: 18, height: 6, fill: '#33333f' }));
        } else {
          s.appendChild(sv('path', { d: 'M16 8 h50 l8 8 v46 h-58 Z', fill: '#fdfaf2', stroke: '#a98a5c', 'stroke-width': 3 }));
          s.appendChild(sv('path', { d: 'M28 44 q 12 -22 24 0 M52 30 a 7 7 0 1 1 .1 0', fill: 'none', stroke: '#8a5a30', 'stroke-width': 3 }));
        }
        c.appendChild(s);
        c.appendChild(el('span.cap', { text: cap }));
        ctx.listen(c, 'click', () => {
          if (ok) {
            c.classList.add('done');
            W.audio.success(); W.fx.sparkleAt(ctx.root, c, 6);
            chipAt(50, 66, 'الرسم الرقمي', 'Digital Drawing');
            lbl.reveal(frameEl, 'الرسم الرقمي', 'Digital Drawing', { pos: 'above', id: 'digital' });
            check.done('digital');
            phase = 'wait';
            ctx.after(1700, () => { row.remove(); startQuiz(); });
          } else { W.fx.softHint(c); say('الورقة لا مربعات فيها'); }
        });
        return c;
      };
      row.appendChild(mk('paper', 'رسمة على ورقة', false));
      row.appendChild(mk('screen', 'رسمة على الشاشة', true));
      stage.appendChild(row);
    }

    /* ---------- the gallery challenge ---------- */
    const odd = { x: 12, y: 6 };
    function startQuiz() {
      guide.clearStage({ remove: ['.choice-row'] });
      say('تحدي الرواق!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            zoom = 1; CXX = 11; CYY = 6; draw();
            say('قرّب حتى ترى المربعات ثم انقر');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            say('كم مربعًا في الشمس؟');
            const row = el('div.choice-row', { dataset: { count: '1' }, style: 'position:absolute;bottom:4%;inset-inline:16%;z-index:34' });
            [['٦', false], ['٩', true], ['٣', false]].forEach(([n, ok]) => {
              const c = el('button.choice-card', { text: n });
              ctx.listen(c, 'click', () => {
                if (ok) { c.classList.add('done'); ctx.after(400, () => row.remove()); api.correct(c); }
                else { W.fx.softHint(c); say('عُدَّ مربعات الشمس'); }
              });
              row.appendChild(c);
            });
            stage.appendChild(row);
            CXX = 20; CYY = 3; zoom = 4; draw();
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            CXX = 11; CYY = 6;
            sg.fillStyle = '#e2574c'; sg.fillRect(odd.x, odd.y, 1, 1);
            zoom = 4; draw();
            say('مربعٌ غريب اللون — انقره');
          },
        },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          W.rig.complete(ctx, lesson, { impactAr: 'أضاء قوس البكسل في الاستديو!' });
        },
      });
    }
  },
});

/* ==== lessons/l2-2.js ==== */
/* Lesson 2.2 — رسم الأشكال.
 * Unique mechanic: THE LIVING ATELIER. A real canvas on a great easel; every tool
 * is discovered by using it: draw shapes, pour color with the bucket, erase a blot,
 * step back with Undo and forward with Redo, then Save the artwork into the studio.
 * Flow: shape · color+fill · eraser · undo/redo · save · atelier challenge. */
W.lessons.register('2.2', {
  mount(ctx, frame, lesson) {
    const { el } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'shape', label: 'ارسم شكلًا' },
      { id: 'fill', label: 'لوّن واملأ' },
      { id: 'eraser', label: 'الممحاة' },
      { id: 'undo', label: 'تراجع وأعد' },
      { id: 'save', label: 'احفظ رسمتك' },
      { id: 'quiz', label: 'تحدي المرسم' },
    ]);

    const room = W.interiors.atelierRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اختر أداة الدائرة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = (t, sub) => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); if (sub) speak.appendChild(el('span.en', { text: sub })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();
    // a pulsing ring on the paper showing exactly where to drag
    function ring(x, y, w, h) {
      const z = el('div.draw-zone', { dataset: { zone: '1' }, style: `left:${R.canvas.x + x / 960 * R.canvas.w}%;top:${R.canvas.y + y / 620 * R.canvas.h}%;width:${w / 960 * R.canvas.w}%;height:${h / 620 * R.canvas.h}%;border-radius:50%` });
      stage.appendChild(z);
      ctx.after(3000, () => z.remove());
      return z;
    }

    const P = W.paint.make(ctx, { host: stage, pos: R.canvas });
    const bar = W.paint.bar(ctx, P, {
      host: stage, stage, pos: R.bar,
      tools: [
        { id: 'circle', aria: 'دائرة' }, { id: 'rect', aria: 'مستطيل' }, { id: 'tri', aria: 'مثلث' },
        { id: 'fill', aria: 'تعبئة' }, { id: 'eraser', aria: 'ممحاة' },
        { id: 'undo', aria: 'تراجع', act() { if (P.undo()) onUndo(); } },
        { id: 'redo', aria: 'إعادة', act() { if (P.redo()) onRedo(); } },
        { id: 'save', aria: 'حفظ', act: () => onSave() },
      ],
    });
    P.setFillMode(false);
    P.setSize(9);

    function chipAt(x, y, ar, en) {
      const chip = el('div.term-reveal', { style: `left:${x}%;top:${y}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2400, () => chip.remove());
    }
    const chipCanvas = (ar, en) => chipAt(R.canvas.x + R.canvas.w / 2, R.canvas.y + 4, ar, en);
    const hl = id => { Object.values(bar.btns).forEach(b => b.classList.remove('hl')); if (id && bar.btns[id]) bar.btns[id].classList.add('hl'); };

    /* ---------- the guided path ---------- */
    let phase = 'shape', quizApi = null, undone = false, blot0 = 0;
    hl('circle');
    ctx.after(90, () => {
      guide.step({
        sayAr: 'اختر أداة الدائرة',
        simplerAr: 'اضغط أداة الدائرة المضيئة',
        src: bar.btns.circle,
        demo: () => guide.handTap(bar.btns.circle, 1),
      });
    });
    ctx.listen(bar.btns.circle, 'click', () => {
      if (phase !== 'shape') return;
      guide.clearSource();
      ctx.after(60, () => {
        guide.step({
          sayAr: 'اسحب داخل الحلقة المضيئة',
          simplerAr: 'ضع إصبعك في الحلقة واسحب',
          demo: () => ring(300, 180, 260, 240),
        });
        ring(300, 180, 260, 240);
      });
    });
    const terms = { shape: false, fill: false, eraser: false, undo: false, redo: false, save: false };

    P.on('commit', info => {
      if (info.tool === 'shape' && !terms.shape) {
        terms.shape = true;
        chipCanvas('شكل', 'Shape');
      }
      if (phase === 'shape' && info.tool === 'shape' && info.shape === 'circle' && info.bbox.w > 60) {
        check.done('shape');
        phase = 'fill';
        guide.done();
        guide.confirm('رسمتَ الدائرة', P.wrap);
        ctx.after(700, () => guide.step({
          sayAr: 'اختر لونًا، ثم اضغط داخل الدائرة',
          simplerAr: 'اضغط لونًا ثم اضغط وسط الدائرة',
          src: bar.btns.fill,
          demo: () => guide.handTap(bar.btns.fill, 1),
        }));
        hl('fill');
        bar.root.querySelector('.swatch').classList.add('hl');
      } else if (phase === 'fill' && info.tool === 'fill' && info.painted > 800) {
        terms.fill = true;
        chipCanvas('تعبئة', 'Fill');
        guide.done();
        guide.confirm('لوّنتَ الدائرة', P.wrap);
        check.done('fill');
        phase = 'eraser';
        // a gray blot sneaks onto the paper
        P.stamp(g => {
          g.fillStyle = '#8d8d99';
          g.beginPath(); g.ellipse(P.CW * .78, P.CH * .3, 52, 34, .4, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.ellipse(P.CW * .82, P.CH * .36, 20, 14, 0, 0, Math.PI * 2); g.fill();
        });
        /* R2 item 2.8: measure the blot that was actually stamped, so the
         * activity recognises real work — 75% erased is an achievement. */
        blot0 = P.countColor('#8d8d99', 50);
        ctx.after(700, () => guide.step({
          sayAr: 'اختر الممحاة، ثم امسح اللطخة الرمادية',
          simplerAr: 'اضغط الممحاة واسحبها فوق اللطخة',
          src: bar.btns.eraser,
          demo: () => guide.handTap(bar.btns.eraser, 1),
        }));
        hl('eraser');
        bar.root.querySelector('.swatch').classList.remove('hl');
      } else if ((phase === 'eraser' || phase === 'q3') && (info.tool === 'fill' || info.tool === 'shape')) {
        /* item 11: protect the exercise — the blot is removed by ERASING only */
        P.undo();
        W.fx.softHint(bar.btns.eraser);
        say('اضغط الممحاة أولًا، ثم اسحبها فوق اللطخة');
        W.fx.glow(bar.btns.eraser);
      } else if (phase === 'eraser' && info.tool === 'eraser') {
        const left = P.countColor('#8d8d99', 50);
        if (left <= Math.max(60, blot0 * 0.25)) {
          terms.eraser = true;
          chipCanvas('ممحاة', 'Eraser');
          guide.done();
          guide.confirm('مسحتَ اللطخة', P.wrap);
          check.done('eraser');
          phase = 'undo';
          ctx.after(700, () => guide.step({
            sayAr: 'اختر المستطيل وارسمه على الورقة',
            simplerAr: 'اضغط أداة المستطيل ثم اسحب',
            src: bar.btns.rect,
            demo: () => guide.handTap(bar.btns.rect, 1),
          }));
          hl('rect');
        } else {
          const gone = blot0 ? Math.round((1 - left / blot0) * 100) : 0;
          say(gone >= 40 ? 'أحسنت — واصل المسح قليلًا' : 'اسحب الممحاة فوق اللطخة');
        }
      } else if (phase === 'undo' && info.tool === 'shape' && info.shape === 'rect') {
        guide.step({
          sayAr: 'اضغط سهم التراجع لمحو المستطيل',
          simplerAr: 'اضغط السهم المضيء',
          src: bar.btns.undo,
          demo: () => guide.handTap(bar.btns.undo, 1),
        });
        hl('undo');
      } else if (phase === 'q1' && quizApi && info.tool === 'shape' && info.shape === 'tri' && info.bbox.w > 50) {
        quizApi.correct(P.wrap);
      } else if (phase === 'q2' && quizApi && info.tool === 'fill' && info.color === '#3f9e6e' && info.painted > 400) {
        quizApi.correct(P.wrap);
      } else if (phase === 'q3' && quizApi && info.tool === 'eraser') {
        if (P.countColor('#8d8d99', 50) <= Math.max(60, blot0 * 0.25)) quizApi.correct(P.wrap);
      }
    });

    function onUndo() {
      if (phase === 'undo' && !undone) {
        undone = true;
        terms.undo = true;
        chipCanvas('تراجع', 'Undo');
        guide.confirm('تراجعتَ عن المستطيل', bar.btns.undo);
        guide.step({
          sayAr: 'اضغط سهم الإعادة ليعود المستطيل',
          simplerAr: 'اضغط السهم الآخر المضيء',
          src: bar.btns.redo,
          demo: () => guide.handTap(bar.btns.redo, 1),
        });
        hl('redo');
      }
    }
    function onRedo() {
      if (phase === 'undo' && undone) {
        terms.redo = true;
        chipCanvas('إعادة', 'Redo');
        guide.confirm('أعدتَ المستطيل', bar.btns.redo);
        check.done('undo');
        phase = 'save';
        guide.step({
          sayAr: 'اضغط زرّ الحفظ لتحفظ رسمتك',
          simplerAr: 'اضغط زرّ الحفظ المضيء',
          src: bar.btns.save,
          demo: () => guide.handTap(bar.btns.save, 1),
        });
        hl('save');
      }
    }
    function onSave() {
      /* item 12: the Save button always opens the visible «حفظ باسم» dialog;
       * only a real حفظ inside it saves, shows the thumbnail, and advances. */
      if (phase === 'save') {
        W.fixkit.saveDialog(ctx, P, {
          host: stage, id: 'a22', nameAr: 'دائرتي الأولى',
          onSaved(ok) {
            if (!ok) return;
            terms.save = true;
            chipCanvas('حفظ', 'Save');
            guide.done();
            guide.confirm('حفظتَ رسمتك', bar.btns.save);
            say('تم حفظ رسمتك');
            check.done('save');
            phase = 'wait';
            hl(null);
            ctx.after(1600, startQuiz);
          },
        });
      } else if (phase === 'q4' && quizApi) {
        W.fixkit.saveDialog(ctx, P, {
          host: stage, id: 'a22', nameAr: 'دائرتي الأولى',
          onSaved(ok) { if (ok) quizApi.correct(bar.btns.save); },
        });
      } else {
        W.fixkit.saveDialog(ctx, P, { host: stage, id: 'a22-draft', nameAr: 'مسودة', onSaved() {} });
      }
    }

    /* ---------- the atelier challenge ---------- */
    function startQuiz() {
      guide.clearStage({ remove: ['.draw-zone', '.choice-row'] });
      say('تحدي المرسم!');
      const tasks = [
        { mount(st, api) { quizApi = api; phase = 'q1'; say('ارسم مثلثًا كبيرًا'); hl('tri'); } },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            say('املأه بالأخضر');
            hl('fill');
            const sw = bar.root.querySelector('.swatch[data-swatch="#3f9e6e"]');
            if (sw) sw.classList.add('hl');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q3';
            bar.root.querySelectorAll('.swatch.hl').forEach(x => x.classList.remove('hl'));
            P.stamp(g => { g.fillStyle = '#8d8d99'; g.beginPath(); g.ellipse(P.CW * .2, P.CH * .75, 44, 30, -.3, 0, Math.PI * 2); g.fill(); });
            blot0 = P.countColor('#8d8d99', 50);
            say('لطخة جديدة — امسحها');
            hl('eraser');
          },
        },
        { mount(st, api) { quizApi = api; phase = 'q4'; say('احفظ عملك الجميل'); hl('save'); } },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          hl(null);
          W.rig.complete(ctx, lesson, { impactAr: 'عُلّقت أول رسمة في الاستديو!' });
        },
      });
    }
  },
});

/* ==== lessons/l2-3.js ==== */
/* Lesson 2.3 — لنتدرب على الأشكال.
 * Unique mechanic: THE BLUEPRINT BUILD. Ghost outlines of a little Omani house wait
 * on the paper; the child constructs it piece by piece — each drawn shape must match
 * the guide's kind, place and size, and the ghost turns solid when it does. */
W.lessons.register('2.3', {
  mount(ctx, frame, lesson) {
    const { el } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'base', label: 'الأساس' },
      { id: 'roof', label: 'السقف' },
      { id: 'door', label: 'الباب' },
      { id: 'window', label: 'النافذة' },
      { id: 'quiz', label: 'تحدي البناء' },
    ]);

    const room = W.interiors.atelierRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اختر المستطيل البُنّي', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = t => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();
    const lbl = W.label.group(ctx, stage);

    const P = W.paint.make(ctx, { host: stage, pos: R.canvas });
    const bar = W.paint.bar(ctx, P, {
      host: stage, stage, pos: R.bar,
      tools: [
        { id: 'circle', aria: 'دائرة' }, { id: 'rect', aria: 'مستطيل' }, { id: 'tri', aria: 'مثلث' },
        { id: 'fill', aria: 'تعبئة' },
        { id: 'eraser', aria: 'ممحاة' },
        { id: 'undo', aria: 'تراجع', act() { P.undo(); } },
        { id: 'save', aria: 'حفظ', act() { W.fixkit.saveDialog(ctx, P, { host: stage, id: 'a23', nameAr: 'بيتي', onSaved() {} }); } },
      ],
      colors: ['#8a5a30', '#e2574c', '#4c7fe2', '#ffd166', '#3f9e6e'],
    });
    P.setSize(9); P.setFillMode(true);
    const hl = id => { Object.values(bar.btns).forEach(b => b.classList.remove('hl')); if (id && bar.btns[id]) bar.btns[id].classList.add('hl'); };

    /* the blueprint ghosts */
    const Z = {
      base: { kind: 'rect', x: 300, y: 330, w: 360, h: 210 },
      roof: { kind: 'tri', x: 270, y: 190, w: 420, h: 140 },
      door: { kind: 'rect', x: 430, y: 420, w: 90, h: 120 },
      window: { kind: 'circle', x: 340, y: 370, w: 80, h: 80 },
      window2: { kind: 'circle', x: 540, y: 370, w: 80, h: 80 },
    };
    function ghost(g, z, on) {
      g.setLineDash([12, 10]);
      g.lineWidth = 4; g.strokeStyle = on ? 'rgba(63,158,110,.9)' : 'rgba(90,110,130,.55)';
      g.beginPath();
      if (z.kind === 'rect') g.rect(z.x, z.y, z.w, z.h);
      else if (z.kind === 'circle') g.ellipse(z.x + z.w / 2, z.y + z.h / 2, z.w / 2, z.h / 2, 0, 0, Math.PI * 2);
      else { g.moveTo(z.x + z.w / 2, z.y); g.lineTo(z.x + z.w, z.y + z.h); g.lineTo(z.x, z.y + z.h); g.closePath(); }
      g.stroke();
      g.setLineDash([]);
    }
    P.stamp(g => { ['base', 'roof', 'door', 'window'].forEach(k => ghost(g, Z[k])); });

    function matches(z, bb, kind) {
      if (kind !== z.kind) return false;
      const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
      const zx = z.x + z.w / 2, zy = z.y + z.h / 2;
      return Math.abs(cx - zx) < z.w * .45 && Math.abs(cy - zy) < z.h * .5 &&
             bb.w > z.w * .5 && bb.w < z.w * 1.7 && bb.h > z.h * .45 && bb.h < z.h * 1.8;
    }

    const ORDER = [
      { id: 'base', tool: 'rect', color: '#8a5a30', pick: 'اختر المستطيل البُنّي', draw: 'ارسمه فوق قاعدة البيت', partAr: 'الأساس', term: ['مستطيل', 'Rectangle'] },
      { id: 'roof', tool: 'tri', color: '#e2574c', pick: 'اختر المثلث الأحمر', draw: 'ارسمه فوق سقف البيت', partAr: 'السقف', term: ['مثلث', 'Triangle'] },
      { id: 'door', tool: 'rect', color: '#4c7fe2', pick: 'اختر المستطيل الأزرق', draw: 'ارسمه فوق باب البيت', partAr: 'الباب', term: null },
      { id: 'window', tool: 'circle', color: '#ffd166', pick: 'اختر الدائرة الصفراء', draw: 'ارسمها فوق نافذة البيت', partAr: 'النافذة', term: ['دائرة', 'Circle'] },
    ];
    let step = 0, phase = 'build', quizApi = null, rays = 0;
    /* two beats per shape: 1) choose the exact tool+colour, 2) draw at the lit target.
     * A supporting label names the part; the instruction always states the action. */
    let beat = 'pick';
    function ask() {
      const o = ORDER[step];
      if (!o) return;               // guard: build phase finished; no stale ORDER access
      beat = 'pick';
      hl(o.tool);
      const sw = bar.root.querySelector(`.swatch[data-swatch="${o.color}"]`);
      bar.root.querySelectorAll('.swatch.hl').forEach(x => x.classList.remove('hl'));
      if (sw) sw.classList.add('hl');
      guide.clearStage({ keepLabels: true });
      Object.keys(bar.btns).forEach(k => { if (k !== o.tool) lbl.mini(bar.btns[k]); });
      const tt = W.paint.TOOL_TERMS[o.tool];
      if (tt) { lbl.reveal(bar.btns[o.tool], tt[0], tt[1], { pos: 'above', id: 'tool-' + o.tool, keepFull: true }); lbl.full(bar.btns[o.tool]); }
      guide.arrow(bar.btns[o.tool], 'up', { len: 44, ky: 0 });
      guide.step({
        sayAr: o.pick,
        simplerAr: 'اضغط الأداة المضيئة',
        src: bar.btns[o.tool],
        demo: () => { guide.handTap(bar.btns[o.tool], 1); if (sw) W.fx.glow(sw); },
      });
      partTag(o);
    }
    function askDraw() {
      const o = ORDER[step];
      if (!o) return;               // guard: no stale ORDER access after build phase
      beat = 'draw';
      guide.clearStage({ keepLabels: true });
      guide.clearSource();
      guide.step({
        sayAr: o.draw,
        simplerAr: 'ارسم داخل الخطّ المنقّط المضيء',
        demo: () => { lightZone(Z[o.id]); },
      });
      lightZone(Z[o.id]);
    }
    // a small supporting label naming the part, without replacing the action wording
    let tag = null;
    function partTag(o) {
      if (tag) tag.remove();
      tag = el('div.draw-tag', { text: o.partAr, style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 2}%` });
      stage.appendChild(tag);
    }
    // pulse the exact ghost outline the child must draw over
    function lightZone(z) {
      const box = el('div.draw-zone', {
        dataset: { zone: '1' },
        style: `left:${R.canvas.x + z.x / P.CW * R.canvas.w}%;top:${R.canvas.y + z.y / P.CH * R.canvas.h}%;` +
               `width:${z.w / P.CW * R.canvas.w}%;height:${z.h / P.CH * R.canvas.h}%;` +
               `border-radius:${z.kind === 'circle' ? '50%' : 'calc(var(--su)*6)'}`,
      });
      stage.appendChild(box);
      ctx.after(2600, () => box.remove());
      return box;
    }
    ctx.after(80, ask);
    // choosing the tool advances the beat
    Object.keys(bar.btns).forEach(k => {
      ctx.listen(bar.btns[k], 'click', () => {
        if (phase !== 'build' || beat !== 'pick') return;
        if (ORDER[step] && k === ORDER[step].tool) ctx.after(60, askDraw);
      });
    });

    function chipCanvas(ar, en) {
      const chip = el('div.term-reveal', { style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 4}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2300, () => chip.remove());
    }

    P.on('commit', info => {
      if (!info || (info.tool !== 'shape' && info.tool !== 'fill')) return;
      if (phase === 'build') {
        const o = ORDER[step];
        if (!o) return;             // guard: build finished, ignore late commits
        if (matches(Z[o.id], info.bbox, info.shape)) {
          if (o.term) chipCanvas(o.term[0], o.term[1]);
          guide.done();
          guide.confirm('رسمتَ ' + o.partAr, P.wrap);
          check.done(o.id);
          step++;
          // keep the guide visible: re-stamp the ghosts for parts NOT yet drawn,
          // so a filled shape never hides where the next shape must go (item 9).
          if (step < ORDER.length) {
            const remaining = ORDER.slice(step).map(r => r.id);
            P.stamp(g => { remaining.forEach(k => { if (Z[k]) ghost(g, Z[k]); }); });
            ctx.after(700, ask);
          } else { phase = 'wait'; if (tag) tag.remove(); say('اكتمل البيت!'); hl(null); ctx.after(1600, startQuiz); }
        } else {
          P.undo();
          W.fx.softHint(P.wrap);
          say(o.draw);
          lightZone(Z[o.id]);
        }
      } else if (phase === 'q1' && quizApi) {
        if (matches(Z.window2, info.bbox, info.shape)) quizApi.correct(P.wrap);
        else { P.undo(); quizApi.wrong(P.wrap); }
      } else if (phase === 'q2' && quizApi && info.tool === 'fill') {
        const c = P.sampleAt(Z.roof.x + Z.roof.w / 2, Z.roof.y + Z.roof.h - 30);
        if (c[0] > 160 && c[1] < 130) quizApi.correct(P.wrap);
      } else if (phase === 'q3' && quizApi && info.tool === 'shape') {
        // a small sun: yellow circle in the sky, up-left area
        if (info.shape === 'circle' && info.color === '#ffd166' && info.bbox.y < 160 && info.bbox.w > 40) quizApi.correct(P.wrap);
        else { P.undo(); quizApi.wrong(P.wrap); }
      }
      void rays;
    });

    function startQuiz() {
      guide.clearStage({ remove: ['.draw-zone', '.draw-tag', '.choice-row'] });
      say('تحدي البناء!');
      const tasks = [
        {
          mount(st, api) {
            quizApi = api; phase = 'q1';
            P.stamp(g => ghost(g, Z.window2, true));
            say('نافذة ثانية مثل الأولى');
            hl('circle');
          },
        },
        {
          mount(st, api) {
            quizApi = api; phase = 'q2';
            say('املأ السقف بالأحمر إن بَهُت');
            // fade the roof so the bucket has honest work
            P.stamp(g => { g.globalAlpha = .35; g.fillStyle = '#fdfaf2'; g.beginPath(); g.moveTo(Z.roof.x + Z.roof.w / 2, Z.roof.y + 8); g.lineTo(Z.roof.x + Z.roof.w - 10, Z.roof.y + Z.roof.h - 4); g.lineTo(Z.roof.x + 10, Z.roof.y + Z.roof.h - 4); g.closePath(); g.fill(); g.globalAlpha = 1; });
            hl('fill');
          },
        },
        { mount(st, api) { quizApi = api; phase = 'q3'; say('أضف شمسًا صفراء في السماء'); hl('circle'); } },
      ];
      W.assess.run(ctx, stage, tasks, {
        onDone() {
          check.done('quiz');
          phase = 'done';
          hl(null);
          P.save('a23', 'بيتي الصغير');
          W.rig.complete(ctx, lesson, { impactAr: 'ارتفع برج الأشكال في الاستديو!' });
        },
      });
    }
  },
});

/* ==== lessons/l2-4.js ==== */
/* Lesson 2.4 — دمج الأشكال: الشمس.
 * Unique mechanic: MERGE INTO ONE PICTURE. The curriculum sun is built by combining
 * shapes with intent: a big outlined circle, a chosen stroke thickness, yellow fill,
 * eight counted rays, then a poured sky — merging shapes makes a picture. */
W.lessons.register('2.4', {
  mount(ctx, frame, lesson) {
    const { el } = W.util;
    const stage = frame.stage;

    const check = new W.assess.Checklist(frame.rail, [
      { id: 'circle', label: 'دائرة الشمس' },
      { id: 'stroke', label: 'سُمك الحد' },
      { id: 'rays', label: 'ثمانية أشعة' },
      { id: 'sky', label: 'املأ السماء' },
      { id: 'save', label: 'احفظ الشمس' },
      { id: 'quiz', label: 'تحدي الشمس' },
    ]);

    const room = W.interiors.atelierRoom();
    const art = el('div', { style: 'position:absolute;inset:0' });
    art.appendChild(room.svg);
    stage.appendChild(art);
    stage.appendChild(el('div.grade'));
    const R = room.refs;

    const speak = el('div.speak', { text: 'اختر الدائرة', dataset: { speak: '1' } });
    stage.appendChild(speak);
    const say = t => { speak.innerHTML = ''; speak.appendChild(el('span', { text: t })); };
    const guide = W.guide.group(ctx, stage, { say });
    guide.help();
    function ring(x, y, w, h) {
      const z = el('div.draw-zone', { dataset: { zone: '1' }, style: `left:${R.canvas.x + x / 960 * R.canvas.w}%;top:${R.canvas.y + y / 620 * R.canvas.h}%;width:${w / 960 * R.canvas.w}%;height:${h / 620 * R.canvas.h}%;border-radius:50%` });
      stage.appendChild(z);
      ctx.after(3200, () => z.remove());
      return z;
    }

    const P = W.paint.make(ctx, { host: stage, pos: R.canvas });
    const bar = W.paint.bar(ctx, P, {
      host: stage, stage, pos: R.bar,
      tools: [
        { id: 'circle', aria: 'دائرة' }, { id: 'line', aria: 'خط' }, { id: 'fill', aria: 'تعبئة' },
        { id: 'thin', aria: 'حدّ رفيع', glyph: 'line', act() { P.setSize(4); mark('thin'); } },
        { id: 'thick', aria: 'حدّ سميك', glyph: 'brush', act() { P.setSize(14); mark('thick'); } },
        { id: 'undo', aria: 'تراجع', act() { P.undo(); } },
        { id: 'save', aria: 'حفظ', act: () => onSave() },
      ],
      colors: ['#ffd166', '#f2b24c', '#e2574c', '#7ec3e8', '#fdfaf2'],
    });
    P.setFillMode(true); P.setSize(8); P.setColor('#ffd166');
    const hl = id => { Object.values(bar.btns).forEach(b => b.classList.remove('hl')); if (id && bar.btns[id]) bar.btns[id].classList.add('hl'); };
    function mark(id) {
      ['thin', 'thick'].forEach(k => bar.btns[k].classList.remove('on'));
      bar.btns[id].classList.add('on');
      if (phase === 'stroke') {
        chipCanvas('سُمك الحد', 'Stroke');
        guide.done();
        guide.confirm('اخترتَ الحدّ السميك', bar.btns.thick);
        check.done('stroke');
        phase = 'rays';
        hl('line');
        ctx.after(700, () => {
          demoRay();
          guide.step({
            sayAr: 'اختر الخط، ثم ارسم شعاعًا مثل هذا',
            simplerAr: 'اسحب خطًّا قصيرًا خارج حافة الشمس',
            src: bar.btns.line,
            demo: () => { guide.handTap(bar.btns.line, 1); demoRay(); },
          });
        });
      }
      W.audio.click();
    }
    // one animated example ray, drawn for the child before they draw the rest
    function demoRay() {
      if (!sun) return;
      const a = -Math.PI / 2;
      const x1 = sun.cx + Math.cos(a) * sun.r * 1.12, y1 = sun.cy + Math.sin(a) * sun.r * 1.12;
      const x2 = sun.cx + Math.cos(a) * sun.r * 1.62, y2 = sun.cy + Math.sin(a) * sun.r * 1.62;
      const toPct = (x, y) => ({ x: R.canvas.x + x / P.CW * R.canvas.w, y: R.canvas.y + y / P.CH * R.canvas.h });
      const p1 = toPct(x1, y1), p2 = toPct(x2, y2);
      const g = W.util.sv('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: 'position:absolute;inset:0;width:100%;height:100%;z-index:29;pointer-events:none;overflow:visible' });
      const ln = W.util.sv('line', { x1: p1.x, y1: p1.y, x2: p1.x, y2: p1.y, stroke: '#ffd166', 'stroke-width': 4, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round', style: 'filter:drop-shadow(0 0 5px rgba(255,209,102,1))' });
      g.appendChild(ln);
      stage.appendChild(g);
      const t0 = performance.now();
      (function step(now) {
        if (!g.isConnected) return;
        const k = Math.min(1, (now - t0) / 800);
        ln.setAttribute('x2', p1.x + (p2.x - p1.x) * k);
        ln.setAttribute('y2', p1.y + (p2.y - p1.y) * k);
        if (k < 1) requestAnimationFrame(step);
        else ctx.after(700, () => { g.style.transition = 'opacity .4s'; g.style.opacity = '0'; ctx.after(420, () => g.remove()); });
      })(performance.now());
    }
    function chipCanvas(ar, en) {
      const chip = el('div.term-reveal', { style: `left:${R.canvas.x + R.canvas.w / 2}%;top:${R.canvas.y + 4}%` });
      chip.appendChild(el('span.t-ar', { text: ar }));
      chip.appendChild(el('span.t-en', { text: en }));
      stage.appendChild(chip);
      ctx.after(2300, () => chip.remove());
    }

    let phase = 'circle', sun = null, rays = 0, quizApi = null, extraRays = 0;
    hl('circle');
    ctx.after(90, () => {
      guide.step({
        sayAr: 'اختر الدائرة',
        simplerAr: 'اضغط أداة الدائرة المضيئة',
        src: bar.btns.circle,
        demo: () => guide.handTap(bar.btns.circle, 1),
      });
    });
    ctx.listen(bar.btns.circle, 'click', () => {
      if (phase !== 'circle') return;
      guide.clearSource();
      ctx.after(60, () => {
        guide.step({
          sayAr: 'ارسمها داخل الحلقة',
          simplerAr: 'اسحب من حافة الحلقة إلى حافتها الأخرى',
          demo: () => ring(330, 150, 300, 300),
        });
        ring(330, 150, 300, 300);
      });
    });

    function nearRing(bb) {
      if (!sun) return false;
      const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
      const d = Math.hypot(cx - sun.cx, cy - sun.cy);
      return d > sun.r * .7 && d < sun.r * 2.6 && Math.max(bb.w, bb.h) > 34;
    }

    P.on('commit', info => {
      if (phase === 'circle' && info.tool === 'shape' && info.shape === 'circle' && info.bbox.w > 140) {
        sun = { cx: info.bbox.x + info.bbox.w / 2, cy: info.bbox.y + info.bbox.h / 2, r: info.bbox.w / 2 };
        chipCanvas('دمج الأشكال', 'Combining Shapes');
