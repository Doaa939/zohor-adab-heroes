/* ==== engine/storage.js — anonymous local progress (offline, file://-safe) ==== */
(function (W) {
  const KEY = 'wahat.g3.s2.settings.v1';   /* معزول للفصل الثاني وحده */
  const blank = () => ({
    settings: { seenIntro: false, sound: true, reducedMotion: false, lowPerf: false },
    progress: {},                     // lessonId -> {opened, steps:{}, done, masteredAt}
    stats: { sessions: 0, lessonOpens: 0, msActive: 0, firstRun: Date.now(), lastRun: Date.now() },
  });
  let mem = blank(), ok = true;
  // teacher preview: writes are diverted to a scratch clone and never persisted
  let previewing = false, realSnapshot = null;

  function load() { try { const raw = localStorage.getItem(KEY); if (raw) mem = Object.assign(blank(), JSON.parse(raw)); } catch (e) { ok = false; } }
  function save() { if (!ok || previewing) return; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { ok = false; } }
  load();
  mem.stats.sessions++; mem.stats.lastRun = Date.now(); save();

  W.store = {
    get settings() { return mem.settings; },
    get progress() { return mem.progress; },
    get stats() { return mem.stats; },
    get storageOk() { return ok; },
    get previewing() { return previewing; },

    setSetting(k, v) { mem.settings[k] = v; save(); },

    lessonOpened(id) { const p = mem.progress[id] || (mem.progress[id] = { opened: 0, steps: {}, done: false }); p.opened++; mem.stats.lessonOpens++; save(); },
    stepDone(id, step) { const p = mem.progress[id] || (mem.progress[id] = { opened: 1, steps: {}, done: false }); p.steps[step] = true; save(); },
    stepIsDone(id, step) { return !!(mem.progress[id] && mem.progress[id].steps[step]); },
    /* mastery, not points */
    markMastered(id, criteria) {
      const p = mem.progress[id] || (mem.progress[id] = { opened: 1, steps: {}, done: false });
      const all = (criteria || []).every(c => p.steps[c]);
      if (all && !p.done) { p.done = true; p.masteredAt = Date.now(); }
      save(); return p.done;
    },
    isMastered(id) { return !!(mem.progress[id] && mem.progress[id].done); },
    masteredCount() { return Object.values(mem.progress).filter(p => p.done).length; },
    unitMastered(unit, lessons) { return lessons.filter(l => l.unit === unit && this.isMastered(l.id)).length; },

    /* clear only one lesson (teacher tool) */
    clearLesson(id) { delete mem.progress[id]; save(); },
    reset() { mem = blank(); save(); },
    /* يمسح مفاتيح هذه المنصة فقط ولا يلمس أي مفتاح آخر في المتصفح */
    clearThisPlatformOnly() {
      ['wahat.g3.s2.settings.v1', 'wahat.g3.s2.v1'].forEach(k => {
        try { localStorage.removeItem(k); } catch (e) {}
      });
      mem = blank();
    },
    get key() { return KEY; },
    export() { return JSON.parse(JSON.stringify(mem)); },

    /* ---- Teacher preview: enter/exit without touching real data ---- */
    beginPreview() { if (previewing) return; realSnapshot = JSON.stringify(mem); previewing = true; },
    endPreview() { if (!previewing) return; try { mem = JSON.parse(realSnapshot); } catch (e) {} previewing = false; realSnapshot = null; },
  };

  /* local active-time only; never transmitted */
  let t0 = Date.now();
  setInterval(() => { if (!document.hidden && !previewing) { mem.stats.msActive += Date.now() - t0; save(); } t0 = Date.now(); }, 15000);
})(window.MNARA);

/* ==== engine/audio.js — offline WebAudio cues (no external files) ====
 * Minimal-audio launch: subtle interaction feedback generated at runtime.
 * Pronunciation audio is only offered where a real clip exists (none in CP1),
 * so no fake listen button is ever shown.
 */
(function (W) {
  let ctx = null;
  function ac() {
    if (ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    return ctx;
  }
  function on() { return W.store.settings.sound !== false; }
  function tone(freq, dur, type, gain) {
    if (!on()) return;
    const a = ac(); if (!a) return;
    try {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(a.destination);
      const t = a.currentTime;
      g.gain.exponentialRampToValueAtTime(gain || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  W.audio = {
    resume() { const a = ac(); if (a && a.state === 'suspended') a.resume(); },
    click() { tone(440, 0.06, 'triangle', 0.08); },
    ok() { tone(620, 0.09, 'sine', 0.1); setTimeout(() => tone(880, 0.12, 'sine', 0.1), 80); },
    no() { tone(220, 0.16, 'sawtooth', 0.06); },
    pick() { tone(520, 0.05, 'triangle', 0.07); },
    drop() { tone(360, 0.08, 'sine', 0.09); },
    chime() { tone(660, 0.14, 'sine', 0.09); setTimeout(() => tone(990, 0.18, 'sine', 0.08), 110); },

    get isOn() { return on(); },
  };
})(window.MNARA);

/* ==== engine/scd.js — Scene-Cleanup Controller (shared contract) ====
 * Every transient artifact (arrow, hand, connection line, drag trail, highlight,
 * tutorial overlay, tooltip, previous-step instruction) and every temporary

  const SCD = {
    /* register a DOM artifact created for the current stage */

/* ==== world/unitgallery.js — shared environmental lesson-index builder (CP2) ====
 * Renders any unit's lessons as an environmental gallery of "stations" that match
 * the approved CP1R2 look. Each unit passes a theme (colors + station vignette) so
 * the three worlds stay visually distinct while sharing layout, readability, and
 * accessibility (centered, unclipped titles at 1366x768, available from start).
 */
(function (W) {
  const { el } = W.util;
  const C = () => W.citadel;

  // theme per unit-world
  const THEMES = {
    lab: { wall: [[0, '#2A2620'], [.5, '#241E17'], [1, '#181410']], accent: '#E7A063', accent2: '#F3C57E', arch: '#C57B3D', lamp: 'rgba(231,160,99,.16)' },

    obs: { wall: [[0, '#1E3348'], [.5, '#182A3B'], [1, '#111E2C']], accent: '#6FA0DA', accent2: '#9FC4EA', arch: '#6FA0DA', lamp: 'rgba(111,160,218,.14)' },
  };

  // station vignette per unit kind (distinct silhouettes)
  function vignette(kind, featured, th) {
    const svg = C().E('svg', { viewBox: '0 0 180 118', width: '100%', height: '100%' });
    C().S(svg, 'rect', { x: 0, y: 0, width: 180, height: 118, fill: featured ? '#1b1712' : '#151109' });
    if (kind === 'lab') {
      // a workstation screen with data

      C().S(svg, 'rect', { x: 52, y: 30, width: 76, height: 40, rx: 2, fill: '#0a2029' });
      C().S(svg, 'path', { d: 'M58,64 l14,-16 l10,9 l10,-12 l14,19 Z', fill: '#3B9188', opacity: .85 });
      C().S(svg, 'circle', { cx: 66, cy: 44, r: 5, fill: th.accent });
      C().S(svg, 'rect', { x: 78, y: 86, width: 24, height: 8, rx: 2, fill: '#6B421F' });
      if (featured) C().S(svg, 'circle', { cx: 120, cy: 30, r: 5, fill: '#F5D451', class: 'anim-glow' });
    } else if (kind === 'obs') {
      // a globe + constellation
      C().S(svg, 'circle', { cx: 90, cy: 52, r: 26, fill: 'none', stroke: th.accent, 'stroke-width': 1.6 });
      C().S(svg, 'ellipse', { cx: 90, cy: 52, rx: 26, ry: 9, fill: 'none', stroke: th.accent, 'stroke-width': 1, opacity: .6 });
      C().S(svg, 'line', { x1: 90, y1: 26, x2: 90, y2: 78, stroke: th.accent, 'stroke-width': 1, opacity: .6 });
      C().S(svg, 'circle', { cx: 90, cy: 52, r: 4, fill: th.accent2, class: featured ? 'anim-glow' : '' });
      [[124, 30], [56, 34], [116, 82]].forEach(([x, y]) => C().S(svg, 'circle', { cx: x, cy: y, r: 2, fill: th.accent2 }));
    } else {
      // hall: manuscript page (kept from approved design)
      C().S(svg, 'path', { d: 'M40,110 L40,44 Q90,8 140,44 L140,110 Z', fill: 'rgba(95,184,174,.10)', stroke: '#3B9188', 'stroke-width': 1.4, opacity: .6 });
      C().S(svg, 'rect', { x: 30, y: 86, width: 120, height: 10, rx: 3, fill: '#6B421F' });
      C().S(svg, 'rect', { x: 62, y: 30, width: 56, height: 60, rx: 3, fill: '#FBF6EC', class: featured ? 'anim-float' : '' });
      C().S(svg, 'rect', { x: 72, y: 38, width: 36, height: 4, rx: 2, fill: '#3B9188' });
      C().S(svg, 'rect', { x: 72, y: 46, width: 28, height: 3, rx: 1.5, fill: '#C57B3D' });
      C().S(svg, 'rect', { x: 72, y: 53, width: 32, height: 3, rx: 1.5, fill: '#B49B7C' });
      if (featured) C().S(svg, 'circle', { cx: 132, cy: 30, r: 6, fill: '#F5D451', class: 'anim-glow' });
    }
    return svg;
  }

  /* build(ctx, opts):
   *   opts.unit, opts.kind ('lab'|'hall'|'obs'), opts.titleAr, opts.titleEn,
   *   opts.featured {id:true}, opts.entries [{id,code,title,titleEn,kind:'lesson'|'special',route}],
   *   opts.projectBtn {label, onClick} optional
   */
  function build(ctx, opts) {
    const th = THEMES[opts.kind] || THEMES.lab;
    const gal = el('div', { class: 'gallery cit-arrive' });
    const bg = el('div', { class: 'clayer cl-sky', style: { zIndex: '1' } });
    const bsvg = C().E('svg', { viewBox: '0 0 1280 720', width: '100%', height: '100%', preserveAspectRatio: 'xMidYMid slice' });
    const defs = C().S(bsvg, 'defs', {});
    const g = C().E('linearGradient', { id: 'gw_' + opts.kind, x1: 0, y1: 0, x2: 0, y2: 1 });
    th.wall.forEach(([o, c]) => g.appendChild(C().E('stop', { offset: o, 'stop-color': c }))); defs.appendChild(g);
    C().S(bsvg, 'rect', { x: 0, y: 0, width: 1280, height: 720, fill: `url(#gw_${opts.kind})` });
    [180, 470, 810, 1100].forEach(x => {
      C().S(bsvg, 'path', { d: `M${x - 110},420 L${x - 110},150 Q${x},40 ${x + 110},150 L${x + 110},420 Z`, fill: 'rgba(255,255,255,.03)', stroke: th.arch, 'stroke-width': 2, opacity: .3 });
      C().S(bsvg, 'ellipse', { cx: x, cy: 110, rx: 60, ry: 40, fill: th.lamp });
    });
    C().S(bsvg, 'rect', { x: 0, y: 560, width: 1280, height: 160, fill: '#4A3018' });
    C().S(bsvg, 'path', { d: 'M470,560 L810,560 L900,720 L380,720 Z', fill: '#5A3A1A', opacity: .6 });
    bg.appendChild(bsvg); gal.appendChild(bg);
    gal.appendChild(el('div', { class: 'studio-lamp anim-glow', style: { top: '60px', left: '18%', zIndex: '2' } }));
    gal.appendChild(el('div', { class: 'studio-lamp anim-glow', style: { top: '60px', left: '72%', zIndex: '2' } }));
    gal.appendChild(el('div', { class: 'cvig' }));

    gal.appendChild(el('div', { class: 'chub-title' }, [
      el('h1', { text: opts.titleAr }),
      el('div', { class: 'en', text: opts.titleEn }),
    ]));

    const row = el('div', { class: 'station-row', style: { flexWrap: 'wrap', gap: '16px', top: '132px' } });
    opts.entries.forEach(e => {
      const featured = !!(opts.featured && opts.featured[e.id]);
      const done = opts.s2 ? W.s2store.isMastered(e.id) : W.store.isMastered(e.id);
      const special = e.kind === 'special';
      const st = el('div', { class: 'station' + (special ? ' special' : featured ? ' feat' : ' soon') + (e.special === 'free3d' ? ' free3d' : '') + (e.special === 'freescratch' ? ' freescratch' : '') + (done ? ' done' : ''),
        tabindex: '0', role: 'button', 'aria-label': (e.code ? e.code + ' ' : '') + e.title,
        style: special ? { borderColor: th.accent } : {},
        onclick: () => open(e, featured, special), onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(e, featured, special); } } });
      const sc = el('div', { class: 'st-scene' });
      sc.appendChild(special ? specialVignette(e, th) : vignette(opts.kind, featured, th));
      if (done) sc.appendChild(el('div', { class: 'st-done', text: '✦' }));
      st.appendChild(sc);
      st.appendChild(el('div', { class: 'st-body' }, [
        el('div', { class: 'st-code', style: special || featured ? { background: th.accent, color: '#1b0f05' } : {}, text: e.code || '★' }),
        el('div', { class: 'st-title', text: e.title }),
        e.titleEn ? el('div', { class: 'st-en', text: e.titleEn }) : null,
        featured || special
          ? el('div', { class: 'st-tag', style: { background: 'rgba(255,255,255,.08)', border: '1px solid ' + th.accent, color: th.accent2 }, text: done ? 'أُتقن ✦' : (special ? 'ابدأ' : 'ابدأ الدرس') })
          : el('div', { class: 'st-tag', style: { background: 'rgba(255,255,255,.08)', border: '1px solid ' + th.accent, color: th.accent2 }, text: done ? 'أُتقن ✦' : 'ابدأ الدرس' }),
      ]));
      row.appendChild(st);
    });
    gal.appendChild(row);

    gal.appendChild(el('div', { class: 'credit-band' }, el('span', { text: 'إعداد وتنفيذ الأستاذة دعاء الجرواني' })));
    ctx.add(gal);
    W.dock.mount(ctx, { home: true });

    function open(e, featured, special) {
      W.audio.chime();
      if (opts.s2) {
        if (e.route) return ctx.go(e.route, e.params || {});
        if (e.special === 'remember') return ctx.go('s2remember', { unit: opts.unit });
        if (e.special === 'status') return ctx.go('s2status', { unit: opts.unit });
        if (W.s2lessons && W.s2lessons.has(e.id)) return ctx.go('s2lesson', { id: e.id });
        return;
      }
      if (W.lessons.has(e.id)) ctx.go('lesson', { id: e.id });
    }
  }

  function specialVignette(e, th) {
    const svg = C().E('svg', { viewBox: '0 0 180 118', width: '100%', height: '100%' });

  function host() { return document.getElementById('lessonStage') || document.getElementById('stageInner'); }

  const present = {
    /* single instruction bar (exact action + object). Replaces any prior. */
    instruction(ar, en, iconGlyph) {
      const prev = document.getElementById('instrBar');
      if (prev) prev.remove();
      const bar = el('div', { class: 'instr', id: 'instrBar' }, [
        iconGlyph ? W.icons.svg(iconGlyph, 'ic') : null,
        el('div', {}, [
          el('div', { class: 'ar', text: ar }),
          en ? el('div', { class: 'en', text: en }) : null,
        ]),
      ]);
      document.getElementById('stageInner').appendChild(bar);
      return bar;   // lives in HUD band, not registered (it is replaced explicitly)
    },
    clearInstruction() { const p = document.getElementById('instrBar'); if (p) p.remove(); },

    /* transient feedback toast */
    feedback(kind, text) {
      const t = el('div', { class: 'fb ' + (kind === 'ok' ? 'ok' : 'no'), text });
      host().appendChild(t);
      requestAnimationFrame(() => t.classList.add('on'));
      W.scd.node(t);
      W.scd.after(() => { t.classList.remove('on'); W.scd.after(() => t.remove(), 220); }, 1500);
      kind === 'ok' ? W.audio.ok() : W.audio.no();
    },

    /* term label chip anchored near a node (AR prominent, EN small) */
    label(node, ar, en, dy) {
      const r = stageRect(node);
      const chip = el('div', { class: 'termchip', style: {
        position: 'absolute', left: (r.cx) + 'px', top: (r.y + (dy || -34)) + 'px',
        transform: 'translateX(-50%)', zIndex: '22',
      } }, [el('div', { class: 't-ar', text: ar }), en ? el('div', { class: 't-en', text: en }) : null]);
      host().appendChild(chip); W.scd.node(chip); return chip;
    },

    /* guidance hand that points at a node — registered so it is removed on cleanup */
    hand(node, dx, dy) {
      const r = stageRect(node);
      const h = el('div', { class: 'g-hand', text: '👆', style: {
        position: 'absolute', left: (r.cx + (dx || 0)) + 'px', top: (r.y + r.h + (dy || 4)) + 'px', transform: 'translateX(-50%)',
      } });
      host().appendChild(h); W.scd.node(h); return h;
    },

    /* left-pointing guide arrow near a node */
    arrow(node, dx, dy) {
      const r = stageRect(node);
      const a = el('div', { class: 'g-arrow', style: {
        position: 'absolute', left: (r.x + (dx || -40)) + 'px', top: (r.cy + (dy || -12)) + 'px',
      } }, W.icons.svg('arrow', '', 30));
      host().appendChild(a); W.scd.node(a); return a;
    },

    /* transient highlight ring around a node */
    highlight(node, pad) {
      const r = stageRect(node); const p = pad || 6;
      const ring = el('div', { style: {
        position: 'absolute', left: (r.x - p) + 'px', top: (r.y - p) + 'px',
        width: (r.w + p * 2) + 'px', height: (r.h + p * 2) + 'px', borderRadius: '14px',
        border: '2.5px solid var(--copper-lt)', boxShadow: '0 0 16px rgba(224,138,60,.5)',
        pointerEvents: 'none', zIndex: '20',
      } });
      host().appendChild(ring); W.scd.node(ring); return ring;
    },
  };
  W.present = present;
})(window.MNARA);

/* ==== engine/dnd.js ==== */
/* ==== engine/dnd.js — drag-and-drop engine (mouse + touch) ====
 * Contract: large objects, forgiving targets, pointer-aligned, reliable accept,
 * gentle reject (return to origin), no off-screen loss, retry/reset safe, works
 * at 1366x768 and 1920x1080, reduced-motion compatible, no pixel-perfect.
 * All listeners are registered with W.scd and removed on stage change.
 */
(function (W) {
  const { stagePoint } = W.util;
  const targets = [];   // {node, accepts:(dragEl)=>bool, onDrop:(dragEl)=>void, pad}

  function reset() { targets.length = 0; }

  function addTarget(node, accepts, onDrop, pad) {
    const t = { node, accepts, onDrop, pad: pad == null ? 28 : pad };
    targets.push(t); return t;
  }

  function hitTarget(cx, cy) {
    // forgiving: expand each target rect by pad; pick the closest center
    let best = null, bestD = Infinity;
    for (const t of targets) {
      const r = t.node.getBoundingClientRect();
      const x0 = r.left - t.pad, x1 = r.right + t.pad, y0 = r.top - t.pad, y1 = r.bottom + t.pad;
      if (cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1) {
        const dcx = (r.left + r.right) / 2, dcy = (r.top + r.bottom) / 2;
        const d = (cx - dcx) ** 2 + (cy - dcy) ** 2;
        if (d < bestD) { bestD = d; best = t; }
      }
    }
    return best;
  }

  /* make a node draggable. opts: { onPick, onReject, onAccept, data } */
  function makeDraggable(node, opts) {
    opts = opts || {};
    let dragging = false, ghost = null, ox = 0, oy = 0, homeLeft = 0, homeTop = 0, curHot = null;

    function down(e) {
      if (node.classList.contains('used')) return;
      e.preventDefault();
      const pt = pointer(e);
      dragging = true; node.classList.add('grab');
      const r = node.getBoundingClientRect();
      const k = W.scale || 1;
      ox = (pt.x - r.left) / k; oy = (pt.y - r.top) / k;
      const sp = stagePoint(r.left, r.top);
      homeLeft = sp.x; homeTop = sp.y;
      // create ghost that follows pointer, aligned to grab offset
      ghost = node.cloneNode(true);
      ghost.style.position = 'absolute'; ghost.style.zIndex = '80'; ghost.style.margin = '0';
      ghost.style.left = sp.x + 'px'; ghost.style.top = sp.y + 'px';
      ghost.style.width = (r.width / k) + 'px'; ghost.style.pointerEvents = 'none';
      ghost.classList.add('grab');
      document.getElementById('stageInner').appendChild(ghost);
      node.style.opacity = '0.25';
      W.audio.pick(); opts.onPick && opts.onPick(node);
    }
    function move(e) {
      if (!dragging) return;
      const pt = pointer(e);
      const sp = stagePoint(pt.x, pt.y);
      ghost.style.left = (sp.x - ox) + 'px'; ghost.style.top = (sp.y - oy) + 'px';
      const hot = hitTarget(pt.x, pt.y);
      if (hot !== curHot) {
        if (curHot) curHot.node.classList.remove('hot');
        curHot = hot && hot.accepts(node) !== 'reject' ? hot : hot;   // still mark hover
        if (hot) hot.node.classList.add('hot');
      }
    }
    function up(e) {
      if (!dragging) return;
      dragging = false; node.classList.remove('grab');
      const pt = pointer(e);
      const hot = hitTarget(pt.x, pt.y);
      if (curHot) curHot.node.classList.remove('hot');
      cleanupGhost();
      if (hot && hot.accepts(node)) {
        node.style.opacity = '1';
        W.audio.drop();
        hot.onDrop(node);
        opts.onAccept && opts.onAccept(node, hot);
      } else {
        // gentle reject: return to origin
        node.style.opacity = '1';
        W.audio.no();
        opts.onReject && opts.onReject(node, hot);
      }
      curHot = null;
    }
    function cleanupGhost() { if (ghost) { ghost.remove(); ghost = null; } }
    function pointer(e) { return { x: e.clientX, y: e.clientY }; }

    // Unified Pointer Events => reliable for mouse, touch, and pen.
    // No pointer capture: keep move/up on window so the ghost tracks freely.
    W.scd.listen(node, 'pointerdown', down);
    W.scd.listen(window, 'pointermove', move);
    W.scd.listen(window, 'pointerup', up);
    W.scd.listen(window, 'pointercancel', up);
    // keyboard fallback: Enter picks/drops to the first accepting target
    node.setAttribute('tabindex', '0');
    W.scd.listen(node, 'keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        const t = targets.find(t => t.accepts(node));
        if (t) { W.audio.drop(); t.onDrop(node); opts.onAccept && opts.onAccept(node, t); }
        else { W.audio.no(); opts.onReject && opts.onReject(node, null); }
      }
    });
  }

  W.dnd = { reset, addTarget, makeDraggable };
})(window.MNARA);

/* ==== engine/errorboundary.js ==== */
/* ==== engine/errorboundary.js — حاجز الأخطاء ====
 * قاعدة: لا تُعرض شاشة الخطأ عند إلغاء عملية بسبب انتقال طبيعي بين المراحل،
 * ولا تُبتلع الأخطاء الحقيقية — تُسجَّل كاملة في الطرفية ويحتفظ بها للاختبارات.
 */
(function (W) {
  const { el } = W.util;
  let shown = false;
  const log = [];

  /* إلغاء مقصود ناتج عن انتقال المرحلة — ليس خطأ */
  const CANCEL = 'MNARA_PHASE_CANCELLED';
  function isCancellation(err) {
    if (!err) return true;
    if (err === CANCEL || err.__mnaraCancelled) return true;
    const m = String(err && (err.message || err)) || '';
    return m.indexOf(CANCEL) >= 0 || /AbortError/i.test(m);
  }

  function homeScene() {
    if (W.scene && W.scene.has) {
      if (W.scene.has('s2hub')) return 's2hub';
      if (W.scene.has('hub')) return 'hub';
    }
    return 's2hub';
  }

  function show() {
    if (shown) return; shown = true;
    const ov = el('div', { class: 'mn-errbox', style: { position: 'fixed', inset: '0', zIndex: '120', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(5,12,19,.85)' } },
      el('div', { style: { width: 'min(520px,92%)', padding: '26px', borderRadius: '16px', textAlign: 'center', background: '#12293c', border: '1.8px solid rgba(217,105,78,.7)' } }, [
        el('div', { style: { fontSize: '40px' }, text: '⚓' }),
        el('div', { style: { fontFamily: 'var(--font-title)', fontSize: '22px', fontWeight: '800', color: 'var(--sand)', margin: '6px 0' }, text: 'حدث خطأ بسيط' }),
        el('div', { style: { fontSize: '16px', color: 'var(--stone)', lineHeight: '1.8' }, text: 'يمكنك العودة إلى الشاشة الرئيسية والمتابعة. لم يتأثّر تقدّمك المحفوظ.' }),
        el('button', { class: 'btn', 'data-testid': 'errbox-home', style: { marginTop: '16px', fontSize: '16px', minHeight: '46px', padding: '0 22px' }, text: 'العودة إلى الواحة',
          onclick: () => {
            shown = false;
            try { ov.remove(); } catch (e) {}
            try { W.scd && W.scd.clear(); } catch (e) {}
            try { W.scene.go(homeScene()); } catch (e) { console.error('[MNARA] errorbox home', e); }
          } }),
      ]));
    document.body.appendChild(ov);
  }

  W.errorBoundary = {
    CANCEL,
    get log() { return log.slice(); },
    isCancellation,
    catch(err, where) {
      if (isCancellation(err)) { return; }
      const rec = { where: where || '', message: String(err && (err.stack || err.message || err)) , at: Date.now() };
      log.push(rec);
      try { console.error('[MNARA]', where, err); } catch (e) {}
      show();
    },
  };
  window.addEventListener('error', (e) => { W.errorBoundary.catch(e.error || e.message, 'window'); });
  window.addEventListener('unhandledrejection', (e) => { W.errorBoundary.catch(e.reason, 'promise'); });
})(window.MNARA);

/* ==== engine/ui.js ==== */
/* ==== engine/ui.js — responsive scaling + lesson frame ==== */
(function (W) {
  const { el } = W.util;

  /* ================= وضعان للعرض =================
   * fixed  : تصميم الحاسوب الثابت 1280×720 مكبَّرًا (المقياس ≥ 1 دائمًا).
   * rsp    : تخطيط متجاوب حقيقي بأبعاد الجهاز — بلا تصغير، فلا يصغر أي خط.
   * القاعدة: لا نستخدم transform:scale للتصغير أبدًا؛ أقل مقياس هو 1.
   * rotate : الهاتف رأسيًا — شاشة «أدر جهازك» بدل عرض واجهة غير مقروءة.
   */
  const BASE_W = 1280, BASE_H = 720;
  let rotateEl = null;

  function viewport() {
    const vv = window.visualViewport;
    return { w: Math.round((vv && vv.width) || window.innerWidth),
             h: Math.round((vv && vv.height) || window.innerHeight) };
  }

  function isPhonePortrait(v) {
    /* PORTAL INTEGRATION: the platform-local rotate gate is retired. It was a
     * second rotate overlay carrying a second copy of the portal return label
     * on a button that navigated to the internal hub, not to ../index.html.
     * The shared #waha-simrot layer owns the landscape policy, and the shared
     * #waha-exit owns the return route. Portrait phones now fall through to
     * this platform's own responsive layout, which is left untouched. */
    if (v) { return false; }
    return false;
  }

  function showRotate(on) {
    const b = document.body;
    b.classList.toggle('needs-rotate', !!on);
    if (!on) { if (rotateEl) { rotateEl.remove(); rotateEl = null; } return; }
    if (rotateEl) return;
    rotateEl = el('div', { class: 'rotate-gate', id: 'rotateGate', role: 'dialog', 'aria-live': 'polite' },
      el('div', { class: 'rg-in' }, [
        el('div', { class: 'rg-ic', 'aria-hidden': 'true', text: '📱' }),
        el('h2', { text: 'أدِر الهاتف' }),
        el('p', { text: 'للحصول على مساحة مناسبة للتطبيق، يرجى تدوير الهاتف إلى الوضع الأفقي.' }),
        el('button', { class: 'rg-btn', 'data-testid': 'rotate-back', text: '← العودة',
          onclick: () => { try { W.scene.go('s2hub'); } catch (e) {} } }),
      ]));
    document.body.appendChild(rotateEl);
  }

  function fit() {
    const inner = document.getElementById('stageInner');
    if (!inner) return;
    const v = viewport();
    const body = document.body;

    if (isPhonePortrait(v)) {
      /* لا نعرض واجهة مصغّرة خلف الرسالة: التطبيق يُخفى بالكامل */
      body.classList.add('rsp');
      inner.style.transform = 'none';
      W.scale = 1;
      showRotate(true);
      W.viewMode = 'rotate';
      return;
    }
    showRotate(false);

    if (v.w >= BASE_W && v.h >= BASE_H) {
      /* تصميم الحاسوب الثابت — يُكبَّر ولا يُصغَّر */
      body.classList.remove('rsp');
      const k = Math.max(1, Math.min(v.w / BASE_W, v.h / BASE_H));
      W.scale = k;
      inner.style.transform = 'scale(' + k + ')';
      W.viewMode = 'fixed';
    } else {
      /* تخطيط متجاوب حقيقي بأبعاد الجهاز */
      body.classList.add('rsp');
      inner.style.transform = 'none';
      W.scale = 1;
      W.viewMode = 'rsp';
    }
    body.classList.toggle('rsp-narrow', v.w < 900);
    body.classList.toggle('rsp-short', v.h < 520);
    document.documentElement.style.setProperty('--vh', v.h + 'px');
  }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 60));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
  }
  /* الحقول: تمرير الحقل إلى المساحة المرئية عند فتح لوحة المفاتيح الافتراضية */
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (!t || !/input|textarea|select/i.test(t.tagName || '')) return;
    document.body.classList.add('kb-open');
    setTimeout(() => { try { t.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (err) {} }, 180);
  });
  document.addEventListener('focusout', () => {
    document.body.classList.remove('kb-open');
    setTimeout(fit, 120);
  });

  W.ui = {
    fit, viewport, showRotate,
    get mode() { return W.viewMode || 'fixed'; },
    /* lesson HUD: top bar (code+title+rail) + stage area + returns chrome */
    lessonFrame(ctx, lesson, stages) {
      const rail = el('div', { class: 'rail', id: 'stepRail' });
      const top = el('div', { class: 'lf-top' }, [
        el('span', { class: 'lf-code', text: lesson.code }),
        el('div', { class: 'lf-title' }, [document.createTextNode(lesson.title), el('small', { text: lesson.titleEn })]),
        el('div', { class: 'lf-spacer' }),
        rail,
      ]);
      const stage = el('div', { id: 'lessonStage', class: 'stagearea' });
      ctx.root.appendChild(top); ctx.root.appendChild(stage);
      // build rail dots
      (stages || []).forEach((s, i) => rail.appendChild(el('div', { class: 'dot', 'data-i': i }, [el('div', { class: 'bulb' }), el('div', { class: 'lbl', text: s.rail || s.id })])));
      W.chrome.corners(ctx, { home: true, back: 'index' });
      return { top, stage, rail };
    },
    railLive(i) {
      const rail = document.getElementById('stepRail'); if (!rail) return;
      [...rail.children].forEach((d, k) => { d.classList.toggle('live', k === i); d.classList.toggle('past', k < i); });
    },
  };
})(window.MNARA);

/* ==== engine/minidesktop.js ==== */
/* ==== engine/minidesktop.js — سطح مكتب Windows مصغّر (وحدة مستقلة) ====
 * مستخرجة لحزمة الفصل الدراسي الثاني وحدها: لا تعتمد على أي وحدة من الفصل الأول.
 * يستخدمها درس 1.2 لفتح تطبيق Scratch من قائمة ابدأ.
 */
(function (W) {
  const { el } = W.util;

  function buildMiniDesktop(parent, opts) {
    opts = opts || {};
    const win = el('div', { class: 'mini-winos' });
    const stageArea = el('div', { class: 'mini-deskarea' });          // safe usable area ABOVE the taskbar
    win.appendChild(stageArea);
    const startBtn = el('div', { class: 'mini-start-btn', tabindex: '0', role: 'button', title: 'Start · ابدأ' }, W.icons.svg('winstart', '', 22));
    const clock = el('div', { class: 'mini-clock' }, [el('div', { class: 't', text: '10:24 ص' }), el('div', { class: 'd', text: '٢٠ / ١ / ٢٠٢٦' })]);
    const taskbar = el('div', { class: 'mini-taskbar' }, [startBtn, el('div', { class: 'mini-tray' }, [clock])]);
    win.appendChild(taskbar);
    parent.appendChild(win); W.scd.node(win);

    const GAP = 10, PAD = 10;
    function offsetWithin(node, ancestor) { let x = 0, y = 0, n = node; while (n && n !== ancestor) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x, y }; }
    function anchorFlyoutAbove(anchor, flyout) {
      const winW = win.clientWidth, tbH = taskbar.offsetHeight || 46;
      const off = offsetWithin(anchor, win);
      const anchorCenterX = off.x + anchor.offsetWidth / 2;
      const fw = flyout.offsetWidth;
      let left = anchorCenterX - fw / 2;                     // center above the anchor
      left = Math.max(PAD, Math.min(left, winW - fw - PAD)); // keep inside, shift only if needed
      flyout.style.left = left + 'px';
      flyout.style.bottom = (tbH + GAP) + 'px';
      flyout.style.top = ''; flyout.style.right = '';
    }
    let startEnabled = true;
    function openStartMenu(items) {
      if (!startEnabled) return;
      win.querySelectorAll('.mini-startmenu').forEach(n => n.remove());
      const menu = el('div', { class: 'mini-startmenu' }, [el('div', { class: 'msm-h', text: 'Start · ابدأ' })]);
      items.forEach(it => menu.appendChild(el('div', { class: 'msm-item', tabindex: '0', role: 'button', onclick: () => { it.on(menu); } }, [W.icons.svg(it.ic, '', 18), el('span', { text: it.label })])));
      win.appendChild(menu); W.scd.node(menu);
      anchorFlyoutAbove(startBtn, menu);                    // measure then position (menu is in the DOM now)
      const off = W.scd.listen(window, 'pointerdown', (e) => { if (!menu.contains(e.target) && e.target !== startBtn && !startBtn.contains(e.target)) { menu.remove(); off(); } }, true);
      return menu;
    }
    function closeStartMenu() { win.querySelectorAll('.mini-startmenu').forEach(n => n.remove()); }
    return {
      win, stageArea, taskbar, startBtn,
      onStart(fn) { startBtn.onclick = fn; startBtn.onkeydown = (e) => { if (e.key === 'Enter') fn(e); }; },
      openStartMenu, closeStartMenu,
      enableStart(v) { startEnabled = v !== false; startBtn.classList.toggle('ready', !!startEnabled); },
      pulseStart(v) { startBtn.classList.toggle('pulse', !!v); },
    };
  }

  W.minidesktop = { buildMiniDesktop };
  /* توافق مع النداءات القائمة */
  W.obslesson = W.obslesson || {};
  W.obslesson.buildMiniDesktop = buildMiniDesktop;
})(window.MNARA);

/* ==== engine/s2store.js ==== */
/* ==== engine/s2store.js — تقدّم الفصل الدراسي الثاني (مفتاح تخزين مستقل تمامًا) ====
 * قرار معماري ملزم: الفصلان لا يتشاركان مفتاح تخزين واحدًا.
 *   الفصل الثاني: wahat.g3.s2.v1      (هذا الملف)
 * إعادة ضبط أحدهما لا تحذف تقدّم الآخر — مضمون باختبار آلي.
 * محلي بالكامل، بلا حسابات ولا شبكة.
 */
(function (W) {
  const KEY = 'wahat.g3.s2.v1';
  const blank = () => ({
    settings: { seenS2Intro: false },
    progress: {},   // lessonId -> { opened, steps:{}, phases:{}, done, masteredAt }
    stats: { sessions: 0, lessonOpens: 0, firstRun: Date.now(), lastRun: Date.now() },
  });

  let mem = blank(), ok = true;
  let previewing = false, snapshot = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        mem = Object.assign(blank(), p);
        mem.settings = Object.assign(blank().settings, p.settings || {});
        mem.progress = p.progress || {};
        mem.stats = Object.assign(blank().stats, p.stats || {});
      }
    } catch (e) { ok = false; }
  }
  function save() {
    if (!ok || previewing) return;
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { ok = false; }
  }
  load();
  mem.stats.sessions++; mem.stats.lastRun = Date.now(); save();

  function rec(id) {
    return mem.progress[id] || (mem.progress[id] = { opened: 0, steps: {}, phases: {}, done: false });
  }

  W.s2store = {
    KEY,
    get settings() { return mem.settings; },
    get progress() { return mem.progress; },
    get stats() { return mem.stats; },
    get storageOk() { return ok; },
    get previewing() { return previewing; },

    setSetting(k, v) { mem.settings[k] = v; save(); },

    lessonOpened(id) { const p = rec(id); p.opened++; mem.stats.lessonOpens++; save(); },

    /* خطوة عملية — تُسجَّل فقط بعد تحقق قائم على الحالة */
    stepDone(id, step) { const p = rec(id); p.steps[step] = true; save(); },
    stepIsDone(id, step) { const p = mem.progress[id]; return !!(p && p.steps[step]); },
    stepCount(id) { const p = mem.progress[id]; return p ? Object.keys(p.steps).length : 0; },

    /* مرحلة تربوية (استكشف/شاهد/نفذ معي/جرب بنفسك/راجع) */
    phaseDone(id, phase) { const p = rec(id); p.phases[phase] = true; save(); },
    phaseIsDone(id, phase) { const p = mem.progress[id]; return !!(p && p.phases[phase]); },
    phasesDone(id) { const p = mem.progress[id]; return p ? Object.keys(p.phases).filter(k => p.phases[k]) : []; },

    /* إتقان = استيفاء جميع معايير الدرس، لا نقاط ولا نجوم */
    markMastered(id, criteria) {
      const p = rec(id);
      const all = (criteria || []).every(c => p.phases[c] || p.steps[c]);
      if (all && !p.done) { p.done = true; p.masteredAt = Date.now(); }
      save(); return p.done;
    },
    isMastered(id) { const p = mem.progress[id]; return !!(p && p.done); },
    masteredCount() { return Object.values(mem.progress).filter(p => p.done).length; },
    unitMastered(unit) {
      const ls = W.curriculumS2.lessons.filter(l => l.unit === unit);
      return ls.filter(l => this.isMastered(l.id)).length;
    },

    /* أدوات المعلم */
    clearLesson(id) { delete mem.progress[id]; save(); },
    /* إعادة ضبط الفصل الثاني فقط — لا تمس مفتاح الفصل الأول إطلاقًا */
    reset() { mem = blank(); save(); },
    get key() { return KEY; },
    export() { return JSON.parse(JSON.stringify(mem)); },

    /* معاينة المعلم: كل كتابة تُحوَّل إلى نسخة مؤقتة ولا تُحفظ */
    beginPreview() { if (previewing) return; snapshot = JSON.stringify(mem); previewing = true; },
    endPreview() { if (!previewing) return; try { mem = JSON.parse(snapshot); } catch (e) {} previewing = false; snapshot = null; },
  };
})(window.MNARA);

/* ==== engine/s2teacher.js ==== */
/* ==== engine/s2teacher.js — وضع المعلّم لكل درس في الفصل الدراسي الثاني ====
 * إلزامي في جميع الدروس، وليس صفحة عامة. يتيح للمعلم:
 * فتح أي درس أو مرحلة مباشرة · الأهداف والمخرجات · المصطلحات · الصفحات المرجعية ·
 * خطة زمنية لحصة 30 دقيقة · خطوات العرض العملي · التحديات والأخطاء الشائعة ·
 * تدخلات مقترحة · أسئلة تمهيد وغلق · الإجابات النموذجية · إظهار/إخفاء الحل ·
 * إعادة ضبط النشاط أو الدرس · تجاوز مرحلة للشرح دون إفساد تقدّم الطالب ·
 * وضع العرض الكامل · سبب عدم اكتمال الخطوة.
 * محلي بالكامل: بلا حسابات ولا خادم ولا شبكة، ومعاينة غير مدمّرة.
 */
(function (W) {
  const { el } = W.util;
  let panel = null, openId = null, tab = 'sum', showAnswers = false;

  function S2() { return W.curriculumS2; }
  function lessons() { return S2().lessons; }
  function byId(id) { return lessons().find(l => l.id === id) || null; }
  function currentId() {
    if (W.activeLesson && W.activeLesson.s2 && W.activeLesson.id) return W.activeLesson.id;
    return openId || lessons()[0].id;
  }

  /* خطة زمنية مشتقّة من مراحل الدرس — حصة 30 دقيقة */
  function plan(l) {
    const practice = l.kind === 'practice' || l.kind === 'project';
    return [
      ['٣ دقائق', 'التمهيد: ' + (l.warmUp && l.warmUp[0] ? l.warmUp[0] : 'أسئلة إثارة الاهتمام')],
      ['٤ دقائق', 'مرحلة «استكشف»: موقف بصري يتفاعل معه التلميذ قبل التعريف'],
      ['٥ دقائق', 'مرحلة «شاهد»: عرض الفكرة بالرسوم خطوة بخطوة'],
      [practice ? '٨ دقائق' : '١٠ دقائق', 'مرحلة «نفّذ معي»: العرض العملي داخل المحاكي مع التلاميذ'],
      [practice ? '٧ دقائق' : '٥ دقائق', 'مرحلة «جرب بنفسك»: عمل مستقل ومتابعة فردية'],
      ['٣ دقائق', 'مرحلة «راجع وتحقق» + الغلق: ' + (l.closing && l.closing[0] ? l.closing[0] : 'أسئلة تقويم')],
    ];
  }

  const teacher = {
    get isOpen() { return !!panel; },
    open(forceId) {
      if (panel) { if (forceId) { openId = forceId; render(); } return; }
      W.s2store.beginPreview();
      openId = forceId || currentId();
      panel = el('div', { class: 'tm', id: 'teacherPanelS2' });
      panel.addEventListener('click', e => { if (e.target === panel) teacher.close(); });
      document.body.appendChild(panel);
      render();
    },
    close() {
      if (!panel) return;
      W.s2store.endPreview();
      panel.remove(); panel = null;
    },
    toggle() { this.isOpen ? this.close() : this.open(); },
  };

  function render() {
    if (!panel) return;
    panel.innerHTML = '';
    const p = el('div', { class: 'tm-panel' });
    p.appendChild(el('div', { class: 'tm-head' }, [
      el('div', { class: 'h', text: W.S2_ONLY ? 'وضع المعلّم' : 'وضع المعلّم — الفصل الدراسي الثاني' }),
      el('button', { class: 'btn-glass', text: '✕ إغلاق', onclick: () => teacher.close() }),
    ]));
    p.appendChild(el('div', { class: 'tm-note' }, [
      document.createTextNode(W.S2_ONLY
        ? 'كل ما تجرّبينه هنا في وضع المعاينة لا يؤثّر على تقدّم الطالب المحفوظ. البيانات محلية على هذا الجهاز فقط ولا تُرسل لأي جهة.'
        : 'كل ما تجرّبينه هنا في وضع المعاينة لا يؤثّر على تقدّم الطالب المحفوظ. البيانات محلية على هذا الجهاز فقط، ومفتاح تخزين الفصل الثاني منفصل عن الفصل الأول.'),
      el('div', { style: { direction: 'ltr', color: 'var(--muted)', fontSize: '10.5px', marginTop: '3px' }, text: 'Preview is non-destructive · separate storage key · offline' }),
    ]));
    p.appendChild(el('div', { class: 'tm-tabs' }, [
      tbtn('الملخص والأهداف', 'sum'), tbtn('خطة الحصة', 'plan'),
      tbtn('العرض والأخطاء', 'demo'), tbtn('الإجابات', 'ans'),
      tbtn('التحكم', 'ctrl'), tbtn('كل الدروس', 'all'),
    ]));
    const L2 = byId(openId) || lessons()[0];
    const scroll = el('div', { class: 'tm-scroll' });
    if (tab === 'sum') scroll.appendChild(sumBody(L2));
    else if (tab === 'plan') scroll.appendChild(planBody(L2));
    else if (tab === 'demo') scroll.appendChild(demoBody(L2));
    else if (tab === 'ans') scroll.appendChild(ansBody(L2));
    else if (tab === 'all') scroll.appendChild(allBody());
    else scroll.appendChild(ctrlBody());
    p.appendChild(scroll);
    p.appendChild(actionBar(L2));   /* شريط ثابت أسفل اللوحة لا يضيع في التمرير */
    panel.appendChild(p);
  }
  function tbtn(label, key) {
    return el('button', { class: 'tm-tab' + (tab === key ? ' on' : ''), 'data-tmtab': key, text: label,
      onclick: () => { W.audio.click(); tab = key; render(); } });
  }

  function head(l) {
    const w = W.cur.world(l.unit, true);
    return el('div', {}, [
      el('div', { style: { fontSize: '12px', color: w.accent, fontWeight: '800' },
        text: `الوحدة ${l.unit} — ${w.unitName} · التطبيق: ${w.app}` }),
      el('div', { style: { fontFamily: 'var(--font-title)', fontSize: '19px', fontWeight: '800', color: 'var(--sand-1)', margin: '2px 0' },
        text: l.code + ' — ' + l.title }),
      el('div', { style: { fontSize: '11.5px', color: 'var(--muted)', direction: 'ltr' }, text: l.titleEn }),
    ]);
  }
  function sumBody(l) {
    const w = el('div', {}); w.appendChild(head(l));
    sec(w, 'أهداف الدرس ومخرجاته', ul(l.objectives));
    sec(w, 'المصطلحات', terms(l.terms));
    sec(w, 'الأنشطة', ul(l.activities));
    sec(w, 'دليل الإتقان', el('div', { class: 'tm-why', text: l.evidence }));
    return w;
  }
  function planBody(l) {
    const w = el('div', {}); w.appendChild(head(l));
    sec(w, 'خطة الحصة (٣٠ دقيقة)', planTable(l));
    sec(w, 'أسئلة التمهيد', ul(l.warmUp));
    sec(w, 'أسئلة الغلق والتقويم', ul(l.closing));
    return w;
  }
  function demoBody(l) {
    const w = el('div', {}); w.appendChild(head(l));
    sec(w, 'خطوات العرض العملي', ol(l.demo));
    sec(w, 'التحديات والأخطاء المتوقعة', ul(l.misconceptions));
    sec(w, 'تدخلات مقترحة', ul(l.strategies));
    let why = '—';
    if (W.activeLesson && W.activeLesson.s2 && W.activeLesson.id === l.id) {
      try { why = W.activeLesson.whyIncomplete ? W.activeLesson.whyIncomplete() : why; } catch (e) {}
      sec(w, 'سبب عدم اكتمال الخطوة الحالية', el('div', { class: 'tm-why', id: 'tmWhy', text: why }));
    }
    return w;
  }
  function ansBody(l) {
    const w = el('div', {}); w.appendChild(head(l));
    const box = el('div', {});
    const b = el('button', { class: 'btn-glass', id: 'tmAnswers',
      text: showAnswers ? '🙈 أخفِ الإجابات النموذجية' : '💡 أظهر الإجابات النموذجية' });
    b.onclick = () => {
      showAnswers = !showAnswers; W.audio.click();
      b.textContent = showAnswers ? '🙈 أخفِ الإجابات النموذجية' : '💡 أظهر الإجابات النموذجية';
      box.innerHTML = ''; if (showAnswers) box.appendChild(ul(l.answers));
    };
    sec(w, 'الإجابات النموذجية', el('div', {}, [b, box]));
    if (showAnswers) box.appendChild(ul(l.answers));
    return w;
  }
  function actionBar(l) {
    const live = W.activeLesson && W.activeLesson.s2 && W.activeLesson.id === l.id;
    const bar = el('div', { class: 'tm-actionbar' });
    if (live) {
      const jump = el('div', { class: 'tm-jump' });
      (W.activeLesson.phases || []).forEach((ph, i) => jump.appendChild(el('button', {
        'data-jump': String(i), class: i === W.activeLesson.index ? 'on' : '', text: (i + 1) + '. ' + ph.label,
        onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.jump(i); } })));
      bar.appendChild(jump);
      bar.appendChild(el('div', { class: 'tm-actrow' }, [
        el('button', { class: 'btn-glass', id: 'tmReveal', text: '💡 كشف الحل',
          onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.reveal && W.activeLesson.reveal(); } }),
        el('button', { class: 'btn-glass', id: 'tmRetry', text: '↻ إعادة المرحلة',
          onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.retryStage && W.activeLesson.retryStage(); } }),
        el('button', { class: 'btn-glass', id: 'tmSkip', text: '⏭ تجاوز المرحلة',
          onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.skip && W.activeLesson.skip(); } }),
        el('button', { class: 'btn-glass', id: 'tmReset', text: '⟲ إعادة ضبط الدرس',
          onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.resetLesson && W.activeLesson.resetLesson(); } }),
      ]));
    } else {
      bar.appendChild(el('div', { class: 'tm-actrow' }, [
        el('button', { class: 'btn-glass', id: 'tmOpen', text: '▶ افتح هذا الدرس مباشرة',
          onclick: () => { W.audio.click(); teacher.close(); W.scene.go('s2lesson', { id: l.id }); } }),
      ]));
    }
    return bar;
  }

  function lessonBody(l) {
    const wrap = el('div', {});
    const w = W.cur.world(l.unit, true);
    wrap.appendChild(el('div', { style: { fontSize: '12px', color: w.accent, fontWeight: '800' },
      text: `الوحدة ${l.unit} — ${w.unitName} · ${w.world} · التطبيق: ${w.app}` }));
    wrap.appendChild(el('div', { style: { fontFamily: 'var(--font-title)', fontSize: '19px', fontWeight: '800', color: 'var(--sand-1)', margin: '2px 0' },
      text: l.code + ' — ' + l.title }));
    wrap.appendChild(el('div', { style: { fontSize: '11.5px', color: 'var(--muted)', direction: 'ltr' }, text: l.titleEn }));

    sec(wrap, 'أهداف الدرس ومخرجاته · Objectives', ul(l.objectives));
    sec(wrap, 'المصطلحات · Terminology', terms(l.terms));
    sec(wrap, 'خطة الحصة (٣٠ دقيقة) · Lesson plan', planTable(l));
    sec(wrap, 'خطوات العرض العملي · Demo sequence', ol(l.demo));
    sec(wrap, 'التحديات والأخطاء الشائعة المتوقعة · Expected challenges', ul(l.misconceptions));
    sec(wrap, 'تدخلات مقترحة · Suggested interventions', ul(l.strategies));
    sec(wrap, 'أسئلة التمهيد · Warm-up questions', ul(l.warmUp));
    sec(wrap, 'أسئلة الغلق والتقويم · Closing questions', ul(l.closing));

    /* الإجابات النموذجية — تُظهر وتُخفى */
    const ansBox = el('div', {});
    const ansBtn = el('button', { class: 'btn-glass', id: 'tmAnswers',
      text: showAnswers ? '🙈 أخفِ الإجابات النموذجية' : '💡 أظهر الإجابات النموذجية' });
    ansBtn.onclick = () => {
      showAnswers = !showAnswers; W.audio.click();
      ansBtn.textContent = showAnswers ? '🙈 أخفِ الإجابات النموذجية' : '💡 أظهر الإجابات النموذجية';
      ansBox.innerHTML = '';
      if (showAnswers) ansBox.appendChild(ul(l.answers));
    };
    sec(wrap, 'الإجابات النموذجية · Model answers', el('div', {}, [ansBtn, ansBox]));
    if (showAnswers) ansBox.appendChild(ul(l.answers));

    sec(wrap, 'الأنشطة ودليل الإتقان · Activities & mastery',
      el('div', {}, [ul(l.activities),
        el('div', { class: 'tm-why', text: 'دليل الإتقان: ' + l.evidence })]));

    /* أدوات التحكم بالدرس الجاري */
    const live = W.activeLesson && W.activeLesson.s2 && W.activeLesson.id === l.id;
    const controls = el('div', { class: 'tm-actions' });
    if (live) {
      controls.appendChild(el('button', { class: 'btn-glass', id: 'tmReveal', text: '💡 اكشف الحل للمرحلة الحالية',
        onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.reveal && W.activeLesson.reveal(); } }));
      controls.appendChild(el('button', { class: 'btn-glass', id: 'tmRetry', text: '↻ إعادة ضبط المرحلة',
        onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.retryStage && W.activeLesson.retryStage(); } }));
      controls.appendChild(el('button', { class: 'btn-glass', id: 'tmReset', text: '⟲ إعادة ضبط الدرس',
        onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.resetLesson && W.activeLesson.resetLesson(); } }));
      controls.appendChild(el('button', { class: 'btn-glass', id: 'tmSkip', text: '⏭ تجاوز المرحلة (للشرح فقط)',
        onclick: () => { W.audio.click(); teacher.close(); W.activeLesson.skip && W.activeLesson.skip(); } }));

      /* سبب عدم اكتمال الخطوة */
      let why = 'غير متاح.';
      try { why = W.activeLesson.whyIncomplete ? W.activeLesson.whyIncomplete() : why; } catch (e) {}
      wrap.appendChild(el('h4', { class: 'tm-sec', style: { color: 'var(--copper-hi)', fontSize: '13px', fontWeight: '800', margin: '12px 0 5px' },
        text: 'سبب عدم اكتمال الخطوة الحالية · Why not complete' }));
      wrap.appendChild(el('div', { class: 'tm-why', id: 'tmWhy', text: why }));

      /* الانتقال بين المراحل */

/* ==== engine/s2lesson.js — البنية التربوية الموحّدة لكل درس في الفصل الثاني ====
 * المراحل: استكشف · شاهد · نفّذ معي · جرب بنفسك · راجع وتحقق
 * قاعدة غير قابلة للتفاوض: لا انتقال إلا بتحقق قائم على الحالة (State-based).
 *   - لا نجاح بمجرد النقر.
 *   - لا مؤقت وحده يُكمل مهمة.
 *   - لا انتقال قبل رؤية أثر الفعل.
 * كل عنصر مؤقت يُسجَّل في W.scd فلا يتسرب شيء بين المراحل.
 */
(function (W) {
  const { el } = W.util;

  const PHASES = {
    explore: { ar: 'استكشف', en: 'Explore' },
    watch: { ar: 'شاهد', en: 'Watch' },
    doWithMe: { ar: 'نفّذ معي', en: 'Do with me' },
    tryIt: { ar: 'جرب بنفسك', en: 'Try it' },
    review: { ar: 'راجع وتحقق', en: 'Review' },
  };

  /* ---------------------------------------------------------------- الإطار */
  function frame(ctx, lesson, phaseKeys, backScene) {
    const wrap = el('div', { class: 's2-frame' });

    /* شريط بثلاث مناطق فعلية: كل مجموعة أزرار لها خانة خاصة داخل التدفّق،
     * فلا يدخل أي زر مطلق التموضع داخل مساحة العنوان. */
    const rail = el('div', { class: 's2-rail', id: 's2Rail' });
    phaseKeys.forEach((k, i) => {
      const p = PHASES[k] || { ar: k, en: k };
      /* الانتقال يمرّ عبر درس الصفحة النشط: لا مرجع لدالة خارج نطاق هذه الدالة. */
      rail.appendChild(el('button', { class: 's2-step', type: 'button', 'data-i': i, 'data-phase': k, 'data-n': String(i + 1),
        title: p.ar + ' — يمكنك فتح أي نشاط مباشرة',
        onclick: () => { const a = W.activeLesson; if (a && typeof a.jump === 'function') a.jump(i); } },
        [el('i', {}), el('span', { text: p.ar })]));
    });

    const slotR = el('div', { class: 's2-slot r', id: 's2SlotR' });   // الرجوع والمنارة
    const slotL = el('div', { class: 's2-slot l', id: 's2SlotL' });   // وضع المعلّم والإعدادات
    const titleWrap = el('div', { class: 's2-titlewrap', id: 's2Title' }, [
      el('div', { class: 's2-code', text: lesson.code }),
      el('div', { class: 's2-ttl' }, [
        el('b', { text: lesson.title }),
        el('small', { text: lesson.titleEn }),
      ]),
    ]);

    /* ترتيب DOM في RTL: الأول يظهر في أقصى اليمين */
    wrap.appendChild(el('div', { class: 's2-top' }, [slotR, titleWrap, rail, slotL]));

    const body = el('div', { class: 's2-body', id: 's2Body' });
    wrap.appendChild(body);
    ctx.add(wrap);
    W.dock.mount(ctx, { home: true, back: backScene || 's2hub' });

    /* نقل مجموعتي الأزرار من التموضع المطلق إلى خانتيهما داخل الشريط */
    const dl = ctx.root.querySelector('.dock:not(.right)');
    const dr = ctx.root.querySelector('.dock.right');
    if (dl) slotL.appendChild(dl);
    if (dr) slotR.appendChild(dr);
    /* عرض الخانتين يُثبَّت بعد القياس فلا تتمدّدان على حساب العنوان */
    W.scd.after(() => {
      [slotL, slotR].forEach(sl => {
        const w = Math.ceil(sl.getBoundingClientRect().width / (W.scale || 1));
        if (w > 0) sl.style.flex = '0 0 ' + w + 'px';
      });
    }, 40);

  }

  /* حالة كل مرحلة تُقرأ من التخزين الفعلي، لا من ترتيب الزيارة:
   *   live = المرحلة المفتوحة الآن
   *   done = أُنجزت فعلًا (phaseIsDone) — لا تُمنح بمجرد المرور
   *   todo = لم تُنجَز بعد (سواء زارها الطالب أم لا) */
  function railLive(i, lessonId, phaseKeys) {
    const rail = document.getElementById('s2Rail'); if (!rail) return;
    [...rail.children].forEach((d, k) => {
      const key = (phaseKeys && phaseKeys[k]) || d.dataset.phase;
      const done = !!(lessonId && key && W.s2store.phaseIsDone(lessonId, key));
      d.classList.toggle('live', k === i);
      d.classList.toggle('done', done);
      d.classList.toggle('todo', !done && k !== i);
      d.classList.remove('past');
      d.setAttribute('aria-current', k === i ? 'step' : 'false');
      d.title = (d.dataset.phase ? '' : '') + (done
        ? 'أنجزتَ هذا النشاط — يمكنك فتحه مرة أخرى'
        : 'لم يكتمل بعد — يمكنك فتحه الآن وإكماله لاحقًا');
    });
    /* الشريط قد يكون قابلًا للتمرير أفقيًا على الشاشات الضيقة:
     * تُبقى المرحلة الحالية ظاهرة تلقائيًا دائمًا. */
    const live = rail.children[i];
    if (live && rail.scrollWidth > rail.clientWidth + 1) {
      const lr = live.offsetLeft, lw = live.offsetWidth;
      rail.scrollLeft = Math.max(0, lr - (rail.clientWidth - lw) / 2);
