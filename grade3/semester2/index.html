/* ==== styles/base.css ==== */
/* ==== styles/base.css — CP1R design tokens, materials, RTL, stage scaling ====
 * FONT: Arabic-first stack; high-quality on the Windows school target.
 * Drop Cairo.woff2 / Tajawal.woff2 into src/fonts/ and uncomment to embed.
 */
/*
@font-face{font-family:"Cairo";src:url("fonts/Cairo.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal.woff2") format("woff2");font-weight:400 800;font-display:swap}
*/
:root{
  /* --- Omani coastal daylight palette (warm, premium, not dark) --- */
  --dawn-1:#F7E4C4; --dawn-2:#F0C79B; --dawn-3:#E3A579; --dusk:#C98A63;
  --sea-1:#4E93A6; --sea-2:#317387; --sea-3:#1E5568; --sea-deep:#123f4f;
  --sand-1:#EADFC8; --sand-2:#D8C29B; --sand-3:#BFA274; --sand-sh:#9C7F52;
  /* materials */
  --copper-1:#E7A063; --copper-2:#C57B3D; --copper-3:#9E5C28; --copper-hi:#FFD9A8;
  --wood-1:#8A5A32; --wood-2:#6B421F; --wood-3:#4A2C13;
  --teal-1:#5FB8AE; --teal-2:#3B9188; --teal-3:#2A6E67; --teal-hi:#A7E6DD;
  --glass:#173343; --glass-2:#0f2735; --glass-edge:rgba(255,236,200,.22);
  --brass:#D9A94E;
  /* ink / text */
  --ink:#20140A; --ink-2:#3A2A1B;
  --paper:#FBF6EC; --paper-line:#E9DEC9;
  --cream:#F5ECDD; --cream-2:#E4D6BE; --muted:#B49B7C;
  --ok:#4FA772; --warn:#E0A23C; --bad:#CF6A4C;
  /* shadows / depth */
  --sh-soft:0 8px 24px rgba(40,24,10,.22);
  --sh-1:0 14px 40px rgba(30,18,8,.32);
  --sh-2:0 30px 80px rgba(20,12,6,.45);
  --sh-in:inset 0 2px 8px rgba(0,0,0,.28);
  --glow-copper:0 0 26px rgba(231,160,99,.55);
  --glow-teal:0 0 26px rgba(95,184,174,.5);
  --r-1:14px; --r-2:22px; --r-3:30px;
  --font-title:"Cairo","Dubai","Sakkal Majalla","Segoe UI","Tahoma",system-ui,sans-serif;
  --font-body:"Tajawal","Dubai","Segoe UI","Tahoma","Arial",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#0b1e26;overflow:hidden}
body{font-family:var(--font-body);color:var(--cream);direction:rtl}
button{font-family:inherit;cursor:pointer;color:inherit}
img{user-select:none}

/* fixed 1280x720 design space, scaled to fit (verified 1366x768 & 1920x1080) */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 100% at 50% 8%,#1a3d4a,#0b1e26 72%)}
#stageInner{position:relative;width:1280px;height:720px;transform-origin:center center;
  border-radius:8px;overflow:hidden;box-shadow:var(--sh-2)}
.motif{position:absolute;inset:0;pointer-events:none;z-index:0}

:focus-visible{outline:3px solid var(--copper-hi);outline-offset:2px;border-radius:8px}

/* reduced motion — keep function, drop animation */
body.rm *{animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important}
/* low performance — hide decorative layers */
body.lp .decor,body.lp .parallax-extra,body.lp .particles,body.lp .anim-glow,body.lp .beam{display:none!important}
body.lp .glass-blur{backdrop-filter:none!important}

.center{display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}

/* ==== styles/ui.css ==== */
/* ==== styles/ui.css — Teacher Mode, settings, status, retained lesson chrome ==== */

.btn-glass{min-height:40px;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;
  color:var(--cream);background:linear-gradient(180deg,rgba(30,20,12,.7),rgba(18,12,7,.78));
  border:1px solid var(--glass-edge);box-shadow:var(--sh-soft)}
.btn-glass:hover{background:linear-gradient(180deg,rgba(45,30,18,.82),rgba(28,18,10,.88))}

/* ---------- Teacher Mode ---------- */
.tm{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-start;background:rgba(6,14,18,.62)}
.tm-panel{width:min(560px,94%);height:100%;overflow:auto;padding:20px 22px 40px;
  background:linear-gradient(180deg,#16302f,#0e2124);border-left:2px solid var(--glass-edge);box-shadow:var(--sh-2)}
.tm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tm-head .h{font-family:var(--font-title);font-size:22px;font-weight:800;color:var(--cream)}
.tm-note{font-size:11.5px;color:var(--cream-2);line-height:1.7;background:rgba(197,123,61,.14);
  border:1px solid rgba(197,123,61,.4);border-radius:9px;padding:9px 11px;margin:8px 0 14px}
.tm-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tm-tab{padding:8px 14px;font-size:13px;border-radius:9px;border:1px solid var(--glass-edge);background:transparent;color:var(--cream);font-weight:600}
.tm-tab.on{background:linear-gradient(180deg,#F6C583,#DB9448);color:#2a1608;font-weight:800;border:none}
.tm-sec h4{font-size:13px;color:var(--copper-hi);font-weight:800;margin:12px 0 5px}
.tm-sec ul{margin:4px 0;padding-right:18px}
.tm-sec li{font-size:13px;line-height:1.7;color:var(--cream-2)}
.tm-terms{display:flex;flex-wrap:wrap;gap:6px}
.tm-term{font-size:11.5px;padding:3px 9px;border-radius:6px;background:rgba(197,123,61,.16);border:1px solid rgba(197,123,61,.32);color:var(--cream)}
.tm-lesson{background:rgba(14,33,36,.7);border:1px solid var(--glass-edge);border-radius:9px;margin-bottom:8px;padding:6px 0}
.tm-lesson summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.tm-lesson summary .c{font-size:11px;font-weight:800;background:var(--copper-2);color:#1b0f05;padding:2px 7px;border-radius:5px}
.tm-lesson summary .st{margin-right:auto;font-size:11px;color:var(--muted)}
.tm-lesson[data-done="1"] summary .c{background:var(--teal-2);color:#fff}
.tm-body-in{padding:2px 14px 12px}
.tm-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:7px;background:rgba(14,33,36,.7);border-radius:9px;font-size:13.5px;color:var(--cream-2)}
.tm-switch{width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;border:none;flex:0 0 auto}
.tm-switch.on{background:var(--teal-2)}
.tm-switch i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .16s}
.tm-switch.on i{right:23px}
.tm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* settings overlay reuses tm styles */
#mnSettings .tm-toggle{min-width:280px}

/* ---------- retained lesson chrome + status (units 1/3 index) ---------- */
.instr{position:absolute;top:14px;right:16px;left:16px;z-index:40;display:flex;align-items:center;gap:12px;justify-content:center;
  min-height:52px;padding:11px 20px;border-radius:14px;background:linear-gradient(180deg,rgba(16,30,34,.94),rgba(10,20,24,.94));border:1.6px solid var(--glass-edge);box-shadow:var(--sh-1)}
.instr .ar{font-family:var(--font-title);font-size:20px;font-weight:800;color:var(--cream)}
.instr .en{font-size:12.5px;color:var(--muted);direction:ltr}
.instr .ic{width:34px;height:34px;color:var(--copper-hi)}
.fb{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);z-index:60;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;opacity:0;transition:all .2s;pointer-events:none;box-shadow:var(--sh-1)}
.fb.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fb.ok{background:linear-gradient(180deg,#5EC98A,#3F9C68);color:#08210f}
.fb.no{background:linear-gradient(180deg,#EAB07F,#CF6A4C);color:#2a0d05}
.termchip{display:inline-flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:10px;background:rgba(16,30,34,.92);border:1.5px solid var(--glass-edge);pointer-events:none}
.termchip .t-ar{font-family:var(--font-title);font-size:15px;font-weight:800;color:var(--cream)}
.termchip .t-en{font-size:10.5px;color:var(--muted);direction:ltr}
.g-hand{position:absolute;z-index:30;font-size:34px;pointer-events:none}
.g-arrow{position:absolute;z-index:30;pointer-events:none;color:var(--copper-hi)}
.lf-top{position:absolute;top:0;right:0;left:0;height:50px;z-index:35;display:flex;align-items:center;gap:12px;padding:0 14px}
.lf-code{font-weight:800;font-size:13px;color:#241405;background:var(--copper-hi);padding:4px 9px;border-radius:7px}
.lf-title{font-family:var(--font-title);font-weight:800;font-size:17px;color:var(--cream)}
.lf-title small{display:block;font-size:10.5px;color:var(--muted);direction:ltr;font-weight:500}
.lf-spacer{flex:1}
.stagearea{position:absolute;top:52px;right:0;left:0;bottom:64px;overflow:hidden}
.rail{display:flex;gap:7px;align-items:center}
.rail .dot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px}
.rail .dot .bulb{width:13px;height:13px;border-radius:50%;background:rgba(224,138,60,.28);border:1.6px solid rgba(224,138,60,.5)}
.rail .dot .lbl{font-size:10.5px;color:var(--muted);font-weight:700}
.rail .dot.live .bulb{background:var(--copper-hi);box-shadow:0 0 10px var(--copper-hi)}
.rail .dot.past .bulb{background:var(--teal-2);border-color:var(--teal-2)}

/* Unit 3 index (kept minimal, warm) — Unit 1 uses the lab world, Unit 2 the hall world */
.idx{position:absolute;inset:0;overflow:hidden;background:radial-gradient(80% 60% at 50% 10%,rgba(95,184,174,.12),transparent),linear-gradient(180deg,#243c40,#15272b)}
.idx-head{position:absolute;top:24px;right:0;left:0;text-align:center;color:var(--cream)}
.idx-head h1{font-family:var(--font-title);font-size:28px;margin:0}
.idx-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cream-2);font-size:15px;padding:0 60px;line-height:1.8}

/* ==== styles/world.css ==== */
/* ==== styles/world.css — cinematic opening, hub with depth, entrances ==== */

/* ---------- shared cinematic layers ---------- */
.world{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;will-change:transform}
.layer-sky{z-index:1}
.layer-mid{z-index:2}
.layer-fore{z-index:4}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(20,12,6,.34) 100%)}
.atmo{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,240,210,.10),transparent 30%)}

/* particles (sea mist / dust motes) */
.particles i{position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,244,220,.85);animation:mote linear infinite}
@keyframes mote{from{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:.85}to{transform:translateY(-80px) translateX(14px);opacity:0}}

/* rotating beacon beam */
.beam{position:absolute;z-index:2;transform-origin:bottom center;pointer-events:none;
  background:conic-gradient(from 270deg at 50% 100%,transparent 76deg,rgba(255,238,190,.22) 90deg,transparent 104deg);
  animation:sweep 8s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}

/* ---------- opening ---------- */
.op-title{position:absolute;top:6.5%;right:0;left:0;text-align:center;z-index:7}
.op-title h1{font-family:var(--font-title);font-size:50px;font-weight:900;margin:0;
  color:#3a2410;letter-spacing:.5px;text-shadow:0 2px 0 rgba(255,255,255,.4),0 6px 20px rgba(120,70,20,.25)}
.op-title .en{font-size:15px;letter-spacing:3px;color:#6a4520;direction:ltr;margin-top:4px;text-transform:uppercase}
.op-cta{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:8;text-align:center}
.op-sub{margin-top:12px;font-size:14px;color:#123040;font-weight:600}
.op-credit{position:absolute;bottom:16px;right:0;left:0;text-align:center;z-index:8;
  font-size:14px;color:#123040;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.3)}

/* the big CTA is a carved-copper plate, not a flat button */
.plate-btn{position:relative;min-height:60px;padding:16px 40px;border:none;border-radius:16px;
  font-family:var(--font-title);font-size:21px;font-weight:800;color:#2a1608;
  background:linear-gradient(180deg,#F6C583,#DB9448 60%,#C57B3D);
  box-shadow:0 10px 0 #9E5C28,0 20px 40px rgba(120,60,20,.4),inset 0 2px 4px rgba(255,240,210,.7);
  transition:transform .12s,box-shadow .12s}
.plate-btn:hover{transform:translateY(-2px);box-shadow:0 12px 0 #9E5C28,0 26px 50px rgba(120,60,20,.45),inset 0 2px 4px rgba(255,240,210,.8)}
.plate-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #9E5C28,0 10px 20px rgba(120,60,20,.4)}

/* ---------- hub: continuous environment with three entrances ---------- */
.hub-title{position:absolute;top:20px;right:0;left:0;text-align:center;z-index:7}
.hub-title h1{font-family:var(--font-title);font-size:32px;font-weight:900;margin:0;color:#3a2410;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.hub-title .en{font-size:12.5px;color:#5a3c1e;direction:ltr;letter-spacing:1px}
/* the three entrances sit along a stone quay; positioned, not carded */
.entrances{position:absolute;inset:0;z-index:5}
.entrance{position:absolute;bottom:8%;width:300px;height:340px;cursor:pointer;
  transition:transform .2s,filter .2s;filter:drop-shadow(0 20px 30px rgba(20,12,6,.5))}
.entrance:hover{transform:translateY(-10px) scale(1.02)}
.entrance:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:20px}
.entrance .arch{position:absolute;inset:0;border-radius:20px 20px 8px 8px;overflow:hidden;
  border:2px solid rgba(255,236,200,.25)}
.entrance .name-plate{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:3;
  min-width:240px;text-align:center;padding:10px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(30,20,10,.9),rgba(20,12,6,.96));
  border:1.5px solid var(--glass-edge);box-shadow:var(--sh-1)}
.entrance .name-plate .u{font-size:11.5px;font-weight:800;color:var(--copper-hi)}
.entrance .name-plate .nm{font-family:var(--font-title);font-size:19px;font-weight:800;color:var(--cream)}
.entrance .name-plate .en{font-size:10.5px;color:var(--muted);direction:ltr}
.entrance .prog{margin-top:7px;height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.entrance .prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal-2),var(--teal-hi));width:0}
/* pathway hint arrows on the quay */
.quay{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:4;
  background:linear-gradient(180deg,transparent,rgba(90,60,30,.35));pointer-events:none}

.hub-credit{position:absolute;bottom:12px;right:0;left:0;text-align:center;z-index:7;font-size:12.5px;color:#123040;font-weight:700}

/* ---------- compact elegant corner chrome ---------- */
.chrome-corner{position:absolute;z-index:20;display:flex;gap:8px}
.chrome-corner.tr{top:14px;left:14px}
.chrome-corner.tl{top:14px;right:14px}
.chip-btn{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:none;border-radius:12px;
  font-size:13px;font-weight:700;color:var(--cream);
  background:linear-gradient(180deg,rgba(30,20,12,.66),rgba(18,12,7,.72));
  border:1px solid var(--glass-edge);box-shadow:var(--sh-soft);backdrop-filter:blur(6px)}
.chip-btn:hover{background:linear-gradient(180deg,rgba(45,30,18,.8),rgba(28,18,10,.85))}
.chip-btn svg{width:18px;height:18px;color:var(--copper-hi)}
.chip-btn.icon-only{width:40px;padding:0;justify-content:center}

/* ---------- entrance transition (camera push-in) ---------- */
.pushin{animation:pushin .5s ease-out}
@keyframes pushin{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}

/* ==== styles/citadel.css ==== */
/* ==== styles/citadel.css — Living Omani Technology Citadel (CP1R2) ==== */

/* ---------- panoramic world container ---------- */
.cit{position:absolute;inset:0;overflow:hidden}
.cit .clayer{position:absolute;inset:0;will-change:transform;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.cit .cl-sky{z-index:1}
.cit .cl-cit{z-index:3}
.cit .cl-falaj{z-index:4;pointer-events:none}
.cit .cl-loc{z-index:5}
.cit .cl-fore{z-index:8;pointer-events:none}
.cit .cvig{position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(120% 86% at 50% 42%,transparent 52%,rgba(24,14,6,.40) 100%)}
.cit .catmo{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,242,214,.14),transparent 26%,transparent 74%,rgba(18,40,50,.25))}

/* foreground silhouette strip for depth */
.cfore{position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(180deg,transparent,rgba(28,18,10,.65) 60%,#241608);z-index:8}

/* particles: sea mist + data motes */
.cparts i{position:absolute;border-radius:50%;background:rgba(255,246,222,.8);animation:cmote linear infinite}
.cparts i.d{background:rgba(160,230,220,.85);box-shadow:0 0 6px rgba(140,224,214,.7)}
@keyframes cmote{from{transform:translateY(0);opacity:0}14%{opacity:.8}to{transform:translateY(-70px) translateX(10px);opacity:0}}

/* rotating beacon beam sweeping the whole landscape */
.cbeam{position:absolute;z-index:2;transform-origin:bottom center;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 270deg at 50% 100%,transparent 74deg,rgba(255,240,196,.20) 90deg,transparent 106deg);
  animation:csweep 9s ease-in-out infinite}
@keyframes csweep{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}

/* falaj light flow */
.falaj-flow{animation:falajflow 2.4s linear infinite}
.falaj-flow.rev{animation-direction:reverse}
@keyframes falajflow{to{stroke-dashoffset:-280}}
.flow-dot{animation:flowdot 3s linear infinite}
@keyframes flowdot{0%{opacity:0}20%{opacity:1}100%{transform:translateX(120px);opacity:0}}

/* gentle floats/glows used by scenery */
.anim-float{animation:cfloat 4.5s ease-in-out infinite}
@keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.anim-glow{animation:cglow 3.4s ease-in-out infinite}
@keyframes cglow{0%,100%{opacity:.9}50%{opacity:.6}}

/* ---------- interactive location hotspots ---------- */
.cloc{position:absolute;z-index:6;cursor:pointer;transition:transform .35s cubic-bezier(.22,.61,.36,1),filter .35s}
.cloc .cloc-art{position:absolute;inset:0;filter:drop-shadow(0 22px 30px rgba(16,10,4,.55))}
.cloc .cloc-halo{position:absolute;inset:-6% -6% -2% -6%;border-radius:40% 40% 12% 12%;opacity:0;transition:opacity .35s;pointer-events:none}
.cloc:hover .cloc-halo,.cloc:focus-visible .cloc-halo{opacity:1}
.cloc:hover,.cloc:focus-visible{transform:translateY(-8px) scale(1.015)}
.cloc:focus-visible{outline:none}
/* integrated glass plaque beside the entrance (NOT a black card) */
.cplaque{position:absolute;z-index:7;min-width:210px;max-width:250px;padding:10px 14px;border-radius:13px;
  background:linear-gradient(180deg,rgba(20,40,46,.52),rgba(12,26,32,.62));
  border:1px solid rgba(150,220,210,.34);box-shadow:0 10px 26px rgba(10,20,24,.4),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(7px);opacity:0;transform:translateY(8px);transition:opacity .32s,transform .32s}
.cloc:hover .cplaque,.cloc:focus-visible .cplaque,.cplaque.pinned{opacity:1;transform:translateY(0)}
.cplaque .u{font-size:11px;font-weight:800;letter-spacing:.2px}
.cplaque .nm{font-family:var(--font-title);font-size:18px;font-weight:800;color:#FDF6E9;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cplaque .en{font-size:10.5px;color:#B9CFC9;direction:ltr}
.cplaque .desc{font-size:11.5px;color:#DCECE6;margin-top:5px;line-height:1.5}
.cplaque .prog{margin-top:8px;height:6px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.cplaque .prog i{display:block;height:100%;border-radius:4px;width:0}
/* per-world accent */
.cloc.lab .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(231,160,99,.4),transparent 72%)}
.cloc.hall .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(255,217,168,.45),transparent 72%)}
.cloc.obs .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(111,160,218,.42),transparent 72%)}
.cloc.lab .cplaque .u{color:#F3C57E} .cloc.lab .cplaque .prog i{background:linear-gradient(90deg,#C57B3D,#F3C57E)}
.cloc.hall .cplaque .u{color:#FFD9A8} .cloc.hall .cplaque .prog i{background:linear-gradient(90deg,#3B9188,#A7E6DD)}
.cloc.obs .cplaque .u{color:#9FC4EA} .cloc.obs .cplaque .prog i{background:linear-gradient(90deg,#3E6EA6,#9FC4EA)}

/* nameplate hint always slightly visible so locations are discoverable */
.cloc .cplaque{opacity:.16}

/* ---------- opening sequence ---------- */
.cop-title{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:11;opacity:0;animation:opTitle 1s ease-out .6s forwards}
@keyframes opTitle{to{opacity:1}}
.cop-title h1{font-family:var(--font-title);font-size:56px;font-weight:900;margin:0;color:#FBF3E4;
  text-shadow:0 2px 0 rgba(120,70,20,.4),0 10px 34px rgba(60,30,8,.5),0 0 40px rgba(255,220,150,.25)}
.cop-title .en{font-size:15px;letter-spacing:4px;color:#F0D8B4;direction:ltr;margin-top:6px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.cop-cta{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);z-index:12;text-align:center;opacity:0;animation:opTitle .9s ease-out 1.4s forwards}
.cop-sub{margin-top:12px;font-size:14px;color:#EAF4E8;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* credit — high contrast, elegant, readable on any scene */
.credit-band{position:absolute;bottom:14px;left:0;right:0;text-align:center;z-index:12}
.credit-band span{display:inline-block;padding:5px 16px;border-radius:20px;font-size:13.5px;font-weight:700;color:#FFF6E4;
  background:rgba(14,26,30,.5);border:1px solid rgba(255,236,200,.28);backdrop-filter:blur(5px);
  text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* carved-copper CTA */
.cta-plate{position:relative;min-height:62px;padding:16px 44px;border:none;border-radius:18px;
  font-family:var(--font-title);font-size:22px;font-weight:800;color:#2a1608;
  background:linear-gradient(180deg,#F8CD8B,#DE974B 58%,#C57B3D);
  box-shadow:0 11px 0 #9E5C28,0 24px 46px rgba(120,60,20,.45),inset 0 2px 5px rgba(255,240,210,.75);
  transition:transform .12s,box-shadow .12s}
.cta-plate:hover{transform:translateY(-2px);box-shadow:0 13px 0 #9E5C28,0 30px 54px rgba(120,60,20,.5),inset 0 2px 5px rgba(255,240,210,.85)}
.cta-plate:active{transform:translateY(7px);box-shadow:0 4px 0 #9E5C28,0 10px 20px rgba(120,60,20,.4)}

/* ---------- hub title ---------- */
.chub-title{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:11;pointer-events:none}
.chub-title h1{font-family:var(--font-title);font-size:32px;font-weight:900;margin:0;color:#FBF3E4;text-shadow:0 2px 10px rgba(40,20,8,.6)}
.chub-title .en{font-size:12.5px;color:#E7CFA8;direction:ltr;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* spatial transition into a location */
.cit-enter{animation:citEnter .55s cubic-bezier(.4,0,.2,1)}
@keyframes citEnter{from{transform:scale(1);opacity:1}to{transform:scale(1.5);opacity:0}}
.cit-arrive{animation:citArrive .5s ease-out}
@keyframes citArrive{from{transform:scale(.86);opacity:.3}to{transform:scale(1);opacity:1}}

/* ---------- compact control dock ---------- */
.dock{position:absolute;top:14px;left:14px;z-index:24;display:flex;gap:7px;align-items:center}
.dock.right{left:auto;right:14px}
.dock-btn{width:42px;height:42px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(24,40,44,.66),rgba(14,26,30,.74));
  border:1px solid rgba(150,220,210,.3);box-shadow:0 6px 16px rgba(8,16,20,.4);backdrop-filter:blur(6px);color:#FCEBCF}
.dock-btn:hover{background:linear-gradient(180deg,rgba(34,54,58,.8),rgba(20,34,38,.86))}
.dock-btn svg{width:20px;height:20px}
.dock-btn.wide{width:auto;padding:0 13px;gap:7px;font-size:13px;font-weight:700}

/* ---------- reduced motion: keep it premium, drop motion ---------- */
body.rm .cbeam,body.rm .falaj-flow,body.rm .flow-dot,body.rm .anim-float,body.rm .anim-glow,body.rm .cparts{animation:none!important}
body.rm .cop-title,body.rm .cop-cta{animation:none!important;opacity:1!important}
body.rm .cit .clayer{transition:none!important}
/* in RM, show the falaj as a steady luminous line (static premium look) */
body.rm .falaj-flow{stroke-dasharray:none;opacity:.9}
body.rm .cplaque{opacity:.9!important;transform:none!important}

/* low performance: hide heavy decor */
body.lp .cparts,body.lp .cbeam,body.lp .decor,body.lp .falaj-flow{display:none!important}
body.lp .cplaque,body.lp .dock-btn{backdrop-filter:none!important}

/* ---------- lesson index inside the environment (gallery) ---------- */
.gallery{position:absolute;inset:0;overflow:hidden}
.gallery .gwalk{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;
  background:linear-gradient(180deg,transparent,rgba(58,36,18,.5));pointer-events:none}
.station-row{position:absolute;left:0;right:0;top:150px;bottom:96px;z-index:5;
  display:flex;gap:20px;align-items:center;justify-content:center;padding:0 40px;flex-wrap:nowrap}
.station{position:relative;width:180px;min-height:236px;cursor:pointer;border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;
  box-shadow:0 16px 36px rgba(12,24,20,.5)}
.station:hover,.station:focus-visible{transform:translateY(-8px);outline:none}
.station .st-scene{height:118px;position:relative;overflow:hidden}
.station .st-scene svg{position:absolute;inset:0;width:100%;height:100%}
.station .st-body{flex:1;padding:11px 13px 13px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(20,40,44,.96),rgba(13,28,32,.98))}
.station .st-code{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:6px;align-self:flex-start}
.station .st-title{font-family:var(--font-title);font-weight:800;font-size:15px;color:#FBF3E4;margin-top:7px;line-height:1.35;text-align:center}
.station .st-en{font-size:10px;color:#A9C4BD;direction:ltr;text-align:center;margin-top:1px}
.station .st-tag{margin-top:auto;font-size:10.5px;padding:2px 9px;border-radius:16px;align-self:center}
.station.feat{border:2px solid var(--teal-2)}
.station.feat .st-code{background:var(--teal-2)}
.station.soon{opacity:.82;border:1.5px solid rgba(255,236,200,.16)}
.station.soon .st-code{background:var(--muted)}
.station.soon .st-tag{background:rgba(197,123,61,.16);border:1px solid rgba(197,123,61,.3);color:#EAD9C6}
.station.done .st-code{background:var(--teal-2)}
.station .st-done{position:absolute;top:8px;left:8px;z-index:3;color:var(--teal-hi);font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gindex-project{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:6}

/* CP3 temporary: Unit-3 entrance is inert scenery (no interaction, no hover affordance).
   Removed in Checkpoint 4 when Unit 3 becomes fully accessible. */
.cloc.cloc-inactive{cursor:default;pointer-events:none}
.cloc.cloc-inactive .cplaque{opacity:0}
.cloc.cloc-inactive:hover,.cloc.cloc-inactive:focus-visible{transform:none}
.cloc.cloc-inactive:hover .cloc-halo{opacity:0}

/* ==== styles/unit3.css ==== */
/* ==== styles/unit3.css — Unit 3 (Connected World) UI: browser / search / wikipedia / scenarios ==== */

/* observatory lesson host */
.obs-env{position:absolute;inset:0;overflow:hidden}
.obs-env .obs-bg{position:absolute;inset:0;background:linear-gradient(170deg,#1E3348,#16283b 55%,#0e1a28)}
.obs-stage{position:absolute;left:150px;top:84px;width:840px;height:548px;z-index:5}

/* ---------- offline browser chrome ---------- */
.brw{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#eef2f6;box-shadow:var(--sh-2);border:1px solid rgba(30,51,72,.5);display:flex;flex-direction:column}
.brw-top{background:#dfe6ee;border-bottom:1px solid #c3ccd6;padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
.brw-tabs{display:flex;gap:4px;align-items:flex-end}
.brw-tab{background:#eef2f6;border:1px solid #c3ccd6;border-bottom:none;border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px;color:#2A3A4A;display:flex;align-items:center;gap:8px;cursor:pointer;max-width:180px}
.brw-tab.on{background:#fff;font-weight:700}
.brw-tab .x{opacity:.6;cursor:pointer}
.brw-newtab{background:#eef2f6;border:1px solid #c3ccd6;border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#2A3A4A}
.brw-nav{display:flex;align-items:center;gap:8px;padding:4px 2px 8px}
.brw-btn{width:30px;height:30px;border-radius:8px;border:1px solid #c3ccd6;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#2A3A4A;font-size:15px}
.brw-btn:disabled{opacity:.4;cursor:not-allowed}
.brw-btn:hover:not(:disabled){background:#f0f4f8}
.brw-addr{flex:1;height:32px;border-radius:16px;border:1px solid #c3ccd6;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
.brw-addr svg{width:14px;height:14px;opacity:.6}
.brw-addr input{flex:1;border:none;outline:none;font-family:var(--font-body);font-size:13px;color:#1a2733;direction:ltr;text-align:left}
.brw-body{flex:1;background:#fff;overflow:auto;position:relative}

/* search engine page */
.se-page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:26px 20px;gap:16px;background:#fff}
.se-logo{font-family:var(--font-title);font-size:34px;font-weight:800;color:#2A6E67;letter-spacing:.5px}
.se-logo span:nth-child(2){color:#C57B3D}
.se-box{width:100%;max-width:520px;height:44px;border-radius:24px;border:1.5px solid #c3ccd6;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.se-box svg{width:18px;height:18px;opacity:.55}
.se-box input{flex:1;border:none;outline:none;font-family:var(--font-body);font-size:15px}
.se-go{background:#2A6E67;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer}
.se-hint{color:#6b8a84;font-size:12.5px}
/* results */
.se-results{width:100%;max-width:620px;display:flex;flex-direction:column;gap:16px;align-self:flex-start;padding-right:8px}
.se-result{cursor:pointer;padding:8px;border-radius:10px}
.se-result:hover{background:#f2f6f9}
.se-result .u{color:#2A6E67;font-size:12px;direction:ltr}
.se-result .t{color:#1a56b8;font-size:17px;font-weight:600;margin:2px 0}
.se-result:hover .t{text-decoration:underline}
.se-result .d{color:#41505e;font-size:13px;line-height:1.5}
.se-result.relevant .t{color:#0b7a3b}

/* content article page (locally packaged) */
.art-page{max-width:720px;margin:0 auto;padding:22px 26px;color:#1f2b36;line-height:1.7}
.art-page h1{font-size:26px;color:#153b3a;margin:0 0 6px}
.art-page h2{font-size:19px;color:#2A6E67;border-bottom:1px solid #e0e6ea;padding-bottom:4px;margin:20px 0 8px;scroll-margin-top:10px}
.art-page p{font-size:14.5px;margin:8px 0}
.art-page .selectable{cursor:text}
.art-figure{float:left;margin:6px 16px 10px 0;width:220px;border:1px solid #dbe2e8;border-radius:8px;overflow:hidden;background:#f6f8fa}
.art-figure .cap{font-size:11px;color:#6b7a88;padding:5px 8px;text-align:center}
.art-figure .imgbox{height:140px;display:flex;align-items:center;justify-content:center}
.art-figure .imgbox svg{width:100%;height:100%}
.art-copybar{position:sticky;top:0;background:#fffbe9;border-bottom:1px solid #ecdca0;padding:6px 12px;font-size:12px;color:#7a5a1a;display:flex;gap:10px;align-items:center;z-index:2}
.art-copybar button{background:#C57B3D;color:#fff;border:none;border-radius:7px;padding:5px 12px;font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer}
.art-copybar button:disabled{opacity:.4;cursor:not-allowed}

/* image context menu + Save Image As dialog */
.img-menu{position:absolute;z-index:40;background:#fff;border:1px solid #c3ccd6;border-radius:8px;box-shadow:var(--sh-2);padding:5px;min-width:190px}
.img-menu .mi{padding:8px 12px;border-radius:6px;font-size:13px;color:#1f2b36;cursor:pointer;display:flex;align-items:center;gap:9px}
.img-menu .mi:hover{background:#eef4f8}
.img-menu .mi.key{font-weight:700;color:#153b3a}

/* wikipedia-style page */
.wiki{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-radius:0}
.wiki-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e6e6e6;background:#f8f9fa}
.wiki-globe{width:38px;height:38px}
.wiki-title{font-family:Georgia,'Times New Roman',serif;font-size:19px;color:#202122}
.wiki-search{margin-right:auto;display:flex;gap:6px}
.wiki-search input{height:30px;border:1px solid #a2a9b1;border-radius:2px;padding:0 8px;font-size:13px;width:200px;font-family:var(--font-body)}
.wiki-search button{height:30px;border:1px solid #a2a9b1;background:#f8f9fa;border-radius:2px;padding:0 12px;cursor:pointer;font-family:var(--font-body);font-size:12.5px}
.wiki-body{flex:1;display:flex;overflow:hidden}
.wiki-toc{width:200px;border-left:1px solid #eaecf0;background:#f8f9fa;padding:12px;overflow:auto;font-size:13px}
.wiki-toc h4{margin:0 0 8px;font-size:12px;color:#54595d;text-transform:uppercase;letter-spacing:.4px}
.wiki-toc a{display:block;color:#3366cc;padding:4px 0;cursor:pointer;text-decoration:none}
.wiki-toc a:hover{text-decoration:underline}
.wiki-content{flex:1;overflow:auto;padding:16px 26px;color:#202122;line-height:1.7}
.wiki-content h1{font-family:Georgia,serif;font-size:27px;border-bottom:1px solid #a2a9b1;padding-bottom:5px;font-weight:400}
.wiki-content h2{font-family:Georgia,serif;font-size:20px;border-bottom:1px solid #a2a9b1;padding-bottom:4px;margin-top:20px;font-weight:400;scroll-margin-top:8px}
.wiki-content p{font-size:14px;margin:9px 0}
.wiki-figure{float:left;margin:4px 16px 10px 0;width:220px;border:1px solid #c8ccd1;background:#f8f9fa;border-radius:2px;padding:4px}
.wiki-figure .imgbox{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wiki-figure .imgbox svg{width:100%;height:100%}
.wiki-figure .cap{font-size:11.5px;color:#54595d;padding:5px 4px 2px}

/* scenario cards (safety / ethics) */
.scn-wrap{position:absolute;left:150px;top:96px;width:840px;height:520px;z-index:5;display:flex;flex-direction:column;gap:14px;padding:8px}
.scn-card{background:linear-gradient(180deg,rgba(30,51,72,.92),rgba(17,30,44,.92));border:1.5px solid rgba(111,160,218,.35);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-1)}
.scn-msg{display:flex;gap:12px;align-items:flex-start}
.scn-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3B9188,#2A6E67);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.scn-avatar svg{width:26px;height:26px}
.scn-bubble{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;color:var(--cream);font-size:14px;line-height:1.6}
.scn-q{color:var(--cream-2);font-size:13.5px;margin:12px 0 8px;font-weight:700}
.scn-choices{display:flex;flex-direction:column;gap:9px}
.scn-choice{text-align:right;background:rgba(255,255,255,.05);border:1.4px solid var(--glass-edge);border-radius:11px;padding:12px 14px;color:var(--cream);font-size:13.5px;cursor:pointer;font-family:var(--font-body);transition:border-color .2s,background .2s}
.scn-choice:hover{background:rgba(255,255,255,.1)}
.scn-choice.correct{border-color:var(--ok);background:rgba(28,50,34,.5)}
.scn-choice.wrong{border-color:#e0644c;background:rgba(80,30,24,.4)}
.scn-explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(95,184,174,.14);border:1px solid var(--teal-2);color:var(--cream);font-size:13px;line-height:1.6}

/* quick interactive practice bits (3.5) */
.pr-blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--copper-2);text-align:center;color:var(--teal-hi);font-weight:700;padding:0 6px}
.pr-chip{display:inline-flex;align-items:center;background:rgba(95,184,174,.16);border:1.3px solid var(--teal-2);border-radius:8px;padding:5px 12px;margin:4px;cursor:pointer;color:var(--cream);font-size:13px}
.pr-chip.used{opacity:.4;pointer-events:none}
.pr-order{display:flex;flex-direction:column;gap:8px}
.pr-step{background:rgba(255,255,255,.05);border:1.4px solid var(--glass-edge);border-radius:10px;padding:10px 12px;color:var(--cream);font-size:13px;cursor:grab;display:flex;align-items:center;gap:10px}
.pr-step .n{width:22px;height:22px;border-radius:50%;background:rgba(111,160,218,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* Correction 7: scenario illustrations */
.scn-illus{display:flex;justify-content:center;margin:10px 0 2px}
.scn-illus svg{height:104px;width:auto;max-width:100%;border-radius:10px;background:rgba(255,255,255,.06);padding:6px}
.prog-illus{display:flex;justify-content:center;margin:6px 0}
.prog-illus svg{height:64px;width:auto}

/* R1 hotfix: shared mini Windows desktop (real bottom taskbar + Start menu anchored above Start) */
.mini-winos{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2b6cb0,#1e4e8c 60%,#14375f)}
.mini-deskarea{position:absolute;left:0;right:0;top:0;bottom:48px;overflow:hidden}
.mini-taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(18,26,34,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid rgba(255,255,255,.08);z-index:15}
.mini-start-btn{width:38px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.08);transition:background .15s,box-shadow .2s}
.mini-start-btn:hover{background:rgba(255,255,255,.18)}
.mini-start-btn svg{width:22px;height:22px}
.mini-start-btn.ready{background:rgba(95,184,174,.28)}
.mini-start-btn.pulse{animation:miniStartPulse 1.3s ease-in-out infinite;box-shadow:0 0 0 3px rgba(95,184,174,.4)}
@keyframes miniStartPulse{0%,100%{box-shadow:0 0 0 3px rgba(95,184,174,.35)}50%{box-shadow:0 0 0 7px rgba(95,184,174,.12)}}
.mini-tray{margin-right:auto;display:flex;align-items:center;gap:10px;color:#e6edf3}
.mini-clock{text-align:center;line-height:1.15}
.mini-clock .t{font-size:12.5px;font-weight:700}.mini-clock .d{font-size:10.5px;opacity:.85}
.mini-startmenu{position:absolute;z-index:30;width:250px;background:rgba(28,38,48,.98);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:var(--sh-2);padding:12px;color:#e6edf3}
.mini-startmenu .msm-h{font-size:12px;color:#9fd3cc;margin-bottom:8px}
.mini-startmenu .msm-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.mini-startmenu .msm-item:hover{background:rgba(255,255,255,.1)}
.mini-startmenu .msm-item svg{width:18px;height:18px}
/* Phase-1 connection cards live in a centered desktop panel, never over the browser */
.mini-connpanel{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(560px,86%);background:rgba(23,57,59,.96);border:1.4px solid rgba(95,184,174,.35);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-2);z-index:8;transition:opacity .4s ease,transform .4s ease}
.mini-connpanel.collapsing{opacity:0;transform:translate(-50%,-58%);pointer-events:none}
.mini-connpanel h3{margin:0 0 12px;color:var(--cream);font-size:15px;text-align:center}
.mini-conncard{background:rgba(12,32,34,.6);border:1.3px solid rgba(95,184,174,.28);border-radius:11px;padding:10px 12px;margin-bottom:9px}
.mini-conncard .q{color:var(--cream);font-size:13px;margin-bottom:7px}
.mini-conncard .row{display:flex;gap:7px;flex-wrap:wrap}
/* Chrome fills the safe area above the taskbar with a small internal margin */
.mini-chromehost{position:absolute;inset:8px;overflow:hidden}

/* ==== styles/s2.css ==== */
/* ==== styles/s2.css — الفصل الدراسي الثاني: الهوية نفسها، مشاهد جديدة ====
 * يعيد استخدام رموز التصميم المعتمدة في base.css (نفس الألوان والخطوط والظلال).
 * كل الأحجام التفاعلية ≥ 48×48 بكسل. RTL سليم والمصطلحات الإنجليزية LTR.
 */

/* ---------- اختيار الفصل الدراسي ---------- */
.sem-plate{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
  display:flex;gap:10px;align-items:center}
.sem-btn{min-height:48px;padding:10px 20px;border-radius:var(--r-2);cursor:pointer;
  font-family:var(--font-title);font-size:15px;font-weight:800;color:var(--cream);
  background:linear-gradient(165deg,rgba(23,51,67,.92),rgba(15,39,53,.96));
  border:1.8px solid rgba(231,160,99,.55);box-shadow:var(--sh-1);
  display:flex;align-items:center;gap:8px;transition:transform .16s,border-color .16s}
.sem-btn:hover,.sem-btn:focus-visible{border-color:var(--copper-hi);transform:translateY(-2px)}
.sem-btn .en{font-family:var(--font-body);font-size:10.5px;color:var(--muted);direction:ltr}
.sem-btn.on{border-color:var(--brass);background:linear-gradient(165deg,#20455a,#123246)}

.semwrap{position:absolute;inset:0;z-index:1}
.sem-cards{position:absolute;left:50%;top:212px;transform:translateX(-50%);
  display:flex;gap:34px;z-index:20}
.sem-card{width:392px;min-height:330px;border-radius:var(--r-3);cursor:pointer;padding:22px;
  background:linear-gradient(168deg,rgba(20,46,60,.94),rgba(11,30,42,.97));
  border:2px solid rgba(231,160,99,.42);box-shadow:var(--sh-2);
  display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.sem-card:hover,.sem-card:focus-visible{transform:translateY(-6px);border-color:var(--copper-hi)}
.sem-card .badge{align-self:flex-start;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(231,160,99,.18);border:1px solid rgba(231,160,99,.5);color:var(--copper-hi)}
.sem-card h2{margin:2px 0 0;font-family:var(--font-title);font-size:25px;color:var(--sand-1)}
.sem-card .en{direction:ltr;font-size:12px;color:var(--muted)}
.sem-card .art{height:118px;margin:6px 0;border-radius:var(--r-1);overflow:hidden;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,236,200,.12)}
.sem-card ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.sem-card li{font-size:13px;line-height:1.65;color:var(--cream-2)}
.sem-card .go{margin-top:auto;align-self:stretch;flex:0 0 auto;height:54px;min-height:54px;border-radius:var(--r-1);
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;
  background:linear-gradient(165deg,var(--copper-1),var(--copper-3));color:#2a1608;
  border:1.6px solid var(--copper-hi)}
.sem-card .prog{height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}
.sem-card .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-1),var(--copper-1))}

/* ---------- شارة الفصل في أعلى المشاهد ---------- */
.s2-tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:26;
  padding:6px 16px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--copper-hi);
  background:rgba(11,30,42,.82);border:1px solid rgba(231,160,99,.45);white-space:nowrap}

/* ---------- إطار الدرس (الشريط العلوي + مسار المراحل) ---------- */
.s2-frame{position:absolute;inset:0;display:flex;flex-direction:column;z-index:5}
.s2-top{display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(10,26,36,.96),rgba(10,26,36,.80));
  border-bottom:1.5px solid rgba(231,160,99,.28)}
.s2-code{min-width:52px;height:34px;padding:0 10px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-3))}
.s2-ttl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.s2-ttl b{font-family:var(--font-title);font-size:16px;color:var(--sand-1);font-weight:800;
  white-space:normal;overflow:visible;text-overflow:clip}
.s2-ttl small{direction:ltr;font-size:10.5px;color:var(--muted)}

.s2-rail{display:flex;gap:5px;align-items:center}
.s2-step{min-width:44px;height:36px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--cream-2);background:rgba(255,255,255,.05);
  border:1.4px solid rgba(255,236,200,.16);cursor:pointer}
.s2-step i{width:9px;height:9px;border-radius:50%;background:rgba(255,236,200,.28);display:block}
.s2-step.live{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-2));border-color:var(--copper-hi)}
.s2-step.live i{background:#2a1608}
.s2-step.past{color:var(--teal-hi);border-color:rgba(95,184,174,.5);background:rgba(59,145,136,.16)}
.s2-step.past i{background:var(--teal-1)}
.s2-step:hover,.s2-step:focus-visible{border-color:var(--copper-hi);background:rgba(231,160,99,.14);outline:none}

.s2-body{flex:1;position:relative;overflow:hidden}

/* ---------- لوحة التعليمات (لا تغطي مكان العمل أبدًا) ---------- */
.s2-panel{position:absolute;top:8px;left:8px;width:262px;max-height:calc(100% - 16px);z-index:40;
  display:flex;flex-direction:column;border-radius:var(--r-2);overflow:hidden;
  background:linear-gradient(168deg,rgba(15,39,53,.97),rgba(10,26,36,.98));
  border:1.6px solid rgba(231,160,99,.45);box-shadow:var(--sh-1)}
.s2-panel .ph{padding:9px 12px;background:rgba(231,160,99,.14);border-bottom:1px solid rgba(231,160,99,.3)}
.s2-panel .ph b{display:block;font-size:13.5px;color:var(--copper-hi);font-weight:800}
.s2-panel .ph span{display:block;direction:ltr;font-size:10px;color:var(--muted)}
.s2-panel .pb{padding:10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.s2-instr{font-size:13.5px;line-height:1.75;color:var(--cream)}
.s2-instr .en{display:block;direction:ltr;font-size:10.5px;color:var(--muted);margin-top:3px}
.s2-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.s2-checks li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.55;color:var(--cream-2)}
.s2-checks li b{flex:0 0 19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:rgba(255,255,255,.08);border:1.2px solid rgba(255,236,200,.22);color:var(--cream-2)}
.s2-checks li.cur{color:var(--sand-1);font-weight:700}
.s2-checks li.cur b{border-color:var(--copper-hi);color:var(--copper-hi)}
.s2-checks li.done{color:var(--teal-hi)}
.s2-checks li.done b{background:var(--teal-3);border-color:var(--teal-1);color:#eafffb}
.s2-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.s2-btn{min-height:48px;flex:1 1 auto;padding:8px 12px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:700;
  color:var(--cream);background:rgba(255,255,255,.06);border:1.4px solid rgba(255,236,200,.24)}
.s2-btn:hover,.s2-btn:focus-visible{border-color:var(--copper-hi);background:rgba(231,160,99,.16)}
.s2-btn.primary{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border-color:var(--copper-hi)}
.s2-btn.wide{flex:1 1 100%}

/* ---------- منطقة العمل ---------- */
.s2-work{position:absolute;top:0;left:278px;right:0;bottom:0;overflow:hidden}
.s2-work.full{left:0}

/* ---------- التغذية الراجعة ---------- */
.s2-fb{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(14px);z-index:70;
  max-width:min(680px,86%);padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .2s,transform .2s;
  font-size:13.5px;line-height:1.6;font-weight:700;pointer-events:none;box-shadow:var(--sh-1)}
.s2-fb.on{opacity:1;transform:translateX(-50%) translateY(0)}
.s2-fb.ok{background:linear-gradient(165deg,#2f7d5c,#1e5b41);color:#eafff4;border:1.5px solid #6fd8a8}
.s2-fb.no{background:linear-gradient(165deg,#8a4432,#6a3323);color:#ffeee7;border:1.5px solid #e2a58f}
.s2-fb.hint{background:linear-gradient(165deg,#2c4d63,#1b3547);color:#e6f2fb;border:1.5px solid #7fb6d8}

/* ---------- إرشاد بصري ---------- */
.s2-ring{position:absolute;z-index:55;border-radius:12px;pointer-events:none;
  border:2.6px solid var(--copper-hi);box-shadow:0 0 0 3px rgba(231,160,99,.22),0 0 18px rgba(231,160,99,.55)}
body:not(.rm) .s2-ring{animation:s2pulse 1.6s ease-in-out infinite}
@keyframes s2pulse{0%,100%{box-shadow:0 0 0 3px rgba(231,160,99,.18),0 0 14px rgba(231,160,99,.42)}
  50%{box-shadow:0 0 0 6px rgba(231,160,99,.30),0 0 24px rgba(231,160,99,.72)}}
.s2-hand{position:absolute;z-index:56;pointer-events:none;transform:translateX(-50%);font-size:26px;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
body:not(.rm) .s2-hand{animation:s2hand 1.5s ease-in-out infinite}
@keyframes s2hand{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}

/* ---------- مشاهد نظرية: بطاقات كبيرة ووظيفية ---------- */
.s2-theory{position:absolute;top:0;right:0;bottom:0;left:278px;overflow-y:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:14px}
.s2-hero{display:flex;gap:18px;align-items:center;border-radius:var(--r-2);padding:14px 18px;
  background:linear-gradient(150deg,rgba(30,85,104,.55),rgba(11,30,42,.72));
  border:1.5px solid rgba(95,184,174,.32)}
.s2-hero .txt{flex:1;min-width:0}
.s2-hero h2{margin:0 0 6px;font-family:var(--font-title);font-size:23px;color:var(--sand-1)}
.s2-hero p{margin:0;font-size:15px;line-height:1.85;color:var(--cream)}
.s2-hero .art{flex:0 0 auto;border-radius:var(--r-1);overflow:hidden;background:rgba(0,0,0,.2)}

.s2-figrow{display:flex;gap:14px;flex-wrap:wrap}
.s2-fig{flex:1 1 260px;min-width:250px;border-radius:var(--r-2);overflow:hidden;
  background:rgba(255,255,255,.045);border:1.5px solid rgba(255,236,200,.16);display:flex;flex-direction:column}
.s2-fig .cap{padding:9px 12px;border-top:1px solid rgba(255,236,200,.12)}
.s2-fig .cap b{display:block;font-size:14.5px;color:var(--sand-1);font-weight:800}
.s2-fig .cap .en{direction:ltr;font-size:11px;color:var(--muted)}
.s2-fig .cap p{margin:5px 0 0;font-size:13px;line-height:1.7;color:var(--cream-2)}
.s2-fig .pic{background:#F4EEE1;display:flex;align-items:center;justify-content:center;padding:6px}
.s2-fig.good{border-color:rgba(79,167,114,.55)}
.s2-fig.bad{border-color:rgba(207,106,76,.55)}
.s2-fig .tagline{position:absolute;margin:8px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}

.s2-note{border-radius:var(--r-1);padding:11px 15px;font-size:13.5px;line-height:1.8;color:var(--cream);
  background:rgba(231,160,99,.12);border:1.4px solid rgba(231,160,99,.36)}
.s2-note b{color:var(--copper-hi)}

/* شريط مصطلحات: العربي بارز والإنجليزي LTR بجانبه */
.s2-terms{display:flex;flex-wrap:wrap;gap:8px}
.s2-term{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;
  background:rgba(255,255,255,.06);border:1.3px solid rgba(255,236,200,.2);color:var(--cream)}
.s2-term span{direction:ltr;font-size:11.5px;color:var(--teal-hi);font-weight:700}

/* ---------- الأنشطة التقويمية ---------- */
.s2-quiz{position:absolute;top:0;right:0;bottom:0;left:278px;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:13px}
.s2-q{border-radius:var(--r-2);padding:14px 16px;background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,236,200,.18)}
.s2-q .kind{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;
  background:rgba(95,184,174,.18);border:1px solid rgba(95,184,174,.45);color:var(--teal-hi);margin-bottom:7px}
.s2-q h3{margin:0 0 10px;font-size:16px;line-height:1.7;color:var(--sand-1);font-weight:800}
.s2-q.solved{border-color:rgba(79,167,114,.6);background:rgba(79,167,114,.09)}

.s2-opts{display:flex;flex-wrap:wrap;gap:9px}
.s2-opt{min-height:48px;padding:10px 15px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:700;
  color:var(--cream);background:rgba(255,255,255,.06);border:1.6px solid rgba(255,236,200,.22);
  display:flex;align-items:center;gap:9px;text-align:start}
.s2-opt:hover:not(:disabled),.s2-opt:focus-visible{border-color:var(--copper-hi);background:rgba(231,160,99,.14)}
.s2-opt.right{background:rgba(79,167,114,.22);border-color:#6fd8a8;color:#eafff4}
.s2-opt.wrong{background:rgba(207,106,76,.2);border-color:#e2a58f;color:#ffeee7}
.s2-opt:disabled{cursor:default;opacity:.9}
.s2-opt .fig{flex:0 0 auto;border-radius:8px;overflow:hidden;background:#F4EEE1;padding:2px;display:flex}

.s2-why{margin-top:10px;padding:9px 13px;border-radius:11px;font-size:13px;line-height:1.75;
  background:rgba(0,0,0,.26);border:1.2px solid rgba(255,236,200,.16);color:var(--cream-2)}
.s2-why b{color:var(--teal-hi)}

/* رتّب */
.s2-order{display:flex;flex-direction:column;gap:8px}
.s2-slot{min-height:52px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(0,0,0,.24);border:1.6px dashed rgba(255,236,200,.28);cursor:grab;font-size:14px;color:var(--cream)}
.s2-slot .n{flex:0 0 26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;background:rgba(231,160,99,.22);color:var(--copper-hi)}
.s2-slot.drag{opacity:.45}
.s2-slot.over{border-color:var(--copper-hi);background:rgba(231,160,99,.14)}
.s2-slot.locked{cursor:default;border-style:solid;border-color:rgba(79,167,114,.5);background:rgba(79,167,114,.12)}
.s2-slot .mv{margin-inline-start:auto;display:flex;gap:5px}
.s2-mvb{width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:800;
  background:rgba(255,255,255,.08);border:1.2px solid rgba(255,236,200,.22);color:var(--cream)}
.s2-mvb:hover{border-color:var(--copper-hi)}

/* صِلْ */
.s2-match{display:flex;gap:18px;align-items:flex-start}
.s2-mcol{flex:1;display:flex;flex-direction:column;gap:8px}
.s2-mi{min-height:50px;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:13.5px;font-weight:700;
  color:var(--cream);background:rgba(255,255,255,.06);border:1.6px solid rgba(255,236,200,.22);
  display:flex;align-items:center;gap:9px}
.s2-mi.sel{border-color:var(--copper-hi);background:rgba(231,160,99,.2)}
.s2-mi.tied{border-color:rgba(79,167,114,.6);background:rgba(79,167,114,.16);color:#eafff4;cursor:default}
.s2-mi .en{direction:ltr;font-size:11.5px;color:var(--teal-hi)}

/* صنّف */
.s2-sortbank{display:flex;flex-wrap:wrap;gap:9px;min-height:60px;padding:9px;border-radius:12px;
  background:rgba(0,0,0,.22);border:1.4px dashed rgba(255,236,200,.22)}
.s2-bins{display:flex;gap:14px;margin-top:11px}
.s2-bin{flex:1;min-height:130px;border-radius:14px;padding:9px;background:rgba(255,255,255,.04);
  border:1.8px dashed rgba(255,236,200,.26);display:flex;flex-direction:column;gap:7px}
.s2-bin.hot{border-color:var(--copper-hi);background:rgba(231,160,99,.14)}
.s2-bin h4{margin:0;font-size:13.5px;color:var(--sand-1);text-align:center;font-weight:800}
.s2-bin .drops{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.s2-chip{min-height:48px;padding:8px 13px;border-radius:11px;cursor:grab;font-size:13.5px;font-weight:700;
  color:var(--cream);background:linear-gradient(165deg,rgba(30,85,104,.9),rgba(18,63,79,.95));
  border:1.5px solid rgba(95,184,174,.5);display:flex;align-items:center;gap:7px;user-select:none;touch-action:none}
.s2-chip.grab{cursor:grabbing;box-shadow:var(--sh-1)}
.s2-chip.placed{cursor:default;border-color:rgba(79,167,114,.6)}

/* أكمل */
.s2-fill{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;line-height:2.1;color:var(--cream)}
.s2-blank{min-width:96px;min-height:44px;padding:6px 12px;border-radius:10px;text-align:center;font-size:14px;
  font-weight:800;color:var(--sand-1);background:rgba(0,0,0,.3);border:1.6px dashed rgba(231,160,99,.5)}
.s2-blank.filled{border-style:solid;border-color:rgba(79,167,114,.6);background:rgba(79,167,114,.16);color:#eafff4}

/* ---------- بطاقة الإتقان ---------- */
.s2-done{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(5,14,20,.82)}
.s2-done .in{width:min(560px,88%);padding:26px;border-radius:var(--r-3);text-align:center;
  background:linear-gradient(168deg,#15384a,#0b2130);border:2px solid rgba(231,160,99,.6);box-shadow:var(--sh-2)}
.s2-done .mk{font-size:42px;color:var(--brass)}
.s2-done h2{margin:6px 0;font-family:var(--font-title);font-size:25px;color:var(--sand-1)}
.s2-done p{margin:0 0 6px;font-size:14.5px;line-height:1.85;color:var(--cream-2)}
.s2-done .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* ---------- معرض الوحدة (يُعاد استخدام هيئة CP1) ---------- */
.s2-gal-note{position:absolute;left:50%;transform:translateX(-50%);top:96px;z-index:22;
  font-size:12.5px;color:var(--cream-2);background:rgba(11,30,42,.75);padding:5px 14px;border-radius:999px;
  border:1px solid rgba(255,236,200,.16)}

/* ---------- شريط الاعتماد ---------- */
.s2-credit{position:absolute;left:0;right:0;bottom:0;z-index:28;text-align:center;padding:5px 0 6px;
  background:linear-gradient(0deg,rgba(6,17,24,.94),rgba(6,17,24,0));pointer-events:none}
.s2-credit span{font-size:12px;font-weight:700;color:var(--sand-1)}
.s2-credit small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}

/* ---------- لوحة المعلم لكل درس ---------- */
.tm-jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tm-jump button{min-height:40px;padding:6px 11px;font-size:12px;border-radius:9px;cursor:pointer;
  color:var(--cream);background:rgba(255,255,255,.07);border:1.3px solid rgba(255,236,200,.22)}
.tm-jump button:hover{border-color:var(--copper-hi)}
.tm-jump button.on{background:linear-gradient(165deg,var(--copper-1),var(--copper-3));color:#2a1608}
.tm-plan{display:flex;flex-direction:column;gap:5px;margin:4px 0}
.tm-plan .r{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--cream-2);line-height:1.6}
.tm-plan .r b{flex:0 0 62px;color:var(--copper-hi);font-size:12px}
.tm-why{font-size:12.5px;line-height:1.7;color:var(--cream-2);background:rgba(0,0,0,.22);
  border:1.2px solid rgba(255,236,200,.14);border-radius:10px;padding:8px 11px;margin-top:5px}


/* ================= شاشة اختيار الوحدتين — تخطيط نظيف بلا تراكب ================= */
.s2-head{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:24;text-align:center;
  padding:10px 30px;border-radius:16px;background:rgba(8,22,31,.72);border:1px solid rgba(231,160,99,.34);
  backdrop-filter:blur(3px);white-space:nowrap}
.s2-head .kicker{font-size:12px;font-weight:800;color:var(--copper-hi);letter-spacing:.3px}
.s2-head h1{margin:3px 0 2px;font-family:var(--font-title);font-size:31px;color:var(--sand-1);font-weight:800;line-height:1.15}
.s2-head .en{font-size:12px;color:var(--muted);direction:ltr}

.unit-cards{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:22;
  display:flex;gap:34px;align-items:stretch}
.unit-card{width:412px;border-radius:var(--r-3);cursor:pointer;padding:16px 18px 18px;
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(168deg,rgba(19,45,59,.96),rgba(10,27,38,.98));
  border:2px solid rgba(231,160,99,.40);box-shadow:var(--sh-2);
  transition:transform .2s,border-color .2s,box-shadow .2s}
.unit-card:hover,.unit-card:focus-visible{transform:translateY(-6px);border-color:var(--copper-hi);
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
.unit-card.u1{border-color:rgba(76,151,255,.42)}
.unit-card.u1:hover,.unit-card.u1:focus-visible{border-color:#8FC0FF}
.unit-card.u2{border-color:rgba(242,160,61,.44)}
.unit-card.u2:hover,.unit-card.u2:focus-visible{border-color:#FFCE8A}
.unit-card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.unit-card .badge{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(231,160,99,.18);border:1px solid rgba(231,160,99,.5);color:var(--copper-hi)}
.unit-card .app{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;direction:ltr;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,236,200,.22);color:var(--cream-2)}
.unit-card h2{margin:2px 0 0;font-family:var(--font-title);font-size:27px;color:var(--sand-1);font-weight:800}
.unit-card .sub{display:flex;flex-direction:column;gap:1px}
.unit-card .sub span{font-size:12.5px;color:var(--cream-2)}
.unit-card .sub .en{direction:ltr;font-size:11px;color:var(--muted)}
.unit-card .art{height:132px;border-radius:var(--r-1);overflow:hidden;margin:4px 0 2px;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,236,200,.12)}
.unit-card ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:2px}
.unit-card li{font-size:12.5px;line-height:1.6;color:var(--cream-2)}
.unit-card .foot{margin-top:4px;display:flex;flex-direction:column;gap:4px}
.unit-card .prog{height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}
.unit-card .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-1),var(--copper-1))}
.unit-card .cnt{font-size:11.5px;color:var(--muted)}
.unit-card .go{margin-top:6px;min-height:50px;border-radius:var(--r-1);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:15.5px;color:#2a1608;
  background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border:1.6px solid var(--copper-hi)}

/* ================= إصلاحات تراكب عامة ================= */
/* شريط الاعتماد لم يعد يغطي محتوى الصفحات */
.s2-theory{padding-bottom:52px}
.s2-quiz{padding-bottom:52px}
.s2-credit{padding:6px 0 7px;background:linear-gradient(0deg,rgba(6,17,24,.97) 55%,rgba(6,17,24,0))}

/* شارة الفصل في معارض الوحدات لا تلامس العنوان */
.s2-gal .gal-title,.s2-gal h1{margin-top:12px}
.s2-tag{top:8px}

/* شاشة اختيار الفصل: عنوان فوق لوح داكن بلا تراكب مع المنارة */
.semwrap .chub-title,.cit .chub-title.sem{background:rgba(8,22,31,.7);border-radius:16px;padding:10px 28px;
  border:1px solid rgba(231,160,99,.3)}


/* ================= تحسين عرض الشاشات النظرية ================= */
.s2-theory{gap:16px;padding:18px 24px 52px;max-width:1000px;margin:0 auto}
.s2-hero{padding:16px 22px;gap:22px}
.s2-hero h2{font-size:24px;margin-bottom:8px;line-height:1.3}
.s2-hero p{font-size:15.5px;line-height:1.9}
.s2-hero:not(:has(.art)) .txt{text-align:center;max-width:760px;margin:0 auto}
.s2-figrow{gap:16px}
.s2-fig{border-radius:var(--r-2);overflow:hidden}
.s2-fig .pic{min-height:150px;padding:10px}
.s2-fig .cap{padding:11px 14px 13px}
.s2-fig .cap b{font-size:15px}
.s2-fig .cap p{font-size:13.5px;line-height:1.75;margin-top:6px}
.s2-note{padding:13px 18px;font-size:14px;line-height:1.85}
.s2-terms{gap:9px;justify-content:center}
.s2-term{padding:8px 14px;font-size:13.5px}

/* صف أوامر متسق العرض بدل أزرار متفاوتة */
.s2-cmdrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.s2-cmdrow .s2-btn.cmd{flex:0 0 auto;min-width:168px;min-height:52px;font-size:14.5px}

/* أنشطة المراجعة: أعرض وأوضح */
.s2-quiz{max-width:1000px;margin:0 auto;padding:18px 24px 52px;gap:15px}
.s2-q{padding:16px 18px}
.s2-q h3{font-size:16.5px}


/* ================= حجز مساحة شريط الاعتماد: لا تغطية للمحاكيات ================= */
/* شريط الاعتماد ارتفاعه ~44 بكسل: تُحجز له مساحة فلا يغطي أي محتوى */
/* حُذف شريط الحقوق: تُستعاد المساحة كاملة بلا فراغ */
.s2-work{bottom:0}
.s2-body .s2-theory,.s2-body .s2-quiz{bottom:0;padding-bottom:18px}
.s2-credit{display:none}
.s2-credit{background:linear-gradient(0deg,#0a1a24 62%,rgba(10,26,36,.92) 88%,rgba(10,26,36,0))}

/* شاشة الوحدتين: البطاقات لا تلامس أزرار التنقل السفلية */
.unit-cards{top:136px}
.unit-card .art{height:112px}
.unit-card{padding:14px 18px 16px;gap:7px}
.unit-card h2{font-size:25px}
.sem-plate{bottom:8px}


/* ================= معارض الوحدات: الشارة فوق العنوان بلا تلامس ================= */
/* الشارة تُثبَّت في أعلى الشاشة، ويُزاح عنوان المعرض لأسفلها في مشاهد الفصل الثاني */
.s2-tag{top:6px}
.s2-gal .chub-title,.s2-gal-shift .chub-title{top:46px!important}
.s2-gal .station-row{top:150px!important}
.s2-gal-note{top:112px}


/* ================= بطاقة «كيف أستخدم هذا النشاط؟» ================= */
.s2-howto{display:flex;flex-direction:column;gap:5px;margin:0 0 12px;padding:11px 15px;border-radius:12px;
  background:rgba(95,184,174,.13);border:1.4px solid rgba(95,184,174,.42)}
.s2-howto b{font-size:13.5px;color:var(--teal-hi);font-weight:800}
.s2-howto span{font-size:13.5px;line-height:1.85;color:var(--cream)}
.s2-howto span b{color:var(--sand-1);font-weight:800}
.s2-howto .warn{font-size:12.5px;color:var(--copper-hi)}
.s2-howto.big{margin:4px auto 14px;max-width:760px}
.s2-howto i.k{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,236,200,.3);
  font-style:normal;font-size:12px;vertical-align:-6px;margin:0 2px;color:var(--sand-1)}

/* تلميح بصري متحرك على زر الترتيب عند أول دخول */
.s2-mvb.hint{border-color:var(--copper-hi);background:rgba(231,160,99,.3);color:var(--sand-1)}
body:not(.rm) .s2-mvb.hint{animation:mvhint 1s ease-in-out infinite}
@keyframes mvhint{0%,100%{box-shadow:0 0 0 0 rgba(231,160,99,.55)}50%{box-shadow:0 0 0 7px rgba(231,160,99,0)}}


/* ================= صف ثلاثي: صورة · بطاقة · سؤال بلا تمرير داخلي ================= */
.s2-triple{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.s2-triple>*{flex:1 1 300px;min-width:290px}
.s2-askcol{display:flex;flex-direction:column}
.s2-askcol .s2-q{flex:1;margin:0;overflow:visible;max-height:none}
.s2-askcol .s2-opts{flex-direction:column}
.s2-askcol .s2-opt{width:100%;min-height:54px;font-size:14.5px;justify-content:flex-start}
.s2-triple .s2-fig .pic{min-height:210px}
/* أي نشاط داخل مشهد نظري: بلا تمرير داخلي مصغّر */
.s2-theory .s2-quiz{position:static!important;padding:0!important;max-height:none;overflow:visible}
.s2-theory .s2-q{overflow:visible}


/* ================= مختبرات ومشاهد تفاعلية ================= */
.s2-lab{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.s2-labrail{flex:0 0 auto;display:flex;gap:7px;padding:8px 12px;flex-wrap:wrap;
  background:rgba(0,0,0,.22);border-bottom:1px solid rgba(255,236,200,.14)}
.s2-labcase{min-height:40px;padding:7px 14px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:700;
  color:var(--cream-2);background:rgba(255,255,255,.06);border:1.4px solid rgba(255,236,200,.2)}
.s2-labcase:hover{border-color:var(--copper-hi)}
.s2-labcase.on{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border-color:var(--copper-hi)}
.s2-labcase.done{color:var(--teal-hi);border-color:rgba(95,184,174,.55);background:rgba(59,145,136,.18)}
.s2-labcase.done.on{color:#2a1608}
.s2-labstep{flex:0 0 auto;padding:10px 14px;background:rgba(0,0,0,.16);border-bottom:1px solid rgba(255,236,200,.12)}
.s2-labstep .h{display:flex;flex-direction:column;gap:2px;margin-bottom:7px}
.s2-labstep .h b{font-size:15px;color:var(--sand-1)}
.s2-labstep .h .sym{font-size:13px;color:var(--copper-hi)}
.s2-labstep p{margin:6px 0;font-size:13.5px;line-height:1.75;color:var(--cream)}
.s2-labstep p.how{color:var(--teal-hi)}
.s2-labsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.s2-labsteps .st{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;
  color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,236,200,.16)}
.s2-labsteps .st.on{color:#2a1608;background:var(--copper-1);border-color:var(--copper-hi)}
.s2-labsteps .st.past{color:var(--teal-hi);border-color:rgba(95,184,174,.5)}
.s2-labopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.s2-labcheck{margin-top:8px;padding:8px 13px;border-radius:10px;font-size:13px;color:var(--cream-2);
  background:rgba(0,0,0,.24);border:1.2px dashed rgba(255,236,200,.24)}
.s2-labcheck.ok{color:#eafff4;background:rgba(79,167,114,.22);border-style:solid;border-color:#6fd8a8}
.s2-labstage{flex:1;position:relative;min-height:0}

/* قرص الدرجات */
.s2-dial{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px auto;max-width:640px}
.s2-dial .art{width:300px;height:300px}
.s2-dial .readout{display:flex;flex-direction:column;align-items:center;gap:2px}
.s2-dial .readout b{font-size:30px;color:var(--copper-hi);font-family:var(--font-title)}
.s2-dial .readout span{font-size:14px;color:var(--cream)}
.s2-dial .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* مقارنة التكرار */
.s2-cmp{max-width:900px;margin:4px auto}
.s2-cmp .cols{display:flex;gap:18px;flex-wrap:wrap}
.s2-cmp .col{flex:1 1 340px;border-radius:var(--r-2);padding:14px;background:rgba(255,255,255,.05);
  border:1.6px solid rgba(255,236,200,.2);display:flex;flex-direction:column;gap:9px}
.s2-cmp .col.long{border-color:rgba(207,106,76,.45)}
.s2-cmp .col.short{border-color:rgba(79,167,114,.5)}
.s2-cmp h4{margin:0;font-size:19px;color:var(--sand-1);text-align:center;line-height:1.4}
.s2-cmp .blocks{display:flex;flex-direction:column;gap:5px}
.s2-cmp .b{padding:11px 14px;border-radius:7px;font-size:16px;font-weight:700;color:#fff;direction:ltr;
  background:#4C97FF;border:1px solid rgba(0,0,0,.16)}
.s2-cmp .b.events{background:#FFBF00}.s2-cmp .b.control{background:#FFAB19}
.s2-cmp .info{font-size:16px;color:var(--copper-hi);text-align:center;font-weight:700;padding:2px 0}
.s2-cmp .track{height:30px;border-radius:15px;background:rgba(0,0,0,.3);position:relative;overflow:hidden}
.s2-cmp .dot{position:absolute;top:4px;left:0;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(165deg,#6FB0FF,#3373CC);border:2px solid #2A6BC4}
.s2-cmpverdict{margin-top:14px;padding:12px 16px;border-radius:12px;text-align:center;
  background:rgba(0,0,0,.24);border:1.3px dashed rgba(255,236,200,.24);display:flex;flex-direction:column;gap:4px}
.s2-cmpverdict.on{background:rgba(79,167,114,.16);border-style:solid;border-color:rgba(79,167,114,.55)}
.s2-cmpverdict b{font-size:19px;color:var(--sand-1);line-height:1.45}
.s2-cmpverdict span{font-size:16px;line-height:1.85;color:var(--cream-2)}

/* مجسّم دوّار */
.s2-solid{max-width:880px;margin:4px auto;display:flex;flex-direction:column;gap:12px}
.s2-solid .panes{display:flex;gap:16px;flex-wrap:wrap}
.s2-solid .pane{flex:1 1 300px;border-radius:var(--r-2);overflow:hidden;border:1.6px solid rgba(255,236,200,.2);
  min-height:230px;background:#F7F1E4}
.s2-solid .ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* محطات التدريب */
.s2-stations{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:0 auto}
.s2-station{border-radius:var(--r-2);padding:14px 16px;background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,236,200,.18)}
.s2-station.solved{border-color:rgba(79,167,114,.6);background:rgba(79,167,114,.09)}
.s2-station .n{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:800;
  background:rgba(95,184,174,.18);border:1px solid rgba(95,184,174,.45);color:var(--teal-hi);margin-bottom:7px}
.s2-station h4{margin:0 0 9px;font-size:15.5px;line-height:1.7;color:var(--sand-1)}


/* ================= منع قصّ النصوص والصور في كل المشاهد ================= */
.s2-fig .pic{min-height:0;padding:12px;align-items:center;justify-content:center}
.s2-fig .pic svg{max-width:100%;height:auto;display:block}
.s2-fig .cap b{white-space:normal;overflow-wrap:anywhere;line-height:1.55}
.s2-fig .cap p{overflow-wrap:anywhere}
.s2-hero .art{flex:0 0 auto;max-width:46%}
.s2-hero .art svg{max-width:100%;height:auto;display:block}
.s2-hero h2{overflow-wrap:anywhere}
.s2-theory{padding-bottom:36px}
.s2-theory>*:last-child{margin-bottom:18px}

/* خيارات مصوّرة: شبكة متجاوبة تُظهر كل الخيارات كاملة */
.s2-opts.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:stretch}
.s2-opts.media .s2-opt{flex-direction:column;align-items:center;gap:8px;height:100%;
  padding:12px;text-align:center;white-space:normal}
.s2-opts.media .s2-opt .fig{width:100%;padding:6px;display:flex;justify-content:center}
.s2-opts.media .s2-opt .fig svg{width:100%;max-width:170px;height:auto}
.s2-opts.media .s2-opt span{font-size:14px}

/* عنوان الدرس لا يلامس الشريط العلوي */




/* بطاقات الأسئلة: لا تمرير داخلي مصغّر إطلاقًا */
.s2-q,.s2-askcol .s2-q{overflow:visible;max-height:none}
.s2-triple{align-items:stretch}
.s2-triple .s2-fig{display:flex;flex-direction:column}
.s2-triple .s2-fig .pic{flex:1}


/* ================= لوحة التعليمات قابلة للطي ================= */
.s2-panel{transition:width .2s,transform .2s}
.s2-panel-tog{position:absolute;z-index:46;left:100%;top:14px;width:30px;height:58px;margin-inline-start:4px;font-size:16px;
  border-radius:0 10px 10px 0;cursor:pointer;background:rgba(15,39,53,.96);color:var(--copper-hi);
  border:1.6px solid rgba(231,160,99,.45);border-inline-start:0;font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;z-index:2}
.s2-panel-tog:hover{background:rgba(231,160,99,.2)}
.s2-panel.folded{width:42px}
.s2-panel.folded .ph,.s2-panel.folded .pb{display:none}
.s2-panel.folded .s2-panel-tog{left:auto;right:0;margin:0;border-radius:10px}
body.panel-folded .s2-work{left:58px}
body.panel-folded .s2-body .s2-theory,body.panel-folded .s2-body .s2-quiz{left:58px}

/* شاشات أقصر: اللوحة أضيق تلقائيًا فلا تزاحم المحاكي */
@media (max-height:800px){
  .s2-panel{width:238px}
  .s2-work{left:250px}
  .s2-body .s2-theory,.s2-body .s2-quiz{left:250px}
  .s2-instr{font-size:13px}
}

.s2-dial{max-width:820px}
.s2-dial .row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.s2-dialprev{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-2);
  background:rgba(255,255,255,.05);border:1.4px solid rgba(255,236,200,.2)}
.s2-dialprev .p{display:flex;flex-direction:column;align-items:center;gap:6px}
.s2-dialprev .p span{font-size:12px;color:var(--muted)}
.s2-dialprev .sp{width:88px;height:88px;border-radius:12px;background:#FBF6EC;display:flex;
  align-items:center;justify-content:center;border:1.4px solid #D8C29B}
.s2-dialprev .arw{font-size:22px;color:var(--copper-hi)}

/* معاينة خطة المشروع 1.10 */
.s2-planprev{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;
  margin-top:14px;padding:14px 18px;border-radius:var(--r-2);
  background:rgba(95,184,174,.1);border:1.5px solid rgba(95,184,174,.4)}
.s2-planprev .canv{width:210px;height:180px;border-radius:12px;background:#FBF6EC;border:1.5px solid #D8C29B;
  display:flex;align-items:center;justify-content:center}
.s2-planprev .txt{max-width:420px;display:flex;flex-direction:column;gap:5px}
.s2-planprev .txt b{font-size:15px;color:var(--sand-1)}
.s2-planprev .txt span{font-size:13.5px;line-height:1.8;color:var(--cream-2)}


/* ================= اسم الأستاذة: مرة واحدة أسفل شاشة الوحدتين ================= */
.s2-author{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:26;
  padding:8px 26px;border-radius:999px;white-space:nowrap;
  background:rgba(8,22,31,.74);border:1px solid rgba(231,160,99,.34);backdrop-filter:blur(3px)}
.s2-author span{font-family:var(--font-title);font-size:15px;font-weight:800;color:var(--sand-1);letter-spacing:.2px}
/* حين تظهر أزرار الفصول (الحزمة الشاملة) يرتفع الاسم فوقها */
.sem-plate ~ .s2-author{bottom:70px}

/* ================= شريط الدرس: مساحة محجوزة لأزرار المعلّم ================= */

.s2-rail{gap:5px;flex-wrap:nowrap;overflow:hidden}
.s2-step{min-width:auto;padding:0 9px;height:34px}
.s2-step span{max-width:0;overflow:hidden;opacity:0;transition:max-width .18s,opacity .18s;white-space:nowrap}
.s2-step.live span{max-width:120px;opacity:1;margin-inline-start:4px}
.s2-step::after{content:attr(data-n);font-size:12px;font-weight:800}
@media (min-width:1500px){
  .s2-step span{max-width:120px;opacity:1;margin-inline-start:4px}
  .s2-step::after{content:none}
}


/* ================= لبنات Scratch الحقيقية داخل الأنشطة ================= */
.sc-statwrap{display:inline-block;padding:12px 14px;border-radius:12px;background:#F9F9F9;
  border:1.5px solid #D9D9D9;direction:ltr}
.sc-stack.stat{position:relative;display:flex;flex-direction:column;align-items:flex-start}
.sc-blk.stat{cursor:default;margin:0 0 3px}
.sc-blk.stat .sc-in.ro{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:22px;
  padding:0 8px;border-radius:11px;background:#fff;color:#575E75;font-size:12.5px;font-weight:700;
  border:1px solid rgba(0,0,0,.2)}
.sc-blk.stat .sc-flag{color:#4CBF56}
.sc-c.stat{margin:0 0 3px}
.sc-c.stat .sc-cbody{min-height:10px}

/* ================= محطات باللبنات: واحدة في كل مرة ================= */
.s2-bst{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.s2-bsthead{display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center}
.s2-bsthead .ct{padding:5px 16px;border-radius:999px;font-size:12.5px;font-weight:800;
  background:rgba(95,184,174,.18);border:1px solid rgba(95,184,174,.45);color:var(--teal-hi)}
.s2-bsthead .dots{display:flex;gap:7px}
.s2-bsthead .d{width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:12.5px;font-weight:800;
  color:var(--cream-2);background:rgba(255,255,255,.06);border:1.5px solid rgba(255,236,200,.22)}
.s2-bsthead .d.on{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border-color:var(--copper-hi)}
.s2-bsthead .d.ok{color:var(--teal-hi);border-color:rgba(95,184,174,.6);background:rgba(59,145,136,.2)}
.s2-bsthead .d.ok.on{color:#2a1608}
.s2-bsthead h3{margin:2px 0 0;font-size:18px;line-height:1.7;color:var(--sand-1);font-weight:800;max-width:760px}
.s2-bstbody{display:flex;flex-direction:column;gap:13px;align-items:center}
.s2-bstart{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:14px 18px;border-radius:var(--r-2);background:rgba(255,255,255,.05);border:1.4px solid rgba(255,236,200,.18)}
.s2-bstart.col{flex-direction:column}
.s2-bstsim{width:100%;height:430px;position:relative;border-radius:var(--r-2);overflow:hidden;
  border:1.6px solid rgba(255,236,200,.2)}
.s2-bsttip{font-size:13px;line-height:1.75;color:var(--cream-2);padding:9px 14px;border-radius:10px;
  background:rgba(0,0,0,.24);border:1.2px dashed rgba(255,236,200,.24);text-align:center}
.s2-bsttip.ok{color:#eafff4;background:rgba(79,167,114,.22);border-style:solid;border-color:#6fd8a8}
.s2-bstnav{display:flex;align-items:center;gap:12px;justify-content:center}
.s2-bstnav .sp{font-size:12.5px;color:var(--muted);min-width:150px;text-align:center}
.s2-bstnav .s2-btn{min-width:130px;flex:0 0 auto}
.s2-rotstrip{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.s2-rotstrip .f{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:10px;
  background:#FBF6EC;border:1.3px solid #D8C29B}
.s2-rotstrip .f.last{border-color:#4FA772;box-shadow:0 0 0 2px rgba(79,167,114,.3)}
.s2-rotstrip .f span{font-size:11.5px;color:#6B421F;font-weight:700}
.s2-seq{display:flex;gap:10px;align-items:center;justify-content:center}
.s2-seq .f{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;border-radius:10px;
  background:#FBF6EC;border:1.3px solid #D8C29B;position:relative}
.s2-seq .f span{font-size:11px;color:#6B421F;font-weight:700}
.s2-seq .bub{font-size:11px;background:#fff;border:1.3px solid #C8CCD4;border-radius:9px;padding:2px 8px;color:#575E75}
.s2-seq .ar{font-size:19px;color:var(--copper-hi)}
.s2-labopts.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.s2-labopts.media .s2-opt{flex-direction:column;height:100%;padding:14px;white-space:normal;text-align:center;gap:10px}
.s2-labopts.media .s2-opt .fig{display:flex;justify-content:center;width:100%}


/* ================= لوحة المعلّم: تبويبات + شريط أدوات ثابت ================= */
.tm-panel{display:flex;flex-direction:column;max-height:88vh}
.tm-scroll{flex:1;overflow-y:auto;min-height:0;padding-inline-end:4px}
.tm-actionbar{flex:0 0 auto;margin-top:10px;padding-top:10px;border-top:1.4px solid rgba(231,160,99,.32);
  display:flex;flex-direction:column;gap:8px;background:linear-gradient(0deg,rgba(11,30,42,.98),rgba(11,30,42,.9))}
.tm-actrow{display:flex;gap:8px;flex-wrap:wrap}
.tm-actrow .btn-glass{flex:1 1 auto;min-width:140px;min-height:46px;font-size:13px}
.tm-tabs{flex-wrap:wrap;gap:5px}
.tm-tab{font-size:12px;padding:6px 11px}


/* ================= الشريط العلوي: ثلاث مناطق مستقلة ================= */
/* لا padding من جهة واحدة، ولا زر مطلق التموضع فوق العنوان. */
.s2-top{
  flex:0 0 auto;min-height:58px;padding:6px 12px;gap:12px;
  display:flex;align-items:center;
}
.s2-slot{display:flex;align-items:center;gap:7px;flex:0 0 auto}
/* الأزرار تدخل تدفّق الشريط بدل التموضع المطلق */
