/* ==== lessons/s2/l2-2.js — 2.2 تحرير الكائنات ثلاثية الأبعاد ==== */
(function (W) {
  const { el } = W.util;
  const A = () => W.s2art;
  const L = () => W.s2lesson;
  const TL = () => W.t3dlesson;

  W.s2lessons.make('s2-l2-2', function (lesson) {
    return [
      /* استكشف */
      {
        key: 'explore', titleAr: 'غيّر أبعاد المجسّم',
        enter(api) {
          const w = TL().work(api);
          const BASE = { l: 20, w: 20, h: 20 };
          const sim = W.t3dsim.build(w, {
            startAt: 'editor',
            objects: [{ name: 'Box', x: 0, y: 0, w: BASE.w, l: BASE.l, h: BASE.h }],
            allowShapes: ['Box', 'Cylinder', 'Sphere'],
            onChange: () => check(),
          });
          api.__sim = sim;
          sim.select(sim.objects()[0].id);

          /* قائمة تحقق مستقلة لكل بُعد — ثابتة داخل مساحة المحاكي،
           * لا تختفي عند تحريك المجسّم ولا عند تدوير المشهد.
           * Raise وRotate لا يُحتسبان بُعدًا. */
          const DIMS = [
            { k: 'l', ar: 'غيّرت الطول', en: 'Length' },
            { k: 'w', ar: 'غيّرت العرض', en: 'Width' },
            { k: 'h', ar: 'غيّرت الارتفاع', en: 'Height' },
          ];
          const changed = { l: false, w: false, h: false };
          const rows = {};
          const board = el('div', { class: 't3d-dimcheck', 'data-testid': 'dim-check' }, [
            el('h4', { text: 'ما الذي غيّرته؟' }),
          ]);
          const ul = el('ul', {});
          DIMS.forEach(d => {
            const li = el('li', { 'data-dim-check': d.k }, [
              el('div', { class: 'bx', text: '✓' }),
              el('span', { text: d.ar }),
              el('small', { text: d.en }),
            ]);
            rows[d.k] = li; ul.appendChild(li);
          });
          board.appendChild(ul);
          board.appendChild(el('div', { class: 'ign', text: 'الرفع (Raise) والتدوير (Rotate) لا يُحتسبان تغييرًا للأبعاد.' }));
          w.appendChild(board); W.scd.node(board);

          let passed = false;
          function paint() {
            DIMS.forEach(d => rows[d.k].classList.toggle('on', changed[d.k]));
            api.panel.setChecks(DIMS.map(d => ({
              label: d.ar + ' (' + d.en + ')', done: changed[d.k],
            })), DIMS.findIndex(d => !changed[d.k]));
          }
          function check() {
            const o = sim.objects()[0]; if (!o) return;
            let fresh = null;
            ['l', 'w', 'h'].forEach(k => {
              if (!changed[k] && Math.round(o[k]) !== BASE[k]) { changed[k] = true; fresh = k; }
            });
            if (!fresh) return;
            paint();
            const name = DIMS.find(d => d.k === fresh);
            api.feedback('ok', 'تغيّر ' + name.ar.replace('غيّرت ', '') + ' (' + name.en + ') — انظر إلى المجسّم وإلى القائمة.');
            if (!passed && (changed.l || changed.w || changed.h)) {
              passed = true;
              W.scd.after(() => api.pass('غيّرت بُعدًا محدّدًا ورأيت أثره مباشرة على المجسّم.'), 2800);
            }
          }
          paint();

          api.panel.setInstr('المجسّم محدّد الآن. غيّر بُعدًا من الأبعاد الثلاثة (Length أو Width أو Height) من لوحة الخصائص، وستُعلَّم القائمة بالبعد الذي غيّرته بالضبط.',
            'Change a dimension and see exactly which one changed.');
          api.panel.setActions([
            { label: 'تلميح', onClick: () => api.hint('لوحة الخصائص أسفل المسرح: اكتب 40 في مربّع Height ولاحظ العلامة أمام «غيّرت الارتفاع».') },
            { label: 'جرّب الأبعاد الثلاثة', onClick: () => api.hint('غيّر Length ثم Width ثم Height — تبقى كل علامة ظاهرة بعد وضعها.') },
          ]);
          W.scd.after(() => { const n = sim.el.dim('h'); if (n) { api.ring(n, 5); api.hand(n, 0, 4); } }, 260);
          api.__okRef = () => passed;
          api.__dims = () => Object.assign({}, changed);
        },
        teacherWhy: (api) => api.__okRef && api.__okRef() ? 'اكتملت.' : 'لم يغيّر التلميذ أي بُعد من Length أو Width أو Height بعد (الرفع والتدوير لا يُحتسبان).',
        teacherReveal: (api) => api.hint('وجّهه إلى مربّع Height في لوحة الخصائص واطلب منه كتابة 40، ثم لاحِظا معًا العلامة أمام «غيّرت الارتفاع».'),
      },

      /* شاهد */
      {
        key: 'watch', titleAr: 'أدوات التحرير',
        enter(api) {

/* ==== engine/boot.js — startup + automated-test surface ==== */
(function (W) {
  function boot() {
    const stage = document.getElementById('stageInner');
    if (!stage) { console.error('[boot] no stage'); return; }
    W.ui.fit();
    W.settings.applyAll();

    // keyboard: T = teacher, Esc closes teacher/settings
    window.addEventListener('keydown', e => {
      const typing = /input|textarea/i.test((document.activeElement || {}).tagName || '');
      if ((e.key === 't' || e.key === 'T') && !typing) { W.teacher.toggle(); }
      if (e.key === 'Escape') { if (W.teacher.isOpen) W.teacher.close(); const s = document.getElementById('mnSettings'); if (s) s.remove(); }
    });
    // first user gesture resumes audio (browser policy)
    window.addEventListener('pointerdown', () => W.audio.resume(), { once: true });

    /* test surface driven by tests/run.js and manual QA */
    W.test = {
      go: (id, p) => W.scene.go(id, p),
      scene: () => W.scene.currentId,
      store: W.store,
      lessonIds: () => W.lessons.ids,
      builtLessons: () => W.lessons.builtCount,
      curriculum: () => W.curriculum,
      artifacts: () => W.scd.artifactCount(),
      nodeArtifacts: () => W.scd.nodeCount(),
      openTeacher: (id) => W.teacher.open(id),
      closeTeacher: () => W.teacher.close(),
      teacherOpen: () => W.teacher.isOpen,
      activeLesson: () => W.activeLesson,
      reset: () => W.store.reset(),
      version: 'manara-g3-cp1r',
    };

    /* نسخة الفصل الثاني المستقلة: بلا شاشة اختيار فصل — تفتح على اختيار الوحدتين */
    if (window.__WAHAT_S2_ONLY) {
      W.S2_ONLY = true;
      /* حارس صارم: أي محاولة انتقال إلى مشاهد الفصل الأول تُحوَّل إلى واحة الوحدتين */
      const S1 = ['hub', 'opening', 'semesters', 'lesson', 'hall', 'observatory', 'lab', 'index', 'u1', 'u2', 'u3'];
      const go0 = W.scene.go.bind(W.scene);
      W.scene.go = function (id, params) {
        if (S1.indexOf(id) >= 0) return go0('s2hub');
        return go0(id, params);
      };
      W.scene.go('s2hub');
      return;
    }
    W.scene.go(W.store.settings.seenIntro ? 'hub' : 'opening');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.MNARA);

      var host = document.getElementById("stage") || document.querySelector(".stage") || document.body;
      W.mountLesson(host, L);
    },
    g2s2: function (id) { window.WADI.scene.go("lesson", { id: id }); },
    g3s1: function (id) { window.MNARA.scene.go("lesson", { id: id }); },
    g3s2: function (id) { window.MNARA.scene.go("s2lesson", { id: id }); },
    g4s1: function (id) { window.G4.scene.go("lesson", { id: id }); },
    g4s2: function (id) {
      var W = window.G4S2, host = document.getElementById("stage") || document.querySelector(".stage") || document.body;
      W.lesson.open(id, host, function () { try { if (W.flow && W.flow.build) W.flow.build(); } catch (e) {} });
    }
  };
  function sceneReady(g, name) {
    try {
      var s = window[g] && window[g].scene;
      if (!s) return false;
      if (typeof s.has === "function") return s.has(name);   /* precise where available */
      return true;                                            /* fallback: scene exists (retry absorbs early throws) */
    } catch (e) { return false; }
  }
  var READY = {
    g1s1: function () { return sceneReady("W", "lesson"); },
    g1s2: function () { return sceneReady("WADI", "lesson"); },
    g2s1: function () { return !!(window.WAHAT2 && window.WAHAT2.mountLesson && window.WAHAT2.curriculum && (window.WAHAT2.curriculum.LESSONS || []).length); },
    g2s2: function () { return sceneReady("WADI", "lesson"); },
    g3s1: function () { return sceneReady("MNARA", "lesson"); },
    g3s2: function () { return sceneReady("MNARA", "s2lesson"); },
    g4s1: function () { return sceneReady("G4", "lesson"); },
    g4s2: function () { return !!(window.G4S2 && window.G4S2.lesson && window.G4S2.curriculum); }
  };
  var open = OPEN[code], ready = READY[code];
  if (!open || !ready) return;

  var strip = function (s) { return String(s || "").replace(/[ً-ٰٟ]/g, ""); };
  var want = strip(t.ar);
  function shown() {
    if (!want) return false;
    try { return strip(document.body.innerText || "").indexOf(want) >= 0; } catch (e) { return false; }
  }

  /* Call the platform's opener, then verify the lesson actually rendered; some
     platforms mount an opening/home scene that can override an early call, so we
     retry until the target title appears (or we time out). Once shown, we stop
     — so a lesson already open is never re-mounted. */
  var tries = 0, MAX = 40;             /* ~10s at 250ms */
  function tick() {
    tries++;
    if (shown()) return;               /* success — stop, no re-mount */
    try { if (ready()) open(t.id); } catch (e) { /* not ready yet */ }
    if (tries < MAX) setTimeout(tick, 250);
  }
  function start() { setTimeout(tick, 250); }
  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
