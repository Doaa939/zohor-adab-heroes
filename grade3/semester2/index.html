    if (!host) return null;
    host.querySelectorAll('.s2-unfinished').forEach(n => n.remove());
    const n = el('div', { class: 's2-unfinished' }, [
      el('b', { text: 'ملاحظة' }),
      document.createTextNode(text || 'لم أنتهِ من هذا النشاط بعد، ويمكنني العودة لإكماله لاحقًا.'),
    ]);
    host.appendChild(n); W.scd.node(n);
    requestAnimationFrame(() => n.classList.add('on'));
    W.scd.after(() => { n.classList.remove('on'); W.scd.after(() => n.remove(), 260); }, 4200);
    return n;
  }

  /* --------------------------------------------------------- لوحة التعليمات */
  function panel(host, cfg) {
    cfg = cfg || {};
    const ph = el('div', { class: 'ph' }, [
      el('div', { class: 'ph-tx' }, [el('b', { text: cfg.phaseAr || '' }), el('span', { text: cfg.phaseEn || '' })]),
    ]);
    const instr = el('div', { class: 's2-instr' });
    const checks = el('ul', { class: 's2-checks' });
    const acts = el('div', { class: 's2-acts' });
    const p = el('div', { class: 's2-panel' }, [ph, el('div', { class: 'pb' }, [instr, checks, acts])]);

    /* زر إظهار/إخفاء التعليمات: داخل رأس اللوحة نفسها، ظاهر دائمًا وثابت عند التمرير،
     * برمز ونص وحالة ARIA تتغيّر معًا، ومساحة لمس 48×48 على الأقل. */
    const tog = el('button', { class: 's2-panel-tog', type: 'button', 'data-t': 'panel-toggle' });
    const togIc = el('span', { class: 'ic', 'aria-hidden': 'true', text: '⌃' });
    const togTx = el('span', { class: 'tx', text: 'إخفاء التعليمات' });   /* النص كامل دائمًا */
    tog.appendChild(togIc); tog.appendChild(togTx);
    function paintTog(folded) {
      togIc.textContent = folded ? '⌄' : '⌃';
      togTx.textContent = folded ? 'إظهار التعليمات' : 'إخفاء التعليمات';
      tog.title = folded ? 'إظهار التعليمات' : 'إخفاء التعليمات';
      tog.setAttribute('aria-label', folded ? 'إظهار لوحة التعليمات' : 'إخفاء لوحة التعليمات');
      tog.setAttribute('aria-expanded', folded ? 'false' : 'true');
    }
    /* في وضع الدرج يُزاح النشاط بارتفاع الدرج الفعلي، فلا يغطّيه ولا يترك فراغًا */
    function syncDrawerHeight() {
      if (!document.body.classList.contains('rsp')) {
        document.documentElement.style.setProperty('--drawer-h', '0px');
        return;
      }
      const h = Math.ceil(p.getBoundingClientRect().height);
      document.documentElement.style.setProperty('--drawer-h', (h > 0 ? h : 62) + 'px');
    }
    function setFolded(on) {
      p.classList.toggle('folded', on);
      document.body.classList.toggle('panel-folded', on);
      paintTog(on);
      requestAnimationFrame(syncDrawerHeight);
      W.scd.after(syncDrawerHeight, 260);
    }
    W.scd.listen(window, 'resize', syncDrawerHeight);
    tog.onclick = () => { setFolded(!p.classList.contains('folded')); W.audio.click(); };
    tog.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog.click(); }
    };
    ph.appendChild(tog);
    host.appendChild(p); W.scd.node(p);
    /* على الشاشات الضيقة تبدأ اللوحة كدرج مطويّ حتى يأخذ النشاط الشاشة كاملة */
    setFolded(document.body.classList.contains('rsp'));
    W.scd.after(syncDrawerHeight, 60);
    return {
      node: p, toggle: tog, setFolded,
      setPhase(ar, en) { const box = ph.querySelector('.ph-tx'); box.innerHTML = '';
        box.appendChild(el('b', { text: ar })); box.appendChild(el('span', { text: en || '' })); },
      setInstr(ar, en) {
        instr.innerHTML = '';
        /* يقبل المنفذ عقدًا جاهزة لمن يحتاج تمييزًا، وإلا فنصّ عادي. لا تحليل HTML. */
        if (ar && typeof ar === 'object') {
          [].concat(ar).forEach(c => instr.appendChild(
            typeof c === 'string' ? document.createTextNode(c) : c));
        } else {
          instr.appendChild(document.createTextNode(ar || ''));
        }
        if (en) instr.appendChild(el('span', { class: 'en', text: en }));
      },
      setChecks(list, cur) {
        checks.innerHTML = '';
        (list || []).forEach((s, i) => checks.appendChild(
          el('li', { class: (s.done ? 'done ' : '') + (i === cur ? 'cur' : '') },
            [el('b', { text: s.done ? '✓' : String(i + 1) }), el('span', { text: s.label })])));
      },
      setActions(btns) {
        acts.innerHTML = '';
        (btns || []).forEach(b => acts.appendChild(el('button', {
          class: 's2-btn' + (b.primary ? ' primary' : '') + (b.wide ? ' wide' : ''),
          text: b.label, disabled: b.disabled ? 'true' : null, onclick: b.onClick,
        })));
      },
    };
  }

  /* قائمة خطوات مرقّمة موحّدة لكل الشاشات:
   * الرقم في دائرة ثابتة الحجم يمين البطاقة، والنص بجانبه في مساحة واحدة،
   * وارتفاع البطاقة حسب محتواها، والالتفاف يبقى بمحاذاة النص لا تحت الرقم. */
  function stepList(items, opts) {
    opts = opts || {};
    const AR = ['١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', '١٠', '١١', '١٢'];
    const box = el('div', { class: 's2-steplist' });
    (items || []).forEach((it, i) => {
      const ar = (typeof it === 'string') ? it : (it.ar || it.text || '');
      const en = (typeof it === 'string') ? '' : (it.en || '');
      const tx = el('div', { class: 'tx' }, [el('span', { class: 'a', text: ar })]);
      if (en) tx.appendChild(el('span', { class: 'en', text: en }));
      box.appendChild(el('div', { class: 'step', 'data-step': String(i + 1) }, [
        el('span', { class: 'n', 'aria-hidden': 'true', text: AR[i] || String(i + 1) }),
        tx,
      ]));
    });
    return box;
  }

  /* ---------------------------------------------------- تغذية راجعة وإرشاد */
  function feedback(host, kind, text) {
    host.querySelectorAll('.s2-fb').forEach(n => n.remove());
    const t = el('div', { class: 's2-fb ' + kind, text });
    host.appendChild(t); W.scd.node(t);
    requestAnimationFrame(() => t.classList.add('on'));
    W.scd.after(() => { t.classList.remove('on'); W.scd.after(() => t.remove(), 220); }, 2400);
    kind === 'ok' ? W.audio.ok() : kind === 'no' ? W.audio.no() : W.audio.click();
    return t;
  }

  /* حلقة إرشاد حول عنصر — تُحسب بإحداثيات المضيف حتى لا تنزاح مع التحجيم */
  function ring(host, node, pad) {
    if (!node || !node.getBoundingClientRect) return null;
    const hr = host.getBoundingClientRect(), r = node.getBoundingClientRect();
    if (!r.width && !r.height) return null;
    const k = W.scale || 1, p = pad == null ? 5 : pad;
    const n = el('div', { class: 's2-ring', style: {
      left: ((r.left - hr.left) / k - p) + 'px', top: ((r.top - hr.top) / k - p) + 'px',
      width: (r.width / k + p * 2) + 'px', height: (r.height / k + p * 2) + 'px',
    } });
    host.appendChild(n); W.scd.node(n); return n;
  }
  function hand(host, node, dx, dy) {
    if (!node || !node.getBoundingClientRect) return null;
    const hr = host.getBoundingClientRect(), r = node.getBoundingClientRect();
    if (!r.width && !r.height) return null;
    const k = W.scale || 1;
    const n = el('div', { class: 's2-hand', text: '👆', style: {
      left: ((r.left - hr.left) / k + r.width / k / 2 + (dx || 0)) + 'px',
      top: ((r.top - hr.top) / k + r.height / k + (dy || 2)) + 'px',
    } });
    host.appendChild(n); W.scd.node(n); return n;
  }
  function clearGuides(host) { host.querySelectorAll('.s2-ring,.s2-hand').forEach(n => n.remove()); }

  /* -------------------------------------------------------- بطاقة الإتقان */
  function complete(ctx, lesson, host, opts) {
    opts = opts || {};
    const criteria = opts.criteria || ['review'];
    W.s2store.markMastered(lesson.id, criteria);
    W.audio.chime();
    const card = el('div', { class: 's2-done' }, el('div', { class: 'in' }, [
      el('div', { class: 'mk', text: '✦' }),
      el('h2', { text: opts.title || ('أتقنت الدرس ' + lesson.code) }),
      el('p', { text: opts.body || 'أنجزت مهارات هذا الدرس بتنفيذ حقيقي، لا بمجرد النقر.' }),
      opts.recap ? el('p', { style: { color: 'var(--teal-hi)' }, text: opts.recap }) : null,
      el('div', { class: 'row' }, [
        el('button', { class: 's2-btn primary', style: { minWidth: '190px' }, text: opts.backLabel || 'عودة إلى الوحدة',
          onclick: () => { W.audio.click(); ctx.go(opts.backScene || ('s2u' + lesson.unit)); } }),
        el('button', { class: 's2-btn', style: { minWidth: '150px' }, text: 'إعادة الدرس',
          onclick: () => { W.audio.click(); ctx.go('s2lesson', { id: lesson.id }); } }),
      ]),
    ]));
    host.appendChild(card); W.scd.node(card);
    return card;
  }

  /* كل جزء نظري يجب أن يحمل صورة تعليمية واضحة، لا نصًا مجردًا فقط. */
  function theoryArtFor(lesson) {
    const A=W.s2art;if(!A)return null;const c=String(lesson.code||'');
    try{
      if(c==='1.1')return A.orderedVsScrambled(true);
      if(c==='1.2')return A.paletteLegend();
      if(c==='1.3')return A.debugSteps();
      if(c==='1.4')return A.directionDial(90);
      if(c==='1.5')return A.blockShape('#4C97FF','move 100 steps','ابنِ المقطع من الأعلى إلى الأسفل');
      if(c==='1.6')return A.loopCompare();
      if(c==='1.7')return A.directionDial(120);
      if(c==='1.8')return A.penUpDown();
      if(c==='1.9')return A.blockShape('#0FBD8C','stamp','استخدم لبنات القلم لرسم أشكال منتظمة');
      if(c==='1.10')return A.debugSteps();
      if(c==='2.1')return A.threeViews();
      if(c==='2.2')return A.workplaneArt();
      if(c==='2.3')return A.shape3D();
      if(c==='2.4')return A.scribbleToSolid();
    }catch(e){}
    return null;
  }
  /* أي عنصر من هذه العناصر يعني أن المرحلة نشاط تفاعلي أو تحمل رسمًا بالفعل،
   * فلا يُحقن رسم تلقائي فوقه (كان هذا سبب تضخّم الصور وقصّها). */
  const NO_AUTO_ART = 'svg,canvas,img,.s2-fig,.s2-bstart,.work,.scratch,.t3d,'
    + '.rb-wrap,.rb-board,.s2-order,.s2-cmdrow,.s2-howto,.sc-statwrap,.bag-seq,[data-noauto]';
  function enhanceTheoryVisuals(host,lesson){
    const artTemplate=theoryArtFor(lesson);if(!artTemplate)return;
    /* رسم واحد على الأكثر لكل مرحلة، داخل صندوق محدود الأبعاد */
    const t=host.querySelector('.s2-theory');
    if(!t)return;
    if(t.querySelector(NO_AUTO_ART))return;
    if(t.querySelector('.s2-theory-auto-visual'))return;
    const visual=el('div',{class:'s2-theory-auto-visual','data-auto-visual':lesson.code},artTemplate.cloneNode(true));
    t.insertBefore(visual,t.firstChild);
  }

  /* =================================================================
   * المشغّل: تسلسل مراحل، كل مرحلة تعلن شرط اكتمال يُفحص على الحالة.
   * spec = { lesson, host, backScene, phases: [ { key, enter(api), teacherReveal, teacherWhy } ] }
   * ================================================================= */
  function run(ctx, spec) {
    const lesson = spec.lesson;
    const host = spec.host;
    const phases = spec.phases;
    let i = 0, finished = false;

    /* ================= دورة حياة المرحلة =================
     * لكل مرحلة رمز (token). أي عملية غير متزامنة (حركة روبوت، تشغيل مقطع،
     * مؤقّت، وعد) تحفظ الرمز وقت بدئها، ولا يُسمح لها بلمس الصفحة أو تسجيل
     * تقدّم إذا تغيّر الرمز. عند الانتقال تُوقَف المحاكيات أولًا، ثم تُلغى
     * الانتظارات المعلّقة، ثم يُحذف محتوى المرحلة. */
    let phaseToken = 0;
    let cleanups = [];

    function runCleanups() {
      const list = cleanups; cleanups = [];
      list.forEach(fn => { try { fn(); } catch (e) { console.warn('[s2lesson] cleanup', e); } });
    }

    W.s2store.lessonOpened(lesson.id);

    const api = {
      ctx, lesson, host,
      panel: null,
      /* رمز المرحلة الحالية، وفحص الصلاحية قبل أي تأثير */
      get token() { return phaseToken; },
      alive(tok) {
        return (tok === undefined || tok === phaseToken) && !!host && host.isConnected && !finished;
      },
      /* انتظار قابل للإلغاء: يعيد true إذا أُلغي بسبب انتقال */
      async sleep(ms, tok) {
        const t0 = (tok === undefined) ? phaseToken : tok;
        const cancelled = await W.scd.sleep(ms);
        return cancelled || t0 !== phaseToken;
      },
      /* مؤقّت محروس: لا يعمل إذا غادرت المرحلة */
      after(fn, ms, tok) {
        const t0 = (tok === undefined) ? phaseToken : tok;
        return W.scd.after(() => { if (t0 === phaseToken && host && host.isConnected) fn(); }, ms);
      },
      /* تسجيل مُفكِّك لهذه المرحلة (إيقاف محاكٍ، إلغاء حلقة…) */
      onCleanup(fn) { if (typeof fn === 'function') cleanups.push(fn); return fn; },

      feedback(kind, text, tok) { if (!api.alive(tok)) return null; return feedback(host, kind, text); },
      ring: (node, pad) => (api.alive() ? ring(host, node, pad) : null),
      hand: (node, dx, dy) => (api.alive() ? hand(host, node, dx, dy) : null),
      clearGuides: () => clearGuides(host),

      /* تُستدعى من المرحلة عندما يتحقق شرط الحالة فعليًا.
       * tok اختياري: يمرَّر من العمليات غير المتزامنة لضمان أنها ما زالت مرحلتها. */
      pass(msg, tok) {
        if (!api.alive(tok)) return;
        const ph = phases[i]; if (!ph) return;
        const t0 = phaseToken;
        W.s2store.phaseDone(lesson.id, ph.key);
        if (msg) feedback(host, 'ok', msg);
        W.scd.after(() => { if (t0 === phaseToken) next(); }, msg ? 900 : 60);
      },
      fail(msg, tok) { if (!api.alive(tok)) return; feedback(host, 'no', msg); },
      hint(msg, tok) { if (!api.alive(tok)) return; feedback(host, 'hint', msg); },
      goPhase: (n) => jump(n),
      get index() { return i; },
      get phaseKey() { return phases[i] ? phases[i].key : null; },
    };

    function mountPhase() {
      /* حارس: مؤقّت مُعلّق من درس سابق يجب ألا يُركّب مرحلة على مضيف مفصول عن الصفحة */
      if (!host || !host.isConnected) return;
      phaseToken++;                 /* أي callback قديم يصبح لاغيًا فورًا */
      runCleanups();                /* أوقف محاكيات المرحلة السابقة قبل حذفها */
      W.scd.clear();                /* يوقف الباقي ويلغي الانتظارات المعلّقة */
      host.innerHTML = '';
      host.querySelectorAll && host.querySelectorAll('.s2-unfinished').forEach(n => n.remove());
      if (i >= phases.length) {
        finished = true;
        complete(ctx, lesson, host, Object.assign({ criteria: phases.map(p => p.key), backScene: 's2u' + lesson.unit }, spec.done || {}));
        railLive(phases.length, lesson.id, phases.map(p => p.key));
        publishActive();
        return;
      }
      const ph = phases[i];
      const meta = PHASES[ph.key] || { ar: ph.key, en: '' };
      const p = panel(host, {});
      /* العنوان العربي وحده، والمصطلحات الإنجليزية في سطر مستقل تحته */
      p.setPhase(meta.ar + ' — ' + (ph.titleAr || lesson.title),
        ph.titleEn ? (meta.en + ' · ' + ph.titleEn) : meta.en);
      api.panel = p;
      /* مراجع مؤقتة للمرحلة السابقة تُمسح حتى لا يتسرّب محاكٍ قديم */
      delete api.__sim; delete api.__runner; delete api.__ch; delete api.__quiz;
      W.__api = api;              // نقطة فحص للاختبارات الآلية فقط
      railLive(i, lesson.id, phases.map(p => p.key));
      try { ph.enter(api); }
      catch (e) { W.errorBoundary && W.errorBoundary.catch(e, 's2phase:' + lesson.id + ':' + ph.key); }
      W.scd.after(() => enhanceTheoryVisuals(host, lesson), 25);
      publishActive();
    }
    function next() { i++; mountPhase(); }
    /* انتقال حر بين المراحل: أي مرحلة تُفتح مباشرة.
     * لا يُسجَّل شيء على أنه مكتمل بسبب الانتقال، وتبقى حالة المرحلة السابقة كما هي. */
    function jump(n) {
      if (n < 0 || n > phases.length) return;
      if (n === i) return;
      const leaving = phases[i];
      const leftUnfinished = !!(leaving && !W.s2store.phaseIsDone(lesson.id, leaving.key));
      i = n; finished = false; mountPhase();
      if (leftUnfinished && n < phases.length) {
        W.scd.after(() => unfinishedNote(host,
          'لم أنتهِ من هذا النشاط بعد، ويمكنني العودة لإكماله لاحقًا.'), 120);
      }
    }

    /* واجهة وضع المعلم لهذا الدرس تحديدًا */
    function publishActive() {
      const ph = phases[i];
      W.activeLesson = {
        id: lesson.id, s2: true,
        phases: phases.map(p => ({ key: p.key, label: (PHASES[p.key] || {}).ar || p.key })),
        index: i,
        stages: phases.map(p => ({ id: p.key, rail: (PHASES[p.key] || {}).ar || p.key })),
        jump,
        /* تجاوز مرحلة لأغراض الشرح فقط — لا يُسجَّل إتقانًا للطالب */
        skip() { if (i < phases.length) { i++; mountPhase(); } },
        reveal() { if (ph && ph.teacherReveal) ph.teacherReveal(api); else feedback(host, 'hint', 'اقرأ التعليمات في اللوحة الجانبية ونفّذ الخطوة المطلوبة داخل التطبيق.'); },
        whyIncomplete() {
          if (!ph) return 'الدرس مكتمل.';
          if (ph.teacherWhy) { try { return ph.teacherWhy(api); } catch (e) { return 'تعذّر تحديد سبب عدم الاكتمال.'; } }
          return 'لم يُستوفَ شرط الحالة لهذه المرحلة بعد.';
        },
        retryStage() { mountPhase(); },
        resetLesson() { i = 0; finished = false; mountPhase(); },
        cleanup() { phaseToken++; runCleanups(); },
      };
    }

    mountPhase();
    return { jump, get index() { return i; }, get finished() { return finished; } };
  }

  /* ================= مكوّنات نظرية جاهزة (صور كبيرة ووظيفية) ================= */

  /* بطاقة بطل: رسم كبير + فكرة واحدة فقط */
  function hero(artNode, titleAr, bodyAr) {
    /* منفذ النص يُدرج نصًا دائمًا. من يحتاج تمييزًا يمرّر عقدًا حقيقية
     * بدل سلسلة وسوم، فلا يُحلَّل أي محتوى كـHTML ولا يُفتح أي مصرف جديد. */
    const bodyNode = (bodyAr && typeof bodyAr === 'object')
      ? el('p', {}, bodyAr)
      : el('p', { text: bodyAr });
    return el('div', { class: 's2-hero' }, [
      artNode ? el('div', { class: 'art' }, artNode) : null,
      el('div', { class: 'txt' }, [el('h2', { text: titleAr }), bodyNode]),
    ]);
  }

  /* صف بطاقات مصوّرة: كل صورة تشرح معنى أو مقارنة أو تسلسلًا */
  function figures(list) {
    return el('div', { class: 's2-figrow' }, (list || []).map(f => el('div', { class: 's2-fig' + (f.tone ? ' ' + f.tone : '') }, [
      el('div', { class: 'pic' }, f.art),
      el('div', { class: 'cap' }, [
        el('b', { text: f.ar }),
        f.en ? el('div', { class: 'en', text: f.en }) : null,
        f.note ? el('p', { text: f.note }) : null,
      ]),
    ])));
  }

  function termsBar(terms) {
    return el('div', { class: 's2-terms' }, (terms || []).map(([ar, en]) =>
      el('div', { class: 's2-term' }, [document.createTextNode(ar), el('span', { text: en })])));
  }

  function note(text) { return el('div', { class: 's2-note', html: text }); }

  function theory(host, kids) {
    const t = el('div', { class: 's2-theory' }, (kids || []).filter(Boolean));
    host.appendChild(t); W.scd.node(t);
    return t;
  }

  W.s2lesson = {
    PHASES, frame, railLive, panel, feedback, ring, hand, clearGuides,
    complete, run, hero, figures, termsBar, note, theory, unfinishedNote, stepList,
  };
})(window.MNARA);

/* ==== engine/s2quiz.js ==== */
/* ==== engine/s2quiz.js — أنشطة «راجع وتحقق» ====
 * أنواع متعددة إلزاميًا: اختر · أكمل · صِلْ · رتّب · صنّف · اكتشف الخطأ.
 * كل نوع يتحقق من الحالة الناتجة، ويعطي تغذية راجعة تصف الجزء المطلوب،
 * ولا يصفّر ما أنجزه التلميذ بشكل صحيح.
 */
(function (W) {
  const { el } = W.util;
  const KINDS = {
    choose: 'اختر', multi: 'اختر الصحيح', fill: 'أكمل', match: 'صِلْ',
    order: 'رتّب', sort: 'صنّف', findError: 'اكتشف الخطأ',
  };

  /* ------------------------------------------------------------ اختر واحدًا */
  function choose(q, onSolved) {
    const box = el('div', { class: 's2-q' });
    box.appendChild(el('div', { class: 'kind', text: KINDS.choose }));
    box.appendChild(el('h3', { text: q.q }));
    if (q.art) box.appendChild(el('div', { class: 's2-figrow', style: { marginBottom: '10px' } },
      el('div', { class: 's2-fig' }, el('div', { class: 'pic' }, q.art))));
    const opts = el('div', { class: 's2-opts' + (q.options.some(o => o.art) ? ' media' : '') });
    let solved = false;
    q.options.forEach(o => {
      const b = el('button', { class: 's2-opt' }, [
        o.art ? el('div', { class: 'fig' }, o.art) : null,
        el('span', { text: o.text }),
      ]);
      b.onclick = () => {
        if (solved) return;
        if (o.correct) {
          solved = true; b.classList.add('right'); W.audio.ok();
          opts.querySelectorAll('.s2-opt').forEach(x => x.disabled = true);
          box.classList.add('solved');
          box.appendChild(el('div', { class: 's2-why', html: '<b>✓ صحيح.</b> ' + (o.why || q.why || '') }));
          onSolved && onSolved();
        } else {
          b.classList.add('wrong'); W.audio.no();
          const prev = box.querySelector('.s2-why.tmp'); if (prev) prev.remove();
          box.appendChild(el('div', { class: 's2-why tmp', html: '<b>↺ أعد النظر.</b> ' + (o.why || 'هذا الخيار لا يحقق المطلوب.') }));
        }
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    return box;
  }

  /* ------------------------------------------------------- اكتشف الخطأ */
  function findError(q, onSolved) {
    const box = choose({ q: q.q, art: q.art, options: q.options, why: q.why }, onSolved);
    box.querySelector('.kind').textContent = KINDS.findError;
    return box;
  }

  /* ------------------------------------------------------------- أكمل */
  function fill(q, onSolved) {
    const box = el('div', { class: 's2-q' });
    box.appendChild(el('div', { class: 'kind', text: KINDS.fill }));
    box.appendChild(el('h3', { text: q.q }));
    const line = el('div', { class: 's2-fill' });
    const blanks = [];
    q.parts.forEach(p => {
      if (typeof p === 'string') { line.appendChild(document.createTextNode(p)); return; }
      const b = el('div', { class: 's2-blank', text: '؟', 'data-answer': p.answer });
      blanks.push(b); line.appendChild(b);
    });
    box.appendChild(line);
    const bank = el('div', { class: 's2-opts', style: { marginTop: '11px' } });
    let cur = 0, solved = false;
    function sync() { blanks.forEach((b, i) => b.style.borderColor = (i === cur && !solved) ? 'var(--copper-hi)' : ''); }
    W.util.shuffle(q.bank).forEach(word => {
      const b = el('button', { class: 's2-opt', text: word });
      b.onclick = () => {
        if (solved || cur >= blanks.length) return;
        const slot = blanks[cur];
        if (word === slot.dataset.answer) {
          slot.textContent = word; slot.classList.add('filled'); b.disabled = true; b.classList.add('right');
          W.audio.ok(); cur++; sync();
          if (cur >= blanks.length) {
            solved = true; box.classList.add('solved');
            box.appendChild(el('div', { class: 's2-why', html: '<b>✓ اكتملت الجملة.</b> ' + (q.why || '') }));
            onSolved && onSolved();
          }
        } else {
          b.classList.add('wrong'); W.audio.no();
          W.scd.after(() => b.classList.remove('wrong'), 700);
          const prev = box.querySelector('.s2-why.tmp'); if (prev) prev.remove();
          box.appendChild(el('div', { class: 's2-why tmp', html: '<b>↺</b> الفراغ رقم ' + (cur + 1) + ' يحتاج كلمة أخرى. اقرأ الجملة كاملة قبل الاختيار.' }));
        }
      };
      bank.appendChild(b);
    });
    box.appendChild(bank); sync();
    return box;
  }

  /* --------------------------------------------------------------- صِلْ */
  function match(q, onSolved) {
    const box = el('div', { class: 's2-q' });
    box.appendChild(el('div', { class: 'kind', text: KINDS.match }));
    box.appendChild(el('h3', { text: q.q }));
    const left = el('div', { class: 's2-mcol' }), right = el('div', { class: 's2-mcol' });
    box.appendChild(el('div', { class: 's2-match' }, [left, right]));
    let sel = null, tied = 0;
    const pairs = q.pairs;
    pairs.forEach((p, idx) => {
      const a = el('div', { class: 's2-mi', tabindex: '0', role: 'button', 'data-k': idx },
        [p.leftArt ? el('div', { class: 'fig' }, p.leftArt) : null, el('span', { text: p.left })]);
      a.onclick = () => pick(a, 'L', idx);
      a.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(a, 'L', idx); } };
      left.appendChild(a);
    });
    W.util.shuffle(pairs.map((p, idx) => ({ p, idx }))).forEach(({ p, idx }) => {
      const b = el('div', { class: 's2-mi', tabindex: '0', role: 'button', 'data-k': idx },
        [el('span', { text: p.right }), p.rightEn ? el('span', { class: 'en', text: p.rightEn }) : null]);
      b.onclick = () => pick(b, 'R', idx);
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(b, 'R', idx); } };
      right.appendChild(b);
    });
    function pick(node, side, idx) {
      if (node.classList.contains('tied')) return;
      if (!sel) { sel = { node, side, idx }; node.classList.add('sel'); W.audio.pick(); return; }
      if (sel.side === side) { sel.node.classList.remove('sel'); sel = { node, side, idx }; node.classList.add('sel'); return; }
      if (sel.idx === idx) {
        sel.node.classList.remove('sel'); sel.node.classList.add('tied'); node.classList.add('tied');
        sel = null; tied++; W.audio.ok();
        if (tied === pairs.length) {
          box.classList.add('solved');
          box.appendChild(el('div', { class: 's2-why', html: '<b>✓ كل الأزواج صحيحة.</b> ' + (q.why || '') }));
          onSolved && onSolved();
        }
      } else {
        const bad = sel.node; sel.node.classList.remove('sel'); sel = null; W.audio.no();
        node.classList.add('wrong'); bad.classList.add('wrong');
        W.scd.after(() => { node.classList.remove('wrong'); bad.classList.remove('wrong'); }, 650);
        const prev = box.querySelector('.s2-why.tmp'); if (prev) prev.remove();
        box.appendChild(el('div', { class: 's2-why tmp', html: '<b>↺</b> هذان العنصران لا يتطابقان. اقرأ معنى العنصر الأيمن ثم ابحث عن مقابله.' }));
      }
    }
    return box;
  }

  /* --------------------------------------------------------------- رتّب */
  function order(q, onSolved) {
    const box = el('div', { class: 's2-q' });
    box.appendChild(el('div', { class: 'kind', text: KINDS.order }));
    box.appendChild(el('h3', { text: q.q }));
    box.appendChild(el('div', { class: 's2-howto' }, [
      el('b', { text: 'كيف أرتّب؟' }),
      el('span', { html: 'استخدم السهمين <i class="k">▲</i> و<i class="k">▼</i> بجانب كل خطوة لتحريكها لأعلى أو لأسفل، أو اسحب البطاقة بالفأرة. عندما يصبح الترتيب صحيحًا اضغط <b>تحقق من الترتيب</b>.' }),
    ]));
    const list = el('div', { class: 's2-order' });
    let items = W.util.shuffle(q.items.map((t, i) => ({ t, i })));
    // ضمان ألا يبدأ الترتيب صحيحًا
    if (items.every((x, k) => x.i === k) && items.length > 1) items = items.reverse();
    let solved = false;

    function render() {
      list.innerHTML = '';
      items.forEach((it, k) => {
        const row = el('div', { class: 's2-slot' + (solved ? ' locked' : ''), draggable: solved ? 'false' : 'true' }, [
          el('div', { class: 'n', text: String(k + 1) }),
          el('span', { text: it.t }),
          solved ? null : el('div', { class: 'mv' }, [
            el('button', { class: 's2-mvb', 'aria-label': 'أعلى', text: '▲', onclick: () => move(k, -1) }),
            el('button', { class: 's2-mvb', 'aria-label': 'أسفل', text: '▼', onclick: () => move(k, 1) }),
          ]),
        ]);
        if (!solved) {
          row.addEventListener('dragstart', e => { row.classList.add('drag'); e.dataTransfer.setData('text/plain', String(k)); });
          row.addEventListener('dragend', () => row.classList.remove('drag'));
          row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('over'); });
          row.addEventListener('dragleave', () => row.classList.remove('over'));
          row.addEventListener('drop', e => {
            e.preventDefault(); row.classList.remove('over');
            const from = +e.dataTransfer.getData('text/plain');
            if (isNaN(from) || from === k) return;
            const [m] = items.splice(from, 1); items.splice(k, 0, m);
            W.audio.drop(); render();
          });
        }
        list.appendChild(row);
      });
    }
    function move(k, d) {
      const n = k + d; if (n < 0 || n >= items.length) return;
      const [m] = items.splice(k, 1); items.splice(n, 0, m);
      W.audio.click(); render();
    }
    box.appendChild(list);
    const check = el('button', { class: 's2-btn primary', style: { marginTop: '11px', minWidth: '170px' }, text: 'تحقق من الترتيب' });
    check.onclick = () => {
      if (solved) return;
      const wrongAt = items.findIndex((x, k) => x.i !== k);
      if (wrongAt < 0) {
        solved = true; render(); check.remove(); box.classList.add('solved'); W.audio.ok();
        box.appendChild(el('div', { class: 's2-why', html: '<b>✓ الترتيب صحيح.</b> ' + (q.why || '') }));
        onSolved && onSolved();
      } else {
        W.audio.no();
        const prev = box.querySelector('.s2-why.tmp'); if (prev) prev.remove();
        box.appendChild(el('div', { class: 's2-why tmp', html: '<b>↺</b> الخطوة في الموضع ' + (wrongAt + 1) + ' ليست في مكانها. اسأل نفسك: ما الذي يجب أن يحدث قبلها؟' }));
      }
    };
    box.appendChild(check);
    render();
    return box;
  }

  /* --------------------------------------------------------------- صنّف */
  function sort(q, onSolved) {
    const box = el('div', { class: 's2-q' });
    box.appendChild(el('div', { class: 'kind', text: KINDS.sort }));
    box.appendChild(el('h3', { text: q.q }));
    const bank = el('div', { class: 's2-sortbank' });
    const bins = el('div', { class: 's2-bins' });
    const binNodes = q.bins.map(b => {
      const drops = el('div', { class: 'drops' });
      const n = el('div', { class: 's2-bin', 'data-bin': b.key }, [el('h4', { text: b.label }), drops]);
      n.__drops = drops; bins.appendChild(n); return n;
    });
    box.appendChild(bank); box.appendChild(bins);
    let placed = 0;
    const total = q.items.length;

    W.util.shuffle(q.items).forEach(it => {
      const chip = el('div', { class: 's2-chip', tabindex: '0', role: 'button' },
        [it.art ? el('div', { class: 'fig' }, it.art) : null, el('span', { text: it.text })]);
      bank.appendChild(chip);
      makeDrag(chip, it);
    });

    function accept(chip, it, binNode) {
      if (binNode.dataset.bin !== it.bin) {
        W.audio.no(); binNode.classList.remove('hot');
        const prev = box.querySelector('.s2-why.tmp'); if (prev) prev.remove();
        box.appendChild(el('div', { class: 's2-why tmp', html: '<b>↺</b> «' + it.text + '» لا ينتمي إلى ' + binNode.querySelector('h4').textContent + '. ' + (it.why || '') }));
        return false;
      }
      chip.classList.add('placed'); chip.classList.remove('grab');
      chip.style.position = ''; chip.style.left = ''; chip.style.top = '';
      binNode.__drops.appendChild(chip); binNode.classList.remove('hot');
      W.audio.ok(); placed++;
      if (placed === total) {
        box.classList.add('solved');
        box.appendChild(el('div', { class: 's2-why', html: '<b>✓ كل العناصر في مكانها.</b> ' + (q.why || '') }));
        onSolved && onSolved();
      }
      return true;
    }

    function makeDrag(chip, it) {
      let dragging = false, ghost = null, ox = 0, oy = 0, hot = null;
      const stage = () => document.getElementById('stageInner');
      function down(e) {
        if (chip.classList.contains('placed')) return;
        e.preventDefault();
        dragging = true; chip.classList.add('grab');
        const k = W.scale || 1, r = chip.getBoundingClientRect(), sr = stage().getBoundingClientRect();
        ox = (e.clientX - r.left) / k; oy = (e.clientY - r.top) / k;
        ghost = chip.cloneNode(true);
        Object.assign(ghost.style, { position: 'absolute', zIndex: '90', pointerEvents: 'none',
          left: ((r.left - sr.left) / k) + 'px', top: ((r.top - sr.top) / k) + 'px', width: (r.width / k) + 'px' });
        stage().appendChild(ghost); chip.style.opacity = '.28'; W.audio.pick();
      }
      function move(e) {
        if (!dragging) return;
        const k = W.scale || 1, sr = stage().getBoundingClientRect();
        ghost.style.left = ((e.clientX - sr.left) / k - ox) + 'px';
        ghost.style.top = ((e.clientY - sr.top) / k - oy) + 'px';
        const n = hit(e.clientX, e.clientY);
        if (n !== hot) { if (hot) hot.classList.remove('hot'); hot = n; if (hot) hot.classList.add('hot'); }
      }
      function up(e) {
        if (!dragging) return;
        dragging = false; chip.classList.remove('grab'); chip.style.opacity = '1';
        if (ghost) { ghost.remove(); ghost = null; }
        const n = hit(e.clientX, e.clientY);
        if (hot && hot !== n) hot.classList.remove('hot');
        hot = null;
        if (n) accept(chip, it, n); else W.audio.no();
      }
      /* اختبار الإصابة بالهندسة لا بـ elementFromPoint (الأشباح تعترض الاختبار) */
      function hit(cx, cy) {
        let best = null, bd = Infinity;
        binNodes.forEach(n => {
          const r = n.getBoundingClientRect(), pad = 24;
          if (cx >= r.left - pad && cx <= r.right + pad && cy >= r.top - pad && cy <= r.bottom + pad) {
            const d = Math.hypot(cx - (r.left + r.right) / 2, cy - (r.top + r.bottom) / 2);
            if (d < bd) { bd = d; best = n; }
          }
        });
        return best;
      }
      W.scd.listen(chip, 'pointerdown', down);
      W.scd.listen(window, 'pointermove', move);
      W.scd.listen(window, 'pointerup', up);
      W.scd.listen(window, 'pointercancel', up);
      /* بديل لوحة المفاتيح */
      W.scd.listen(chip, 'keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        if (chip.classList.contains('placed')) return;
        const target = binNodes.find(n => n.dataset.bin === it.bin);
        accept(chip, it, target);
      });
    }
    return box;
  }

  /* ============ مشغّل مجموعة أنشطة: لا ينتقل إلا بحل كل الأنشطة ============ */
  function runSet(api, questions, opts) {
    opts = opts || {};
    const host = api.host;
    const wrap = W.util.el('div', { class: 's2-quiz' });
    host.appendChild(wrap); W.scd.node(wrap);
    let solved = 0;
    const total = questions.length;
    const state = questions.map(() => false);

    function sync() {
      api.panel.setChecks(questions.map((q, i) => ({ label: (KINDS[q.type] || 'نشاط') + ' ' + (i + 1), done: state[i] })),
        state.findIndex(x => !x));
      api.panel.setActions([
        { label: 'تلميح', onClick: () => api.hint(opts.hint || 'اقرأ السؤال كاملًا، وتذكّر ما نفّذته داخل التطبيق قبل قليل.') },
      ]);
    }

    questions.forEach((q, i) => {
      const done = () => {
        if (state[i]) return;
        state[i] = true; solved++;
        W.s2store.stepDone(api.lesson.id, 'q' + i);
        sync();
        if (solved === total) {
          W.scd.after(() => api.pass(opts.passMsg || 'أتممت جميع أنشطة المراجعة بإجابات صحيحة.'), 500);
        }
      };
      const node = q.type === 'fill' ? fill(q, done)
        : q.type === 'match' ? match(q, done)
        : q.type === 'order' ? order(q, done)
        : q.type === 'sort' ? sort(q, done)
        : q.type === 'findError' ? findError(q, done)
        : choose(q, done);
      wrap.appendChild(node);
    });

    api.panel.setInstr(opts.instr || 'أجب عن جميع الأنشطة. لكل نشاط طريقة مختلفة: اختر، أكمل، صِلْ، رتّب، صنّف، أو اكتشف الخطأ.',
      opts.instrEn || 'Answer every activity to finish the lesson.');
    sync();
    return {
      get solvedCount() { return solved; },
      reveal() {
        api.hint('الإجابات النموذجية متاحة في وضع المعلّم ضمن قسم «الإجابات النموذجية».');
      },
      why() { return 'بقي ' + (total - solved) + ' من ' + total + ' نشاطًا دون حل صحيح.'; },
    };
  }

  W.s2quiz = { choose, fill, match, order, sort, findError, runSet, KINDS };
})(window.MNARA);

/* ==== engine/s2interact.js ==== */
/* ==== engine/s2interact.js — مشاهد تفاعلية للدروس النظرية ====
 * كل مفهوم يمرّ بثلاث مراحل: شاهد بصريًا ← جرّب بيدك ← طبّق وحدك.
 * لا صورة ثابتة مع فقرة؛ بل مشهد يتحرّك بيد التلميذ، وتحقّق قائم على الحالة.
 */
(function (W) {
  const { el, svg } = W.util;
  const NS = 'http://www.w3.org/2000/svg';
  const E = (t, a = {}, kids = []) => {
    const n = document.createElementNS(NS, t);
    for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]);
    (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(c));
    return n;
  };
  const TXT = (x, y, s, o = {}) => {
    const n = E('text', Object.assign({ x, y, 'text-anchor': 'middle',
      'font-family': 'Tahoma,Arial,sans-serif', 'font-size': 13, fill: '#20140A', 'font-weight': '700' }, o));
    n.appendChild(document.createTextNode(s)); return n;
  };

  /* ================================================================
   * 1) مختبر تصحيح الأخطاء — خمس حالات حقيقية داخل محاكي Scratch
   *    شغّل ← لاحظ ← حدّد نوع الخطأ ← أصلحه ← أعد التشغيل وتحقّق
   * ================================================================ */
  const DEBUG_CASES = [
    {
      id: 'disconnected', title: 'الحالة 1 — لبنات غير متصلة',
      build: (MK) => [
        { x: 20, y: 16, blocks: [MK('whenflag')] },
        { x: 24, y: 96, blocks: [MK('move', { n: 120 })] },   // منفصلة
      ],

      answer: 'لبنات غير متصلة',
      why: 'لبنة التحرك ليست ملتصقة بلبنة الحدث، فلا شيء يشغّلها عند نقر العلم.',
      how: 'اسحب لبنة «move» وألصقها أسفل لبنة «when flag clicked» حتى تتشابكا.',
      fixed: (sim) => sim.hasSequence(['whenflag', 'move'], { needHat: true }) && sim.state().scripts.length === 1,
      verify: (sim) => Math.abs(sim.sprite().x) > 60,
    },
    {
      id: 'extra', title: 'الحالة 2 — لبنة زائدة',
      build: (MK) => [{ x: 20, y: 16, blocks: [MK('whenflag'), MK('move', { n: 100 }), MK('move', { n: 100 })] }],
      symptom: 'المطلوب أن يتحرّك 100 خطوة، لكنه يتحرّك ضعف المسافة.',
      answer: 'لبنة إضافية',
      why: 'توجد لبنتا تحرّك بدل واحدة، فتُنفَّذ الحركة مرتين.',
      how: 'اسحب لبنة «move» الزائدة وأفلتها في سلّة المهملات أو فوق لوح اللبنات.',
      fixed: (sim) => sim.countOp('move') === 1,
      verify: (sim) => Math.abs(sim.sprite().x - 100) < 3,
    },
    {
      id: 'missing', title: 'الحالة 3 — لبنة مفقودة',
      build: (MK) => [{ x: 20, y: 16, blocks: [MK('whenflag'), MK('pendown')] }],
      symptom: 'أنزلنا القلم لكن لم يظهر أي خط على المنصة.',
      answer: 'لبنة مفقودة',
      why: 'القلم منزَل لكن لا توجد لبنة تحرّك، والقلم لا يرسم إلا مع الحركة.',
      how: 'أضف لبنة «move» بعد «pen down».',
      fixed: (sim) => sim.hasSequence(['whenflag', 'pendown', 'move'], { needHat: true }),
      verify: (sim) => sim.inkPixels() > 150,
    },
    {

  const DEBUG_TYPES = ['لبنات غير متصلة', 'لبنة إضافية', 'لبنة مفقودة', 'ترتيب خاطئ', 'قيمة خاطئة'];

  function debugLab(api, host, opts) {
    opts = opts || {};
    const MK = (op, a) => W.scratchsim.mkBlock(op, a);
    let idx = 0, stage = 'run', sim = null;
    const solved = DEBUG_CASES.map(() => false);
    const wrap = el('div', { class: 's2-lab' });
    const railBox = el('div', { class: 's2-labrail' });
    const stageBox = el('div', { class: 's2-labstage' });
    const stepBox = el('div', { class: 's2-labstep' });
    wrap.appendChild(railBox); wrap.appendChild(stepBox); wrap.appendChild(stageBox);
    host.appendChild(wrap); W.scd.node(wrap);

    function rail() {
      railBox.innerHTML = '';
      DEBUG_CASES.forEach((c, i) => railBox.appendChild(el('button', {
        class: 's2-labcase' + (i === idx ? ' on' : '') + (solved[i] ? ' done' : ''),
        'data-case': c.id, text: (solved[i] ? '✓ ' : '') + c.title.split('—')[0].trim(),
        title: c.title, onclick: () => { idx = i; stage = 'run'; W.audio.click(); mount(); },
      })));
    }

    function mount() {
      rail();
      stageBox.innerHTML = '';
      const c = DEBUG_CASES[idx];
      sim = W.scratchsim.build(stageBox, {
        penEnabled: true,
        scripts: c.build(MK),
        onChange: () => paint(),
      });
      api.__sim = sim; api.__lab = LAB;
      paint();
    }

    function paint() {
      const c = DEBUG_CASES[idx];
      stepBox.innerHTML = '';
      const head = el('div', { class: 'h' }, [
        el('b', { text: c.title }),
        el('span', { class: 'sym', text: 'العَرَض: ' + c.symptom }),
      ]);
      stepBox.appendChild(head);
      const steps = el('div', { class: 's2-labsteps' });
      [['١ شغّل ولاحظ', 'run'], ['٢ حدّد نوع الخطأ', 'find'], ['٣ أصلح المقطع', 'fix'], ['٤ أعد التشغيل', 'verify']]
        .forEach(([lb, k]) => steps.appendChild(el('div', {
          class: 'st' + (stage === k ? ' on' : '') + (order(k) < order(stage) ? ' past' : ''), 'data-lstep': k, text: lb })));
      stepBox.appendChild(steps);

      if (stage === 'run') {
        stepBox.appendChild(el('p', { text: 'انقر زر انطلق (العلم الأخضر) في المحاكي أسفل، وراقب المنصة جيدًا.' }));
        const b = el('button', { class: 's2-btn primary', 'data-lab': 'run', text: '▶ شغّل ولاحظ النتيجة' });
        b.onclick = async () => {
          b.disabled = true; await sim.go(); b.disabled = false;
          stage = 'find'; W.audio.click(); paint();
        };
        stepBox.appendChild(b);
      } else if (stage === 'find') {
        stepBox.appendChild(el('p', { text: 'رأيت النتيجة. ما نوع الخطأ في هذا المقطع؟' }));
        const opts2 = el('div', { class: 's2-labopts' });
        DEBUG_TYPES.forEach(t => {
          const b = el('button', { class: 's2-opt', 'data-labtype': t, text: t });
          b.onclick = () => {
            if (t === c.answer) {
              b.classList.add('right'); W.audio.ok();
              W.s2store.stepDone(api.lesson.id, 'lab-find-' + c.id);
              W.scd.after(() => { stage = 'fix'; paint(); }, 700);
            } else { b.classList.add('wrong'); W.audio.no(); }
          };
          opts2.appendChild(b);
        });
        stepBox.appendChild(opts2);
      } else if (stage === 'fix') {
        stepBox.appendChild(el('p', { html: '<b>لماذا حدث هذا؟</b> ' + c.why }));
        stepBox.appendChild(el('p', { class: 'how', html: '<b>كيف أصلحه؟</b> ' + c.how }));
        let ok = false;
        try { ok = !!c.fixed(sim); } catch (e) {}
        stepBox.appendChild(el('div', { class: 's2-labcheck' + (ok ? ' ok' : ''),
          text: ok ? '✓ المقطع صار صحيحًا — انتقل إلى إعادة التشغيل.' : '… عدّل المقطع في المحاكي أسفل، وسأتحقق تلقائيًا.' }));
        if (ok) {
          const b = el('button', { class: 's2-btn primary', 'data-lab': 'toverify', text: '▶ أعد التشغيل وتحقّق' });
          b.onclick = () => { stage = 'verify'; W.audio.click(); paint(); };
          stepBox.appendChild(b);
        }
      } else {
        stepBox.appendChild(el('p', { text: 'شغّل المقطع بعد الإصلاح وتأكد أن النتيجة صارت صحيحة.' }));
        const b = el('button', { class: 's2-btn primary', 'data-lab': 'verify', text: '▶ شغّل بعد الإصلاح' });
        b.onclick = async () => {
          b.disabled = true;
          sim.resetSprite(); sim.clearPen();
          await sim.go(); b.disabled = false;
          let good = false;
          try { good = !!c.verify(sim); } catch (e) {}
          if (good) {
            solved[idx] = true; W.audio.ok();
            W.s2store.stepDone(api.lesson.id, 'lab-fix-' + c.id);
            api.feedback('ok', 'أصلحت «' + c.title.split('—')[1].trim() + '» بنجاح.');
            rail();
            if (solved.every(Boolean)) {
              W.scd.after(() => api.pass(opts.passMsg || 'أتممت مختبر تصحيح الأخطاء بحالاته الخمس.'), 1000);
            } else {
              const nxt = solved.findIndex(s => !s);
              W.scd.after(() => { idx = nxt; stage = 'run'; mount(); }, 1400);
            }
          } else {
            api.fail('النتيجة ما زالت غير صحيحة. راجع المقطع مرة أخرى.');
            stage = 'fix'; paint();
          }
        };
        stepBox.appendChild(b);
      }
      api.panel.setChecks(DEBUG_CASES.map((c2, i) => ({ label: c2.title.split('—')[1].trim(), done: solved[i] })),
        solved.findIndex(s => !s));
    }
    const order = (k) => ({ run: 0, find: 1, fix: 2, verify: 3 }[k] || 0);
    const LAB = {
      get index() { return idx; }, get stage() { return stage; },
      get solved() { return solved.slice(); },
      cases: DEBUG_CASES.map(c => c.id),
      goCase(i) { idx = i; stage = 'run'; mount(); },
      setStage(s) { stage = s; paint(); },
      sim: () => sim,
    };
    W.scd.every(() => { if (stage === 'fix') paint(); }, 700);
    mount();
    return LAB;
  }

  function degreeDial(host, opts) {
    opts = opts || {};
    let deg = 0, ghost = 0;
    const seen = {};
    const box = el('div', { class: 's2-dial' });
    const art = el('div', { class: 'art' });
    const readout = el('div', { class: 'readout' });
    const btns = el('div', { class: 'btns' });
    /* معاينة حية: الكائن قبل الدوران وبعده جنبًا إلى جنب */
    const prev = el('div', { class: 's2-dialprev' });
    const before = el('div', { class: 'p' }, [el('span', { text: 'قبل الدوران' }), el('div', { class: 'sp', 'data-prev': 'before' })]);
    const after = el('div', { class: 'p' }, [el('span', { text: 'بعد الدوران' }), el('div', { class: 'sp', 'data-prev': 'after' })]);
    prev.appendChild(before); prev.appendChild(el('div', { class: 'arw', text: '⟶' })); prev.appendChild(after);
    box.appendChild(el('div', { class: 'row' }, [art, prev]));
    box.appendChild(readout); box.appendChild(btns);
    host.appendChild(box);
    function cat(rot) {
      const g = svg('svg', { viewBox: '0 0 100 100', width: 84, height: 84 });
      const add = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
      const wrapG = add('g', { transform: 'rotate(' + rot + ' 50 50)' });
      const p1 = add('path', { d: 'M28,44 q-6,-16 2,-26 l12,10 q8,-3 16,0 l12,-10 q8,10 2,26 q10,10 4,24 q-6,14 -26,14 q-20,0 -26,-14 q-6,-14 4,-24 z',
        fill: '#F5A623', stroke: '#B87614', 'stroke-width': 2 });
      wrapG.appendChild(p1);
      [[40, 48], [60, 48]].forEach(([cx, cy]) => { wrapG.appendChild(add('circle', { cx, cy, r: 5, fill: '#fff' }));
        wrapG.appendChild(add('circle', { cx: cx + 1, cy: cy + 1, r: 2.6, fill: '#333' })); });
      wrapG.appendChild(add('path', { d: 'M78,66 l18,-4 l0,8 z', fill: '#B87614' }));
      g.appendChild(wrapG); return g;
    }
    function paintPrev() {
      const b = before.querySelector('.sp'), a2 = after.querySelector('.sp');
      b.innerHTML = ''; a2.innerHTML = '';
      b.appendChild(cat(0)); a2.appendChild(cat(deg));
    }

    function draw() {
      art.innerHTML = '';
      const S = 300, cx = 150, cy = 150, r = 116;
      const s = svg('svg', { viewBox: '0 0 300 300', width: '100%', height: '100%' });
      s.appendChild(E('circle', { cx, cy, r, fill: '#FBF6EC', stroke: '#BFA274', 'stroke-width': 3 }));
      for (let d = 0; d < 360; d += 15) {
        const a = (d - 90) * Math.PI / 180, big = d % 45 === 0;
        s.appendChild(E('line', {
          x1: cx + Math.cos(a) * (r - (big ? 16 : 8)), y1: cy + Math.sin(a) * (r - (big ? 16 : 8)),
          x2: cx + Math.cos(a) * r, y2: cy + Math.sin(a) * r,
          stroke: big ? '#9C7F52' : '#CBB79A', 'stroke-width': big ? 3 : 1.4 }));
      }
      [[0, '0'], [90, '90'], [180, '180'], [270, '270']].forEach(([d, lb]) => {
        const a = (d - 90) * Math.PI / 180;
        s.appendChild(TXT(cx + Math.cos(a) * (r - 30), cy + Math.sin(a) * (r - 30) + 5, lb, { 'font-size': 14 }));
      });
      /* قوس الدوران المقطوع */
      if (deg > 0) {
        const a0 = -Math.PI / 2, a1 = (deg - 90) * Math.PI / 180;
        const large = deg > 180 ? 1 : 0;
        s.appendChild(E('path', {
          d: `M${cx},${cy - r + 34} A${r - 34},${r - 34} 0 ${large} 1 ${cx + Math.cos(a1) * (r - 34)},${cy + Math.sin(a1) * (r - 34)}`,
          fill: 'none', stroke: '#E7A063', 'stroke-width': 9, 'stroke-linecap': 'round', opacity: .85 }));
      }
      /* الظل: الاتجاه المتوقع قبل التنفيذ */
      if (ghost) {
        const ga = (ghost - 90) * Math.PI / 180;
        s.appendChild(E('line', { x1: cx, y1: cy, x2: cx + Math.cos(ga) * (r - 26), y2: cy + Math.sin(ga) * (r - 26),
          stroke: '#5FB8AE', 'stroke-width': 5, 'stroke-dasharray': '9 7', 'stroke-linecap': 'round', opacity: .9 }));
        s.appendChild(TXT(cx + Math.cos(ga) * (r - 46), cy + Math.sin(ga) * (r - 46) - 8, 'المتوقّع', { 'font-size': 11, fill: '#2A6E67' }));
      }
      /* السهم الحالي */
      const a = (deg - 90) * Math.PI / 180;
      s.appendChild(E('line', { x1: cx, y1: cy, x2: cx + Math.cos(a) * (r - 26), y2: cy + Math.sin(a) * (r - 26),
        stroke: '#4C97FF', 'stroke-width': 7, 'stroke-linecap': 'round' }));
      s.appendChild(E('polygon', {
        points: [[cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8)],
                 [cx + Math.cos(a + 2.6) * 15, cy + Math.sin(a + 2.6) * 15],
                 [cx + Math.cos(a - 2.6) * 15, cy + Math.sin(a - 2.6) * 15]].map(p => p.join(',')).join(' '),
        fill: '#2A6BC4', transform: `translate(${Math.cos(a) * -6},${Math.sin(a) * -6})` }));
      s.appendChild(E('circle', { cx, cy, r: 11, fill: '#2A6BC4' }));
      art.appendChild(s);
      paintPrev();
      readout.innerHTML = '';
      readout.appendChild(el('b', { text: deg + '°' }));
      readout.appendChild(el('span', { text: deg === 0 ? 'لم يدُر بعد'
        : deg === 90 ? 'ربع دورة' : deg === 180 ? 'نصف دورة'
        : deg === 270 ? 'ثلاثة أرباع دورة' : deg === 360 ? 'دورة كاملة — عاد إلى نقطة البداية' : 'دوران حرّ' }));
    }
    function set(v, mark) {
      deg = Math.max(0, Math.min(360, v)); if (mark) seen[deg] = true;
      ghost = 0; draw(); opts.onChange && opts.onChange(deg, Object.keys(seen).map(Number));
    }
    [['ربع دورة', 90], ['نصف دورة', 180], ['ثلاثة أرباع', 270], ['دورة كاملة', 360]].forEach(([lb, v]) => {
      btns.appendChild(el('button', { class: 's2-btn cmd', 'data-deg': String(v), text: lb + ' (' + v + '°)',
        onmouseenter: () => { ghost = v; draw(); },
        onmouseleave: () => { ghost = 0; draw(); },
        onclick: () => { W.audio.click(); set(v, true); } }));
    });
    btns.appendChild(el('button', { class: 's2-btn', 'data-deg': '0', text: '↺ إعادة',
      onclick: () => { W.audio.click(); Object.keys(seen).forEach(k => delete seen[k]); set(0, false); } }));
    draw();
    return { get deg() { return deg; }, get seen() { return Object.keys(seen).map(Number); }, set };
  }

  function repeatCompare(host, opts) {
    opts = opts || {};
    const state = { ranLong: false, ranShort: false, longSteps: 0, shortSteps: 0 };
    const box = el('div', { class: 's2-cmp' });
    host.appendChild(box);
    function side(title, blocksLabel, count, key, cls) {
      const track = el('div', { class: 'track' });
      const dot = el('div', { class: 'dot' });
      track.appendChild(dot);
      const blocks = el('div', { class: 'blocks' });
      blocksLabel.forEach(b => blocks.appendChild(el('div', { class: 'b ' + (b.c || 'motion'), text: b.t })));
      const btn = el('button', { class: 's2-btn primary', 'data-cmp': key, text: '▶ شغّل' });
      const info = el('div', { class: 'info', text: 'عدد اللبنات: ' + count });
      btn.onclick = async () => {
        btn.disabled = true; dot.style.transition = 'none'; dot.style.left = '0px';
        await new Promise(r => W.scd.after(r, 40));
        for (let i = 1; i <= 4; i++) {
          dot.style.transition = 'left .35s'; dot.style.left = (i * 25) + '%';
          await new Promise(r => W.scd.after(r, 380));
        }
        btn.disabled = false; state[key] = true; state[key === 'ranLong' ? 'longSteps' : 'shortSteps'] = 4;
        W.audio.ok(); opts.onChange && opts.onChange(state);
        paintVerdict();
      };
      return el('div', { class: 'col ' + cls }, [el('h4', { text: title }), blocks, info, track, btn]);
    }
    const verdict = el('div', { class: 's2-cmpverdict' });
    box.appendChild(el('div', { class: 'cols' }, [
      side('بدون تكرار', [{ t: 'when ⚑ clicked', c: 'events' }, { t: 'move 60 steps' }, { t: 'move 60 steps' },
        { t: 'move 60 steps' }, { t: 'move 60 steps' }], 5, 'ranLong', 'long'),
      side('مع لبنة repeat', [{ t: 'when ⚑ clicked', c: 'events' }, { t: 'repeat 4', c: 'control' }, { t: 'move 60 steps' }], 3, 'ranShort', 'short'),
    ]));
    box.appendChild(verdict);
    function paintVerdict() {
      verdict.innerHTML = '';
      if (state.ranLong && state.ranShort) {
        verdict.className = 's2-cmpverdict on';
        verdict.appendChild(el('b', { text: 'النتيجة واحدة — والكود أقصر.' }));
        verdict.appendChild(el('span', { text: 'الجهتان حرّكتا الكائن أربع مرات بالمسافة نفسها، لكن الجهة اليمنى استخدمت 3 لبنات بدل 5. كلما زاد عدد المرات زاد التوفير.' }));
      } else {
        verdict.className = 's2-cmpverdict';
        verdict.appendChild(el('span', { text: 'شغّل الجهتين لتقارن النتيجة بنفسك.' }));
      }
    }
    paintVerdict();
    return { state, ran: () => state.ranLong && state.ranShort };
  }

  function solidVsFlat(host, opts) {
    opts = opts || {};
    let yaw = -0.7;
    const shown = {};            /* الأبعاد المعروضة تبقى معروضة ولا يمحو أحدها الآخر */
    const touched = {};
    const box = el('div', { class: 's2-solid' });
    const flat = el('div', { class: 'pane' }), solid = el('div', { class: 'pane' });
    const ctrls = el('div', { class: 'ctrls' });
    box.appendChild(el('div', { class: 'panes' }, [solid, flat]));
    box.appendChild(ctrls);
    host.appendChild(box);

    function project(p) {
      const cy2 = Math.cos(yaw), sy2 = Math.sin(yaw);
      const x = p[0] * cy2 - p[1] * sy2, y = p[0] * sy2 + p[1] * cy2, z = p[2];
      const tilt = 0.55;
      return [150 + x * 1, 150 - z + y * Math.sin(tilt) * 0.9];
    }

    /* خط قياس حقيقي: يُزاح عن حرف المجسّم، بسهمين وشرطتي حد واسم البُعد بلونه */
    function measure(s, a, b, label, col) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;      /* عمودي على الخط */
      const off = 20;
      const A = [a[0] + nx * off, a[1] + ny * off];
      const B = [b[0] + nx * off, b[1] + ny * off];
      const g = E('g', { 'data-dimline': label });
      /* شرطتا الحد من حرف المجسّم إلى خط القياس */
      [[a, A], [b, B]].forEach(pair => g.appendChild(E('line', {
        x1: pair[0][0], y1: pair[0][1], x2: pair[1][0], y2: pair[1][1],
        stroke: col, 'stroke-width': 2, 'stroke-dasharray': '3 3', opacity: .85 })));
      g.appendChild(E('line', { x1: A[0], y1: A[1], x2: B[0], y2: B[1],
        stroke: col, 'stroke-width': 4.5, 'stroke-linecap': 'round' }));
      /* رأسا السهم */
      const ah = (pt, sx, sy) => {
        const ux = sx / len, uy = sy / len, L = 9;
        g.appendChild(E('polygon', { fill: col, points: [
          pt[0] + ',' + pt[1],
          (pt[0] + ux * L - uy * 4.5) + ',' + (pt[1] + uy * L + ux * 4.5),
          (pt[0] + ux * L + uy * 4.5) + ',' + (pt[1] + uy * L - ux * 4.5)].join(' ') }));
      };
      ah(A, dx, dy); ah(B, -dx, -dy);
      /* اسم البُعد قرب الخط بلونه نفسه */
      const mx = (A[0] + B[0]) / 2 + nx * 15, my = (A[1] + B[1]) / 2 + ny * 15;
      const w = label.length * 9 + 26;
      g.appendChild(E('rect', { x: mx - w / 2, y: my - 13, width: w, height: 25, rx: 8,
        fill: '#fff', stroke: col, 'stroke-width': 2.2 }));
      g.appendChild(TXT(mx, my + 5, label, { 'font-size': 14, fill: col, 'font-weight': '800' }));
      s.appendChild(g);
    }

    function drawSolid() {
      solid.innerHTML = '';
      const s = svg('svg', { viewBox: '0 0 300 260', width: '100%', height: '100%' });
      s.appendChild(E('rect', { x: 0, y: 0, width: 300, height: 260, fill: '#F7F1E4' }));
      const W2 = 58, L = 42, H = 52;

  const COSTUME_VARIANTS = [

  function costumeLabel(i) { return COSTUME_VARIANTS[(i || 0) % COSTUME_VARIANTS.length].ar; }
  function costumeArt(name, idx, size) {
    const base = (SPRITE_ART[name] || catCostume)(size || 62);
    const i = (idx || 0) % COSTUME_VARIANTS.length;
    if (!i) return base;
    const v = COSTUME_VARIANTS[i];
    const g = document.createElementNS(NS, 'g');
    if (v.t) g.setAttribute('transform', v.t);
    while (base.firstChild) g.appendChild(base.firstChild);
    base.appendChild(g);
    if (v.accent) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 84); c.setAttribute('cy', 18); c.setAttribute('r', 10);
      c.setAttribute('fill', v.accent); c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', 2.6);
      base.appendChild(c);
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', 84); tx.setAttribute('y', 22.5); tx.setAttribute('text-anchor', 'middle');
      tx.setAttribute('font-size', 11); tx.setAttribute('font-weight', '800'); tx.setAttribute('fill', '#fff');
      tx.setAttribute('font-family', 'Segoe UI,Arial,sans-serif');
      tx.appendChild(document.createTextNode(String(i + 1)));
      base.appendChild(tx);
    }
    return base;
  }

      for (let i = 0; i < 60; i++) add('circle', { cx: Math.random() * 480, cy: Math.random() * 230, r: Math.random() * 1.5 + .4, fill: '#DCE6FF', opacity: (Math.random() * .7 + .3).toFixed(2) });
      add('circle', { cx: 392, cy: 62, r: 30, fill: '#C7A0E8' });
      for (let i = 0; i < 8; i++) {
        const x = 14 + i * 60, hgt = 70 + (i % 3) * 46;
        add('rect', { x, y: 360 - hgt, width: 44, height: hgt, fill: '#2C3A72', stroke: '#4E63B8' });
        for (let r = 0; r < Math.floor(hgt / 22); r++) for (let c = 0; c < 3; c++)
          add('rect', { x: x + 6 + c * 12, y: 366 - hgt + r * 22, width: 7, height: 10, fill: '#8FE0FF', opacity: .8 });
      }
      return s;
    },
    'Farm': (w, h) => {
      const s = bdRect(w, h, ['#CFE9F7', '#A7D8EE']);
      const add = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); s.appendChild(n); };
      add('rect', { x: 0, y: 230, width: 480, height: 130, fill: '#8FBF5E' });
      add('rect', { x: 300, y: 150, width: 130, height: 90, fill: '#C0522E' });
      add('path', { d: 'M292,150 l73,-46 l73,46 z', fill: '#8C3A1E' });
      add('rect', { x: 344, y: 190, width: 40, height: 50, fill: '#F0D9A8' });
      for (let i = 0; i < 8; i++) add('rect', { x: 10 + i * 34, y: 236, width: 5, height: 26, fill: '#6E9C43' });
      return s;
    },
    'Blue Sky': (w, h) => {
      const s = bdRect(w, h, ['#BFE6FF', '#8FCBEF']);
      const add = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); s.appendChild(n); };
      [[80, 70, 34], [230, 46, 26], [370, 88, 30]].forEach(([x, y, r]) => {
        add('circle', { cx: x, cy: y, r, fill: '#fff' });
        add('circle', { cx: x + r * .8, cy: y + 8, r: r * .74, fill: '#fff' });
        add('circle', { cx: x - r * .8, cy: y + 10, r: r * .64, fill: '#fff' });
      });
      return s;
    },
  };
  function bdRect(w, h, cols) {
    const s = svg('svg', { viewBox: '0 0 480 360', width: '100%', height: '100%', preserveAspectRatio: 'none' });
    const defs = document.createElementNS(NS, 'defs');
    const g = document.createElementNS(NS, 'linearGradient');
    const gid = 'bg' + Math.random().toString(36).slice(2, 8);
    g.setAttribute('id', gid); g.setAttribute('x1', '0'); g.setAttribute('y1', '0'); g.setAttribute('x2', '0'); g.setAttribute('y2', '1');
    cols.forEach((c, i) => { const st = document.createElementNS(NS, 'stop'); st.setAttribute('offset', i); st.setAttribute('stop-color', c); g.appendChild(st); });
    defs.appendChild(g); s.appendChild(defs);
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', 0); r.setAttribute('y', 0); r.setAttribute('width', 480); r.setAttribute('height', 360); r.setAttribute('fill', `url(#${gid})`);
    s.appendChild(r);
    return s;
  }

  const SOUND_LIB = [
    { name: 'Meow', cat: 'Animals' }, { name: 'Pop', cat: 'Effects' },
    { name: 'Teleport2', cat: 'Space' }, { name: 'Space Ripple', cat: 'Space' },
    { name: 'Boing', cat: 'Effects' }, { name: 'Crazy Laugh', cat: 'Effects' },
  ];

  /* ======================= أدوات داخلية ======================= */
  let UID = 1;
  const uid = () => 'b' + (UID++);
  function mkBlock(op, args) {
    const d = OPS[op]; const a = {};
    if (d.args) for (const k in d.args) a[k] = (args && args[k] != null) ? args[k] : d.args[k].def;
    return { uid: uid(), op, args: a,
      body: (d.shape === 'c' || d.shape === 'celse') ? [] : null,
      elseBody: d.shape === 'celse' ? [] : null };
  }
  function cloneBlock(b) {
    return { uid: uid(), op: b.op, args: Object.assign({}, b.args),
      body: b.body ? b.body.map(cloneBlock) : null,
      elseBody: b.elseBody ? b.elseBody.map(cloneBlock) : null };
  }
  function flatten(list, out) {
    out = out || [];
    (list || []).forEach(b => {
      out.push(b);
      if (b.body) flatten(b.body, out);
      if (b.elseBody) flatten(b.elseBody, out);
    });
    return out;
  }

  /* ======================= البناء ======================= */
  /* opts:
   *   allow      : [op,...] اللبنات المسموح بها في هذا الدرس (قفل تدريجي)
   *   cats       : [catKey,...] الفئات الظاهرة
   *   penEnabled : هل إضافة القلم مضافة مسبقًا
   *   sprites    : ['Cat'] القائمة الابتدائية
   *   backdrop   : اسم الخلفية الابتدائية
   *   scripts    : لبنات مبدئية (لدروس تصحيح الأخطاء)
   *   onChange(kind, detail) : تُستدعى عند أي تغيّر في الحالة
   */
  function build(host, opts) {
    opts = opts || {};
    const onChange = opts.onChange || function () {};

    const st = {
      projectName: opts.projectName || 'Scratch Project',
      tab: 'code',
      cat: (opts.cats && opts.cats[0]) || 'events',
      penExt: !!opts.penEnabled,
      running: false, stopped: false,
      fullScreen: false,
      sprites: [],
      selected: 0,
      backdrop: opts.backdrop || 'Blank',
      backdrops: [opts.backdrop || 'Blank'],
      sounds: ['Meow'],
      messages: ['message1'],
      variables: { 'my variable': 0 },
      lists: { 'my list': [] },
      visibleVariables: {}, visibleLists: {},
      answer: '', timerStart: Date.now(), volume: 100,
      mouse: { x: 0, y: 0, down: false },
      scripts: [],                 // [{x,y,blocks:[]}]
      savedName: null, loadedName: null,
      penMarks: 0, stamps: 0, stampPts: [],
      events: {},                  // سجل الأفعال (لأغراض التحقق فقط)
      lastRun: null,
    };
    function mark(k, v) { if (!st.events[k]) { st.events[k] = v == null ? true : v; } onChange(k, v); }

    function newSprite(name) {
      return { name, x: 0, y: 0, dir: 90, size: 100, visible: true, rotStyle: 'all',
        say: null, think: false, penDown: false, penColor: '#0FBD8C', penHue: 60, penSize: 1,
        effects: {}, soundEffects: {}, volume: 100, layer: 0, draggable: true, isClone: false,
        costumes: [name + '-a', name + '-b'], costume: 0 };
    }
    function emptySprite() {
      const s = newSprite('Cat');
      s.name = 'بدون كائن'; s.visible = false; s.hiddenPlaceholder = true; s.costumes = ['empty']; s.costume = 0; s.draggable = false;
      return s;
    }
    const seedSprites = (opts.sprites && opts.sprites.length ? opts.sprites : ['Cat']);
    seedSprites.forEach(n => st.sprites.push(newSprite(n)));
    if (!st.sprites.length) st.sprites.push(emptySprite());
    if (opts.scripts) st.scripts = opts.scripts.map(s => ({ x: s.x || 24, y: s.y || 20, blocks: s.blocks.map(cloneBlock) }));

    const sp = () => st.sprites[st.selected] || st.sprites[0];
    const hasRealSprites = () => st.sprites.some(s => !s.hiddenPlaceholder);
    function normalizeSelected() {
      if (!st.sprites.length) { st.sprites.push(emptySprite()); st.selected = 0; return; }
      if (st.selected >= st.sprites.length) st.selected = st.sprites.length - 1;
      if (st.selected < 0) st.selected = 0;
      if (sp() && sp().hiddenPlaceholder) {
        const idx = st.sprites.findIndex(s => !s.hiddenPlaceholder);
        if (idx >= 0) st.selected = idx;
      }
    }
    function addSpriteByName(name) {
      if (!hasRealSprites()) { st.sprites = [newSprite(name)]; st.selected = 0; }
      else { st.sprites.push(newSprite(name)); st.selected = st.sprites.length - 1; }
      normalizeSelected();
    }
    function removeSpriteAt(i) {
      st.sprites.splice(i, 1);
      if (!st.sprites.length || !st.sprites.some(s => !s.hiddenPlaceholder)) {
        st.sprites = [emptySprite()]; st.selected = 0;
      } else {
        st.selected = Math.max(0, Math.min(i - 1, st.sprites.length - 1));
        normalizeSelected();
      }
    }

    /* -------------------------------------------------- الهيكل */
    const root = el('div', { class: 'scratch' });

    /* شريط التطبيق */
    const projName = el('div', { class: 'sc-projname', text: st.projectName });
    const mFile = el('button', { class: 'sc-menu', text: 'File' });
    const mEdit = el('button', { class: 'sc-menu', text: 'Edit' });
    const mTut = el('button', { class: 'sc-menu', text: 'Tutorials' });
    const bar = el('div', { class: 'sc-bar' }, [
      el('div', { class: 'sc-logo' }, scratchLogo()),
      el('button', { class: 'sc-menu globe', title: 'Language', 'aria-label': 'Language', text: '🌐 ▾' }),
      mFile, mEdit, mTut, projName,
      el('div', { class: 'sc-barspacer' }),
      el('button', { class: 'sc-menu', 'aria-label': 'Help', text: '؟' }),
    ]);
    root.appendChild(bar);

    /* الجسم */
    const catsCol = el('div', { class: 'sc-cats' });
    const pal = el('div', { class: 'sc-pal' });
    const tabsRow = el('div', { class: 'sc-tabs' });
    const left = el('div', { class: 'sc-left' }, [tabsRow, el('div', { class: 'sc-palwrap' }, [catsCol, pal])]);

    const scripts = el('div', { class: 'sc-scripts' });
    const trash = el('div', { class: 'sc-trash', text: '🗑' });
    const mid = el('div', { class: 'sc-mid' }, [scripts, trash]);

    const stageEl = el('div', { class: 'sc-stage' });
    const penCanvas = el('canvas', { width: '480', height: '360' });
    stageEl.appendChild(penCanvas);
    const spriteLayer = el('div', { style: { position: 'absolute', inset: '0', zIndex: '5' } });
    stageEl.appendChild(spriteLayer);

    const goBtn = el('button', { class: 'sc-ctl go', title: 'Go · انطلق', 'aria-label': 'Go', text: '⚑' });
    const stopBtn = el('button', { class: 'sc-ctl stop', title: 'Stop · توقف', 'aria-label': 'Stop', text: '⬢' });
    const fsBtn = el('button', { class: 'sc-ctl', title: 'Full Screen · ملء الشاشة', 'aria-label': 'Full Screen', text: '⛶' });
    const stageHead = el('div', { class: 'sc-stagehead' }, [goBtn, stopBtn, el('div', { class: 'sc-sizectl' }, [fsBtn])]);

    const propsRow = el('div', { class: 'sc-props' });
    const spritesRow = el('div', { class: 'sc-sprites' });
    const bdThumb = el('div', { class: 'bd' });
    const stageCol = el('div', { class: 'sc-stagecol' }, [el('div', { class: 'lbl', text: 'Stage' }), bdThumb]);
    const addSpriteBtn = el('button', { class: 'sc-addbtn sprite', title: 'Choose a Sprite · اختر كائنًا', 'aria-label': 'Choose a Sprite', text: '🐱' });
    const addBdBtn = el('button', { class: 'sc-addbtn backdrop', title: 'Choose a Backdrop · اختر خلفية', 'aria-label': 'Choose a Backdrop', text: '🖼' });
    const listRow = el('div', { class: 'sc-list', style: { position: 'relative' } }, [spritesRow, stageCol, addSpriteBtn, addBdBtn]);
    const right = el('div', { class: 'sc-right' }, [stageHead, stageEl,
      el('div', { class: 'sc-spritebar' }, [propsRow, listRow])]);

    root.appendChild(el('div', { class: 'sc-main' }, [left, mid, right]));
    host.appendChild(root); W.scd.node(root);

    /* سحب الكائن بالفأرة داخل المنصة كما في Scratch الحقيقي */
    let spDrag = null;
    W.scd.listen(stageEl, 'pointerdown', (e) => {
      const cur = sp();
      if (st.running || !cur || cur.hiddenPlaceholder || cur.draggable===false) return;
      const r = stageEl.getBoundingClientRect(), k = W.scale || 1;
      const sx = (e.clientX - r.left) / k * (480 / (r.width / k));
      const sy = (e.clientY - r.top) / k * (360 / (r.height / k));
      const s0 = sp(); const { px, py } = stageXY(s0); const size = 62 * (s0.size / 100);
      if (Math.abs(sx - px) > size * .62 || Math.abs(sy - py) > size * .62) return;
      e.preventDefault();
      spDrag = { ox: sx - px, oy: sy - py, sx:e.clientX, sy:e.clientY, moved:false };
      stageEl.style.cursor = 'grabbing'; W.audio.pick();
    });
    W.scd.listen(window, 'pointermove', (e) => {
      if (!spDrag) return;
      if (Math.hypot(e.clientX-spDrag.sx,e.clientY-spDrag.sy)>5) spDrag.moved=true;
      const r = stageEl.getBoundingClientRect(), k = W.scale || 1;
      const sx = (e.clientX - r.left) / k * (480 / (r.width / k));
      const sy = (e.clientY - r.top) / k * (360 / (r.height / k));
      const s0 = sp();
      s0.x = Math.max(-240, Math.min(240, Math.round(sx - spDrag.ox - 240)));
      s0.y = Math.max(-180, Math.min(180, Math.round(180 - (sy - spDrag.oy))));
      drawStage(); mark('dragsprite'); onChange('dragsprite', { x: s0.x, y: s0.y });
    });
    W.scd.listen(window, 'pointerup', () => {
      if (spDrag) { const wasClick=!spDrag.moved; spDrag = null; stageEl.style.cursor = ''; if(wasClick) fireEvent('whenclicked'); }
      st.mouse.down=false;
    });
    W.scd.listen(stageEl,'pointermove',(e)=>{
      const r=stageEl.getBoundingClientRect();
      st.mouse.x=Math.max(-240,Math.min(240,Math.round((e.clientX-r.left)/r.width*480-240)));
      st.mouse.y=Math.max(-180,Math.min(180,Math.round(180-(e.clientY-r.top)/r.height*360)));
    });
    W.scd.listen(stageEl,'pointerdown',()=>{st.mouse.down=true;});
    st.keys={};
    W.scd.listen(window,'keydown',(e)=>{const k=e.key===' '?'space':e.key;st.keys[k]=true;fireEvent('whenkey',b=>String((b.args||{}).k)===String(k));});
    W.scd.listen(window,'keyup',(e)=>{const k=e.key===' '?'space':e.key;st.keys[k]=false;});

    const ctx2d = penCanvas.getContext('2d');
    function clearPen() {
      st.stampPts = []; ctx2d.clearRect(0, 0, 480, 360); st.penMarks = 0; st.stamps = 0; }

    /* -------------------------------------------------- التبويبات */
    function renderTabs() {
      tabsRow.innerHTML = '';
      [['code', 'Code', '📄'], ['costumes', 'Costumes', '🎨'], ['sounds', 'Sounds', '🔊']].forEach(([k, lb, ic]) => {
        tabsRow.appendChild(el('button', { class: 'sc-tab' + (st.tab === k ? ' on' : ''), 'data-tab': k,
          onclick: () => { W.audio.click(); st.tab = k; renderTabs(); renderPalette(); mark('tab:' + k); } },
          [document.createTextNode(ic + ' '), el('span', { text: lb })]));
      });
    }

    /* -------------------------------------------------- لوح اللبنات */
    function visibleCats() {
      const allow = opts.cats;
      /* الفئات التسع الأساسية ظاهرة دائمًا كما في Scratch 3 الحقيقي؛
       * الإضافات (القلم) تظهر فور إضافتها من زر Add Extension. */
      return CATS.filter(c => c.ext ? !!st.penExt : true);
    }
    /* لبنات الدرس تُبرَز، وبقية لبنات الفئة تبقى متاحة للتلميذ ليتفاعل بحرية
     * داخل حدود Scratch 3 — التحقق التربوي يبقى قائمًا على الحالة الناتجة. */
    function opFocus(op) { return !opts.allow || opts.allow.indexOf(op) >= 0; }

    function renderCats() {
      catsCol.innerHTML = '';
      visibleCats().forEach(c => {
        catsCol.appendChild(el('button', { class: 'sc-cat' + (st.cat === c.key ? ' on' : ''), 'data-cat': c.key,
          title: c.ar + ' · ' + c.en, 'aria-label': c.en,
          onclick: () => { W.audio.click(); st.cat = c.key; renderCats(); renderPalette(); mark('cat:' + c.key); } },
          [el('i', { style: { background: c.color } }), el('span', { text: c.en })]));
      });
      // زر إضافة الإضافات (Pen) — أسفل عمود الفئات كما في Scratch
      catsCol.appendChild(el('div', { class: 'sc-addext-wrap' },
        el('button', { class: 'sc-addext', id: 'scAddExt', title: 'Add Extension · إضافة إضافة',
          'aria-label': 'Add Extension', text: '＋',
          onclick: () => { W.audio.click(); openExtensions(); } })));
    }

    function openCreateDialog(kind) {
      const labels = kind === 'variable'
        ? {title:'Make a Variable — أنشئ متغيّرًا', placeholder:'اسم المتغيّر', def:'score'}
        : kind === 'list'
          ? {title:'Make a List — أنشئ قائمة', placeholder:'اسم القائمة', def:'items'}
          : {title:'Make a Block — أنشئ لبنة', placeholder:'اسم اللبنة', def:'my block'};
      const dlg = el('div', { class:'sc-dlg sc-create-dlg' });
      const inp = el('input', { value:labels.def, placeholder:labels.placeholder, spellcheck:'false' });
      const save = el('button', { class:'sc-dlgbtn', text:'OK' });
      const close = () => { dlg.remove(); W.audio.click(); };
      save.onclick = () => {
        const name = (inp.value || '').trim();
        if (!name) return;
        if (kind === 'variable') { if (!(name in st.variables)) st.variables[name] = 0; mark('variable:create', name); }
        else if (kind === 'list') { if (!(name in st.lists)) st.lists[name] = []; mark('list:create', name); }
        else { st.customBlockName = name; OPS.myblock.text = [name]; OPS.myblock.ar = name; OPS.defineblock.args.n.def = name; mark('block:create', name); }
        dlg.remove(); renderPalette(); W.audio.ok(); onChange(kind + '-create', name);
      };
      dlg.appendChild(el('div', { class:'sc-dlgwin sc-create-win' }, [
        el('div', { class:'sc-dlgtitle', text:labels.title }),
        el('div', { class:'sc-create-body' }, [
          el('label', { text:labels.placeholder }), inp,
          el('div', { class:'sc-create-scope' }, [
            el('span', { class:'on', text:'For all sprites' }),
            el('span', { text:'For this sprite only' }),
          ]),
        ]),
        el('div', { class:'sc-dlgfoot' }, [
          el('button', { class:'sc-dlgbtn ghost', text:'Cancel', onclick:close }), save,
        ]),
      ]));
      root.appendChild(dlg); W.scd.node(dlg); W.scd.after(() => inp.focus(), 30);
    }

    function renderPalette() {
      pal.innerHTML = '';
      if (st.tab === 'costumes') {
        const s0 = sp();
        pal.appendChild(el('h5', {}, [el('i', { class: 'dot', style: { background: '#9966FF' } }),
          el('b', { text: 'Costumes' }), el('span', { text: 'مظاهر الكائن' })]));
        if (!s0 || s0.hiddenPlaceholder) {
          pal.appendChild(el('div', { class: 'sc-emptylist', text: 'لا يوجد كائن على المنصة الآن. أضف كائنًا جديدًا من زر + في أسفل قائمة الكائنات، ثم غيّر مظهره هنا.' }));
          return;
        }
        if (!s0.costumes) { s0.costumes = [s0.name + '-a']; s0.costume = 0; }
        const box = el('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '10px' } });
        s0.costumes.forEach((cn, i) => {
          const it = el('div', { class: 'sc-libit' + (i === s0.costume ? ' on' : ''), 'data-costume': String(i),
            style: { width: '112px', position: 'relative' } }, [
            el('div', { class: 'pv' }, costumeArt(s0.name, i, 56)),
            el('div', { class: 'nm', text: cn }),
            el('div', { class: 'nm', style: { fontSize: '10px', color: '#6B7C8C', direction: 'rtl' }, text: costumeLabel(i) }),
          ]);
          it.onclick = () => { s0.costume = i; W.audio.click(); mark('costume:select'); onChange('costume', i); renderPalette(); renderSpriteList(); drawStage(); };
          it.ondblclick = (e) => {
            e.stopPropagation();
            const inp = el('input', { class: 'sc-costrename', value: cn, style: { width: '96px' } });
            it.replaceChild(inp, it.children[1]); inp.focus(); inp.select();
            const commit = () => { const v = (inp.value || '').trim(); if (v) { s0.costumes[i] = v; mark('costume:rename'); onChange('costume-rename', v); }
              renderPalette(); renderSpriteList(); };
            inp.onblur = commit;
            inp.onkeydown = (ev) => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') renderPalette(); };
          };
          if (s0.costumes.length > 1) it.appendChild(el('button', { class: 'sc-xbtn', 'data-costdel': String(i), title: 'حذف المظهر', text: '×',
            onclick: (e) => { e.stopPropagation(); s0.costumes.splice(i, 1);
              if (s0.costume >= s0.costumes.length) s0.costume = s0.costumes.length - 1;
              W.audio.no(); mark('costume:delete'); onChange('costume-delete', s0.costumes.length); renderPalette(); renderSpriteList(); drawStage(); } }));
          box.appendChild(it);
        });
        pal.appendChild(box);
        const row = el('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' } }, [
          el('button', { class: 'sc-dlgbtn', id: 'scAddCostume', text: '＋ Add costume',
            onclick: () => { s0.costumes.push(s0.name + '-' + String.fromCharCode(97 + s0.costumes.length));
              s0.costume = s0.costumes.length - 1;
              W.audio.ok(); mark('costume:add'); onChange('costume-add', s0.costumes.length); renderPalette(); renderSpriteList(); drawStage(); } }),
          el('button', { class: 'sc-dlgbtn ghost', id: 'scDupCostume', text: '⧉ Duplicate',
            onclick: () => { s0.costumes.splice(s0.costume + 1, 0, s0.costumes[s0.costume] + '2');
              s0.costume = s0.costume + 1;
              W.audio.ok(); mark('costume:dup'); onChange('costume-dup', s0.costumes.length); renderPalette(); renderSpriteList(); drawStage(); } }),
          el('button', { class: 'sc-dlgbtn ghost', id: 'scNextCostume', text: '▶ next costume',
            onclick: () => { s0.costume = (s0.costume + 1) % Math.max(1, s0.costumes.length);
              W.audio.click(); mark('costume:next'); onChange('costume', s0.costume); renderPalette(); renderSpriteList(); drawStage(); } }),
        ]);
        pal.appendChild(row);

    function renderBlockNode(b, isPalette) {

          wrap.appendChild(midElse); wrap.appendChild(eb);
        }

      const n = el('div', { class: 'sc-blk ' + d.cat + ' shape-' + (d.shape || 'stack') + (isPalette ? ' pal' : ''),

    function reporterValue(b) {
      const a=b.args||{}, s0=sp();
      const n=k=>{const v=parseFloat(a[k]);return isNaN(v)?0:v};
      switch(b.op){
        case 'xposition': return Math.round(s0.x);
        case 'yposition': return Math.round(s0.y);
        case 'direction': return Math.round(s0.dir);
        case 'sizereporter': return Math.round(s0.size);
        case 'volreporter': return Math.round(st.volume);
        case 'answer': return st.answer || '';
        case 'mousex': return Math.round(st.mouse.x);
        case 'mousey': return Math.round(st.mouse.y);
        case 'loudness': return 0;
        case 'timer': return ((Date.now()-st.timerStart)/1000).toFixed(1);
