  const meshHouse = () => composite([
    { mesh: meshBox, c: '#E0D3B8', s: [1, 1, .62], o: [0, 0, 0] },
    { mesh: meshRoof, c: '#B24C34', s: [1.1, 1.1, .40], o: [0, 0, .62] },
    { mesh: meshBox, c: '#6B421F', s: [.22, .06, .30], o: [0, -.5, 0] },
  ]);
  const meshLion = () => composite([
    { mesh: meshBox, c: '#D9A62E', s: [.62, .90, .34], o: [.06, 0, .26] },
    { mesh: meshSphere, c: '#E0B341', s: [.42, .42, .42], o: [-.34, 0, .40] },
    { mesh: meshSphere, c: '#B8801C', s: [.56, .56, .56], o: [-.32, 0, .34] },
    { mesh: meshCylinder, c: '#C9952A', s: [.13, .13, .26], o: [.22, -.28, 0] },
    { mesh: meshCylinder, c: '#C9952A', s: [.13, .13, .26], o: [.22, .28, 0] },
    { mesh: meshCylinder, c: '#C9952A', s: [.13, .13, .26], o: [-.14, -.28, 0] },
    { mesh: meshCylinder, c: '#C9952A', s: [.13, .13, .26], o: [-.14, .28, 0] },
    { mesh: meshCylinder, c: '#B8801C', s: [.08, .08, .30], o: [.44, 0, .44] },
  ]);
  const meshRobot = () => composite([
    { mesh: meshBox, c: '#5FB8AE', s: [.86, .70, .46], o: [0, 0, .26] },
    { mesh: meshBox, c: '#3B9188', s: [.62, .52, .26], o: [0, 0, .72] },
    { mesh: meshCylinder, c: '#2A6E67', s: [.18, .18, .26], o: [-.34, 0, 0] },
    { mesh: meshCylinder, c: '#2A6E67', s: [.18, .18, .26], o: [.34, 0, 0] },
    { mesh: meshCylinder, c: '#F0C419', s: [.07, .07, .12], o: [0, 0, .98] },
  ]);
  const meshCamel = () => composite([
    { mesh: meshBox, c: '#C99A5B', s: [.72, .80, .30], o: [0, 0, .34] },
    { mesh: meshSphere, c: '#B8843F', s: [.34, .50, .30], o: [-.06, 0, .56] },
    { mesh: meshCylinder, c: '#C99A5B', s: [.20, .20, .34], o: [.34, 0, .52] },
    { mesh: meshSphere, c: '#D9AE72', s: [.30, .34, .26], o: [.44, 0, .78] },
    { mesh: meshCylinder, c: '#B8843F', s: [.12, .12, .36], o: [.26, -.26, 0] },
    { mesh: meshCylinder, c: '#B8843F', s: [.12, .12, .36], o: [.26, .26, 0] },
    { mesh: meshCylinder, c: '#B8843F', s: [.12, .12, .36], o: [-.26, -.26, 0] },
    { mesh: meshCylinder, c: '#B8843F', s: [.12, .12, .36], o: [-.26, .26, 0] },
  ]);
  const meshFish = () => composite([
    { mesh: meshSphere, c: '#3D8BD6', s: [.80, .46, .70], o: [.06, 0, .38] },
    { mesh: meshCone, c: '#2C6EB0', s: [.44, .30, .34], o: [-.44, 0, .38] },
  ]);

  const MESH = {
    box: meshBox, cylinder: meshCylinder, sphere: meshSphere, cone: meshCone,
    pyramid: meshPyramid, roof: meshRoof, wedge: meshWedge, star: meshStar,
    terrain: meshTerrain, tree: meshTree, house: meshHouse, lion: meshLion,
    robot: meshRobot, camel: meshCamel, fish: meshFish,
  };

  /* ===================== أدوات هندسية ===================== */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = (a) => { const L = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / L, a[1] / L, a[2] / L]; };
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * k)));
    g = Math.max(0, Math.min(255, Math.round(g * k)));
    b = Math.max(0, Math.min(255, Math.round(b * k)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  /* ===================== البناء ===================== */
  /* opts: { startAt:'login'|'dashboard'|'editor', objects:[], onChange(kind,detail),
   *         allowShapes:[names], className } */
  function build(host, opts) {
    opts = opts || {};
    const onChange = opts.onChange || function () {};

    const st = {
      screen: opts.startAt || 'login',
      loggedIn: false, classCode: '', className: opts.className || 'صف الأستاذة دعاء',
      designName: 'Bodacious Kieran',
      openedProject: null,
      objects: [], nextId: 1, selected: [],
      clipboard: null,
      cam: { yaw: -0.72, pitch: 0.56, dist: 150 },
      libCat: 'Basic Shapes', search: '', ruler: false, notes: [],
      insp: { docked: true, x: null, y: null, collapsed: false },
      exported: null, insertedInWord: false,
      scribbling: null,         // { pts:[[x,y]], obj }
      events: {},
      tool: null,
    };
    function mark(k, v) { if (!st.events[k]) st.events[k] = v == null ? true : v; onChange(k, v); }

    const root = el('div', { class: 't3d' });
    host.appendChild(root); W.scd.node(root);

    /* ---------------- شريط علوي ---------------- */
    /* Grade 2 lesson 2.6 requires renaming the project, so the design name is a
       REAL editable field here (the Grade 3 reference showed a static chip). */
    const nameChip = el('input', { class: 't3d-name', 'data-t': 'name', type: 'text',
      value: st.designName, 'aria-label': 'اسم المشروع · Project name', maxlength: '32' });
    nameChip.oninput = () => {
      const before = st.designName;
      st.designName = nameChip.value;
      if ((nameChip.value || '').trim().length >= 2) {
        if (st.openedProject && PROJECTS.has(before)) {
          PROJECTS.rename(before, nameChip.value);
          st.openedProject = nameChip.value;
        }
        mark('rename'); onChange('rename', { name: st.designName });
      }
    };
    const importBtn = el('button', { class: 't3d-barbtn', 'data-t': 'import',
      'data-testid': 'tinkercad-import-button', title: 'استيراد — Import', text: 'Import' });
    const exportBtn = el('button', { class: 't3d-barbtn', 'data-t': 'export',
      'data-testid': 'tinkercad-export-button', title: 'تصدير — Export', text: 'Export' });
    const sendBtn = el('button', { class: 't3d-barbtn', 'data-t': 'send', text: 'Send To' });
    const bar = el('div', { class: 't3d-bar' }, [
      el('div', { class: 't3d-logo', text: 'T' }),
      nameChip,
      el('div', { class: 't3d-barright' }, [importBtn, exportBtn, sendBtn]),
    ]);

    /* ---------------- شريط الأدوات ---------------- */
    const copyBtn = el('button', { class: 't3d-tool', 'data-t': 'copy', title: 'نسخ — Copy', 'aria-label': 'نسخ' },
      [W.icons.icon('copy')]);
    const pasteBtn = el('button', { class: 't3d-tool', 'data-t': 'paste', title: 'لصق — Paste', 'aria-label': 'لصق' },
      [W.icons.icon('paste')]);
    const delBtn = el('button', { class: 't3d-tool', 'data-t': 'delete', title: 'حذف — Delete', 'aria-label': 'حذف' },
      [W.icons.icon('trash')]);
    const groupBtn = el('button', { class: 't3d-tool', 'data-t': 'group', title: 'تجميع — Group', 'aria-label': 'تجميع' },
      [W.icons.icon('group')]);
    const ungroupBtn = el('button', { class: 't3d-tool', 'data-t': 'ungroup', title: 'فك التجميع — Ungroup', 'aria-label': 'فك التجميع' },
      [W.icons.icon('ungroup')]);
    const alignBtn = el('button', { class: 't3d-tool', 'data-t': 'align', title: 'محاذاة — Align', 'aria-label': 'محاذاة' },
      [W.icons.icon('align')]);
    const undoBtn = el('button', { class: 't3d-tool', 'data-t': 'undo', title: 'تراجع — Undo', 'aria-label': 'تراجع' },
      [W.icons.icon('undo')]);
    /* Duplicate is its own Tinkercad tool (Ctrl+D): one press produces one
       offset copy. Lesson 2.4 teaches Duplicate, so it must exist as a tool and
       not be approximated by Copy+Paste (§10). */
    const dupBtn = el('button', { class: 't3d-tool', 'data-t': 'duplicate',
      title: 'تكرار — Duplicate', 'aria-label': 'تكرار' }, [W.icons.icon('duplicate')]);
    const tools = el('div', { class: 't3d-tools' }, [
      undoBtn, el('div', { class: 't3d-sep' }),
      copyBtn, pasteBtn, dupBtn, delBtn, el('div', { class: 't3d-sep' }),
      groupBtn, ungroupBtn, alignBtn,
    ]);

    /* ---------------- المسرح ---------------- */
    const canvas = el('canvas', { class: 't3d-canvas' });
    const cwrap = el('div', { class: 't3d-canvaswrap' }, [canvas]);
    const homeBtn = el('button', { class: 't3d-hudbtn', 'data-t': 'home', title: 'Home view · العرض الرئيس', text: 'Home' });
    const zinBtn = el('button', { class: 't3d-hudbtn', 'data-t': 'zoomin', title: 'Zoom in', text: '＋' });
    const zoutBtn = el('button', { class: 't3d-hudbtn', 'data-t': 'zoomout', title: 'Zoom out', text: '－' });
    const fitBtn = el('button', { class: 't3d-hudbtn', 'data-t': 'fit', title: 'Fit all · ملاءمة', text: '⤢' });
    const hudEl = el('div', { class: 't3d-hud' }, [homeBtn, zinBtn, zoutBtn, fitBtn]);
    cwrap.appendChild(hudEl);
    const viewNote = el('div', { class: 't3d-viewnote', text: 'Perspective' });
    cwrap.appendChild(viewNote);
    cwrap.appendChild(el('div', { class: 't3d-grid-lbl', text: 'Workplane · مساحة العمل' }));

    /* ViewCube — مكعّب متساوي القياس بأوجه قابلة للنقر كما في تنكركاد */
    const cube = el('div', { class: 't3d-cube' });
    const FACES = [
      { k: 'TOP',   ar: 'من الأعلى',  yaw: -0.72, pitch: 1.35 },
      { k: 'FRONT', ar: 'من الأمام',  yaw: 0,     pitch: 0.10 },
      { k: 'RIGHT', ar: 'من اليمين',  yaw: 1.57,  pitch: 0.10 },
      { k: 'LEFT',  ar: 'من اليسار',  yaw: -1.57, pitch: 0.10 },
      { k: 'BACK',   ar: 'من الخلف',  yaw: 3.14,  pitch: 0.10 },
      { k: 'BOTTOM', ar: 'من الأسفل', yaw: -0.72, pitch: 0.07 },
      { k: 'HOME',   ar: 'العرض الرئيس', yaw: -0.72, pitch: 0.62 },
    ];
    function setView(f) {
      st.cam.yaw = f.yaw; st.cam.pitch = f.pitch; viewNote.textContent = f.k + ' view';
      W.audio.click(); mark('view:' + f.k); draw(); onChange('view', f.k);
    }
    (function buildCube() {
      const S = 104, NSU = 'http://www.w3.org/2000/svg';
      const g = W.util.svg('svg', { viewBox: '0 0 104 104', width: S, height: S, class: 't3d-cubesvg' });
      const add = (t, a, txt) => { const n = document.createElementNS(NSU, t);
        for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]);
        if (txt != null) n.appendChild(document.createTextNode(txt)); g.appendChild(n); return n; };
      const cx = 52, cy = 54, w = 30, h = 17, d = 30;
      /* الوجه العلوي (معيّن) */
      const top = [[cx, cy - d], [cx + w, cy - d + h], [cx, cy - d + h * 2], [cx - w, cy - d + h]];
      /* الوجه الأمامي الأيسر والأيمن */
      const left  = [[cx - w, cy - d + h], [cx, cy - d + h * 2], [cx, cy + d], [cx - w, cy + d - h]];
      const right = [[cx + w, cy - d + h], [cx, cy - d + h * 2], [cx, cy + d], [cx + w, cy + d - h]];
      const mk = (pts, fill, faceKey, label, lx, ly, rot) => {
        const poly = add('polygon', { points: pts.map(p => p.join(',')).join(' '), fill, stroke: '#8FA0AE',
          'stroke-width': 1.2, 'data-face': faceKey, class: 't3d-face' });
        const f = FACES.find(x => x.k === faceKey);
        poly.addEventListener('click', () => setView(f));
        poly.addEventListener('mouseenter', () => poly.setAttribute('fill', '#CFE6FA'));
        poly.addEventListener('mouseleave', () => poly.setAttribute('fill', fill));
        const t = add('text', { x: lx, y: ly, 'text-anchor': 'middle', 'font-family': 'Segoe UI,Arial',
          'font-size': 9, 'font-weight': '700', fill: '#4A5762', 'pointer-events': 'none',
          transform: rot ? `rotate(${rot} ${lx} ${ly})` : null }, label);
        return poly;
      };
      mk(top,   '#F3F7FA', 'TOP',   'TOP',   cx,       cy - d + h + 4, null);
      mk(left,  '#E4EBF1', 'FRONT', 'FRONT', cx - w / 2, cy + 4,  -30);
      mk(right, '#D7E1E9', 'RIGHT', 'RIGHT', cx + w / 2, cy + 4,   30);
      cube.appendChild(g);
      /* زرّا الوجهين المتبقيين أسفل المكعّب */
      const row = el('div', { class: 't3d-cubebtns' });
      ['LEFT', 'BACK', 'BOTTOM', 'HOME'].forEach(k => {
        const f = FACES.find(x => x.k === k);
        row.appendChild(el('button', { class: 't3d-cubebtn', 'data-face': k, title: f.ar, text: k,
          onclick: () => setView(f) }));
      });
      cube.appendChild(row);
    })();
    cwrap.appendChild(cube);

    /* ---------------- لوحة الأشكال ---------------- */
    const libSel = el('select', { class: 't3d-libsel' });
    SHAPE_CATS.forEach(c => libSel.appendChild(el('option', { value: c, text: c })));
    const searchIn = el('input', { class: 't3d-search', placeholder: 'Search shapes', spellcheck: 'false' });
    const shapesGrid = el('div', { class: 't3d-shapes' });
    const sideTabs = el('div', { class: 't3d-sidetabs' });
    const sidePanel = el('div', { class: 't3d-sidepanel' });
    let sideTab = 'shapes';
    function renderSideTabs() {
      sideTabs.innerHTML = '';
      [['shapes', 'الأشكال', 'Shapes'], ['ruler', 'المسطرة', 'Ruler'], ['notes', 'الملاحظات', 'Notes']]
        .forEach(([k, ar, en]) => {
          sideTabs.appendChild(el('div', { class: 't3d-sidetab' + (sideTab === k ? ' on' : ''), 'data-st': k,
            title: ar + ' · ' + en,
            onclick: () => { sideTab = k; W.audio.click(); mark('side:' + k); renderSide(); } },
            [el('span', { class: 'ar', text: ar }), el('span', { class: 'en', text: en })]));
        });
    }
    function renderSide() {
      renderSideTabs();
      sidePanel.innerHTML = '';
      if (sideTab === 'shapes') { sidePanel.appendChild(shapesPane); renderShapes(); return; }
      if (sideTab === 'ruler') {
        const on = el('button', { class: 't3d-barbtn' + (st.ruler ? ' pri' : ''), 'data-t': 'ruler-toggle',
          style: { width: '100%', minHeight: '44px' }, text: st.ruler ? '✓ المسطرة مفعّلة' : 'أظهر المسطرة على مساحة العمل' });
        on.onclick = () => { st.ruler = !st.ruler; W.audio.click(); mark('ruler'); onChange('ruler', st.ruler); renderSide(); draw(); };
        const o = st.selected.length === 1 ? findObj(st.selected[0]) : null;
        sidePanel.appendChild(el('div', { class: 't3d-sidebody' }, [
          on,
          el('div', { class: 't3d-hint', text: 'المسطرة تُظهر مبدأ القياس ومحوري X وY بالمليمتر، وموضع المجسّم المحدّد وأبعاده.' }),
          el('div', { class: 't3d-readout' }, o ? [
            el('div', { class: 'r' }, [el('b', { text: 'X' }), el('span', { text: String(Math.round(o.x)) })]),
            el('div', { class: 'r' }, [el('b', { text: 'Y' }), el('span', { text: String(Math.round(o.y)) })]),
            el('div', { class: 'r' }, [el('b', { text: 'Length' }), el('span', { text: Math.round(o.l) + ' mm' })]),
            el('div', { class: 'r' }, [el('b', { text: 'Width' }), el('span', { text: Math.round(o.w) + ' mm' })]),
            el('div', { class: 'r' }, [el('b', { text: 'Height' }), el('span', { text: Math.round(o.h) + ' mm' })]),
          ] : [el('div', { class: 'empty', text: 'حدّد مجسّمًا لترى قياساته هنا.' })]),
        ]));
        return;
      }
      /* Notes */
      const list = el('div', { class: 't3d-notelist' });
      function paintNotes() {
        list.innerHTML = '';
        if (!st.notes.length) list.appendChild(el('div', { class: 'empty', text: 'لا ملاحظات بعد.' }));
        st.notes.forEach((n, i) => {
          const ta = el('textarea', { class: 't3d-note', 'data-note': String(i), rows: '3' });
          ta.value = n.text;
          ta.oninput = () => { n.text = ta.value; mark('note:edit'); };
          list.appendChild(el('div', { class: 't3d-noteitem' }, [
            ta,
            el('button', { class: 't3d-notedel', 'data-notedel': String(i), title: 'حذف الملاحظة', text: '\u00D7',
              onclick: () => { st.notes.splice(i, 1); W.audio.no(); mark('note:del'); paintNotes(); } }),
          ]));
        });
      }
      const add = el('button', { class: 't3d-barbtn pri', 'data-t': 'note-add', style: { width: '100%', minHeight: '44px' },
        text: '＋ أضف ملاحظة' });
      add.onclick = () => { st.notes.push({ text: 'ملاحظة على التصميم…' }); W.audio.ok(); mark('note:add'); onChange('note', st.notes.length); paintNotes(); };
      sidePanel.appendChild(el('div', { class: 't3d-sidebody' }, [add,
        el('div', { class: 't3d-hint', text: 'اكتب ملاحظتك على التصميم، ويمكنك حذفها بزر السلة.' }), list]));
      paintNotes();
    }
    const shapesPane = el('div', { class: 't3d-shapespane' }, [
      el('div', { class: 't3d-libhead' }, [libSel]),
      el('div', { style: { padding: '0 10px 8px' } }, [searchIn]),
      shapesGrid,
    ]);
    const side = el('div', { class: 't3d-side' }, [sideTabs, sidePanel]);

    const main = el('div', { class: 't3d-main' }, [cwrap, side]);
    root.appendChild(bar); root.appendChild(tools); root.appendChild(main);

    const ctx = canvas.getContext('2d');
    let cw = 0, ch = 0;
    function resize() {
      const r = cwrap.getBoundingClientRect(), k = W.scale || 1;
      cw = Math.max(80, Math.round(r.width / k)); ch = Math.max(80, Math.round(r.height / k));
      canvas.width = cw; canvas.height = ch;
      draw();
    }

    /* ===================== الكاميرا والإسقاط ===================== */
    function camBasis() {
      const { yaw, pitch, dist } = st.cam;
      const eye = [dist * Math.cos(pitch) * Math.sin(yaw), -dist * Math.cos(pitch) * Math.cos(yaw), dist * Math.sin(pitch)];
      const fwd = norm(sub([0, 0, 8], eye));
      const right = norm(cross(fwd, [0, 0, 1]));
      const up = cross(right, fwd);
      return { eye, fwd, right, up };
    }
    let BASIS = camBasis();
    const FOCAL = () => Math.min(cw, ch) * 1.35;

    function project(p) {
      const d = sub(p, BASIS.eye);
      const vz = dot(d, BASIS.fwd);
      if (vz <= 1) return null;
      const f = FOCAL() / vz;
      return { x: cw / 2 + dot(d, BASIS.right) * f, y: ch / 2 - dot(d, BASIS.up) * f, z: vz };
    }

    /* تحويل إزاحة الشاشة إلى إزاحة على مساحة العمل (z=0) */
    function screenToPlaneBasis(atZ) {
      const o = project([0, 0, atZ || 0]);
      const px = project([1, 0, atZ || 0]);
      const py = project([0, 1, atZ || 0]);
      if (!o || !px || !py) return null;
      const a = px.x - o.x, b = py.x - o.x, c = px.y - o.y, d = py.y - o.y;
      const det = a * d - b * c;
      if (Math.abs(det) < 1e-6) return null;
      return { inv: [d / det, -b / det, -c / det, a / det] };
    }
    function screenDeltaToWorld(dx, dy, atZ) {
      const B = screenToPlaneBasis(atZ);
      if (!B) return { x: 0, y: 0 };
      return { x: B.inv[0] * dx + B.inv[1] * dy, y: B.inv[2] * dx + B.inv[3] * dy };
    }

    /* ===================== بناء أوجه الكائن ===================== */
    function objFaces(o) {
      const src = MESH[o.kind] ? MESH[o.kind]() : meshBox();
      const cr = Math.cos(o.rot * Math.PI / 180), sr = Math.sin(o.rot * Math.PI / 180);
      /* `flip` is a real 180-degree turn about a HORIZONTAL axis: the local z of
         every vertex is mirrored, so a cone ends up point-DOWN with its wide
         opening on top — the shape of an ice-cream cone. Turning the shape about
         the vertical axis (o.rot) can never do this, which is why the cone kept
         standing on its point however far it was rotated. */
      const fz = o.flip ? -1 : 1, oz = o.flip ? o.h : 0;
      const out = [];
      src.forEach(f => {
        const pts = f.p.map(([x, y, z]) => {
          const sx = x * o.w, sy = y * o.l, sz = z * o.h * fz + oz;
          return [o.x + sx * cr - sy * sr, o.y + sx * sr + sy * cr, o.z + sz];
        });
        out.push({ p: pts, c: f.c || o.color, o });
      });
      return out;
    }
    function allFaces() {
      const out = [];
      st.objects.forEach(o => {
        if (o.children) o.children.forEach(c => objFaces(withParent(c, o)).forEach(f => { f.o = o; out.push(f); }));
        else objFaces(o).forEach(f => out.push(f));
      });
      return out;
    }
    /* كائن داخل مجموعة: إحداثياته نسبية لمركز المجموعة */
    function withParent(c, g) {
      const cr = Math.cos(g.rot * Math.PI / 180), sr = Math.sin(g.rot * Math.PI / 180);
      return Object.assign({}, c, {
        x: g.x + c.dx * cr - c.dy * sr,
        y: g.y + c.dx * sr + c.dy * cr,
        z: g.z + c.dz,
        rot: c.rot + g.rot,
        color: g.uniformColor || c.color,
      });
    }

    /* ===================== الرسم ===================== */
    const LIGHT = norm([0.42, -0.62, 0.86]);
    function drawGrid() {
      const N = 12, S = 10;
      ctx.lineWidth = 1;
      for (let i = -N; i <= N; i++) {
        const major = i % 5 === 0;
        ctx.strokeStyle = major ? '#B9C6CF' : '#D5DEE4';
        let a = project([i * S, -N * S, 0]), b = project([i * S, N * S, 0]);
        if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        a = project([-N * S, i * S, 0]); b = project([N * S, i * S, 0]);
        if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
    }
    function drawFaces() {
      const faces = allFaces();
      const prepared = [];
      faces.forEach(f => {
        const pr = f.p.map(project);
        if (pr.some(p => !p)) return;
        const n = norm(cross(sub(f.p[1], f.p[0]), sub(f.p[2], f.p[0])));
        const depth = pr.reduce((s, p) => s + p.z, 0) / pr.length;
        prepared.push({ pr, n, depth, c: f.c, o: f.o });
      });
      prepared.sort((a, b) => b.depth - a.depth);
      prepared.forEach(f => {
        const k = 0.52 + 0.48 * Math.abs(dot(f.n, LIGHT));
        ctx.fillStyle = shade(f.c, k);
        ctx.beginPath();
        f.pr.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = .8; ctx.stroke();
        if (st.selected.indexOf(f.o.id) >= 0) {
          ctx.strokeStyle = 'rgba(20,119,209,.85)'; ctx.lineWidth = 1.6; ctx.stroke();
        }
      });
    }
    /* 3D text objects carry a string; draw it on the top face of the slab so the
       word the pupil typed is actually visible on the model. */
    function drawLabels() {
      st.objects.forEach(o => {
        if (!o.isText || !o.text) return;
        const c = project([o.x, o.y, o.h + 0.6]);
        if (!c) return;
        const size = Math.max(11, Math.min(46, o.h * 2.2 + o.w * 0.34));
        ctx.save();
        ctx.font = '900 ' + size + 'px Tahoma, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = Math.max(2, size * 0.14);
        ctx.strokeStyle = 'rgba(255,255,255,.92)';
        ctx.strokeText(o.text, c.x, c.y);
        ctx.fillStyle = o.color || '#20140A';
        ctx.fillText(o.text, c.x, c.y);
        ctx.restore();
      });
    }
    function bboxCorners(o) {
      const cr = Math.cos(o.rot * Math.PI / 180), sr = Math.sin(o.rot * Math.PI / 180);
      const pts = [];
      [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]].forEach(([x, y]) => {
        const sx = x * o.w, sy = y * o.l;
        pts.push([o.x + sx * cr - sy * sr, o.y + sx * sr + sy * cr, o.z]);
      });
      return pts;
    }
    let handles = [];
    function drawHandles() {
      handles = [];
      if (st.selected.length !== 1) return;
      const o = findObj(st.selected[0]); if (!o) return;
      const corners = bboxCorners(o);
      const ctr = project([o.x, o.y, o.z + o.h / 2]);
      const push = (p, d) => {           /* إزاحة المقبض للخارج بعيدًا عن جسم المجسّم */
        if (!ctr) return p;
        const vx = p.x - ctr.x, vy = p.y - ctr.y, L = Math.hypot(vx, vy) || 1;
        return { x: p.x + vx / L * d, y: p.y + vy / L * d };
      };
      corners.forEach((c, i) => {
        const p0 = project(c); if (!p0) return;
        const p = push(p0, 11);
        handles.push({ kind: 'scale', i, x: p.x, y: p.y });
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1477D1'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.rect(p.x - 5, p.y - 5, 10, 10); ctx.fill(); ctx.stroke();
      });
      const topP0 = project([o.x, o.y, o.z + o.h]);
      const topP = topP0 ? { x: topP0.x, y: topP0.y - 12 } : null;
      if (topP) {
        handles.push({ kind: 'height', x: topP.x, y: topP.y });
        ctx.fillStyle = '#20140A'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.rect(topP.x - 5, topP.y - 5, 10, 10); ctx.fill(); ctx.stroke();
      }
      /* ---- RAISE handle (§10): a BLACK CONE above the top face.
         Tinkercad separates two different things and so must we:
           · the white/black square on the top face changes HEIGHT (o.h)
           · this cone lifts the whole shape OFF the workplane (o.z)
         They now have different shapes, different colours, different drag axes
         and different event names, so a lesson can require one without the
         other ever satisfying it. */
      const raiseP0 = project([o.x, o.y, o.z + o.h]);
      const raiseP = raiseP0 ? { x: raiseP0.x, y: raiseP0.y - 34 } : null;
      if (raiseP) {
        handles.push({ kind: 'raise', x: raiseP.x, y: raiseP.y });
        ctx.strokeStyle = '#20140A'; ctx.lineWidth = 1.6;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(raiseP.x, raiseP.y + 8); ctx.lineTo(raiseP0.x, raiseP0.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#20140A';
        ctx.beginPath();
        ctx.moveTo(raiseP.x, raiseP.y - 8);
        ctx.lineTo(raiseP.x - 6.5, raiseP.y + 6);
        ctx.lineTo(raiseP.x + 6.5, raiseP.y + 6);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
        if (o.z > 0.5) {
          ctx.font = '10.5px Segoe UI,Tahoma,sans-serif';
          ctx.fillStyle = '#20140A'; ctx.textAlign = 'center';
          ctx.fillText('Raise ' + Math.round(o.z), raiseP.x, raiseP.y - 12);
          ctx.textAlign = 'start';
        }
      }

      /* ---- ROTATION handle + live arc (§10) ---- */
      const rotAnchor = project([o.x, o.y - Math.max(o.l, o.w) * 0.5 - 16, o.z]);
      if (rotAnchor) {
        handles.push({ kind: 'rotate', x: rotAnchor.x, y: rotAnchor.y });
        /* the ring the handle travels along, so it reads as a rotation control */
        if (ctr) {
          const rad = Math.hypot(rotAnchor.x - ctr.x, rotAnchor.y - ctr.y);
          ctx.strokeStyle = 'rgba(20,119,209,.35)'; ctx.lineWidth = 1.4;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(ctr.x, ctr.y, rad, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          /* the swept arc from 0 to the current angle, drawn while dragging */
          if (drag && drag.mode === 'rotate' && drag.o && drag.o.id === o.id) {
            const a0 = -Math.PI / 2;
            const a1 = a0 + (o.rot * Math.PI / 180);
            ctx.strokeStyle = '#1477D1'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(ctr.x, ctr.y, rad, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
          }
        }
        ctx.fillStyle = '#1477D1'; ctx.beginPath(); ctx.arc(rotAnchor.x, rotAnchor.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(rotAnchor.x, rotAnchor.y, 4, 0.4, 5.2); ctx.stroke();
        /* the live degree read-out the book shows while the pupil drags */
        if (drag && drag.mode === 'rotate' && drag.o && drag.o.id === o.id) {
          const deg = Math.round(((o.rot % 360) + 360) % 360);
          const txt = deg + '\u00B0';
          ctx.font = 'bold 13px Segoe UI,Tahoma,sans-serif';
          const tw = ctx.measureText(txt).width + 14;
          ctx.fillStyle = '#1477D1';
          ctx.beginPath(); ctx.rect(rotAnchor.x - tw / 2, rotAnchor.y - 32, tw, 20); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
          ctx.fillText(txt, rotAnchor.x, rotAnchor.y - 18);
          ctx.textAlign = 'start';
        }
      }
      // بطاقة الأبعاد على المشهد
      const lbl = project([o.x, o.y, o.z + o.h + 3]);
      if (lbl) {
        const txt = 'W ' + Math.round(o.w) + ' · L ' + Math.round(o.l) + ' · H ' + Math.round(o.h);
        ctx.font = '11px Segoe UI,Tahoma,sans-serif';
        const tw = ctx.measureText(txt).width + 12;
        ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = '#1477D1'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.rect(lbl.x - tw / 2, lbl.y - 20, tw, 18); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1477D1'; ctx.textAlign = 'center';
        ctx.fillText(txt, lbl.x, lbl.y - 7);
        ctx.textAlign = 'start';
      }
    }
    /* مسطرة حقيقية على مساحة العمل: مبدأ إحداثيات + موضع المجسّم المحدّد وأبعاده */
    function drawRuler() {
      if (!st.ruler) return;
      const o = st.selected.length === 1 ? findObj(st.selected[0]) : null;
      ctx.save();
      ctx.strokeStyle = '#1477D1'; ctx.fillStyle = '#1477D1'; ctx.lineWidth = 1.6;
      ctx.font = '11px Segoe UI,Tahoma,sans-serif';
      const org = project([0, 0, 0]);
      /* محورا القياس مع تدريج كل 10 مم */
      for (const ax of [0, 1]) {
        for (let i = 0; i <= 8; i++) {
          const a = project(ax ? [0, i * 10, 0] : [i * 10, 0, 0]);
          const b = project(ax ? [-3, i * 10, 0] : [i * 10, -3, 0]);
          if (!a || !b) continue;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          if (i % 2 === 0 && i > 0) { ctx.fillText(String(i * 10), b.x - 8, b.y + 12); }
        }
        const e = project(ax ? [0, 80, 0] : [80, 0, 0]);
        if (org && e) { ctx.beginPath(); ctx.moveTo(org.x, org.y); ctx.lineTo(e.x, e.y); ctx.stroke(); }
      }
      if (org) { ctx.beginPath(); ctx.arc(org.x, org.y, 4, 0, Math.PI * 2); ctx.fill(); }
      if (o) {
        const p1 = project([o.x, o.y, 0]);
        if (p1 && org) {
          ctx.setLineDash([5, 4]); ctx.strokeStyle = '#E4572E';
          ctx.beginPath(); ctx.moveTo(org.x, org.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
          ctx.setLineDash([]);
        }
        const txt = 'X ' + Math.round(o.x) + ' · Y ' + Math.round(o.y) +
                    '  |  L ' + Math.round(o.l) + ' · W ' + Math.round(o.w) + ' · H ' + Math.round(o.h) + ' mm';
        const w = ctx.measureText(txt).width + 16;
        ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = '#1477D1';
        ctx.beginPath(); ctx.rect(12, ch - 34, w, 22); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1477D1'; ctx.fillText(txt, 20, ch - 19);
      }
      ctx.restore();
    }

    function drawScribble() {
      if (!st.scribbling) return;
      const pts = st.scribbling.pts;
      if (pts.length < 2) return;
      ctx.strokeStyle = '#1477D1'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      pts.forEach((p, i) => {
        const pr = project([p[0], p[1], 0.4]); if (!pr) return;
        i ? ctx.lineTo(pr.x, pr.y) : ctx.moveTo(pr.x, pr.y);
      });
      ctx.stroke();
      ctx.fillStyle = 'rgba(20,119,209,.16)'; ctx.fill();
    }
    function draw() {
      if (!cw || !ch) return;
      BASIS = camBasis();
      ctx.clearRect(0, 0, cw, ch);
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, '#F3F7FA'); g.addColorStop(1, '#DDE5EB');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
      drawGrid(); drawFaces(); drawLabels(); drawHandles(); drawRuler(); drawScribble();
      renderInspector();
    }

    /* ===================== الكائنات ===================== */
    function findObj(id) { return st.objects.find(o => o.id === id) || null; }
    function addShape(name, at) {
      const d = SHAPES[name]; if (!d) return null;
      const o = {
        id: st.nextId++, name, kind: d.kind, color: d.color,
        x: at ? at.x : 0, y: at ? at.y : 0, z: 0,
        w: d.w, l: d.l, h: d.h, rot: 0, children: null,
      };
      if (d.special === 'text') { o.isText = true; o.text = 'نص'; }
      st.objects.push(o); st.selected = [o.id];
      mark('add:' + name); onChange('add', { name, id: o.id });
      if (o.isText) { mark('text:add'); onChange('text-add', { id: o.id }); }
      draw();
      return o;
    }

    /* ===================== التفاعل ===================== */
    function hitTest(mx, my) {
      const faces = allFaces();
      let best = null, bd = Infinity;
      faces.forEach(f => {
        const pr = f.p.map(project);
        if (pr.some(p => !p)) return;
        if (!pointInPoly(mx, my, pr)) return;
        const depth = pr.reduce((s, p) => s + p.z, 0) / pr.length;
        if (depth < bd) { bd = depth; best = f.o; }
      });
      return best;
    }
    function pointInPoly(x, y, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;
      }
      return inside;
    }
    function canvasPoint(e) {
      const r = canvas.getBoundingClientRect(), k = W.scale || 1;
      return { x: (e.clientX - r.left) / k * (cw / (r.width / k)), y: (e.clientY - r.top) / k * (ch / (r.height / k)) };
    }

    let drag = null;
    W.scd.listen(canvas, 'pointerdown', (e) => {
      e.preventDefault();
      const p = canvasPoint(e);

      /* وضع الرسم الحر */
      if (st.scribbling) {
        st.scribbling.drawing = true;
        const B = screenToPlaneBasis(0);
        const o = project([0, 0, 0]);
        if (B && o) {
          const dx = p.x - o.x, dy = p.y - o.y;
          st.scribbling.pts.push([B.inv[0] * dx + B.inv[1] * dy, B.inv[2] * dx + B.inv[3] * dy]);
        }
        draw(); return;
      }

      /* المقابض */
      let h = handles.find(hh => Math.hypot(hh.x - p.x, hh.y - p.y) < 9);
      /* النقر داخل جسم المجسّم يعني التحريك لا تغيير الأبعاد */
      if (h && hitTest(p.x, p.y) && Math.hypot(h.x - p.x, h.y - p.y) > 5) h = null;
      if (h && st.selected.length === 1) {
        const o = findObj(st.selected[0]);
        drag = { mode: h.kind, o, start: p, w0: o.w, l0: o.l, h0: o.h, z0: o.z, rot0: o.rot };
        return;
      }
      /* تحديد وتحريك */
      const hitObj = hitTest(p.x, p.y);
      if (hitObj) {
        if (e.shiftKey) {
          const k = st.selected.indexOf(hitObj.id);
          if (k >= 0) st.selected.splice(k, 1); else st.selected.push(hitObj.id);
          mark('multiselect');
        } else if (st.selected.indexOf(hitObj.id) < 0) {
          st.selected = [hitObj.id];
        }
        mark('select');
        drag = { mode: 'move', start: p, base: st.selected.map(id => { const o = findObj(id); return { id, x: o.x, y: o.y }; }) };
        onChange('select', st.selected.slice());
        if (sideTab === 'ruler') renderSide();
        draw(); return;
      }
      /* دوران الكاميرا */
      st.selected = [];
      drag = { mode: 'orbit', start: p, yaw0: st.cam.yaw, pitch0: st.cam.pitch };
      onChange('select', []);
      draw();
    });

    W.scd.listen(window, 'pointermove', (e) => {
      if (st.scribbling && st.scribbling.drawing) {
        const p = canvasPoint(e);
        const B = screenToPlaneBasis(0), o = project([0, 0, 0]);
        if (B && o) {
          const dx = p.x - o.x, dy = p.y - o.y;
          const np = [B.inv[0] * dx + B.inv[1] * dy, B.inv[2] * dx + B.inv[3] * dy];
          const last = st.scribbling.pts[st.scribbling.pts.length - 1];
          if (!last || Math.hypot(np[0] - last[0], np[1] - last[1]) > 1.4) st.scribbling.pts.push(np);
        }
        draw(); return;
      }
      if (!drag) return;
      const p = canvasPoint(e);
      const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
      if (drag.mode === 'orbit') {
        st.cam.yaw = drag.yaw0 + dx * 0.008;
        st.cam.pitch = Math.max(0.06, Math.min(1.45, drag.pitch0 + dy * 0.006));
        viewNote.textContent = 'Perspective';
        draw(); return;
      }
      if (drag.mode === 'move') {
        const d = screenDeltaToWorld(dx, dy, 0);
        drag.base.forEach(b => {
          const o = findObj(b.id); if (!o) return;
          o.x = Math.round((b.x + d.x) * 2) / 2;
          o.y = Math.round((b.y + d.y) * 2) / 2;
        });
        mark('move'); draw(); return;
      }
      if (drag.mode === 'scale') {
        const d = screenDeltaToWorld(dx, dy, 0);
        const o = drag.o;
        o.w = Math.max(4, Math.round(drag.w0 + d.x * 2));
        o.l = Math.max(4, Math.round(drag.l0 + d.y * 2));
        mark('resize:wl'); mark('scale:handle');
        mark('resize'); onChange('resize', { id: o.id, w: o.w, l: o.l, h: o.h }); draw(); return;
      }
      if (drag.mode === 'raise') {
        /* vertical lift OFF the workplane — changes z, never h (§10) */
        const o = drag.o;
        o.z = Math.max(0, Math.round((drag.z0 == null ? 0 : drag.z0) - dy * 0.42));
        mark('raise'); mark('raise:handle');
        onChange('raise', { id: o.id, z: o.z }); draw(); return;
      }
      if (drag.mode === 'height') {
        const o = drag.o;
        o.h = Math.max(2, Math.round(drag.h0 - dy * 0.42));
        mark('resize:h'); mark('height:handle');
        mark('resize'); mark('resize:h'); onChange('resize', { id: o.id, w: o.w, l: o.l, h: o.h }); draw(); return;
      }
      if (drag.mode === 'rotate') {
        const o = drag.o;
        o.rot = Math.round((drag.rot0 + dx * 0.9) / 5) * 5;
        /* rotate:handle proves the pupil used the REAL handle, not the number
           box — lesson 2.3 requires the handle specifically (§10). */
        mark('rotate'); mark('rotate:handle');
        onChange('rotate', { id: o.id, rot: o.rot }); draw(); return;
      }
    });
    W.scd.listen(window, 'pointerup', () => {
      if (st.scribbling) { st.scribbling.drawing = false; return; }
      drag = null;
    });
    W.scd.listen(canvas, 'wheel', (e) => {
      e.preventDefault();
      st.cam.dist = Math.max(50, Math.min(420, st.cam.dist + (e.deltaY > 0 ? 14 : -14)));
      draw();
    }, { passive: false });

    /* ===================== لوحة الخصائص ===================== */
    let inspector = null;
    function clampInsp() {
      if (!inspector) return;
      const host = cwrap.getBoundingClientRect(), k = W.scale || 1;
      const w = inspector.offsetWidth, h = inspector.offsetHeight;
      const maxX = Math.max(0, host.width / k - w - 6), maxY = Math.max(0, host.height / k - h - 6);
      /* While the panel is still DOCKED (the pupil has not dragged it), its
         corner is recomputed from the LIVE host size. The old code computed the
         corner once, before layout settled, so on a fresh mount the host was
         still tiny and the panel landed in the top-left corner on top of the
         zoom controls. Docked panels now always sit in the bottom-right. */
      if (st.insp.docked !== false) {
        /* FINAL LAYOUT — four owners, no contested pixels:
             top-left  = zoom HUD (narrow column)   top-right   = ViewCube
             bottom-LEFT = this Inspector           bottom-right = workplane caption
           The right edge is left entirely to the ViewCube, whose BOTTOM and HOME
           buttons must always be clickable. The panel's height is capped so its
           top begins BELOW the HUD, and it scrolls internally so no property row
           is ever lost. */
        const hr = hudEl.getBoundingClientRect();
        const avail = (host.bottom - hr.bottom) / k - 14;
        st.insp.x = 8;
        if (avail > 90) {
          inspector.style.maxHeight = Math.floor(avail) + 'px';
          st.insp.y = Math.max(6, host.height / k - Math.min(h, avail) - 6);
        } else {
          st.insp.y = maxY;
        }
      }
      st.insp.x = Math.min(Math.max(6, st.insp.x), maxX);
      st.insp.y = Math.min(Math.max(6, st.insp.y), maxY);
      inspector.style.left = st.insp.x + 'px';
      inspector.style.top = st.insp.y + 'px';
      inspector.style.right = 'auto';
    }
    function defaultInspPos() {
      const host = cwrap.getBoundingClientRect(), k = W.scale || 1;
      /* PRODUCT FIX (closing brief §6/§7): the panel used a HARD-CODED y of 178,
         which was below the old ViewCube. Adding the BOTTOM and HOME buttons made
         the cube taller, so the cube and the Inspector overlapped and each one
         swallowed the other's clicks depending on paint order. The offset is now
         measured from the cube itself, so the two can never collide. */
      /* The camera widgets own the RIGHT edge (ViewCube) and the top-left
         (zoom HUD). The Inspector therefore docks on the LEFT edge, below the
         HUD, where nothing else is painted — so a face of the ViewCube and a
         field of the Inspector can never sit on the same pixels. */
      /* clear of BOTH camera widgets: the zoom HUD occupies the top-left and
         the ViewCube the top-right, so the panel docks on the left edge BELOW
         the HUD. Measured, never hard-coded, so a taller HUD cannot collide. */
      /* The camera widgets own the two TOP corners: the zoom HUD top-left and
         the ViewCube top-right. The Inspector therefore docks in the BOTTOM-LEFT
         corner, which carries only a caption, so no control of one widget can
         ever land on the pixels of another. */
      st.insp.x = 8;

    let scribbleUI = null;
    function startScribble() {
      st.scribbling = { pts: [], drawing: false };
      st.selected = [];
      mark('scribble:start'); onChange('scribble-start', {});
      scribbleUI = el('div', { style: { position: 'absolute', left: '50%', bottom: '14px', transform: 'translateX(-50%)',
        zIndex: '9', display: 'flex', gap: '8px', alignItems: 'center', background: 'rgba(255,255,255,.95)',
        border: '1px solid #C9CFD6', borderRadius: '8px', padding: '8px 12px', direction: 'rtl', fontSize: '12.5px', color: '#38414A' } }, [
        el('span', { text: 'ارسم بحرية على مساحة العمل ثم اضغط' }),
        el('button', { class: 't3d-barbtn pri', 'data-t': 'scribble-done', style: { minHeight: '40px' }, text: 'Done',
          onclick: () => finishScribble() }),
        el('button', { class: 't3d-barbtn', 'data-t': 'scribble-clear', style: { minHeight: '40px' }, text: 'مسح',
          onclick: () => { st.scribbling.pts = []; W.audio.click(); draw(); } }),
      ]);
      cwrap.appendChild(scribbleUI); W.scd.node(scribbleUI);
      draw();
    }
    function finishScribble() {
      const pts = st.scribbling ? st.scribbling.pts : [];
      if (pts.length < 6) { W.audio.no(); onChange('scribble-short', pts.length); return; }
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const wdt = Math.max(6, maxX - minX), len = Math.max(6, maxY - minY);
      const unit = pts.map(p => [(p[0] - cx) / wdt, (p[1] - cy) / len]);
      const kindKey = 'scribble_' + st.nextId;
      MESH[kindKey] = () => extrude(unit);
      const o = { id: st.nextId++, name: 'Scribble', kind: kindKey, color: '#5FB8AE',
        x: Math.round(cx), y: Math.round(cy), z: 0, w: Math.round(wdt), l: Math.round(len), h: 8, rot: 0, children: null, fromScribble: true };
      st.objects.push(o); st.selected = [o.id];
      st.scribbling = null;
      if (scribbleUI) { scribbleUI.remove(); scribbleUI = null; }
      W.audio.ok(); mark('scribble:done'); onChange('scribble-done', { id: o.id }); draw();
      return o;
    }

    function placeAtPointer(name, e) {
      const p = canvasPoint(e);
      const B = screenToPlaneBasis(0), o0 = project([0, 0, 0]);
      let at = { x: 0, y: 0 };
      if (B && o0) {
        const dx = p.x - o0.x, dy = p.y - o0.y;
        at = { x: Math.round(B.inv[0] * dx + B.inv[1] * dy), y: Math.round(B.inv[2] * dx + B.inv[3] * dy) };
      }
      const obj = SHAPES[name].special === 'scribble' ? (startScribble(), null) : addShape(name, at);
      if (obj) W.audio.drop();
      return obj;
    }
    function makeShapeDraggable(node, name) {
      /* Two ways to place a shape, sharing one code path (brief §10):
       *   DRAG  — press the tile and release over the workplane.
       *   TAP   — a simple tap on the tile drops the shape at the workplane
       *           centre. Without this, a tile looked interactive but did
       *           nothing on a tap, which is the "visible but inactive"
       *           failure class. */
      let dragging = false, ghost = null, moved = false, sx = 0, sy = 0;
      function drop(name) {
        if (SHAPES[name].special === 'scribble') startScribble();
        else { addShape(name, { x: 0, y: 0 }); W.audio.drop(); }
      }
      W.scd.listen(node, 'pointerdown', (e) => {
        e.preventDefault(); dragging = true; node.classList.add('grab');
        moved = false; sx = e.clientX; sy = e.clientY;
        const k = W.scale || 1, rr = root.getBoundingClientRect(), r = node.getBoundingClientRect();
        ghost = el('div', { style: { position: 'absolute', zIndex: '40', pointerEvents: 'none', opacity: '.85',
          left: ((r.left - rr.left) / k) + 'px', top: ((r.top - rr.top) / k) + 'px' } }, shapeThumb(name, 46));
        root.appendChild(ghost);
      });
      W.scd.listen(window, 'pointermove', (e) => {
        if (!dragging || !ghost) return;
        if (Math.abs(e.clientX - sx) > 7 || Math.abs(e.clientY - sy) > 7) moved = true;
        const k = W.scale || 1, rr = root.getBoundingClientRect();
        ghost.style.left = ((e.clientX - rr.left) / k - 23) + 'px';
        ghost.style.top = ((e.clientY - rr.top) / k - 23) + 'px';
      });
      W.scd.listen(window, 'pointerup', (e) => {
        if (!dragging) return;
        dragging = false; node.classList.remove('grab');
        if (ghost) { ghost.remove(); ghost = null; }
        const r = canvas.getBoundingClientRect();
        const onCanvas = e.clientX >= r.left && e.clientX <= r.right &&
                         e.clientY >= r.top  && e.clientY <= r.bottom;
        if (onCanvas) placeAtPointer(name, e);
        else if (!moved) drop(name);        /* a tap on the tile */
        else W.audio.no();                 /* dragged, but released nowhere useful */
      });
      W.scd.listen(node, 'keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault(); drop(name);
      });
    }

    /* لقطة SVG للمشهد — تُدرج في المستند */
    function snapshotSVG(w, h) {
      const s = W.util.svg('svg', { viewBox: '0 0 ' + w + ' ' + h, width: w, height: h });
      const add = (t, a) => { const n = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) n.setAttribute(k, a[k]); s.appendChild(n); return n; };
      add('rect', { x: 0, y: 0, width: w, height: h, fill: '#EEF3F7' });
      const saveW = cw, saveH = ch;
      cw = w; ch = h; BASIS = camBasis();
      const faces = [];
      allFaces().forEach(f => {
        const pr = f.p.map(project);
        if (pr.some(p => !p)) return;
        const n = norm(cross(sub(f.p[1], f.p[0]), sub(f.p[2], f.p[0])));
        faces.push({ pr, n, depth: pr.reduce((a, p) => a + p.z, 0) / pr.length, c: f.c });
      });
      faces.sort((a, b) => b.depth - a.depth);
      faces.forEach(f => {
        const k = 0.52 + 0.48 * Math.abs(dot(f.n, LIGHT));
        add('polygon', { points: f.pr.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' '),
          fill: shade(f.c, k), stroke: 'rgba(0,0,0,.16)', 'stroke-width': .7 });
      });
      cw = saveW; ch = saveH; BASIS = camBasis();
      return s;
    }

      ruler: () => st.ruler, notes: () => st.notes.slice(),

    };

    /* ---------------- non-enumerable diagnostic probe ----------------
     * `__handlesScreen` returns the CLIENT coordinates of the handles that are
     * currently drawn on the canvas. It exists so an automated test can aim a
     * GENUINE pointer drag at the real handle instead of guessing pixels; the
     * drag it enables goes through exactly the same pointerdown/move/up path a
     * pupil's mouse uses. It is:
     *   · read-only — it never writes to `st` and never calls draw();
     *   · DOM-free  — it creates no element, so it can cover nothing;
     *   · invisible — it is non-enumerable, so it is not part of the public API
     *     surface and no pupil-facing control or lesson ever calls it.
     * It is kept rather than deleted because it is the only way to prove, from
     * outside, that the Height / Raise / Scale / Rotate handles are four
     * genuinely separate targets — the defect this rebuild had to fix. */
    Object.defineProperty(api, '__handlesScreen', {
      enumerable: false, configurable: false, writable: false,
      value: () => {
        const r = canvas.getBoundingClientRect();
        const sx = r.width / cw, sy = r.height / ch;
        return handles.map(h => ({ kind: h.kind, i: h.i,
          x: r.left + h.x * sx, y: r.top + h.y * sy }));
      }
    });
    return api;
  }

/* ==== engine/t3dlesson.js — مضيف دروس الوحدة الثانية ====
 * يعيد استخدام مشغّل الخطوات الموجّهة نفسه المستخدَم في Scratch، فالمنطق التربوي
 * واحد في الوحدتين: لا انتقال إلا بتحقق قائم على حالة التطبيق.
 */
(function (W) {
  const { el } = W.util;

  function work(api, opts) {
    opts = opts || {};
    const w = el('div', { class: 's2-work' + (opts.full ? ' full' : '') });
    api.host.appendChild(w); W.scd.node(w);
    return w;
  }

  /* مشغّل الخطوات الموجّهة — نفس عقد scratchlesson.guided */
  function guided(api, sim, steps, opts) {
    return W.scratchlesson.guided(api, sim, steps, opts);
  }
  function challenge(api, sim, spec) {
    const checks = spec.checks;
    const model = checks.map(c => ({ label: c.label, done: false }));
    let solved = false;
    function sync() {
      checks.forEach((c, k) => { try { model[k].done = !!c.test(sim); } catch (e) { model[k].done = false; } });
      api.panel.setChecks(model, model.findIndex(m => !m.done));
      if (!solved && model.every(m => m.done)) {
        solved = true;
        checks.forEach((c, k) => W.s2store.stepDone(api.lesson.id, 'c' + k));
        W.scd.after(() => api.pass(spec.passMsg || 'نجحت! التصميم مطابق للمواصفات المطلوبة.'), 300);
      }
    }
    api.panel.setInstr(spec.instr, spec.instrEn);
    api.panel.setActions([
      { label: 'تلميح', onClick: () => api.hint(spec.hint || 'راجع قائمة الشروط: كل شرط بلا علامة ✓ لم يتحقق بعد.') },
      { label: 'تحقّق الآن', primary: true, onClick: () => { W.audio.click(); sync(); } },
    ]);
    sync();
    return {
      sync,
      why() {
        const miss = model.map((m, k) => m.done ? null : checks[k].label).filter(Boolean);
        return miss.length ? 'لم يتحقق بعد: ' + miss.join(' · ') : 'كل الشروط متحققة.';
      },
      reveal() { api.hint(spec.reveal || 'راجع شروط المهمة واحدًا واحدًا في اللوحة.'); },
    };
  }

  W.t3dlesson = { work, guided, challenge };
})(window.MNARA);

 * s2hub     : واحة الفصل الثاني (ورشة اللبنات + مرسم المجسّمات)
 * s2u1/s2u2 : معرض دروس كل وحدة (يعيد استخدام unitgallery المعتمد)
 * s2lesson  : موجّه الدروس
 * تُحافظ على الهوية البصرية للفصل الأول: نفس الرموز والمواد والإضاءة.
 */
(function (W) {
  const { el } = W.util;
  const C = () => W.citadel;
  const A = () => W.s2art;

  /* مشهد اختيار الفصل الدراسي غير موجود في هذه الحزمة:
   * هذه حزمة الفصل الدراسي الثاني وحده (Grade3-S2). */

  /* الاعتماد وحقوق النشر ستُضاف لاحقًا في الواجهة الرئيسية الجامعة لكل الصفوف،
   * ولا تظهر الآن في شاشات الدروس ولا الوحدات. */
  function credit() { return null; }

  /* -------------------------------------------------------- شاشة اختيار الوحدتين */
  const LOCS = [
    { unit: 1, kind: 'lab',  scene: 's2u1', ar: 'ورشة اللبنات المضيئة', en: 'The Luminous Blocks Workshop',
      u: 'الوحدة الأولى', name: 'هيا نبرمج', app: 'Scratch',
      items: ['الخوارزميات وترتيب الخطوات', 'الحركة والدوران والكلام', 'تصحيح الأخطاء والتكرارات', 'الرسم بلبنات القلم'] },
    { unit: 2, kind: 'hall', scene: 's2u2', ar: 'مرسم المجسّمات', en: 'The Solids Studio',
      u: 'الوحدة الثانية', name: 'هيا نصمم', app: 'Tinkercad',
      items: ['الأشكال وطرق عرضها', 'تحرير الكائنات ثلاثية الأبعاد', 'الرسم الحر وتحويله إلى مجسّم', 'التصدير والإدراج في مستند'] },
  ];

  W.scene.register('s2hub', {
    mount(ctx) {
      const rm = W.store.settings.reducedMotion;
      const world = el('div', { class: 'cit cit-arrive s2hub-flow' });
      const sky = el('div', { class: 'clayer cl-sky' }); sky.appendChild(C().backdrop(1280, 720)); world.appendChild(sky);
      world.appendChild(el('div', { class: 'catmo' }));
      if (!rm) world.appendChild(el('div', { class: 'cbeam', style: { width: '620px', height: '430px', left: '330px', bottom: '300px', opacity: '.55' } }));

      const citLayer = el('div', { class: 'clayer cl-cit' });
      const cit = el('div', { style: { position: 'absolute', left: '50%', top: '26px', width: '300px', height: '260px', transform: 'translateX(-50%)', opacity: '.42' } });
      cit.appendChild(C().citadel(300, 260)); citLayer.appendChild(cit); world.appendChild(citLayer);

      /* عنوان واحد واضح فوق لوح داكن — لا تراكب مع الخلفية */
      world.appendChild(el('div', { class: 's2-head' }, [
        el('div', { class: 'kicker', text: 'الصف الثالث · الفصل الدراسي الثاني' }),
        el('h1', { text: 'اختر وحدتك' }),
        el('div', { class: 'en', text: 'Choose your unit' }),
      ]));

      const cards = el('div', { class: 'unit-cards' });
      LOCS.forEach(d => {
        const ls = W.cur.lessonsOfUnit(d.unit);
        const done = ls.filter(l => W.s2store.isMastered(l.id)).length;
        const pct = Math.round(done / ls.length * 100);
        const art = el('div', { class: 'art' });
        art.appendChild(d.kind === 'lab' ? C().locLab(392, 132) : C().locHall(392, 132));
        const card = el('div', { class: 'unit-card u' + d.unit, tabindex: '0', role: 'button',
          'data-unit': String(d.unit), 'aria-label': d.u + ' — ' + d.name }, [
          el('div', { class: 'row1' }, [
            el('div', { class: 'badge', text: d.u }),
            el('div', { class: 'app', text: d.app }),
          ]),
          el('h2', { text: d.name }),
          el('div', { class: 'sub' }, [el('span', { text: d.ar }), el('span', { class: 'en', text: d.en })]),
          art,
          el('ul', {}, d.items.map(t => el('li', { text: t }))),
          /* شريط التقدّم البصري فقط — بلا أي عدد دروس مكتوب */
          el('div', { class: 'foot' }, [
            el('div', { class: 'prog', role: 'img', 'aria-label': 'شريط تقدّم الوحدة' },
              el('i', { style: { width: pct + '%' } })),
          ]),
          el('div', { class: 'go', text: 'ادخل ' + d.u }),
        ]);
        const enter = () => { W.audio.chime(); if (rm) return ctx.go(d.scene); world.classList.add('cit-enter'); W.scd.after(() => ctx.go(d.scene), 340); };
        card.onclick = enter;
        card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } };
        cards.appendChild(card);
      });
      world.appendChild(cards);

      world.appendChild(el('div', { class: 'cvig' }));
      /* تذييل مخصّص له مساحة فعلية داخل التخطيط أسفل البطاقات:
       * لا يعوم فوق أي زر أو بطاقة أو شريط تقدّم، ويبقى متمركزًا على كل المقاسات. */
      world.appendChild(el('footer', { class: 's2-author', id: 's2Author' },
        el('span', { text: 'إعداد وتنفيذ الأستاذة دعاء الجرواني' })));
      /* لا يوجد أي رابط أو ذكر للفصل الدراسي الأول في هذه الحزمة. */

      ctx.add(world);
      W.dock.mount(ctx, {});
    },
    unmount() {},
  });

  /* ------------------------------------------------------ معارض الوحدتين */
  function gallery(ctx, unit) {
    const w = W.cur.world(unit, true);
    const ls = W.cur.lessonsOfUnit(unit);
    const featured = {};
    ls.forEach(l => { featured[l.id] = true; });
    const entries = [
      { id: 's2-remember-' + unit, code: '↺', title: 'هل تذكر؟', titleEn: 'Do you remember?', kind: 'special', special: 'remember' },
      ...ls.map(l => ({ id: l.id, code: l.code, title: l.title, titleEn: l.titleEn, kind: 'lesson' })),
      ...(unit === 1 ? [{ id:'s2-freescratch', code:'∞', title:'استكشف Scratch', titleEn:'Explore Scratch', kind:'special', special:'freescratch', route:'s2freescratch' }] : []),
      ...(unit === 2 ? [{ id: 's2-free3d', code: '∞', title: 'استكشف Tinkercad', titleEn: 'Explore Tinkercad', kind: 'special', special: 'free3d', route: 's2free3d' }] : []),
      { id: 's2-status-' + unit, code: '✦', title: unit === 1 ? 'حالة الورشة' : 'حالة المرسم', titleEn: 'Self-check', kind: 'special', special: 'status' },
    ];
    featured['s2-remember-' + unit] = true; featured['s2-status-' + unit] = true;
    if (unit === 1) featured['s2-freescratch'] = true;
    if (unit === 2) featured['s2-free3d'] = true;

    W.unitgallery.build(ctx, {
      unit, kind: unit === 1 ? 'lab' : 'hall',
      titleAr: w.world,
      titleEn: w.worldEn + ' · ' + w.unitName + ' — ' + w.app,
      featured, entries,
      s2: true,
    });
    const root = ctx.root;
    /* شريط اعتماد واحد فقط: يُزال شريط الفصل الأول ويُستبدل بالشريط الصحيح (بالاسم الكامل وحقوق 2026) */
    root.querySelectorAll('.credit-band,.s2-credit').forEach(n => n.remove());
    const gal = root.querySelector('.gal') || root.firstElementChild;
    if (gal) gal.classList.add('s2-gal');
    root.classList.add('s2-gal-shift');
    /* إزاحة صريحة: الشارة أعلى الشاشة والعنوان تحتها مباشرة بلا تلامس */
    const ttl = root.querySelector('.chub-title');
    if (ttl) ttl.style.top = '46px';
    const row = root.querySelector('.station-row');
    if (row) row.style.top = '150px';
    root.appendChild(el('div', { class: 's2-tag', text: 'الفصل الدراسي الثاني — ' + w.unitName }));
    
  }

  W.scene.register('s2u1', { mount(ctx) { gallery(ctx, 1); }, unmount() {} });
  W.scene.register('s2u2', { mount(ctx) { gallery(ctx, 2); }, unmount() {} });

  /* ------------------------------ استكشف Scratch: مساحة برمجة حرة */
  W.scene.register('s2freescratch', {
    mount(ctx) {
      const page = el('div', { class:'s2-free-scratch-page' });
      const head = el('div', { class:'s2-free-scratch-head' });
      head.appendChild(el('div', { class:'s2-free-scratch-title' }, [
        el('span', { class:'badge', text:'∞' }),
        el('div', {}, [el('b', { text:'استكشف Scratch' }), el('small', { text:'Explore Scratch — ابنِ مشروعك بحرية واستخدم جميع الفئات واللبنات' })]),
      ]));
      const actions=el('div',{class:'s2-free-scratch-actions'});
      const back=el('button',{class:'s2-free-scratch-btn',text:'العودة إلى دروس الوحدة',onclick:()=>{W.audio.click();ctx.go('s2u1');}});
      const full=el('button',{class:'s2-free-scratch-btn',text:'ملء الشاشة',onclick:()=>{
        W.audio.click(); if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen();
      }});
      const clear=el('button',{class:'s2-free-scratch-btn danger',text:'مشروع جديد',onclick:()=>{sim&&sim.resetAll();W.audio.click();}});
      actions.appendChild(back);actions.appendChild(full);actions.appendChild(clear);head.appendChild(actions);
      const work=el('div',{class:'s2-free-scratch-work','data-testid':'free-scratch-workspace'});
      page.appendChild(head);page.appendChild(work);ctx.add(page);
      const sim=W.scratchsim.build(work,{penEnabled:true,sprites:['Cat'],backdrop:'Blank'});
      window.__FREE_SCRATCH_SIM=sim;
      W.scd.listen(document,'fullscreenchange',()=>{full.textContent=document.fullscreenElement?'إنهاء ملء الشاشة':'ملء الشاشة';W.scd.after(()=>sim.resize(),80);});
      W.scd.listen(window,'resize',()=>sim.resize());W.scd.after(()=>sim.resize(),80);
    },
    unmount(){try{delete window.__FREE_SCRATCH_SIM;}catch(e){}}
  });

  /* ------------------------------ خارج الدرس: مرسم تنكركاد الحر */
  W.scene.register('s2free3d', {
    mount(ctx) {
      const page = el('div', { class: 's2-free3d-page' });
      const head = el('div', { class: 's2-free3d-head' }, [
        el('div', { class: 's2-free3d-title' }, [
          el('span', { class: 'badge', text: '∞' }),
          el('b', { text: 'استكشف Tinkercad' }),
          el('small', { text: 'Explore Tinkercad — جرّب وصمّم بحرية كما تشاء' }),
        ]),
      ]);
      const back = el('button', { class: 's2-free3d-btn', text: 'العودة إلى دروس الوحدة', onclick: () => { W.audio.click(); ctx.go('s2u2'); } });
      const full = el('button', { class: 's2-free3d-btn', text: 'ملء الشاشة', onclick: () => {
        W.audio.click();
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      } });
      const clear = el('button', { class: 's2-free3d-btn danger', text: 'مسح مساحة العمل', onclick: () => {
        const st = sim && sim.state();
        if (!st) return;
        st.objects.length = 0; st.selected.length = 0; st.nextId = 1; st.clipboard = null;
        sim.draw(); W.audio.click();
      } });
      head.appendChild(el('div', { class: 's2-free3d-actions' }, [back, full, clear]));
      const work = el('div', { class: 's2-free3d-work work', 'data-testid': 'free-tinkercad-workspace' });
      page.appendChild(head); page.appendChild(work); ctx.add(page);
      const sim = W.t3dsim.build(work, { startAt: 'editor', className: 'مرسم الصف الثالث الحر' });
      window.__FREE_T3D_SIM = sim;
      W.scd.listen(document, 'fullscreenchange', () => { full.textContent = document.fullscreenElement ? 'إنهاء ملء الشاشة' : 'ملء الشاشة'; W.scd.after(() => sim.resize(), 80); });
      W.scd.after(() => sim.resize(), 80);
    },
    unmount() { try { delete window.__FREE_T3D_SIM; } catch (e) {} },
  });

  /* ------------------------------------------------------- موجّه الدروس */
  W.scene.register('s2lesson', {
    mount(ctx) {
      const id = ctx.params && ctx.params.id;
      const def = id && W.s2lessons.def(id);
      if (!def) {
        const l = W.cur.lesson(id);
        return ctx.go(l ? ('s2u' + l.unit) : 's2hub');
      }
      def.mount(ctx);
    },
    unmount() {
      const a = W.activeLesson;
      if (a && a.s2 && a.cleanup) { try { a.cleanup(); } catch (e) {} }
      W.activeLesson = null;
    },
  });

  /* --------------------------------- «هل تذكر؟» و«حالة الوحدة» لكل وحدة */
  /* الشريط العلوي للصفحات الخاصة يستخدم البنية نفسها المستخدمة في إطار الدرس:
   * ثلاث خانات مستقلة داخل التدفّق (رجوع/منارة · العنوان · معلّم/إعدادات)،
   * فلا يقع أي زر مطلق التموضع فوق العنوان ولا يُقصّ العنوان. */
  function specialHost(ctx, unit, titleAr, titleEn) {
    const wrap = el('div', { class: 's2-frame' });
    const slotR = el('div', { class: 's2-slot r', id: 's2SlotR' });
    const slotL = el('div', { class: 's2-slot l', id: 's2SlotL' });
    const spacer = el('div', { class: 's2-railfill' });
    const titleWrap = el('div', { class: 's2-titlewrap', id: 's2Title' }, [
      el('div', { class: 's2-code', text: '↺' }),
      el('div', { class: 's2-ttl' }, [el('b', { text: titleAr }), el('small', { text: titleEn })]),
    ]);
    wrap.appendChild(el('div', { class: 's2-top' }, [slotR, titleWrap, spacer, slotL]));
    const body = el('div', { class: 's2-body nopanel' });
    wrap.appendChild(body);
    ctx.add(wrap);
    W.dock.mount(ctx, { home: true, back: 's2u' + unit });
    const dl = ctx.root.querySelector('.dock:not(.right)');
    const dr = ctx.root.querySelector('.dock.right');
    if (dl) slotL.appendChild(dl);
    if (dr) slotR.appendChild(dr);
    W.scd.after(() => {
      [slotL, slotR].forEach(sl => {
        const w = Math.ceil(sl.getBoundingClientRect().width / (W.scale || 1));
        if (w > 0) sl.style.flex = '0 0 ' + w + 'px';
      });
    }, 40);
    return body;
  }

  W.scene.register('s2remember', {
    mount(ctx) {
      const unit = (ctx.params && ctx.params.unit) || 1;
      const data = W.curriculumS2.remember.find(r => r.unit === unit);
      const body = specialHost(ctx, unit, data.title, 'Do you remember?');
      ctx.root.querySelectorAll('.credit-band,.s2-credit').forEach(n => n.remove());
      const art = unit === 1 ? W.s2art.paletteLegend() : W.s2art.workplaneArt();
      const t = el('div', { class: 's2-theory' }, [
        W.s2lesson.hero(el('div', { style: { width: '250px', height: '190px' } }, art), data.title,
          unit === 1 ? 'قبل أن نبدأ البرمجة، لنتذكّر معًا أجزاء بيئة Scratch وكيف نشغّل مقطعًا برمجيًا.'
            : 'قبل أن نصمّم، لنتذكّر معًا كيف نفتح تنكركاد وننشئ تصميمًا ثلاثي الأبعاد.'),
        el('div', { class: 's2-note', html: '<b>راجع هذه المهارات قبل الدروس:</b>' }),
        W.s2lesson.stepList(data.items),
      ]);
      body.appendChild(t);
      
    },
    unmount() {},
  });

  W.scene.register('s2status', {
    mount(ctx) {
      const unit = (ctx.params && ctx.params.unit) || 1;
      const data = W.curriculumS2.status.find(r => r.unit === unit);
      const body = specialHost(ctx, unit, data.title, 'Self-check');
      /* قائمة مدمجة: ارتفاع كل بند حسب محتواه، والنص يلتف تحت النص لا تحت المربع */
      const list = el('div', { class: 's2-selfcheck' });
      data.items.forEach(s => {
        list.appendChild(el('div', { class: 'item', tabindex: '0', role: 'checkbox', 'aria-checked': 'false' }, [
          el('span', { class: 'box', 'aria-hidden': 'true', text: '' }),
          el('span', { class: 'tx', text: s }),
        ]));
      });
      list.querySelectorAll('.item').forEach(it => {
        const flip = () => {
          const on = it.classList.toggle('on');
          it.setAttribute('aria-checked', on ? 'true' : 'false');
          W.audio.click();
        };
        it.onclick = flip;
        it.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
      });
      body.appendChild(el('div', { class: 's2-theory s2-selfwrap' }, [
        el('div', { class: 's2-note', text: 'اقرأ القائمة وضع علامة على ما تتقنه، وارجع إلى الدرس المناسب لما لم تتقنه بعد.' }),
        list,
      ]));
      
    },
    unmount() {},
  });
})(window.MNARA);

/* ==== lessons/s2/registry.js ==== */
/* ==== lessons/s2/registry.js — سجل دروس الفصل الدراسي الثاني ==== */
(function (W) {
  const defs = {};
  W.s2lessons = {
    register(id, def) { defs[id] = def; },
    has(id) { return !!defs[id]; },
    def(id) { return defs[id]; },
    get ids() { return W.curriculumS2.lessons.map(l => l.id); },
    get builtIds() { return Object.keys(defs); },
    get builtCount() { return Object.keys(defs).length; },
    /* كل درس يُبنى بنفس القالب: مراحل + مضيف + وضع معلّم */
    make(id, phasesFactory, opts) {
      opts = opts || {};
      W.s2lessons.register(id, {
        mount(ctx) {
          const lesson = W.cur.lesson(id);
          const f = W.s2lesson.frame(ctx, lesson, (opts.phaseKeys || ['explore', 'watch', 'doWithMe', 'tryIt', 'review']), 's2u' + lesson.unit);
          W.s2lesson.run(ctx, {
            lesson, host: f.body,
            phases: phasesFactory(lesson),
            done: opts.done,
          });
        },
      });
    },
  };
})(window.MNARA);

/* ==== lessons/s2/l1-1.js ==== */
/* ==== lessons/s2/l1-1.js — 1.1 التعامل مع الخوارزميات ====
 * إعادة تصميم (نهائي): كل نشاط يظهر كاملًا داخل الشاشة، والشبكة مصغّرة
 * بجانب الأوامر لا تحتها، ولوحة التعليمات لا تغطي أي جزء من النشاط.
 * مثال الحقيبة موحّد: افتح الحقيبة ← ضع الكتاب ← أغلق الحقيبة (العنصر «كتاب» في كل الخطوات).
 */
(function (W) {
  const { el } = W.util;
  const NS = 'http://www.w3.org/2000/svg';
  const L = () => W.s2lesson;

  /* ------------------------------------------------ رموز صغيرة واضحة */
  function svgBox(w, h) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    s.setAttribute('width', w); s.setAttribute('height', h);
    s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    s.setAttribute('style', 'max-width:100%;max-height:100%;height:auto;display:block');
    return s;
  }
  const N = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]); return n; };

  /* حقيبة مفتوحة / مغلقة — رمز واحد ثابت في كل الخطوات */
  function bagIcon(open) {
    const s = svgBox(30, 30);
    s.appendChild(N('path', { d: 'M6,12 h18 a2,2 0 0 1 2,2 v10 a2,2 0 0 1 -2,2 h-18 a2,2 0 0 1 -2,-2 v-10 a2,2 0 0 1 2,-2 z', fill: '#C58A4A', stroke: '#7A4A18', 'stroke-width': 1.6 }));
    s.appendChild(N('path', { d: 'M11,12 v-3 a4,4 0 0 1 8,0 v3', fill: 'none', stroke: '#7A4A18', 'stroke-width': 1.8 }));
    if (open) s.appendChild(N('path', { d: 'M4,15 h22', stroke: '#F6E7CE', 'stroke-width': 3 }));
    else s.appendChild(N('rect', { x: 12, y: 17, width: 6, height: 5, rx: 1.4, fill: '#7A4A18' }));
    return s;
  }
  /* كتاب — العنصر المعتمد وحده، بلا هاتف ولا بديل */
  function bookIcon() {
    const s = svgBox(30, 30);
    s.appendChild(N('path', { d: 'M5,6 h9 a3,3 0 0 1 3,3 v16 a3,3 0 0 0 -3,-2 h-9 z', fill: '#4C97FF', stroke: '#25538F', 'stroke-width': 1.4 }));
    s.appendChild(N('path', { d: 'M25,6 h-9 a3,3 0 0 0 -3,3 v16 a3,3 0 0 1 3,-2 h9 z', fill: '#8FC0FF', stroke: '#25538F', 'stroke-width': 1.4 }));
    s.appendChild(N('path', { d: 'M15,9 v14', stroke: '#25538F', 'stroke-width': 1.4 }));
    return s;
  }

  /* ------------------------------------- بطاقات ترتيب الحقيبة (شاهد) */
  const BAG_STEPS = [
    { n: '١', tx: 'افتح الحقيبة', ic: function () { return bagIcon(true); } },
    { n: '٢', tx: 'ضع الكتاب داخل الحقيبة', ic: bookIcon },
    { n: '٣', tx: 'أغلق الحقيبة', ic: function () { return bagIcon(false); } },
  ];
  function bagSequenceFigure(good) {
    const order = good ? [0, 1, 2] : [2, 0, 1];
    const wrap = el('div', { class: 'bag-seq' + (good ? '' : ' bad') });
    order.forEach((idx, k) => {
      const s = BAG_STEPS[idx];
      wrap.appendChild(el('div', { class: 'bag-card' }, [
        el('div', { class: 'no', text: s.n }),
        el('div', { class: 'tx', text: s.tx }),
        el('div', { class: 'ic' }, s.ic()),
      ]));
      if (k < order.length - 1) wrap.appendChild(el('div', { class: 'bag-arrow', text: '↓' }));
    });
    wrap.appendChild(el('div', { class: 'bag-verdict' }, [
      el('div', { class: 'mk', text: good ? '✓' : '✕' }),
      el('span', { text: good ? 'النتيجة صحيحة' : 'النتيجة خاطئة' }),
    ]));
    return wrap;
  }

  /* ------------------------------------ أزرار الأوامر: الأيقونة عنصر مستقل
   * الرمز داخل span معزول باتجاه ltr حتى لا يقلبه محرك RTL،
   * والنص العربي في span مستقل — فلا يتشوّه ترتيبهما على أي مقاس. */
  const CMDS = [
    { op: 'forward', ic: '→', ar: 'تقدَّم' },
    { op: 'right',   ic: '↻', ar: 'استدر يمينًا' },
    { op: 'left',    ic: '↺', ar: 'استدر يسارًا' },
  ].map(c => [c.ar, c.op, c.ic]);

  function cmdButton(pair, onClick, attr, prefix) {
    const b = el('button', { class: 's2-btn cmd', type: 'button' });
    b.setAttribute('data-' + (attr || 'cmd'), pair[1]);
    b.setAttribute('aria-label', (prefix || '') + pair[0]);
    b.appendChild(el('span', { class: 'cmd-icon', dir: 'ltr', 'aria-hidden': 'true', text: pair[2] }));
    b.appendChild(el('span', { class: 'cmd-label', text: (prefix || '') + pair[0] }));
    b.onclick = onClick;
    return b;
  }

  /* ---------------------------------------------- شبكة الروبوت المدمجة */
  function robotBoard(host, opts) {
    opts = opts || {};
    const COLS = 5, ROWS = 4, CELL = opts.cell || 62;
    const st = { c: 0, r: 3, dir: 0, goal: { c: 4, r: 0 }, running: false, reached: false };
    const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    const board = el('div', { class: 'rb-board', 'data-testid': 'robot-board',
      style: { width: (COLS * CELL) + 'px', height: (ROWS * CELL) + 'px' } });
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      board.appendChild(el('div', { style: { position: 'absolute', left: (c * CELL) + 'px', top: (r * CELL) + 'px',
        width: CELL + 'px', height: CELL + 'px', background: (r + c) % 2 ? '#EFE6D4' : '#F7F1E4',
        boxSizing: 'border-box', border: '1px solid #D8C29B' } }));
    }
    const goal = el('div', { style: { position: 'absolute', left: (st.goal.c * CELL + 11) + 'px', top: (st.goal.r * CELL + 11) + 'px',
      width: (CELL - 22) + 'px', height: (CELL - 22) + 'px', borderRadius: '50%', background: '#4FA772',
      display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: '19px' }, text: '★' });
    board.appendChild(goal);
    const bot = el('div', { 'data-testid': 'robot', style: { position: 'absolute', width: (CELL - 12) + 'px', height: (CELL - 12) + 'px', borderRadius: '10px',
      background: 'linear-gradient(165deg,#6FB0FF,#3373CC)', border: '2px solid #2A6BC4', transition: 'left .28s, top .28s, transform .28s',
      display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '17px', color: '#fff', zIndex: '3' }, text: '➤' });
    board.appendChild(bot);
    host.appendChild(board);

    function place() {
      bot.style.left = (st.c * CELL + 6) + 'px';
      bot.style.top = (st.r * CELL + 6) + 'px';
      bot.style.transform = 'rotate(' + (st.dir * 90) + 'deg)';
      const atGoal = st.c === st.goal.c && st.r === st.goal.r;
      goal.style.background = atGoal ? '#2E8C4E' : '#4FA772';
      goal.textContent = atGoal ? '✓' : '★';
    }
    place();

    let cancelled = false;
    W.scd.onClear(() => { cancelled = true; st.running = false; });

    async function step(op) {
      if (cancelled) return false;
      if (op === 'forward') {
        const d = DIRS[st.dir];
        const nc = st.c + d[0], nr = st.r + d[1];
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) {
          W.audio.no();
          bot.style.boxShadow = '0 0 0 4px rgba(215,119,89,.75)';
          if (await W.scd.sleep(260)) { cancelled = true; return false; }
          bot.style.boxShadow = 'none';
          return false;
        }
        st.c = nc; st.r = nr; place(); W.audio.drop();
      } else if (op === 'right') { st.dir = (st.dir + 1) % 4; place(); W.audio.click(); }
      else if (op === 'left') { st.dir = (st.dir + 3) % 4; place(); W.audio.click(); }
      else if (op === 'stop') { W.audio.chime(); }
      if (await W.scd.sleep(340)) { cancelled = true; return false; }
      return true;
    }
    return {
      board: board, state: st,
      reset() { st.c = 0; st.r = 3; st.dir = 0; st.reached = false; place(); },
      /* يعيد null إذا أُلغي التشغيل بسبب الانتقال إلى مرحلة أخرى */
      async run(ops) {
        if (st.running || cancelled) return null;
        st.running = true; this.reset();
        for (const o of ops) { await step(o); if (cancelled) break; }
        st.running = false;
        if (cancelled) return null;
        st.reached = (st.c === st.goal.c && st.r === st.goal.r);
        opts.onDone && opts.onDone(st.reached);
        return st.reached;
      },
      get cancelled() { return cancelled; },
      reached() { return st.reached; },
    };
  }

  /* غلاف موحّد: الشبكة والأوامر جنبًا إلى جنب — كلاهما ظاهر معًا */
  function boardRow(wrap, opts) {
    const row = el('div', { class: 'rb-wrap' });
    const boardCell = el('div', { style: { flex: '0 0 auto' } });
    const side = el('div', { class: 'rb-side' });
    row.appendChild(boardCell); row.appendChild(side);
    wrap.appendChild(row);
    const rb = robotBoard(boardCell, opts || {});
    return { rb: rb, side: side, row: row };
  }

  function readOnlyScript(host, blocks) {
    const box = el('div', { style: { display: 'inline-block', padding: '12px', borderRadius: '12px',
      background: '#F9F9F9', border: '1.5px solid #D9D9D9', margin: '4px' } });
    const stack = el('div', { class: 'sc-stack', style: { position: 'relative' } });
    // نعيد استخدام رسم اللبنة نفسه من المحاكي عبر بناء محاكي مخفي مؤقت
    blocks.forEach(b => stack.appendChild(simpleBlock(b)));
    box.appendChild(stack); host.appendChild(box);
    return box;
  }
  function simpleBlock(b) {
    const OPS = W.scratchsim.OPS, d = OPS[b.op];
    const n = el('div', { class: 'sc-blk ' + d.cat, 'data-hat': d.shape === 'hat' ? '1' : null,
      style: { cursor: 'default' } });
    d.text.forEach(part => {
      if (typeof part === 'string') { n.appendChild(document.createTextNode(part)); return; }
      if (part.flag) { n.appendChild(document.createTextNode('⚑')); return; }
      if (part.icon === 'cw') { n.appendChild(document.createTextNode('↻')); return; }
      if (part.icon === 'ccw') { n.appendChild(document.createTextNode('↺')); return; }
      if (part.icon === 'pen') { n.appendChild(document.createTextNode('🖊')); return; }
      if (part.arg) n.appendChild(el('span', { class: 'sc-in', style: { display: 'inline-flex', alignItems: 'center',
        justifyContent: 'center', minWidth: '38px', height: '22px' }, text: String(b.args[part.arg]) }));
    });
    if (d.shape === 'c') {
      const wrap = el('div', { class: 'sc-c' });
      wrap.appendChild(el('div', { class: 'sc-chead' }, [document.createTextNode('كرر '),
        el('span', { class: 'sc-in', style: { minWidth: '34px', height: '22px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }, text: String(b.args.n) })]));
      const body = el('div', { class: 'sc-cbody' });
      (b.body || []).forEach(cb => body.appendChild(simpleBlock(cb)));
      wrap.appendChild(body); wrap.appendChild(el('div', { class: 'sc-cfoot' }));
      return wrap;
    }
    return n;
  }

  /* رسم توضيحي لشكل ناتج */
  function shapePreview(sides, color) {
    const S = W.s2art.svg, E = W.s2art.E;
    const kids = [];
    const cx = 90, cy = 82, r = 54;
    const pts = [];
    for (let i = 0; i < sides; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / sides;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    kids.push(E('polygon', { points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '),
      fill: 'none', stroke: color || '#0FBD8C', 'stroke-width': 6, 'stroke-linejoin': 'round' }));
    return S(180, 164, kids);
  }
