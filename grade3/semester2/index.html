        case 'lengthlist': return (st.lists[a.l]||[]).length;
        case 'listcontains': return (st.lists[a.l]||[]).map(String).includes(String(a.x));
        case 'opadd': return n('a')+n('b'); case 'opsub': return n('a')-n('b'); case 'opmul': return n('a')*n('b'); case 'opdiv': return n('b')?n('a')/n('b'):0;
        case 'opgt': return a.a>a.b; case 'oplt': return a.a<a.b; case 'opeq': return String(a.a)===String(a.b);
        case 'opand': return !!a.a&&!!a.b; case 'opor': return !!a.a||!!a.b; case 'opnot': return !a.a;
        case 'opjoin': return String(a.a)+String(a.b); case 'letterof': return String(a.t).charAt(Math.max(0,n('n')-1));
        case 'oplength': return String(a.t).length; case 'opcontains': return String(a.t).includes(String(a.s));
        case 'opmod': return n('b')?n('a')%n('b'):0; case 'opround': return Math.round(n('n'));
        case 'opmath': {const x=n('n'); const f=a.f; const rad=x*Math.PI/180; if(f==='abs')return Math.abs(x);if(f==='floor')return Math.floor(x);if(f==='ceiling')return Math.ceil(x);if(f==='sqrt')return Math.sqrt(Math.max(0,x));if(f==='sin')return Math.sin(rad).toFixed(3);if(f==='cos')return Math.cos(rad).toFixed(3);if(f==='tan')return Math.tan(rad).toFixed(3);if(f==='ln')return Math.log(Math.max(.0001,x)).toFixed(3);if(f==='log')return Math.log10(Math.max(.0001,x)).toFixed(3);if(f==='e ^')return Math.exp(x).toFixed(3);if(f==='10 ^')return Math.pow(10,x);return x;}
        case 'costumeprop': return a.p==='name'?(s0.costumes[s0.costume]||'costume1'):(s0.costume+1);
        case 'backdropprop': return a.p==='name'?st.backdrop:(Math.max(0,st.backdrops.indexOf(st.backdrop))+1);
        case 'ofproperty': {const q=st.sprites.find(x=>x.name===a.o)||s0;return ({'x position':Math.round(q.x),'y position':Math.round(q.y),direction:Math.round(q.dir),'costume #':(q.costume||0)+1,'costume name':(q.costumes||[])[q.costume||0]||'',size:Math.round(q.size),volume:Math.round(q.volume||100)})[a.p];}
        case 'current': {const d=new Date(); return ({year:d.getFullYear(),month:d.getMonth()+1,date:d.getDate(),'day of week':d.getDay()+1,hour:d.getHours(),minute:d.getMinutes(),second:d.getSeconds()})[a.u];}

    function showReporterValue(b, anchor){

    function fillText(node, b, d, isPalette) {
      d.text.forEach(part => {
        if (typeof part === 'string') { node.appendChild(document.createTextNode(part)); return; }
        if (part.flag) { node.appendChild(flagIcon()); return; }
        if (part.icon === 'cw') { node.appendChild(turnIcon(true)); return; }
        if (part.icon === 'ccw') { node.appendChild(turnIcon(false)); return; }
        if (part.icon === 'pen') { node.appendChild(penIcon()); return; }

            node.appendChild(sw);
          } else {
            const inp = el('input', { class: 'sc-in' + (spec.type === 'txt' ? ' txt' : ''), 'data-arg': part.arg,

            else {

                b.args[part.arg] = spec.type === 'num' ? (inp.value === '' || inp.value === '-' ? inp.value : (parseFloat(inp.value) || 0)) : inp.value;
                mark('edit:' + b.op);
                onChange('edit', { op: b.op, arg: part.arg, value: b.args[part.arg] });

    function openColorPicker(anchor, b, argKey) {

    function positionDrop(m, anchor) {

      let left = (ar.left - rr.left) / k, top = (ar.bottom - rr.top) / k + 4;

      left = Math.max(6, Math.min(left, root.clientWidth - w - 6));

    /* -------------------------------------------------- المقاطع البرمجية */
    function renderScripts() {

    /* ------- سحب لبنة جديدة من اللوح ------- */
    function makePaletteDraggable(node, op) {

        if (e.target.closest && e.target.closest('input,select,.sc-swatch')) return;
        e.preventDefault(); dragging = true;
        const k = W.scale || 1, r = node.getBoundingClientRect(), rr = root.getBoundingClientRect();

          left: ((r.left - rr.left) / k) + 'px', top: ((r.top - rr.top) / k) + 'px', margin: '0' });

        const k = W.scale || 1, rr = root.getBoundingClientRect();

        clearSnapUI();

        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault(); appendToBest(op);
      });
    }

    function appendToBest(op) {
      // بديل لوحة المفاتيح: يُلحق باللبنة الأخيرة في آخر مقطع، أو ينشئ مقطعًا جديدًا
      const d = OPS[op];
      if (!st.scripts.length || d.shape === 'hat') {
        st.scripts.push({ x: 24 + st.scripts.length * 12, y: 20 + st.scripts.length * 12, blocks: [mkBlock(op)] });
      } else {
        st.scripts[st.scripts.length - 1].blocks.push(mkBlock(op));

      W.audio.drop(); mark('drop:' + op); renderScripts(); onChange('drop', { op });

    /* حساب نقاط الالتقام المتاحة */
    function snapPoints() {
      const pts = [];
      const rr = root.getBoundingClientRect(), k = W.scale || 1;
      st.scripts.forEach((s, si) => {
        const stack = scripts.querySelector(`[data-stack="${si}"]`);
        if (!stack) return;
        // نهاية كل لبنة في المستوى الأعلى
        s.blocks.forEach((b, bi) => {
          const node = stack.querySelector(`[data-uid="${b.uid}"]`);
          if (!node) return;
          const r = node.getBoundingClientRect();
          pts.push({ kind: 'after', si, bi, x: r.left, y: r.bottom, w: r.width,
            sx: (r.left - rr.left) / k, sy: (r.bottom - rr.top) / k, sw: r.width / k });
          if (b.body) {
            const body = stack.querySelector(`[data-body="${b.uid}"]`);
            if (body) {
              const br = body.getBoundingClientRect();
              pts.push({ kind: 'into', si, bi, x: br.left, y: br.top + 6, w: Math.max(70, br.width),
                sx: (br.left - rr.left) / k, sy: (br.top - rr.top) / k + 4, sw: Math.max(70, br.width / k) });
              b.body.forEach((cb, ci) => {
                const cn = stack.querySelector(`[data-uid="${cb.uid}"]`);
                if (!cn) return;
                const cr = cn.getBoundingClientRect();
                pts.push({ kind: 'inafter', si, bi, ci, x: cr.left, y: cr.bottom, w: cr.width,
                  sx: (cr.left - rr.left) / k, sy: (cr.bottom - rr.top) / k, sw: cr.width / k });
              });
            }
          }
          if (b.elseBody) {
            const body = stack.querySelector(`[data-else-body="${b.uid}"]`);
            if (body) {
              const br = body.getBoundingClientRect();
              pts.push({ kind: 'elseinto', si, bi, x: br.left, y: br.top + 6, w: Math.max(70, br.width),
                sx: (br.left - rr.left) / k, sy: (br.top - rr.top) / k + 4, sw: Math.max(70, br.width / k) });
              b.elseBody.forEach((cb, ci) => {
                const cn = stack.querySelector(`[data-uid="${cb.uid}"]`);
                if (!cn) return;
                const cr = cn.getBoundingClientRect();
                pts.push({ kind: 'elseafter', si, bi, ci, x: cr.left, y: cr.bottom, w: cr.width,
                  sx: (cr.left - rr.left) / k, sy: (cr.bottom - rr.top) / k, sw: cr.width / k });

            }
          }
        });
      });

    }
    let snapUI = null;
    function clearSnapUI() { if (snapUI) { snapUI.remove(); snapUI = null; } }
    function bestSnap(cx, cy, op) {
      if (['hat','reporter','boolean'].includes(OPS[op].shape)) return null;   // القبعة والمراسل والمنطق لا تلتقم كسلسلة
      let best = null, bd = 74;
      snapPoints().forEach(p => {
        const d = Math.hypot(cx - (p.x + Math.min(p.w, 120) / 2), cy - p.y);
        if (d < bd) { bd = d; best = p; }
      });
      return best;
    }
    function showSnap(cx, cy, op) {
      const p = bestSnap(cx, cy, op);
      clearSnapUI();
      if (!p) return;
      snapUI = el('div', { class: 'sc-snap', style: { left: p.sx + 'px', top: (p.sy - 3) + 'px', width: Math.min(p.sw, 150) + 'px' } });
      root.appendChild(snapUI); W.scd.node(snapUI);
    }

    function dropNewBlock(op, cx, cy) {

      const p = bestSnap(cx, cy, op);
      if (p) {
        if (p.kind === 'after') st.scripts[p.si].blocks.splice(p.bi + 1, 0, nb);
        else if (p.kind === 'into') st.scripts[p.si].blocks[p.bi].body.unshift(nb);
        else if (p.kind === 'elseinto') st.scripts[p.si].blocks[p.bi].elseBody.unshift(nb);
        else if (p.kind === 'elseafter') st.scripts[p.si].blocks[p.bi].elseBody.splice(p.ci + 1, 0, nb);
        else st.scripts[p.si].blocks[p.bi].body.splice(p.ci + 1, 0, nb);
      } else {
        const mr = mid.getBoundingClientRect(), k = W.scale || 1;
        st.scripts.push({ x: Math.max(8, (cx - mr.left) / k + mid.scrollLeft - 30), y: Math.max(8, (cy - mr.top) / k + mid.scrollTop - 14), blocks: [nb] });
      }
      W.audio.drop(); mark('drop:' + op); renderScripts();
      onChange('drop', { op });
    }

    /* ------- سحب مقطع موجود / لبنة موجودة ------- */
    function makeStackDraggable(stack, si) {
      W.scd.listen(stack, 'pointerdown', (e) => {
        if (e.target.closest && e.target.closest('input,select,.sc-swatch')) return;
        const blkNode = e.target.closest && e.target.closest('.sc-blk,.sc-chead');
        if (!blkNode) return;
        e.preventDefault();
        const holder = blkNode.classList.contains('sc-chead') ? blkNode.parentNode : blkNode;
        const uidv = holder.dataset.uid;
        const s = st.scripts[si];
        const topIdx = s.blocks.findIndex(b => b.uid === uidv);
        const k = W.scale || 1, rr = root.getBoundingClientRect();
        const r0 = stack.getBoundingClientRect();
        let detached = null, ghost = null;
        const startX = e.clientX, startY = e.clientY;
        let moved = false;

        function move(ev) {
          if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) return;
          if (!moved) {
            moved = true;
            if (topIdx === 0) {
              // سحب المقطع كاملًا
              detached = { whole: true };
              stack.style.opacity = '.35';
              ghost = stack.cloneNode(true);
            } else if (topIdx > 0) {
              detached = { whole: false, blocks: s.blocks.splice(topIdx) };
              renderScripts();
              ghost = el('div', { class: 'sc-stack' });
              detached.blocks.forEach(b => ghost.appendChild(renderBlockNode(b, true)));
            } else {
              // لبنة داخل جسم لبنة C
              let found = null;
              s.blocks.forEach((b, bi) => {
                if (!b.body) return;
                const ci = b.body.findIndex(x => x.uid === uidv);
                if (ci >= 0) found = { bi, ci };
              });
              if (!found) return;
              detached = { whole: false, blocks: s.blocks[found.bi].body.splice(found.ci) };
              renderScripts();
              ghost = el('div', { class: 'sc-stack' });
              detached.blocks.forEach(b => ghost.appendChild(renderBlockNode(b, true)));
            }
            Object.assign(ghost.style, { position: 'absolute', zIndex: '80', pointerEvents: 'none', opacity: '.94',
              left: ((r0.left - rr.left) / k) + 'px', top: ((r0.top - rr.top) / k) + 'px' });
            root.appendChild(ghost); W.audio.pick();
          }
          if (!ghost) return;
          ghost.style.left = ((r0.left - rr.left) / k + (ev.clientX - startX) / k) + 'px';
          ghost.style.top = ((r0.top - rr.top) / k + (ev.clientY - startY) / k) + 'px';
          const tr = trash.getBoundingClientRect();
          trash.classList.toggle('hot', ev.clientX >= tr.left && ev.clientX <= tr.right && ev.clientY >= tr.top && ev.clientY <= tr.bottom);
          if (detached && !detached.whole) showSnap(ev.clientX, ev.clientY, detached.blocks[0].op);
        }
        function up(ev) {
          offMove(); offUp(); offCancel();
          if (!moved) { runStack(si); return; }
          if (ghost) { ghost.remove(); ghost = null; }
          clearSnapUI();
          stack.style.opacity = '1';
          const tr = trash.getBoundingClientRect();
          const inTrash = ev.clientX >= tr.left && ev.clientX <= tr.right && ev.clientY >= tr.top && ev.clientY <= tr.bottom;
          trash.classList.remove('hot');
          const palRect = left.getBoundingClientRect();
          const inPalette = ev.clientX >= palRect.left && ev.clientX <= palRect.right && ev.clientY >= palRect.top && ev.clientY <= palRect.bottom;

          if (detached && detached.whole) {
            if (inTrash || inPalette) { st.scripts.splice(si, 1); W.audio.no(); mark('delete'); }
            else {
              const mr = mid.getBoundingClientRect();
              st.scripts[si].x = Math.max(4, (ev.clientX - mr.left) / k + mid.scrollLeft - (startX - r0.left) / k);
              st.scripts[si].y = Math.max(4, (ev.clientY - mr.top) / k + mid.scrollTop - (startY - r0.top) / k);
            }
            renderScripts(); onChange('move', {}); return;
          }
          if (!detached) return;
          if (inTrash || inPalette) { W.audio.no(); mark('delete'); cleanupEmpty(); renderScripts(); onChange('delete', {}); return; }
          const p = bestSnap(ev.clientX, ev.clientY, detached.blocks[0].op);
          if (p) {
            const tgt = st.scripts[p.si];
            if (p.kind === 'after') tgt.blocks.splice(p.bi + 1, 0, ...detached.blocks);
            else if (p.kind === 'into') tgt.blocks[p.bi].body.unshift(...detached.blocks);
            else if (p.kind === 'elseinto') tgt.blocks[p.bi].elseBody.unshift(...detached.blocks);
            else if (p.kind === 'elseafter') tgt.blocks[p.bi].elseBody.splice(p.ci + 1, 0, ...detached.blocks);
            else tgt.blocks[p.bi].body.splice(p.ci + 1, 0, ...detached.blocks);
            W.audio.drop(); mark('reorder');
          } else {
            const mr = mid.getBoundingClientRect();
            st.scripts.push({ x: Math.max(4, (ev.clientX - mr.left) / k + mid.scrollLeft - 30),
              y: Math.max(4, (ev.clientY - mr.top) / k + mid.scrollTop - 14), blocks: detached.blocks });
            W.audio.drop();
          }
          cleanupEmpty(); renderScripts(); onChange('reorder', {});
        }
        const offMove = W.scd.listen(window, 'pointermove', move);
        const offUp = W.scd.listen(window, 'pointerup', up);
        const offCancel = W.scd.listen(window, 'pointercancel', up);
      });
    }
    function cleanupEmpty() { st.scripts = st.scripts.filter(s => s.blocks.length); }

    /* -------------------------------------------------- المنصة والرسم */
    function stageXY(s) { return { px: 240 + s.x, py: 180 - s.y }; }

    function renderStage(keepProps) {
      // خلفية
      let bg = stageEl.querySelector('.sc-bd');
      if (bg) bg.remove();
      bg = el('div', { class: 'sc-bd', style: { position: 'absolute', inset: '0', zIndex: '1' } });
      bg.appendChild((BACKDROPS[st.backdrop] || BACKDROPS.Blank)());
      stageEl.insertBefore(bg, penCanvas);
      // الكائنات
      spriteLayer.innerHTML = '';
      st.sprites.forEach((s, i) => {
        if (!s.visible) return;
        const { px, py } = stageXY(s);
        const size = 62 * (s.size / 100);
        let rot = 0, flip = false;
        if (s.rotStyle === 'all') rot = s.dir - 90;
        else if (s.rotStyle === 'lr') flip = s.dir < 0;
        const ghost=Math.max(0,Math.min(100,(s.effects&&s.effects.ghost)||0));
        const bright=(s.effects&&s.effects.brightness)||0;
        const hue=((s.effects&&s.effects.color)||0)*1.8;
        const costumeShift=(s.costume||0)*18;   /* لمسة لونية خفيفة فوق اختلاف الوضعية */
        const holder = el('div', { class: 'sc-sprite', 'data-sprite': i, style: {
          left: (px - size / 2) + 'px', top: (py - size / 2) + 'px', width: size + 'px', height: size + 'px',
          transform: `rotate(${rot}deg)` + (flip ? ' scaleX(-1)' : ''),
          opacity:String(1-ghost/100), filter:`brightness(${Math.max(.15,1+bright/100)}) hue-rotate(${hue + costumeShift}deg)`,
          zIndex:String(5+(s.layer||0)),
        } });
        const art = costumeArt(s.name, s.costume, size);
        art.setAttribute('width', size); art.setAttribute('height', size);
        holder.appendChild(art);
        spriteLayer.appendChild(holder);
        if (s.say) {
          /* الفقاعة تخصّ هذا الكائن وحده: تُرسم فوق رأسه، وذيلها يشير إليه،
           * وتبقى داخل حدود المنصة (480×360) مهما اقترب الكائن من الحافة. */
          const bub = el('div', { class: 'sc-bubble' + (s.think ? ' think' : ''),
            'data-say-for': s.name, 'data-sprite-index': String(i), text: s.say });
          spriteLayer.appendChild(bub);
          const bw = Math.min(160, Math.max(46, bub.offsetWidth || 60));
          const bh = bub.offsetHeight || 30;
          let left = px - bw / 2;                       // موسّطة أفقيًا فوق الكائن
          left = Math.max(4, Math.min(left, 480 - bw - 4));
          let top = py - size / 2 - bh - 12;            // فوق الرأس
          let below = false;
          if (top < 4) { top = Math.min(360 - bh - 4, py + size / 2 + 12); below = true; }
          bub.style.left = left + 'px';
          bub.style.top = top + 'px';
          if (below) bub.classList.add('below');
          /* موضع الذيل داخل الفقاعة = مسقط مركز الكائن، محصور داخلها */
          const tail = Math.max(12, Math.min(bw - 20, px - left - 8));
          bub.style.setProperty('--tail', tail + 'px');
        }
      });
      // مقياس المنصة الحقيقي 480×360 يتكيف مع عرض المحاكي تلقائيًا
      const stageScale=(stageEl.clientWidth||344)/480;
      spriteLayer.style.transform = 'scale(' + stageScale + ')';
      spriteLayer.style.transformOrigin = '0 0';
      spriteLayer.style.width = '480px'; spriteLayer.style.height = '360px';
      /* المنصة فارغة ومستقرة بعد حذف آخر كائن — حالة واضحة بلا كائن وهمي */
      stageEl.querySelectorAll('.sc-emptystage').forEach(n => n.remove());
      if (!hasRealSprites()) {
        stageEl.appendChild(el('div', { class: 'sc-emptystage', 'data-testid': 'empty-stage',
          text: 'لا يوجد كائن حاليًا — اضغط زر + لإضافة كائن.' }));
      }
      // شاشات المتغيرات والقوائم كما في Scratch الحقيقي
      Object.keys(st.visibleVariables||{}).forEach((name,mi)=>{
        const mon=el('div',{class:'sc-monitor var',style:{left:'8px',top:(8+mi*30)+'px'}},[
          el('b',{text:name}),el('span',{text:String(st.variables[name]??0)})]);spriteLayer.appendChild(mon);
      });
      Object.keys(st.visibleLists||{}).forEach((name,mi)=>{
        const vals=st.lists[name]||[];const mon=el('div',{class:'sc-monitor list',style:{right:'8px',top:(8+mi*92)+'px'}},[
          el('b',{text:name}),el('div',{class:'items'},vals.length?vals.slice(0,6).map((v,i)=>el('span',{text:(i+1)+'  '+v})):el('span',{text:'(empty)'})),
          el('small',{text:'length '+vals.length})]);spriteLayer.appendChild(mon);
      });
      if (!keepProps && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.prop)) renderProps();
      renderSpriteList();
    }

    function renderProps() {
      const s = sp();
      propsRow.innerHTML = '';
      if (!s || s.hiddenPlaceholder) {
        propsRow.appendChild(el('div', { class: 'sc-emptylist', text: 'لا يوجد كائن محدد الآن. أضف كائنًا جديدًا من زر + ثم حدده لتظهر خصائصه.' }));
        return;
      }
      const num = (label, key, min, max) => {
        const inp = el('input', { value: String(Math.round(s[key])), 'data-prop': key, spellcheck: 'false', inputmode: 'numeric', enterkeyhint: 'done' });
        inp.oninput = () => {
          let v = parseFloat(inp.value); if (isNaN(v)) return;
          if (min != null) v = Math.max(min, Math.min(max, v));
          s[key] = v; if (key === 'dir') s.dir = normDir(v);
          drawStage(true); mark('prop:' + key); onChange('prop', { key, value: v });
        };
        return el('div', { class: 'sc-prop' }, [el('b', { text: label }), inp]);
      };
      const nameIn = el('input', { class: 'nm', 'data-prop': 'name', value: s.name, spellcheck: 'false', inputmode: 'text', enterkeyhint: 'done',
        style: { width: '84px', textAlign: 'start' } });
      nameIn.oninput = () => { s.name = nameIn.value || 'Sprite'; mark('rename'); onChange('rename', s.name); renderSpriteList(); };
      propsRow.appendChild(el('div', { class: 'sc-prop' }, [el('b', { text: 'Sprite' }), nameIn]));
      propsRow.appendChild(num('x', 'x', -240, 240));
      propsRow.appendChild(num('y', 'y', -180, 180));
      propsRow.appendChild(num('Size', 'size', 10, 300));
      propsRow.appendChild(num('Direction', 'dir', -360, 360));
      const rot = el('div', { class: 'rot' });
      [['all', '↻', 'All Around'], ['lr', '↔', 'Left/Right'], ['none', '⇢', "Don't rotate"]].forEach(([k, ic, t]) => {
        rot.appendChild(el('button', { class: 'sc-rotb' + (s.rotStyle === k ? ' on' : ''), title: t, 'aria-label': t, 'data-rot': k, text: ic,
          onclick: () => { s.rotStyle = k; W.audio.click(); drawStage(); mark('rotstyle:' + k); onChange('rotstyle', k); } }));
      });
      propsRow.appendChild(el('div', { class: 'sc-prop' }, [el('b', { text: 'Rotation' }), rot]));
    }

    function renderSpriteList() {
      spritesRow.innerHTML = '';
      const visible = st.sprites.filter(s => !s.hiddenPlaceholder);
      if (!visible.length) spritesRow.appendChild(el('div', { class: 'sc-emptylist', text: 'لا يوجد كائن حاليًا. اضغط زر + لإضافة كائن جديد.' }));
      st.sprites.forEach((s, i) => {
        if (s.hiddenPlaceholder) return;
        const t = el('div', { class: 'sc-thumb' + (i === st.selected ? ' on' : ''), 'data-sp': i, tabindex: '0', role: 'button',
          onclick: () => { st.selected = i; normalizeSelected(); W.audio.click(); drawStage(); renderPalette(); mark('select:' + s.name); } }, [
          el('div', {}, costumeArt(s.name, s.costume, 38)), el('span', { text: s.name }),
        ]);
        t.appendChild(el('div', { class: 'x', title: 'حذف الكائن', text: '×',
          onclick: (e) => { e.stopPropagation(); removeSpriteAt(i); W.audio.no(); mark('deletesprite'); drawStage(); renderPalette(); } }));
        spritesRow.appendChild(t);
      });
      bdThumb.innerHTML = '';
      bdThumb.appendChild((BACKDROPS[st.backdrop] || BACKDROPS.Blank)());
    }

    function drawStage(keepProps) { renderStage(keepProps); }

    function normDir(d) {
      d = ((d + 180) % 360 + 360) % 360 - 180;
      return d === -180 ? 180 : d;
    }

    /* -------------------------------------------------- محرك التنفيذ */
    let runToken = 0;
    /* انتظار قابل للإلغاء: عند مغادرة المرحلة يُحلّ فورًا بدل أن يبقى معلّقًا،
     * ويُبطل رمز التشغيل حتى لا تُستأنف بقية اللبنات على مرحلة أخرى. */
    const sleep = async (ms) => { const cancelled = await W.scd.sleep(ms); if (cancelled) runToken++; return cancelled; };

    function penLineTo(s, nx, ny) {
      if (!s.penDown) return;
      const a = stageXY(s), b = { px: 240 + nx, py: 180 - ny };
      ctx2d.strokeStyle = s.penColor; ctx2d.lineWidth = Math.max(1, s.penSize);
      ctx2d.lineCap = 'round'; ctx2d.beginPath();
      ctx2d.moveTo(a.px, a.py); ctx2d.lineTo(b.px, b.py); ctx2d.stroke();
      st.penMarks++;
    }
    function doStamp(s) {
      const { px, py } = stageXY(s), size = 62 * (s.size / 100);
      ctx2d.save(); ctx2d.translate(px, py);
      if (s.rotStyle === 'all') ctx2d.rotate((s.dir - 90) * Math.PI / 180);
      ctx2d.globalAlpha = .95; ctx2d.fillStyle = s.name === 'Giga' ? '#5FB8AE' : s.name === 'Ball' ? '#E0644C' : '#F5A623';
      ctx2d.beginPath(); ctx2d.ellipse(0, 0, size * .40, size * .34, 0, 0, Math.PI * 2); ctx2d.fill();
      ctx2d.fillStyle = '#fff';
      ctx2d.beginPath(); ctx2d.arc(-size * .13, -size * .06, size * .075, 0, Math.PI * 2); ctx2d.fill();
      ctx2d.beginPath(); ctx2d.arc(size * .13, -size * .06, size * .075, 0, Math.PI * 2); ctx2d.fill();
      ctx2d.restore(); st.stamps++;
      (st.stampPts || (st.stampPts = [])).push({ x: Math.round(px), y: Math.round(py) });
    }
    function hueToColor(h) {
      h = ((h % 100) + 100) % 100;
      const c = 'hsl(' + Math.round(h * 3.6) + ',85%,45%)';
      return c;
    }

    function conditionTrue(c,s){
      c=String(c==null?'':c);
      if(c==='true')return true;if(c==='false')return false;
      if(c==='touching edge?')return Math.abs(s.x)>220||Math.abs(s.y)>160;
      if(c==='mouse down?')return !!st.mouse.down;
      const km=c.match(/^key (.+) pressed\?$/); if(km)return !!st.keys[km[1]];
      if(c==='key space pressed?')return !!st.keys.space;
      return false;
    }
    function targetXY(to,s){
      if(to==='random position')return{x:Math.round(Math.random()*440-220),y:Math.round(Math.random()*320-160)};
      if(to==='mouse-pointer')return{x:st.mouse.x,y:st.mouse.y};
      const other=st.sprites.find(q=>q.name===to);return other?{x:other.x,y:other.y}:{x:s.x,y:s.y};
    }
    async function fireEvent(op,pred){
      if(st.running)return;
      const hats=st.scripts.filter(x=>x.blocks.length&&x.blocks[0].op===op&&(!pred||pred(x.blocks[0])));
      if(!hats.length)return;
      st.running=true;const token=++runToken;const s0=sp();
      await Promise.all(hats.map(h=>execBlocks(h.blocks.slice(1),s0,token)));
      if(token===runToken){st.running=false;scripts.querySelectorAll('.running').forEach(n=>n.classList.remove('running'));}
    }
    async function fireNestedEvent(op,pred,token,s0){
      const hats=st.scripts.filter(x=>x.blocks.length&&x.blocks[0].op===op&&(!pred||pred(x.blocks[0])));
      await Promise.all(hats.map(h=>execBlocks(h.blocks.slice(1),s0,token)));
    }

    async function execBlocks(list, s, token) {
      for (const b of list) {
        if (token !== runToken) return;
        const node = scripts.querySelector(`[data-uid="${b.uid}"]`);
        const holder = node && (node.classList.contains('sc-c') ? node.querySelector('.sc-chead') : node);
        if (holder) holder.classList.add('running');
        await execOne(b, s, token);
        if (holder) holder.classList.remove('running');
        if (token !== runToken) return;
      }
    }

    async function execOne(b, s, token) {
      const a = b.args || {};
      const N = k => { const v = parseFloat(a[k]); return isNaN(v) ? 0 : v; };
      switch (b.op) {
        case 'whenflag': return;
        case 'move': {
          const steps = N('n');
          const rad = (90 - s.dir) * Math.PI / 180;
          let nx = s.x + Math.cos(rad) * steps, ny = s.y + Math.sin(rad) * steps;
          nx = Math.max(-240, Math.min(240, nx)); ny = Math.max(-180, Math.min(180, ny));
          // حركة مرئية متدرجة حتى يرى التلميذ أثر الفعل
          const frames = W.store.settings.reducedMotion ? 1 : 12;
          const sx = s.x, sy = s.y;
          for (let f = 1; f <= frames; f++) {
            if (token !== runToken) return;
            const tx = sx + (nx - sx) * f / frames, ty = sy + (ny - sy) * f / frames;
            penLineTo(s, tx, ty); s.x = tx; s.y = ty; drawStage();
            if (frames > 1) await sleep(14);
          }
          mark('ran:move'); return;
        }
        case 'turnR': s.dir = normDir(s.dir + N('n')); drawStage(); mark('ran:turn'); await sleep(90); return;
        case 'turnL': s.dir = normDir(s.dir - N('n')); drawStage(); mark('ran:turn'); await sleep(90); return;
        case 'pointdir': s.dir = normDir(N('n')); drawStage(); mark('ran:pointdir'); await sleep(70); return;
        case 'gotoxy': {
          const nx = Math.max(-240, Math.min(240, N('x'))), ny = Math.max(-180, Math.min(180, N('y')));
          penLineTo(s, nx, ny); s.x = nx; s.y = ny; drawStage(); mark('ran:gotoxy'); await sleep(70); return;
        }
        case 'say': s.say = String(a.t); s.think = false; drawStage(); mark('ran:say'); await sleep(240); return;
        case 'sayfor': {
          s.say = String(a.t); drawStage(); mark('ran:sayfor');
          await sleep(Math.max(120, Math.min(4000, N('s') * 1000)));
          if (token !== runToken) return;
          s.say = null; drawStage(); return;
        }
        case 'switchbd':
          st.backdrop = a.b; if (st.backdrops.indexOf(a.b) < 0) st.backdrops.push(a.b);
          drawStage(); mark('ran:switchbd'); await sleep(140); return;
        case 'changesize': s.size = Math.max(10, Math.min(300, s.size + N('n'))); drawStage(); mark('ran:changesize'); await sleep(90); return;
        case 'playuntil': mark('ran:sound'); W.audio.chime(); await sleep(520); return;
        case 'startsound': mark('ran:sound'); W.audio.chime(); await sleep(60); return;
        case 'wait': mark('ran:wait'); await sleep(Math.max(60, Math.min(5000, N('n') * 1000))); return;
        case 'repeat': {
          const times = Math.max(0, Math.min(60, Math.round(N('n'))));
          mark('ran:repeat');
          for (let i = 0; i < times; i++) {
            if (token !== runToken) return;
            await execBlocks(b.body || [], s, token);
          }
          return;
        }
        case 'eraseall': clearPen(); mark('ran:eraseall'); await sleep(60); return;
        case 'pendown': s.penDown = true; mark('ran:pendown'); await sleep(40); return;
        case 'penup': s.penDown = false; mark('ran:penup'); await sleep(40); return;
        case 'stamp': doStamp(s); mark('ran:stamp'); await sleep(70); return;
        case 'setpencolor': s.penColor = a.c; mark('ran:setpencolor'); await sleep(40); return;
        case 'changepencolor': s.penHue = (s.penHue + N('n')) % 100; s.penColor = hueToColor(s.penHue); mark('ran:changepencolor'); await sleep(40); return;
        case 'setpensize': s.penSize = Math.max(1, Math.min(60, N('n'))); mark('ran:setpensize'); await sleep(40); return;
        case 'changepensize': s.penSize = Math.max(1, Math.min(60, s.penSize + N('n'))); mark('ran:changepensize'); await sleep(40); return;

        /* ---- لبنات إضافية: تنفيذ فعلي حيثما كان له أثر مرئي على المنصة ---- */
        case 'changex': { const nx = Math.max(-240, Math.min(240, s.x + N('n'))); penLineTo(s, nx, s.y); s.x = nx; drawStage(); mark('ran:changex'); await sleep(70); return; }

        case 'think':   s.say = String(a.t); s.think = true; drawStage(); mark('ran:think'); await sleep(240); return;

        case 'changevol': st.volume=Math.max(0,Math.min(100,st.volume+N('n')));s.volume=st.volume;mark('ran:sound');await sleep(50);return;
        case 'setvol': st.volume=Math.max(0,Math.min(100,N('n')));s.volume=st.volume;mark('ran:sound');await sleep(50);return;
        case 'goto': {const q=targetXY(a.to,s);penLineTo(s,q.x,q.y);s.x=q.x;s.y=q.y;drawStage();mark('ran:goto');await sleep(70);return;}
        case 'glideto': {const q=targetXY(a.to,s),sx=s.x,sy=s.y,fr=W.store.settings.reducedMotion?1:16;for(let f=1;f<=fr;f++){if(token!==runToken)return;const tx=sx+(q.x-sx)*f/fr,ty=sy+(q.y-sy)*f/fr;penLineTo(s,tx,ty);s.x=tx;s.y=ty;drawStage();if(fr>1)await sleep(Math.max(12,Math.min(220,N('s')*1000/fr)));}mark('ran:glideto');return;}
        case 'pointtowards': {const q=targetXY(a.to,s);s.dir=normDir(90-Math.atan2(q.y-s.y,q.x-s.x)*180/Math.PI);drawStage();mark('ran:pointtowards');await sleep(60);return;}
        case 'setrotstyle': s.rotStyle=a.r==='left-right'?'lr':a.r==="don't rotate"?'none':'all';drawStage();mark('ran:rotstyle');await sleep(40);return;
        case 'changeeffect': s.effects[a.e]=(s.effects[a.e]||0)+N('n');drawStage();mark('ran:effect');await sleep(50);return;

        case 'gofront': s.layer=a.l==='front'?999:-999;mark('ran:layer');await sleep(40);return;
        case 'layerby': s.layer+=(a.d==='forward'?1:-1)*N('n');mark('ran:layer');await sleep(40);return;
        case 'switchcostume': {const nm=String(a.c),idx=s.costumes.indexOf(nm);s.costume=idx>=0?idx:0;drawStage();mark('ran:costume');await sleep(60);return;}
        case 'nextcostume': s.costume=(s.costume+1)%Math.max(1,s.costumes.length);drawStage();mark('ran:costume');await sleep(60);return;
        case 'changesoundeffect': s.soundEffects[a.e]=(s.soundEffects[a.e]||0)+N('n');mark('ran:soundeffect');await sleep(40);return;

    /* تشغيل مقطع واحد بالنقر عليه — تمامًا كما في Scratch.
     * إن بدأ المقطع بلبنة حدث تُتخطّى، وإلا يُنفَّذ من أول لبنة. */
    async function runStack(si) {
      const s = st.scripts[si];
      if (!s || !s.blocks.length) return;
      if (st.running) { stop(); return; }
      const first = s.blocks[0];
      const isHat = OPS[first.op] && OPS[first.op].shape === 'hat';
      const body = isHat ? s.blocks.slice(1) : s.blocks;
      if (!body.length) return;
      st.running = true; st.stopped = false;
      const token = ++runToken;
      st.lastRun = { at: Date.now(), started: 1, byClick: true };
      const node = scripts.querySelector('[data-stack="' + si + '"]');
      if (node) node.classList.add('glow');
      mark('clickrun'); onChange('run-start', { stacks: 1, byClick: true });
      await execBlocks(body, sp(), token);
      if (node) node.classList.remove('glow');
      if (token === runToken) {
        st.running = false;
        scripts.querySelectorAll('.running').forEach(n => n.classList.remove('running'));
        onChange('run-end', { started: 1, byClick: true });
      }
    }

    async function go() {
      if (st.running) return;
      const hats = st.scripts.filter(s => s.blocks.length && s.blocks[0].op === 'whenflag');
      st.running = true; st.stopped = false; goBtn.classList.add('on');
      const token = ++runToken;
      st.lastRun = { at: Date.now(), started: hats.length };
      mark('go');
      onChange('run-start', { stacks: hats.length });
      if (!hats.length) {
        // لا لبنة حدث: يوضّح المحاكي بدل أن يصمت
        st.running = false; goBtn.classList.remove('on');
        onChange('run-end', { started: 0 });
        return;
      }
      const s = sp();
      await Promise.all(hats.map(h => execBlocks(h.blocks.slice(1), s, token)));
      if (token === runToken) {
        st.running = false; goBtn.classList.remove('on');
        scripts.querySelectorAll('.running').forEach(n => n.classList.remove('running'));
        onChange('run-end', { started: hats.length });
      }
    }
    function stop() {
      runToken++; st.running = false; st.stopped = true;
      st.sprites.forEach(s => { s.think = false; });
      goBtn.classList.remove('on');
      scripts.querySelectorAll('.running').forEach(n => n.classList.remove('running'));
      st.sprites.forEach(s => { s.say = null; });
      drawStage(); mark('stop'); onChange('stop', {});
    }
    goBtn.onclick = () => { W.audio.click(); go(); };
    stopBtn.onclick = () => { W.audio.click(); stop(); };

      stageEl.style.height = st.fullScreen ? '340px' : '258px';

      W.audio.click(); mark('fullscreen'); onChange('fullscreen', st.fullScreen);

    /* -------------------------------------------------- التهيئة */

    /* -------------------------------------------------- واجهة الفحص */
    const api = {
      root, stageEl, mid, pal, catsCol, scripts, host,
      state: () => st,
      sprite: () => sp(),
      /* لقطة قابلة للمقارنة من المقاطع */
      snapshot() {
        const ser = (list) => (list || []).map(b => ({ op:b.op,args:Object.assign({},b.args),body:b.body?ser(b.body):null,elseBody:b.elseBody?ser(b.elseBody):null }));
        return st.scripts.map(s => ser(s.blocks));
      },
      /* هل يوجد مقطع يبدأ بحدث ويحوي بالضبط هذا التسلسل؟ */
      hasScript(seq) {
        const match = (blocks, want) => {
          if (blocks.length !== want.length) return false;
          return want.every((w, i) => {
            const b = blocks[i];
            if (!b || b.op !== w.op) return false;
            if (w.args) for (const k in w.args) {
              const bv = b.args[k], wv = w.args[k];
              if (typeof wv === 'function') { if (!wv(bv)) return false; }
              else if (String(bv) !== String(wv)) return false;
            }
            if (w.body) return match(b.body || [], w.body);

        };
        return st.scripts.some(s => match(s.blocks, seq));
      },
      /* هل يوجد مقطع يبدأ بحدث ويحتوي (بالترتيب) على هذه العمليات؟ */
      hasSequence(ops, opt) {
        opt = opt || {};
        return st.scripts.some(s => {
          if (opt.needHat && (!s.blocks.length || s.blocks[0].op !== 'whenflag')) return false;
          const flat = opt.deep ? flatten(s.blocks).map(b => b.op) : s.blocks.map(b => b.op);
          let i = 0;
          for (const o of flat) { if (o === ops[i]) i++; if (i >= ops.length) return true; }
          return i >= ops.length;

      },
      blocks(deep) {
        const out = [];
        st.scripts.forEach(s => { deep ? flatten(s.blocks, out) : s.blocks.forEach(b => out.push(b)); });
        return out;
      },
      countOp(op, deep) { return this.blocks(deep !== false).filter(b => b.op === op).length; },
      findOp(op, deep) { return this.blocks(deep !== false).find(b => b.op === op) || null; },
      /* لبنة داخل جسم لبنة كرر؟ */
      insideRepeat(op) {
        return this.blocks(false).some(b => b.op === 'repeat' && flatten(b.body).some(x => x.op === op))
          || st.scripts.some(s => flatten(s.blocks).some(b => b.op === 'repeat' && flatten(b.body).some(x => x.op === op)));
      },
      repeatBlocks() { return this.blocks(true).filter(b => b.op === 'repeat'); },
      /* أول مقطع يبدأ بلبنة حدث */
      hatStacks() { return st.scripts.filter(s => s.blocks.length && s.blocks[0].op === 'whenflag'); },
      did(k) { return !!st.events[k]; },
      ran() { return !!st.lastRun; },
      penMarks() { return st.penMarks; },
      stamps() { return st.stamps; },
      /* مسح فعلي لقماش القلم: العدد واللون الغالب وسماكة الخط وعدد الفجوات.
       * يُستخدم في الاختبارات لإثبات أن الطالب يرى الأثر فعلًا لا أن حدثًا سُجِّل. */
      penScan() {
        try {
          const d = ctx2d.getImageData(0, 0, 480, 360).data;
          const colors = {}; let count = 0;
          let minX = 480, maxX = 0, minY = 360, maxY = 0;
          const colInk = new Array(480).fill(0);
          for (let y = 0; y < 360; y++) {
            for (let x = 0; x < 480; x++) {
              const i = (y * 480 + x) * 4;
              if (d[i + 3] < 40) continue;
              count++; colInk[x]++;
              if (x < minX) minX = x; if (x > maxX) maxX = x;
              if (y < minY) minY = y; if (y > maxY) maxY = y;
              const key = (d[i] >> 4) + ',' + (d[i + 1] >> 4) + ',' + (d[i + 2] >> 4);
              const c = colors[key] || (colors[key] = { n: 0, r: 0, g: 0, b: 0 });
              c.n++; c.r = d[i]; c.g = d[i + 1]; c.b = d[i + 2];
            }
          }
          let dom = null;
          Object.keys(colors).forEach(k => { if (!dom || colors[k].n > dom.n) dom = colors[k]; });
          const thickness = colInk.reduce((m, v) => Math.max(m, v), 0);
          /* الفجوات على امتداد العرض داخل حدود الرسم */
          let gaps = 0, inRun = false, started = false;
          for (let x = Math.max(0, minX); x <= Math.min(479, maxX); x++) {
            const on = colInk[x] > 0;
            if (on) { started = true; inRun = true; }
            else if (started && inRun) { gaps++; inRun = false; }
          }
          return { count: count, thickness: thickness, gaps: gaps,
            color: dom ? { r: dom.r, g: dom.g, b: dom.b } : null,
            colorCount: Object.keys(colors).length,
            bbox: count ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 } : null,
            stamps: st.stamps, stampPts: (st.stampPts || []).slice() };
        } catch (e) { return { count: 0, thickness: 0, gaps: 0, color: null, colorCount: 0, bbox: null, stamps: st.stamps, stampPts: [] }; }
      },
      inkPixels() {
        try {
          const d = ctx2d.getImageData(0, 0, 480, 360).data;
          let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 24) n++;
          return n;
        } catch (e) { return st.penMarks * 40 + st.stamps * 200; }
      },
      go, stop,
      clearPen,
      setScripts(list) { st.scripts = list.map(s => ({ x: s.x || 24, y: s.y || 20, blocks: s.blocks.map(cloneBlock) })); renderScripts(); },
      addScript(blocks, x, y) { st.scripts.push({ x: x || 24, y: y || 20, blocks: blocks.map(cloneBlock) }); renderScripts(); },
      resetSprite() { const s = sp(); s.x = 0; s.y = 0; s.dir = 90; s.size = 100; s.say = null; s.penDown = false; s.penSize = 1; s.penColor = '#0FBD8C'; s.penHue = 60; s.effects={}; drawStage(); },
      resetAll() {
        stop(); clearPen();
        st.projectName='Scratch Project'; projName.textContent=st.projectName;
        st.tab='code'; st.cat='events'; st.penExt=!!opts.penEnabled;
        st.sprites=[newSprite('Cat')]; st.selected=0; st.backdrop='Blank'; st.backdrops=['Blank']; st.sounds=['Meow'];
        st.messages=['message1']; st.variables={'my variable':0}; st.lists={'my list':[]}; st.visibleVariables={}; st.visibleLists={};
        st.answer=''; st.timerStart=Date.now(); st.volume=100; st.scripts=[]; st.savedName=null; st.loadedName=null; st.events={}; st.lastRun=null;
        renderTabs(); renderCats(); renderPalette(); renderScripts(); drawStage(); onChange('reset',{});
      },
      resize() { drawStage(true); },
      enablePen() { st.penExt = true; renderCats(); renderPalette(); },
      selectCat(k) { st.cat = k; renderCats(); renderPalette(); },
      openSaveDialog, openLoadDialog, openBackdropLibrary, openSpriteLibrary, openSoundLibrary, openExtensions,
      /* عناصر للإرشاد البصري */
      el: {
        cat: (k) => catsCol.querySelector(`[data-cat="${k}"]`),
        addExt: () => catsCol.querySelector('#scAddExt'),
        palBlock: (op) => pal.querySelector(`[data-pal-op="${op}"]`),
        go: () => goBtn, stop: () => stopBtn, full: () => fsBtn,
        file: () => mFile, stage: () => stageEl,
        addSprite: () => addSpriteBtn, addBackdrop: () => addBdBtn,
        tab: (k) => tabsRow.querySelector(`[data-tab="${k}"]`),
        script: () => mid, props: () => propsRow,
        prop: (k) => propsRow.querySelector(`[data-prop="${k}"]`),
        rot: (k) => propsRow.querySelector(`[data-rot="${k}"]`),
        blockInScript: (op) => scripts.querySelector(`[data-op="${op}"]`),

      costumeIndex: () => (sp() || {}).costume || 0,
      setCostume(i) { const s = sp(); if (!s || !s.costumes) return; s.costume = Math.max(0, Math.min(s.costumes.length - 1, i));
        renderPalette(); renderSpriteList(); drawStage(); onChange('costume', s.costume); },
      addCostume() { const s = sp(); if (!s) return; s.costumes.push(s.name + '-' + String.fromCharCode(97 + s.costumes.length));
        s.costume = s.costumes.length - 1; renderPalette(); renderSpriteList(); drawStage(); onChange('costume-add', s.costumes.length); },
      spriteCount() { return st.sprites.filter(s => !s.hiddenPlaceholder).length; },
      addSprite(name) { addSpriteByName(name || 'Giga'); renderSpriteList(); renderProps(); renderPalette(); drawStage(); onChange('addsprite', name); },
      removeSprite(i) { removeSpriteAt(i == null ? st.selected : i); renderSpriteList(); renderProps(); renderPalette(); drawStage(); onChange('deletesprite', {}); },
      runStack,
      scriptsModel() { return st.scripts.map(s => s.blocks.map(b => b.op)); },
      sounds: () => st.sounds.slice(),
      mkBlock, OPS, CATS,
      redraw() { renderScripts(); drawStage(); renderPalette(); renderCats(); },
    };
    /* المحاكي يوقف نفسه عند أي انتقال مرحلة/مشهد قبل حذف عناصره */
    W.scd.onClear(() => { try { runToken++; st.running = false; } catch (e) {} });

    return api;
  }

  W.scratchsim = { build, OPS, CATS, mkBlock, SPRITE_ART, BACKDROPS, costumeArt, COSTUME_VARIANTS };
})(window.MNARA);

/* ==== engine/scratchlesson.js ==== */
/* ==== engine/scratchlesson.js — مضيف دروس Scratch + مشغّل خطوات موجّهة ====
 * يضع المحاكي داخل منطقة العمل (يمين اللوحة، فلا تغطي اللوحةُ أبدًا اللبناتِ
 * أو المنصةَ أو الأزرارَ المطلوبة)، ويشغّل خطوات موجّهة تُتحقّق من حالة المحاكي.
 */
(function (W) {
  const { el } = W.util;

  /* منطقة عمل بعرض كامل بجانب اللوحة */
  function work(api, opts) {
    opts = opts || {};
    const w = el('div', { class: 's2-work' + (opts.full ? ' full' : '') });
    api.host.appendChild(w); W.scd.node(w);
    return w;
  }

  /* سطح مكتب Windows مصغّر لفتح Scratch من قائمة ابدأ (درس 1.2)
   * كل برنامج له أيقونته المستقلة القريبة من الأيقونة الحقيقية،
   * وكل أيقونة تستجيب للنقر فعلًا (لا صور جامدة). */
  const DESK_APPS = [
    { ic: 'scratchapp',  label: 'Scratch',          scratch: true },
    { ic: 'word',        label: 'Microsoft Word',   note: 'هذا التطبيق لكتابة المستندات. في هذا الدرس نحتاج تطبيق Scratch — افتحه من قائمة ابدأ.' },
    { ic: 'excel',       label: 'Microsoft Excel',  note: 'هذا التطبيق للجداول والحسابات. في هذا الدرس نحتاج تطبيق Scratch.' },
    { ic: 'powerpoint',  label: 'Microsoft PowerPoint', note: 'هذا التطبيق للعروض التقديمية. في هذا الدرس نحتاج تطبيق Scratch.' },
    { ic: 'calculator',  label: 'Calculator',       note: 'الآلة الحاسبة للعمليات الحسابية. في هذا الدرس نحتاج تطبيق Scratch.' },
    { ic: 'pc',          label: 'This PC',          note: 'من هنا نتصفّح أقراص الجهاز وملفاته.' },
    { ic: 'recyclebin',  label: 'Recycle Bin',      note: 'سلة المحذوفات تحتفظ بالملفات المحذوفة مؤقتًا.' },
  ];

  function desktop(parent, onOpenScratch, opts) {
    opts = opts || {};
    const md = W.obslesson.buildMiniDesktop(parent, {});
    md.enableStart(true); md.pulseStart(true);
    const area = md.stageArea;

    let opened = false;
    function openScratch(src) {
      if (opened) return;
      opened = true;
      md.closeStartMenu(); md.pulseStart(false); W.audio.chime();
      onOpenScratch && onOpenScratch(src || 'desktop');
    }
    function toast(text) {
      area.querySelectorAll('.sc-desktoast').forEach(n => n.remove());
      const t = el('div', { class: 's2-note sc-desktoast', style: {
        position: 'absolute', zIndex: '20', left: '50%', bottom: '14px', transform: 'translateX(-50%)',
        maxWidth: '78%', textAlign: 'center' }, text: text });
      area.appendChild(t); W.scd.node(t);
      W.audio.no();
      W.scd.after(() => t.remove(), 3200);
    }

    const grid = el('div', { class: 'sc-deskicons' });
    DESK_APPS.forEach(app => {
      const node = el('div', { class: 'sc-deskic', tabindex: '0', role: 'button',
        'data-app': app.ic, title: app.label }, [
        W.icons.svg(app.ic, '', 46),
        el('span', { text: app.label }),
      ]);
      const act = () => {
        grid.querySelectorAll('.sc-deskic.armed').forEach(n => n.classList.remove('armed'));
        node.classList.add('armed');
        if (app.scratch) openScratch('desktop-icon');
        else toast(app.note || app.label);
      };
      node.onclick = act;
      node.ondblclick = act;
      node.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
      grid.appendChild(node);
    });
    area.appendChild(grid);

    md.onStart(() => {
      W.audio.click();
      md.openStartMenu(DESK_APPS.filter(a => a.ic !== 'pc' && a.ic !== 'recyclebin').map(a => ({
        ic: a.ic, label: a.label,
        on: (menu) => {
          if (a.scratch) { if (menu) menu.remove(); openScratch('start-menu'); }
          else { if (menu) menu.remove(); toast(a.note || a.label); }
        },
      })));
    });
    md.openScratchForTest = () => openScratch('test');
    return md;
  }

  /* ---------------------------------------------------------------------
   * مشغّل خطوات موجّهة داخل المحاكي.
   * steps: [{ label, instr, instrEn, hint, target(sim), validate(sim), ok }]
   * لا ينتقل إلا إذا أعادت validate() القيمة true — فحص حالة لا فحص نقر.
   * --------------------------------------------------------------------- */
  function guided(api, sim, steps, opts) {
    opts = opts || {};
    let i = 0;
    const model = steps.map(s => ({ label: s.label, done: false }));

    function paint() {
      api.clearGuides();
      if (i >= steps.length) return;
      const st = steps[i];
      api.panel.setInstr(st.instr, st.instrEn);
      api.panel.setChecks(model, i);
      api.panel.setActions([
        { label: 'تلميح', onClick: () => api.hint(st.hint || 'انظر إلى الحلقة المضيئة ونفّذ الإجراء المطلوب داخل التطبيق.') },
        { label: 'إعادة الخطوة', onClick: () => { W.audio.click(); if (st.onReset) st.onReset(sim); paint(); } },
      ]);
      if (st.target) {
        // الإرشاد يظهر بعد رسم الواجهة حتى تكون الإحداثيات صحيحة
        W.scd.after(() => {
          if (i >= steps.length) return;
          const node = st.target(sim);
          if (node) { api.ring(node, st.pad); api.hand(node); }
        }, 40);
      }
    }
    function check() {
      if (i >= steps.length) return;
      const st = steps[i];
      let ok = false;
      try { ok = !!st.validate(sim); } catch (e) { ok = false; }
      if (!ok) return;
      model[i].done = true;
      api.panel.setChecks(model, i);          // تغذية راجعة فورية
      W.s2store.stepDone(api.lesson.id, 'g' + i);
      api.feedback('ok', st.ok || 'أحسنت — تحقّقت الخطوة فعليًا.');
      i++;
      if (i >= steps.length) {
        api.panel.setChecks(model, -1);
        api.clearGuides();
        W.scd.after(() => api.pass(opts.passMsg || 'أتممت جميع الخطوات العملية.'), 700);
        return;
      }
      W.scd.after(paint, 620);
    }
    paint();
    return {
      check,
      get index() { return i; },
      why() {
        if (i >= steps.length) return 'كل الخطوات مكتملة.';
        return 'الخطوة ' + (i + 1) + ' («' + steps[i].label + '») لم تتحقق بعد: ' + (steps[i].why || steps[i].instr);
      },
      reveal() {
        if (i >= steps.length) return;
        const st = steps[i];
        api.hint(st.reveal || st.hint || st.instr);
        if (st.target) { const n = st.target(sim); if (n) { api.ring(n, st.pad); api.hand(n); } }
      },
      repaint: paint,
    };
  }

  /* مهمة مستقلة: تُقيَّم على الحالة النهائية بعد أن يشغّل التلميذ المقطع */
  function challenge(api, sim, spec) {
    const checks = spec.checks;
    const model = checks.map(c => ({ label: c.label, done: false }));
    let solved = false;
    function sync() {
      checks.forEach((c, k) => { try { model[k].done = !!c.test(sim); } catch (e) { model[k].done = false; } });
      api.panel.setChecks(model, model.findIndex(m => !m.done));
      if (!solved && model.every(m => m.done)) {
        solved = true;
        checks.forEach((c, k) => W.s2store.stepDone(api.lesson.id, 'c' + k));
        W.scd.after(() => api.pass(spec.passMsg || 'نجحت! النتيجة على المنصة مطابقة للمطلوب.'), 300);
      }
    }
    api.panel.setInstr(spec.instr, spec.instrEn);
    api.panel.setActions([
      { label: 'تلميح', onClick: () => api.hint(spec.hint || 'راجع قائمة الشروط في اللوحة: كل شرط لم يتحقق بعد مكتوب بلا علامة ✓.') },
      { label: 'إعادة المحاولة', onClick: () => { W.audio.click(); sim.setScripts([]); sim.clearPen(); sim.resetSprite(); sync(); } },
    ]);
    sync();
    return {
      sync,
      why() {
        const miss = model.map((m, k) => m.done ? null : checks[k].label).filter(Boolean);
        return miss.length ? 'لم يتحقق بعد: ' + miss.join(' · ') : 'كل الشروط متحققة.';
      },
      reveal() { api.hint(spec.reveal || 'راجع شروط المهمة واحدًا واحدًا.'); },
    };
  }

  W.scratchlesson = { work, desktop, guided, challenge };
})(window.MNARA);

  /* كل شبكة: مصفوفة أوجه، كل وجه {p:[[x,y,z],...], c:'#hex'} في إحداثيات الوحدة

  function meshBox() {

    const A = [-.5, -.5, 0], B = [.5, -.5, 0], C = [.5, .5, 0], D = [-.5, .5, 0];

    f.push({ p: [A2, B2, C2, D2] });      // أعلى
    f.push({ p: [A, D, C, B] });          // أسفل
    f.push({ p: [A, B, B2, A2] });

  function meshCylinder(seg) {

      const p1 = [Math.cos(a) * .5, Math.sin(a) * .5, 0], p2 = [Math.cos(b) * .5, Math.sin(b) * .5, 0];
      const p3 = [Math.cos(b) * .5, Math.sin(b) * .5, 1], p4 = [Math.cos(a) * .5, Math.sin(a) * .5, 1];
      f.push({ p: [p1, p2, p3, p4] });
      top.push(p4); bot.unshift(p1);
    }
    f.push({ p: top }); f.push({ p: bot });
    return f;

  function meshCone(seg) {
    seg = seg || 18; const f = [], bot = [];
    for (let i = 0; i < seg; i++) {
      const a = i / seg * Math.PI * 2, b = (i + 1) / seg * Math.PI * 2;
      const p1 = [Math.cos(a) * .5, Math.sin(a) * .5, 0], p2 = [Math.cos(b) * .5, Math.sin(b) * .5, 0];
      f.push({ p: [p1, p2, [0, 0, 1]] });

    f.push({ p: bot });

  }
  function meshSphere(lat, lon) {
    lat = lat || 9; lon = lon || 16; const f = [];
    for (let i = 0; i < lat; i++) {
      const t0 = i / lat * Math.PI, t1 = (i + 1) / lat * Math.PI;
      for (let j = 0; j < lon; j++) {
        const p0 = j / lon * Math.PI * 2, p1 = (j + 1) / lon * Math.PI * 2;
        const v = (t, p) => [Math.sin(t) * Math.cos(p) * .5, Math.sin(t) * Math.sin(p) * .5, (1 - Math.cos(t)) / 2];
        f.push({ p: [v(t0, p0), v(t0, p1), v(t1, p1), v(t1, p0)] });

  }
  function meshPyramid() {
    const f = [];
    const A = [-.5, -.5, 0], B = [.5, -.5, 0], C = [.5, .5, 0], D = [-.5, .5, 0], T = [0, 0, 1];
    f.push({ p: [A, D, C, B] });
    f.push({ p: [A, B, T] }); f.push({ p: [B, C, T] }); f.push({ p: [C, D, T] }); f.push({ p: [D, A, T] });
    return f;
  }
  function meshRoof() {
    const f = [];
    const A = [-.5, -.5, 0], B = [.5, -.5, 0], C = [.5, .5, 0], D = [-.5, .5, 0];
    const E = [0, -.5, 1], F = [0, .5, 1];
    f.push({ p: [A, D, C, B] });
    f.push({ p: [A, B, E] }); f.push({ p: [D, F, C] });
    f.push({ p: [A, E, F, D] }); f.push({ p: [B, C, F, E] });
    return f;
  }
  function meshWedge() {
    const f = [];
    const A = [-.5, -.5, 0], B = [.5, -.5, 0], C = [.5, .5, 0], D = [-.5, .5, 0];
    const A2 = [-.5, -.5, 1], D2 = [-.5, .5, 1];
    f.push({ p: [A, D, C, B] });
    f.push({ p: [A, B, A2] }); f.push({ p: [D, D2, C] });
    f.push({ p: [A, A2, D2, D] }); f.push({ p: [B, C, D2, A2] });

  function meshStar() {

  function extrude(pts2d) {

    const n = pts2d.length;
    for (let i = 0; i < n; i++) {
      const a = pts2d[i], b = pts2d[(i + 1) % n];
