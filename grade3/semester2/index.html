.s2-top .dock,.s2-top .dock.right{position:static;top:auto;left:auto;right:auto;z-index:auto}

/* منطقة العنوان: لا قصّ إطلاقًا */
.s2-titlewrap{display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0;max-width:40%}
.s2-ttl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.s2-ttl b{
  white-space:normal;overflow:visible;text-overflow:clip;
  font-family:var(--font-title);font-size:16px;font-weight:800;color:var(--sand-1);
  line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;
}
.s2-ttl small{direction:ltr;font-size:10.5px;color:var(--muted);white-space:normal;overflow:visible}
.s2-code{flex:0 0 auto}

/* المراحل في الوسط وتنكمش أولًا */
.s2-rail{flex:1 1 auto;justify-content:center;margin-inline-start:0;min-width:0;overflow:hidden;padding-inline:12px}

/* عند ضيق المساحة: يُخفى الإنجليزي أولًا ثم تُختصر أسماء المراحل — والعنوان العربي لا يُقصّ */
@media (max-width:1560px){ .s2-ttl small{display:none} }
@media (max-width:1460px){
  .s2-step span{max-width:0;opacity:0}
  .s2-step.live span{max-width:110px;opacity:1;margin-inline-start:4px}
  .s2-step::after{content:attr(data-n);font-size:12px;font-weight:800}
}
@media (max-width:1180px){
  .s2-step span,.s2-step.live span{max-width:0;opacity:0;margin:0}
  .s2-titlewrap{max-width:54%}
}


/* ================= زرّا السابق/التالي: السهم عنصر مستقل ================= */
.s2-nav{min-height:48px;min-width:132px;padding:9px 16px;border-radius:12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-size:14px;font-weight:700;color:var(--cream);
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,236,200,.24)}
.s2-nav:hover:not(:disabled),.s2-nav:focus-visible{border-color:var(--copper-hi);background:rgba(231,160,99,.16)}
.s2-nav:disabled{opacity:.42;cursor:default}
.s2-nav.primary{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border-color:var(--copper-hi)}
.s2-nav .arrow{display:inline-block;direction:ltr;unicode-bidi:isolate;font-size:17px;line-height:1}
.s2-nav .label{white-space:nowrap}
.sem-btn .arrow{display:inline-block;direction:ltr;unicode-bidi:isolate;font-size:15px;line-height:1}
.sem-btn .label{white-space:nowrap}

/* ================= خارج الدرس — مرسم تنكركاد الحر ================= */
.s2-free3d-page{position:absolute;inset:0;background:linear-gradient(145deg,#102d2a,#173d39 42%,#0e2425);overflow:hidden}
.s2-free3d-head{position:absolute;z-index:12;top:8px;left:12px;right:12px;height:58px;border:1px solid rgba(167,230,221,.45);border-radius:15px;background:rgba(12,31,33,.94);box-shadow:0 12px 30px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:space-between;padding:0 14px;direction:rtl}
.s2-free3d-title{display:flex;align-items:center;gap:12px;min-width:0;color:#f7fbf9}
.s2-free3d-title .badge{background:linear-gradient(135deg,#f2a03d,#f6c76c);color:#2b1703;border-radius:999px;padding:7px 12px;font-weight:900;white-space:nowrap;box-shadow:0 0 22px rgba(242,160,61,.28)}
.s2-free3d-title b{font-size:21px;white-space:nowrap}
.s2-free3d-title small{font-size:12px;color:#a7e6dd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2-free3d-actions{display:flex;align-items:center;gap:7px;direction:rtl;flex:0 0 auto}
.s2-free3d-btn{height:36px;border:1px solid rgba(167,230,221,.48);border-radius:10px;background:#244f4b;color:#fff;padding:0 12px;font:700 12px Tahoma,Arial,sans-serif;cursor:pointer}
.s2-free3d-btn:hover{background:#2e625c}.s2-free3d-btn.danger{background:#684239;border-color:#b77b68}.s2-free3d-btn.danger:hover{background:#7e4a40}
.s2-free3d-work{position:absolute;top:74px;left:12px;right:12px;bottom:12px;border-radius:14px;overflow:hidden;background:#f2f4f6;box-shadow:0 18px 44px rgba(0,0,0,.34);min-height:0}
.s2-free3d-work .t3d{border-radius:14px}
.station[data-free3d="1"]{box-shadow:0 0 0 2px rgba(242,160,61,.65),0 0 28px rgba(242,160,61,.28)}
@media(max-width:900px){.s2-free3d-head{height:70px}.s2-free3d-work{top:86px}.s2-free3d-title small{display:none}.s2-free3d-btn{padding:0 8px;font-size:11px}}
.station.free3d{border-color:#f2a03d!important;box-shadow:0 0 0 2px rgba(242,160,61,.52),0 0 30px rgba(242,160,61,.24)!important}
.station.free3d .st-tag{background:linear-gradient(135deg,#f2a03d,#f6c76c)!important;color:#2b1703!important;border:0!important;font-weight:900}


/* ================================================================
 * إصلاحات نهائية — الفصل الدراسي الثاني (الصف الثالث)
 * ================================================================ */

/* ---- (1) الشريط العلوي في الصفحات الخاصة: خانات مستقلة كإطار الدرس ---- */
.s2-railfill{flex:1 1 auto;min-width:0;height:1px}
.s2-body.nopanel > .s2-theory,
.s2-body.nopanel > .s2-quiz{left:0;right:0;max-width:1040px;margin:0 auto}

/* ---- (2) سقف عام: لا صورة ولا SVG يتجاوز مساحة النشاط أبدًا ---- */
.s2-theory img,.s2-theory svg,.s2-theory canvas,
.s2-quiz img,.s2-quiz svg,.s2-quiz canvas{max-width:100%;max-height:100%}
.s2-fig .pic{max-height:280px;overflow:hidden}
.s2-fig .pic > svg{width:auto;height:auto;max-width:100%;max-height:260px}
.s2-hero{align-items:stretch}
.s2-hero .art{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  max-width:min(330px,44%);max-height:210px;padding:8px;box-sizing:border-box;overflow:hidden}
.s2-hero .art > *{max-width:100%;max-height:100%}
.s2-hero .art svg{max-width:100%;max-height:100%;height:auto;width:auto}
@media (max-height:760px){ .s2-hero .art{max-height:170px} }

/* الرسم التلقائي المحقون: صندوق محدود الارتفاع ومركزي — لا يتمدّد أبدًا */
.s2-theory-auto-visual{flex:0 0 auto;align-self:center;width:100%;max-width:340px;
  height:220px;border-radius:var(--r-1);overflow:hidden;background:#F7F1E4;
  display:flex;align-items:center;justify-content:center;padding:6px;box-sizing:border-box}
.s2-theory-auto-visual > svg{width:100%;height:100%;object-fit:contain}

/* ---- (3) شريط المراحل: مكتمل فعليًا ≠ مُتخطّى ≠ الحالي ---- */
.s2-step{position:relative}
.s2-step.done{color:var(--teal-hi);border-color:rgba(95,184,174,.62);background:rgba(59,145,136,.20)}
.s2-step.done i{background:var(--teal-1)}
.s2-step.done::before{content:'✓';position:absolute;inset-inline-end:-3px;top:-6px;
  width:15px;height:15px;border-radius:50%;font-size:9.5px;line-height:15px;text-align:center;
  background:var(--teal-1);color:#06231f;font-weight:900}
.s2-step.todo{color:var(--cream-2);border-style:dashed;border-color:rgba(255,236,200,.30);background:rgba(255,255,255,.04)}
.s2-step.todo i{background:rgba(255,236,200,.26)}
.s2-step.live.done{color:#2a1608;background:linear-gradient(165deg,var(--copper-1),var(--copper-2));border-color:var(--copper-hi)}
.s2-step.live.done i{background:#2a1608}

/* ملاحظة «لم أنتهِ من هذا النشاط بعد» — واضحة وهادئة، لا تحجب النشاط */
.s2-unfinished{position:absolute;z-index:44;left:50%;transform:translateX(-50%);bottom:14px;
  max-width:min(680px,86%);padding:11px 20px;border-radius:14px;text-align:center;
  font-size:14px;font-weight:700;line-height:1.7;color:#FFE9CB;
  background:rgba(12,32,44,.96);border:1.5px solid rgba(231,160,99,.55);
  box-shadow:0 14px 34px rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.s2-unfinished.on{opacity:1}
.s2-unfinished b{color:var(--copper-hi);display:block;font-size:12px;margin-bottom:3px;font-weight:800}

/* ---- (4) شبكة الروبوت المدمجة (درس 1.1) ---- */
.rb-wrap{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0}
.rb-board{position:relative;border-radius:14px;overflow:hidden;flex:0 0 auto;
  border:2px solid rgba(231,160,99,.5);background:#F7F1E4}
.rb-side{flex:0 1 380px;min-width:240px;max-width:400px;display:flex;flex-direction:column;gap:9px}
@media (max-height:720px){ .rb-board{transform:scale(.86);transform-origin:top center} }
.s2-cmdrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.s2-btn.cmd{min-height:42px}

/* بطاقات ترتيب الحقيبة — أرقام كبيرة وأسهم مرتبة ونص عربي مقروء */
.bag-seq{display:flex;flex-direction:column;gap:7px;padding:12px 12px 14px;background:#F4EEE1;width:100%;box-sizing:border-box}
.bag-card{display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 12px;
  background:#DDF1E5;border:3px solid #58AF73;box-sizing:border-box}
.bag-seq.bad .bag-card{background:#F7E2DC;border-color:#D77759}
.bag-card .no{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900;color:#fff;background:#58AF73}
.bag-seq.bad .bag-card .no{background:#D77759}
.bag-card .tx{flex:1;font-size:16px;font-weight:800;color:#2C1408;line-height:1.5}
.bag-card .ic{flex:0 0 30px;display:flex;align-items:center;justify-content:center}
.bag-arrow{text-align:center;font-size:17px;font-weight:900;color:#58AF73;line-height:1}
.bag-seq.bad .bag-arrow{color:#D77759}
.bag-verdict{margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14.5px;font-weight:800;color:#2C1408}
.bag-verdict .mk{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff;background:#58AF73}
.bag-seq.bad .bag-verdict .mk{background:#D77759}

/* ---- (6) قائمة أبعاد تنكركاد المستقلة ----
 * شريط أفقي ثابت أعلى مساحة العرض: لا يغطي لوحة الخصائص ولا مكتبة الأشكال،
 * ولا يختفي عند تحريك المجسّم أو تدوير المشهد. */
.t3d-dimcheck{position:absolute;z-index:38;top:102px;left:80px;transform:none;
  max-width:min(560px,calc(100% - 380px));padding:8px 15px 9px;border-radius:13px;direction:rtl;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  background:rgba(8,26,34,.94);border:1.6px solid rgba(231,160,99,.58);box-shadow:0 10px 26px rgba(0,0,0,.36)}
.t3d-dimcheck h4{margin:0;font-size:12.5px;font-weight:800;color:var(--copper-hi);white-space:nowrap}
.t3d-dimcheck ul{list-style:none;margin:0;padding:0;display:flex;gap:12px;flex-wrap:wrap}
.t3d-dimcheck li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#F5ECDD;white-space:nowrap}
.t3d-dimcheck li .bx{flex:0 0 19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:rgba(255,236,200,.34);background:rgba(255,255,255,.07);
  border:1.4px solid rgba(255,236,200,.24)}
.t3d-dimcheck li.on{color:#BFF0E6}
.t3d-dimcheck li.on .bx{background:#2E8C6E;border-color:#4FD3AE;color:#fff}
.t3d-dimcheck li small{color:var(--muted);font-size:10.5px;direction:ltr}
.t3d-dimcheck .ign{flex:1 1 100%;text-align:center;font-size:10.5px;line-height:1.5;color:var(--muted)}
@media (max-width:1300px){ .t3d-dimcheck{gap:10px;padding:7px 11px;left:60px;max-width:min(520px,calc(100% - 330px))} .t3d-dimcheck li{font-size:11.5px} .t3d-dimcheck li small{display:none} }

/* سقف أدق لرسوم البطاقات حتى لا يبتلع رسم واحد الشاشة */
.s2-fig .pic{max-height:300px}
.s2-fig .pic > svg{max-height:200px}


/* ================================================================
 * R2 — نظام أحجام الخطوط للصف الثالث (سلّم واحد لكل المنصة)
 * لا تكبير عشوائي: كل مقاس مرتبط بدوره الوظيفي، ومع كل تكبير
 * توسعة للمساحة أو تمرير داخلي — فلا يُقصّ نص ولا يختفي زر.
 * ================================================================ */
:root{
  --fs-title:24px;    /* عنوان النشاط */
  --fs-card:19px;     /* عنوان البطاقة */
  --fs-body:16.5px;   /* النص العربي الأساسي وتعليمات النشاط */
  --fs-btn:16px;      /* نص الأزرار */
  --fs-check:15.5px;  /* قوائم التحقق */
  --fs-en:13px;       /* المصطلح الإنجليزي الثانوي */
  --panel-w:306px;    /* عمود لوحة التعليمات بعد التكبير */
  --panel-gap:322px;  /* بداية مساحة العمل بعده */
}

/* --- لوحة التعليمات: أوسع، ونصّها أكبر، وتمرير داخلي بدل القصّ --- */
.s2-panel{width:var(--panel-w);max-height:calc(100% - 16px);display:flex;flex-direction:column}
.s2-panel .ph{flex:0 0 auto}
.s2-panel .ph b{font-size:16px;line-height:1.5}
.s2-panel .ph span{font-size:var(--fs-en)}
.s2-panel .pb{flex:1 1 auto;min-height:0;overflow-y:auto;gap:11px}
.s2-instr{font-size:var(--fs-body);line-height:1.85;color:var(--cream)}
.s2-instr .en{font-size:var(--fs-en);line-height:1.6}
.s2-checks li{font-size:var(--fs-check);line-height:1.7;gap:9px;align-items:flex-start}
.s2-checks li b{flex:0 0 24px;height:24px;font-size:13px}
.s2-checks li span{flex:1;min-width:0}
.s2-acts{gap:9px}

/* --- الأزرار: نص أكبر ومساحة لمس أكبر، بلا قصّ --- */
.s2-btn{font-size:var(--fs-btn);min-height:46px;padding:10px 18px;line-height:1.45;
  white-space:normal;overflow-wrap:break-word;height:auto}
.s2-btn.cmd{min-height:50px}
.s2-nav{font-size:var(--fs-btn);min-height:50px}
.s2-mvb{min-width:38px;min-height:38px;font-size:15px}

/* --- مساحة العمل تتبع عرض اللوحة الجديد --- */
.s2-work{left:var(--panel-gap)}
.s2-work.full{left:0}
.s2-theory{left:var(--panel-gap)}
.s2-quiz{left:var(--panel-gap)}
.s2-body.nopanel > .s2-theory,
.s2-body.nopanel > .s2-quiz{left:0;right:0}

/* --- العناوين والنصوص داخل الأنشطة --- */
.s2-hero h2{font-size:var(--fs-title);line-height:1.35}
.s2-hero p{font-size:var(--fs-body);line-height:1.9}
.s2-fig .cap b{font-size:var(--fs-card);line-height:1.45}
.s2-fig .cap .en{font-size:var(--fs-en)}
.s2-fig .cap p{font-size:15.5px;line-height:1.8}
.s2-note{font-size:var(--fs-body);line-height:1.9}
.s2-term{font-size:15.5px}
.s2-term span{font-size:var(--fs-en)}
.s2-howto b{font-size:var(--fs-card)}
.s2-howto span{font-size:var(--fs-body);line-height:1.85}
.s2-slot span{font-size:16px;line-height:1.5}
.s2-slot .n{font-size:15px}
.s2-fb{font-size:var(--fs-body);line-height:1.75}
.s2-unfinished{font-size:16px}
.s2-unfinished b{font-size:13px}
.s2-done h2{font-size:26px}
.s2-done p{font-size:var(--fs-body);line-height:1.9}
.s2-q,.s2-quiz h3{font-size:var(--fs-card);line-height:1.6}
.s2-opt{font-size:16px;min-height:48px;line-height:1.5;white-space:normal;height:auto}
.s2-why{font-size:15px;line-height:1.8}
.s2-station h4{font-size:var(--fs-card);line-height:1.55}
.s2-station .n{font-size:14px}
.s2-labstep .h b{font-size:var(--fs-card)}
.s2-labstep .h .sym{font-size:15.5px;line-height:1.7}
.s2-labstep p{font-size:15.5px;line-height:1.8}
.s2-labcase{font-size:15px;min-height:42px;line-height:1.4}
.s2-labsteps .st{font-size:14px}
.s2-ttl b{font-size:18.5px}
.s2-ttl small{font-size:var(--fs-en)}
.s2-code{font-size:16px;min-width:56px;height:38px}
.s2-step{font-size:14px;height:38px}
.s2-step::after{font-size:14px}
.t3d-dimcheck h4{font-size:14px}
.t3d-dimcheck li{font-size:14.5px}
.t3d-dimcheck li small{font-size:12.5px}
.t3d-dimcheck .ign{font-size:12.5px}
.bag-card .tx{font-size:17px}
.bag-card .no{font-size:20px}
.bag-verdict{font-size:16px}

/* أيقونة أمر الروبوت: عنصر مستقل معزول عن اتجاه RTL فلا ينقلب موضعها */
.s2-btn.cmd{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.cmd-icon{direction:ltr;unicode-bidi:isolate;display:inline-block;flex:0 0 auto;
  font-size:20px;line-height:1;font-weight:800;color:var(--copper-hi)}
.cmd-label{display:inline-block;font-size:var(--fs-btn);line-height:1.4}

/* --- الشاشات الأصغر: تصغير طفيف منضبط بدل القصّ --- */
@media (max-width:1400px){
  :root{--panel-w:288px;--panel-gap:304px;--fs-title:23px;--fs-card:18px}
}
@media (max-width:1300px){
  :root{--fs-body:16px;--fs-check:15px;--panel-w:274px;--panel-gap:290px}
  .s2-btn{padding:9px 14px}
}

/* نقطة لون البُعد داخل زر «أظهر بُعد …» */
.cmd-icon.dimdot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.s2-btn.cmd.on{border-color:var(--copper-hi);background:rgba(231,160,99,.2)}
.s2-solid .ctrls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:10px 8px}

/* ================= R2 — تخطيط رحلة القلم بلا تراكب =================
 * أعمدة وصفوف حقيقية: شريط المحطات ثم شرح المحطة ثم المحاكي في المساحة الباقية.
 * لوحة التعليمات في عمودها المستقل (.s2-work تبدأ بعدها)، فلا تغطي أي جزء. */
.s2-lab{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.s2-labrail{flex:0 0 auto;min-height:0;display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;overflow:visible}
.s2-labstep{flex:0 0 auto;min-height:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 14px;background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,236,200,.12)}
.s2-labstep .h{flex:1 1 320px;min-width:0;margin:0}
.s2-labstep .s2-btn{flex:0 0 auto;margin:0}
.s2-labstage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex}
.s2-labstage > .scratch{flex:1 1 auto;min-height:0;min-width:0}
/* المحاكي يملأ المساحة المتبقية ويمرّر داخليًا في لوح اللبنات وحده */
.s2-labstage .sc-main{min-height:0}
.s2-labstage .sc-palwrap{min-height:0;overflow-y:auto}
@media (max-height:760px){
  .s2-labrail{padding:6px 10px;gap:6px}
  .s2-labcase{min-height:36px;font-size:14px;padding:0 10px}
  .s2-labstep{padding:7px 12px;gap:10px}
  .s2-labstep .h .sym{display:none}
}


/* زر طيّ اللوحة داخل حدودها: لا يُقصّ ولا يغطّيه محتوى النشاط */
.s2-panel-tog{position:absolute;z-index:48;left:auto;right:auto;
  inset-inline-end:7px;top:7px;width:34px;height:34px;margin:0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
/* عند الطيّ تبقى اللوحة مقبضًا واضحًا بحجم لمس مريح، والزر داخله تمامًا */
.s2-panel.folded{width:50px;height:50px;min-height:50px;max-height:50px;overflow:visible}
.s2-panel.folded .s2-panel-tog{inset-inline-end:0;top:0;width:50px;height:50px;border-radius:var(--r-2)}
.s2-panel .ph{padding-inline-end:50px}


/* ================================================================
 * R3 — (أ) نصوص اللبنات التعليمية: لا نص داخل لبنة أقل من 15px
 * ================================================================ */
.s2-cmp{max-width:980px}
.s2-cmp .col{padding:16px}
.s2-cmp .b{min-height:44px;display:flex;align-items:center;line-height:1.4;
  white-space:nowrap;overflow:visible;text-overflow:clip}
.s2-cmp .s2-btn{font-size:16px;min-height:48px}
.s2-cmp .track{height:34px}
.s2-cmp .dot{top:6px;width:24px;height:24px}
/* أي لبنة تعليمية ثابتة داخل الشروح */
.sc-blk.stat{font-size:16px;min-height:42px;padding:9px 13px}
.sc-blk.stat .sc-in.ro{font-size:15.5px;min-height:26px;padding:2px 10px}
.sc-c.stat .sc-chead,.sc-c.stat .sc-cfoot{font-size:16px;min-height:42px}
.s2-statwrap,.sc-statwrap{padding:14px 16px}
.sc-statwrap .sc-blk{font-size:16px}

/* ================================================================
 * R3 — (ب) الوضع المتجاوب: تخطيط حقيقي بلا تصغير
 * ================================================================ */
body.rsp #stage{align-items:stretch;justify-content:stretch;padding:0}
body.rsp #stageInner{width:100%;height:100dvh;height:var(--vh,100dvh);
  border-radius:0;box-shadow:none;transform:none!important;transform-origin:0 0}
body.rsp{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* الشريط العلوي: العنوان في مساحته، والمراحل تُمرَّر أفقيًا */
body.rsp .s2-top{min-height:54px;padding:5px 8px;gap:8px;flex-wrap:nowrap}
body.rsp .s2-titlewrap{max-width:none;flex:1 1 auto}
body.rsp .s2-ttl b{font-size:17px;-webkit-line-clamp:1}
body.rsp .s2-ttl small{display:none}
body.rsp .s2-rail{flex:0 1 auto;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-inline:4px}
body.rsp .s2-rail::-webkit-scrollbar{height:4px}
body.rsp .s2-step{flex:0 0 auto;scroll-snap-align:center;min-width:46px;height:44px;font-size:14px}
body.rsp .s2-step span{max-width:0;opacity:0}
body.rsp .s2-step.live span{max-width:96px;opacity:1;margin-inline-start:5px}
body.rsp .s2-slot{padding:4px 6px;gap:5px}

/* لوحة التعليمات: درج قابل للفتح والإغلاق */
body.rsp .s2-panel{position:absolute;z-index:60;top:0;left:0;right:0;width:auto;
  max-height:min(62%,420px);border-radius:0 0 var(--r-2) var(--r-2);
  transform:translateY(0);transition:transform .22s ease}
body.rsp .s2-panel.folded{transform:translateY(calc(-100% + 0px));width:auto;height:auto;
  min-height:0;max-height:min(62%,420px);overflow:visible}
body.rsp .s2-panel-tog{inset-inline-end:8px;top:auto;bottom:-42px;width:52px;height:40px;
  border-radius:0 0 12px 12px;background:rgba(12,32,44,.97);border:1.5px solid rgba(231,160,99,.5);
  border-top:0;z-index:61}
body.rsp .s2-panel.folded .s2-panel-tog{width:52px;height:40px;border-radius:0 0 12px 12px;
  inset-inline-end:8px;top:auto;bottom:-42px}
/* مساحة النشاط تأخذ الشاشة كاملة تحت الدرج */
body.rsp .s2-work,body.rsp .s2-work.full,
body.rsp .s2-theory,body.rsp .s2-quiz{left:0;right:0}
body.rsp .s2-theory,body.rsp .s2-quiz{padding:12px 12px 16px}
body.rsp .s2-body.nopanel > .s2-theory,body.rsp .s2-body.nopanel > .s2-quiz{max-width:none}

/* الأنشطة النظرية تُرتَّب عموديًا بدل التصغير */
body.rsp .s2-hero{flex-direction:column;align-items:stretch;gap:12px;padding:14px}
body.rsp .s2-hero .art{max-width:100%;align-self:center}
body.rsp .s2-figrow{flex-direction:column}
body.rsp .s2-fig{flex:1 1 auto;min-width:0}
body.rsp .rb-wrap{flex-direction:column;align-items:center}
body.rsp .rb-side{max-width:none;width:100%}
body.rsp .s2-cmp .cols{flex-direction:column}

/* ---- لوحي/شاشات متوسطة ---- */
@media (max-width:1024px){
  :root{--fs-title:22px;--fs-card:18px;--fs-body:16px;--fs-btn:16px;--fs-check:15px}
  body.rsp .s2-theory{gap:12px}
}
@media (max-width:900px){
  body.rsp .s2-code{min-width:48px;height:34px;font-size:15px}
  body.rsp .s2-top{min-height:50px}
}
@media (max-width:700px){
  :root{--fs-title:20px;--fs-card:17px;--fs-body:15.5px;--fs-btn:15.5px;--fs-check:15px}
  body.rsp .s2-panel{max-height:min(70%,300px)}
  body.rsp .s2-theory,body.rsp .s2-quiz{padding:10px 10px 14px}
  body.rsp .s2-hero h2{font-size:20px}
}
/* هاتف أفقي: ارتفاع قليل جدًا */
@media (max-height:460px){
  body.rsp .s2-top{min-height:44px;padding:3px 6px}
  body.rsp .s2-step{height:40px}
  body.rsp .s2-panel{max-height:78%}
  body.rsp .s2-hero{padding:10px}
  body.rsp .s2-hero h2{font-size:19px}
}

/* ---- أهداف اللمس ---- */
@media (pointer:coarse){
  .s2-btn,.s2-nav,.s2-opt,.s2-labcase,.s2-step,.dock-btn,.s2-mvb,.s2-panel-tog{
    min-height:48px;min-width:48px}
  .s2-mvb{min-width:48px;min-height:48px;font-size:17px}
  .s2-checks li b{min-width:26px;min-height:26px}
  .s2-btn.cmd{min-height:52px}
  /* لا وظيفة تعتمد على hover */
  .sc-thumb .x{opacity:1}
}

/* ================================================================
 * R3 — (ج) شاشة تدوير الهاتف
 * ================================================================ */
.rotate-gate{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 100% at 50% 8%,#1a3d4a,#08161d 74%);
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.rotate-gate .rg-in{max-width:420px;text-align:center}
.rotate-gate .rg-ic{font-size:56px;line-height:1;margin-bottom:12px;
  animation:rgTilt 1.8s ease-in-out infinite}
@keyframes rgTilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
body.rm .rotate-gate .rg-ic{animation:none}
.rotate-gate h2{margin:0 0 10px;font-family:var(--font-title);font-size:24px;color:var(--sand-1)}
.rotate-gate p{margin:0 0 20px;font-size:17px;line-height:1.9;color:var(--cream)}
.rotate-gate .rg-btn{min-height:50px;padding:0 24px;border-radius:13px;cursor:pointer;
  font-size:16px;font-weight:700;color:#2a1608;
  background:linear-gradient(165deg,var(--copper-1),var(--copper-3));border:1.6px solid var(--copper-hi)}
/* لا يظهر أي جزء من التطبيق خلف الرسالة */
body.needs-rotate #stage{visibility:hidden}
body.needs-rotate{overflow:hidden}

/* الدرج المطويّ لا يزيح المحتوى، والعنوان لا يفيض */
body.rsp .s2-ttl b{overflow:hidden;-webkit-line-clamp:1;line-clamp:1;max-height:1.4em}
body.rsp.panel-folded .s2-work,body.rsp.panel-folded .s2-body .s2-theory,
body.rsp.panel-folded .s2-body .s2-quiz{left:0}
body.rsp .s2-panel-tog{box-shadow:0 6px 14px rgba(0,0,0,.4)}
body.rsp .s2-panel .pb{max-height:none}


/* R3 — الشريط العلوي على الشاشات الضيقة: مساحة أوسع للمراحل بلا قصّ */
body.rsp .s2-slot{flex:0 0 auto!important;padding:3px 4px;gap:4px}
body.rsp .s2-slot .dock-btn{min-width:44px;min-height:44px;padding:0 8px}
body.rsp .s2-slot .dock-btn .lbl,body.rsp .s2-slot .dock-btn span:not(.ic){display:none}
body.rsp .s2-rail{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden}
body.rsp .s2-step{max-width:none}
body.rsp .s2-titlewrap{flex:0 1 auto;max-width:34%}
@media (max-width:820px){
  body.rsp .s2-titlewrap .s2-ttl{display:none}
  body.rsp .s2-code{min-width:52px}
}

/* R3 — مقبض الدرج له شريط محجوز خاص به: لا يغطي أي محاكٍ أو زر
 * (كان يقع فوق زر Export في تنكركاد على اللوحي). */
body.rsp .s2-panel-tog{inset-inline-end:auto;inset-inline-start:10px;bottom:-40px;
  width:64px;height:36px;border-radius:0 0 12px 12px}
body.rsp .s2-panel.folded .s2-panel-tog{inset-inline-end:auto;inset-inline-start:10px;
  bottom:-40px;width:64px;height:36px;border-radius:0 0 12px 12px}
body.rsp .s2-work,body.rsp .s2-work.full,
body.rsp .s2-theory,body.rsp .s2-quiz{top:40px}
body.rsp .s2-body{--drawer-strip:40px}


/* ================================================================
 * R4 — (1) تذييل اسم الأستاذة: مساحة فعلية داخل التخطيط
 * الشاشة عمود مرن: العنوان ← البطاقات ← التذييل. لا تموضع مطلق فوق المحتوى.
 * ================================================================ */
.cit.s2hub-flow{display:flex;flex-direction:column;align-items:stretch;
  padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.cit.s2hub-flow .s2-head{position:static;transform:none;left:auto;top:auto;
  flex:0 0 auto;margin:18px auto 8px;max-width:min(760px,92%)}
.cit.s2hub-flow .unit-cards{position:static;transform:none;left:auto;top:auto;
  flex:1 1 auto;min-height:0;overflow-y:auto;align-content:center;justify-content:center;
  padding:4px 18px 10px;margin:0 auto;max-width:100%}
.cit.s2hub-flow .s2-author{position:static;transform:none;left:auto;bottom:auto;
  flex:0 0 auto;align-self:center;margin:6px auto 0;z-index:2}
.cit.s2hub-flow .clayer,.cit.s2hub-flow .catmo,.cit.s2hub-flow .cbeam,
.cit.s2hub-flow .cvig{position:absolute;z-index:0;pointer-events:none}
.s2-author{white-space:normal;text-align:center;max-width:min(560px,92%)}
/* لا يظهر خلف درج التعليمات ولا خلف شاشة التدوير */
body.needs-rotate .s2-author{display:none}

/* ================================================================
 * R4 — (2) زر إظهار/إخفاء التعليمات داخل رأس اللوحة
 * ================================================================ */
.s2-panel .ph{display:flex;align-items:flex-start;gap:10px;padding-inline-end:12px;
  position:sticky;top:0;z-index:3;background:inherit}
.s2-panel .ph .ph-tx{flex:1 1 auto;min-width:0}
.s2-panel-tog{position:static!important;inset:auto!important;transform:none!important;
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:48px;min-height:48px;padding:0 12px;margin:0;border-radius:12px;cursor:pointer;
  font-family:var(--font-body);font-size:14px;font-weight:800;color:var(--cream);
  background:rgba(255,255,255,.09);border:1.5px solid rgba(255,236,200,.34);
  box-shadow:none;white-space:nowrap}
.s2-panel-tog:hover,.s2-panel-tog:focus-visible{background:rgba(231,160,99,.22);
  border-color:var(--copper-hi);outline:none}
.s2-panel-tog .ic{font-size:16px;line-height:1}
.s2-panel.folded .ph{padding-bottom:8px}
.s2-panel.folded .pb{display:none}
/* مطويّة: تبقى بحجم رأسها فقط والزر ظاهر دائمًا */
.s2-panel.folded{width:auto;min-width:0;height:auto;min-height:0;max-height:none;overflow:visible}
.s2-panel.folded .ph .ph-tx{display:none}
body.panel-folded .s2-work,body.panel-folded .s2-body .s2-theory,
body.panel-folded .s2-body .s2-quiz{left:96px}

/* الوضع المتجاوب: الدرج ينزلق لكن رأسه (وفيه الزر) يبقى ظاهرًا دائمًا */
body.rsp .s2-panel{transform:none;top:0;max-height:min(62%,420px);
  display:flex;flex-direction:column}
body.rsp .s2-panel .ph{flex:0 0 auto}
body.rsp .s2-panel .pb{flex:1 1 auto;min-height:0;overflow-y:auto}
body.rsp .s2-panel.folded{max-height:none;height:auto}
body.rsp .s2-panel-tog{min-height:48px}
body.rsp.panel-folded .s2-work,body.rsp.panel-folded .s2-body .s2-theory,
body.rsp.panel-folded .s2-body .s2-quiz{left:0;top:62px}
body.rsp .s2-work,body.rsp .s2-work.full,
body.rsp .s2-theory,body.rsp .s2-quiz{top:0}
body.rsp:not(.panel-folded) .s2-work,body.rsp:not(.panel-folded) .s2-theory,
body.rsp:not(.panel-folded) .s2-quiz{top:62px}

/* ================================================================
 * R4 — (4) صفحة فهم الطالب: بطاقات بارتفاع محتواها ومسافات 14px
 * ================================================================ */
.s2-selfwrap{display:block;overflow-y:auto}
.s2-selfcheck{display:flex;flex-direction:column;gap:14px;margin:10px auto 4px;
  max-width:820px;width:100%}
.s2-selfcheck .item{display:flex;align-items:flex-start;gap:12px;
  padding:13px 15px;border-radius:12px;height:auto;min-height:0;flex:0 0 auto;
  background:rgba(255,255,255,.05);border:1.4px solid rgba(255,236,200,.18);
  cursor:pointer;transition:background .14s,border-color .14s}
.s2-selfcheck .item:hover,.s2-selfcheck .item:focus-visible{background:rgba(255,255,255,.09);
  border-color:rgba(231,160,99,.5);outline:none}
.s2-selfcheck .item .box{flex:0 0 26px;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  font-size:15px;font-weight:900;color:transparent;
  background:rgba(255,255,255,.07);border:1.8px solid rgba(255,236,200,.4)}
.s2-selfcheck .item.on{background:rgba(59,145,136,.18);border-color:rgba(95,184,174,.6)}
.s2-selfcheck .item.on .box{background:var(--teal-1);border-color:var(--teal-hi);color:#06231f}
.s2-selfcheck .item.on .box::after{content:'✓'}
.s2-selfcheck .item .tx{flex:1 1 auto;min-width:0;font-size:16.5px;line-height:1.75;
  color:var(--cream);word-break:break-word}
@media (pointer:coarse){ .s2-selfcheck .item{min-height:52px} }

/* R4 — الدرج المطويّ يبقى ظاهرًا: شريط رفيع فيه زر «عرض التعليمات» */
body.rsp .s2-panel.folded{transform:none!important;top:0;left:0;right:0;width:auto;
  max-height:none;height:auto;min-height:0;border-radius:0 0 var(--r-2) var(--r-2);
  overflow:visible;z-index:60}
body.rsp .s2-panel.folded .ph{padding:6px 10px;justify-content:flex-end;position:static}
body.rsp .s2-panel.folded .s2-panel-tog{min-height:48px}
body.rsp .s2-panel:not(.folded){top:0}

/* R4 — رأس اللوحة (وفيه زر العرض/الإخفاء) يبقى ظاهرًا دائمًا حتى عند الطيّ */
.s2-panel.folded .ph{display:flex!important;padding:7px 9px;justify-content:flex-end}
.s2-panel.folded .pb{display:none!important}
.s2-panel.folded .s2-panel-tog{display:inline-flex!important}

/* R4 — رأس اللوحة عمود: العنوان ثم زر الإظهار/الإخفاء بعرض كامل
 * (كان الزر يُضغط في صف واحد فيخرج نصه خارج حدود اللوحة). */
.s2-panel .ph{flex-direction:column;align-items:stretch;gap:8px;padding-inline-end:12px}
.s2-panel .ph .ph-tx{flex:0 0 auto;min-width:0}
.s2-panel-tog{align-self:stretch;width:auto;max-width:100%;justify-content:center;
  padding:0 10px;overflow:hidden}
.s2-panel-tog .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.s2-panel.folded .ph{align-items:flex-end;flex-direction:column}
.s2-panel.folded .s2-panel-tog{align-self:flex-end;width:auto}
body.rsp .s2-panel .ph{flex-direction:row;align-items:center;justify-content:space-between}
body.rsp .s2-panel .ph .ph-tx{flex:1 1 auto;min-width:0;overflow:hidden}
body.rsp .s2-panel-tog{align-self:auto;flex:0 0 auto;width:auto}


/* ================================================================
 * R5 — (1) زر التعليمات: النص كامل بلا قصّ في الحالتين
 * ================================================================ */
.s2-panel-tog{overflow:visible;white-space:nowrap;width:auto;max-width:none;
  padding:0 14px;min-height:48px;flex:0 0 auto}
.s2-panel-tog .tx{overflow:visible;text-overflow:clip;white-space:nowrap;
  font-size:14.5px;font-weight:800}
body.rsp .s2-panel-tog{padding:0 12px}
body.rsp .s2-panel-tog .tx{font-size:14px}
@media (max-width:700px){ .s2-panel-tog{padding:0 10px} .s2-panel-tog .tx{font-size:13.5px} }

/* ================================================================
 * R5 — (2) اللوحة المفتوحة: بحجم محتواها، بلا فراغ ولا تغطية للنشاط
 * ================================================================ */
.s2-panel{height:auto;align-self:flex-start}
.s2-panel .pb{flex:0 1 auto;min-height:0}
.s2-panel .s2-acts{margin-top:auto}
body.rsp .s2-panel{height:auto;max-height:min(58%,360px)}
body.rsp .s2-panel .pb{flex:0 1 auto;overflow-y:auto}
body.rsp .s2-panel.folded{max-height:none}
/* الدرج المفتوح يُزيح النشاط بارتفاعه الفعلي بدل أن يطفو فوقه */
body.rsp:not(.panel-folded) .s2-work,
body.rsp:not(.panel-folded) .s2-theory,
body.rsp:not(.panel-folded) .s2-quiz{top:var(--drawer-h,62px)}
body.rsp.panel-folded .s2-work,
body.rsp.panel-folded .s2-theory,
body.rsp.panel-folded .s2-quiz{top:var(--drawer-h,62px)}

/* ================================================================
 * R5 — (3) بطاقات اللبنات التعليمية: كاملة ومتمركزة بلا قصّ
 * ================================================================ */
.sc-statwrap{display:block;width:100%;max-width:100%;box-sizing:border-box;
  overflow:visible;margin:0 auto;text-align:center}
.sc-statwrap > .sc-stack{display:inline-flex;flex-direction:column;align-items:flex-start;
  text-align:start;max-width:100%}
.sc-blk.stat{white-space:nowrap}
.s2-opt .sc-statwrap,.s2-fig .sc-statwrap{width:100%}
.s2-fig .pic{overflow:visible}
.s2-opt{overflow:visible}
.s2-q .s2-opts{align-items:stretch}

/* ================================================================
 * R5 — (5) خطوات مرقّمة موحّدة: الرقم بجانب النص في البطاقة نفسها
 * ================================================================ */
.s2-steplist{display:flex;flex-direction:column;gap:14px;width:100%;
  max-width:860px;margin:2px auto}
.s2-steplist .step{display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;border-radius:12px;height:auto;min-height:0;flex:0 0 auto;
  background:rgba(255,255,255,.05);border:1.4px solid rgba(255,236,200,.18)}
.s2-steplist .step .n{flex:0 0 34px;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  font-family:var(--font-title);font-size:17px;font-weight:800;color:#2a1608;
  background:linear-gradient(165deg,var(--copper-1),var(--copper-2));
  border:1.5px solid var(--copper-hi)}
.s2-steplist .step .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.s2-steplist .step .tx .a{font-size:16.5px;line-height:1.7;color:var(--cream);
  font-weight:700;word-break:break-word}
.s2-steplist .step .tx .en{font-size:12.5px;line-height:1.55;color:var(--muted);direction:ltr}
@media (pointer:coarse){ .s2-steplist .step{min-height:52px} }
@media (max-width:700px){
  .s2-steplist{gap:12px}
  .s2-steplist .step{padding:11px 12px;gap:10px}
  .s2-steplist .step .n{flex:0 0 30px;width:30px;height:30px;font-size:15px}
  .s2-steplist .step .tx .a{font-size:15.5px}
}
/* بطاقات الترتيب الحالية تتبع الأسلوب نفسه */
.s2-order .s2-slot{align-items:flex-start;padding:11px 13px;height:auto;min-height:0}
.s2-order .s2-slot .n{flex:0 0 32px;width:32px;height:32px;border-radius:50%;font-size:16px}
.s2-order .s2-slot span{flex:1 1 auto;min-width:0;line-height:1.6}

/* R5 — الدرج المفتوح يُزيح النشاط بارتفاعه الفعلي (يُضبط برمجيًا) */
body.rsp .s2-work,body.rsp .s2-work.full,
body.rsp .s2-theory,body.rsp .s2-quiz{top:var(--drawer-h,62px)}
body.rsp .s2-work,body.rsp .s2-work.full,
body.rsp .s2-theory,body.rsp .s2-quiz{top:calc(var(--drawer-h,62px) + 2px)}

/* R5 — عرض اللوحة مرجع واحد لمساحة النشاط فلا تتداخلان */
:root{--panel-gap:calc(var(--panel-w) + 26px)}
@media (max-width:1400px){ :root{--panel-gap:calc(var(--panel-w) + 26px)} }
@media (max-width:1300px){ :root{--panel-gap:calc(var(--panel-w) + 24px)} }
.s2-panel{box-sizing:border-box;width:var(--panel-w);max-width:var(--panel-w)}
.s2-panel.folded{width:auto;max-width:none}
body.rsp .s2-panel{width:auto;max-width:none}

/* R5 — تصحيحات نهائية */
/* (أ) زر الدرج: عرضه حسب نصه دائمًا في الوضع المتجاوب */
body.rsp .s2-panel-tog,
body.rsp .s2-panel.folded .s2-panel-tog{width:auto!important;max-width:none!important;
  height:auto!important;min-height:48px;padding:0 14px;border-radius:12px;overflow:visible}
/* (ب) مساحة النشاط تبدأ بعد اللوحة دائمًا */
body .s2-body .s2-theory,body .s2-body .s2-quiz,body .s2-body .s2-work{
  left:calc(var(--panel-w) + 26px)}
body .s2-body .s2-work.full{left:calc(var(--panel-w) + 26px)}
body.panel-folded .s2-body .s2-theory,body.panel-folded .s2-body .s2-quiz,
body.panel-folded .s2-body .s2-work,body.panel-folded .s2-body .s2-work.full{left:104px}
body.rsp .s2-body .s2-theory,body.rsp .s2-body .s2-quiz,
body.rsp .s2-body .s2-work,body.rsp .s2-body .s2-work.full{left:0;right:0}
body.s2-nopanel .s2-body.nopanel > .s2-theory{left:0}
.s2-body.nopanel > .s2-theory,.s2-body.nopanel > .s2-quiz{left:0!important;right:0!important}
/* (ج) لبنات البطاقات التعليمية بعرض محتواها بلا قصّ داخلي */
.sc-statwrap .sc-blk,.sc-statwrap .sc-c{width:max-content;max-width:none}
.sc-statwrap .sc-blk.stat{overflow:visible}

/* ==== styles/scratch.css ==== */
/* ==== styles/scratch.css — محاكي Scratch 3 ====
 * الألوان والمواضع مطابقة لواجهة Scratch 3 الواردة في كتاب التلميذ،
 * حتى لا يشعر التلميذ أن البرنامج مختلف عندما ينتقل إلى Scratch الحقيقي.
 */
:root{
  --sc-motion:#4C97FF; --sc-motion-d:#3373CC;
  --sc-looks:#9966FF;  --sc-looks-d:#774DCB;
  --sc-sound:#CF63CF;  --sc-sound-d:#BD42BD;
  --sc-events:#FFBF00; --sc-events-d:#CC9900;
  --sc-control:#FFAB19;--sc-control-d:#CF8B17;
  --sc-sensing:#5CB1D6;--sc-operators:#59C059;--sc-variables:#FF8C1A;
  --sc-pen:#0FBD8C;    --sc-pen-d:#0B8E69;
  --sc-bar:#4C97FF;    --sc-panel:#F9F9F9; --sc-line:#D9D9D9; --sc-ink:#575E75;
}

.scratch{position:absolute;inset:0;background:#E8EDF2;display:flex;flex-direction:column;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;user-select:none}

/* ---------- شريط التطبيق ---------- */
.sc-bar{flex:0 0 36px;background:var(--sc-bar);display:flex;align-items:center;gap:2px;padding:0 8px;color:#fff;direction:ltr}
.sc-barspacer{flex:1}
.sc-menu.globe{font-size:12px;padding:4px 8px}
.sc-logo{height:22px;display:flex;align-items:center;margin-inline-end:8px}
.sc-menu{min-height:26px;padding:4px 11px;border-radius:5px;cursor:pointer;font-size:13px;color:#fff;
  background:transparent;border:0;direction:ltr}
.sc-menu:hover,.sc-menu.on{background:rgba(0,0,0,.14)}
.sc-projname{margin-inline-start:10px;min-height:26px;padding:3px 10px;border-radius:5px;background:#fff;color:#575E75;
  font-size:12.5px;display:flex;align-items:center;direction:ltr;min-width:130px}
.sc-drop{position:absolute;z-index:60;min-width:230px;background:#fff;border-radius:6px;padding:5px 0;
  box-shadow:0 6px 22px rgba(0,0,0,.28);border:1px solid var(--sc-line)}
.sc-drop .it{min-height:38px;display:flex;align-items:center;padding:8px 14px;font-size:13px;color:#575E75;cursor:pointer;direction:ltr;gap:8px}
.sc-drop .it:hover{background:#E9F1FC;color:#4C97FF}
.sc-drop .sep{height:1px;background:var(--sc-line);margin:4px 0}

/* ---------- التخطيط الأساسي: يسار لبنات ووسط سكربت ويمين منصة ---------- */
.sc-main{flex:1;display:flex;min-height:0;direction:ltr}
.sc-left{flex:0 0 330px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--sc-line);min-height:0}
.sc-tabs{flex:0 0 38px;display:flex;gap:4px;padding:4px 6px 0;background:var(--sc-panel);border-bottom:1px solid var(--sc-line)}
.sc-tab{min-height:32px;padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--sc-ink);background:#E6EBF0;border:1px solid var(--sc-line);border-bottom:0;display:flex;align-items:center;gap:6px}
.sc-tab.on{background:#fff;color:#4C97FF}

.sc-palwrap{flex:1;display:flex;min-height:0}
.sc-cats{flex:0 0 62px;background:#fff;border-right:1px solid var(--sc-line);overflow-y:auto;
  padding:4px 0 6px;display:flex;flex-direction:column;align-items:stretch}
.sc-cats::-webkit-scrollbar{width:6px}.sc-cats::-webkit-scrollbar-thumb{background:#CBD3DB;border-radius:3px}
.sc-cat{width:100%;padding:5px 2px 4px;cursor:pointer;background:transparent;border:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.sc-cat i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.10)}
.sc-cat span{font-size:9.5px;line-height:1.15;color:var(--sc-ink);direction:ltr;text-align:center}
.sc-cat.on{background:#F0F4F8}
.sc-cat.on::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 2px 2px 0;background:#4C97FF}
.sc-cat.on span{font-weight:700;color:#2b3350}
.sc-addext-wrap{margin-top:auto;padding:8px 0 2px;display:flex;justify-content:center}
.sc-addext{width:34px;height:34px;border-radius:9px;cursor:pointer;background:#4C97FF;color:#fff;
  border:0;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(76,151,255,.45)}
.sc-addext:hover{background:#3373CC}

.sc-pal{flex:1;overflow-y:auto;padding:9px 10px 60px;background:#F9F9F9;min-width:0}
.sc-palitem{margin:0 0 11px}
.sc-palitem .sc-blk{margin:0 0 2px}
.sc-palar{font-size:10.5px;color:#7b8494;line-height:1.35;padding-inline-start:3px;direction:rtl}
.sc-pal h5{margin:2px 0 9px;font-size:13px;color:var(--sc-ink);direction:ltr;display:flex;align-items:center;gap:7px}
.sc-pal h5 .dot{width:13px;height:13px;border-radius:50%;display:block;border:1.5px solid rgba(0,0,0,.12)}
.sc-pal h5 b{font-weight:800;color:#3d4653}
.sc-pal h5 span{direction:rtl;font-size:11.5px;color:#8b93a5;font-weight:600}
.sc-blk.pal{opacity:.94}
.sc-blk.pal.focus{opacity:1;box-shadow:0 1px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,216,107,.55)}

/* ---------- شكل اللبنة ---------- */
.sc-blk{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;
  min-height:34px;padding:5px 11px;margin:0 0 9px;border-radius:5px;cursor:grab;
  color:#fff;font-size:12.5px;font-weight:600;direction:ltr;white-space:nowrap;
  box-shadow:0 1px 0 rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.16)}
.sc-blk::before{content:"";position:absolute;top:-1px;left:12px;width:17px;height:5px;
  border-radius:0 0 4px 4px;background:inherit;border:1px solid rgba(0,0,0,.16);border-top:0;display:none}
.sc-blk::after{content:"";position:absolute;bottom:-6px;left:12px;width:17px;height:5px;
  border-radius:0 0 4px 4px;background:inherit;border:1px solid rgba(0,0,0,.16);border-top:0}
.sc-blk[data-hat="1"]{border-radius:16px 16px 5px 5px;padding-top:12px}
.sc-blk[data-hat="1"]::before{display:none}
.sc-blk.motion{background:var(--sc-motion);border-color:var(--sc-motion-d)}
.sc-blk.looks{background:var(--sc-looks);border-color:var(--sc-looks-d)}
.sc-blk.sound{background:var(--sc-sound);border-color:var(--sc-sound-d)}
.sc-blk.events{background:var(--sc-events);border-color:var(--sc-events-d)}
.sc-blk.control{background:var(--sc-control);border-color:var(--sc-control-d)}
.sc-blk.pen{background:var(--sc-pen);border-color:var(--sc-pen-d)}
/* الفئات الأربع التي كانت ناقصة: لبناتها كانت تظهر بيضاء بنص أبيض غير مقروء */
.sc-blk.sensing{background:var(--sc-sensing);border-color:#3E8AB0}
.sc-blk.operators{background:var(--sc-operators);border-color:#3F9C3F}
.sc-blk.variables{background:var(--sc-variables);border-color:#DB6E0F}
.sc-blk.myblocks{background:#FF6680;border-color:#D9435F}
/* ضمان التباين: نص اللبنة أبيض دائمًا فوق خلفية ملوّنة، ولا لبنة بلا خلفية */
.sc-blk{color:#fff!important;text-shadow:0 1px 0 rgba(0,0,0,.14)}
.sc-blk:not(.motion):not(.looks):not(.sound):not(.events):not(.control):not(.pen):not(.sensing):not(.operators):not(.variables):not(.myblocks){background:#7C8794;border-color:#5A6570}
.sc-blk.pal .sc-in,.sc-blk.pal .sc-sel,.sc-blk.pal .sc-swatch,.sc-c.pal .sc-in{pointer-events:none}
.sc-blk.grab{cursor:grabbing;opacity:.94;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sc-blk.glow{outline:3px solid #FFD86B;outline-offset:2px}
.sc-blk.running{filter:brightness(1.16);outline:3px solid #FFF07A;outline-offset:1px}

/* حقول القيم داخل اللبنة */
.sc-in{min-width:42px;height:24px;padding:0 7px;border-radius:12px;border:1px solid rgba(0,0,0,.2);
  background:#fff;color:#575E75;font-size:12.5px;font-weight:700;text-align:center;direction:ltr;
  font-family:inherit;outline:none}
.sc-in:focus{border-color:#FFF;box-shadow:0 0 0 2px #FFD86B}
.sc-in.txt{min-width:76px;border-radius:12px}
.sc-sel{height:24px;border-radius:12px;border:1px solid rgba(0,0,0,.2);background:rgba(0,0,0,.16);
  color:#fff;font-size:12px;font-weight:700;padding:0 5px;direction:ltr;font-family:inherit}
.sc-turnic{width:16px;height:16px;display:inline-block;vertical-align:-3px}
.sc-swatch{width:22px;height:20px;border-radius:5px;border:2px solid #fff;cursor:pointer;display:inline-block;vertical-align:-4px}

/* لبنة C (التكرار) */
.sc-c{position:relative;margin:0 0 9px;display:flex;flex-direction:column;align-items:flex-start;width:max-content}
.sc-c .sc-chead,.sc-c .sc-cfoot{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:34px;
  padding:5px 11px;border-radius:5px;color:#fff;font-size:12.5px;font-weight:600;direction:ltr;
  background:var(--sc-control);border:1px solid var(--sc-control-d);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sc-c .sc-cfoot{min-width:78px;border-radius:0 0 5px 5px}
.sc-c .sc-cbody{margin-left:16px;min-height:20px;padding:4px 0 4px 6px;border-left:16px solid var(--sc-control);
  display:flex;flex-direction:column;align-items:flex-start;
  background:transparent}
.sc-c .sc-cbody.empty{min-height:28px}
.sc-c .sc-cbody .sc-drop-hint{height:22px;border-radius:5px;border:2px dashed rgba(0,0,0,.28);opacity:.5}

/* ---------- منطقة المقطع البرمجي ---------- */
.sc-mid{flex:1;position:relative;background:#F9F9F9;overflow:auto;min-width:0;
  background-image:radial-gradient(#DDD 1px,transparent 1px);background-size:22px 22px}
.sc-scripts{position:relative;min-width:100%;min-height:100%;padding:16px}
.sc-stack{position:absolute;display:flex;flex-direction:column;align-items:flex-start;width:max-content}
.sc-snap{position:absolute;height:6px;border-radius:3px;background:#FFD86B;box-shadow:0 0 8px rgba(255,216,107,.9);pointer-events:none;z-index:30}
.sc-trash{position:absolute;bottom:10px;right:10px;width:52px;height:52px;border-radius:50%;background:#fff;
  border:2px dashed var(--sc-line);display:flex;align-items:center;justify-content:center;font-size:22px;
  color:var(--sc-ink);z-index:20}
.sc-trash.hot{border-color:#CF6A4C;background:#FDECE7;color:#CF6A4C}
.sc-hintarea{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  color:#B7BFCC;font-size:14px;direction:rtl}

/* ---------- المنصة ولوحة الكائن ---------- */
.sc-right{flex:0 0 344px;display:flex;flex-direction:column;background:var(--sc-panel);
  border-left:1px solid var(--sc-line);min-height:0}
.sc-stagehead{flex:0 0 32px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--sc-line)}
.sc-ctl{width:30px;height:26px;border-radius:5px;cursor:pointer;background:transparent;border:0;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.sc-ctl:hover{background:#E9F1FC}
.sc-ctl.go{color:#4CBF56}.sc-ctl.stop{color:#EC5959}
.sc-ctl.on{background:#E9F1FC}
.sc-sizectl{margin-inline-start:auto;display:flex;gap:3px}

.sc-stage{flex:0 0 auto;width:344px;height:258px;background:#fff;position:relative;overflow:hidden;
  border-bottom:1px solid var(--sc-line)}
/* السبب الجذري لاختفاء أثر القلم: الخلفية (z-index:1) كانت تُرسم فوق قماش القلم
 * (z-index:auto = 0). القماش الآن بين الخلفية والكائنات فيظهر الأثر للطالب. */
.sc-stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.sc-sprite{position:absolute;transform-origin:50% 50%;pointer-events:none;z-index:5}
/* فقاعة الكلام: ملتصقة بصاحبها وذيلها يشير إليه (‎--tail يُضبط برمجيًا) */
.sc-bubble{position:absolute;z-index:9;max-width:160px;padding:7px 11px;border-radius:13px;background:#fff;
  border:1.8px solid #9AA3B2;color:#3C4457;font-size:13.5px;font-weight:700;line-height:1.5;
  pointer-events:none;direction:rtl;box-shadow:0 3px 10px rgba(0,0,0,.16);white-space:normal;word-break:break-word}
.sc-bubble::after{content:"";position:absolute;bottom:-9px;left:var(--tail,14px);width:0;height:0;
  border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.sc-bubble::before{content:"";position:absolute;bottom:-12px;left:calc(var(--tail,14px) - 1px);width:0;height:0;
  border:10px solid transparent;border-top-color:#9AA3B2;border-bottom:0}
.sc-bubble.below::after{bottom:auto;top:-9px;border-top-color:transparent;border-bottom-color:#fff;border-top:0}
.sc-bubble.below::before{bottom:auto;top:-12px;border-top-color:transparent;border-bottom-color:#9AA3B2;border-top:0}
.sc-bubble.think{border-radius:18px;border-style:dashed}
.sc-fullnote{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:9;font-size:11px;color:#8b93a5;direction:rtl}

.sc-spritebar{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sc-props{display:flex;flex-wrap:wrap;gap:5px 8px;padding:7px 9px;border-bottom:1px solid var(--sc-line);background:#fff}
.sc-prop{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--sc-ink);direction:ltr}
.sc-prop b{font-weight:700}
.sc-prop input{width:46px;height:24px;border-radius:12px;border:1px solid var(--sc-line);text-align:center;
  font-size:11.5px;font-family:inherit;color:#575E75;outline:none}
.sc-prop .rot{display:flex;gap:3px}
.sc-rotb{min-width:30px;height:26px;border-radius:6px;cursor:pointer;border:1px solid var(--sc-line);background:#fff;
  font-size:12px;color:var(--sc-ink)}
.sc-rotb.on{background:#4C97FF;color:#fff;border-color:#3373CC}

.sc-list{flex:1;display:flex;min-height:0}
.sc-sprites{flex:1;padding:7px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;overflow-y:auto;background:#fff}
.sc-thumb{width:66px;min-height:66px;border-radius:8px;border:2px solid transparent;background:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;position:relative}
.sc-thumb.on{border-color:#4C97FF;background:#E9F1FC}
.sc-thumb span{font-size:10.5px;color:var(--sc-ink);direction:ltr}
/* علامة الحذف ظاهرة دائمًا لكل كائن — حتى لو كان الكائن الوحيد */
.sc-sprites{padding:12px 9px 9px}
.sc-thumb .x{position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;background:#EC5959;color:#fff;
  font-size:13px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:pointer;z-index:4;opacity:.9}
.sc-thumb .x:hover,.sc-thumb.on .x,.sc-thumb:hover .x{opacity:1;background:#D93B3B}
/* مقطع يعمل الآن بعد النقر عليه — تمييز واضح بلا حركة تُربك النقر */
.sc-stack.glow{box-shadow:0 0 0 3px rgba(255,171,25,.75);border-radius:10px}
.sc-emptystage{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:82%;text-align:center;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;
  color:#33475B;background:rgba(255,255,255,.94);border:1.6px dashed #9FB4C7;line-height:1.7}
.sc-stagecol{flex:0 0 82px;border-left:1px solid var(--sc-line);background:#F2F4F7;padding:7px 6px;text-align:center}
.sc-stagecol .lbl{font-size:10.5px;color:var(--sc-ink);direction:ltr;margin-bottom:5px}
.sc-stagecol .bd{width:66px;height:50px;border-radius:6px;border:2px solid #4C97FF;background:#fff;margin:0 auto;overflow:hidden}
.sc-addbtn{position:absolute;bottom:8px;width:44px;height:44px;border-radius:50%;background:#4C97FF;color:#fff;
  border:0;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:12}
.sc-addbtn.sprite{right:96px}
.sc-addbtn.backdrop{right:16px}

/* ---------- مكتبات الاختيار ---------- */
.sc-lib{position:absolute;inset:0;z-index:70;background:rgba(20,32,48,.55);display:flex;align-items:center;justify-content:center}
.sc-libwin{width:min(700px,92%);max-height:86%;border-radius:12px;background:#fff;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.42)}
.sc-libhead{flex:0 0 46px;background:#4C97FF;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;font-size:14px}
.sc-libhead .x{margin-inline-start:auto;cursor:pointer;font-size:19px;min-width:34px;min-height:34px;
  display:flex;align-items:center;justify-content:center;border-radius:6px}
.sc-libhead .x:hover{background:rgba(0,0,0,.15)}
.sc-libtabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap;border-bottom:1px solid var(--sc-line)}
.sc-libtab{min-height:34px;padding:6px 13px;border-radius:16px;cursor:pointer;font-size:12.5px;color:var(--sc-ink);
  background:#EEF1F5;border:1px solid var(--sc-line);direction:ltr}
.sc-libtab.on{background:#4C97FF;color:#fff;border-color:#3373CC}
.sc-libgrid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.sc-libit{border-radius:10px;border:2px solid var(--sc-line);background:#fff;cursor:pointer;padding:8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:112px}
.sc-libit:hover{border-color:#4C97FF;box-shadow:0 4px 12px rgba(76,151,255,.24)}
.sc-libit .nm{font-size:11.5px;color:var(--sc-ink);direction:ltr;text-align:center}
.sc-libit .pv{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px}

/* ---------- حوارات النظام (حفظ/فتح) ---------- */
.sc-dlg{position:absolute;inset:0;z-index:75;background:rgba(20,32,48,.5);display:flex;align-items:center;justify-content:center}
.sc-dlgwin{width:min(600px,92%);border-radius:8px;background:#F3F3F3;overflow:hidden;border:1px solid #C9CDD4;
  box-shadow:0 18px 48px rgba(0,0,0,.4);font-size:13px;color:#22303f}
.sc-dlgtitle{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid #DCE0E6;direction:ltr}
.sc-dlgpath{height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#fff;border-bottom:1px solid #E6E9EE;
  font-size:12px;color:#5b6b7c;direction:ltr}
.sc-dlgbody{display:flex;min-height:180px;background:#fff}
.sc-dlgside{flex:0 0 140px;border-right:1px solid #E6E9EE;padding:8px 6px;background:#FAFBFC}
.sc-dlgside .f{min-height:34px;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:#3d4b5a;direction:ltr}
.sc-dlgside .f.on,.sc-dlgside .f:hover{background:#E9F1FC;color:#2f6fd0}
.sc-dlgfiles{flex:1;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.sc-dlgfile{width:104px;min-height:88px;border-radius:6px;border:1.6px solid transparent;cursor:pointer;padding:7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.sc-dlgfile:hover{background:#F0F6FF}
.sc-dlgfile.sel{background:#DCEBFF;border-color:#4C97FF}
.sc-dlgfile .nm{font-size:11.5px;color:#3d4b5a;direction:ltr;word-break:break-all}
.sc-dlgfoot{padding:10px 12px;background:#F3F3F3;border-top:1px solid #DCE0E6;display:flex;align-items:center;gap:9px}
.sc-dlgfoot label{font-size:12.5px;color:#3d4b5a;direction:ltr}
.sc-dlgfoot input{flex:1;height:30px;border-radius:4px;border:1px solid #B9C0C9;padding:0 9px;font-size:12.5px;
  font-family:inherit;direction:ltr;outline:none}
.sc-dlgbtn{min-height:48px;min-width:96px;padding:8px 16px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;
  background:#4C97FF;color:#fff;border:1px solid #3373CC}
.sc-dlgbtn.ghost{background:#fff;color:#3d4b5a;border-color:#B9C0C9}
.sc-dlgbtn:disabled{opacity:.5;cursor:default}

/* ---------- سطح المكتب المصغّر لفتح Scratch ---------- */
.sc-desk{position:absolute;inset:0;background:linear-gradient(160deg,#1b4a63,#0d2836);overflow:hidden}
.sc-deskicons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:14px}
.sc-deskic{width:78px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:8px}
.sc-deskic:hover{background:rgba(255,255,255,.12)}
.sc-deskic span{font-size:11.5px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}

.sc-libit.on{border-color:#4C97FF;background:#E9F1FC}
.sc-xbtn{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#EC5959;
  color:#fff;border:0;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.sc-prop input.nm{height:24px;border-radius:6px;border:1px solid var(--sc-line);padding:0 7px;
  font-size:11.5px;font-family:inherit;color:#575E75;outline:none;direction:ltr}
.sc-prop input.nm:focus{border-color:#4C97FF}
.sc-stage{cursor:grab}

/* ===== Scratch 3 enhanced fidelity ===== */
.sc-pal-sep{height:1px;background:#D8DDE5;margin:8px 2px 12px}
.sc-make-actions{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.sc-make-btn{min-height:32px;padding:6px 11px;border-radius:6px;border:1px solid #D9435F;background:#FF6680;color:#fff;
  font-size:11.5px;font-weight:700;cursor:pointer;direction:ltr}
.sc-make-btn:hover{filter:brightness(1.06)}
.sc-blk.shape-reporter{border-radius:18px;min-height:30px;padding-inline:12px}
.sc-blk.shape-reporter::after,.sc-blk.shape-boolean::after,.sc-blk[data-cap="1"]::after{display:none}
.sc-blk.shape-boolean{border-radius:4px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);
  padding-inline:15px;min-height:32px}
.sc-blk[data-cap="1"]{border-radius:5px 5px 16px 16px;padding-bottom:9px}
.sc-celse-mid{position:relative;display:inline-flex;align-items:center;min-width:90px;min-height:30px;padding:4px 11px;
  color:#fff;font-size:12.5px;font-weight:600;direction:ltr;background:var(--sc-control);border:1px solid var(--sc-control-d);
  border-radius:0 5px 5px 0;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sc-celse .sc-elsebody{margin-top:0}
.sc-reporter-pop{position:absolute;z-index:95;min-width:46px;max-width:210px;padding:6px 10px;border-radius:16px;
  color:#445063;background:#fff;border:2px solid #4C97FF;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:12px;
  font-weight:700;direction:ltr;word-break:break-word}
.sc-create-win{width:min(430px,92%)}
.sc-create-body{background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px}
.sc-create-body label{font-size:13px;font-weight:700;color:#3d4b5a}
.sc-create-body input{height:38px;border-radius:6px;border:1px solid #B9C0C9;padding:0 11px;font-size:14px;direction:ltr}
.sc-create-scope{display:flex;gap:8px;flex-wrap:wrap}
.sc-create-scope span{padding:7px 10px;border-radius:16px;background:#EEF1F5;color:#596575;font-size:11.5px}
.sc-create-scope span.on{background:#E9F1FC;color:#3373CC;border:1px solid #4C97FF}

/* أكبر وأقرب لتوزيع Scratch في الكتاب عند المساحات الحرة */
.s2-free-scratch-page{position:absolute;inset:0;background:linear-gradient(180deg,#EAF2FB,#DDE7F2);display:flex;flex-direction:column;overflow:hidden}
.s2-free-scratch-head{flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;
  background:linear-gradient(90deg,#2E78D6,#4C97FF);color:#fff;box-shadow:0 3px 14px rgba(31,81,140,.28);direction:rtl}
.s2-free-scratch-title{display:flex;align-items:center;gap:12px;min-width:0}
.s2-free-scratch-title .badge{width:46px;height:46px;border-radius:13px;background:#FFBF00;color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:25px;font-weight:900;box-shadow:inset 0 -3px rgba(0,0,0,.12)}
.s2-free-scratch-title b{display:block;font-size:21px}.s2-free-scratch-title small{display:block;margin-top:2px;font-size:12px;opacity:.9;direction:ltr}
.s2-free-scratch-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.s2-free-scratch-btn{min-height:38px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);
  color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.s2-free-scratch-btn:hover{background:rgba(255,255,255,.24)}.s2-free-scratch-btn.danger{background:#C74646;border-color:#ED8A8A}
.s2-free-scratch-work{position:relative;flex:1;min-height:0;margin:10px;border-radius:10px;overflow:hidden;box-shadow:0 8px 25px rgba(47,68,94,.22)}
.s2-free-scratch-work .scratch{position:absolute;inset:0}
.s2-free-scratch-work .sc-left{flex-basis:360px}.s2-free-scratch-work .sc-right{flex-basis:390px}.s2-free-scratch-work .sc-stage{width:390px;height:292px}

.s2-theory-auto-visual{margin:12px 0 16px;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(76,151,255,.10),rgba(255,191,0,.10));
  border:1px solid rgba(76,151,255,.24);display:flex;align-items:center;justify-content:center;min-height:150px;overflow:hidden}
.s2-theory-auto-visual svg{max-width:100%;height:auto;filter:drop-shadow(0 5px 8px rgba(28,61,93,.13))}

@media(max-width:900px){
  .s2-free-scratch-head{flex:0 0 auto;align-items:flex-start}.s2-free-scratch-title small{display:none}
  .s2-free-scratch-work .sc-left{flex-basis:315px}.s2-free-scratch-work .sc-right{flex-basis:340px}.s2-free-scratch-work .sc-stage{width:340px;height:255px}
}
.sc-monitor{position:absolute;z-index:20;background:#fff;border:1.5px solid #C8CCD4;border-radius:5px;color:#4b5368;
  font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:hidden;direction:ltr}
.sc-monitor.var{display:flex;align-items:center}.sc-monitor.var b{padding:4px 7px;background:#FF8C1A;color:#fff}.sc-monitor.var span{padding:4px 9px;min-width:34px;text-align:center}
.sc-monitor.list{width:128px;padding-bottom:4px}.sc-monitor.list>b{display:block;background:#FF8C1A;color:#fff;padding:4px 7px;text-align:center}
.sc-monitor.list .items{display:flex;flex-direction:column;max-height:70px;overflow:hidden;padding:3px}.sc-monitor.list .items span{padding:2px 4px;border-bottom:1px solid #EDF0F4}
.sc-monitor.list small{display:block;text-align:center;color:#7b8494}

.sc-emptylist{width:100%;padding:14px 10px;border:1.4px dashed #C8D4E5;border-radius:10px;background:#F7FAFF;color:var(--sc-ink);text-align:center;font-size:12px;line-height:1.7}


/* ---- (5) سطح المكتب: أيقونات برامج مستقلة وواضحة ---- */
.sc-deskicons{position:absolute;top:14px;left:14px;right:auto;bottom:56px;display:grid;
  grid-template-columns:repeat(2,94px);grid-auto-rows:max-content;gap:8px 6px;z-index:4;
  align-content:start;overflow:visible}
.sc-deskic{width:92px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 4px;border-radius:9px;border:1.5px solid transparent;transition:background .12s,border-color .12s}
.sc-deskic:hover,.sc-deskic:focus-visible{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.42);outline:none}
.sc-deskic.armed{background:rgba(255,255,255,.26);border-color:#fff}
.sc-deskic svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.sc-deskic span{font-size:12px;color:#fff;text-align:center;line-height:1.35;
  text-shadow:0 1px 3px rgba(0,0,0,.85);word-break:break-word}
.mini-startmenu{max-height:calc(100% - 70px);overflow-y:auto}
.mini-startmenu .msm-item svg{width:26px;height:26px;flex:0 0 26px}
.mini-startmenu .msm-item{font-size:13.5px;padding:10px 10px;min-height:44px}



/* ================= R2 — أحجام خطوط Scratch للصف الثالث ================= */
.sc-blk{font-size:14px}
.sc-palar{font-size:13.5px;line-height:1.6}      /* الشرح العربي تحت اللبنة */
.sc-in,.sc-blk input,.sc-blk select{font-size:14px}
.sc-cat span,.sc-cat b{font-size:12.5px}
.sc-tab{font-size:14px;min-height:38px}
.sc-prop b{font-size:14px}
.sc-prop input,.sc-prop select{font-size:14px;min-height:30px}
.sc-thumb span{font-size:12.5px}
.sc-libit .nm{font-size:13px}
.sc-dlgbtn{font-size:14px;min-height:38px}
.sc-menu,.sc-projname{font-size:14px}
.sc-emptylist{font-size:14px;line-height:1.8}
.sc-emptystage{font-size:15px}
.sc-hintarea{font-size:15px}
.sc-deskic span{font-size:13px}
.mini-startmenu .msm-item{font-size:14.5px}


/* ================= R2 — مقطع برمجي عمودي متصل =================
 * كل لبنة سطر مستقل يلتصق بما قبله، ولبنات C يظهر تجويفها بوضوح،
 * فيطابق ترتيبُ العرض ترتيبَ التنفيذ. */
.sc-stack > .sc-blk,.sc-stack > .sc-c{margin:0;align-self:flex-start}
.sc-cbody > .sc-blk,.sc-cbody > .sc-c{align-self:flex-start}
.sc-statwrap .sc-stack{position:static;display:flex;flex-direction:column;align-items:flex-start}
/* خلفية منصّة فاتحة بشبكة خفيفة: يظهر عليها أثر القلم بوضوح */
.sc-stage{background:#FBFCFE}
/* رفع النوعية حتى لا تُغلب قواعد الحجم الافتراضية داخل المحاكي */
.scratch .sc-prop input,.scratch .sc-prop select,.scratch .sc-prop input.nm{font-size:14px;height:auto;min-height:30px}
.scratch .sc-in,.scratch .sc-blk input,.scratch .sc-blk select{font-size:14px}


/* ================= R3 — Scratch: لمس + استجابة ================= */
/* السحب باللمس: العنصر المسحوب يمنع تمرير الصفحة، والتمرير مسموح في اللوح */
.sc-blk,.sc-blk.pal,.sc-stack,.sc-c{touch-action:none}
.sc-palwrap,.sc-pal{touch-action:pan-y}
.sc-cats{touch-action:pan-y}
.sc-sprites{touch-action:pan-y}
.sc-stage{touch-action:none}
.sc-scripts{touch-action:none}
.sc-in,.sc-blk input,.sc-blk select,.sc-prop input,.sc-prop select{touch-action:auto}
@media (pointer:coarse){
  .sc-cat{min-height:56px}
  .sc-tab{min-height:46px;padding-inline:14px}
  .sc-ctl{min-width:46px;min-height:46px}
  .sc-thumb{width:74px;min-height:74px}

/* ==== styles/t3d.css ==== */
/* ==== styles/t3d.css — Tinkercad simulator layout ====
 * Base desktop rules PORTED from the proven Grade 3 implementation (§8) so the
 * simulator reads as the same product family: same chrome, same panel hierarchy,
 * same Inspector, same ViewCube placement.
 *
 * REBUILT here: everything responsive. The Grade 3 reference has no phone layout
 * at all (its narrowest breakpoint is 1180px and it declares no orientation,
 * safe-area or coarse-pointer rules), so the phone/tablet/landscape architecture
 * below is authored new for this rebuild, per brief §2 and §4.
 *
 * The simulator fills its .work host, which carries an intrinsic height in normal
 * flow — so the absolute positioning below can never collapse a parent (§20).
 */
.t3d{position:absolute;inset:0;background:#F2F4F6;display:flex;flex-direction:column;overflow:hidden;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;user-select:none}

/* ---------- الشريط العلوي ---------- */
.t3d-bar{flex:0 0 44px;background:#fff;border-bottom:1px solid #DDE1E6;display:flex;align-items:center;
  gap:8px;padding:0 10px;direction:ltr}
.t3d-logo{width:26px;height:26px;border-radius:6px;background:#1477D1;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800}
.t3d-name{min-height:28px;padding:4px 10px;border-radius:5px;background:#F1F3F5;border:1px solid #DDE1E6;
  font-size:12.5px;color:#38414A;min-width:160px;display:flex;align-items:center}
.t3d-barbtn{min-height:32px;padding:6px 13px;border-radius:5px;cursor:pointer;font-size:12.5px;
  background:#fff;border:1px solid #C9CFD6;color:#38414A}
.t3d-barbtn:hover{background:#E9F2FC;border-color:#1477D1;color:#1477D1}
.t3d-barbtn.pri{background:#1477D1;color:#fff;border-color:#0F5FA8}
.t3d-barright{margin-inline-start:auto;display:flex;gap:6px}

/* ---------- شريط الأدوات ---------- */
.t3d-tools{flex:0 0 40px;background:#fff;border-bottom:1px solid #DDE1E6;display:flex;align-items:center;
  gap:5px;padding:0 10px;direction:ltr;flex-wrap:wrap}
.t3d-tool{min-height:32px;min-width:34px;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;
  background:transparent;border:1px solid transparent;color:#48525C;display:flex;align-items:center;gap:5px}
.t3d-tool:hover{background:#EEF3F8;border-color:#C9CFD6}
.t3d-tool.on{background:#E4F0FB;border-color:#1477D1;color:#1477D1}
.t3d-tool:disabled{opacity:.4;cursor:default}
.t3d-sep{width:1px;height:22px;background:#DDE1E6;margin:0 4px}

/* ---------- المسرح ---------- */
.t3d-main{flex:1;display:flex;min-height:0;direction:ltr}
.t3d-canvaswrap{flex:1;position:relative;background:#E9EEF2;min-width:0;overflow:hidden}
.t3d-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
.t3d-hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.t3d-hudbtn{width:40px;height:40px;border-radius:7px;cursor:pointer;background:#fff;border:1px solid #C9CFD6;
  color:#48525C;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.t3d-hudbtn:hover{border-color:#1477D1;color:#1477D1}
.t3d-cube{position:absolute;right:12px;top:10px;width:104px;z-index:14;
  display:flex;flex-direction:column;align-items:center;gap:5px}
/* §9: the extra face buttons used to spill sideways under the shapes rail */
.t3d-cubebtns{flex-wrap:wrap;justify-content:center;max-width:104px}
.t3d-cubesvg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))}
.t3d-face{cursor:pointer;transition:fill .12s}
.t3d-cubebtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.t3d-cubebtn{min-width:44px;min-height:26px;padding:4px 9px;border-radius:5px;cursor:pointer;font-size:10px;
  font-weight:700;color:#4A5762;background:rgba(255,255,255,.94);border:1px solid #B9C2CB;direction:ltr}
.t3d-cubebtn:hover{background:#DCEBFA;color:#1477D1;border-color:#1477D1}
.t3d-viewnote{position:absolute;right:12px;top:152px;z-index:6;font-size:11px;color:#5A646E;
  background:rgba(255,255,255,.9);border:1px solid #DDE1E6;border-radius:5px;padding:3px 8px;direction:ltr}
.t3d-grid-lbl{position:absolute;left:12px;bottom:10px;z-index:5;font-size:11px;color:#5A646E;direction:ltr;
  background:rgba(255,255,255,.86);border:1px solid #DDE1E6;border-radius:5px;padding:3px 8px}

/* ---------- لوحة الأشكال ---------- */
.t3d-side{flex:0 0 236px;background:#fff;border-left:1px solid #DDE1E6;display:flex;flex-direction:column;min-height:0}
.t3d-sidetabs{flex:0 0 40px;display:flex;gap:3px;padding:6px 6px 0;border-bottom:1px solid #DDE1E6}
.t3d-sidetab{flex:1;min-height:32px;border-radius:6px 6px 0 0;cursor:pointer;font-size:11.5px;color:#48525C;
  background:#F1F4F7;border:1px solid #DDE1E6;border-bottom:0;display:flex;align-items:center;justify-content:center;gap:4px}
.t3d-sidetab.on{background:#fff;color:#1477D1;font-weight:700}
.t3d-libhead{padding:8px 10px;border-bottom:1px solid #EDF0F3;display:flex;gap:6px;align-items:center}
.t3d-libsel{flex:1;height:30px;border-radius:5px;border:1px solid #C9CFD6;font-size:12px;color:#38414A;
  background:#fff;font-family:inherit;padding:0 6px;direction:ltr}
.t3d-search{width:100%;height:30px;border-radius:5px;border:1px solid #C9CFD6;padding:0 9px;font-size:12px;
  font-family:inherit;color:#38414A;outline:none;direction:ltr}
.t3d-search:focus{border-color:#1477D1}
.t3d-shapes{flex:1;overflow-y:auto;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.t3d-shape{aspect-ratio:1;border-radius:8px;border:1.6px solid #DDE1E6;background:#FAFBFC;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;position:relative}

/* ---------- لوحة خصائص الكائن ---------- */
.t3d-inspect{position:absolute;width:196px;z-index:9;border-radius:8px;background:#fff;
  border:1px solid #C9CFD6;box-shadow:0 6px 20px rgba(0,0,0,.22);overflow:hidden;direction:ltr}

.t3d-inspbtn{width:26px;height:26px;border-radius:6px;cursor:pointer;background:#fff;border:1px solid #C9CFD6;
  color:#48525C;font-size:12px;display:flex;align-items:center;justify-content:center}

.t3d-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#5A646E}

.t3d-readout{display:flex;flex-direction:column;gap:4px;border:1px solid #E3E7EB;border-radius:7px;padding:8px 10px}

  font-size:14px;color:#B5483A}
.t3d-notedel:hover{background:#FDECE9;border-color:#B5483A}


/* =====================================================================
 * RESPONSIVE ARCHITECTURE (authored for this rebuild)
 * ===================================================================== */

/* the canvas must never receive browser gestures — pointer events only */
.t3d-canvas{touch-action:none}

/* all simulator controls respect the 44px floor on touch devices (§14) */
@media (pointer:coarse){
  .t3d-barbtn,.t3d-tool,.t3d-cubebtn,.t3d-inspbtn,.t3d-notedel,.t3d-sidetab,
  .t3d-name,.t3d-libsel,.t3d-search,.t3d-loginbtn,.t3d-fmt,.t3d-createbtn,
  .t3d-createmenu .it,.t3d-wordtab,.t3d-wordbtn{min-height:44px}
  .t3d-bar{flex:0 0 56px}
  .t3d-tools{flex:0 0 54px}
  .t3d-tool{min-width:44px}
  .t3d-sw{width:44px;height:44px}
  .t3d-row input[type=number]{height:44px;width:72px;font-size:15px}
  .t3d-hudbtn{width:44px;height:44px}
}

/* toolbars scroll horizontally instead of wrapping into extra rows:
   wrapping used to steal height from the workplane on small screens */
.t3d-bar,.t3d-tools{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.t3d-bar::-webkit-scrollbar,.t3d-tools::-webkit-scrollbar{display:none}
.t3d-bar>*,.t3d-tools>*{flex:0 0 auto}
.t3d-barright{flex:0 0 auto}

/* Inspector: never wider than the workspace, and it starts clear of the
   workplane centre. The engine clamps its drag inside the canvas wrapper. */
.t3d-inspect{max-width:min(196px, calc(100% - 16px))}

/* ---------- TABLET / narrow laptop: slimmer shape rail ---------- */
@media (max-width:900px){
  .t3d-side{flex:0 0 190px}
  .t3d-shapes{grid-template-columns:repeat(2,1fr);padding:7px;gap:7px}
  .t3d-cube{width:84px}
  .t3d-viewnote{top:128px}
}

/* ---------- PHONE PORTRAIT: stack — workplane on top, library beneath ----------
 * A 190px rail beside a phone-width canvas leaves the workplane unusable, so in
 * portrait the panel moves BELOW the canvas and its shape grid scrolls sideways.
 * The workplane keeps the majority of the height. */
@media (max-width:700px){
  .t3d-main{flex-direction:column}
  .t3d-canvaswrap{flex:1 1 auto;min-height:52%}
  .t3d-side{
    flex:0 0 auto;max-height:38%;
    border-left:0;border-top:1px solid #DDE1E6;
    flex-direction:column;
  }
  .t3d-sidetabs{flex:0 0 auto}
  .t3d-shapes{
    display:flex;overflow-x:auto;overflow-y:hidden;
    grid-template-columns:none;padding:8px;gap:8px;
  }
  .t3d-shape{flex:0 0 76px;width:76px;height:76px;aspect-ratio:auto}
  .t3d-sidebody{max-height:150px}
  .t3d-cube{width:74px;right:8px;top:8px}
  .t3d-cubebtn{min-width:44px;min-height:44px;font-size:9.5px}
  .t3d-viewnote{display:none}          /* the ViewCube already names the view */
  .t3d-hud{left:8px;top:8px}
  .t3d-inspect{max-width:calc(100% - 16px)}
  .t3d-grid-lbl{font-size:10px;padding:2px 6px}
}

/* ---------- LANDSCAPE PHONE / SHORT VIEWPORT (§4) ----------
 * Deliberate workspace layout: the workplane gets the largest area, the library
 * stays visible but compact beside it, chrome shrinks, nothing overlaps. */
@media (max-height:560px){
  .t3d-bar{flex:0 0 38px}
  .t3d-tools{flex:0 0 38px}
  .t3d-main{flex-direction:row}                 /* side-by-side is right in landscape */
  .t3d-canvaswrap{flex:1 1 auto;min-height:0}
  .t3d-side{
    flex:0 0 148px;max-height:none;
    border-top:0;border-left:1px solid #DDE1E6;
  }

/* ==== engine/util.js — DOM/SVG helpers + geometry (original) ==== */
window.MNARA = window.MNARA || {};
(function (W) {
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const k in props) {
      const v = props[k];
      if (v == null) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') {
        /* خاصية html مخصّصة للشروح الثابتة المكتوبة داخل المصدر فقط.
         * أي محتوى يحمل سكربتًا أو معالج حدث أو رابط javascript: يُعرض نصًّا لا HTML. */
        const s = String(v == null ? '' : v);
        if (/<\s*script|<\s*iframe|<\s*object|<\s*embed|\son[a-z]+\s*=|javascript:/i.test(s)) {
          console.warn('[MNARA] html blocked — rendered as text');
          n.textContent = s;
        } else n.innerHTML = s;
      }
      else if (k === 'style') Object.assign(n.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    (Array.isArray(kids) ? kids : [kids]).forEach(c => {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (tag, props = {}, kids = []) => {
    const n = document.createElementNS(NS, tag);
    for (const k in props) if (props[k] != null) n.setAttribute(k, props[k]);
    (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(c));
    return n;
  };
  W.util = {
    el, svg, NS,
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    wait: ms => new Promise(r => setTimeout(r, ms)),
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; },
    /* rect relative to the scaled stage, so overlays never drift */
    stageRect(node) {
      const stage = document.getElementById('stageInner');
      if (!stage || !node) return { x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0 };
      const s = stage.getBoundingClientRect(), r = node.getBoundingClientRect();
      const k = W.scale || 1;
      const x = (r.left - s.left) / k, y = (r.top - s.top) / k, w = r.width / k, h = r.height / k;
      return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
    },
    /* pointer position in stage coordinates */
    stagePoint(clientX, clientY) {
      const stage = document.getElementById('stageInner');
      const s = stage.getBoundingClientRect(), k = W.scale || 1;
      return { x: (clientX - s.left) / k, y: (clientY - s.top) / k };
    },
  };
})(window.MNARA);
