.phone.android .scr{background:linear-gradient(160deg,#2f6f66,#1c4a44)}
.phone .plabel{position:absolute;top:-24px;left:0;right:0;text-align:center;color:var(--cream);font-weight:800;font-size:14px}
.ios-searchbar{margin:14px 12px 8px;height:34px;border-radius:10px;background:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;padding:0 10px;color:#555;font-size:13px}
.ios-searchbar input{border:none;background:transparent;outline:none;flex:1;font-family:var(--font-body);font-size:13px}
.ios-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.app-ic .sq{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.app-ic .sq svg{width:28px;height:28px}
.app-ic .cap{font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.app-ic.found{outline:3px solid #F5D451;border-radius:14px}
.ios-result{margin:6px 12px;background:rgba(255,255,255,.92);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px;font-size:13px;color:#222}
.android-bar{height:40px;background:rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;font-size:13px;font-weight:700}
.android-files{flex:1;background:#EAF1EF;margin:0;overflow:auto}
.af-crumb{padding:8px 12px;font-size:12px;color:#2A6E67;background:#DDE9E6;font-weight:700}
.af-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid #d3e0dc;cursor:pointer;font-size:13px;color:#22302e}
.af-item:hover{background:#DDEBE7}
.af-item svg{width:26px;height:26px}
.af-item .meta{margin-right:auto;font-size:11px;color:#6b8a84}
.af-item.sel{background:#CFE6E0}

/* ---------- capture studio (mic / webcam / camera) ---------- */
.capture{position:absolute;z-index:5;left:150px;top:96px;width:840px;height:520px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#243c40,#16282c);box-shadow:var(--sh-2);border:1px solid rgba(95,184,174,.3);display:flex;flex-direction:column}
.cap-tabs{display:flex;gap:8px;padding:12px 14px 0}
.cap-tab{padding:9px 16px;border-radius:10px 10px 0 0;background:rgba(255,255,255,.06);color:var(--cream-2);font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px}
.cap-tab svg{width:18px;height:18px}
.cap-tab.on{background:rgba(255,255,255,.14);color:#fff;border-color:var(--glass-edge)}
.cap-tab.done::after{content:'✓';color:var(--teal-hi);margin-right:4px}
.cap-body{flex:1;display:flex;gap:18px;padding:18px}
.cap-viewport{flex:1;border-radius:12px;background:#0c1a1e;border:1.5px solid var(--glass-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}
.cap-controls{width:220px;display:flex;flex-direction:column;gap:10px}
.cap-btn{padding:12px 14px;border-radius:11px;border:1.5px solid var(--glass-edge);background:rgba(255,255,255,.06);color:var(--cream);font-size:13.5px;font-weight:700;cursor:pointer;text-align:center}
.cap-btn:hover{background:rgba(255,255,255,.12)}
.cap-btn.rec{background:linear-gradient(180deg,#e0644c,#b8442e);border:none;color:#fff}
.cap-btn.on{background:linear-gradient(180deg,#F6C583,#DB9448);color:#2a1608;border:none}
.cap-btn .en{font-size:10.5px;color:var(--muted);font-weight:500}.cap-btn.on .en,.cap-btn.rec .en{color:rgba(0,0,0,.5)}
/* waveform */
.wave{display:flex;align-items:flex-end;gap:3px;height:70px}
.wave i{width:5px;background:#5FB8AE;border-radius:3px;animation:wv .8s ease-in-out infinite}
@keyframes wv{0%,100%{height:14px}50%{height:60px}}
.cap-timer{font-family:var(--font-title);font-size:30px;color:#8FE0D6;font-weight:800}
.cam-preview{width:220px;height:150px;border-radius:10px;background:radial-gradient(circle at 40% 35%,#3a5c68,#16282c);display:flex;align-items:center;justify-content:center;position:relative;border:2px solid #5FB8AE}
.cam-preview .rec-dot{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;background:#e0644c;animation:cglow 1s infinite}
.cam-frame{position:absolute;inset:14px;border:2px solid rgba(255,255,255,.5);border-radius:6px;pointer-events:none}
.cap-file{margin-top:8px;padding:10px;border-radius:9px;background:rgba(95,184,174,.16);border:1px solid var(--teal-2);color:var(--cream);font-size:12px;display:flex;align-items:center;gap:9px}
.cap-file svg{width:24px;height:24px}
/* transfer tray */
.xfer{display:flex;align-items:center;gap:10px;margin-top:10px}
.xfer .dest{flex:1;border:2px dashed var(--copper-2);border-radius:10px;padding:10px;text-align:center;color:var(--cream-2);font-size:12px}
.xfer .dest.filled{border-style:solid;border-color:var(--ok);background:rgba(28,50,34,.5)}

/* ---------- printer procedure line ---------- */
.printer-line{position:absolute;z-index:5;left:150px;top:110px;width:840px;height:490px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#2A2620,#16110c);box-shadow:var(--sh-2);border:1px solid rgba(231,160,99,.3);display:flex;gap:18px;padding:18px}
.pl-steps{width:250px;display:flex;flex-direction:column;gap:9px}
.pl-step{padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.05);border:1.5px solid var(--glass-edge);color:var(--cream);font-size:13px;font-weight:700;cursor:pointer;opacity:.55}
.pl-step.active{opacity:1;border-color:var(--copper-2)}
.pl-step.done{opacity:1;border-color:var(--ok);background:rgba(28,50,34,.4)}
.pl-step .en{font-size:10px;color:var(--muted);font-weight:500}
.pl-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.printer-body{width:200px;height:150px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#5A6B72,#3A3F46);position:relative;box-shadow:var(--sh-1)}
.printer-body .slot{position:absolute;top:34px;left:20px;right:20px;height:6px;background:#14181c;border-radius:3px}
.printer-body .light{position:absolute;top:12px;right:16px;width:9px;height:9px;border-radius:50%;background:#5a3a1a}
.printer-body .light.on{background:#7ee0a0;box-shadow:0 0 8px #7ee0a0}
.printed-page{position:absolute;left:50%;transform:translateX(-50%);width:120px;background:#fff;border-radius:2px;box-shadow:var(--sh-1);overflow:hidden;transition:top .1s,height .1s}
.printed-page .ln{height:4px;background:#3B9188;margin:8px;border-radius:2px}
.printed-page .ln.b{background:#C57B3D;width:60%}

/* ---- capture-file transfer procedures (CP2R FINAL) ---- */
.xfer-panel{margin-top:8px;border:1.4px solid var(--glass-edge);border-radius:11px;padding:10px;background:rgba(0,0,0,.18)}
.xfer-panel h5{margin:0 0 8px;font-size:12.5px;color:var(--teal-hi);font-weight:800}
.xfer-step{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12px;color:var(--cream-2);cursor:pointer;border:1px solid transparent}
.xfer-step:hover{background:rgba(255,255,255,.06)}
.xfer-step.active{border-color:var(--copper-2);color:var(--cream)}
.xfer-step.done{color:var(--teal-hi)}
.xfer-step.done::before{content:'✓ '}
.xfer-step.locked{opacity:.4;cursor:not-allowed}
.xfer-btn{width:100%;margin-top:6px;padding:9px;border-radius:9px;border:1.5px solid var(--copper-2);background:rgba(231,160,99,.14);color:var(--cream);font-size:12.5px;font-weight:700;cursor:pointer}
.xfer-btn:hover{background:rgba(231,160,99,.24)}
.xfer-btn:disabled{opacity:.4;cursor:not-allowed}
/* mini explorer for camera copy/paste */
.mini-ex{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid rgba(120,80,40,.4);background:#F3ECDE}
.mini-ex .met{height:26px;background:linear-gradient(180deg,#3B9188,#2A6E67);color:#eaf6ef;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11.5px;font-weight:700}
.mini-ex .meb{display:flex;flex-wrap:wrap;gap:8px;padding:9px;min-height:70px}
.mini-ex .mitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:8px;cursor:pointer;border:1.4px solid transparent;width:64px}
.mini-ex .mitem:hover{background:#EADFC8}
.mini-ex .mitem.sel{background:#D8ECE7;border-color:#2A6E67}
.mini-ex .mitem svg{width:30px;height:30px}
.mini-ex .mitem .c{font-size:10px;color:#3A2A1B;text-align:center;line-height:1.2}
.mini-ex .mebar{display:flex;gap:6px;padding:6px 9px;background:#EADFC8;border-top:1px solid #C7B48E}
.mini-ex .mebtn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;border:1.3px solid #C7B48E;background:#F3ECDE;font-size:11.5px;font-weight:700;color:#3A2A1B;cursor:pointer}
.mini-ex .mebtn:hover{background:#fff}
.mini-ex .mebtn.glow{border-color:var(--copper-2);box-shadow:0 0 0 3px rgba(197,123,61,.25)}
.mini-ex .mebtn:disabled{opacity:.4;cursor:not-allowed}
.verified{margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(28,50,34,.5);border:1px solid var(--ok);color:var(--cream);font-size:12px;display:flex;align-items:center;gap:8px}
.verified svg{width:20px;height:20px}

/* ==== styles/unit3.css ==== */
/* ==== styles/unit3.css — Unit 3 (Connected World) UI: browser / search / wikipedia / scenarios ==== */

/* observatory lesson host */
.obs-env{position:absolute;inset:0;overflow:hidden}
.obs-env .obs-bg{position:absolute;inset:0;background:linear-gradient(170deg,#1E3348,#16283b 55%,#0e1a28)}
.obs-stage{position:absolute;left:150px;top:84px;width:840px;height:548px;z-index:5}

/* ---------- offline browser chrome ---------- */
.brw{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#eef2f6;box-shadow:var(--sh-2);border:1px solid rgba(30,51,72,.5);display:flex;flex-direction:column}
.brw-top{background:#dfe6ee;border-bottom:1px solid #c3ccd6;padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
.brw-tabs{display:flex;gap:4px;align-items:flex-end}
.brw-tab{background:#eef2f6;border:1px solid #c3ccd6;border-bottom:none;border-radius:8px 8px 0 0;padding:6px 12px;font-size:12px;color:#2A3A4A;display:flex;align-items:center;gap:8px;cursor:pointer;max-width:180px}
.brw-tab.on{background:#fff;font-weight:700}
.brw-tab .x{opacity:.6;cursor:pointer}
.brw-newtab{background:#eef2f6;border:1px solid #c3ccd6;border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#2A3A4A}
.brw-nav{display:flex;align-items:center;gap:8px;padding:4px 2px 8px}
.brw-btn{width:30px;height:30px;border-radius:8px;border:1px solid #c3ccd6;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#2A3A4A;font-size:15px}
.brw-btn:disabled{opacity:.4;cursor:not-allowed}
.brw-btn:hover:not(:disabled){background:#f0f4f8}
.brw-addr{flex:1;height:32px;border-radius:16px;border:1px solid #c3ccd6;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
.brw-addr svg{width:14px;height:14px;opacity:.6}
.brw-addr input{flex:1;border:none;outline:none;font-family:var(--font-body);font-size:13px;color:#1a2733;direction:ltr;text-align:left}
.brw-body{flex:1;background:#fff;overflow:auto;position:relative}

/* search engine page */
.se-page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:26px 20px;gap:16px;background:#fff}
.se-logo{font-family:var(--font-title);font-size:34px;font-weight:800;color:#2A6E67;letter-spacing:.5px}
.se-logo span:nth-child(2){color:#C57B3D}
.se-box{width:100%;max-width:520px;height:44px;border-radius:24px;border:1.5px solid #c3ccd6;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.se-box svg{width:18px;height:18px;opacity:.55}
.se-box input{flex:1;border:none;outline:none;font-family:var(--font-body);font-size:15px}
.se-go{background:#2A6E67;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer}
.se-hint{color:#6b8a84;font-size:12.5px}
/* results */
.se-results{width:100%;max-width:620px;display:flex;flex-direction:column;gap:16px;align-self:flex-start;padding-right:8px}
.se-result{cursor:pointer;padding:8px;border-radius:10px}
.se-result:hover{background:#f2f6f9}
.se-result .u{color:#2A6E67;font-size:12px;direction:ltr}
.se-result .t{color:#1a56b8;font-size:17px;font-weight:600;margin:2px 0}
.se-result:hover .t{text-decoration:underline}
.se-result .d{color:#41505e;font-size:13px;line-height:1.5}
.se-result.relevant .t{color:#0b7a3b}

/* content article page (locally packaged) */
.art-page{max-width:720px;margin:0 auto;padding:22px 26px;color:#1f2b36;line-height:1.7}
.art-page h1{font-size:26px;color:#153b3a;margin:0 0 6px}
.art-page h2{font-size:19px;color:#2A6E67;border-bottom:1px solid #e0e6ea;padding-bottom:4px;margin:20px 0 8px;scroll-margin-top:10px}
.art-page p{font-size:14.5px;margin:8px 0}
.art-page .selectable{cursor:text}
.art-figure{float:left;margin:6px 16px 10px 0;width:220px;border:1px solid #dbe2e8;border-radius:8px;overflow:hidden;background:#f6f8fa}
.art-figure .cap{font-size:11px;color:#6b7a88;padding:5px 8px;text-align:center}
.art-figure .imgbox{height:140px;display:flex;align-items:center;justify-content:center}
.art-figure .imgbox svg{width:100%;height:100%}
.art-copybar{position:sticky;top:0;background:#fffbe9;border-bottom:1px solid #ecdca0;padding:6px 12px;font-size:12px;color:#7a5a1a;display:flex;gap:10px;align-items:center;z-index:2}
.art-copybar button{background:#C57B3D;color:#fff;border:none;border-radius:7px;padding:5px 12px;font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer}
.art-copybar button:disabled{opacity:.4;cursor:not-allowed}

/* image context menu + Save Image As dialog */
.img-menu{position:absolute;z-index:40;background:#fff;border:1px solid #c3ccd6;border-radius:8px;box-shadow:var(--sh-2);padding:5px;min-width:190px}
.img-menu .mi{padding:8px 12px;border-radius:6px;font-size:13px;color:#1f2b36;cursor:pointer;display:flex;align-items:center;gap:9px}
.img-menu .mi:hover{background:#eef4f8}
.img-menu .mi.key{font-weight:700;color:#153b3a}

/* wikipedia-style page */
.wiki{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-radius:0}
.wiki-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e6e6e6;background:#f8f9fa}
.wiki-globe{width:38px;height:38px}
.wiki-title{font-family:Georgia,'Times New Roman',serif;font-size:19px;color:#202122}
.wiki-search{margin-right:auto;display:flex;gap:6px}
.wiki-search input{height:30px;border:1px solid #a2a9b1;border-radius:2px;padding:0 8px;font-size:13px;width:200px;font-family:var(--font-body)}
.wiki-search button{height:30px;border:1px solid #a2a9b1;background:#f8f9fa;border-radius:2px;padding:0 12px;cursor:pointer;font-family:var(--font-body);font-size:12.5px}
.wiki-body{flex:1;display:flex;overflow:hidden}
.wiki-toc{width:200px;border-left:1px solid #eaecf0;background:#f8f9fa;padding:12px;overflow:auto;font-size:13px}
.wiki-toc h4{margin:0 0 8px;font-size:12px;color:#54595d;text-transform:uppercase;letter-spacing:.4px}
.wiki-toc a{display:block;color:#3366cc;padding:4px 0;cursor:pointer;text-decoration:none}
.wiki-toc a:hover{text-decoration:underline}
.wiki-content{flex:1;overflow:auto;padding:16px 26px;color:#202122;line-height:1.7}
.wiki-content h1{font-family:Georgia,serif;font-size:27px;border-bottom:1px solid #a2a9b1;padding-bottom:5px;font-weight:400}
.wiki-content h2{font-family:Georgia,serif;font-size:20px;border-bottom:1px solid #a2a9b1;padding-bottom:4px;margin-top:20px;font-weight:400;scroll-margin-top:8px}
.wiki-content p{font-size:14px;margin:9px 0}
.wiki-figure{float:left;margin:4px 16px 10px 0;width:220px;border:1px solid #c8ccd1;background:#f8f9fa;border-radius:2px;padding:4px}
.wiki-figure .imgbox{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wiki-figure .imgbox svg{width:100%;height:100%}
.wiki-figure .cap{font-size:11.5px;color:#54595d;padding:5px 4px 2px}

/* scenario cards (safety / ethics) */
.scn-wrap{position:absolute;left:150px;top:96px;width:840px;height:520px;z-index:5;display:flex;flex-direction:column;gap:14px;padding:8px}
.scn-card{background:linear-gradient(180deg,rgba(30,51,72,.92),rgba(17,30,44,.92));border:1.5px solid rgba(111,160,218,.35);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-1)}
.scn-msg{display:flex;gap:12px;align-items:flex-start}
.scn-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3B9188,#2A6E67);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.scn-avatar svg{width:26px;height:26px}
.scn-bubble{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;color:var(--cream);font-size:14px;line-height:1.6}
.scn-q{color:var(--cream-2);font-size:13.5px;margin:12px 0 8px;font-weight:700}
.scn-choices{display:flex;flex-direction:column;gap:9px}
.scn-choice{text-align:right;background:rgba(255,255,255,.05);border:1.4px solid var(--glass-edge);border-radius:11px;padding:12px 14px;color:var(--cream);font-size:13.5px;cursor:pointer;font-family:var(--font-body);transition:border-color .2s,background .2s}
.scn-choice:hover{background:rgba(255,255,255,.1)}
.scn-choice.correct{border-color:var(--ok);background:rgba(28,50,34,.5)}
.scn-choice.wrong{border-color:#e0644c;background:rgba(80,30,24,.4)}
.scn-explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(95,184,174,.14);border:1px solid var(--teal-2);color:var(--cream);font-size:13px;line-height:1.6}

/* quick interactive practice bits (3.5) */
.pr-blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--copper-2);text-align:center;color:var(--teal-hi);font-weight:700;padding:0 6px}
.pr-chip{display:inline-flex;align-items:center;background:rgba(95,184,174,.16);border:1.3px solid var(--teal-2);border-radius:8px;padding:5px 12px;margin:4px;cursor:pointer;color:var(--cream);font-size:13px}
.pr-chip.used{opacity:.4;pointer-events:none}
.pr-order{display:flex;flex-direction:column;gap:8px}
.pr-step{background:rgba(255,255,255,.05);border:1.4px solid var(--glass-edge);border-radius:10px;padding:10px 12px;color:var(--cream);font-size:13px;cursor:grab;display:flex;align-items:center;gap:10px}
.pr-step .n{width:22px;height:22px;border-radius:50%;background:rgba(111,160,218,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* Correction 7: scenario illustrations */
.scn-illus{display:flex;justify-content:center;margin:10px 0 2px}
.scn-illus svg{height:104px;width:auto;max-width:100%;border-radius:10px;background:rgba(255,255,255,.06);padding:6px}
.prog-illus{display:flex;justify-content:center;margin:6px 0}
.prog-illus svg{height:64px;width:auto}

/* R1 hotfix: shared mini Windows desktop (real bottom taskbar + Start menu anchored above Start) */
.mini-winos{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2b6cb0,#1e4e8c 60%,#14375f)}
.mini-deskarea{position:absolute;left:0;right:0;top:0;bottom:48px;overflow:hidden}
.mini-taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(18,26,34,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid rgba(255,255,255,.08);z-index:15}
.mini-start-btn{width:38px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.08);transition:background .15s,box-shadow .2s}
.mini-start-btn:hover{background:rgba(255,255,255,.18)}
.mini-start-btn svg{width:22px;height:22px}
.mini-start-btn.ready{background:rgba(95,184,174,.28)}
.mini-start-btn.pulse{animation:miniStartPulse 1.3s ease-in-out infinite;box-shadow:0 0 0 3px rgba(95,184,174,.4)}
@keyframes miniStartPulse{0%,100%{box-shadow:0 0 0 3px rgba(95,184,174,.35)}50%{box-shadow:0 0 0 7px rgba(95,184,174,.12)}}
.mini-tray{margin-right:auto;display:flex;align-items:center;gap:10px;color:#e6edf3}
.mini-clock{text-align:center;line-height:1.15}
.mini-clock .t{font-size:12.5px;font-weight:700}.mini-clock .d{font-size:10.5px;opacity:.85}
.mini-startmenu{position:absolute;z-index:30;width:250px;background:rgba(28,38,48,.98);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:var(--sh-2);padding:12px;color:#e6edf3}
.mini-startmenu .msm-h{font-size:12px;color:#9fd3cc;margin-bottom:8px}
.mini-startmenu .msm-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.mini-startmenu .msm-item:hover{background:rgba(255,255,255,.1)}
.mini-startmenu .msm-item svg{width:18px;height:18px}
/* Phase-1 connection cards live in a centered desktop panel, never over the browser */
.mini-connpanel{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(560px,86%);background:rgba(23,57,59,.96);border:1.4px solid rgba(95,184,174,.35);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-2);z-index:8;transition:opacity .4s ease,transform .4s ease}
.mini-connpanel.collapsing{opacity:0;transform:translate(-50%,-58%);pointer-events:none}
.mini-connpanel h3{margin:0 0 12px;color:var(--cream);font-size:15px;text-align:center}
.mini-conncard{background:rgba(12,32,34,.6);border:1.3px solid rgba(95,184,174,.28);border-radius:11px;padding:10px 12px;margin-bottom:9px}
.mini-conncard .q{color:var(--cream);font-size:13px;margin-bottom:7px}
.mini-conncard .row{display:flex;gap:7px;flex-wrap:wrap}
/* Chrome fills the safe area above the taskbar with a small internal margin */
.mini-chromehost{position:absolute;inset:8px;overflow:hidden}

/* ==== «أين أنقر؟» — إبراز العنصر المطلوب دون تنفيذ المهمة نيابة عن الطالب ==== */
.here-tag{position:absolute;z-index:60;background:#F5D451;color:#3A2A1B;font-weight:800;font-size:12.5px;
  padding:4px 12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.45);white-space:nowrap;
  border:2px solid #C57B3D;pointer-events:none}
.here-tag::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #F5D451}
.u3-help{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.u3-help .tp-btn{max-width:none;flex:1 1 auto;min-height:38px}
.u3-short{font-family:var(--font-title);font-size:16px;font-weight:800;color:var(--cream);line-height:1.6}

/* ==== styles/legibility.css ==== */
/* ==== styles/legibility.css — طبقة الوضوح لطفل الصف الثالث ====
 * تُحمَّل أخيرًا فتَغلب على ما قبلها. تعدّل الأحجام والتباين والمساحات فقط،
 * ولا تمسّ منطق الأنشطة ولا محاكي Word ولا التحقق من الإجابات.
 * القاعدة: العربي هو الأكبر والأوضح، والإنجليزي تحته أصغر وثانوي.
 */

/* ---------------------------------------------------------------
   1) بطاقات الأجهزة والتقنيات — الوحدة الأولى
   --------------------------------------------------------------- */
.itile{
  box-sizing:border-box;
  width:174px;min-height:198px;padding:14px 10px 12px;gap:9px;
  justify-content:flex-start;
  background:linear-gradient(180deg,#2A231A,#191410);
  border:2px solid rgba(231,160,99,.55);
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.itile .ic{width:70px;height:70px;flex:0 0 70px}
.itile .nm{font-size:18px;line-height:1.4;color:#FFF6E6;letter-spacing:.1px}
.itile .en{font-size:13px;line-height:1.3;color:#C9B79A;direction:ltr;font-weight:600}
.itile .fx,.itile .job{font-size:14.5px;line-height:1.6;color:#EADFC8}
.itile:hover{border-color:#FFD9A8;box-shadow:0 10px 26px rgba(0,0,0,.6)}
.itile.placed{border-color:#5FD08A;background:linear-gradient(180deg,#1E3524,#132217)}
/* منطقة التفاعل داخل البطاقة لا تخرج عن حدودها أبدًا */
.itile > div[style*="border-radius: 8px"],
.itile > div[style*="border-radius:8px"]{
  max-width:100%;border-color:rgba(143,224,214,.65) !important;
  background:#0E2530 !important;
}

/* مناطق الإفلات */
.dropzone{box-sizing:border-box;width:250px;min-height:112px;padding:13px 15px;border-width:2.5px;
  border-color:rgba(231,160,99,.7);background:rgba(26,20,13,.75)}
.dropzone .need{font-size:16px;line-height:1.75;color:#F4E9D4;font-weight:600}
.dropzone .slot{font-size:13px;color:#C9B79A}
.dropzone.over{border-color:#FFD9A8;background:rgba(231,160,99,.2)}
.dropzone.filled{border-color:#5FD08A;background:rgba(30,53,36,.8)}
.orb .lbl{font-size:14px;color:#FFF6E6}

/* عناوين الأعمدة فوق الخلفيات المزخرفة */
.stage-wrap > div[style*="var(--muted)"]{color:#E4D3B4 !important;font-size:16px !important}

/* ---------------------------------------------------------------
   2) لوحة التعليمات الجانبية
   --------------------------------------------------------------- */
.taskpanel{width:296px;background:linear-gradient(180deg,#1E1710,#120D08);
  border:2px solid rgba(231,160,99,.5);box-shadow:0 14px 34px rgba(0,0,0,.6);
  max-height:calc(100% - 88px);display:flex;flex-direction:column}
.taskpanel .tp-body{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.taskpanel .tp-steps{max-height:none;flex:1 1 auto;min-height:0;overflow:auto;
  scrollbar-width:thin;scrollbar-color:rgba(231,160,99,.6) transparent}
.taskpanel .tp-steps::-webkit-scrollbar{width:8px}
.taskpanel .tp-steps::-webkit-scrollbar-thumb{background:rgba(231,160,99,.55);border-radius:4px}
.taskpanel .tp-actions{flex:0 0 auto;margin-top:10px}
.taskpanel .tp-head{background:linear-gradient(180deg,#C97C2C,#A45E17)}
.taskpanel .tp-stage{font-size:13px;color:#FFF0D8;font-weight:800}
.taskpanel .tp-mode{font-size:16px;color:#FFFFFF;font-weight:800}
.taskpanel .tp-instr{font-size:18px;line-height:1.7;color:#FFF6E6;font-weight:700}
.taskpanel .tp-instr-en,.taskpanel .tp-en{font-size:12.5px;line-height:1.5;color:#B9A585}
.taskpanel .tp-en{color:#B9A585}
.taskpanel .tp-steps li,.taskpanel .tp-step{font-size:15px;line-height:1.6;color:#F0E4CE;padding:6px 0}
.taskpanel .tp-steps li .b{width:24px;height:24px;font-size:12.5px;border-width:2px}
.taskpanel .tp-steps li.done .b{background:#3E8E5A;border-color:#7FD9A2}
.taskpanel .tp-step .n{font-size:13px}
.taskpanel .tp-step.done{color:#9FE3B6}
.taskpanel .tp-btn{font-size:15.5px;font-weight:800;min-height:46px;padding:9px 14px;flex:1 1 auto;
  background:linear-gradient(180deg,#3A3128,#241D16);border:2px solid rgba(231,160,99,.6);color:#FFF6E6}
.taskpanel .tp-btn:hover{background:linear-gradient(180deg,#4A4033,#31281F);border-color:#FFD9A8}
.taskpanel .tp-btn.primary{background:linear-gradient(180deg,#3E8E5A,#2C6B42);border-color:#7FD9A2;color:#FFFFFF}

/* ---------------------------------------------------------------
   3) رسائل النجاح والخطأ والتلميح
   --------------------------------------------------------------- */
.fb,.feedback,.lab-fb{font-size:17px !important;line-height:1.7 !important;font-weight:700 !important;
  padding:12px 22px !important;border-radius:14px !important}
.fb.ok,.feedback.ok{background:#2C6B42 !important;color:#FFFFFF !important;border:2px solid #7FD9A2 !important}
.fb.no,.feedback.no{background:#9E3E2C !important;color:#FFFFFF !important;border:2px solid #F0A090 !important}
.fb.hint,.feedback.hint{background:#1F4E76 !important;color:#FFFFFF !important;border:2px solid #8CC4EE !important}

/* ---------------------------------------------------------------
   4) شاشة إتمام الدرس
   --------------------------------------------------------------- */
.wdone .in{background:linear-gradient(180deg,#241C13,#150F09);
  border:2.5px solid rgba(231,160,99,.6);box-shadow:0 18px 44px rgba(0,0,0,.65);padding:26px 30px}
.wdone .mk{font-size:44px;color:#FFD9A8}
.wdone h2{font-size:27px;line-height:1.5;color:#FFF6E6}
.wdone p{font-size:17px;line-height:1.85;color:#EFE2CB}
.wdone .cta-plate,.wdone .tp-btn{font-size:17px;min-height:52px}

/* ---------------------------------------------------------------
   5) بطاقة اختيار وضع التعلّم
   --------------------------------------------------------------- */
.modepick .card{background:linear-gradient(180deg,#241C13,#150F09);border:2.5px solid rgba(231,160,99,.55)}
.modepick h2{font-size:26px;line-height:1.5;color:#FFF6E6}
.modepick .sub{font-size:16px;color:#DCC9A8}
.mode-opt{background:linear-gradient(180deg,#2C241A,#1A140E);border:2px solid rgba(231,160,99,.45);padding:20px 18px}
.mode-opt:hover{border-color:#FFD9A8;background:linear-gradient(180deg,#3A3023,#241C14)}
.mode-opt .t{font-size:20px;color:#FFF6E6;font-weight:800}
.mode-opt .d{font-size:15px;line-height:1.7;color:#E0D0B4}
.mode-opt .mi{width:60px;height:60px}

/* ---------------------------------------------------------------
   6) أوراق تدريبات كتاب الطالب
   --------------------------------------------------------------- */
.act-title h3{font-size:23px}
.act-title .en{font-size:12.5px;color:#7A5A34}
.act-q{font-size:19px;line-height:1.65}
.act-qen{font-size:12px}
.act-count{font-size:13.5px}
.act-n{width:34px;height:34px;flex:0 0 34px;font-size:17px}
.act-pip{width:32px;height:32px;font-size:14px;border-width:2.5px}
.act-txt{font-size:17px;line-height:1.85;color:#2E2013}
.act-tf{width:48px;height:44px;font-size:20px;border-width:2.5px}
.act-mark{width:32px;height:32px;flex:0 0 32px;font-size:17px;border-width:2.5px}
.act-chip{font-size:16px;padding:9px 18px;border-width:2.5px;color:#5E2C08}
.act-chip.big{font-size:15.5px;padding:10px 16px}
.act-banklbl{font-size:14.5px}
.act-fillrow{font-size:17px;line-height:2.1}
.act-slot{font-size:16.5px;min-width:150px;border-bottom-width:3px}
.act-mitem{font-size:16px;line-height:1.7;padding:12px 14px;border-width:2.5px;color:#2E2013}
.act-mnum{width:28px;height:28px;flex:0 0 28px;font-size:14px}
.act-step{font-size:16px;padding:13px 15px;border-width:2.5px;color:#2E2013}
.act-badge{width:32px;height:32px;flex:0 0 32px;font-size:16px;border-width:2.5px}
.act-mcqq{font-size:17.5px;line-height:1.8}
.act-opt{font-size:16px;padding:11px 18px;border-width:2.5px;color:#2E2013}
.act-cattitle{font-size:15.5px}
.act-catchip{font-size:14.5px;padding:7px 11px}
.act-pick{font-size:16px;padding:12px 14px;border-width:2.5px;color:#2E2013}
.act-pickdot{width:28px;height:28px;flex:0 0 28px;font-size:16px}
.act-mazepath{font-size:16px;padding:11px 15px}
.act-mazeopt{font-size:16px;padding:12px 20px;border-width:2.5px;color:#2E2013}
.act-toast{font-size:15.5px;padding:11px 22px}
.actsheet{width:952px;padding:18px 22px 20px}
.act-actions .tp-btn{font-size:15.5px;min-height:46px}

/* لوحة المصطلحات في الختام */
.wrapup-terms .wu-h{font-size:18px}
.wrapup-terms .wu-term .ar{font-size:14.5px;color:#FFF0D8}
.wrapup-terms .wu-term .en{font-size:12px;color:#C0AC8C}

/* ---------------------------------------------------------------
   7) الوحدة الثالثة — المواقف والبطاقات
   --------------------------------------------------------------- */
.scn-card{background:linear-gradient(180deg,#16202B,#0C141C);border:2px solid rgba(143,224,214,.35)}
.scn-bubble{font-size:17px;line-height:1.8;color:#F2F8FA}
.scn-q{font-size:19px;line-height:1.7;color:#FFF6E6;font-weight:800}
.scn-choice{font-size:16.5px;line-height:1.75;padding:13px 18px;border-width:2.5px;color:#EFF6F8}
.scn-choice:hover{background:rgba(143,224,214,.16)}
.scn-choice.correct{background:#2C6B42;border-color:#7FD9A2;color:#FFFFFF}
.scn-explain{font-size:15.5px;line-height:1.8;color:#BDF0D4}

/* بطاقات «برامج أخرى» */
.prog-card,.pcard{background:linear-gradient(180deg,#16202B,#0C141C) !important;
  border:2px solid rgba(143,224,214,.4) !important}
.prog-card .nm,.pcard .nm{font-size:20px !important;color:#FFF6E6 !important}
.prog-card .en,.pcard .en{font-size:13.5px !important;color:#A8C6D2 !important}
.prog-card .use,.pcard .use{font-size:15.5px !important;line-height:1.8 !important;color:#E4EEF2 !important}

/* ---------------------------------------------------------------
   8) محاكي Word — تباين فقط، بلا أي تغيير وظيفي
   --------------------------------------------------------------- */
.wd-foot{background:#E6E6E6;border-top:1px solid #B4B4B4;padding:10px 12px}
.wd-foot label,.wd-savebody label{color:#1A1A1A !important;font-size:12.5px;font-weight:600;opacity:1}
.wd-name{border:1.6px solid #4A4A4A;color:#111;font-size:13px;font-weight:600;height:28px;background:#fff}
.wd-name::placeholder{color:#6A6A6A}
.wd-sel{border:1.6px solid #4A4A4A;color:#1A1A1A;font-size:12px;height:28px;background:#fff}
.wd-sel.dim{opacity:1;color:#4A4A4A;background:#F2F2F2}
.wd-btn{height:30px;min-width:88px;font-size:13px;font-weight:700;color:#111;
  background:#E4E4E4;border:1.6px solid #7A7A7A}
.wd-btn:hover{background:#D6E9FB;border-color:#0F6CBD}
.wd-btn.primary{background:#0F6CBD;border-color:#0A4E8A;color:#FFFFFF}
.wd-btn.primary:hover{background:#1580DC;border-color:#0F6CBD;color:#FFFFFF}
.wd-btn[disabled]{opacity:1;background:#EDEDED;border-color:#BDBDBD;color:#8A8A8A;cursor:default}
.wd-btn.primary[disabled]{background:#C9DDF0;border-color:#9BBEDC;color:#5A7A96}
.wd-title{height:32px;font-size:12.5px;font-weight:600}
.wd-crumb{height:32px;font-size:12px;color:#1A1A1A}
.wd-crumb .path{color:#111;border-color:#9A9A9A;background:#FBFBFB}
.wd-crumb .search{color:#5A5A5A;border-color:#9A9A9A}
.wd-nav{font-size:12.5px;color:#111;padding:7px 11px}
.wd-item{font-size:12.5px;color:#111;padding:7px 10px}
.wd-item.sel{background:#CCE8FF;outline:1.6px solid #0F6CBD}
.wd-tile .cap{font-size:11.5px;color:#111;font-weight:600;line-height:1.45}
.wd-tile.sel{background:#CCE8FF;outline:1.6px solid #0F6CBD}
.wd-tile .th{border:1.4px solid #B4B4B4;height:62px}
.wd-bar{font-size:12px;color:#1A1A1A}
/* Backstage والطباعة */
.bs-item{font-size:13px}
.bs-place{font-size:12.5px;color:#111}
.bs-place.dim{opacity:.72}
.bs-file .n{font-size:13px;color:#111;font-weight:600}
.bs-file .p{font-size:11px;color:#4A4A4A}
.bs-tip{font-size:13px;color:#0A4E8A;border-color:#8FC1E8;background:#E8F3FC}
.bs-sel{height:30px;font-size:12.5px;color:#111;border-color:#7A7A7A}
.bs-sel.dim{opacity:1;color:#5A5A5A;background:#F2F2F2}
.bs-copies{height:28px;font-size:13px;border:1.6px solid #4A4A4A;color:#111;font-weight:700}
.bs-copiesbox label{font-size:12.5px;color:#1A1A1A;font-weight:600}

   16) الاستجابة للهواتف واللوحيات
   فضاء التصميم ثابت 1280×720 ويُقاس متجانسًا، فلا يتغيّر أيّ تخطيط.
   ما يلي يعالج حجم اللمس والاتجاه فقط، ولا يمسّ نسخة الحاسوب.
   =============================================================== */

/* أجهزة اللمس: توسيع مناطق النقر دون تغيير الشكل أو التخطيط */
@media (pointer: coarse) {
  .tp-btn,.corner-btn,.dock-btn,.act-tf,.act-opt,.act-chip,.act-mitem,.act-step,.act-pick,
  .act-mazeopt,.mode-opt,.scn-choice,.wd-btn,.bs-item,.bs-place,.ex-btn,.wa-tab,.wtool,
  .cta-plate,.itile,.dropzone,.app,.prog-kind{position:relative}
  .tp-btn::after,.corner-btn::after,.dock-btn::after,.act-tf::after,.act-opt::after,
  .act-chip::after,.act-mitem::after,.act-step::after,.act-pick::after,.act-mazeopt::after,
  .scn-choice::after,.wd-btn::after,.bs-item::after,.bs-place::after,.ex-btn::after,
  .wa-tab::after,.wtool::after{
    content:'';position:absolute;inset:-10px;z-index:0}
  /* لا يعتمد أيّ إظهار على المرور بالمؤشّر على أجهزة اللمس */
  .cloc .cplaque{opacity:1 !important;transform:none !important}
  .itile:hover{transform:none}
  .wa-page .doc{caret-color:#2B579A}
}
/* أجهزة اللمس فقط: مقابض الصورة والقصّ أكبر لتناسب الإصبع */
@media (pointer: coarse) {
  .doc-img .handle{width:18px;height:18px;border-width:2.4px}
  .doc-img .handle.nw{top:-9px;right:-9px}.doc-img .handle.ne{top:-9px;left:-9px}
  .doc-img .handle.sw{bottom:-9px;right:-9px}.doc-img .handle.se{bottom:-9px;left:-9px}
  .doc-img .crop-h.t{top:-8px;height:16px}.doc-img .crop-h.b{bottom:-8px;height:16px}
  .doc-img .crop-h.l{left:-8px;width:16px}.doc-img .crop-h.r{right:-8px;width:16px}
}

/* ==== styles/responsive.css ==== */
/* ==== styles/responsive.css — العرض من الحافة إلى الحافة + إعادة التوزيع ====
 * تُحمَّل أخيرًا. لا تمسّ المحتوى ولا منطق الأنشطة ولا وظائف Word ولا الهوية.
 * وضعان يضبطهما engine/ui.js:  body.wide  و  body.reflow
 */

/* ---------------------------------------------------------------
   0) صفر هامش خارجي في الوضعين + مراعاة الحوافّ الآمنة
   --------------------------------------------------------------- */
html,body{margin:0;padding:0;width:100%;background:#0b1e26}
#stage{padding:0;border-radius:0}
#stageInner{border-radius:0;box-shadow:none}

/* ---------------------------------------------------------------
   1) الوضع الواسع (حاسوب ولوحي أفقي): المسرح يملأ الشاشة تمامًا
   --------------------------------------------------------------- */
body.wide #stage{position:fixed;inset:0;display:block;overflow:hidden;
  align-items:stretch;justify-content:flex-start}
body.wide #stageInner{position:absolute;top:0;inset-inline-start:0;
  flex:none;min-width:0;overflow:hidden}
/* الحوافّ الآمنة (Notch / Dynamic Island / Home Indicator) */
body.wide .dock,body.wide .corners,body.wide .lf-top{
  padding-top:env(safe-area-inset-top,0);
  padding-inline-start:env(safe-area-inset-left,0);
  padding-inline-end:env(safe-area-inset-right,0)}

/* ---------------------------------------------------------------
   2) وضع إعادة التوزيع (هواتف ولوحيات رأسية): تدفّق رأسي وتمرير
   --------------------------------------------------------------- */
body.reflow{overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%;
  background:radial-gradient(130% 100% at 50% 8%,#1a3d4a,#0b1e26 72%)}
body.reflow #stage{position:static;display:block;inset:auto;overflow:visible;background:transparent}
body.reflow #stageInner{position:relative;width:100%!important;height:auto!important;
  min-height:100svh;min-width:0;flex:none;transform:none!important;overflow:visible;
  padding:calc(8px + env(safe-area-inset-top,0)) calc(10px + env(safe-area-inset-right,0))
          calc(18px + env(safe-area-inset-bottom,0)) calc(10px + env(safe-area-inset-left,0))}

/* حاويات المشاهد: من مطلقة إلى تدفّق */
body.reflow .lab-env,body.reflow .obs-env,body.reflow .studio,body.reflow .cit,
body.reflow .gindex,body.reflow .hall-env{
  position:relative!important;inset:auto!important;width:100%!important;height:auto!important;
  min-height:0!important;overflow:visible!important;display:block}
body.reflow .motif,body.reflow .cvig,body.reflow .cfore,body.reflow .catmo,
body.reflow .lab-bg,body.reflow .obs-bg,body.reflow .cbg,body.reflow .cwater,
body.reflow .cit-sky,body.reflow .scenery{display:none!important}

/* شريط الأدوات العلوي يبقى في المتناول */
body.reflow .dock,body.reflow .corners{position:relative!important;inset:auto!important;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;width:100%;margin-bottom:10px}
body.reflow .corner-btn,body.reflow .dock-btn{position:relative!important;inset:auto!important;
  min-width:48px;min-height:48px}

/* لوحة التعليمات: تعلو النشاط ولا تغطّيه */
body.reflow .taskpanel{position:relative!important;inset:auto!important;width:100%!important;
  max-width:none!important;max-height:none!important;margin:0 0 12px;display:block}
body.reflow .taskpanel .tp-instr{max-height:none;overflow:visible;font-size:18px}
body.reflow .taskpanel .tp-steps{max-height:none;overflow:visible}
body.reflow .taskpanel .tp-actions{display:flex;flex-wrap:wrap;gap:8px}
body.reflow .taskpanel .tp-btn{flex:1 1 46%;min-height:48px;font-size:16px}

/* منطقة النشاط */
body.reflow .stage-wrap{position:relative!important;inset:auto!important;width:100%!important;
  height:auto!important;padding:0;display:block}
body.reflow .stage-grid{position:relative;display:flex;flex-wrap:wrap;justify-content:center;
  align-content:flex-start;gap:12px;padding:0;height:auto;flex:none}
body.reflow .scn-wrap,body.reflow .obs-stage{position:relative!important;inset:auto!important;
  width:100%!important;height:auto!important;padding:0}

/* البطاقات تتمدّد وتُقرأ */
body.reflow .itile{width:calc(50% - 6px)!important;min-height:0!important;padding:14px 10px}
body.reflow .itile .nm{font-size:17px}
body.reflow .itile .en{font-size:12.5px}
body.reflow .itile .ic{width:58px;height:58px;flex:0 0 58px}
body.reflow .dropzone{width:100%!important;min-height:0!important}
body.reflow .orb,body.reflow .orbdock{position:relative!important;inset:auto!important;
  margin:12px auto 0;display:flex;justify-content:center}

/* ورقة التدريبات */
body.reflow .actsheet{position:relative!important;inset:auto!important;left:auto!important;
  right:auto!important;top:auto!important;transform:none!important;width:100%!important;
  max-width:none!important;max-height:none!important;padding:14px 12px}
body.reflow .act-pickall{grid-template-columns:1fr}
body.reflow .act-match{flex-direction:column;gap:10px}
body.reflow .act-cats{flex-direction:column}
body.reflow .act-head{flex-wrap:wrap}
body.reflow .act-count{width:100%;margin:4px 0 0;text-align:start}
body.reflow .act-txt{font-size:16.5px}
body.reflow .act-actions{position:sticky;bottom:0;background:rgba(250,244,234,.96);
  padding:8px 0;border-top:1px solid #E3CDA9;z-index:5}

/* المواقف وبطاقات «برامج أخرى» */
body.reflow .scn-card,body.reflow .progcard{width:100%!important;max-width:none!important}
body.reflow .scn-choice{font-size:16.5px}

/* ---------------------------------------------------------------
   3) محاكي Word في وضع إعادة التوزيع — كامل الوظائف بلا حذف أداة
   --------------------------------------------------------------- */
body.reflow .wordapp{position:relative!important;left:auto!important;top:auto!important;
  width:100%!important;height:auto!important;min-height:74svh;margin:0 0 12px}
body.reflow .wa-title{flex-wrap:wrap;height:auto;padding:6px 8px;gap:6px}
body.reflow .wa-titlemid{order:-1;flex:1 1 100%;justify-content:center}
body.reflow .wa-search,body.reflow .wa-signin,body.reflow .wa-winbtns{display:none}
/* صفّ التبويبات والشريط: تمرير أفقي داخليّ بدل حذف أي أداة */
body.reflow .wa-tabs{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
body.reflow .wa-tabs::-webkit-scrollbar{height:6px}
body.reflow .wa-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.45);border-radius:3px}
body.reflow .wa-tab{flex:0 0 auto;min-height:40px}
body.reflow .wa-ribbon{flex:0 0 auto;height:auto;min-height:92px;overflow-x:auto;overflow-y:hidden;
  flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
body.reflow .wa-ribbon::-webkit-scrollbar{height:6px}
body.reflow .wa-ribbon::-webkit-scrollbar-thumb{background:#B7B5B3;border-radius:3px}
body.reflow .wgroup{flex:0 0 auto}
body.reflow .wa-canvas{min-height:44svh;padding:10px 6px}
body.reflow .wa-page{width:min(560px,100%);padding:22px 18px}
body.reflow .wa-ruler{display:none}
body.reflow .wa-status{flex-wrap:wrap;height:auto;padding:6px 8px;gap:8px}

/* ==== engine/storage.js ==== */
/* ==== engine/storage.js — anonymous local progress (offline, file://-safe) ==== */
(function (W) {
  const KEY = 'manara.g3.v1';
  const blank = () => ({
    settings: { seenIntro: false, sound: true, reducedMotion: false, lowPerf: false },
    progress: {},                     // lessonId -> {opened, steps:{}, done, masteredAt}
    stats: { sessions: 0, lessonOpens: 0, msActive: 0, firstRun: Date.now(), lastRun: Date.now() },
  });
  let mem = blank(), ok = true;
  // teacher preview: writes are diverted to a scratch clone and never persisted
  let previewing = false, realSnapshot = null;

  function load() { try { const raw = localStorage.getItem(KEY); if (raw) mem = Object.assign(blank(), JSON.parse(raw)); } catch (e) { ok = false; } }
  function save() { if (!ok || previewing) return; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { ok = false; } }
  load();
  mem.stats.sessions++; mem.stats.lastRun = Date.now(); save();

  W.store = {
    get settings() { return mem.settings; },
    get progress() { return mem.progress; },
    get stats() { return mem.stats; },
    get storageOk() { return ok; },
    get previewing() { return previewing; },

    setSetting(k, v) { mem.settings[k] = v; save(); },

    lessonOpened(id) { const p = mem.progress[id] || (mem.progress[id] = { opened: 0, steps: {}, done: false }); p.opened++; mem.stats.lessonOpens++; save(); },
    stepDone(id, step) { const p = mem.progress[id] || (mem.progress[id] = { opened: 1, steps: {}, done: false }); p.steps[step] = true; save(); },
    stepIsDone(id, step) { return !!(mem.progress[id] && mem.progress[id].steps[step]); },
    /* mastery, not points */
    markMastered(id, criteria) {
      const p = mem.progress[id] || (mem.progress[id] = { opened: 1, steps: {}, done: false });
      const all = (criteria || []).every(c => p.steps[c]);
      if (all && !p.done) { p.done = true; p.masteredAt = Date.now(); }
      save(); return p.done;
    },
    isMastered(id) { return !!(mem.progress[id] && mem.progress[id].done); },
    masteredCount() { return Object.values(mem.progress).filter(p => p.done).length; },
    unitMastered(unit, lessons) { return lessons.filter(l => l.unit === unit && this.isMastered(l.id)).length; },

    /* clear only one lesson (teacher tool) */
    clearLesson(id) { delete mem.progress[id]; save(); },
    reset() { mem = blank(); save(); },
    export() { return JSON.parse(JSON.stringify(mem)); },

    /* ---- Teacher preview: enter/exit without touching real data ---- */
    beginPreview() { if (previewing) return; realSnapshot = JSON.stringify(mem); previewing = true; },
    endPreview() { if (!previewing) return; try { mem = JSON.parse(realSnapshot); } catch (e) {} previewing = false; realSnapshot = null; },
  };

  let t0 = Date.now();
  setInterval(() => { if (!document.hidden && !previewing) { mem.stats.msActive += Date.now() - t0; save(); } t0 = Date.now(); }, 15000);
})(window.MNARA);

 * so no fake listen button is ever shown.

/* ==== engine/scd.js ==== */
/* ==== engine/scd.js — Scene-Cleanup Controller (shared contract) ====
 * Every transient artifact (arrow, hand, connection line, drag trail, highlight,
 * tutorial overlay, tooltip, previous-step instruction) and every temporary
 * timer/interval/listener is REGISTERED here. On stage change or scene unmount
 * we remove them from the DOM (or fully disable pointer-events) and clear timers
 * and listeners. Nothing may leak across stages.
 */
(function (W) {
  const nodes = new Set();     // DOM artifacts to remove
  const timers = new Set();    // setTimeout ids
  const intervals = new Set(); // setInterval ids
  const unbinders = new Set(); // () => void listener removers

  const SCD = {
    /* register a DOM artifact created for the current stage */
    node(n) { if (n) nodes.add(n); return n; },
    /* tracked timers */
    after(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; },
    every(fn, ms) { const id = setInterval(fn, ms); intervals.add(id); return id; },
    /* tracked listener; returns an unbinder that is also auto-run on clear */
    listen(target, ev, fn, opts) {
      target.addEventListener(ev, fn, opts);
      const off = () => target.removeEventListener(ev, fn, opts);
      unbinders.add(off); return off;
    },
    /* how many artifacts are currently live — used by tests */
    artifactCount() { return nodes.size + timers.size + intervals.size + unbinders.size; },
    nodeCount() { return nodes.size; },

    /* clear everything registered for the stage */
    clear() {
      nodes.forEach(n => { try { n.style && (n.style.pointerEvents = 'none'); n.remove(); } catch (e) {} });
      nodes.clear();
      timers.forEach(id => clearTimeout(id)); timers.clear();
      intervals.forEach(id => clearInterval(id)); intervals.clear();
      unbinders.forEach(off => { try { off(); } catch (e) {} }); unbinders.clear();
    },
  };
  W.scd = SCD;
})(window.MNARA);

/* ==== engine/scene.js ==== */
/* ==== engine/scene.js — scene registry + router with global clean-slate ==== */
(function (W) {
  const scenes = {};

    register(id, def) { scenes[id] = def; },

    go(id, params = {}) {

      // teardown current + run the global scene-cleanup contract

      W.scd.clear();
      const root = document.getElementById('stageInner');
      root.innerHTML = '<div class="motif"></div>';
      const ctx = {

      current = def; currentId = id; currentParams = params;
      try { def.mount(ctx); } catch (e) { W.errorBoundary && W.errorBoundary.catch(e, id); }
    },

/* ==== engine/fsm.js ==== */
/* ==== engine/fsm.js — deterministic lesson state machine ====
 * A lesson is a sequence of STAGES. Each stage declares:
 *   { id, requiredAction, enter(api), completionPredicate(), onCorrect, onIncorrect,
 *     autoProgress(bool), cleanup() }
 * The machine advances ONLY when completionPredicate() is true. Every stage
 * transition runs the scene-cleanup contract, so no artifact leaks.
 * Retry re-enters the same stage; reset restarts the lesson from stage 0.
 */

      get index() { return i; },
      get stageId() { return i >= 0 && stages[i] ? stages[i].id : null; },
      get finished() { return finished; },
      get total() { return stages.length; },

      start() { i = -1; finished = false; this.next(); return this; },

      /* advance to the next stage; runs cleanup of the previous stage first */
      next() {
        if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.scd.clear();                       // enforce cleanup contract between stages
        i++;
        if (i >= stages.length) { finished = true; spec.onFinish && spec.onFinish(); return; }
        spec.onStage && spec.onStage(i, stages[i]);
        try { stages[i].enter(this.api); } catch (e) { W.errorBoundary && W.errorBoundary.catch(e, 'stage:' + stages[i].id); }
      },

      /* re-enter current stage (retry) */
      retry() {
        if (i < 0) return;
        if (stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.scd.clear();
        spec.onStage && spec.onStage(i, stages[i], true);
        try { stages[i].enter(this.api); } catch (e) { W.errorBoundary && W.errorBoundary.catch(e, 'retry:' + stages[i].id); }
      },

      /* reset whole lesson */
      reset() { if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} } W.scd.clear(); this.start(); },

      /* jump to a stage index (teacher) */
      jump(target) {
        if (target < 0 || target >= stages.length) return;
        if (i >= 0 && stages[i] && stages[i].cleanup) { try { stages[i].cleanup(); } catch (e) {} }
        W.scd.clear(); i = target - 1; this.next();
      },

      /* a stage calls this when its predicate has been satisfied */
      complete() {
        const st = stages[i]; if (!st) return;
        if (st.completionPredicate && !st.completionPredicate()) return;   // guard
        st.onCorrect && st.onCorrect(this.api);
        if (st.step) W.store.stepDone(spec.lessonId, st.step);
        if (st.autoProgress !== false) this.next();
      },
    };
    machine.api = Object.assign({ machine }, spec.api || {});
    return machine;
  }
  W.fsm = { create };
})(window.MNARA);

/* ==== world/unitgallery.js — shared environmental lesson-index builder (CP2) ====
 * Renders any unit's lessons as an environmental gallery of "stations" that match
 * the approved CP1R2 look. Each unit passes a theme (colors + station vignette) so
 * the three worlds stay visually distinct while sharing layout, readability, and
 * accessibility (centered, unclipped titles at 1366x768, available from start).
 */
(function (W) {
  const { el } = W.util;
  const C = () => W.citadel;

  // theme per unit-world
  const THEMES = {
    lab: { wall: [[0, '#2A2620'], [.5, '#241E17'], [1, '#181410']], accent: '#E7A063', accent2: '#F3C57E', arch: '#C57B3D', lamp: 'rgba(231,160,99,.16)' },
    hall: { wall: [[0, '#2C4A44'], [.5, '#213B38'], [1, '#182B2F']], accent: '#5FB8AE', accent2: '#A7E6DD', arch: '#5FB8AE', lamp: 'rgba(255,217,168,.12)' },
    obs: { wall: [[0, '#1E3348'], [.5, '#182A3B'], [1, '#111E2C']], accent: '#6FA0DA', accent2: '#9FC4EA', arch: '#6FA0DA', lamp: 'rgba(111,160,218,.14)' },
  };

  // station vignette per unit kind (distinct silhouettes)
  function vignette(kind, featured, th) {
    const svg = C().E('svg', { viewBox: '0 0 180 118', width: '100%', height: '100%' });
    C().S(svg, 'rect', { x: 0, y: 0, width: 180, height: 118, fill: featured ? '#1b1712' : '#151109' });
    if (kind === 'lab') {
      // a workstation screen with data
      C().S(svg, 'rect', { x: 46, y: 24, width: 88, height: 58, rx: 5, fill: '#12303c', stroke: th.accent, 'stroke-width': 1.6 });
      C().S(svg, 'rect', { x: 52, y: 30, width: 76, height: 40, rx: 2, fill: '#0a2029' });
      C().S(svg, 'path', { d: 'M58,64 l14,-16 l10,9 l10,-12 l14,19 Z', fill: '#3B9188', opacity: .85 });
      C().S(svg, 'circle', { cx: 66, cy: 44, r: 5, fill: th.accent });
      C().S(svg, 'rect', { x: 78, y: 86, width: 24, height: 8, rx: 2, fill: '#6B421F' });
      if (featured) C().S(svg, 'circle', { cx: 120, cy: 30, r: 5, fill: '#F5D451', class: 'anim-glow' });
    } else if (kind === 'obs') {
      // a globe + constellation
      C().S(svg, 'circle', { cx: 90, cy: 52, r: 26, fill: 'none', stroke: th.accent, 'stroke-width': 1.6 });
      C().S(svg, 'ellipse', { cx: 90, cy: 52, rx: 26, ry: 9, fill: 'none', stroke: th.accent, 'stroke-width': 1, opacity: .6 });
      C().S(svg, 'line', { x1: 90, y1: 26, x2: 90, y2: 78, stroke: th.accent, 'stroke-width': 1, opacity: .6 });
      C().S(svg, 'circle', { cx: 90, cy: 52, r: 4, fill: th.accent2, class: featured ? 'anim-glow' : '' });
      [[124, 30], [56, 34], [116, 82]].forEach(([x, y]) => C().S(svg, 'circle', { cx: x, cy: y, r: 2, fill: th.accent2 }));
    } else {
      // hall: manuscript page (kept from approved design)
      C().S(svg, 'path', { d: 'M40,110 L40,44 Q90,8 140,44 L140,110 Z', fill: 'rgba(95,184,174,.10)', stroke: '#3B9188', 'stroke-width': 1.4, opacity: .6 });
      C().S(svg, 'rect', { x: 30, y: 86, width: 120, height: 10, rx: 3, fill: '#6B421F' });
      C().S(svg, 'rect', { x: 62, y: 30, width: 56, height: 60, rx: 3, fill: '#FBF6EC', class: featured ? 'anim-float' : '' });
      C().S(svg, 'rect', { x: 72, y: 38, width: 36, height: 4, rx: 2, fill: '#3B9188' });
      C().S(svg, 'rect', { x: 72, y: 46, width: 28, height: 3, rx: 1.5, fill: '#C57B3D' });
      C().S(svg, 'rect', { x: 72, y: 53, width: 32, height: 3, rx: 1.5, fill: '#B49B7C' });
      if (featured) C().S(svg, 'circle', { cx: 132, cy: 30, r: 6, fill: '#F5D451', class: 'anim-glow' });
    }
    return svg;
  }

  /* build(ctx, opts):
   *   opts.unit, opts.kind ('lab'|'hall'|'obs'), opts.titleAr, opts.titleEn,
   *   opts.featured {id:true}, opts.entries [{id,code,title,titleEn,kind:'lesson'|'special',route}],
   *   opts.projectBtn {label, onClick} optional
   */
  function build(ctx, opts) {
    const th = THEMES[opts.kind] || THEMES.lab;
    const gal = el('div', { class: 'gallery cit-arrive' });
    const bg = el('div', { class: 'clayer cl-sky', style: { zIndex: '1' } });
    const bsvg = C().E('svg', { viewBox: '0 0 1280 720', width: '100%', height: '100%', preserveAspectRatio: 'xMidYMid slice' });
    const defs = C().S(bsvg, 'defs', {});
    const g = C().E('linearGradient', { id: 'gw_' + opts.kind, x1: 0, y1: 0, x2: 0, y2: 1 });
    th.wall.forEach(([o, c]) => g.appendChild(C().E('stop', { offset: o, 'stop-color': c }))); defs.appendChild(g);
    C().S(bsvg, 'rect', { x: 0, y: 0, width: 1280, height: 720, fill: `url(#gw_${opts.kind})` });
    [180, 470, 810, 1100].forEach(x => {
      C().S(bsvg, 'path', { d: `M${x - 110},420 L${x - 110},150 Q${x},40 ${x + 110},150 L${x + 110},420 Z`, fill: 'rgba(255,255,255,.03)', stroke: th.arch, 'stroke-width': 2, opacity: .3 });
      C().S(bsvg, 'ellipse', { cx: x, cy: 110, rx: 60, ry: 40, fill: th.lamp });
    });
    C().S(bsvg, 'rect', { x: 0, y: 560, width: 1280, height: 160, fill: '#4A3018' });
    C().S(bsvg, 'path', { d: 'M470,560 L810,560 L900,720 L380,720 Z', fill: '#5A3A1A', opacity: .6 });
    bg.appendChild(bsvg); gal.appendChild(bg);
    gal.appendChild(el('div', { class: 'studio-lamp anim-glow', style: { top: '60px', left: '18%', zIndex: '2' } }));
    gal.appendChild(el('div', { class: 'studio-lamp anim-glow', style: { top: '60px', left: '72%', zIndex: '2' } }));
    gal.appendChild(el('div', { class: 'cvig' }));

    gal.appendChild(el('div', { class: 'chub-title' }, [
      el('h1', { text: opts.titleAr }),
      el('div', { class: 'en', text: opts.titleEn }),
    ]));

    const row = el('div', { class: 'station-row', style: { flexWrap: 'wrap', gap: '16px', top: '132px' } });
    opts.entries.forEach(e => {
      const featured = !!(opts.featured && opts.featured[e.id]);
      const done = W.store.isMastered(e.id);
      const special = e.kind === 'special';
      const st = el('div', { class: 'station' + (special ? ' special' : featured ? ' feat' : ' soon') + (done ? ' done' : ''),
        tabindex: '0', role: 'button', 'aria-label': (e.code ? e.code + ' ' : '') + e.title,
        style: special ? { borderColor: th.accent } : {},
        onclick: () => open(e, featured, special), onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(e, featured, special); } } });
      const sc = el('div', { class: 'st-scene' });
      sc.appendChild(special ? specialVignette(e, th) : vignette(opts.kind, featured, th));
      if (done) sc.appendChild(el('div', { class: 'st-done', text: '✦' }));
      st.appendChild(sc);
      st.appendChild(el('div', { class: 'st-body' }, [
        el('div', { class: 'st-code', style: special || featured ? { background: th.accent, color: '#1b0f05' } : {}, text: e.code || '★' }),
        el('div', { class: 'st-title', text: e.title }),
        e.titleEn ? el('div', { class: 'st-en', text: e.titleEn }) : null,
        featured || special
          ? el('div', { class: 'st-tag', style: { background: 'rgba(255,255,255,.08)', border: '1px solid ' + th.accent, color: th.accent2 }, text: done ? 'أُتقن ✦' : (special ? 'ابدأ' : 'ابدأ الدرس') })
          : el('div', { class: 'st-tag', style: { background: 'rgba(255,255,255,.08)', border: '1px solid ' + th.accent, color: th.accent2 }, text: done ? 'أُتقن ✦' : 'ابدأ الدرس' }),
      ]));
      row.appendChild(st);
    });
    gal.appendChild(row);

    gal.appendChild(el('div', { class: 'credit-band' }, el('span', { text: 'إعداد وتنفيذ الأستاذة دعاء الجرواني' })));
    ctx.add(gal);
    W.dock.mount(ctx, { home: true });

    function open(e, featured, special) {
      W.audio.chime();
      if (W.lessons.has(e.id)) ctx.go('lesson', { id: e.id });
    }
  }

  function specialVignette(e, th) {
    const svg = C().E('svg', { viewBox: '0 0 180 118', width: '100%', height: '100%' });
    C().S(svg, 'rect', { x: 0, y: 0, width: 180, height: 118, fill: '#1b1712' });
    if (e.special === 'remember') { // هل تذكر؟ — a memory spark
      C().S(svg, 'circle', { cx: 90, cy: 56, r: 30, fill: 'none', stroke: th.accent, 'stroke-width': 2, 'stroke-dasharray': '4 6' });
      C().S(svg, 'text', { x: 90, y: 66, 'font-size': 30, 'text-anchor': 'middle', fill: th.accent2 }, [document.createTextNode('؟')]);
    } else if (e.special === 'programs') { // برامج أخرى — app tiles
      [[60, 40], [90, 40], [120, 40], [75, 72], [105, 72]].forEach(([x, y], i) => C().S(svg, 'rect', { x: x - 12, y: y - 12, width: 24, height: 24, rx: 5, fill: i % 2 ? th.accent : '#3B9188', opacity: .85 }));
    } else { // beacon status — منارة
      C().S(svg, 'path', { d: 'M84,30 h12 l3,12 h-18 Z', fill: th.accent });
      C().S(svg, 'rect', { x: 82, y: 42, width: 16, height: 40, fill: '#CBAE82' });
      C().S(svg, 'circle', { cx: 90, cy: 30, r: 8, fill: '#FFF1CE', class: 'anim-glow' });
    }
    return svg;
  }

  W.unitgallery = { build };
})(window.MNARA);

/* ==== engine/present.js ==== */
/* ==== engine/present.js — presentation layer (instruction, feedback, labels, guidance)
 * Every transient element it creates is registered with W.scd so the cleanup
 * contract removes it on stage change. Guidance hands/arrows never persist.
 */
(function (W) {
  const { el, svg, stageRect } = W.util;

  function host() { return document.getElementById('lessonStage') || document.getElementById('stageInner'); }

  const present = {
    /* single instruction bar (exact action + object). Replaces any prior. */
    instruction(ar, en, iconGlyph) {
      const prev = document.getElementById('instrBar');
      if (prev) prev.remove();
      const bar = el('div', { class: 'instr', id: 'instrBar' }, [
        iconGlyph ? W.icons.svg(iconGlyph, 'ic') : null,
        el('div', {}, [
          el('div', { class: 'ar', text: ar }),
          en ? el('div', { class: 'en', text: en }) : null,
        ]),
      ]);
      document.getElementById('stageInner').appendChild(bar);
      return bar;   // lives in HUD band, not registered (it is replaced explicitly)
    },
    clearInstruction() { const p = document.getElementById('instrBar'); if (p) p.remove(); },

    /* transient feedback toast */
    feedback(kind, text) {
      const t = el('div', { class: 'fb ' + (kind === 'ok' ? 'ok' : 'no'), text });
      host().appendChild(t);

/* ==== engine/dnd.js ==== */
/* ==== engine/dnd.js — drag-and-drop engine (mouse + touch) ====
 * Contract: large objects, forgiving targets, pointer-aligned, reliable accept,
 * gentle reject (return to origin), no off-screen loss, retry/reset safe, works
 * at 1366x768 and 1920x1080, reduced-motion compatible, no pixel-perfect.
 * All listeners are registered with W.scd and removed on stage change.
 */
(function (W) {
  const { stagePoint } = W.util;
  const targets = [];   // {node, accepts:(dragEl)=>bool, onDrop:(dragEl)=>void, pad}

  function reset() { targets.length = 0; }

  function addTarget(node, accepts, onDrop, pad) {
    const t = { node, accepts, onDrop, pad: pad == null ? 28 : pad };
    targets.push(t); return t;
  }

  function hitTarget(cx, cy) {
    // forgiving: expand each target rect by pad; pick the closest center
    let best = null, bestD = Infinity;
    for (const t of targets) {
      const r = t.node.getBoundingClientRect();
      const x0 = r.left - t.pad, x1 = r.right + t.pad, y0 = r.top - t.pad, y1 = r.bottom + t.pad;
      if (cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1) {
        const dcx = (r.left + r.right) / 2, dcy = (r.top + r.bottom) / 2;
        const d = (cx - dcx) ** 2 + (cy - dcy) ** 2;
        if (d < bestD) { bestD = d; best = t; }
      }
    }
    return best;
  }

  /* make a node draggable. opts: { onPick, onReject, onAccept, data } */
  function makeDraggable(node, opts) {
    opts = opts || {};
    let dragging = false, ghost = null, ox = 0, oy = 0, homeLeft = 0, homeTop = 0, curHot = null;

    function down(e) {
      if (node.classList.contains('used')) return;
      e.preventDefault();
      const pt = pointer(e);
      dragging = true; node.classList.add('grab');
      const r = node.getBoundingClientRect();
      const k = W.scale || 1;
      ox = (pt.x - r.left) / k; oy = (pt.y - r.top) / k;
      const sp = stagePoint(r.left, r.top);
      homeLeft = sp.x; homeTop = sp.y;
      // create ghost that follows pointer, aligned to grab offset
      ghost = node.cloneNode(true);
      ghost.style.position = 'absolute'; ghost.style.zIndex = '80'; ghost.style.margin = '0';
      ghost.style.left = sp.x + 'px'; ghost.style.top = sp.y + 'px';
      ghost.style.width = (r.width / k) + 'px'; ghost.style.pointerEvents = 'none';
      ghost.classList.add('grab');
      document.getElementById('stageInner').appendChild(ghost);
      node.style.opacity = '0.25';
      W.audio.pick(); opts.onPick && opts.onPick(node);
    }
    function move(e) {
      if (!dragging) return;
      const pt = pointer(e);
      const sp = stagePoint(pt.x, pt.y);
      ghost.style.left = (sp.x - ox) + 'px'; ghost.style.top = (sp.y - oy) + 'px';
      const hot = hitTarget(pt.x, pt.y);
      if (hot !== curHot) {
        if (curHot) curHot.node.classList.remove('hot');
        curHot = hot && hot.accepts(node) !== 'reject' ? hot : hot;   // still mark hover
        if (hot) hot.node.classList.add('hot');
      }
    }
    function up(e) {
      if (!dragging) return;
      dragging = false; node.classList.remove('grab');
      const pt = pointer(e);
      const hot = hitTarget(pt.x, pt.y);
      if (curHot) curHot.node.classList.remove('hot');
      cleanupGhost();
      if (hot && hot.accepts(node)) {
        node.style.opacity = '1';
        W.audio.drop();
        hot.onDrop(node);
        opts.onAccept && opts.onAccept(node, hot);
      } else {
        // gentle reject: return to origin
        node.style.opacity = '1';
        W.audio.no();
        opts.onReject && opts.onReject(node, hot);
      }
      curHot = null;
    }
    function cleanupGhost() { if (ghost) { ghost.remove(); ghost = null; } }
    function pointer(e) { return { x: e.clientX, y: e.clientY }; }

    // Unified Pointer Events => reliable for mouse, touch, and pen.
    // No pointer capture: keep move/up on window so the ghost tracks freely.
    W.scd.listen(node, 'pointerdown', down);
    W.scd.listen(window, 'pointermove', move);
    W.scd.listen(window, 'pointerup', up);
    W.scd.listen(window, 'pointercancel', up);
    // keyboard fallback: Enter picks/drops to the first accepting target
    node.setAttribute('tabindex', '0');
    W.scd.listen(node, 'keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        const t = targets.find(t => t.accepts(node));
        if (t) { W.audio.drop(); t.onDrop(node); opts.onAccept && opts.onAccept(node, t); }
        else { W.audio.no(); opts.onReject && opts.onReject(node, null); }
      }
    });
  }

  W.dnd = { reset, addTarget, makeDraggable };
})(window.MNARA);

/* ==== engine/ui.js ==== */
/* ==== engine/ui.js — responsive scaling + lesson frame ==== */
(function (W) {
  const { el } = W.util;

  /* ================================================================
     ملاءمة العرض — من الحافة إلى الحافة بلا أيّ هامش خارجي
     ----------------------------------------------------------------
     وضعان:
     1) wide  : الشاشة واسعة بما يكفي لتخطيط الحاسوب المعتمد.
                يُحسب مقياس k ثم يُجعل المقاس المنطقي = العرض/k × الارتفاع/k
                فيملأ المسرحُ الشاشةَ تمامًا بلا صناديق سوداء.
     2) reflow: الشاشة ضيّقة أو رأسية (هواتف ولوحيات رأسية).
                لا تصغير إطلاقًا (k = 1)، والمقاس المنطقي = مقاس الشاشة،
                وتتكفّل styles/responsive.css بإعادة توزيع العناصر
                رأسيًّا مع تمرير عمودي، فيبقى الخطّ بحجمه الطبيعي.
     ================================================================ */
  const BASE_W = 1280, BASE_H = 720;
  const MIN_WIDE_SCALE = 0.62;   // دونها يصغر الخطّ عن حدّ القراءة
  const MIN_WIDE_RATIO = 1.15;   // الشاشات الرأسية تذهب إلى reflow دائمًا
  let kbOpen = false;

  function typingNow() {
    const a = document.activeElement;
    if (!a) return false;
    return /^(input|textarea|select)$/i.test(a.tagName) || a.isContentEditable;
  }

  function viewport() {
    const vv = window.visualViewport;
    return {
      w: Math.round((vv && vv.width) || window.innerWidth),
      h: Math.round((vv && vv.height) || window.innerHeight),
    };
  }

  function fit() {
    const inner = document.getElementById('stageInner');
    if (!inner) return;
    /* لوحة المفاتيح الافتراضية تقلّص الارتفاع؛ لا نُعيد القياس أثناء الكتابة
       وإلّا انكمشت الشاشة تحت إصبع الطالب وغطّت الحقلَ الذي يكتب فيه. */
    if (kbOpen && typingNow()) return;

    const { w, h } = viewport();
    const raw = Math.min(w / BASE_W, h / BASE_H);
    const wide = (w / h) >= MIN_WIDE_RATIO && raw >= MIN_WIDE_SCALE;

    if (wide) {
      const k = raw;
      W.scale = k; W.mode = 'wide';
      document.body.classList.remove('reflow');
      document.body.classList.add('wide');
      /* المقاس المنطقي يتمدّد ليملأ الشاشة بعد القياس: صفر هامش خارجي */
      inner.style.width = Math.ceil(w / k) + 'px';
      inner.style.height = Math.ceil(h / k) + 'px';
      inner.style.transform = 'scale(' + k + ')';
      inner.style.transformOrigin = 'top ' + (document.documentElement.dir === 'rtl' ? 'right' : 'left');
    } else {
      W.scale = 1; W.mode = 'reflow';
      document.body.classList.remove('wide');
      document.body.classList.add('reflow');
      inner.style.width = '';
      inner.style.height = '';
      inner.style.transform = 'none';
      inner.style.transformOrigin = '';
    }
    document.documentElement.style.setProperty('--vh', h + 'px');
    document.documentElement.style.setProperty('--vw', w + 'px');
    document.documentElement.style.setProperty('--k', W.scale);
  }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 140));
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t && (/^(input|textarea)$/i.test(t.tagName) || t.isContentEditable)) {
      kbOpen = true;
      /* أبقِ الحقلَ مرئيًّا فوق لوحة المفاتيح */
      setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 260);
    }
  });
  document.addEventListener('focusout', () => { kbOpen = false; setTimeout(fit, 200); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => { if (!typingNow()) fit(); });
    window.visualViewport.addEventListener('scroll', () => { if (!typingNow()) fit(); });
  }

  W.ui = {
    fit,
    /* lesson HUD: top bar (code+title+rail) + stage area + returns chrome */
    lessonFrame(ctx, lesson, stages) {
      const rail = el('div', { class: 'rail', id: 'stepRail' });
      const top = el('div', { class: 'lf-top' }, [
        el('span', { class: 'lf-code', text: lesson.code }),
        el('div', { class: 'lf-title' }, [document.createTextNode(lesson.title), el('small', { text: lesson.titleEn })]),
        el('div', { class: 'lf-spacer' }),
        rail,
      ]);
      const stage = el('div', { id: 'lessonStage', class: 'stagearea' });
      ctx.root.appendChild(top); ctx.root.appendChild(stage);
      // build rail dots
      (stages || []).forEach((s, i) => rail.appendChild(el('div', { class: 'dot', 'data-i': i }, [el('div', { class: 'bulb' }), el('div', { class: 'lbl', text: s.rail || s.id })])));
      W.chrome.corners(ctx, { home: true, back: 'index' });
      return { top, stage, rail };
    },
    railLive(i) {
      const rail = document.getElementById('stepRail'); if (!rail) return;
      [...rail.children].forEach((d, k) => { d.classList.toggle('live', k === i); d.classList.toggle('past', k < i); });
    },
  };
})(window.MNARA);
