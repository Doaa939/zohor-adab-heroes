/* ==== styles/base.css ==== */
/* ==== styles/base.css — CP1R design tokens, materials, RTL, stage scaling ====
 * FONT: Arabic-first stack; high-quality on the Windows school target.
 * Drop Cairo.woff2 / Tajawal.woff2 into src/fonts/ and uncomment to embed.
 */
/*
@font-face{font-family:"Cairo";src:url("fonts/Cairo.woff2") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal.woff2") format("woff2");font-weight:400 800;font-display:swap}
*/
:root{
  /* --- Omani coastal daylight palette (warm, premium, not dark) --- */
  --dawn-1:#F7E4C4; --dawn-2:#F0C79B; --dawn-3:#E3A579; --dusk:#C98A63;
  --sea-1:#4E93A6; --sea-2:#317387; --sea-3:#1E5568; --sea-deep:#123f4f;
  --sand-1:#EADFC8; --sand-2:#D8C29B; --sand-3:#BFA274; --sand-sh:#9C7F52;
  /* materials */
  --copper-1:#E7A063; --copper-2:#C57B3D; --copper-3:#9E5C28; --copper-hi:#FFD9A8;
  --wood-1:#8A5A32; --wood-2:#6B421F; --wood-3:#4A2C13;
  --teal-1:#5FB8AE; --teal-2:#3B9188; --teal-3:#2A6E67; --teal-hi:#A7E6DD;
  --glass:#173343; --glass-2:#0f2735; --glass-edge:rgba(255,236,200,.22);
  --brass:#D9A94E;
  /* ink / text */
  --ink:#20140A; --ink-2:#3A2A1B;
  --paper:#FBF6EC; --paper-line:#E9DEC9;
  --cream:#F5ECDD; --cream-2:#E4D6BE; --muted:#B49B7C;
  --ok:#4FA772; --warn:#E0A23C; --bad:#CF6A4C;
  /* shadows / depth */
  --sh-soft:0 8px 24px rgba(40,24,10,.22);
  --sh-1:0 14px 40px rgba(30,18,8,.32);
  --sh-2:0 30px 80px rgba(20,12,6,.45);
  --sh-in:inset 0 2px 8px rgba(0,0,0,.28);
  --glow-copper:0 0 26px rgba(231,160,99,.55);
  --glow-teal:0 0 26px rgba(95,184,174,.5);
  --r-1:14px; --r-2:22px; --r-3:30px;
  --font-title:"Cairo","Dubai","Sakkal Majalla","Segoe UI","Tahoma",system-ui,sans-serif;
  --font-body:"Tajawal","Dubai","Segoe UI","Tahoma","Arial",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#0b1e26;overflow:hidden}
body{font-family:var(--font-body);color:var(--cream);direction:rtl}
button{font-family:inherit;cursor:pointer;color:inherit}
img{user-select:none}

/* fixed 1280x720 design space, scaled to fit (verified 1366x768 & 1920x1080) */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 100% at 50% 8%,#1a3d4a,#0b1e26 72%)}
/* عنصر مرن داخل حاوية flex: يجب منع الانكماش وإلا انهار فضاء التصميم
   إلى عرض الشاشة على الهواتف واللوحيات فتلتفّ العناصر وتُقصّ. */
#stageInner{position:relative;width:1280px;height:720px;flex:0 0 1280px;min-width:1280px;
  transform-origin:center center;
  border-radius:8px;overflow:hidden;box-shadow:var(--sh-2)}
.motif{position:absolute;inset:0;pointer-events:none;z-index:0}

:focus-visible{outline:3px solid var(--copper-hi);outline-offset:2px;border-radius:8px}

/* reduced motion — keep function, drop animation */
body.rm *{animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important}
/* low performance — hide decorative layers */
body.lp .decor,body.lp .parallax-extra,body.lp .particles,body.lp .anim-glow,body.lp .beam{display:none!important}
body.lp .glass-blur{backdrop-filter:none!important}

.center{display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}

/* ==== styles/ui.css ==== */
/* ==== styles/ui.css — Teacher Mode, settings, status, retained lesson chrome ==== */

.btn-glass{min-height:40px;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;
  color:var(--cream);background:linear-gradient(180deg,rgba(30,20,12,.7),rgba(18,12,7,.78));
  border:1px solid var(--glass-edge);box-shadow:var(--sh-soft)}
.btn-glass:hover{background:linear-gradient(180deg,rgba(45,30,18,.82),rgba(28,18,10,.88))}

/* ---------- Teacher Mode ---------- */
.tm{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-start;background:rgba(6,14,18,.62)}
.tm-panel{width:min(560px,94%);height:100%;overflow:auto;padding:20px 22px 40px;
  background:linear-gradient(180deg,#16302f,#0e2124);border-left:2px solid var(--glass-edge);box-shadow:var(--sh-2)}
.tm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tm-head .h{font-family:var(--font-title);font-size:22px;font-weight:800;color:var(--cream)}
.tm-note{font-size:11.5px;color:var(--cream-2);line-height:1.7;background:rgba(197,123,61,.14);
  border:1px solid rgba(197,123,61,.4);border-radius:9px;padding:9px 11px;margin:8px 0 14px}
.tm-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tm-tab{padding:8px 14px;font-size:13px;border-radius:9px;border:1px solid var(--glass-edge);background:transparent;color:var(--cream);font-weight:600}
.tm-tab.on{background:linear-gradient(180deg,#F6C583,#DB9448);color:#2a1608;font-weight:800;border:none}
.tm-sec h4{font-size:13px;color:var(--copper-hi);font-weight:800;margin:12px 0 5px}
.tm-sec ul{margin:4px 0;padding-right:18px}
.tm-sec li{font-size:13px;line-height:1.7;color:var(--cream-2)}
.tm-terms{display:flex;flex-wrap:wrap;gap:6px}
.tm-term{font-size:11.5px;padding:3px 9px;border-radius:6px;background:rgba(197,123,61,.16);border:1px solid rgba(197,123,61,.32);color:var(--cream)}
.tm-lesson{background:rgba(14,33,36,.7);border:1px solid var(--glass-edge);border-radius:9px;margin-bottom:8px;padding:6px 0}
.tm-lesson summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.tm-lesson summary .c{font-size:11px;font-weight:800;background:var(--copper-2);color:#1b0f05;padding:2px 7px;border-radius:5px}
.tm-lesson summary .st{margin-right:auto;font-size:11px;color:var(--muted)}
.tm-lesson[data-done="1"] summary .c{background:var(--teal-2);color:#fff}
.tm-body-in{padding:2px 14px 12px}
.tm-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:7px;background:rgba(14,33,36,.7);border-radius:9px;font-size:13.5px;color:var(--cream-2)}
.tm-switch{width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;border:none;flex:0 0 auto}
.tm-switch.on{background:var(--teal-2)}
.tm-switch i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .16s}
.tm-switch.on i{right:23px}
.tm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* settings overlay reuses tm styles */
#mnSettings .tm-toggle{min-width:280px}

/* ---------- retained lesson chrome + status (units 1/3 index) ---------- */
.instr{position:absolute;top:14px;right:16px;left:16px;z-index:40;display:flex;align-items:center;gap:12px;justify-content:center;
  min-height:52px;padding:11px 20px;border-radius:14px;background:linear-gradient(180deg,rgba(16,30,34,.94),rgba(10,20,24,.94));border:1.6px solid var(--glass-edge);box-shadow:var(--sh-1)}
.instr .ar{font-family:var(--font-title);font-size:20px;font-weight:800;color:var(--cream)}
.instr .en{font-size:12.5px;color:var(--muted);direction:ltr}
.instr .ic{width:34px;height:34px;color:var(--copper-hi)}
.fb{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);z-index:60;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;opacity:0;transition:all .2s;pointer-events:none;box-shadow:var(--sh-1)}
.fb.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fb.ok{background:linear-gradient(180deg,#5EC98A,#3F9C68);color:#08210f}
.fb.no{background:linear-gradient(180deg,#EAB07F,#CF6A4C);color:#2a0d05}
.termchip{display:inline-flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:10px;background:rgba(16,30,34,.92);border:1.5px solid var(--glass-edge);pointer-events:none}
.termchip .t-ar{font-family:var(--font-title);font-size:15px;font-weight:800;color:var(--cream)}
.termchip .t-en{font-size:10.5px;color:var(--muted);direction:ltr}
.g-hand{position:absolute;z-index:30;font-size:34px;pointer-events:none}
.g-arrow{position:absolute;z-index:30;pointer-events:none;color:var(--copper-hi)}
.lf-top{position:absolute;top:0;right:0;left:0;height:50px;z-index:35;display:flex;align-items:center;gap:12px;padding:0 14px}
.lf-code{font-weight:800;font-size:13px;color:#241405;background:var(--copper-hi);padding:4px 9px;border-radius:7px}
.lf-title{font-family:var(--font-title);font-weight:800;font-size:17px;color:var(--cream)}
.lf-title small{display:block;font-size:10.5px;color:var(--muted);direction:ltr;font-weight:500}
.lf-spacer{flex:1}
.stagearea{position:absolute;top:52px;right:0;left:0;bottom:64px;overflow:hidden}
.rail{display:flex;gap:7px;align-items:center}
.rail .dot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px}
.rail .dot .bulb{width:13px;height:13px;border-radius:50%;background:rgba(224,138,60,.28);border:1.6px solid rgba(224,138,60,.5)}
.rail .dot .lbl{font-size:10.5px;color:var(--muted);font-weight:700}
.rail .dot.live .bulb{background:var(--copper-hi);box-shadow:0 0 10px var(--copper-hi)}
.rail .dot.past .bulb{background:var(--teal-2);border-color:var(--teal-2)}

/* Unit 3 index (kept minimal, warm) — Unit 1 uses the lab world, Unit 2 the hall world */
.idx{position:absolute;inset:0;overflow:hidden;background:radial-gradient(80% 60% at 50% 10%,rgba(95,184,174,.12),transparent),linear-gradient(180deg,#243c40,#15272b)}
.idx-head{position:absolute;top:24px;right:0;left:0;text-align:center;color:var(--cream)}
.idx-head h1{font-family:var(--font-title);font-size:28px;margin:0}
.idx-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cream-2);font-size:15px;padding:0 60px;line-height:1.8}

/* ==== styles/world.css ==== */
/* ==== styles/world.css — cinematic opening, hub with depth, entrances ==== */

/* ---------- shared cinematic layers ---------- */
.world{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;will-change:transform}
.layer-sky{z-index:1}
.layer-mid{z-index:2}
.layer-fore{z-index:4}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(20,12,6,.34) 100%)}
.atmo{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,240,210,.10),transparent 30%)}

/* particles (sea mist / dust motes) */
.particles i{position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,244,220,.85);animation:mote linear infinite}
@keyframes mote{from{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:.85}to{transform:translateY(-80px) translateX(14px);opacity:0}}

/* rotating beacon beam */
.beam{position:absolute;z-index:2;transform-origin:bottom center;pointer-events:none;
  background:conic-gradient(from 270deg at 50% 100%,transparent 76deg,rgba(255,238,190,.22) 90deg,transparent 104deg);
  animation:sweep 8s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}

/* ---------- opening ---------- */
.op-title{position:absolute;top:6.5%;right:0;left:0;text-align:center;z-index:7}
.op-title h1{font-family:var(--font-title);font-size:50px;font-weight:900;margin:0;
  color:#3a2410;letter-spacing:.5px;text-shadow:0 2px 0 rgba(255,255,255,.4),0 6px 20px rgba(120,70,20,.25)}
.op-title .en{font-size:15px;letter-spacing:3px;color:#6a4520;direction:ltr;margin-top:4px;text-transform:uppercase}
.op-cta{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:8;text-align:center}
.op-sub{margin-top:12px;font-size:14px;color:#123040;font-weight:600}
.op-credit{position:absolute;bottom:16px;right:0;left:0;text-align:center;z-index:8;
  font-size:14px;color:#123040;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.3)}

/* the big CTA is a carved-copper plate, not a flat button */
.plate-btn{position:relative;min-height:60px;padding:16px 40px;border:none;border-radius:16px;
  font-family:var(--font-title);font-size:21px;font-weight:800;color:#2a1608;
  background:linear-gradient(180deg,#F6C583,#DB9448 60%,#C57B3D);
  box-shadow:0 10px 0 #9E5C28,0 20px 40px rgba(120,60,20,.4),inset 0 2px 4px rgba(255,240,210,.7);
  transition:transform .12s,box-shadow .12s}
.plate-btn:hover{transform:translateY(-2px);box-shadow:0 12px 0 #9E5C28,0 26px 50px rgba(120,60,20,.45),inset 0 2px 4px rgba(255,240,210,.8)}
.plate-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #9E5C28,0 10px 20px rgba(120,60,20,.4)}

/* ---------- hub: continuous environment with three entrances ---------- */
.hub-title{position:absolute;top:20px;right:0;left:0;text-align:center;z-index:7}
.hub-title h1{font-family:var(--font-title);font-size:32px;font-weight:900;margin:0;color:#3a2410;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.hub-title .en{font-size:12.5px;color:#5a3c1e;direction:ltr;letter-spacing:1px}
/* the three entrances sit along a stone quay; positioned, not carded */
.entrances{position:absolute;inset:0;z-index:5}
.entrance{position:absolute;bottom:8%;width:300px;height:340px;cursor:pointer;
  transition:transform .2s,filter .2s;filter:drop-shadow(0 20px 30px rgba(20,12,6,.5))}
.entrance:hover{transform:translateY(-10px) scale(1.02)}
.entrance:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:20px}
.entrance .arch{position:absolute;inset:0;border-radius:20px 20px 8px 8px;overflow:hidden;
  border:2px solid rgba(255,236,200,.25)}
.entrance .name-plate{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:3;
  min-width:240px;text-align:center;padding:10px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(30,20,10,.9),rgba(20,12,6,.96));
  border:1.5px solid var(--glass-edge);box-shadow:var(--sh-1)}
.entrance .name-plate .u{font-size:11.5px;font-weight:800;color:var(--copper-hi)}
.entrance .name-plate .nm{font-family:var(--font-title);font-size:19px;font-weight:800;color:var(--cream)}
.entrance .name-plate .en{font-size:10.5px;color:var(--muted);direction:ltr}
.entrance .prog{margin-top:7px;height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.entrance .prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal-2),var(--teal-hi));width:0}
/* pathway hint arrows on the quay */
.quay{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:4;
  background:linear-gradient(180deg,transparent,rgba(90,60,30,.35));pointer-events:none}

.hub-credit{position:absolute;bottom:12px;right:0;left:0;text-align:center;z-index:7;font-size:12.5px;color:#123040;font-weight:700}

/* ---------- compact elegant corner chrome ---------- */
.chrome-corner{position:absolute;z-index:20;display:flex;gap:8px}
.chrome-corner.tr{top:14px;left:14px}
.chrome-corner.tl{top:14px;right:14px}
.chip-btn{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:none;border-radius:12px;
  font-size:13px;font-weight:700;color:var(--cream);
  background:linear-gradient(180deg,rgba(30,20,12,.66),rgba(18,12,7,.72));
  border:1px solid var(--glass-edge);box-shadow:var(--sh-soft);backdrop-filter:blur(6px)}
.chip-btn:hover{background:linear-gradient(180deg,rgba(45,30,18,.8),rgba(28,18,10,.85))}
.chip-btn svg{width:18px;height:18px;color:var(--copper-hi)}
.chip-btn.icon-only{width:40px;padding:0;justify-content:center}

/* ---------- entrance transition (camera push-in) ---------- */
.pushin{animation:pushin .5s ease-out}
@keyframes pushin{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}

/* ==== styles/citadel.css ==== */
/* ==== styles/citadel.css — Living Omani Technology Citadel (CP1R2) ==== */

/* ---------- panoramic world container ---------- */
.cit{position:absolute;inset:0;overflow:hidden}
.cit .clayer{position:absolute;inset:0;will-change:transform;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.cit .cl-sky{z-index:1}
.cit .cl-cit{z-index:3}
.cit .cl-falaj{z-index:4;pointer-events:none}
.cit .cl-loc{z-index:5}
.cit .cl-fore{z-index:8;pointer-events:none}
.cit .cvig{position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(120% 86% at 50% 42%,transparent 52%,rgba(24,14,6,.40) 100%)}
.cit .catmo{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,242,214,.14),transparent 26%,transparent 74%,rgba(18,40,50,.25))}

/* foreground silhouette strip for depth */
.cfore{position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(180deg,transparent,rgba(28,18,10,.65) 60%,#241608);z-index:8}

/* particles: sea mist + data motes */
.cparts i{position:absolute;border-radius:50%;background:rgba(255,246,222,.8);animation:cmote linear infinite}
.cparts i.d{background:rgba(160,230,220,.85);box-shadow:0 0 6px rgba(140,224,214,.7)}
@keyframes cmote{from{transform:translateY(0);opacity:0}14%{opacity:.8}to{transform:translateY(-70px) translateX(10px);opacity:0}}

/* rotating beacon beam sweeping the whole landscape */
.cbeam{position:absolute;z-index:2;transform-origin:bottom center;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 270deg at 50% 100%,transparent 74deg,rgba(255,240,196,.20) 90deg,transparent 106deg);
  animation:csweep 9s ease-in-out infinite}
@keyframes csweep{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}

/* falaj light flow */
.falaj-flow{animation:falajflow 2.4s linear infinite}
.falaj-flow.rev{animation-direction:reverse}
@keyframes falajflow{to{stroke-dashoffset:-280}}
.flow-dot{animation:flowdot 3s linear infinite}
@keyframes flowdot{0%{opacity:0}20%{opacity:1}100%{transform:translateX(120px);opacity:0}}

/* gentle floats/glows used by scenery */
.anim-float{animation:cfloat 4.5s ease-in-out infinite}
@keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.anim-glow{animation:cglow 3.4s ease-in-out infinite}
@keyframes cglow{0%,100%{opacity:.9}50%{opacity:.6}}

/* ---------- interactive location hotspots ---------- */
.cloc{position:absolute;z-index:6;cursor:pointer;transition:transform .35s cubic-bezier(.22,.61,.36,1),filter .35s}
.cloc .cloc-art{position:absolute;inset:0;filter:drop-shadow(0 22px 30px rgba(16,10,4,.55))}
.cloc .cloc-halo{position:absolute;inset:-6% -6% -2% -6%;border-radius:40% 40% 12% 12%;opacity:0;transition:opacity .35s;pointer-events:none}
.cloc:hover .cloc-halo,.cloc:focus-visible .cloc-halo{opacity:1}
.cloc:hover,.cloc:focus-visible{transform:translateY(-8px) scale(1.015)}
.cloc:focus-visible{outline:none}
/* integrated glass plaque beside the entrance (NOT a black card) */
.cplaque{position:absolute;z-index:7;min-width:210px;max-width:250px;padding:10px 14px;border-radius:13px;
  background:linear-gradient(180deg,rgba(20,40,46,.52),rgba(12,26,32,.62));
  border:1px solid rgba(150,220,210,.34);box-shadow:0 10px 26px rgba(10,20,24,.4),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(7px);opacity:0;transform:translateY(8px);transition:opacity .32s,transform .32s}
.cloc:hover .cplaque,.cloc:focus-visible .cplaque,.cplaque.pinned{opacity:1;transform:translateY(0)}
.cplaque .u{font-size:11px;font-weight:800;letter-spacing:.2px}
.cplaque .nm{font-family:var(--font-title);font-size:18px;font-weight:800;color:#FDF6E9;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cplaque .en{font-size:10.5px;color:#B9CFC9;direction:ltr}
.cplaque .desc{font-size:11.5px;color:#DCECE6;margin-top:5px;line-height:1.5}
.cplaque .prog{margin-top:8px;height:6px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.cplaque .prog i{display:block;height:100%;border-radius:4px;width:0}
/* per-world accent */
.cloc.lab .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(231,160,99,.4),transparent 72%)}
.cloc.hall .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(255,217,168,.45),transparent 72%)}
.cloc.obs .cloc-halo{background:radial-gradient(60% 50% at 50% 45%,rgba(111,160,218,.42),transparent 72%)}
.cloc.lab .cplaque .u{color:#F3C57E} .cloc.lab .cplaque .prog i{background:linear-gradient(90deg,#C57B3D,#F3C57E)}
.cloc.hall .cplaque .u{color:#FFD9A8} .cloc.hall .cplaque .prog i{background:linear-gradient(90deg,#3B9188,#A7E6DD)}
.cloc.obs .cplaque .u{color:#9FC4EA} .cloc.obs .cplaque .prog i{background:linear-gradient(90deg,#3E6EA6,#9FC4EA)}

/* لوحة الوحدة تحمل الاسم الرسمي للوحدة، فيجب أن تكون مقروءة دائمًا لا عند المرور فقط */
.cloc .cplaque{opacity:1;transform:translateY(0)}
.cloc:hover .cplaque,.cloc:focus-visible .cplaque{
  border-color:rgba(180,240,230,.55);box-shadow:0 14px 30px rgba(10,20,24,.55),inset 0 1px 0 rgba(255,255,255,.16)}
.cplaque .nm{text-shadow:0 1px 5px rgba(0,0,0,.75)}
.cplaque{background:linear-gradient(180deg,rgba(14,32,38,.80),rgba(8,20,26,.86))}

/* ---------- opening sequence ---------- */
.cop-title{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:11;opacity:0;animation:opTitle 1s ease-out .6s forwards}
@keyframes opTitle{to{opacity:1}}
.cop-title h1{font-family:var(--font-title);font-size:56px;font-weight:900;margin:0;color:#FBF3E4;
  text-shadow:0 2px 0 rgba(120,70,20,.4),0 10px 34px rgba(60,30,8,.5),0 0 40px rgba(255,220,150,.25)}
.cop-title .en{font-size:15px;letter-spacing:4px;color:#F0D8B4;direction:ltr;margin-top:6px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.cop-cta{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);z-index:12;text-align:center;opacity:0;animation:opTitle .9s ease-out 1.4s forwards}
.cop-sub{margin-top:12px;font-size:14px;color:#EAF4E8;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* credit — high contrast, elegant, readable on any scene */
.credit-band{position:absolute;bottom:14px;left:0;right:0;text-align:center;z-index:12}
.credit-band span{display:inline-block;padding:5px 16px;border-radius:20px;font-size:13.5px;font-weight:700;color:#FFF6E4;
  background:rgba(14,26,30,.5);border:1px solid rgba(255,236,200,.28);backdrop-filter:blur(5px);
  text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* carved-copper CTA */
.cta-plate{position:relative;min-height:62px;padding:16px 44px;border:none;border-radius:18px;
  font-family:var(--font-title);font-size:22px;font-weight:800;color:#2a1608;
  background:linear-gradient(180deg,#F8CD8B,#DE974B 58%,#C57B3D);
  box-shadow:0 11px 0 #9E5C28,0 24px 46px rgba(120,60,20,.45),inset 0 2px 5px rgba(255,240,210,.75);
  transition:transform .12s,box-shadow .12s}
.cta-plate:hover{transform:translateY(-2px);box-shadow:0 13px 0 #9E5C28,0 30px 54px rgba(120,60,20,.5),inset 0 2px 5px rgba(255,240,210,.85)}
.cta-plate:active{transform:translateY(7px);box-shadow:0 4px 0 #9E5C28,0 10px 20px rgba(120,60,20,.4)}

/* ---------- hub title ---------- */
.chub-title{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:11;pointer-events:none}
.chub-title::before{content:'';position:absolute;left:50%;top:-16px;transform:translateX(-50%);
  width:520px;height:104px;border-radius:50%;z-index:-1;
  background:radial-gradient(60% 60% at 50% 50%,rgba(24,14,6,.42),transparent 72%)}
.chub-title h1{font-family:var(--font-title);font-size:32px;font-weight:900;margin:0;color:#FBF3E4;text-shadow:0 2px 10px rgba(40,20,8,.6)}
.chub-title .en{font-size:12.5px;color:#E7CFA8;direction:ltr;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* spatial transition into a location */
.cit-enter{animation:citEnter .55s cubic-bezier(.4,0,.2,1)}
@keyframes citEnter{from{transform:scale(1);opacity:1}to{transform:scale(1.5);opacity:0}}
.cit-arrive{animation:citArrive .5s ease-out}
@keyframes citArrive{from{transform:scale(.86);opacity:.3}to{transform:scale(1);opacity:1}}

/* ---------- compact control dock ---------- */
.dock{position:absolute;top:14px;left:14px;z-index:24;display:flex;gap:7px;align-items:center}
.dock.right{left:auto;right:14px}
.dock-btn{width:42px;height:42px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(24,40,44,.66),rgba(14,26,30,.74));
  border:1px solid rgba(150,220,210,.3);box-shadow:0 6px 16px rgba(8,16,20,.4);backdrop-filter:blur(6px);color:#FCEBCF}
.dock-btn:hover{background:linear-gradient(180deg,rgba(34,54,58,.8),rgba(20,34,38,.86))}
.dock-btn svg{width:20px;height:20px}
.dock-btn.wide{width:auto;padding:0 13px;gap:7px;font-size:13px;font-weight:700}

/* ---------- reduced motion: keep it premium, drop motion ---------- */
body.rm .cbeam,body.rm .falaj-flow,body.rm .flow-dot,body.rm .anim-float,body.rm .anim-glow,body.rm .cparts{animation:none!important}
body.rm .cop-title,body.rm .cop-cta{animation:none!important;opacity:1!important}
body.rm .cit .clayer{transition:none!important}
/* in RM, show the falaj as a steady luminous line (static premium look) */
body.rm .falaj-flow{stroke-dasharray:none;opacity:.9}
body.rm .cplaque{opacity:.9!important;transform:none!important}

/* low performance: hide heavy decor */
body.lp .cparts,body.lp .cbeam,body.lp .decor,body.lp .falaj-flow{display:none!important}
body.lp .cplaque,body.lp .dock-btn{backdrop-filter:none!important}

/* ---------- lesson index inside the environment (gallery) ---------- */
.gallery{position:absolute;inset:0;overflow:hidden}
.gallery .gwalk{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;
  background:linear-gradient(180deg,transparent,rgba(58,36,18,.5));pointer-events:none}
.station-row{position:absolute;left:0;right:0;top:150px;bottom:96px;z-index:5;
  display:flex;gap:20px;align-items:center;justify-content:center;padding:0 40px;flex-wrap:nowrap}
.station{position:relative;width:180px;min-height:236px;cursor:pointer;border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;
  box-shadow:0 16px 36px rgba(12,24,20,.5)}
.station:hover,.station:focus-visible{transform:translateY(-8px);outline:none}
.station .st-scene{height:118px;position:relative;overflow:hidden}
.station .st-scene svg{position:absolute;inset:0;width:100%;height:100%}
.station .st-body{flex:1;padding:11px 13px 13px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(20,40,44,.96),rgba(13,28,32,.98))}
.station .st-code{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:6px;align-self:flex-start}
.station .st-title{font-family:var(--font-title);font-weight:800;font-size:15px;color:#FBF3E4;margin-top:7px;line-height:1.35;text-align:center}
.station .st-en{font-size:10px;color:#A9C4BD;direction:ltr;text-align:center;margin-top:1px}
.station .st-tag{margin-top:auto;font-size:10.5px;padding:2px 9px;border-radius:16px;align-self:center}
.station.feat{border:2px solid var(--teal-2)}
.station.feat .st-code{background:var(--teal-2)}
.station.soon{opacity:.82;border:1.5px solid rgba(255,236,200,.16)}
.station.soon .st-code{background:var(--muted)}
.station.soon .st-tag{background:rgba(197,123,61,.16);border:1px solid rgba(197,123,61,.3);color:#EAD9C6}
.station.done .st-code{background:var(--teal-2)}
.station .st-done{position:absolute;top:8px;left:8px;z-index:3;color:var(--teal-hi);font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gindex-project{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:6}

/* CP3 temporary: Unit-3 entrance is inert scenery (no interaction, no hover affordance).
   Removed in Checkpoint 4 when Unit 3 becomes fully accessible. */
.cloc.cloc-inactive{cursor:default;pointer-events:none}
.cloc.cloc-inactive .cplaque{opacity:0}
.cloc.cloc-inactive:hover,.cloc.cloc-inactive:focus-visible{transform:none}
.cloc.cloc-inactive:hover .cloc-halo{opacity:0}

/* ==== styles/word.css ==== */
/* ==== styles/word.css — محاكي Microsoft Word: مطابقة بصرية ضمن نطاق المنهج ==== */
:root{
  --w-blue:#2B579A; --w-blue-2:#1F3F70; --w-ribbon:#F3F2F1; --w-ribbon-b:#E1DFDD;
  --w-tabtext:#444; --w-accent:#2B579A; --w-page:#fff; --w-canvas:#868686;
}
.wordapp{position:absolute;z-index:3;border-radius:8px;overflow:hidden;background:#FAF9F8;
  box-shadow:0 18px 46px rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif}

/* ---------- title bar ---------- */
.wa-title{height:32px;flex:0 0 32px;display:flex;align-items:center;gap:10px;padding:0 8px;
  background:var(--w-blue);color:#fff;font-size:11.5px;direction:ltr;cursor:move;user-select:none}
.wa-autosave{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);
  padding:2px 8px;border-radius:11px;font-size:10.5px;opacity:.92}
.wa-autosave .sw{width:20px;height:11px;border-radius:6px;background:rgba(255,255,255,.35);position:relative;display:inline-block}
.wa-autosave .sw i{position:absolute;left:1px;top:1px;width:9px;height:9px;border-radius:50%;background:#fff}
.wa-autosave .off{font-weight:600}
.wa-qa{display:flex;align-items:center;gap:2px}
.wa-qi{width:22px;height:22px;border-radius:3px;border:none;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.wa-qi:hover{background:rgba(255,255,255,.18)}
.wa-titlemid{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px}
.wa-docname{font-weight:600}
.wa-saved{opacity:.75;font-size:10.5px}
.wa-search{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);
  padding:3px 22px 3px 8px;border-radius:3px;font-size:10.5px;opacity:.9}
.wa-signin{font-size:10.5px;opacity:.9}
.wa-winbtns{display:flex;gap:10px;font-size:10px;opacity:.9;padding-left:4px}
.wa-winbtns .x{color:#fff}

/* ---------- tabs ---------- */
.wa-tabs{flex:0 0 28px;display:flex;align-items:flex-end;gap:0;padding:0 6px;background:var(--w-blue);direction:ltr}
.wa-tab{height:26px;padding:0 10px;font-size:11.5px;font-weight:400;color:#fff;background:transparent;
  border:none;border-radius:4px 4px 0 0;cursor:pointer;letter-spacing:.1px}
.wa-tab:hover{background:rgba(255,255,255,.14)}
.wa-tab.on{background:var(--w-ribbon);color:#1a1a1a;font-weight:600}
.wa-tab.dim{opacity:.72;cursor:default}
.wa-tab.dim:hover{background:transparent}
.wa-tab.picfmt{background:rgba(255,255,255,.16)}
.wa-tab.picfmt.on{background:var(--w-ribbon);color:#8B2A5B;font-weight:700}

/* ---------- ribbon ---------- */
.wa-ribbon{flex:0 0 94px;background:var(--w-ribbon);border-bottom:1px solid var(--w-ribbon-b);
  display:flex;align-items:stretch;gap:0;padding:3px 4px 0;direction:ltr;overflow:hidden}
.wgroup{display:flex;flex-direction:column;justify-content:space-between;
  padding:2px 7px 1px;border-right:1px solid #D6D4D2;min-width:0}
.wgroup:last-child{border-right:none}
.wgrow{display:flex;align-items:flex-start;gap:3px}
.wglabel{font-size:9px;color:#605E5C;text-align:center;padding-top:2px}
.wstack{display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;align-items:center;gap:2px}
.wtool{min-width:24px;height:24px;padding:0 4px;border:1px solid transparent;border-radius:3px;
  background:transparent;color:#1a1a1a;display:flex;align-items:center;gap:4px;cursor:pointer;
  font-size:10.5px;font-family:"Segoe UI",Tahoma,sans-serif}
.wtool.big{flex-direction:column;justify-content:center;height:58px;min-width:48px;padding:3px 6px;gap:2px}
.wtool:hover{background:#E1DFDD;border-color:#C8C6C4}
.wtool.on{background:#CDE0F5;border-color:#8AB4E8}
.wtool.dim{opacity:.42;cursor:default}
.wtool.dim:hover{background:transparent;border-color:transparent}
.wtool .g{font-size:12.5px;min-width:15px;text-align:center;line-height:1}
.wtool .l{font-size:10px;white-space:nowrap}
.wtool.big .l{font-size:10px}
.wtool .g .hi{background:#FFFF00;padding:0 2px;border-bottom:3px solid #F2B705}
.wtool .g .fc{border-bottom:3px solid #C00000;padding:0 2px;font-weight:700}
.wtool .g .sty{font-size:9px;padding:2px 4px;border:1px solid #D6D4D2;background:#fff;border-radius:2px}
.wtool .g .sty.h{color:#2E74B5;font-size:10px}
.wtool .g .psg{display:inline-block;width:34px;height:22px;border:1px solid #C8C6C4;background:
  repeating-linear-gradient(90deg,#fff 0 10px,#EDEBE9 10px 12px)}
/* alignment glyphs drawn with CSS so they read like Word */
.al{display:inline-block;width:14px;height:11px;position:relative}
.al::before,.al::after{content:'';position:absolute;left:0;right:0;height:1.6px;background:#333}
.al::before{top:0;box-shadow:0 3.4px 0 #333}
.al::after{top:6.8px;box-shadow:0 3.4px 0 #333}
.al.ar::before{left:3px}.al.ar::after{left:3px}
.al.ac::before{left:2px;right:2px}.al.ac::after{left:2px;right:2px}
.al.alf::before{right:3px}.al.alf::after{right:3px}

.wcombo{height:22px;min-width:44px;padding:0 5px;border:1px solid #C8C6C4;border-radius:2px;background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:10.5px;cursor:pointer;color:#1a1a1a}
.wcombo.wide{min-width:104px}
.wcombo:hover{border-color:#2B579A}
.wcombo .c{color:#666;font-size:9px}

/* ---------- ruler + canvas ---------- */
.wa-ruler{flex:0 0 15px;background:#F3F2F1;border-bottom:1px solid #E1DFDD;display:flex;
  align-items:flex-end;gap:0;padding:0 60px 2px;justify-content:center}
.wa-ruler i{width:11px;height:3px;border-right:1px solid #B7B5B3;display:block}
.wa-ruler i.maj{height:7px;border-right-color:#8A8886}
.wa-canvas{flex:1;background:var(--w-canvas);padding:14px;overflow-y:auto;overflow-x:hidden;
  position:relative;display:flex;justify-content:center}
.wa-canvas::-webkit-scrollbar{width:14px}
.wa-canvas::-webkit-scrollbar-track{background:#DEDEDE}
.wa-canvas::-webkit-scrollbar-thumb{background:#A6A6A6;border:3px solid #DEDEDE;border-radius:7px}
.wa-canvas::-webkit-scrollbar-thumb:hover{background:#8A8886}
.wa-canvas{scrollbar-width:auto;scrollbar-color:#A6A6A6 #DEDEDE}
.wa-page{width:560px;min-height:400px;background:var(--w-page);box-shadow:0 2px 10px rgba(0,0,0,.35);
  padding:38px 46px;position:relative;transform-origin:top center;margin-bottom:10px;flex:0 0 auto}
.wa-page .doc{outline:none;font-family:var(--font-body),Tahoma,Arial,sans-serif;font-size:16px;line-height:1.9;
  color:#000;min-height:320px;direction:rtl;caret-color:#2B579A;text-align:right}
.wa-page .doc:empty::before{content:attr(data-placeholder);color:#BDBDBD}
.wa-page .doc p{margin:0 0 8px}
/* عنوان المستند المرفق يُترك بلا تنسيق مسبق ليطبّقه الطالب بنفسه */
.wa-page .doc p.doc-title{margin-bottom:12px}
.wa-page .doc ul,.wa-page .doc ol{margin:6px 0;padding-inline-start:26px}
.wa-page .doc li{margin:2px 0}
.wa-page .doc ul.lst-circle{list-style-type:circle}
.wa-page .doc ul.lst-square{list-style-type:square}
.wa-page .doc ul.lst-check{list-style:none}
.wa-page .doc ul.lst-check li::before{content:'✔ ';color:#2E74B5}
.wa-page .doc ol.lst-arabic-indic{list-style-type:arabic-indic}
.wa-page .doc ol.lst-alpha{list-style-type:arabic-indic}
.wa-page .doc ::selection,.wa-page .doc::selection{background:#B4D5FE;color:#000}

/* ---------- status bar ---------- */
.wa-status{flex:0 0 24px;background:var(--w-ribbon);border-top:1px solid var(--w-ribbon-b);display:flex;
  align-items:center;gap:14px;padding:0 10px;font-size:10.5px;color:#333;direction:ltr}
.wa-zoom{display:flex;align-items:center;gap:6px}
.wa-zoom input{width:88px;accent-color:#2B579A}
.wa-zoom .z-val{width:36px;text-align:center}
.wa-zoom .zb{width:16px;height:16px;line-height:1;border:none;background:transparent;cursor:pointer;color:#333;font-size:13px}
.wa-zoom .zb:hover{background:#E1DFDD;border-radius:3px}

/* ---------- popups: dropdown / palette / gallery ---------- */
.wdrop,.wpal,.wgal{position:absolute;z-index:60;background:#fff;border:1px solid #C8C6C4;
  box-shadow:0 6px 20px rgba(0,0,0,.28);border-radius:3px;padding:4px;direction:ltr;font-size:11.5px;color:#1a1a1a;
  font-family:"Segoe UI",Tahoma,sans-serif}
.wdi-h{font-size:10px;color:#605E5C;padding:4px 8px;border-bottom:1px solid #EDEBE9;margin-bottom:3px}
.wdi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.wdi:hover{background:#E1DFDD}
.wdi.dim{opacity:.45;cursor:default}
.wdi.dim:hover{background:transparent}
.wdi .ar{display:block;font-size:10px;color:#605E5C;direction:rtl}
.wdi .wline{display:inline-block;width:44px;background:#333;border-radius:1px}
.wdi .pre{width:16px;text-align:center}
.wpal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px}
.wpal .sw{width:20px;height:20px;border:1px solid #C8C6C4;border-radius:2px;cursor:pointer}
.wpal .sw:hover{outline:2px solid #2B579A}
.wgal{min-width:150px}
.wgal.wide{min-width:330px}
.wgal-h{font-size:10px;color:#605E5C;padding:4px 8px}
.wgal-g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
.wgal-g.styles{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.wgal-i{border:1px solid #E1DFDD;background:#fff;border-radius:2px;padding:6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.wgal-i:hover{border-color:#2B579A;background:#EFF6FC}
.wgal-i .g{font-size:12px;color:#333}
.wgal-i .nm{font-size:9px;color:#605E5C;direction:rtl;text-align:center}
.wgal-i .pv{display:block;width:62px;height:42px;background:linear-gradient(135deg,#9CC4E4,#5B9BD5)}
/* wrap-option mini icons */
.wico{display:inline-block;width:18px;height:14px;border:1px solid #999;background:
  repeating-linear-gradient(180deg,#666 0 1px,transparent 1px 4px);position:relative}
.wico::after{content:'';position:absolute;background:#2B579A}
.wico-inline::after{left:6px;top:4px;width:6px;height:6px}
.wico-square::after{left:2px;top:3px;width:7px;height:8px}
.wico-tight::after{left:3px;top:3px;width:6px;height:8px;border-radius:3px}
.wico-through::after{left:5px;top:2px;width:7px;height:10px;border-radius:50%}
.wico-tb::after{left:2px;top:5px;right:2px;width:auto;height:5px}
.wico-behind::after{left:5px;top:3px;width:8px;height:8px;opacity:.45}
.wico-front::after{left:5px;top:3px;width:8px;height:8px;box-shadow:0 0 0 1px #fff}

/* ---------- backstage (File) ---------- */
.wa-backstage{position:absolute;inset:32px 0 0 0;z-index:40;background:#fff;display:flex;direction:ltr;
  font-family:"Segoe UI",Tahoma,sans-serif}
.bs-side{width:150px;flex:0 0 150px;background:var(--w-blue);color:#fff;padding:8px 0;display:flex;flex-direction:column;gap:1px}
.bs-back{width:30px;height:30px;margin:0 0 10px 10px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
.bs-item{text-align:left;padding:7px 18px;background:transparent;border:none;color:#fff;font-size:12px;cursor:pointer}
.bs-item:hover{background:rgba(255,255,255,.14)}
.bs-item.on{background:#1F3F70;font-weight:600}
.bs-item.dim{opacity:.55;cursor:default}
.bs-item.dim:hover{background:transparent}
.bs-sep{height:1px;background:rgba(255,255,255,.24);margin:8px 14px}
.bs-body{flex:1;padding:16px 22px;overflow:auto;color:#1a1a1a}
.bs-h{font-size:26px;font-weight:300;margin:0 0 14px;color:#1a1a1a}
.bs-h2{font-size:12px;color:#605E5C;margin-bottom:6px}
.bs-open{display:flex;gap:22px}
.bs-places{width:180px;flex:0 0 180px;display:flex;flex-direction:column;gap:2px}
.bs-place{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:2px;font-size:11.5px;
  background:transparent;border:none;cursor:pointer;text-align:left;color:#1a1a1a}
.bs-place .i{width:16px;text-align:center}
.bs-place:hover{background:#F3F2F1}
.bs-place.on{background:#EDEBE9;font-weight:600}
.bs-place.dim{opacity:.5;cursor:default}
.bs-place.browse{border:1px solid #C8C6C4;margin-top:6px;font-weight:600}
.bs-place.browse:hover{background:#DEECF9;border-color:#2B579A}
.bs-lbl{font-size:10px;color:#605E5C;padding:8px 10px 2px;background:#F3F2F1;margin-top:6px}
.bs-recent{flex:1}
.bs-file{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:transparent;
  cursor:pointer;text-align:left;border-radius:2px}
.bs-file:hover{background:#F3F2F1}
.bs-file .ic{width:24px;height:28px;background:#2B579A;color:#fff;border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:12px}
.bs-file .n{font-size:12px;color:#1a1a1a}
.bs-file .p{font-size:10px;color:#605E5C}
.bs-tip{margin-top:16px;font-size:11.5px;color:#2B579A;background:#EFF6FC;border:1px solid #C7E0F4;
  padding:8px 12px;border-radius:3px;direction:rtl;text-align:right}
/* print backstage */
.bs-print{display:flex;gap:20px;height:calc(100% - 46px)}
.bs-pset{width:230px;flex:0 0 230px;display:flex;flex-direction:column;gap:5px}
.bs-prow{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.bs-printbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:8px 0;
  border:1px solid #C8C6C4;background:#fff;border-radius:2px;cursor:pointer;font-size:11.5px}
.bs-printbtn:hover{background:#DEECF9;border-color:#2B579A}
.bs-printbtn .pic{font-size:22px}
.bs-copiesbox{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#333}
.bs-copies{width:56px;height:22px;border:1px solid #C8C6C4;padding:0 4px;font-size:11.5px}
.bs-sechd{font-size:12px;color:#2B579A;font-weight:600;border-bottom:1px solid #E1DFDD;padding-bottom:2px;margin-top:8px}
.bs-sel{height:26px;border:1px solid #C8C6C4;background:#fff;padding:0 6px;font-size:11px;color:#1a1a1a;
  display:flex;align-items:center;border-radius:2px;width:100%}
.bs-sel.dim{opacity:.55}
select.bs-sel{cursor:pointer}
.bs-ready{font-size:10.5px;color:#107C10}
.bs-note{font-size:10.5px;color:#605E5C;direction:rtl;text-align:right;margin-top:8px;line-height:1.6}
.bs-preview{flex:1;background:#868686;border-radius:2px;padding:12px;display:flex;flex-direction:column;
  align-items:center;gap:8px;overflow:auto}
.bs-sheets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bs-sheet{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);overflow:hidden;flex:0 0 auto}
.bs-sheet.portrait{width:132px;height:186px}
.bs-sheet.landscape{width:186px;height:132px}
.bs-sheetdoc{transform:scale(.22);transform-origin:top left;width:560px;direction:rtl;padding:10px 14px;font-size:16px;line-height:1.9}
.bs-pfoot{font-size:10.5px;color:#fff}

/* ---------- windows-style dialogs (Open / Save / Insert Picture) ---------- */
.wdlg{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI",Tahoma,sans-serif;direction:ltr}
.wd-win{width:620px;background:#F0F0F0;border:1px solid #7A7A7A;box-shadow:0 18px 44px rgba(0,0,0,.5);border-radius:4px;overflow:hidden}
.wd-win.small{width:440px}
.wd-title{height:28px;background:#2B579A;color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px}
.wd-title .wic{width:16px;height:16px;background:#fff;color:#2B579A;border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px}
.wd-title .x{cursor:pointer;padding:0 4px}
.wd-crumb{height:28px;background:#fff;border-bottom:1px solid #DDD;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:11px;color:#333}
.wd-crumb .nav{color:#666;letter-spacing:2px}
.wd-crumb .path{background:#F5F5F5;border:1px solid #DDD;padding:2px 8px;border-radius:2px;flex:1}
.wd-crumb .search{background:#F5F5F5;border:1px solid #DDD;padding:2px 8px;border-radius:2px;color:#999;width:130px}
.wd-bar{height:24px;background:#F0F0F0;border-bottom:1px solid #DDD;display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11px;color:#333}
.wd-body{display:flex;height:250px;background:#fff}
.wd-side{width:130px;flex:0 0 130px;border-right:1px solid #DDD;padding:6px 0;overflow:auto;background:#fff}
.wd-nav{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:#1a1a1a}
.wd-nav:hover{background:#E5F3FF}
.wd-nav.on{background:#CCE8FF}
.wd-list{flex:1;overflow:auto;padding:6px}
.wd-list.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.wd-item{display:flex;align-items:center;gap:9px;padding:5px 8px;font-size:11.5px;cursor:pointer;border-radius:2px;color:#1a1a1a}
.wd-item:hover{background:#E5F3FF}
.wd-item.sel{background:#CCE8FF;outline:1px solid #99D1FF}
.wd-item .ic{width:19px;height:22px;display:flex;align-items:center;justify-content:center}
.wd-item .ic.w{background:#2B579A;color:#fff;border-radius:2px;font-weight:700;font-size:10px}
.wd-tile{padding:6px;border-radius:2px;cursor:pointer;text-align:center}
.wd-tile:hover{background:#E5F3FF}
.wd-tile.sel{background:#CCE8FF;outline:1px solid #99D1FF}
.wd-tile .th{width:100%;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;background:#fff;border:1px solid #E5E5E5}
.wd-tile .cap{font-size:10px;color:#333;margin-top:4px;line-height:1.3;direction:rtl}
.wd-foot{background:#F0F0F0;border-top:1px solid #DDD;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:11.5px}
.wd-savebody{background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:11.5px}
.wd-name{flex:1;height:24px;border:1px solid #7A7A7A;padding:0 6px;font-size:11.5px;background:#fff;direction:rtl;text-align:right}
.wd-name.wide{width:100%}
.wd-sel{height:24px;border:1px solid #7A7A7A;padding:2px 8px;background:#fff;font-size:11px;display:flex;align-items:center}
.wd-sel.dim{opacity:.7}
.wd-btn{height:24px;min-width:74px;border:1px solid #ADADAD;background:#E1E1E1;font-size:11.5px;cursor:pointer;border-radius:2px}
.wd-btn:hover{background:#E5F1FB;border-color:#0078D7}
.wd-btn.primary{background:#DDECFB;border-color:#0078D7;font-weight:600}
.wd-btn[disabled]{opacity:.5;cursor:default}

/* ---------- inserted image ---------- */
.doc-img{position:relative;display:inline-block;line-height:0;margin:3px}
.doc-img .imgfill{display:inline-block;overflow:hidden;position:relative;line-height:0;background:#fff}
.doc-img .imginner{display:block;width:100%;height:100%;line-height:0}
.doc-img .imginner svg{display:block;width:100%;height:100%}
.doc-img.selected{outline:1px solid #2B579A}
.doc-img .handle{position:absolute;width:13px;height:13px;background:#fff;border:2px solid #2B579A;border-radius:50%;z-index:5;touch-action:none}
.doc-img .handle.nw{top:-7px;right:-7px;cursor:nwse-resize}
.doc-img .handle.ne{top:-7px;left:-7px;cursor:nesw-resize}
.doc-img .handle.sw{bottom:-7px;right:-7px;cursor:nesw-resize}
.doc-img .handle.se{bottom:-7px;left:-7px;cursor:nwse-resize}
.doc-img.cropping .imgfill{outline:2px dashed #333}
.doc-img .crop-frame{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:visible}
.doc-img .crop-shade{position:absolute;inset:0;background:rgba(0,0,0,.42);pointer-events:none}
.doc-img .crop-h{position:absolute;background:#111;pointer-events:auto;z-index:7;touch-action:none}
.doc-img .crop-h.t{top:-4px;left:32%;right:32%;height:9px;cursor:ns-resize}
.doc-img .crop-h.b{bottom:-4px;left:32%;right:32%;height:9px;cursor:ns-resize}
.doc-img .crop-h.l{left:-4px;top:32%;bottom:32%;width:9px;cursor:ew-resize}
.doc-img .crop-h.r{right:-4px;top:32%;bottom:32%;width:9px;cursor:ew-resize}
/* wrap modes */
.doc-img.wrap-inline{vertical-align:middle}
.doc-img.wrap-square{float:left;margin:4px 14px 8px 0;shape-outside:margin-box}
.doc-img.wrap-tight{float:left;margin:4px 10px 6px 0;shape-outside:margin-box}
.doc-img.wrap-through{float:left;margin:4px 6px 4px 0}
.doc-img.wrap-tb{display:block;float:none;margin:12px auto;clear:both}
.doc-img.wrap-behind{position:relative;z-index:0;opacity:.9;margin:-40px 0 -40px 0}
.doc-img.wrap-front{position:relative;z-index:3}
/* picture styles */
.doc-img.ps-simpleframe .imgfill{border:6px solid #fff;box-shadow:0 0 0 1px #BFBFBF}
.doc-img.ps-thickblack .imgfill{border:9px solid #111}
.doc-img.ps-ovalsoft .imgfill{border-radius:50%;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.doc-img.ps-roundshadow .imgfill{border-radius:12px;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.doc-img.ps-perspective .imgfill{transform:perspective(600px) rotateY(14deg);box-shadow:0 12px 18px rgba(0,0,0,.35);border-radius:6px}
/* picture-style previews in gallery */
.wgal-i .pv.ps-simpleframe{border:5px solid #fff;box-shadow:0 0 0 1px #BFBFBF;width:52px;height:34px}
.wgal-i .pv.ps-thickblack{border:6px solid #111;width:50px;height:32px}
.wgal-i .pv.ps-ovalsoft{border-radius:50%;box-shadow:0 4px 8px rgba(0,0,0,.35)}
.wgal-i .pv.ps-roundshadow{border-radius:9px;box-shadow:0 5px 10px rgba(0,0,0,.4)}
.wgal-i .pv.ps-perspective{transform:perspective(300px) rotateY(16deg);box-shadow:0 6px 10px rgba(0,0,0,.35);border-radius:4px}
/* ---------- instruction / task panel (never covers document) ---------- */
.taskpanel{position:absolute;z-index:14;top:64px;right:14px;width:264px;
  background:linear-gradient(180deg,rgba(24,18,10,.95),rgba(16,11,6,.97));
  border:1.5px solid var(--glass-edge);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden}
.tp-head{padding:11px 14px;background:linear-gradient(180deg,rgba(197,123,61,.9),rgba(158,92,40,.9));color:#2a1608}
.tp-head .stage{font-size:11px;font-weight:800}
.tp-head .mode{font-size:12.5px;font-weight:800;margin-top:1px}
.tp-body{padding:12px 14px}
.tp-instr{font-family:var(--font-title);font-size:15.5px;font-weight:800;color:var(--cream);line-height:1.55}
.tp-instr .en{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);direction:ltr;margin-top:3px;font-weight:500}
.tp-steps{margin:12px 0 0;padding:0;list-style:none;max-height:150px;overflow:auto}
.tp-steps li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--cream-2)}
.tp-steps li .b{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:1.6px solid var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.tp-steps li.done .b{background:var(--teal-2);border-color:var(--teal-2);color:#fff}
.tp-steps li.cur{color:var(--cream)}
.tp-steps li.cur .b{border-color:var(--copper-hi);color:var(--copper-hi)}
.tp-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tp-btn{flex:1;min-width:70px;min-height:38px;border:none;border-radius:10px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--glass-edge)}
.tp-btn:hover{background:rgba(255,255,255,.18)}
.tp-btn.primary{background:linear-gradient(180deg,#F6C583,#DB9448);color:#2a1608;border:none}

/* feedback toast (calm) */
.wfb{position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(8px);z-index:30;
  padding:11px 20px;border-radius:12px;font-weight:800;font-size:15px;opacity:0;transition:all .2s;pointer-events:none;box-shadow:var(--sh-1)}
.wfb.on{opacity:1;transform:translateX(-50%) translateY(0)}
.wfb.ok{background:linear-gradient(180deg,#5EC98A,#3F9C68);color:#08210f}
.wfb.no{background:linear-gradient(180deg,#EAB07F,#CF6A4C);color:#2a0d05}
.wfb.hint{background:linear-gradient(180deg,#EAD79A,#D9B45A);color:#2a1e05}

/* guidance highlight ring + hand (cleaned each step) */
.w-ring{position:absolute;border:2.5px solid var(--copper-hi);border-radius:11px;
  box-shadow:0 0 16px rgba(255,217,168,.6);pointer-events:none;z-index:16;transition:all .15s}
.w-hand{position:absolute;z-index:17;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));animation:handTap 1.2s ease-in-out infinite}
.w-hand svg{width:34px;height:34px}
@keyframes handTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* offline file picker */
.fp{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,20,24,.55)}
.fp-win{width:560px;max-width:92%;border-radius:14px;overflow:hidden;background:#F3ECDE;box-shadow:var(--sh-2);border:1px solid rgba(120,80,40,.4)}
.fp-title{height:38px;background:linear-gradient(180deg,#3B9188,#2A6E67);color:#EAF6EF;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:700;gap:8px}
.fp-crumb{padding:8px 14px;background:#EADFC8;border-bottom:1px solid #C7B48E;font-size:12px;color:#6B421F;display:flex;align-items:center;gap:6px}
.fp-body{display:flex;min-height:230px}
.fp-side{width:150px;background:#E4D6BE;border-left:1px solid #C7B48E;padding:8px}
.fp-side .navf{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:#3A2A1B;cursor:pointer}
.fp-side .navf:hover,.fp-side .navf.on{background:#F3ECDE}
.fp-side .navf svg{width:18px;height:18px}
.fp-main{flex:1;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.fp-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px;border-radius:10px;cursor:pointer;border:1.6px solid transparent}
.fp-item:hover{background:#EADFC8}
.fp-item.sel{background:#D8ECE7;border-color:#2A6E67}
.fp-item .thumb{width:64px;height:48px;border-radius:6px;overflow:hidden;box-shadow:var(--sh-soft);background:#B7D6C9}
.fp-item .thumb svg{width:100%;height:100%}
.fp-item .cap{font-size:11px;color:#3A2A1B;text-align:center;line-height:1.3}
.fp-foot{padding:10px 14px;background:#EADFC8;border-top:1px solid #C7B48E;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fp-foot .fname{flex:1;background:#fff;border:1px solid #C7B48E;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#3A2A1B}
.fp-btn{min-height:40px;padding:0 18px;border:none;border-radius:10px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#3B9188,#2A6E67);color:#EAF6EF}
.fp-btn.ghost{background:transparent;color:#6B421F;border:1px solid #C7B48E}
.fp-btn:disabled{opacity:.5}

/* save dialog */
.savedlg{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,20,24,.55)}
.savedlg .win{width:440px;max-width:92%;border-radius:14px;overflow:hidden;background:#F3ECDE;box-shadow:var(--sh-2)}
.savedlg .win .b{padding:18px}
.savedlg label{font-size:13px;color:#3A2A1B;font-weight:700}
.savedlg input{width:100%;margin-top:8px;padding:10px 12px;border:1.5px solid #C7B48E;border-radius:9px;font-size:14px;font-family:var(--font-body);direction:rtl}
.savedlg .row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}

/* wrap chooser popover */
.wrapmenu{position:absolute;z-index:18;background:#F3ECDE;border:1px solid #C7B48E;border-radius:12px;box-shadow:var(--sh-2);padding:6px;min-width:180px}
.wrapmenu .wi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;color:#3A2A1B}
.wrapmenu .wi:hover{background:#EADFC8}
.wrapmenu .wi svg{width:22px;height:22px;color:#6B421F}
.wrapmenu .wi .en{font-size:10px;color:#8A6A44;direction:ltr}

/* lesson-complete card */
.wdone{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 60% at 50% 45%,rgba(20,40,44,.8),rgba(10,20,24,.92))}
.wdone .in{width:min(560px,88%);text-align:center;padding:30px;border-radius:22px;
  background:linear-gradient(165deg,#F3ECDE,#E4D6BE);box-shadow:var(--sh-2)}
.wdone .in .mk{font-size:52px}
.wdone .in h2{font-family:var(--font-title);font-size:26px;color:#2A6E67;margin:6px 0}
.wdone .in p{font-size:15px;color:#3A2A1B;line-height:1.7}
.wdone .in .row{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* mode chooser (guided / independent) */
.modepick{position:absolute;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(70% 60% at 50% 40%,rgba(20,40,44,.72),rgba(10,20,24,.9))}
.modepick .card{width:min(620px,90%);padding:26px;border-radius:22px;background:linear-gradient(165deg,#243c40,#182b2f);border:1.5px solid var(--glass-edge);box-shadow:var(--sh-2)}
.modepick h2{font-family:var(--font-title);font-size:24px;color:var(--cream);margin:0 0 4px;text-align:center}
.modepick .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
.modepick .opts{display:flex;gap:14px}
.mode-opt{flex:1;padding:18px;border-radius:16px;cursor:pointer;text-align:center;
  background:rgba(255,255,255,.06);border:1.6px solid var(--glass-edge);transition:all .15s}
.mode-opt:hover{background:rgba(255,255,255,.12);transform:translateY(-3px)}
.mode-opt .mi{width:54px;height:54px;margin:0 auto 10px;color:var(--copper-hi)}
.mode-opt .t{font-family:var(--font-title);font-size:18px;font-weight:800;color:var(--cream)}
.mode-opt .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ==== 2.7 — مرحلة التخطيط والتعاون ==== */
.plan-wrap{position:absolute;z-index:12;left:14px;top:74px;width:966px;max-height:600px;overflow:auto;
  display:flex;flex-direction:column;gap:10px}
.plan-card{background:linear-gradient(180deg,rgba(252,246,236,.97),rgba(244,235,220,.97));
  border:2px solid rgba(150,100,50,.4);border-radius:16px;padding:12px 16px}
.plan-card h3{font-family:var(--font-title);font-size:17px;font-weight:800;color:#7A3E12;margin:0 0 6px}
.plan-card p{font-size:14px;line-height:1.9;color:#3A2A1B;margin:0}
.plan-roles{display:flex;gap:10px;flex-wrap:wrap}
.plan-role{flex:1 1 210px;text-align:start;border:2px solid #DCC29C;background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}
.plan-role:hover{border-color:#E08A3C;background:#FFF7EA}
.plan-role.on{border-color:#3E8E5A;background:#EAF7EE}
.plan-role .nm{font-weight:800;font-size:14.5px;color:#7A3E12}
.plan-role .en{font-size:10.5px;color:#8A6A44;direction:ltr}
.plan-role .jb{font-size:12px;color:#3A2A1B;margin-top:4px;line-height:1.6}
.plan-ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan-idea{display:flex;align-items:center;gap:9px;border:2px solid #DCC29C;background:#fff;border-radius:11px;
  padding:8px 11px;cursor:pointer;font-size:13.5px;color:#3A2A1B;text-align:start}
.plan-idea:hover{border-color:#E08A3C;background:#FFF7EA}
.plan-idea .dot{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid #C08A4E;background:#fff;
  display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800}
.plan-idea.on{border-color:#3E8E5A;background:#EAF7EE}
.plan-idea.on .dot{background:#3E8E5A;border-color:#2C6B42;color:#fff}
.plan-idea.bad{border-color:#C0533E;background:#FBEDEA}

/* ==== styles/activity.css ==== */
/* ==== styles/activity.css — أوراق تدريبات كتاب الطالب ==== */
.actsheet{position:absolute;z-index:12;left:50%;top:56px;transform:translateX(-50%);
  width:900px;max-height:626px;overflow:auto;
  background:linear-gradient(180deg,rgba(252,246,236,.98),rgba(244,235,220,.98));
  border:2px solid rgba(150,100,50,.45);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  padding:14px 18px 16px}
.act-title{text-align:center;margin-bottom:8px}
.act-title h3{font-family:var(--font-title);font-size:20px;font-weight:800;color:#7A3E12;margin:0}
.act-title .en{font-size:11px;color:#8A6A44;direction:ltr}
.act-rail{display:flex;gap:6px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.act-pip{width:26px;height:26px;border-radius:50%;border:2px solid #C08A4E;color:#8A5A2A;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#FFF7EA}
.act-pip.cur{background:#E08A3C;color:#fff;border-color:#B4671F;transform:scale(1.12)}
.act-pip.done{background:#3E8E5A;color:#fff;border-color:#2C6B42}

.act-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
  background:linear-gradient(180deg,#E9812F,#CF6A1C);color:#fff;padding:9px 14px;border-radius:12px}
.act-n{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#fff;color:#CF6A1C;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.act-q{font-family:var(--font-title);font-size:16px;font-weight:800;line-height:1.5}
.act-qen{font-size:10.5px;opacity:.85;direction:ltr}
.act-count{margin-inline-start:auto;font-size:12px;font-weight:800;opacity:.95;white-space:nowrap;
  background:rgba(255,255,255,.22);border-radius:12px;padding:3px 10px}

.act-body{position:relative;background:#FDF6EA;border:1px solid #E3CDA9;border-radius:12px;padding:12px}
.act-actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* أزرار ورقة التدريبات على خلفية فاتحة — يجب أن تُقرأ بوضوح */
.act-actions .tp-btn{max-width:none;min-height:40px;padding:8px 18px;border-radius:12px;
  background:linear-gradient(180deg,#FFF7EA,#F3E4CC);border:2px solid #C08A4E;color:#7A3E12;
  font-size:13.5px;font-weight:800;box-shadow:0 2px 6px rgba(120,80,40,.18)}
.act-actions .tp-btn:hover{background:#FFE9C9;border-color:#A86A2E;color:#5E2E0B}
.act-actions .tp-btn:focus-visible{outline:3px solid #2C5D86;outline-offset:2px}

/* --- true / false --- */
.act-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #EEDFC6}
.act-row:last-child{border-bottom:none}
.act-row.good{background:#EAF7EE}
.act-mark{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2px solid #C08A4E;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#3E8E5A;font-size:14px}
.act-txt{flex:1;font-size:14.5px;color:#3A2A1B;line-height:1.75}
.act-tfbtns{display:flex;gap:6px}
.act-tf{width:38px;height:34px;border-radius:9px;border:2px solid;font-size:16px;font-weight:800;cursor:pointer}
.act-tf.yes{border-color:#3E8E5A;color:#2C6B42;background:#EAF7EE}
.act-tf.no{border-color:#C0533E;color:#A03B28;background:#FBEDEA}
.act-tf:hover{transform:translateY(-1px)}
.act-tf[disabled]{opacity:.45;cursor:default;transform:none}

/* --- fill in the blanks --- */
.act-banklbl{font-size:12px;color:#8A5A2A;font-weight:700;margin-bottom:4px}
.act-bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed #D9BF97}
.act-chip{padding:6px 14px;border-radius:20px;border:2px solid #C08A4E;background:#FFF7EA;color:#7A3E12;
  font-size:13.5px;font-weight:700;cursor:pointer}
.act-chip.big{font-size:13px;padding:8px 14px}
.act-chip:hover{background:#FFE9C9}
.act-chip.picked{background:#E08A3C;color:#fff;border-color:#B4671F;box-shadow:0 0 0 3px rgba(224,138,60,.3)}
.act-chip.used{opacity:.32;cursor:default;text-decoration:line-through}
.act-fillrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;padding:8px 4px;font-size:14.5px;
  color:#3A2A1B;line-height:2;border-bottom:1px solid #F0E4D0}
.act-num{font-weight:800;color:#8A5A2A}
.act-slot{min-width:130px;border:none;border-bottom:2px solid #C08A4E;background:transparent;
  font-size:14px;color:#7A3E12;font-weight:700;cursor:pointer;padding:0 6px}
.act-slot.filled{border-bottom-color:#3E8E5A;color:#2C6B42;background:#EAF7EE;border-radius:5px 5px 0 0}

/* --- match --- */
.act-match{display:flex;gap:16px}
.act-col{flex:1;display:flex;flex-direction:column;gap:7px}
.act-mitem{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;border:2px solid #DCC29C;
  background:#fff;cursor:pointer;text-align:start;font-size:13.5px;color:#3A2A1B;line-height:1.6}
.act-mitem:hover{border-color:#E08A3C}
.act-mitem.picked{border-color:#E08A3C;background:#FFF1DC;box-shadow:0 0 0 3px rgba(224,138,60,.25)}
.act-mitem.done{border-color:#3E8E5A;background:#EAF7EE;cursor:default}
.act-mnum{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#E08A3C;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.act-mnum.ok{background:#3E8E5A}
.act-mtxt{flex:1}
.act-mvis{flex:0 0 auto}

/* --- order --- */
.act-order{display:flex;flex-direction:column;gap:7px}
.act-step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:2px solid #DCC29C;
  background:#fff;cursor:pointer;text-align:start;font-size:13.5px;color:#3A2A1B}
.act-step:hover{border-color:#E08A3C}
.act-step.done{border-color:#3E8E5A;background:#EAF7EE;cursor:default}
.act-badge{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid #C08A4E;background:#FFF7EA;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#8A5A2A}
.act-step.done .act-badge{background:#3E8E5A;color:#fff;border-color:#2C6B42}

/* --- mcq --- */
.act-mcq{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #F0E4D0}
.act-mcq:last-child{border-bottom:none;margin-bottom:0}
.act-mcqq{font-size:14.5px;font-weight:700;color:#3A2A1B;margin-bottom:7px;line-height:1.7}
.act-opt{display:block;width:100%;text-align:start;padding:8px 14px;margin-bottom:6px;border-radius:20px;
  border:2px solid #DCC29C;background:#fff;font-size:13.5px;color:#3A2A1B;cursor:pointer}
.act-opt:hover{border-color:#E08A3C;background:#FFF7EA}
.act-opt.good{border-color:#3E8E5A;background:#EAF7EE;font-weight:700}
.act-opt[disabled]{cursor:default;opacity:.75}

/* --- classify --- */
.act-classify{display:flex;flex-direction:column;gap:12px}
.act-pool{display:flex;flex-wrap:wrap;gap:8px}
.act-cats{display:flex;gap:12px}
.act-cat{flex:1;border:2px dashed #C08A4E;border-radius:12px;padding:9px;background:#FFF7EA;cursor:pointer;min-height:96px}
.act-cat:hover{background:#FFEFD8}
.act-cattitle{font-size:13px;font-weight:800;color:#8A5A2A;margin-bottom:6px}
.act-catzone{display:flex;flex-direction:column;gap:5px}
.act-catchip{background:#EAF7EE;border:1px solid #3E8E5A;border-radius:9px;padding:5px 9px;font-size:12.5px;color:#2C6B42}

/* --- pick all --- */
.act-pickall{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-pick{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;border:2px solid #DCC29C;
  background:#fff;cursor:pointer;text-align:start;font-size:13.5px;color:#3A2A1B;line-height:1.6}
.act-pick:hover{border-color:#E08A3C}
.act-pick.good{border-color:#3E8E5A;background:#EAF7EE}
.act-picktxt{flex:1}
.act-pickdot{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid #C08A4E;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#3E8E5A;font-weight:800}

/* --- maze --- */
.act-maze{min-height:130px}
.act-mazepath{font-size:13.5px;font-weight:700;color:#2C6B42;background:#EAF7EE;border:1px solid #A9D4B8;
  border-radius:10px;padding:8px 12px;margin-bottom:10px;direction:rtl}
.act-mazeopts{display:flex;gap:8px;flex-wrap:wrap}
.act-mazeopt{padding:9px 16px;border-radius:11px;border:2px solid #DCC29C;background:#fff;font-size:13.5px;
  color:#3A2A1B;cursor:pointer}
.act-mazeopt:hover{border-color:#E08A3C;background:#FFF7EA}

/* --- feedback toast --- */
.act-toast{position:absolute;left:50%;bottom:10px;transform:translate(-50%,14px);z-index:30;
  padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;transition:all .2s;
  max-width:92%;text-align:center;line-height:1.6}
.act-toast.on{opacity:1;transform:translate(-50%,0)}
.act-toast.ok{background:#3E8E5A;color:#fff}
.act-toast.no{background:#C0533E;color:#fff}
.act-toast.hint{background:#2C5D86;color:#fff}

.shake{animation:actshake .34s}
@keyframes actshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
body.reduced-motion .shake{animation:none;outline:2px solid #C0533E}

/* ==== في الختام — لوحة المصطلحات ==== */
.wrapup-terms{width:100%;max-width:820px;margin:14px auto 0;background:rgba(20,14,8,.55);
  border:1.5px solid var(--glass-edge);border-radius:14px;padding:10px 14px}
.wrapup-terms .wu-h{display:flex;align-items:baseline;gap:8px;font-family:var(--font-title);
  font-size:15px;font-weight:800;color:var(--copper-lt);margin-bottom:8px}
.wrapup-terms .wu-h .en{font-size:11px;color:var(--muted);direction:ltr;font-family:var(--font-body)}
.wrapup-terms .wu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wrapup-terms .wu-term{display:flex;justify-content:space-between;gap:8px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:5px 9px}
.wrapup-terms .wu-term .ar{font-size:12px;color:var(--cream-2);font-weight:700}
.wrapup-terms .wu-term .en{font-size:10.5px;color:var(--muted);direction:ltr}

/* ==== وضع المعلّم: خطة الحصة وطريقة التحقق ==== */
.tm-plan{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.tm-planrow{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:6px 9px}
.tm-plant{flex:0 0 46px;text-align:center;font-weight:800;font-size:12px;color:var(--copper-lt);
  background:rgba(197,123,61,.18);border-radius:7px;padding:2px 0}
.tm-planx{flex:1;font-size:12.5px;line-height:1.7;color:var(--stone)}
.tm-verify{background:rgba(63,145,136,.14);border:1px solid rgba(95,184,174,.35);border-radius:10px;
  padding:8px 11px;font-size:12.5px;line-height:1.8;color:var(--cream-2)}

/* ==== styles/unit1.css ==== */
/* ==== styles/unit1.css — Unit 1 lab, interaction stages, file explorer, printer ==== */

.lab-env{position:absolute;inset:0;overflow:hidden}

/* ---- generic interaction stage layout ---- */
.stage-wrap{position:absolute;left:14px;right:290px;top:70px;bottom:20px;z-index:6;display:flex;flex-direction:column}
.stage-grid{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:18px;padding:12px}

/* device / item tile (filled, warm, not a flat line-card) */
.itile{width:150px;min-height:132px;border-radius:14px;cursor:grab;position:relative;
  background:linear-gradient(180deg,rgba(36,30,22,.96),rgba(22,18,12,.98));
  border:1.6px solid rgba(231,160,99,.3);box-shadow:var(--sh-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 10px;transition:transform .12s,border-color .12s}
.itile:hover{transform:translateY(-4px);border-color:var(--copper-2)}
.itile .ic{width:52px;height:52px;color:var(--copper-hi)}
.itile .nm{font-family:var(--font-title);font-size:14px;font-weight:800;color:var(--cream);text-align:center;line-height:1.3}
.itile .en{font-size:10px;color:var(--muted);direction:ltr}
.itile.dragging{opacity:.5}
.itile.placed{border-color:var(--ok);background:linear-gradient(180deg,rgba(28,50,34,.96),rgba(16,32,20,.98))}

/* drop target slots */
.dropzone{width:200px;min-height:96px;border-radius:14px;border:2px dashed rgba(231,160,99,.5);
  background:rgba(20,16,10,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;transition:all .12s}
.dropzone .need{font-size:13px;color:var(--cream-2);text-align:center;line-height:1.5}
.dropzone .slot{font-size:11px;color:var(--muted)}
.dropzone.over{border-color:var(--copper-hi);background:rgba(231,160,99,.14)}
.dropzone.filled{border-style:solid;border-color:var(--ok);background:rgba(28,50,34,.6)}

/* draggable data orb */
.orb{width:64px;height:64px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle at 35% 30%,#FFF1CE,#E7A063 60%,#C57B3D);
  box-shadow:0 0 22px rgba(231,160,99,.6);display:flex;align-items:center;justify-content:center}
.orb .lbl{position:absolute;margin-top:74px;font-size:11px;color:var(--cream);font-weight:700;white-space:nowrap}

/* ---- file explorer simulation ---- */
.explorer{position:absolute;z-index:5;left:150px;top:88px;width:840px;height:540px;border-radius:14px;overflow:hidden;
  background:#F3ECDE;box-shadow:var(--sh-2);border:1px solid rgba(120,80,40,.4);display:flex;flex-direction:column}
.ex-titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,#3B9188,#2A6E67);color:#EAF6EF;font-size:12.5px;font-weight:700}
.ex-toolbar{background:linear-gradient(180deg,#EADFC8,#DFD1B4);border-bottom:1px solid #C7B48E;padding:6px 8px;display:flex;align-items:center;gap:6px}
.ex-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1.4px solid transparent;border-radius:8px;background:transparent;font-size:12.5px;font-weight:700;color:#3A2A1B}
.ex-btn svg{width:18px;height:18px}
.ex-btn:hover{background:#F3ECDE;border-color:#C7B48E}
.ex-btn.glow{border-color:var(--copper-2);box-shadow:0 0 0 3px rgba(197,123,61,.3)}
.ex-crumb{padding:6px 12px;background:#EADFC8;border-bottom:1px solid #C7B48E;font-size:12px;color:#6B421F;display:flex;align-items:center;gap:6px}
.ex-body{flex:1;display:flex;min-height:0}
.ex-tree{width:180px;background:#E4D6BE;border-left:1px solid #C7B48E;padding:8px;overflow:auto}
.ex-tree .tnode{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:12.5px;color:#3A2A1B;cursor:pointer}
.ex-tree .tnode:hover,.ex-tree .tnode.on{background:#F3ECDE}
.ex-tree .tnode svg{width:16px;height:16px}
.ex-tree .tnode.child{margin-right:16px}
.ex-main{flex:1;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;overflow:auto;position:relative}
.ex-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px;border-radius:10px;cursor:pointer;border:1.6px solid transparent;position:relative}
.ex-item:hover{background:#EADFC8}
.ex-item.sel{background:#D8ECE7;border-color:#2A6E67}
.ex-item.dragging{opacity:.45}
.ex-item .thumb{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.ex-item .thumb svg{width:46px;height:46px}
.ex-item .cap{font-size:11.5px;color:#3A2A1B;text-align:center;line-height:1.25;word-break:break-word;max-width:88px}
.ex-item .cap input{width:82px;font-size:11.5px;text-align:center;border:1px solid #2A6E67;border-radius:4px;font-family:var(--font-body)}
.ex-empty{grid-column:1/5;text-align:center;color:#8A6A44;padding:30px;font-size:13px}
.ex-status{height:28px;background:#DFD1B4;border-top:1px solid #C7B48E;display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:#6B421F;gap:12px}
/* context menu */
.ctxmenu{position:absolute;z-index:30;background:#F3ECDE;border:1px solid #C7B48E;border-radius:10px;box-shadow:var(--sh-2);padding:5px;min-width:150px}
.ctxmenu .ci{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;font-size:12.5px;color:#3A2A1B;cursor:pointer}
.ctxmenu .ci:hover{background:#EADFC8}
.ctxmenu .ci svg{width:16px;height:16px}
.ctxmenu .ci.danger{color:#CF6A4C}
.ctxmenu .sep{height:1px;background:#C7B48E;margin:4px 6px}
/* new-folder / rename dialog reuse .savedlg */

/* drop hint on tree nodes */
.ex-tree .tnode.drop-ok{background:rgba(63,145,136,.25);outline:2px dashed #2A6E67}

/* ---- printer / capture procedure ---- */
.proc{position:absolute;z-index:5;left:150px;top:100px;width:840px;height:500px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#243c40,#182b2f);box-shadow:var(--sh-2);border:1px solid rgba(95,184,174,.3);padding:20px;display:flex;gap:20px}
.proc-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.machine{width:220px;height:200px;position:relative}
.proc-opts{display:flex;flex-direction:column;gap:10px;width:230px}
.proc-opt{padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.06);border:1.5px solid var(--glass-edge);color:var(--cream);font-size:13.5px;font-weight:700;cursor:pointer;text-align:right}
.proc-opt:hover{background:rgba(255,255,255,.12)}
.proc-opt.on{background:linear-gradient(180deg,#F6C583,#DB9448);color:#2a1608;border:none}
.proc-opt .en{font-size:10.5px;color:var(--muted);direction:ltr;font-weight:500}
.proc-opt.on .en{color:#5a3a1a}

/* ==== styles/unit1r.css ==== */
/* ==== styles/unit1r.css — CP2R corrections: Windows desktop, iOS/Android, capture, printer ==== */

/* ---------- simulated Windows desktop ---------- */
.winos{position:absolute;z-index:5;left:150px;top:84px;width:840px;height:548px;border-radius:12px;overflow:hidden;
  box-shadow:var(--sh-2);border:1px solid rgba(120,80,40,.4);display:flex;flex-direction:column}
.win-desktop{flex:1;position:relative;background:linear-gradient(160deg,#2b6cb0,#1e4e8c 60%,#14375f);overflow:hidden;transition:background .3s}
.win-desktop.theme-sand{background:linear-gradient(160deg,#C9A05C,#9E6B34 60%,#6B421F)}
.win-desktop.theme-teal{background:linear-gradient(160deg,#3B9188,#1f5b54 60%,#123f3a)}
.win-desktop.bg-fort{background:linear-gradient(160deg,#E7A063,#9E5C28 55%,#4a2a12)}
.win-desktop.bg-falaj{background:linear-gradient(160deg,#5FB8AE,#2A6E67 55%,#123f3a)}
.win-icons{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:16px}
.win-dicon{width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:6px;border-radius:8px}
.win-dicon:hover{background:rgba(255,255,255,.14)}
.win-dicon svg{width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.win-dicon .l{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
/* taskbar */
.win-taskbar{height:46px;background:rgba(18,26,34,.94);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 10px;gap:8px;border-top:1px solid rgba(255,255,255,.08)}
.win-start{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.06)}
.win-start:hover{background:rgba(255,255,255,.16)}
.win-start svg{width:22px;height:22px}
.win-tasksearch{flex:0 0 200px;height:32px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;padding:0 12px;color:#cdd8e2;font-size:12px;cursor:pointer}
.win-tasksearch:hover{background:rgba(255,255,255,.16)}
.win-tb-item{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.win-tb-item:hover{background:rgba(255,255,255,.12)}
.win-tb-item svg{width:20px;height:20px}
.win-tray{margin-right:auto;display:flex;align-items:center;gap:12px;color:#e6edf3;font-size:12px;padding:0 8px}
.win-tray .ti{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 6px;border-radius:6px}
.win-tray .ti:hover{background:rgba(255,255,255,.12)}
.win-tray .ti svg{width:16px;height:16px}
.win-clock{text-align:center;line-height:1.15;cursor:pointer}
.win-clock .t{font-size:12.5px;font-weight:700}.win-clock .d{font-size:10.5px;opacity:.85}
/* start menu / flyouts */
.win-flyout{position:absolute;z-index:20;background:rgba(28,38,48,.98);border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:var(--sh-2);padding:12px;color:#e6edf3;min-width:200px}
.win-flyout h4{margin:0 0 8px;font-size:13px;color:#9fd3cc}
.win-flyout .fitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.win-flyout .fitem:hover{background:rgba(255,255,255,.1)}
.win-flyout .fitem svg{width:18px;height:18px}
.win-search-input{width:100%;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-family:var(--font-body);font-size:13px;margin-bottom:8px}
.win-result{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px}
.win-result:hover,.win-result.hi{background:rgba(95,184,174,.22)}
/* personalize window */
.win-window{position:absolute;z-index:22;left:80px;top:60px;width:560px;background:#F3ECDE;border-radius:12px;overflow:hidden;box-shadow:var(--sh-2);border:1px solid rgba(120,80,40,.4)}
.win-window .wt{height:34px;background:linear-gradient(180deg,#3B9188,#2A6E67);color:#eaf6ef;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;font-weight:700}
.win-window .wt .x{margin-right:auto;cursor:pointer;font-size:16px}
.win-window .wb{padding:16px;display:flex;flex-direction:column;gap:12px}
.pz-row{display:flex;gap:10px;flex-wrap:wrap}
.pz-opt{width:104px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#fff;box-shadow:var(--sh-1)}
.pz-opt.on{border-color:#3B9188}
.pz-opt .sw{height:60px}
.pz-opt .nm{font-size:11px;text-align:center;padding:5px 3px;color:#3A2A1B;font-weight:700}
.pz-label{font-size:12.5px;font-weight:800;color:#3A2A1B;margin-top:4px}

/* ---------- iOS / Android split ---------- */
.mobis{position:absolute;z-index:5;left:150px;top:84px;width:840px;height:548px;display:flex;gap:24px;justify-content:center;align-items:center}
.phone{width:290px;height:500px;border-radius:34px;padding:12px;box-shadow:var(--sh-2);position:relative;display:flex;flex-direction:column}
.phone.ios{background:#111}
.phone.android{background:#1a2e2b}
.phone .scr{flex:1;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone.ios .scr{background:linear-gradient(160deg,#5b8fd8,#3a63a8)}
