    const t = el('div', { class: 'act-toast ' + kind, text });
    host.appendChild(t);
    requestAnimationFrame(() => t.classList.add('on'));
    W.scd.node(t);
    W.scd.after(() => { t.classList.remove('on'); W.scd.after(() => t.remove(), 220); }, 2100);
    if (kind === 'ok') W.audio.ok(); else if (kind === 'no') W.audio.no(); else W.audio.click();
  }

  function head(spec, n, total) {
    return el('div', { class: 'act-head' }, [
      el('div', { class: 'act-n', text: String(n) }),
      el('div', {}, [
        el('div', { class: 'act-q', text: spec.q }),
        spec.qEn ? el('div', { class: 'act-qen', text: spec.qEn }) : null,
      ]),
      el('div', { class: 'act-count', text: 'التدريب ' + n + ' من ' + total }),
    ]);
  }

  /* ------------------------------------------------------------------ */
  /* 1) صح / خطأ                                                         */
  /* ------------------------------------------------------------------ */
  function tf(spec, done) {
    const body = el('div', { class: 'act-body' });
    const state = spec.items.map(() => null);
    spec.items.forEach((it, i) => {
      const row = el('div', { class: 'act-row' });
      const mark = el('div', { class: 'act-mark' });
      const btns = el('div', { class: 'act-tfbtns' }, [
        tb(true, '✔'), tb(false, '✘'),
      ]);
      function tb(val, gl) {
        return el('button', {
          class: 'act-tf' + (val ? ' yes' : ' no'), 'aria-label': val ? 'صح' : 'خطأ', text: gl,
          onclick: () => {
            if (state[i] === true || state[i] === false) return;
            if (val === it.a) {
              state[i] = val; row.classList.add('good'); mark.textContent = val ? '✔' : '✘';
              btns.querySelectorAll('.act-tf').forEach(b => b.setAttribute('disabled', 'true'));
              W.audio.ok(); check();
            } else {
              row.classList.add('shake'); W.scd.after(() => row.classList.remove('shake'), 420);
              toast(body, 'no', it.why || 'أعد التفكير: اقرأ العبارة مرة أخرى.');
            }
          },
        });
      }
      row.appendChild(mark);
      row.appendChild(el('div', { class: 'act-txt', text: (i + 1) + '. ' + it.t }));
      row.appendChild(btns);
      body.appendChild(row);
    });
    function check() { if (state.every(v => v !== null)) done(); }
    return {
      node: body,
      reveal() {
        spec.items.forEach((it, i) => {
          if (state[i] === null) {
            state[i] = it.a;
            const row = body.children[i];
            row.classList.add('good'); row.querySelector('.act-mark').textContent = it.a ? '✔' : '✘';
            row.querySelectorAll('.act-tf').forEach(b => b.setAttribute('disabled', 'true'));
          }
        });
        check();
      },
      isDone() { return state.every(v => v !== null); },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2) ملء الفراغات ببنك كلمات (نقر الكلمة ثم نقر الفراغ)               */
  /* ------------------------------------------------------------------ */
  function fill(spec, done) {
    const body = el('div', { class: 'act-body' });
    const bank = el('div', { class: 'act-bank' });
    let picked = null, pickedNode = null;
    const blanks = [];

    const words = shuffle(spec.bank.slice());
    words.forEach(w => {
      const chip = el('button', {
        class: 'act-chip', text: w,
        onclick: () => {
          if (chip.classList.contains('used')) return;
          bank.querySelectorAll('.act-chip').forEach(c => c.classList.remove('picked'));
          if (picked === w && pickedNode === chip) { picked = null; pickedNode = null; return; }
          picked = w; pickedNode = chip; chip.classList.add('picked'); W.audio.pick();
        },
      });
      bank.appendChild(chip);
    });
    body.appendChild(el('div', { class: 'act-banklbl', text: 'الكلمات:' }));
    body.appendChild(bank);

    spec.items.forEach((it, i) => {
      const row = el('div', { class: 'act-fillrow' });
      const parts = it.t.split('___');
      const answers = Array.isArray(it.a) ? it.a : [it.a];
      const slots = [];          // عناصر الأزرار
      const vals = [];           // القيم المُدخلة (لا نستعمل button.value لأنّه يحوّل null إلى "null")
      row.appendChild(el('span', { class: 'act-num', text: (i + 1) + '.' }));
      parts.forEach((pt, k) => {
        row.appendChild(el('span', { class: 'act-txt-in', text: pt }));
        if (k < parts.length - 1) {
          const si = slots.length;
          vals.push(null);
          const slot = el('button', {
            class: 'act-slot', text: '__________',
            onclick: () => {
              if (vals[si] != null) return;
              if (!picked) { toast(body, 'hint', 'اخترْ كلمةً مِنْ بنكِ الكلماتِ أوّلًا، ثمَّ انقُرِ الفراغَ.'); return; }
              const already = vals.indexOf(picked) >= 0;
              if (answers.indexOf(picked) >= 0 && !already) {
                vals[si] = picked; slot.textContent = picked; slot.classList.add('filled');
                pickedNode.classList.add('used'); pickedNode.classList.remove('picked');
                picked = null; pickedNode = null; W.audio.ok(); check();
              } else {
                slot.classList.add('shake'); W.scd.after(() => slot.classList.remove('shake'), 420);
                toast(body, 'no', it.why || 'هذه الكلمةُ لا تُناسبُ هذا الفراغَ. اقرأِ الجملةَ كاملةً.');
              }
            },
          });
          slots.push(slot); row.appendChild(slot);
        }
      });
      blanks.push({ slots, vals, answers });
      body.appendChild(row);
    });

    function filled() { return blanks.every(b => b.vals.every(v => v != null)); }
    function check() { if (filled()) done(); }
    return {
      node: body,
      reveal() {
        blanks.forEach(b => b.slots.forEach((s, k) => {
          if (b.vals[k] == null) {
            b.vals[k] = b.answers[k] != null ? b.answers[k] : b.answers[0];
            s.textContent = b.vals[k]; s.classList.add('filled');
          }
        }));
        bank.querySelectorAll('.act-chip').forEach(c => c.classList.add('used'));
        check();
      },
      isDone: filled,
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3) المطابقة (نقر عنصر يمين ثم عنصر يسار)                            */
  /* ------------------------------------------------------------------ */
  function match(spec, done) {
    const body = el('div', { class: 'act-body act-match' });
    const leftCol = el('div', { class: 'act-col' });
    const rightCol = el('div', { class: 'act-col' });
    let sel = null, selNode = null;
    const solved = {};

    const rights = shuffle(spec.pairs.map((p, i) => ({ i, t: p.b, html: p.bHtml })));
    spec.pairs.forEach((p, i) => {
      const node = el('button', { class: 'act-mitem' , 'data-i': i });
      node.appendChild(el('span', { class: 'act-mnum', text: String(i + 1) }));
      if (p.aHtml) node.appendChild(el('span', { class: 'act-mvis', html: p.aHtml })); 
      node.appendChild(el('span', { class: 'act-mtxt', text: p.a }));
      node.onclick = () => {
        if (solved[i]) return;
        rightCol.querySelectorAll('.act-mitem').forEach(n => n.classList.remove('picked'));
        leftCol.querySelectorAll('.act-mitem').forEach(n => n.classList.remove('picked'));
        if (sel === i) { sel = null; selNode = null; return; }
        sel = i; selNode = node; node.classList.add('picked'); W.audio.pick();
      };
      leftCol.appendChild(node);
    });
    rights.forEach(r => {
      const node = el('button', { class: 'act-mitem', 'data-i': r.i });
      if (r.html) node.appendChild(el('span', { class: 'act-mvis', html: r.html }));
      node.appendChild(el('span', { class: 'act-mtxt', text: r.t }));
      node.onclick = () => {
        if (node.classList.contains('done')) return;
        if (sel == null) { toast(body, 'hint', 'انقر عنصرًا من العمود الأول أولًا.'); return; }
        if (r.i === sel) {
          solved[sel] = true;
          node.classList.add('done'); selNode.classList.add('done');
          node.appendChild(el('span', { class: 'act-mnum ok', text: String(sel + 1) }));
          node.classList.remove('picked'); selNode.classList.remove('picked');
          sel = null; selNode = null; W.audio.ok(); check();
        } else {
          node.classList.add('shake'); W.scd.after(() => node.classList.remove('shake'), 420);
          toast(body, 'no', spec.why || 'ليست المطابقة الصحيحة. اقرأ الوصف بتمعّن.');
        }
      };
      rightCol.appendChild(node);
    });
    body.appendChild(leftCol); body.appendChild(rightCol);
    function check() { if (Object.keys(solved).length === spec.pairs.length) done(); }
    return {
      node: body,
      reveal() {
        spec.pairs.forEach((p, i) => {
          if (solved[i]) return;
          solved[i] = true;
          leftCol.querySelector('[data-i="' + i + '"]').classList.add('done');
          const rn = rightCol.querySelector('[data-i="' + i + '"]');
          rn.classList.add('done'); rn.appendChild(el('span', { class: 'act-mnum ok', text: String(i + 1) }));
        });
        check();
      },
      isDone() { return Object.keys(solved).length === spec.pairs.length; },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4) الترتيب (رقّم الخطوات من 1 إلى N بالنقر بالتسلسل)                */
  /* ------------------------------------------------------------------ */
  function order(spec, done) {
    const body = el('div', { class: 'act-body act-order' });
    let next = 1;
    const nodes = [];
    shuffle(spec.steps.map((s, i) => ({ s, i }))).forEach(({ s, i }) => {
      const node = el('button', { class: 'act-step', 'data-o': s.n });
      node.appendChild(el('span', { class: 'act-badge', text: '؟' }));
      if (s.html) node.appendChild(el('span', { class: 'act-svis', html: s.html }));
      node.appendChild(el('span', { class: 'act-txt', text: s.t }));
      node.onclick = () => {
        if (node.classList.contains('done')) return;
        if (s.n === next) {
          node.classList.add('done'); node.querySelector('.act-badge').textContent = String(next);
          next++; W.audio.ok(); check();
        } else {
          node.classList.add('shake'); W.scd.after(() => node.classList.remove('shake'), 420);
          toast(body, 'no', 'ليست الخطوة رقم ' + next + '. فكّر: ما الذي يجب فعله قبلها؟');
        }
      };
      nodes.push(node); body.appendChild(node);
    });
    function check() { if (next > spec.steps.length) done(); }
    return {
      node: body,
      reveal() {
        while (next <= spec.steps.length) {
          const n = nodes.find(x => +x.dataset.o === next);
          n.classList.add('done'); n.querySelector('.act-badge').textContent = String(next); next++;
        }
        check();
      },
      isDone() { return next > spec.steps.length; },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5) اختيار من متعدد (عدّة أسئلة، إجابة واحدة صحيحة لكل سؤال)         */
  /* ------------------------------------------------------------------ */
  function mcq(spec, done) {
    const body = el('div', { class: 'act-body' });
    const solved = spec.items.map(() => false);
    spec.items.forEach((q, i) => {
      const box = el('div', { class: 'act-mcq' });
      box.appendChild(el('div', { class: 'act-mcqq', text: (i + 1) + '. ' + q.q }));
      q.options.forEach((o, k) => {
        const b = el('button', { class: 'act-opt', text: o, onclick: () => {
          if (solved[i]) return;
          if (k === q.a) { b.classList.add('good'); solved[i] = true; box.querySelectorAll('.act-opt').forEach(x => x.setAttribute('disabled', 'true')); W.audio.ok(); check(); }
          else { b.classList.add('shake'); W.scd.after(() => b.classList.remove('shake'), 420); toast(body, 'no', q.why || 'ليست الإجابة الصحيحة. جرّب خيارًا آخر.'); }
        } });
        box.appendChild(b);
      });
      body.appendChild(box);
    });
    function check() { if (solved.every(Boolean)) done(); }
    return {
      node: body,
      reveal() {
        spec.items.forEach((q, i) => {
          if (solved[i]) return; solved[i] = true;
          const box = body.children[i];
          box.querySelectorAll('.act-opt')[q.a].classList.add('good');
          box.querySelectorAll('.act-opt').forEach(x => x.setAttribute('disabled', 'true'));
        });
        check();
      },
      isDone() { return solved.every(Boolean); },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6) التصنيف (ضع كل عبارة في فئتها)                                   */
  /* ------------------------------------------------------------------ */
  function classify(spec, done) {
    const body = el('div', { class: 'act-body act-classify' });
    let picked = null, pickedNode = null;
    const pool = el('div', { class: 'act-pool' });
    const cats = el('div', { class: 'act-cats' });
    const placed = {};

    shuffle(spec.items.map((it, i) => ({ it, i }))).forEach(({ it, i }) => {
      const chip = el('button', { class: 'act-chip big', text: it.t, 'data-i': i, onclick: () => {
        if (chip.classList.contains('used')) return;
        pool.querySelectorAll('.act-chip').forEach(c => c.classList.remove('picked'));
        if (picked === i) { picked = null; pickedNode = null; return; }
        picked = i; pickedNode = chip; chip.classList.add('picked'); W.audio.pick();
      } });
      pool.appendChild(chip);
    });

    spec.cats.forEach((c, ci) => {
      const drop = el('div', { class: 'act-cat' });
      drop.appendChild(el('div', { class: 'act-cattitle', text: (ci + 1) + '. ' + c }));
      const zone = el('div', { class: 'act-catzone' });
      drop.appendChild(zone);
      drop.onclick = () => {
        if (picked == null) { toast(body, 'hint', 'اختر عبارة أولًا، ثم انقر الفئة المناسبة.'); return; }
        const it = spec.items[picked];
        if (it.cat === ci) {
          zone.appendChild(el('div', { class: 'act-catchip', text: it.t }));
          pickedNode.classList.add('used'); pickedNode.classList.remove('picked');
          placed[picked] = true; picked = null; pickedNode = null; W.audio.ok(); check();
        } else {
          drop.classList.add('shake'); W.scd.after(() => drop.classList.remove('shake'), 420);
          toast(body, 'no', spec.why || 'هذه العبارة تنتمي إلى الفئة الأخرى.');
        }
      };
      cats.appendChild(drop);
    });
    body.appendChild(pool); body.appendChild(cats);
    function check() { if (Object.keys(placed).length === spec.items.length) done(); }
    return {
      node: body,
      reveal() {
        spec.items.forEach((it, i) => {
          if (placed[i]) return; placed[i] = true;
          cats.children[it.cat].querySelector('.act-catzone').appendChild(el('div', { class: 'act-catchip', text: it.t }));
          pool.querySelector('[data-i="' + i + '"]').classList.add('used');
        });
        check();
      },
      isDone() { return Object.keys(placed).length === spec.items.length; },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 7) ضع علامة أمام الصحيح فقط (اختيار متعدد الصواب)                   */
  /* ------------------------------------------------------------------ */
  function pickAll(spec, done) {
    const body = el('div', { class: 'act-body act-pickall' });
    const chosen = spec.items.map(() => false);
    spec.items.forEach((it, i) => {
      const b = el('button', { class: 'act-pick' + (it.img ? ' withimg' : '') });
      if (it.img) b.appendChild(el('span', { class: 'act-pickimg', html: it.img }));
      b.appendChild(el('span', { class: 'act-picktxt', text: it.t }));
      const dot = el('span', { class: 'act-pickdot', text: '' });
      b.appendChild(dot);
      b.onclick = () => {
        if (chosen[i]) return;
        if (it.a) { chosen[i] = true; b.classList.add('good'); dot.textContent = '✔'; W.audio.ok(); check(); }
        else { b.classList.add('shake'); W.scd.after(() => b.classList.remove('shake'), 420); toast(body, 'no', it.why || 'هذه ليست من العبارات المطلوبة.'); }
      };
      body.appendChild(b);
    });
    function check() { if (spec.items.every((it, i) => !it.a || chosen[i])) done(); }
    return {
      node: body,
      reveal() {
        spec.items.forEach((it, i) => {
          if (!it.a || chosen[i]) return; chosen[i] = true;
          const b = body.children[i]; b.classList.add('good'); b.querySelector('.act-pickdot').textContent = '✔';
        });
        check();
      },
      isDone() { return spec.items.every((it, i) => !it.a || chosen[i]); },
    };
  }

  /* ------------------------------------------------------------------ */
  /* 8) المتاهة (تتبّع المسار الصحيح خطوة بخطوة)                          */
  /* ------------------------------------------------------------------ */
  function maze(spec, done) {
    const body = el('div', { class: 'act-body act-maze' });
    let step = 0;
    const rail = el('div', { class: 'act-mazerail' });
    body.appendChild(rail);
    function render() {
      rail.innerHTML = '';
      rail.appendChild(el('div', { class: 'act-mazepath', text: spec.path.slice(0, step).join('  ‹  ') || 'ابدأ من هنا' }));
      if (step >= spec.path.length) return;
      const opts = el('div', { class: 'act-mazeopts' });
      const correct = spec.path[step];
      const wrongs = spec.distractors[step] || [];
      shuffle([correct].concat(wrongs)).forEach(o => {
        opts.appendChild(el('button', { class: 'act-mazeopt', text: o, onclick: (e) => {
          if (o === correct) { step++; W.audio.ok(); render(); if (step >= spec.path.length) done(); }
          else { e.currentTarget.classList.add('shake'); toast(body, 'no', spec.why || 'ليس هذا الطريق الصحيح.'); }
        } }));
      });
      rail.appendChild(opts);
    }
    render();
    return {
      node: body,
      reveal() { step = spec.path.length; render(); done(); },
      isDone() { return step >= spec.path.length; },
    };
  }

  /* ------------------------------------------------------------------ */
  /* منسّق ورقة التدريبات: نشاط واحد ظاهر في كل لحظة                     */
  /* ------------------------------------------------------------------ */
  const BUILDERS = { tf, fill, match, order, mcq, classify, pickAll, maze };

  function sheet(host, cfg) {
    const tasks = cfg.tasks;
    let i = 0, cur = null;
    const wrap = el('div', { class: 'actsheet' });
    const railEl = el('div', { class: 'act-rail' });
    const slot = el('div', { class: 'act-slot-host' });
    const actions = el('div', { class: 'act-actions' });
    wrap.appendChild(el('div', { class: 'act-title' }, [
      el('h3', { text: cfg.title || 'تدريبات كتاب الطالب' }),
      cfg.titleEn ? el('div', { class: 'en', text: cfg.titleEn }) : null,
    ]));
    wrap.appendChild(railEl);
    wrap.appendChild(slot);
    wrap.appendChild(actions);
    host.appendChild(wrap); W.scd.node(wrap);

    const doneFlags = tasks.map(() => false);

    function renderRail() {
      railEl.innerHTML = '';
      tasks.forEach((t, k) => railEl.appendChild(el('span', {
        class: 'act-pip' + (doneFlags[k] ? ' done' : '') + (k === i ? ' cur' : ''),
        text: String(k + 1), title: t.q,
      })));
    }

    function renderTask() {
      slot.innerHTML = '';
      const spec = tasks[i];
      slot.appendChild(head(spec, i + 1, tasks.length));
      cur = BUILDERS[spec.type](spec, () => {
        doneFlags[i] = true;
        W.store.stepDone(cfg.lessonId, 'act' + (i + 1));
        toast(slot, 'ok', spec.ok || 'أحسنت! أكملت التدريب.');
        renderRail(); renderActions();
        if (doneFlags.every(Boolean)) { W.scd.after(() => cfg.onFinish && cfg.onFinish(), 900); }
        else W.scd.after(() => {
          // انتقل إلى أوّل تدريب لم يُنجَز بعد (وليس التالي فقط) حتى لا يبقى تدريبٌ متروكًا
          let nxt = -1;
          for (let k = i + 1; k < tasks.length; k++) if (!doneFlags[k]) { nxt = k; break; }
          if (nxt < 0) nxt = doneFlags.indexOf(false);
          if (nxt >= 0) { i = nxt; renderTask(); renderRail(); }
        }, 1000);
      });
      slot.appendChild(cur.node);
      renderActions(); renderRail();
    }

    function renderActions() {
      actions.innerHTML = '';
      actions.appendChild(el('button', { class: 'tp-btn', text: '💡 تلميح', onclick: () => {
        toast(slot, 'hint', tasks[i].hint || 'اقرأ التعليمة مرة أخرى وفكّر في معنى كل خيار.');
      } }));
      actions.appendChild(el('button', { class: 'tp-btn', text: '↻ إعادة التدريب', onclick: () => { W.audio.click(); renderTask(); } }));
      if (i > 0) actions.appendChild(el('button', { class: 'tp-btn', text: '‹ السابق', onclick: () => { i--; renderTask(); } }));
      if (i < tasks.length - 1) actions.appendChild(el('button', { class: 'tp-btn', text: 'التالي ›', onclick: () => { i++; renderTask(); } }));
    }

    renderTask();

    return {
      node: wrap,
      reveal() { cur && cur.reveal(); },
      retry() { renderTask(); },
      jump(n) { i = Math.max(0, Math.min(tasks.length - 1, n)); renderTask(); renderRail(); },
      get index() { return i; },
      get total() { return tasks.length; },
      allDone() { return doneFlags.every(Boolean); },
    };
  }

  W.activity = { sheet, toast, BUILDERS };
})(window.MNARA);

/* ==== engine/wordsim.js ==== */
/* ==== engine/wordsim.js — محاكي Microsoft Word (مطابقة مرئية ووظيفية ضمن نطاق المنهج) ====
 * أعيد بناؤه ليقارب واجهة Microsoft Word الظاهرة في كتاب الطالب للصف الثالث:
 *   شريط عنوان أزرق + AutoSave + Quick Access + اسم المستند + Search + Sign in،
 *   صفّ تبويبات كامل (File…Help) + Picture Format السياقي، Ribbon بمجموعات حقيقية،
 *   مسطرة، صفحة بيضاء، شريط حالة، وZoom.
 * الوظائف الإلزامية تعمل فعلًا: File>Open>Browse، تحرير حقيقي، Font/Size/Color،
 *   Bold/Italic/Underline، Highlight، المحاذاة الأربع، Bullets/Numbering + معرض الأنماط،
 *   Insert>Pictures>This Device، تغيير الحجم بالمقابض، Crop فعلي، Picture Border + Weight،
 *   Picture Styles، Wrap Text، Zoom (عرض فقط)، Print (Copies/Printer/Orientation/Preview)،
 *   Save/Save As في نظام ملفات محلي معزول مع إعادة الفتح بعد التحديث.
 * الأوامر خارج نطاق المنهج تظهر بصريًا فقط مع aria-disabled ولا تستجيب للنقر.

(function (W) {

    function revealInCanvas(node) {

          if (under > 0) canvas.scrollTop -= under / k;

        ]);

/* ==== lessons/l1-2.js — تنظيم الملفات والمجلدات (real file explorer, CP2) ==== */
(function (W) {
  const { el } = W.util;
  const L = () => W.curriculum.lessons.find(l => l.id === 'l1-2');

  // ---- file-system model ----
  // node: {id, name, type:'folder'|'file', ext, kind:'doc'|'audio'|'image'|'video', children:[]}
  let uid = 1; const nid = () => 'n' + (uid++);
  function mkFile(name, ext, kind) { return { id: nid(), name, type: 'file', ext, kind }; }
  function mkFolder(name, children) { return { id: nid(), name, type: 'folder', children: children || [] }; }

  function seedFS() {
    uid = 1;
    return mkFolder('هذا الجهاز', [
      mkFolder('المستندات', [
        mkFile('صورة الحصن', 'jpg', 'image'),
        mkFile('نشيد بلادي', 'mp3', 'audio'),
        mkFile('نص عن عُمان', 'docx', 'doc'),
        mkFile('مقطع الفلج', 'mp4', 'video'),
        mkFile('صورة الجبل', 'png', 'image'),
        mkFile('أنشودة الوطن', 'mp3', 'audio'),
      ]),
    ]);
  }

  W.lessons.register('l1-2', {
    mount(ctx) {
      const lesson = L(); W.store.lessonOpened(lesson.id);
      W.lablesson.chooseMode(ctx, lesson, {
        guided: () => run(ctx, lesson, 'guided'),
        independent: () => run(ctx, lesson, 'independent'),
      });
    },
    unmount() { W.activeLesson = null; W.dnd.reset(); },
  });

  function run(ctx, lesson, mode) {
    const host = document.querySelector('.lab-env');
    const guided = mode === 'guided';
    const root = seedFS();
    const external = mkFolder('ذاكرة وامضة (Flash)', []); // external device for copy
    let cwd = root;                 // current folder shown in main pane
    const tp = W.lablesson.taskPanel(host, { stage: guided ? 'تدريب موجّه · Guided' : 'أنشئ بنفسك · Independent', mode: '1.2 تنظيم الملفات' });

    // build explorer UI
    const ex = el('div', { class: 'explorer' });
    ex.appendChild(el('div', { class: 'ex-titlebar' }, [W.icons.svg('folder', '', 16), el('span', { text: 'مستكشف الملفات · File Explorer' })]));
    const toolbar = el('div', { class: 'ex-toolbar' });
    const crumb = el('div', { class: 'ex-crumb' });
    const body = el('div', { class: 'ex-body' });
    const tree = el('div', { class: 'ex-tree' });
    const main = el('div', { class: 'ex-main' });
    const status = el('div', { class: 'ex-status' });
    body.appendChild(tree); body.appendChild(main);
    ex.appendChild(toolbar); ex.appendChild(crumb); ex.appendChild(body); ex.appendChild(status);
    host.appendChild(ex); W.scd.node(ex);

    // toolbar buttons (English + Arabic)
    const btnNew = exBtn('newfolder', 'New Folder · مجلد جديد', () => newFolder());
    const btnRename = exBtn('rename', 'Rename · إعادة تسمية', () => renameSelected());
    const btnOpen = exBtn('open', 'Open · فتح', () => openSelected());
    const btnCopy = exBtn('copy', 'Copy · نسخ', () => { clip = { node: selected, op: 'copy' }; flash('نُسخ إلى الحافظة (Copy)'); });
    const btnCut = exBtn('cut', 'Cut · قص', () => { clip = { node: selected, op: 'cut' }; flash('جاهز للنقل (Cut)'); });
    const btnPaste = exBtn('paste', 'Paste · لصق', () => pasteHere());
    const btnDelete = exBtn('trash', 'Delete · حذف', () => deleteSelected());
    const btnConcepts = exBtn('doc', 'Concepts · المفاهيم', () => openConcepts());
    [btnNew, btnRename, btnOpen, btnCopy, btnCut, btnPaste, btnDelete, btnConcepts].forEach(b => toolbar.appendChild(b));

    let selected = null, clip = null;
    const events = [];  // track actions for validation: 'folder','subfolder','rename','open','delete','move','copy'
    function did(a) { if (!events.includes(a)) events.push(a); render(); refresh(); }

    render();

    // ---- rendering ----
    function pathTo(node, from, acc) {
      from = from || root; acc = acc || [];
      if (from === node) return acc.concat(from);
      if (from.type === 'folder') for (const c of from.children) { const r = pathTo(node, c, acc.concat(from)); if (r) return r; }
      return null;
    }
    function render() {
      // crumb
      const path = pathTo(cwd) || [root];
      crumb.innerHTML = '';

      tp.setInstr('لكل مهمة طباعة، اسحب نوع الطابعة المناسب (Inkjet / Laser / Thermal).', 'Match the right printer type to each job.');

          if (done[j.key]) return; done[j.key] = true; zone.classList.add('filled');

        }, 25);

        const t = el('div', { class: 'itile', 'data-printer': pr.key, style: { width: '170px', minHeight: '90px' } }, [W.icons.svg(pr.ic, 'ic', 44), el('div', { class: 'nm', text: pr.ar }), el('div', { class: 'en', text: pr.en })]);
        W.dnd.makeDraggable(t, { onReject: () => W.lablesson.feedback(host, 'no', 'فكّر: أيّ طابعة تناسب هذه المهمة؟') });

    }

    function startPrinterProcedure() {
      clear(); stage = 1;
      tp.setInstr('اتّبع خطوات الطباعة بالترتيب: وصّل الطابعة، ثبّت برنامج التشغيل (Driver)، اختر خيار الطباعة، أرسل المستند، وشاهد الورقة تخرج.', 'Connect → Install Driver → Print Option → Send → page emerges.');
      const st = { connected: false, driver: false, option: false, sent: false, printed: false };
      const line = el('div', { class: 'printer-line' });
      const steps = el('div', { class: 'pl-steps' });
      const S = [['connect', 'وصّل الطابعة', 'Connect Printer'], ['driver', 'ثبّت برنامج التشغيل', 'Install Driver'], ['option', 'اختر خيار الطباعة (ألوان)', 'Print Option'], ['send', 'أرسل المستند للطباعة', 'Send to Print']];
      const stepBtns = {};
      S.forEach(([k, ar, en], i) => { const b = el('div', { class: 'pl-step' + (i === 0 ? ' active' : ''), onclick: () => doStep(k) }, [document.createTextNode(ar), el('div', { class: 'en', text: en })]); stepBtns[k] = b; steps.appendChild(b); });
      const stageBox = el('div', { class: 'pl-stage' });
      const printer = el('div', { class: 'printer-body' }, [el('div', { class: 'slot' }), el('div', { class: 'light' })]);
      const page = el('div', { class: 'printed-page', style: { top: '60px', height: '0px' } }, [el('div', { class: 'ln' }), el('div', { class: 'ln b' }), el('div', { class: 'ln' })]);
      printer.appendChild(page); stageBox.appendChild(printer);
      line.appendChild(steps); line.appendChild(stageBox); wrap.appendChild(line);
      function sync() {
        Object.entries(stepBtns).forEach(([k, b]) => b.classList.toggle('done', !!st[k === 'send' ? 'sent' : k]));
        const order = ['connect', 'driver', 'option', 'send']; const nextI = order.findIndex(k => !st[k === 'send' ? 'sent' : k]);
        order.forEach((k, i) => stepBtns[k].classList.toggle('active', i === nextI));
        tp.setSteps([
          { label: 'توصيل الطابعة (Connect)', done: st.connected }, { label: 'تثبيت برنامج التشغيل (Driver)', done: st.driver },
          { label: 'اختيار خيار الطباعة', done: st.option }, { label: 'إرسال المستند (Send)', done: st.sent }, { label: 'خروج الورقة المطبوعة', done: st.printed },
        ], -1);
      }
      function doStep(k) {

        else if (k === 'option') { if (!st.driver) { W.lablesson.feedback(host, 'no', 'ثبّت برنامج التشغيل أولًا.'); return; } if (st.option) return; st.option = true; W.lablesson.feedback(host, 'ok', 'اخترت خيار الطباعة: ألوان.'); }
        else if (k === 'send') {
          if (!st.option) { W.lablesson.feedback(host, 'no', 'اختر خيار الطباعة أولًا.'); return; }
          if (st.sent) return; st.sent = true; W.lablesson.feedback(host, 'ok', 'أُرسل المستند... تخرج الورقة الآن.');
          let h = 0; const iv = setInterval(() => { h += 12; page.style.height = h + 'px'; page.style.top = (60 - h) + 'px'; if (h >= 96) { clearInterval(iv); st.printed = true; sync(); W.scd.after(startCapture, 900); } }, 60);
        }
        sync();
      }
      sync();
      tp.setActions([{ label: 'تلميح', onClick: () => W.lablesson.feedback(host, 'hint', 'اضغط الخطوات بالترتيب: Connect ثم Driver ثم خيار الطباعة ثم Send.') }]);
    }

    function startCapture() {

      // Mic + Webcam: Save -> choose folder -> filename -> save -> verify

      // Digital Camera: connect (USB/Card) -> File Explorer -> device -> DCIM -> select JPG -> Copy -> Pictures -> Paste -> verify
      function buildCameraTransfer(d, panel) {

          el('button', { class: 'xfer-btn', style: { marginTop: '0' }, text: 'أدخل بطاقة الذاكرة', onclick: () => connect('Memory Card') }),
        ]);
        const stepList = el('div', {});
        const mini = el('div', { class: 'mini-ex' });
        panel.appendChild(el('div', { class: 'xfer-step' + (s.connected ? ' done' : ' active'), text: '١) وصّل الكاميرا (USB أو بطاقة ذاكرة)' }));
        if (!s.connected) panel.appendChild(connectRow);
        panel.appendChild(stepList); panel.appendChild(mini);
        function connect(method) { if (s.connected) return; s.connected = true; s.method = method; W.lablesson.feedback(host, 'ok', 'تم التوصيل عبر ' + method + '.'); renderBody(); }
        if (!s.connected) return;
        renderMini();
        function renderMini() {

          [['٢) افتح File Explorer', s.explorerOpen], ['٣) افتح الجهاز/البطاقة (' + (s.method || '') + ')', s.deviceOpen], ['٤) افتح مجلد DCIM', s.dcimOpen], ['٥) حدّد صورة JPG ثم Copy', s.copied], ['٦) افتح مجلد Pictures ثم Paste', s.pasted]].forEach(([t, done]) => stepList.appendChild(el('div', { class: 'xfer-step ' + (done ? 'done' : '') , text: t })));

            bodyM.appendChild(miniItem('folder', 'Pictures', () => { if (!s.copied) { W.lablesson.feedback(host, 'no', 'انسخ الصورة من DCIM أولًا.'); return; } s.picturesOpen = true; s.loc = 'pictures'; renderMini(); }));
          } else if (s.loc === 'device') {

          } else if (s.loc === 'dcim') {
            const img = miniItem('image', d.file, () => { s.selected = !s.selected; renderMini(); });
            if (s.selected) img.classList.add('sel'); bodyM.appendChild(img);
          } else if (s.loc === 'pictures') {
            if (s.pasted) bodyM.appendChild(miniItem('image', d.file, () => {}));
            else bodyM.appendChild(el('div', { style: { color: '#8A6A44', fontSize: '11.5px', padding: '10px' }, text: 'مجلد فارغ — الصق الصورة هنا.' }));
          }
          // toolbar: Copy + Paste (context aware)
          const copyBtn = el('button', { class: 'mebtn' + (s.loc === 'dcim' && s.selected && !s.copied ? ' glow' : ''), onclick: () => { if (!(s.loc === 'dcim' && s.selected && !s.copied)) return; s.copied = true; W.lablesson.feedback(host, 'ok', 'Copy — نُسخت الصورة.'); renderMini(); } }, [W.icons.svg('copy', '', 15), el('span', { text: 'Copy · نسخ' })]);
          copyBtn.disabled = !(s.loc === 'dcim' && s.selected && !s.copied);
          const pasteBtn = el('button', { class: 'mebtn' + (s.loc === 'pictures' && s.copied && !s.pasted ? ' glow' : ''), onclick: () => {

          } }, [W.icons.svg('paste', '', 15), el('span', { text: 'Paste · لصق' })]);
          pasteBtn.disabled = !(s.loc === 'pictures' && s.copied && !s.pasted);
          const upBtn = el('button', { class: 'mebtn', onclick: () => { if (s.loc === 'root') return; s.loc = s.loc === 'dcim' ? 'device' : 'root'; renderMini(); } }, [W.icons.svg('back', '', 15), el('span', { text: 'رجوع' })]);
          upBtn.disabled = (s.loc === 'root');
          toolbar.appendChild(copyBtn); toolbar.appendChild(pasteBtn); toolbar.appendChild(upBtn);
        }
        function locLabel(l) { return l === 'root' ? 'هذا الجهاز' : l === 'device' ? 'كاميرا ' + s.method : l === 'dcim' ? 'DCIM' : 'Pictures'; }
        function miniItem(ic, cap, on) { return el('div', { class: 'mitem', onclick: on }, [W.icons.svg(ic, '', 30), el('div', { class: 'c', text: cap })]); }
      }
      function buildMic(d, vp, controls) {
        let rec = false, secs = 0, iv; const wave = el('div', { class: 'wave' }); for (let i = 0; i < 9; i++) wave.appendChild(el('i', { style: { animationDelay: (i * .08) + 's' } })); wave.style.visibility = 'hidden';
        const timerEl = el('div', { class: 'cap-timer', text: '0:00' }); vp.appendChild(wave); vp.appendChild(timerEl);

      function buildWebcam(d, vp, controls) {

        const openBtn = el('button', { class: 'cap-btn', onclick: () => { open = true; prev.style.visibility = 'visible'; openBtn.classList.add('on'); W.lablesson.feedback(host, 'ok', 'فُتحت الكاميرا — تظهر المعاينة المحلية.'); } }, [document.createTextNode('افتح الكاميرا · Open')]);

          prev.appendChild(el('div', { class: 'rec-dot' })); W.lablesson.feedback(host, 'ok', 'جارٍ إجراء مكالمة فيديو...');
          W.scd.after(() => { created[d.key] = true; W.lablesson.feedback(host, 'ok', 'أُنشئ ملف فيديو: ' + d.file); renderBody(); }, 800);
        } }, [document.createTextNode('مكالمة/التقاط فيديو · Call'), el('div', { class: 'en', text: 'Video Call' })]);
        controls.appendChild(openBtn); controls.appendChild(callBtn);
      }
      function buildCamera(d, vp, controls) {
        const frame = el('div', { class: 'cam-preview', style: { background: 'radial-gradient(circle at 50% 40%,#6fae7a,#2b5c3a)' } }, [el('div', { class: 'cam-frame' })]); vp.appendChild(frame);
        if (created[d.key]) vp.appendChild(fileChip(d));
        let framed = false;
        const frameBtn = el('button', { class: 'cap-btn', onclick: () => { framed = true; frameBtn.classList.add('on'); W.lablesson.feedback(host, 'ok', 'أطّرت المنظر الطبيعي.'); } }, [document.createTextNode('أطّر المشهد · Frame')]);
        const shotBtn = el('button', { class: 'cap-btn', onclick: () => { if (!framed) { W.lablesson.feedback(host, 'no', 'أطّر المشهد أولًا.'); return; } if (created[d.key]) return; created[d.key] = true; frame.style.outline = '3px solid #F5D451'; W.lablesson.feedback(host, 'ok', 'أُنشئ ملف صورة: ' + d.file); renderBody(); } }, [document.createTextNode('التقط الصورة · Capture')]);
        controls.appendChild(frameBtn); controls.appendChild(shotBtn);
      }
      function fileChip(d) { return el('div', { class: 'cap-file', 'data-file': d.key }, [W.icons.svg(d.makes, '', 24), el('span', { text: d.file })]); }
      function updateSteps() { tp.setSteps(CAPTURE.map(d => ({ label: d.ar + ' → ' + (transferred[d.key] ? 'نُقل ✓' : created[d.key] ? 'أُنشئ الملف' : 'التقاط'), done: !!transferred[d.key] })), -1); }
      function checkDone() { if (CAPTURE.every(d => transferred[d.key])) W.scd.after(finish, 700); }
      renderTabs(); renderBody();
      tp.setActions([{ label: 'تلميح', onClick: () => W.lablesson.feedback(host, 'hint', 'الميكروفون وكاميرا الويب: أنشئ الملف ثم Save في المجلد المناسب. الكاميرا الرقمية: وصّلها (USB/بطاقة)، افتح File Explorer ‹ DCIM، Copy الصورة، ثم افتح Pictures و Paste.') }]);
    }

    /* مرحلة ختامية: تدريبات كتاب الطالب الرسمية (تحقّق فعلي من الإجابة) */
    let bookSheet = null;
    function finish() {
      const tasks = (W.bookActivities || {})['l1-3'] || [];
      if (!tasks.length) { realFinish(); return; }
      clear(); wrap.remove();
      const holder = W.util.el('div', { class: 'stage-wrap' });
      host.appendChild(holder); W.scd.node(holder);
      bookSheet = W.activity.sheet(holder, {
        lessonId: lesson.id,
        title: '1.3 — تدريبات كتاب الطالب',
        titleEn: 'Student Book p.' + lesson.sbPage,
        tasks,
        onFinish: () => { holder.remove(); realFinish(); },
      });
    }
    function realFinish() { clear(); wrap.remove(); W.lablesson.completeCard(ctx, lesson, host, mode, { title: 'أتقنت الدرس 1.3 — الطباعة والالتقاط', body: 'اخترت الطابعة المناسبة، وأتممت خطوات الطباعة كاملة حتى خروج الورقة (والتوصيل وحده لا يكفي — لا بد من Driver). ثم سجّلت صوتًا، وأجريت مكالمة فيديو، والتقطت صورة، ونقلت كل ملف إلى مجلد الحاسوب.' }); }

    W.activeLesson = {
      id: lesson.id,
      reveal: () => { if (bookSheet) { bookSheet.reveal(); return; } W.lablesson.feedback(host, 'hint', stage === 0 ? 'طابق كل مهمة بالطابعة المناسبة.' : stage === 1 ? 'Connect → Driver → Option → Send.' : 'أنشئ ملفًا بكل جهاز ثم انقله للحاسوب.'); },
      stages: [{ id: 's0', rail: 'مطابقة الطابعات' }, { id: 's1', rail: 'خطوات الطباعة' }, { id: 's2', rail: 'أجهزة الالتقاط' }, { id: 's3', rail: 'تدريبات الكتاب' }],
      jump: (n) => { if (n >= 3) finish(); else if (n === 0) startPrinterMatch(); else if (n === 1) startPrinterProcedure(); else startCapture(); },
      retryStage: () => { if (bookSheet) { bookSheet.retry(); return; } if (stage === 0) startPrinterMatch(); else if (stage === 1) startPrinterProcedure(); else startCapture(); },
      resetLesson: () => W.scene.reload(),
    };
  }
})(window.MNARA);

(function (W) {

    // ---- build simulated desktop ----
    const win = el('div', { class: 'winos' });

    const dicons = el('div', { class: 'win-icons' }, [

    // taskbar (anchors captured so flyouts can position against them)
    const clock = el('div', { class: 'win-clock' }, [el('div', { class: 't', text: '10:24 ص' }), el('div', { class: 'd', text: '٢٠ / ١ / ٢٠٢٦' })]);

    function deskIcon(ic, label, on) { return el('div', { class: 'win-dicon', tabindex: '0', role: 'button', onclick: on, onkeydown: e => { if (e.key === 'Enter') on(); } }, [W.icons.svg(ic, '', 40), el('div', { class: 'l', text: label })]); }
    function trayItem(ic, title) { return el('div', { class: 'ti', title }, [W.icons.svg(ic, '', 16)]); }

    function closeFly() { host.querySelectorAll('.win-flyout,.win-window').forEach(n => n.remove()); }

    // ---- shared anchor positioning (real Windows-style flyout above the clicked control) ----
    const GAP = 10, PAD = 10;
    // offset position of a node relative to the .winos box (transform-safe, unlike getBoundingClientRect)
    function offsetWithin(node, ancestor) {
      let x = 0, y = 0, n = node;
      while (n && n !== ancestor) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      return { x, y };
    }
    function openTaskbarFlyout(anchor, flyout) {
      // flyout is a child of .winos so it is never clipped by the desktop's overflow
      const winW = win.clientWidth;
      const tbH = taskbar.offsetHeight || 46;
      const off = offsetWithin(anchor, win);
      const anchorCenterX = off.x + anchor.offsetWidth / 2;      // relative to .winos content box
      const fw = flyout.offsetWidth;
      let left = anchorCenterX - fw / 2;                          // center above the anchor
      left = Math.max(PAD, Math.min(left, winW - fw - PAD));      // keep inside, shift on overflow
      flyout.style.left = left + 'px';
      flyout.style.bottom = (tbH + GAP) + 'px';
      flyout.style.top = ''; flyout.style.right = '';
    }
    function placeWindow(w) {
      // centered inside the usable desktop area (above the taskbar), fully visible
      const winW = win.clientWidth, winH = win.clientHeight;
      const tb = taskbar.offsetHeight || 46;
      const ww = w.offsetWidth, wh = w.offsetHeight;
      const usableH = winH - tb;
      let left = (winW - ww) / 2;
      let top = Math.max(PAD, (usableH - wh) / 2);
      left = Math.max(PAD, Math.min(left, winW - ww - PAD));
      top = Math.min(top, usableH - wh - PAD);
      w.style.left = Math.max(PAD, left) + 'px'; w.style.top = Math.max(PAD, top) + 'px';
    }

    // ---- taskbar flyouts ----
    function flyTime(anchor) {

        el('div', { class: 'fitem' }, [W.icons.svg('clock', '', 18), el('span', { text: 'الساعة 10:24 صباحًا' })]),
        el('div', { class: 'fitem' }, [W.icons.svg('clock', '', 18), el('span', { text: 'الثلاثاء ٢٠ يناير ٢٠٢٦' })]),
      ]);
      win.appendChild(f); openTaskbarFlyout(anchor, f); autoClose(f);
    }
    function flyInternet(anchor) {
      closeFly(); mark('internet');
      const f = el('div', { class: 'win-flyout', style: { position: 'absolute' } }, [
        el('h4', { text: 'Internet Connection · الاتصال بالإنترنت' }),
        el('div', { class: 'fitem' }, [W.icons.svg('wifi', '', 18), el('span', { text: 'شبكة المدرسة — متصل ✓' })]),
        el('div', { class: 'fitem' }, [W.icons.svg('globe', '', 18), el('span', { text: 'الإنترنت متاح' })]),
      ]);
      win.appendChild(f); openTaskbarFlyout(anchor, f); autoClose(f);
    }
    function flyLanguage(anchor) {
      closeFly(); mark('language');
      const f = el('div', { class: 'win-flyout', style: { position: 'absolute' } }, [
        el('h4', { text: 'Language · اللغة' }),
        el('div', { class: 'fitem', onclick: () => flash('اللغة: العربية') }, [W.icons.svg('lang', '', 18), el('span', { text: 'العربية (AR)' })]),
        el('div', { class: 'fitem', onclick: () => flash('Language: English') }, [W.icons.svg('lang', '', 18), el('span', { text: 'English (EN)' })]),
      ]);
      win.appendChild(f); openTaskbarFlyout(anchor, f); autoClose(f);
    }
    function openStart(searchFocus, anchor) {
      closeFly(); mark('start');
      const input = el('input', { class: 'win-search-input', placeholder: 'اكتب للبحث · Type to search' });
      const results = el('div', {});
      const apps = ['File Explorer', 'Personalize', 'Photos', 'Settings'];
      function renderRes(q) {
        results.innerHTML = '';
        apps.filter(a => !q || a.toLowerCase().includes(q.toLowerCase())).forEach(a => results.appendChild(el('div', { class: 'win-result', onclick: () => { if (a === 'File Explorer') openExplorer(); else if (a === 'Personalize' || a === 'Settings') openPersonalize(); else flash('فتح: ' + a); } }, [W.icons.svg(a === 'File Explorer' ? 'explorerIc' : a === 'Photos' ? 'photos' : a === 'Personalize' ? 'personalize' : 'settings', '', 18), el('span', { text: a })])));
      }
      input.addEventListener('input', () => renderRes(input.value));
      renderRes('');
      const f = el('div', { class: 'win-flyout', style: { position: 'absolute', width: '260px' } }, [el('h4', { text: (searchFocus ? 'Search · بحث' : 'Start · ابدأ') }), input, results]);
      win.appendChild(f); openTaskbarFlyout(anchor || startBtn, f); autoClose(f); if (searchFocus) setTimeout(() => input.focus(), 40);
    }
    function openExplorer() {
      closeFly(); mark('explorer');
      const w = el('div', { class: 'win-window', style: { width: '440px' } }, [
        el('div', { class: 'wt' }, [W.icons.svg('explorerIc', '', 16), el('span', { text: 'File Explorer · مستكشف الملفات' }), el('span', { class: 'x', onclick: () => w.remove(), text: '×' })]),
        el('div', { class: 'wb', style: { flexDirection: 'row', flexWrap: 'wrap', gap: '14px' } },
          ['هذا الجهاز', 'المستندات', 'الصور', 'سطح المكتب'].map(n => el('div', { style: { width: '90px', textAlign: 'center', cursor: 'pointer' }, onclick: () => flash('فتح: ' + n) }, [W.icons.svg('folder', '', 40), el('div', { style: { fontSize: '11px', color: '#3A2A1B' }, text: n })]))),

    function openPersonalize() {
      closeFly(); flash('فتح Personalize');
      const bgRow = el('div', { class: 'pz-row' });
      const pics = [['الحصن', 'bg-fort'], ['الفلج', 'bg-falaj']];
      const w = el('div', { class: 'win-window' }, [
        el('div', { class: 'wt' }, [W.icons.svg('personalize', '', 16), el('span', { text: 'Personalize · تخصيص' }), el('span', { class: 'x', onclick: () => w.remove(), text: '×' })]),
        el('div', { class: 'wb' }, [
          el('div', { class: 'pz-label', text: 'Background · خلفية سطح المكتب' }),
          el('button', { class: 'ex-btn', style: { alignSelf: 'flex-start', border: '1.4px solid #C7B48E' }, onclick: () => { state.personalize.bgBrowsed = true; bgRow.style.display = 'flex'; flash('Browse Photos — اختر صورة'); check(); }, title: 'Browse Photos' }, [W.icons.svg('photos', '', 18), el('span', { text: 'Browse Photos · تصفّح الصور' })]),
          bgRow,
          el('div', { class: 'pz-label', text: 'Theme · السمة' }),
          el('div', { class: 'pz-row' }, [
            themeOpt('الافتراضي', '', 'linear-gradient(160deg,#2b6cb0,#14375f)'),
            themeOpt('رملي', 'theme-sand', 'linear-gradient(160deg,#C9A05C,#6B421F)'),
            themeOpt('فيروزي', 'theme-teal', 'linear-gradient(160deg,#3B9188,#123f3a)'),
          ]),
        ]),
      ]);
      bgRow.style.display = 'none';
      pics.forEach(([nm, cls], i) => {
        const swBg = cls === 'bg-fort' ? 'linear-gradient(160deg,#E7A063,#4a2a12)' : 'linear-gradient(160deg,#5FB8AE,#123f3a)';

        o.onclick = () => {

        bgRow.appendChild(o);
      });
      win.appendChild(w); placeWindow(w);
      function themeOpt(nm, cls, sw) {
        const o = el('div', { class: 'pz-opt', onclick: () => {
          state.personalize.theme = cls ? (' ' + cls) : '';
          const bg = (desk.className.match(/bg-\w+/) || [''])[0];
          desk.className = 'win-desktop ' + (bg ? bg + ' ' : '') + cls;
          w.querySelectorAll('.pz-row')[1].querySelectorAll('.pz-opt').forEach(x => x.classList.remove('on')); o.classList.add('on');
          flash('Theme: ' + nm); mark('theme'); check();
        } }, [el('div', { class: 'sw', style: { background: sw } }), el('div', { class: 'nm', text: nm })]);
        return o;
      }
    }

    function autoClose(f) { const off = W.scd.listen(window, 'pointerdown', (e) => { if (!f.contains(e.target)) { f.remove(); off(); } }, true); }
    function flash(m) { W.lablesson.feedback(host, 'ok', m); }
    function mark(id) { if (!state.taskbar[id]) { state.taskbar[id] = true; check(); } }

    function check() {
      const doneMap = {
        time: state.taskbar.time, internet: state.taskbar.internet, language: state.taskbar.language,
        explorer: state.taskbar.explorer, start: state.taskbar.start,
        background: state.personalize.bgBrowsed && state.personalize.bgChosen,
        theme: !!state.personalize.theme || state.taskbar.theme,
      };
      const model = GOALS.map(g => ({ label: g.label, done: !!doneMap[g.id] }));
      tp.setSteps(model, model.findIndex(m => !m.done));
      const all = model.every(m => m.done);
      tp.setActions([
        { label: 'تلميح', onClick: () => W.lablesson.feedback(host, 'hint', 'استخدم شريط المهام (Time/Internet/Language)، وافتح File Explorer وStart، ثم Personalize لتغيير Background وTheme.') },

      : 'استكشف سطح المكتب ونفّذ عناصر المراجعة بأي ترتيب: Time & Date, Internet, Language, File Explorer, Start, Background (Browse Photos → Choose), Theme.',

    W.activeLesson = {
      id: lesson.id,
      reveal: () => W.lablesson.feedback(host, 'hint', 'المطلوب: Time & Date, Internet, Language, File Explorer, Start, Background (Browse Photos→Choose), Theme.'),
      retryStage: () => W.scene.reload(), resetLesson: () => W.scene.reload(),

/* ==== lessons/u1-programs.js — برامج أخرى: iOS vs Android file management (CP2R) ==== */
(function (W) {
  const { el } = W.util;
  const lesson = { id: 'u1-programs', code: '⊞', title: 'برامج أخرى', titleEn: 'Other Programs', unit: 1 };

  const IOS_APPS = [
    { key: 'files', ic: 'filesapp', bg: '#4a90d9', cap: 'Files' },
    { key: 'photos', ic: 'photos', bg: '#f0c14b', cap: 'Photos' },
    { key: 'settings', ic: 'settings', bg: '#8a8f98', cap: 'Settings' },
    { key: 'appstore', ic: 'appstore', bg: '#2b7de9', cap: 'App Store' },
    { key: 'camera', ic: 'camera', bg: '#3a3f46', cap: 'Camera' },
    { key: 'notes', ic: 'doc', bg: '#f5d451', cap: 'Notes' },
  ];
  const ANDROID_FS = [
    { name: 'الصور', type: 'folder', kind: 'folder' },
    { name: 'التنزيلات', type: 'folder', kind: 'folder' },
    { name: 'نشيد بلادي.mp3', type: 'file', kind: 'audio', meta: 'ملف صوتي' },
    { name: 'صورة الحصن.jpg', type: 'file', kind: 'image', meta: 'ملف صورة' },
  ];

  W.lessons.register('u1-programs', {
    mount(ctx) {
      W.store.lessonOpened(lesson.id);
      W.lablesson.chooseMode(ctx, lesson, { guided: () => run(ctx, 'guided'), independent: () => run(ctx, 'independent') });
    },
    unmount() { W.activeLesson = null; },
  });

  function run(ctx, mode) {
    const host = document.querySelector('.lab-env');
    const guided = mode === 'guided';
    const tp = W.lablesson.taskPanel(host, { stage: guided ? 'تدريب موجّه · Guided' : 'أنشئ بنفسك · Independent', mode: 'برامج أخرى — iOS / Android' });

    const state = { iosSearch: false, iosFound: false, androidFilesOpen: false, distinguished: false, foundApp: null, lastQuery: '' };
    const GOALS = [
      { id: 'iosSearch', label: guided ? 'iOS: ابحث عن تطبيق «Files» في Search Bar' : 'iOS: استخدم Search Bar للبحث عن تطبيق' },
      { id: 'iosFound', label: guided ? 'iOS: حدّد تطبيق «Files»' : 'iOS: حدّد التطبيق الذي وجدته' },
      { id: 'androidFilesOpen', label: 'Android: افتح تطبيق Files' },
      { id: 'distinguished', label: 'Android: ميّز File عن Folder' },
    ];

    const stage = el('div', { class: 'mobis' });
    // ---- iOS phone ----
    const iosScr = el('div', { class: 'scr' });
    const iosResult = el('div', {});
    const searchInput = el('input', { placeholder: 'Search · بحث', oninput: () => { const q = searchInput.value.trim(); state.lastQuery = q; if (q.length > 0) state.iosSearch = true; filterApps(q); check(); } });
    const iosSearchBar = el('div', { class: 'ios-searchbar' }, [W.icons.svg('search', '', 16), searchInput]);
    const iosGrid = el('div', { class: 'ios-grid' });
    const iosIcons = {};
    // an app can only be "selected" if it currently appears in the filtered search results
    function currentResultKeys() {
      const q = state.lastQuery;
      if (!q) return [];
      return IOS_APPS.filter(a => a.cap.toLowerCase().includes(q.toLowerCase())).map(a => a.key);
    }
    function selectApp(a) {
      const inResults = currentResultKeys().includes(a.key);
      if (guided) {
        if (a.key === 'files') {
          state.iosFound = true; state.foundApp = a.cap; highlight(a); flash('iOS: فتحت تطبيق «Files».'); check();
        } else {
          flash('وجدت تطبيق «' + a.cap + '»، لكن المطلوب في هذه الخطوة هو «Files».');
        }
        return;
      }
      // independent: accept any real app that matches the query AND appears in the results
      if (!inResults) { flash('ابحث أولًا في Search Bar، ثم اختر تطبيقًا من نتائج البحث.'); return; }
      state.iosSearch = true; state.iosFound = true; state.foundApp = a.cap; highlight(a);
      flash('iOS: حدّدت تطبيق «' + a.cap + '» من نتائج البحث.'); check();
    }
    function highlight(a) { Object.values(iosIcons).forEach(n => n.classList.remove('found')); if (iosIcons[a.key]) iosIcons[a.key].classList.add('found'); }
    IOS_APPS.forEach(a => {
      const ic = el('div', { class: 'app-ic', onclick: () => selectApp(a) }, [
        el('div', { class: 'sq', style: { background: a.bg } }, W.icons.svg(a.ic, '', 28)), el('div', { class: 'cap', text: a.cap }),
      ]);
      iosIcons[a.key] = ic; iosGrid.appendChild(ic);
    });
    function filterApps(q) {
      iosResult.innerHTML = '';
      if (!q) { IOS_APPS.forEach(a => iosIcons[a.key].style.display = ''); return; }

      guided ? 'iOS: search for and select Files. Android: open Files, tell File from Folder.' : 'iOS: search and pick any app from results. Android: Files → File vs Folder.');
    check();

    function finish() { stage.remove(); W.lablesson.completeCard(ctx, lesson, host, mode, { title: 'قارنت أنظمة إدارة الملفات!', body: 'في iOS بحثت بـ Search Bar ووجدت التطبيق، وفي Android فتحت Files وميّزت File عن Folder. لكل نظام طريقته في تنظيم الملفات والمجلدات.' }); }

    W.activeLesson = {
      id: lesson.id,
      reveal: () => W.lablesson.feedback(host, 'hint', 'iOS: Search Bar → Files. Android: Files → File vs Folder.'),
      retryStage: () => W.scene.reload(), resetLesson: () => W.scene.reload(),
    };

    const PLACEHOLDER = 'اكتب هنا…';
    function docLines() {
      // meaningful non-empty visible lines, normalized
      const raw = (sim.doc.innerText || '').replace(/\u200f|\u200e/g, '');
      return raw.split(/\n+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s.length > 0 && s !== PLACEHOLDER);
    }
    function visibleLen(s) { return (s || '').replace(/[\u064B-\u065F\u0670]/g, '').replace(/\s+/g, '').length; } // strip diacritics + spaces
    function hasTitle() { const L = docLines(); return L.length >= 1 && visibleLen(L[0]) >= 3; }
    function hasParagraph() { const L = docLines(); if (L.length < 2) return false; const para = L.slice(1).join(' '); return visibleLen(para) >= 15; }

    const reqs = [
      { label: 'فتح المستند عبر File › Open › Browse', ok: () => sim.openedViaBrowse() || sim.openedFile() === 'إعادة التدوير.docx' },
      { label: 'تغيير نوع الخط أو حجمه أو لونه', ok: () => sim.hasFontFamily() || sim.hasFontSize() || sim.hasFontColor() },

      { label: 'تطبيق المائل أو التسطير (Italic/Underline)', ok: () => sim.hasItalic() || sim.hasUnderline() },
      { label: 'تمييز نص بلون (Text Highlight Color)', ok: () => sim.hasHighlight() },
      { label: 'ضبط المحاذاة (Alignment)', ok: () => sim.anyAlignmentSet() },
      { label: 'حفظ باسم مناسب (Save)', ok: () => sim.isSaved() && (sim.savedName() || '').length >= 3 },
    ];
    function refresh() {
      const model = reqs.map(r => ({ label: r.label, done: r.ok() }));
      tp.setSteps(model, -1);
      const allDone = model.every(m => m.done);
      // calm hint when the title is written but the paragraph is not yet

      tp.setActions([
        { label: 'تلميح', onClick: () => { W.audio.click(); W.wordlesson.feedback(studio, 'hint', 'اكتب عنوانًا في السطر الأول، ثم فقرة تحته. حدّد النص قبل كل تنسيق، ثم احفظ باسم يصف المحتوى.'); } },
        allDone ? { label: 'إنهاء ✓', primary: true, onClick: () => complete(ctx, lesson, studio, 'independent') } : { label: 'إعادة', onClick: () => { W.audio.click(); } },
      ]);
      if (allDone) W.wordlesson.feedback(studio, 'ok', 'أكملت كل المتطلبات!');
    }
    refresh();
    exposeTeacher(lesson, sim, null, reqs);
  }

  /* ---------- shared ---------- */
  function complete(ctx, lesson, studio, mode) {
    W.store.stepDone(lesson.id, 'done-' + mode);
    W.store.markMastered(lesson.id, ['done-' + mode]);
    W.audio.chime();
    const card = el('div', { class: 'wdone' }, el('div', { class: 'in' }, [
      el('div', { class: 'mk', text: '✦' }),

      el('p', { text: 'كتبت، وحدّدت، ونسّقت النص (غامق/مائل/تسطير/تمييز)، وضبطت المحاذاة، وحفظت باسم واضح.' }),
      el('div', { class: 'row' }, [

        el('button', { class: 'tp-btn', style: { maxWidth: '130px' }, text: 'إعادة الدرس', onclick: () => { W.audio.click(); ctx.go('lesson', { id: lesson.id }); } }),
      ]),
    ]));
    studio.appendChild(card);
  }

  function exposeTeacher(lesson, sim, runner, steps) {
    W.activeLesson = {
      id: lesson.id,
      stages: (steps || []).map((s, i) => ({ id: 'g' + i, rail: s.label })),

        if (!runner) { W.wordlesson.feedback(document.querySelector('.studio'), 'hint', 'المطلوب: نص منسّق (غامق/مائل/تسطير/تمييز) مع محاذاة وحفظ.'); return; }
      },

    };
  }
})(window.MNARA);

  function complete(ctx, lesson, studio, mode) {
    W.store.stepDone(lesson.id, 'done-' + mode); W.store.markMastered(lesson.id, ['done-' + mode]); W.audio.chime();

      id: lesson.id, stages: (steps || []).map((s, i) => ({ id: 'g' + i, rail: s.label })),

  const IDEA_POOL = [

  function planning(ctx, lesson, next) {
    const studio = document.querySelector('.studio');

      { label: 'احفظ باسمك', instr: 'افتح «File» ‹ «Save» واحفظ باسم يحوي اسمك (مثال: مقالة الماء - اسمك).', instrEn: 'Save with your name.', hint: 'تبويب File.', onEnter: () => sim.setTab('file'), target: () => sim.tool('save'), validate: () => sim.isSaved() && (sim.savedName() || '').length >= 4, ok: 'حُفظ المشروع!' },

  }

  function independent(ctx, lesson) {
    const studio = document.querySelector('.studio'); const sim = makeSim(studio, () => refresh());

    const tp = W.wordlesson.taskPanel(studio, { stage: 'أنشئ بنفسك · Independent', mode: '2.7 المشروع' });

      { label: 'صورة مع Wrap Text', ok: () => sim.imageCount() >= 1 && sim.imageWrap() && sim.imageWrap() !== 'inline' },
      { label: 'حفظ باسم يحوي اسمك', ok: () => sim.isSaved() && (sim.savedName() || '').length >= 4 },

      const model = reqs.map(r => ({ label: r.label, done: r.ok() })); tp.setSteps(model, -1);
      const all = model.every(m => m.done);

  }

  function finish(ctx, lesson, studio, mode) {

  }

        O().feedback(h, 'ok', '✓ اكتملت مراجعة الاتصال — اضغط Start في شريط المهام لفتح Google Chrome.');
        desk.enableStart(true); desk.pulseStart(true);
        connPanel.classList.add('collapsing');
        W.scd.after(() => { connPanel.remove(); }, 450);
      }
    }

    // ---------- PHASE 2 — practical browser revision ----------
    desk.onStart(() => {
      if (!(state.wired && state.wireless && state.comm)) { O().feedback(h, 'hint', 'أكمل مراجعة الاتصال أولًا (السلكي واللاسلكي ووسيلة التواصل).'); return; }
      state.start = true; desk.pulseStart(false); check();
      desk.openStartMenu([
        { ic: 'globe', label: 'Google Chrome', on: () => { desk.closeStartMenu(); openChrome(); } },
        { ic: 'settings', label: 'الإعدادات · Settings', on: () => { O().feedback(h, 'hint', 'المطلوب فتح Google Chrome.'); } },
      ]);
    });

    let browserApi = null;
    function openChrome() {
      state.chrome = true; check();
      if (browserApi) return;
      const chromeHost = el('div', { class: 'mini-chromehost' });
      desk.stageArea.appendChild(chromeHost);
      const PAGES = {
        'portal.edu.om': { title: 'البوابة التعليمية', render: (body) => body.appendChild(el('div', { class: 'art-page' }, [el('h1', { text: 'البوابة التعليمية — سلطنة عُمان' }), el('p', { text: 'بوابة تعليمية لطلاب سلطنة عُمان ومعلميها.' })])) },
      };
      const bw = O().buildBrowser(chromeHost, {
        homeTitle: 'Google', home: (body, api) => renderGoogle(body, api),
        resolve: (url) => { if (url.startsWith('search:')) return { title: 'نتائج البحث · Search Results', render: (b) => renderResults(b, url.slice(7)) }; const k = url.replace(/^https?:\/\//, ''); if (PAGES[k]) return PAGES[k]; return null; },
        onEvent: (k) => { if (k === 'address') state.addr = true; check(); },
      });

    }
    function renderGoogle(body, api) {

        el('div', { class: 'se-box' }, [W.icons.svg('search', '', 18), input, el('button', { class: 'se-go', text: 'بحث', onclick: go })]),
        el('div', { class: 'se-hint', text: 'اكتب «البوابة التعليمية» في مربع البحث واضغط Enter.' }),

    }
    function renderResults(body, q) {
      state.results = true; check();
      body.appendChild(el('div', { style: { padding: '16px 20px' } }, [el('div', { class: 'se-results' }, [
        el('div', { style: { color: '#6b8a84', fontSize: '12.5px' }, text: 'نتائج البحث عن: ' + q }),
        el('div', { class: 'se-result relevant', onclick: () => { browserApi.navigate('https://portal.edu.om'); } }, [el('div', { class: 'u', text: 'https://portal.edu.om' }), el('div', { class: 't', text: 'البوابة التعليمية — سلطنة عُمان' }), el('div', { class: 'd', text: 'بوابة تعليمية لطلاب سلطنة عُمان ومعلميها.' })]),
      ])]));
    }

    const GOALS = [
      { id: 'wired', label: 'حدّد الاتصال السلكي (Wired)' },
      { id: 'wireless', label: 'حدّد الاتصال اللاسلكي (Wireless)' },
      { id: 'comm', label: 'حدّد وسيلة تواصل عبر الإنترنت' },
      { id: 'start', label: 'افتح Start من شريط المهام' },
      { id: 'chrome', label: 'افتح Google Chrome' },
      { id: 'addr', label: 'استخدم Address Bar واكتب عنوان موقع' },
      { id: 'google', label: 'افتح Google وابحث «البوابة التعليمية»' },
      { id: 'results', label: 'اعرض نتائج البحث (Search Results)' },
    ];
    function check() {
      const model = GOALS.map(g => ({ label: g.label, done: !!state[g.id] }));
      if (state.wired && state.wireless && state.comm) model.splice(3, 0, { label: '✓ مراجعة الاتصال مكتملة', done: true });
      panel.setSteps(model, model.findIndex(g => !g.done));
      const all = GOALS.every(g => state[g.id]);
      panel.setActions([
        { label: 'تلميح', onClick: () => O().feedback(h, 'hint', 'أكمل مراجعة الاتصال، ثم اضغط Start في شريط المهام لفتح Google Chrome، اكتب عنوانًا في Address Bar، وابحث في Google عن «البوابة التعليمية» واعرض النتائج.') },
        all ? { label: 'إنهاء ✓', primary: true, onClick: () => O().completeCard(ctx, lesson, h, 'recall', { title: 'أنت جاهز للوحدة الثالثة!', body: 'راجعت عمليًا: الاتصال السلكي واللاسلكي ووسيلة التواصل، ثم فتحت Start و Google Chrome، واستخدمت Address Bar، وبحثت في Google عن «البوابة التعليمية»، وعرضت نتائج البحث.' }) } : { label: 'إعادة الضبط', onClick: () => W.scene.reload() },
      ]);
      if (all) O().feedback(h, 'ok', 'أتممت المراجعة العملية!');
    }
    panel.setInstr('أكمِلْ مراحلَ المراجعةِ الثلاثَ. اتبعِ القائمةَ أسفلَه.', 'Phase 1: connections. Phase 2: Start -> Chrome -> Address Bar -> Google -> Results.');
    check();
    W.activeLesson = { id: lesson.id, reveal: () => O().feedback(h, 'hint', 'المرحلة 1: الاتصالات. المرحلة 2: Start → Chrome → Address Bar → Google → البوابة التعليمية → Results.'), retryStage: () => W.scene.reload(), resetLesson: () => W.scene.reload() };
  }
  /* ---------- برامج أخرى — Firefox / Edge / Bing ---------- */
  const PROGRAMS = { id: 'u3-programs', code: '⊞', title: 'برامج أخرى', titleEn: 'Other Programs', unit: 3, items: [
    { ic: 'firefox', ar: 'Mozilla Firefox', en: 'Firefox', type: 'Browser · متصفّح', use: 'متصفّح لفتح المواقع، له Address Bar وأزرار Back/Forward مثل بقية المتصفّحات.' },
    { ic: 'edge', ar: 'Microsoft Edge', en: 'Edge', type: 'Browser · متصفّح', use: 'متصفّح من Microsoft، يشبه غيره في شريط العنوان والتنقّل بين الصفحات.' },
    { ic: 'bing', ar: 'Bing', en: 'Bing', type: 'Search Engine · محرّك بحث', use: 'محرّك بحث نكتب فيه كلمات البحث لنجد نتائج، ويُفتح داخل المتصفّح.' },
  ] };
  W.lessons.register('u3-programs', { mount(ctx) { W.store.lessonOpened(PROGRAMS.id); runPrograms(ctx); }, unmount() { W.activeLesson = null; } });
  function runPrograms(ctx) {
    const lesson = PROGRAMS; const h = host(ctx, lesson); const panel = tp(h, 'إثراء · برامج أخرى', 'الوحدة الثالثة');
    panel.setInstr('استكشف المتصفّحات ومحرّك البحث. اضغط كل بطاقة لتعرف نوعها واستخدامها، ثم ميّز المتصفّح عن محرّك البحث.', 'Explore Firefox, Edge, Bing.');
    const w = stageWrap(h); const seen = {};
    const grid = el('div', { style: { display: 'flex', gap: '14px', justifyContent: 'center', flexWrap: 'wrap', marginTop: '10px' } });
    lesson.items.forEach((a, i) => {
      const card = el('div', { class: 'scn-card progcard', style: { width: '252px', cursor: 'pointer', textAlign: 'center' }, tabindex: '0', role: 'button', onclick: () => {
        if (!seen[i]) { seen[i] = true; card.style.borderColor = 'var(--ok)'; card.appendChild(el('div', { class: 'prog-use', text: a.use })); W.audio.ok(); O().feedback(h, 'ok', a.ar + ' — ' + a.type); update(); }
      }, onkeydown: e => { if (e.key === 'Enter') card.click(); } }, [
        el('div', { class: 'prog-illus big' }, [W.icons.svg(a.ic, '', 92)]),
        el('div', { class: 'prog-nm', text: a.ar }),
        el('div', { class: 'prog-en', text: a.en }),
        el('div', { class: 'prog-kind' + (a.type.indexOf('Search') >= 0 ? ' se' : ' br') }, [
          el('span', { text: a.type.split(' · ')[1] || a.type }),
          el('span', { class: 'en', text: a.type.split(' · ')[0] }),
        ]),
      ]);
      grid.appendChild(card);
    });
    w.appendChild(grid);
    // distinguish task
    let distinguished = false;
    const q = el('div', { class: 'scn-card', style: { marginTop: '6px' } }, [
      el('div', { class: 'scn-q', text: 'أيّ ممّا يلي محرّك بحث (Search Engine) وليس متصفّحًا (Browser)؟' }),

        btn('Firefox', false), btn('Bing', true), btn('Edge', false),
      ]),
    ]);
    function btn(label, correct) {
      return el('button', { class: 'scn-choice', style: { width: 'auto' }, onclick: (e) => {
        if (distinguished) return;
        if (correct) { distinguished = true; e.currentTarget.classList.add('correct'); W.audio.ok(); O().feedback(h, 'ok', 'صحيح: Bing محرّك بحث، وFirefox وEdge متصفّحان.'); update(); }
        else { e.currentTarget.classList.add('wrong'); W.audio.no(); O().feedback(h, 'no', label + ' متصفّح (Browser)، وليس محرّك بحث.'); }
      } }, [document.createTextNode(label)]);
    }
    w.appendChild(q);
    function update() {
      const steps = lesson.items.map((x, j) => ({ label: x.ar, done: !!seen[j] })); steps.push({ label: 'ميّز محرّك البحث عن المتصفّح', done: distinguished });
      panel.setSteps(steps, -1);
      if (Object.keys(seen).length === lesson.items.length && distinguished) W.scd.after(() => O().completeCard(ctx, lesson, h, 'programs', { title: 'تعرّفت على متصفّحات ومحرّك بحث!', body: 'Firefox وEdge متصفّحان (Browser) لهما Address Bar وأزرار تنقّل، وBing محرّك بحث (Search Engine) نكتب فيه كلمات البحث داخل المتصفّح.' }), 700);
    }
    update();
    panel.setActions([{ label: 'تلميح', onClick: () => O().feedback(h, 'hint', 'المتصفّح يفتح المواقع، ومحرّك البحث يجد المعلومات داخل المتصفّح.') }]);
    W.activeLesson = { id: lesson.id, reveal: () => O().feedback(h, 'hint', 'استكشف الثلاثة ثم ميّز Bing كمحرّك بحث.'), retryStage: () => W.scene.reload(), resetLesson: () => W.scene.reload() };
  }

  /* ---------- حالة المنارة — Unit 3 self-check ---------- */
  const STATUS = { id: 'u3-status', code: '✦', title: 'في الختام — مخرجات التعلم والمصطلحات', titleEn: 'Beacon Status', unit: 3, get checks() { return W.wrapup.outcomesOf(3); } };
  W.lessons.register('u3-status', { mount(ctx) { W.store.lessonOpened(STATUS.id); runStatus(ctx); }, unmount() { W.activeLesson = null; } });
  function runStatus(ctx) {
    const lesson = STATUS; const h = host(ctx, lesson); const panel = tp(h, 'في الختام · Wrap-up', 'الوحدة الثالثة');
    panel.setInstr('مخرجات التعلم — الوحدة الثالثة «عالمي المتصل»: أكّد كل مخرج أتقنته، ثم راجع المصطلحات.', 'Learning outcomes & terminology.');
    const w = stageWrap(h); const okd = {};
    const col = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '9px' } });
    lesson.checks.forEach((c, i) => {
      const b = el('button', { class: 'scn-choice', onclick: () => { if (okd[i]) return; okd[i] = true; b.classList.add('correct'); b.prepend(el('span', { text: '✓ ' })); W.audio.ok(); O().feedback(h, 'ok', 'أحسنت!'); panel.setSteps(lesson.checks.map((x, j) => ({ label: x.slice(0, 26) + '…', done: !!okd[j] })), -1); if (Object.keys(okd).length === lesson.checks.length) W.scd.after(() => O().completeCard(ctx, lesson, h, 'status', { title: 'أضأت منارة الوحدة الثالثة!', body: 'أتقنت الأمان والبحث والأخلاقيات والعثور على المعلومات وويكيبيديا. أكملت رحلة منارة عُمان الرقمية!' }), 800); } }, [document.createTextNode(c)]);
      col.appendChild(b);
    });
    w.appendChild(col);
    w.appendChild(W.wrapup.termsPanel(3));
    panel.setSteps(lesson.checks.map(x => ({ label: x.slice(0, 26) + '…', done: false })), 0);
    panel.setActions([{ label: 'تلميح', onClick: () => O().feedback(h, 'hint', 'أكّد كل مهارة أتقنتها.') }]);
    W.activeLesson = { id: lesson.id, reveal: () => O().feedback(h, 'hint', 'أكّد المهارات.'), retryStage: () => W.scene.reload(), resetLesson: () => W.scene.reload() };
  }
})(window.MNARA);

    const panel = O().taskPanel(host, { stage: guided ? 'تدريب موجّه · Guided' : 'أنشئ بنفسك · Independent', mode: '3.2 البحث عن المعلومات' });

    // real Windows-style desktop with a bottom taskbar; Start opens a menu anchored above the Start icon
    const desk = O().buildMiniDesktop(stage);
    desk.enableStart(true); desk.pulseStart(true);
    let launched = false, browser = null;
    desk.onStart(() => {
      state.usedStart = true; desk.pulseStart(false); check();
      desk.openStartMenu([
        { ic: 'globe', label: 'Google Chrome', on: () => { desk.closeStartMenu(); state.usedChrome = true; launchChrome(); check(); } },
        { ic: 'settings', label: 'الإعدادات · Settings', on: () => { O().feedback(host, 'hint', 'المطلوب فتح Google Chrome.'); } },
      ]);
    });
    function launchChrome() {
      if (launched) return; launched = true;
      const chromeHost = el('div', { class: 'mini-chromehost' });
      desk.stageArea.appendChild(chromeHost);
      browser = O().buildBrowser(chromeHost, {
        homeTitle: 'محرّك البحث · Search Engine',
        home: (body, api) => renderSearch(body, api),
        resolve: (url) => {
          if (url.startsWith('search:')) return { title: 'نتائج البحث · Search Results', render: (body, api) => renderResults(body, api, url.slice(7)) };
          const key = url.replace(/^https?:\/\//, '');
          if (PAGES[key]) return { title: PAGES[key].title, render: (body) => renderPage(body, key) };
          return null;
        },
        onEvent: (k) => { if (k === 'back') state.usedBack = true; if (k === 'forward') state.usedForward = true; if (k === 'newtab') state.openedNewTab = true; if (k === 'closetab') state.closedNewTab = true; if (k === 'address') state.usedAddressBar = true; check(); },
      });
      chromeHost.appendChild(browser.root);
    }

    function renderSearch(body, api) {
      const input = el('input', { placeholder: 'اكتب كلمات البحث · Search keywords' });
      const go = () => { const q = input.value.trim(); if (!q) return; state.searched = true; api.navigate('search:' + q); check(); };
      const page = el('div', { class: 'se-page' }, [
        el('div', { class: 'se-logo' }, [el('span', { text: 'مَنارة' }), el('span', { text: 'بحث' })]),

      const ql = q.toLowerCase();
      const hits = Object.keys(PAGES).map(k => ({ k, p: PAGES[k], score: PAGES[k].kw.filter(w => ql.includes(w) || w.includes(ql.split(' ')[0] || '')).length }))
        .sort((a, b) => (b.p.relevant - a.p.relevant) || (b.score - a.score));
      const wrap = el('div', { class: 'se-results' });
      const pages = Math.max(1, Math.min(9, hits.length));

          el('div', { class: 'u', text: 'https://' + h.k }),
          el('div', { class: 't', text: h.p.title }),
          el('div', { class: 'd', text: h.p.body[0] }),
        ]));
      });
      body.appendChild(el('div', { style: { padding: '16px 20px' } }, [wrap]));
      state.inspected = true; check();
    }
    function renderPage(body, key) {
      const p = PAGES[key];
      body.appendChild(el('div', { class: 'art-page' }, [
        el('h1', { text: p.heading }),
        ...p.body.map(t => el('p', { text: t })),
        el('p', { style: { color: '#6b8a84', fontSize: '12px' }, text: 'استخدم زر «Back · رجوع» للعودة إلى نتائج البحث.' }),
      ]));
    }

    const GOALS = [
      { id: 'usedStart', label: 'افتح Start' },
      { id: 'usedChrome', label: 'افتح Google Chrome' },
      { id: 'searched', label: 'اكتب كلمات البحث واضغط بحث (Search)' },
      { id: 'inspected', label: 'تفحّص نتائج البحث (Search Results)' },

      { id: 'openedNewTab', label: 'افتح New Tab' },
      { id: 'closedNewTab', label: 'أغلق علامة التبويب (Close New Tab)' },
    ];
    function check() {
      panel.setSteps(GOALS.map(g => ({ label: g.label, done: !!state[g.id] })), GOALS.findIndex(g => !state[g.id]));

        if (ng === 'usedStart') return q('.mini-start,.taskbar-start,.mini-taskbar button');

        if (ng === 'searched') return q('.se-box input,.se-go');

        if (ng === 'usedAddressBar') return q('.brw-addr');
        if (ng === 'openedNewTab' || ng === 'closedNewTab') return q('.brw-newtab,.brw-tabs');
        return null;
      }, 'افتحِ المتصفِّحَ أوَّلًا لتظهرَ الأزرارُ.');
      const all = GOALS.every(g => state[g.id]);
      panel.setActions([
        { label: 'تلميح', onClick: () => O().feedback(host, 'hint', 'افتحْ Start ثمَّ Google Chrome، اكتبْ «المتاحف في عُمان» واضغطْ بحثٍ، افتحْ ثلاثَ نتائجَ مناسبةٍ، استخدمْ Back و Forward، اكتبْ sq-mosque.om في Address Bar، وافتحْ New Tab ثمَّ أغلقْها.') },
        all ? { label: 'إنهاء ✓', primary: true, onClick: () => O().completeCard(ctx, lesson, host, mode, { title: 'أتقنت مهارات المتصفّح!', body: 'استخدمت Start وGoogle Chrome وAddress Bar وSearch Engine وكلمات البحث ونتائج البحث، وBack وForward، وفتحت New Tab وأغلقتها.' }) } : { label: 'إعادة الضبط', onClick: () => W.scene.reload() },
      ]);
